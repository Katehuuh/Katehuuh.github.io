# Wispbyte keep-alive. Wispbyte archives a server after 30 days of account
# inactivity; any authenticated page view counts as activity, so this loads
# /client/servers twice a week and stamps the result into time.txt.
#
#   This file must live on the DEFAULT branch: GitHub registers `schedule:`
#   and `workflow_dispatch:` only from there, so a workflow sitting only on
#   the wispbyte-login branch would never fire and could not be dispatched.
#   Everything else (keepalive.py, README, time.txt) lives on that branch.
#
#   Login mode uses camoufox (anti-detect Firefox) + NopeCHA (CAPTCHA
#   solver addon) to pass Cloudflare Turnstile automatically. Cookie
#   mode replays a session captured from a real browser. See the branch
#   README for the format.
#
name: wispbyte-login

on:
  schedule:
    - cron: '16 18 * * 1,4' # Mon+Thu 18:16 UTC. The session is a 15-day
                            # rolling express-session, so <=3 missed runs
                            # are survivable; weekly would tolerate only 1.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wispbyte-login
  cancel-in-progress: false

jobs:
  keepalive:
    # Secrets never transfer to a fork, so without this guard every fork
    # would run the job and fail twice a week. Skipped before a runner is
    # allocated. Change it if you fork this deliberately.
    if: github.repository == 'Katehuuh/Katehuuh.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout wispbyte-login branch
        uses: actions/checkout@v5
        with:
          ref: wispbyte-login

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install browser automation
        timeout-minutes: 8
        run: |
          pip install --quiet playwright "camoufox[geoip]"
          playwright install --with-deps chromium
          python -m camoufox fetch

      - name: Install NopeCHA addon
        run: |
          RELEASE_URL=$(curl -sL https://api.github.com/repos/NopeCHALLC/nopecha-extension/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if 'firefox_automation' in a['name']))")
          curl -sL -o nopecha.zip "$RELEASE_URL"
          mkdir -p nopecha-ext
          unzip -qo nopecha.zip -d nopecha-ext
          echo "NOPECHA_EXT_PATH=$(pwd)/nopecha-ext" >> "$GITHUB_ENV"

      # continue-on-error so the stamp below always runs; the last step is
      # what turns the run red. keepalive.py masks every value in the secret
      # before use and never prints an account identifier.
      - name: Touch each session
        id: keepalive
        continue-on-error: true
        timeout-minutes: 8
        env:
          WISPBYTE_MODE: ${{ vars.WISPBYTE_MODE || 'cookie' }}
          LOGIN_ACCOUNTS: ${{ secrets.LOGIN_ACCOUNTS }}
        run: xvfb-run python keepalive.py

      - name: Stamp time.txt on wispbyte-login
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          stamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          if [ "${{ steps.keepalive.outcome }}" = "success" ]; then
            result=success
          else
            result=failure
          fi

          {
            echo "$stamp"
            echo "login: $result"
          } > time.txt
          git add time.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update: $stamp (login: $result)"
            git push origin HEAD:wispbyte-login
          fi

      - name: Fail the run if a session is dead
        if: steps.keepalive.outcome != 'success'
        run: |
          echo "::error::Wispbyte session invalid - check LOGIN_ACCOUNTS (login mode) or recapture the cookie."
          exit 1
