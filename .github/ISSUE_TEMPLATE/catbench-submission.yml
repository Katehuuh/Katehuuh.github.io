# The `label:` values here are parsed by .github/scripts/catbench_validate.py
# (H_MODEL / H_PYTHON / H_SVG). Rename a field here, rename it there too.
name: CatBench submission
description: Add a model's kitten to the CatBench grid
title: '[CatBench] '
labels: ['catbench-submission']
body:
  - type: markdown
    attributes:
      value: |
        Two prompts, one kitten with `max` reasoning:

        ```
        SVG    : Create a detailed SVG image of a cute kitten.
        Python : Write a Python script that draws a cute kitten using matplotlib.
        ```

  - type: input
    id: model
    attributes:
      label: Model name
      description: 'Becomes the filename. Letters, digits, spaces and . _ + - only.'
      placeholder: Claude-Opus-5
    validations:
      required: true

  - type: textarea
    id: python
    attributes:
      label: Python code
      description: >-
        Needs matplotlib. Runs once in a locked-down job to make the image, so
        only matplotlib, numpy and basic maths imports are allowed. File access,
        network and subprocesses get rejected.
      render: python
    validations:
      required: true

  - type: textarea
    id: svg
    attributes:
      label: SVG markup
      description: >-
        The full svg document. Scripts, event handlers and links to other sites
        get rejected.
      render: xml
    validations:
      required: true
