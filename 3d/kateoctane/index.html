<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kate's Octane · 3D showcase</title>
<meta name="description" content="A hand-painted Rocket League Octane, 3D printed. Spin it around, swap the paint, take it for a drive, or download the mesh.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist+Mono:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%2280%22%20font-size%3D%2280%22%3E%F0%9F%8F%8E%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #07070b;
  --bg-1: #0f0f15;
  --line: rgba(255, 255, 255, 0.09);
  --text: #f4f4f6;
  --text-2: rgba(244, 244, 246, 0.74);
  --text-3: rgba(244, 244, 246, 0.52);
  --accent: #ff6b35;
  --accent-soft: rgba(255, 107, 53, 0.16);
  --accent-line: rgba(255, 107, 53, 0.5);
  --serif: "Fraunces", ui-serif, Georgia, serif;
  --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
body.drive #stage canvas { cursor: default; }
#vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(3, 3, 8, 0.55) 100%); }

.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom)); }
.ui > * { pointer-events: auto; }
header { max-width: 440px; transition: opacity .4s, transform .4s; }
body.drive header { opacity: 0; transform: translateY(-8px); pointer-events: none; }
body.drive #spin, body.drive #reset, body.drive #dl, body.drive #dl-note { display: none; }
.kicker { font-family: var(--mono); font-size: .66rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 9px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 4.6vw, 2.7rem); letter-spacing: -.02em; line-height: 1.05; }
header p { margin-top: 9px; font-size: .88rem; line-height: 1.55; color: var(--text-2); max-width: 36ch; }

.dock { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card { background: rgba(14, 14, 20, 0.66); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
        border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 16px 44px -16px rgba(0, 0, 0, 0.75); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 3px 2px; }
.swatches { display: flex; gap: 7px; padding: 0 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); transition: transform .15s, box-shadow .15s; }
.sw:hover { transform: scale(1.1); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #0e0e14, 0 0 0 4px var(--text); }

.btn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--text-2); background: rgba(255,255,255,.07); border: 0;
       border-radius: 10px; padding: 9px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; line-height: 1;
       box-shadow: inset 0 0 0 1px var(--line); transition: color .15s, background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { color: var(--text); background: rgba(255,255,255,.12); }
.btn[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.btn.primary { color: #17090a; background: linear-gradient(180deg, #ff8a5c, var(--accent)); box-shadow: 0 8px 24px -10px rgba(255,107,53,.9); }
.btn.primary:hover { filter: brightness(1.08); color: #17090a; }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn:focus-visible, .sw:focus-visible, #stage canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-family: var(--mono); font-size: .62rem; color: var(--text-3); letter-spacing: .04em; padding: 0 6px 0 2px; }

footer { font-size: .66rem; color: var(--text-3); line-height: 1.5; margin-top: 10px; }
footer a { color: var(--text-2); text-underline-offset: 2px; }
footer a:hover { color: var(--text); }

/* drive mode */
#hud { position: fixed; left: 0; right: 0; bottom: max(72px, env(safe-area-inset-bottom)); display: none; justify-content: center; pointer-events: none; }
body.drive #hud { display: flex; }
#hud .box { padding: 10px 16px 12px; text-align: center; min-width: 240px; }
#hud .lbl { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
#hud .bar { height: 6px; border-radius: 9px; background: rgba(255,255,255,.1); overflow: hidden; }
#hud .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a2e, #ffd04a); border-radius: 9px; box-shadow: 0 0 14px rgba(255,150,40,.7); }
#hud .keys { margin-top: 8px; font-family: var(--mono); font-size: .6rem; color: var(--text-3); letter-spacing: .05em; }
#pad { position: fixed; inset: auto 0 max(70px, env(safe-area-inset-bottom)) 0; display: none; justify-content: space-between; padding: 0 18px; pointer-events: none; }
body.drive.touch #pad { display: flex; }
#pad .grp { display: grid; gap: 8px; pointer-events: auto; }
#pad .l { grid-template-columns: repeat(2, 64px); }
#pad .r { grid-template-columns: 64px 64px; }
#pad button { width: 64px; height: 64px; border-radius: 18px; border: 0; color: var(--text); font-size: 1.3rem; touch-action: none; user-select: none;
              background: rgba(14,14,20,.6); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--line); }
#pad button.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }

#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 9;
           background: radial-gradient(ellipse at 50% 40%, #1a1020, var(--bg) 70%); font-family: var(--mono); font-size: .72rem; letter-spacing: .08em;
           color: var(--text-2); text-align: center; padding: 24px; transition: opacity .6s .1s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .bar { width: min(220px, 60vw); height: 3px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#loading.error .bar { display: none; }
#loading.error { color: var(--text); letter-spacing: 0; }

@media (max-width: 620px) {
  .dock { flex-direction: column; align-items: stretch; }
  .tools { justify-content: center; }
  .sep { display: none; }
  header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

          Download STL
        </button>
        <span class="note" id="dl-note">lite mesh · for personal use</span>
      </div>
    </div>
    <footer>My classic Rocket League car craft by <a href="https://steamcommunity.com/profiles/76561198987346510/" target="_blank" rel="noopener noreferrer">zaku</a></footer>

</div>

<div id="hud"><div class="card box">

  }

  const canon = new Int32Array(nv), seen = new Map();
  for (let i = 0; i < nv; i++) {
    const k = (qx[i] * 8192 + qy[i]) * 8192 + qz[i];
    let id = seen.get(k); if (id === undefined) { id = seen.size; seen.set(k, id); } canon[i] = id;
  }
  return { px, py, pz, uu, vv, idx, canon, ncanon: seen.size };
}

/* ========================================================== creased normals ====
   Smooth where the surface is smooth, crisp on panel edges: each corner averages the
   (area-weighted) normals of the neighbouring faces that lie within CREASE degrees of its own. */
const CREASE = 38;
function buildMeshArrays(D, f0, f1) {
  const nf = f1 - f0, nc = nf * 3;
  const pos = new Float32Array(nc * 3), uv = new Float32Array(nc * 2), vid = new Int32Array(nc);
  const remap = new Map(); let nv = 0;
  for (let i = 0; i < nc; i++) {
    const g = D.idx[f0 * 3 + i];
    pos[i * 3] = D.px[g]; pos[i * 3 + 1] = D.py[g]; pos[i * 3 + 2] = D.pz[g];
    uv[i * 2] = D.uu[g]; uv[i * 2 + 1] = D.vv[g];
    const c = D.canon[g]; let l = remap.get(c); if (l === undefined) { l = nv++; remap.set(c, l); } vid[i] = l;
  }
  const fn = new Float32Array(nf * 3), area = new Float32Array(nf);
  for (let f = 0; f < nf; f++) {
    const a = f * 9;
    const ux = pos[a + 3] - pos[a], uy = pos[a + 4] - pos[a + 1], uz = pos[a + 5] - pos[a + 2];
    const vx = pos[a + 6] - pos[a], vy = pos[a + 7] - pos[a + 1], vz = pos[a + 8] - pos[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz); area[f] = len / 2;
    if (len > 1e-12) { fn[f * 3] = nx / len; fn[f * 3 + 1] = ny / len; fn[f * 3 + 2] = nz / len; }
  }
  const start = new Int32Array(nv + 1);
  for (let c = 0; c < nc; c++) start[vid[c] + 1]++;
  for (let v = 0; v < nv; v++) start[v + 1] += start[v];
  const fill = start.slice(0, nv), faces = new Int32Array(nc);
  for (let c = 0; c < nc; c++) faces[fill[vid[c]]++] = (c / 3) | 0;
  const cosT = Math.cos(CREASE * Math.PI / 180), nor = new Float32Array(nc * 3);
  for (let c = 0; c < nc; c++) {
    const f = (c / 3) | 0, v = vid[c];
    const fx = fn[f * 3], fy = fn[f * 3 + 1], fz = fn[f * 3 + 2];
    let sx = 0, sy = 0, sz = 0;
    for (let k = start[v]; k < start[v + 1]; k++) {
      const g = faces[k], gx = fn[g * 3], gy = fn[g * 3 + 1], gz = fn[g * 3 + 2];
      if (fx * gx + fy * gy + fz * gz >= cosT) { const w = area[g]; sx += gx * w; sy += gy * w; sz += gz * w; }
    }
    const len = Math.hypot(sx, sy, sz);
    if (len > 0) { nor[c * 3] = sx / len; nor[c * 3 + 1] = sy / len; nor[c * 3 + 2] = sz / len; } else nor[c * 3 + 1] = 1;
  }
  return { pos, nor, uv };
}

/* ==================================================================== liveries ==== */
const LIVERIES = [
  { name: 'Tiger pink', a: '#c81e66', b: '#df3a6e', ink: '#43bfe4', altA: '#9a4585', altB: '#7f4a8e', swirl: '#ee5aa6' },
  { name: 'Crimson',    a: '#a51a33', b: '#c9303e', ink: '#2f86a8', altA: '#8d2c4c', altB: '#6d2f5b', swirl: '#d93d78' },
  { name: 'Violet',     a: '#7c2bc0', b: '#c04aa8', ink: '#dcd6ee', altA: '#6a3aa0', altB: '#52348a', swirl: '#a77bff' },
  { name: 'Neon night', a: '#14141c', b: '#262638', ink: '#1ee6ff', altA: '#2a2a42', altB: '#1a1a2c', swirl: '#1ee6ff' },
];
const U = { uA: { value: new THREE.Color() }, uB: { value: new THREE.Color() }, uInk: { value: new THREE.Color() },
            uAltA: { value: new THREE.Color() }, uAltB: { value: new THREE.Color() }, uSwirl: { value: new THREE.Color() },
            uSilver: { value: new THREE.Color('#aab0ba').convertSRGBToLinear() } };
const KEYS = { a: 'uA', b: 'uB', ink: 'uInk', altA: 'uAltA', altB: 'uAltB', swirl: 'uSwirl' };
const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
let liveryTween = null;
function setLivery(i, instant) {
  const L = LIVERIES[i], from = {}, to = {};
  for (const k in KEYS) { from[k] = U[KEYS[k]].value.clone(); to[k] = lin(L[k]); }
  liveryTween = { t: instant ? 1 : 0, from, to };
  document.querySelectorAll('.sw').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
}
function stepLivery(dt) {
  if (!liveryTween) return;
  liveryTween.t = Math.min(1, liveryTween.t + dt / 0.45);
  const e = 1 - Math.pow(1 - liveryTween.t, 3);
  for (const k in KEYS) U[KEYS[k]].value.copy(liveryTween.from[k]).lerp(liveryTween.to[k], e);
  if (liveryTween.t >= 1) liveryTween = null;
}

/* ============================================================== car materials ====
   The mesh carries no colour, so the paint is built here: a baked mask texture (UV-mapped to the car)
   says where the stripes / marker scribbles / wheel swirl go, and the shader tints them from the livery.
   Red channel = ink mask, green channel = wheel swirl. */
const GLSL_COMMON = `
varying vec3 vObj;
uniform vec3 uA, uB, uInk, uAltA, uAltB, uSwirl, uSilver;
float h31(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm3(vec3 p){ return 0.55 * vn(p) + 0.3 * vn(p * 2.07) + 0.15 * vn(p * 4.3); }
`;
const FRAG = {
  paint: `vec4 tx = texture2D(map, vUv);
    float ink = smoothstep(0.30, 0.62, tx.r);
    float mott = smoothstep(0.30, 0.70, fbm3(vObj * 0.05));
    vec3 base = mix(uA, uB, mott) * (0.93 + 0.14 * vn(vObj * vec3(2.2, 2.2, 0.7)));
    diffuseColor.rgb = mix(base, uInk * (0.9 + 0.2 * vn(vObj * 1.7)), ink);`,
  alt: `float ink = 0.0;
    float mott = smoothstep(0.25, 0.75, fbm3(vObj * 0.06 + 3.0));
    diffuseColor.rgb = mix(uAltA, uAltB, mott) * (0.94 + 0.12 * vn(vObj * vec3(2.0, 2.0, 0.8)));`,
  glass: `vec4 tx = texture2D(map, vUv);
    float ink = smoothstep(0.30, 0.62, tx.r);
    diffuseColor.rgb = mix(vec3(0.006), uSilver, ink);`,
  wheel: `vec4 tx = texture2D(map, vUv);
    float ink = smoothstep(0.30, 0.62, tx.r);
    float sw = smoothstep(0.30, 0.62, tx.g);
    vec3 c = mix(diffuseColor.rgb * (0.92 + 0.16 * vn(vObj * 1.3)), vec3(0.012), ink * 0.92);
    diffuseColor.rgb = mix(c, uSwirl, sw);`,
};
const SURF = {      // roughness / metalness tweaks that follow the ink mask
  glass: `roughnessFactor = mix(0.04, 0.34, ink); metalnessFactor = mix(0.0, 0.92, ink);`,
  wheel: `roughnessFactor = mix(0.74, 0.55, ink + sw);`,
  paint: `roughnessFactor = mix(roughnessFactor, roughnessFactor + 0.12, ink);`,
};
function carMaterial(kind, mask, params) {
  const m = new THREE.MeshPhysicalMaterial(params);
  m.map = mask;
  m.customProgramCacheKey = () => 'octane-' + kind;          // the same onBeforeCompile text must not share one program
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
                                     .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    let f = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + GLSL_COMMON)
                             .replace('#include <map_fragment>', FRAG[kind]);
    if (SURF[kind]) f = f.replace('#include <metalnessmap_fragment>', '#include <metalnessmap_fragment>\n' + SURF[kind]);
    sh.fragmentShader = f;
  };
  return m;
}

/* ===================================================================== scene ==== */
let renderer, scene, camera, controls, clock, maxAniso = 1;
const coarse = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HW = 480, HL = 720, WALL = 78;            // pitch half width / half length, wall height (mm, same units as the car)
let key, rim;                                   // lights that follow the car

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t;
}
const glowSprite = () => canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.18, 'rgba(255,255,255,.55)'); r.addColorStop(0.5, 'rgba(255,255,255,.12)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});

function makeSky() {
  const tex = canvasTex(2048, 1024, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0.00, '#04050e'); gr.addColorStop(0.20, '#0b0a24'); gr.addColorStop(0.34, '#2a1250'); gr.addColorStop(0.42, '#7a2a72');
    gr.addColorStop(0.46, '#c2406c'); gr.addColorStop(0.485, '#ff7a5a'); gr.addColorStop(0.497, '#ffa368'); gr.addColorStop(0.5, '#ffc08a'); gr.addColorStop(0.505, '#2a1424'); gr.addColorStop(1.0, '#0b0710');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    // soft round dots: they get magnified a lot on screen, so hard pixels would turn into squares
    const dot = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
    for (let i = 0; i < 520; i++) dot(Math.random() * w, Math.random() * h * 0.34, 0.5 + Math.random() * 0.5, `rgba(255,255,255,${0.1 + Math.random() * 0.45})`);
    // the stadium bowl: dark tiers hugging the horizon, speckled with the crowd and a few camera flashes
    for (let tier = 0; tier < 4; tier++) {
      const base = h * 0.5 - tier * 4, top = 8 + tier * 6;
      g.fillStyle = ['#07050d', '#0b0814', '#100a1a', '#150e22'][tier]; g.beginPath(); g.moveTo(0, h * 0.5);
      for (let x = 0; x <= w; x += 10) g.lineTo(x, base - top - Math.random() * 4); g.lineTo(w, h * 0.5); g.closePath(); g.fill();
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * w, y = base - Math.random() * top * 0.95;
        const r = Math.random();
        dot(x, y, 0.55 + Math.random() * 0.35, r < 0.5 ? `rgba(255,${190 + Math.random() * 50 | 0},${120 + Math.random() * 70 | 0},${0.25 + Math.random() * 0.45})` : `rgba(150,185,255,${0.18 + Math.random() * 0.35})`);
      }
    }
    for (let i = 0; i < 40; i++) { const x = Math.random() * w, y = h * 0.5 - 4 - Math.random() * 22; const gl = g.createRadialGradient(x, y, 0, x, y, 2.2); gl.addColorStop(0, 'rgba(255,255,255,.75)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gl; g.fillRect(x - 3, y - 3, 6, 6); }
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(6500, 48, 24), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false, toneMapped: true }));
  m.renderOrder = -10; return m;
}

function makePitch() {
  const PW = 1024, PH = Math.round(1024 * (HL / HW));
  const tex = canvasTex(PW, PH, (g, w, h) => {
    const bands = 14;
    for (let i = 0; i < bands; i++) { g.fillStyle = i % 2 ? '#123f27' : '#175030'; g.fillRect(0, i * h / bands, w, h / bands + 1); }
    for (let i = 0; i < 26000; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '170,255,190'},${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    const sx = w / (2 * HW), sz = h / (2 * HL);
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3;
    g.strokeRect(6, 6, w - 12, h - 12);
    g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    g.beginPath(); g.ellipse(w / 2, h / 2, 150 * sx, 150 * sz, 0, 0, 7); g.stroke();
    g.beginPath(); g.arc(w / 2, h / 2, 5, 0, 7); g.fillStyle = '#fff'; g.fill();
    for (const [y, col] of [[0, '#2f7bff'], [h, '#ff7a22']]) {
      const dir = y === 0 ? 1 : -1;
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3;
      g.strokeRect(w / 2 - 190 * sx, y === 0 ? 6 : h - 6 - 190 * sz, 380 * sx, 190 * sz);
      const gl = g.createLinearGradient(0, y, 0, y + dir * 260 * sz); gl.addColorStop(0, col + 'cc'); gl.addColorStop(1, col + '00');
      g.fillStyle = gl; g.fillRect(0, y === 0 ? 0 : h - 260 * sz, w, 260 * sz);
    }
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2 * HW, 2 * HL), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.93, metalness: 0, emissiveMap: tex, emissive: new THREE.Color(0x12281c), envMapIntensity: 0.12 }));
  m.rotation.x = -Math.PI / 2; m.receiveShadow = true; return m;
}

function makeArena(pads) {
  const g = new THREE.Group();
  // ground beyond the pitch
  const ground = new THREE.Mesh(new THREE.CircleGeometry(6000, 48), new THREE.MeshStandardMaterial({ color: 0x0c1a14, roughness: 1, metalness: 0, envMapIntensity: 0.1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.4; g.add(ground);
  g.add(makePitch());

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x171a2b, roughness: 0.4, metalness: 0.7, envMapIntensity: 0.9 });
  const glowBlue = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.25, 0.55, 2.2), toneMapped: false });
  const glowOrange = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.7, 0.68, 0.14), toneMapped: false });
  const T = 8;
  const seg = (x, z, w, d, mat, y = 0, h = WALL) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  const gate = 105;                                          // half width of the goal opening
  for (const sgn of [1, -1]) {
    const glow = sgn > 0 ? glowOrange : glowBlue;
    seg(-(HW + gate) / 2 - 0, sgn * (HL + T / 2), HW - gate, T, wallMat);              // end wall, left of the goal
    seg((HW + gate) / 2, sgn * (HL + T / 2), HW - gate, T, wallMat);                   // right of the goal
    seg(0, sgn * (HL + T / 2), 2 * gate, T, wallMat, 66, WALL - 66);                   // above the goal
    seg(0, sgn * (HL + T / 2 + 40), 2 * gate + 10, 80, new THREE.MeshStandardMaterial({ color: 0x0a0b14, roughness: 0.8, metalness: 0.2, side: THREE.BackSide }), 0, 66); // goal recess, open at the front
    for (const x of [-gate, gate]) seg(x, sgn * (HL + 2), 5, 5, glow, 0, 68);          // goal posts
    seg(0, sgn * (HL + 2), 2 * gate + 5, 5, glow, 66, 5);                              // crossbar
    seg(0, sgn * (HL + T + 0.5), 2 * (HW) + 2 * T, 2.4, glow, WALL - 4, 3);            // end wall rim light
    for (const x of [-1, 1]) {                                                         // side walls, each half in its team colour
      seg(x * (HW + T / 2), sgn * HL / 2, T, HL, wallMat);
      seg(x * (HW + T + 0.5), sgn * HL / 2, 2.4, HL, glow, WALL - 4, 3);
      seg(x * (HW + T / 2 - 0.5), sgn * HL / 2, 3, HL, glow, 4, 3);
    }
    seg(0, sgn * (HL + T / 2 - 0.5), 2 * HW, 3, glow, 4, 3);
  }
  // goal nets
  const net = canvasTex(256, 128, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2; for (let x = 0; x <= w; x += 16) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); } for (let y = 0; y <= h; y += 16) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); } });
  for (const sgn of [1, -1]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2 * gate, 66), new THREE.MeshBasicMaterial({ map: net, transparent: true, opacity: 0.55, color: sgn > 0 ? 0xff9a4a : 0x5aa0ff, depthWrite: false, toneMapped: false }));
    m.position.set(0, 33, sgn * (HL + 60)); m.rotation.y = sgn > 0 ? Math.PI : 0; g.add(m);
  }

  // floodlight towers with a glare sprite on each
  const sprite = glowSprite();
  for (const [x, z] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    const px = x * (HW + 150), pz = z * (HL + 150);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(5, 8, 430, 8), new THREE.MeshStandardMaterial({ color: 0x20222e, roughness: 0.6, metalness: 0.6 }));
    pole.position.set(px, 215, pz); g.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(70, 40, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 3.0, 2.6), toneMapped: false }));
    head.position.set(px, 440, pz); head.lookAt(0, 80, 0); g.add(head);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: sprite, color: 0xffe2c0, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false, opacity: 0.95 }));
    sp.scale.set(430, 430, 1); sp.position.set(px, 440, pz); g.add(sp);
  }

  // boost pads
  const padGeo = new THREE.CircleGeometry(15, 6), ringGeo = new THREE.RingGeometry(18, 20.5, 6);
  const specs = [[-400, -620, 1], [400, -620, 1], [-400, 620, 1], [400, 620, 1], [-440, 0, 1], [440, 0, 1],
                 [0, -340, 0], [-200, -340, 0], [200, -340, 0], [0, 340, 0], [-200, 340, 0], [200, 340, 0], [-260, 160, 0], [260, -160, 0]];
  for (const [x, z, big] of specs) {
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 0.9, 0.18), toneMapped: false, transparent: true, opacity: 0.9 });
    const m = new THREE.Mesh(padGeo, mat); m.rotation.x = -Math.PI / 2; m.rotation.z = Math.PI / 6; m.position.set(x, 0.5, z); m.scale.setScalar(big ? 1.5 : 0.85); g.add(m);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(2.0, 0.8, 0.15), toneMapped: false, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.rotation.z = Math.PI / 6; ring.position.set(x, 0.55, z); ring.scale.copy(m.scale); g.add(ring);
    pads.push({ x, z, mat, ring, big, cool: 0 });
  }
  return g;
}

function makeTurntable() {
  const g = new THREE.Group();
  const top = canvasTex(512, 512, (c, w, h) => {
    c.fillStyle = '#12131c'; c.fillRect(0, 0, w, h);
    c.translate(w / 2, h / 2); c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1.5;
    const r = 15, dx = r * 1.732, dy = r * 1.5;

      c.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; c.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); } c.closePath(); c.stroke();
    }

  const body = new THREE.Mesh(new THREE.CylinderGeometry(118, 124, 3, 96),
    [new THREE.MeshStandardMaterial({ color: 0x15161f, roughness: 0.3, metalness: 0.85 }),

  const ring = (r0, r1, col, y) => { const m = new THREE.Mesh(new THREE.RingGeometry(r0, r1, 96), new THREE.MeshBasicMaterial({ color: col, toneMapped: false, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; m.position.y = y; g.add(m); return m; };
  ring(108, 111, new THREE.Color(1.7, 0.68, 0.14), 3.05);

  glow.rotation.x = -Math.PI / 2; glow.position.y = 0.45; g.add(glow);

}

function makeParticles() {

/* ===================================================================== STL export ==== */
function downloadSTL() {
  // Z-up, nose toward +Y, wheels on the floor; (x, y, z) = (-X, Z, Y) from the viewer's Y-up frame (a pure rotation, no mirroring)
  const tris = [];
  const grab = (mesh, ox, oy, oz) => { const p = mesh.geometry.attributes.position.array; for (let i = 0; i < p.length; i += 9) tris.push([p[i] + ox, p[i + 1] + oy, p[i + 2] + oz, p[i + 3] + ox, p[i + 4] + oy, p[i + 5] + oz, p[i + 6] + ox, p[i + 7] + oy, p[i + 8] + oz]); };

  const head = 'Kate Octane lite - optimised mesh, Z up, mm'; for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, tris.length, true);

  for (const t of tris) {
    const v = []; for (let k = 0; k < 9; k += 3) v.push(-t[k], t[k + 2], t[k + 1]);
    const ux = v[3] - v[0], uy = v[4] - v[1], uz = v[5] - v[2], wx = v[6] - v[0], wy = v[7] - v[1], wz = v[8] - v[2];
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    dv.setFloat32(o, nx, true); dv.setFloat32(o + 4, ny, true); dv.setFloat32(o + 8, nz, true); o += 12;
    for (let k = 0; k < 9; k++) { dv.setFloat32(o, v[k], true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'model/stl' })); a.download = 'kateoctane-lite.stl';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    document.body.classList.toggle('touch', coarse);
    const sw = $('#swatches');
    LIVERIES.forEach((L, i) => { const b = document.createElement('button'); b.className = 'sw'; b.title = L.name; b.setAttribute('aria-label', L.name); b.setAttribute('aria-pressed', 'false');
      b.style.background = `conic-gradient(from 200deg, ${L.a}, ${L.b} 38%, ${L.ink} 52%, ${L.a} 66%, ${L.altA} 100%)`; b.onclick = () => setLivery(i); sw.appendChild(b); });
    await buildCar();
    step('Building the arena…', 0.8); await tick1();
    buildScene();
    setLivery(0, true);
    // interface
    $('#spin').onclick = () => setSpin(!controls.autoRotate);
    $('#reset').onclick = () => { if (driving) return; touchedCam = false; introT = 1; frameCar(true); };
    $('#drive').onclick = () => (driving ? exitDrive() : enterDrive());
    $('#dl').onclick = downloadSTL;
    const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'boost', Shift: 'boost' };
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && driving) return exitDrive(); if (!driving) return; const k = map[e.key]; if (k) { inp[k] = 1; e.preventDefault(); } });
    addEventListener('keyup', (e) => { const k = map[e.key]; if (k) inp[k] = 0; });
    document.querySelectorAll('#pad button').forEach((b) => { const k = b.dataset.k; const on = (v) => (e) => { inp[k] = v; b.classList.toggle('on', !!v); e.preventDefault(); };
      b.addEventListener('pointerdown', on(1)); b.addEventListener('pointerup', on(0)); b.addEventListener('pointerleave', on(0)); b.addEventListener('pointercancel', on(0)); });
    if (reduceMotion) introT = 1, frameCar(true);
    $('#loading').classList.add('done');
    window.__octane = { tris: meshStats.tris, setLivery, enterDrive, exitDrive, inp, st, ballSt, camera, controls, car, renderer, scene, wheelRig, get introT() { return introT; }, set introT(v) { introT = v; }, setSpin, frameCar, CAM_DIR, camTarget };
    frame();
  } catch (e) { console.error(e); fail('Something went wrong loading the model (' + e.message + ').'); }
})();
</script>
