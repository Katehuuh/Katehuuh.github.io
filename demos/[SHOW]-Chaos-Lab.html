R({name:"Wormhole Flow", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/4ll3zX\n\nfloat rand(vec2 n) { \n    return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);\n}\n\nfloat noise_u(vec2 n) {\n    const vec2 d = vec2(0.0, 1.0);\n    vec2 b = floor(n), f = smoothstep(vec2(0.0), vec2(1.0), fract(n));\n    return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);\n}\n\nfloat fbm(vec2 n) {\n    float total = 0.0, amplitude = 0.5;\n    \n    for (int i = 0; i <4; i++) {\n        total += noise_u(n ) * amplitude;\n        n += n;\n        amplitude *= 0.5;\n    }\n    return total;\n}\n\nvec2 field(vec2 uv) {\n    vec2 dir = uv-vec2(0.5, 0.5);\n    vec2 dir2 = vec2(dir.y, -dir.x);\n    float l = length(dir);\n    vec2 a0 = l > 0.3 ? dir/(0.1+(l-0.3)*20.) : dir2*5.;\n    return a0*3. + dir2*l*0.9;\n}\n\nfloat getColor(vec2 uv) {\n    return fbm(uv*5.);   \n}\n\nvec2 calcNext(vec2 uv, float t) {\n    vec2 k1 = field(uv);\n    vec2 k2 = field(uv + k1*t/2.);\n    vec2 k3 = field(uv + k2*t/2.);\n    vec2 k4 = field(uv + k3*t);\n       \n    return uv + t/6.*(k1+2.*k2+2.*k2+k3);\n}\n\nvec4 getColor(vec2 uv, float cf, float per) {\n    float t1 = per * cf;\n    float t2 = t1 + per;\n    \n    float k1 = 0.4;\n    float k2 = 0.4;\n    \n    vec2 uv1 = calcNext(uv, t1 * k1 + k2);\n    vec2 uv2 = calcNext(uv, t2 * k1 + k2);\n    \n    float c1 = getColor(uv1);\n    float c2 = getColor(uv2);\n    \n    return vec4(mix(c2, c1, cf));\n}\n\nvoid main(void)\n{\n    vec2 uv = (gl_FragCoord.xy + (resolution.yx - resolution.xx)/2.)/resolution.y;\n\n    float per = 2.;\n    \n    float cf = fract(time / per);\n    vec4 c = getColor(uv,cf, per);\n    float l = length(field(uv));\n    c =  1. - (abs(c-0.5)*5.);\n    \n    \n    // some empirical coefficients\n    c *= 0.5*vec4(0.3, 0.6, 1.1, 1.)*pow(l,-0.3);\n    c += 0.25*vec4(1.0, 0.6, 0.2, 1.)*pow(abs(l-0.35),-0.7);\n    c*=0.8;\n\n    glFragColor = c;\n}"});
R({name:"Cube Tunnel", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// from jspride invitation ! ==> http://www.pouet.net/prod.php?which=61280\n\nconst float a=1e4;\nconst vec3 b=vec3(.7,.9,1);\nconst float c=.004;\nconst vec3 d=vec3(.5,1,.9);\n\nfloat n(vec3 e){\n    return length(max(abs(e)-vec3(10),0.));\n}\n\nfloat o(vec3 e)\n{\n    float f,g,h;\n    f=sin(time*.1)*.004;\n    g=cos(e.z*f);\n    h=sin(e.z*f);\n    mat2 i=mat2(g,-h,h,g);\n    e.xy=i*e.xy;\n\n    return n(mod(e-vec3(-5.,0,50.-time*1e2),50.)-vec3(25));\n}\n\nvec3 p(vec3 e){\n    float f=.01;\n    vec3 g;\n    g.x=o(vec3(e.x+f,e.y,e.z))-o(vec3(e.x-f,e.y,e.z));\n    g.y=o(vec3(e.x,e.y+f,e.z))-o(vec3(e.x,e.y-f,e.z));\n    g.z=o(vec3(e.x,e.y,e.z+f))-o(vec3(e.x,e.y,e.z-f));\n    \n    return normalize(g);\n}\n\nfloat q(vec3 e,vec3 f,float g)\n{\n    float h=g;\n    e+=f*g;\n    for(int i=0;i<5;i++){\n        e+=f;\n        h=min(h,max(o(e),0.));\n    }\n    return h/g;\n}\n\nvec3 r(vec3 e,vec3 f){\n    for(int g=0;g<40;g++){\n        float h=o(e);\n        e+=.9*h*f;\n    }\n    return e;\n}\n\nvoid main(){\n    vec3 e,f,g,h,i,j;\n    e=vec3(cos(time*.7)*5.,sin(time*.4)*10.+12.,0);\n    f=normalize(vec3((gl_FragCoord.x-resolution.x*.5)/resolution.y,gl_FragCoord.y/resolution.y-.5,1));\n    h=r(e,f);\n    i=p(h);\n    j=vec3(1);\n    float k,l,m;\n    k=1.-1./exp(h.z*c);\n    l=q(h,i,5.);\n    m=max(dot(i,vec3(.707,.707,0)),0.);\n    g=mix(j*m*l,vec3(.8),k);\n    glFragColor=vec4(g,1);\n}"});
R({name:"Persian Carpet", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/NddGz7\n\n//change these constants to get different patterns!\n#define c2 0.0\n\n#define c1 vec4(3.0+c2,2.5+c2,1.5,0)\n//#define c1 vec4(2.0+c2,1.5+c2,1.4,0)\n//#define c1 vec4(1.0,1.5,1.4,0)\n//#define c1 vec4(7.0,5.0,1.4,0)\n//#define c1 vec4(7.0,9.0,1.4,0)\n//#define c1 vec4(5.0,5.5,1.4,0)\n\n//----------------------------------------------------------------------------------------\n//  3 out, 1 in...\nvec3 hash31(float p)\n{\n    //from David Hoskin's \"Hash without sine\"\n   vec3 p3 = fract(vec3(p) * vec3(.1031, .1030, .0973));\n   p3 += dot(p3, p3.yzx+33.33);\n   return fract((p3.xxy+p3.yzz)*p3.zyx); \n}\n\nvec2 triangle_wave(vec2 a,float scale){\n    return abs(fract((a+c1.xy)*scale)-.5);\n}\n\nvoid main(void)\n{\n    glFragColor = vec4(0.0);\n    \n    \n\n    \n    vec3 col;  \n    float t1 = 4.5;\n\n    vec2 uv = (gl_FragCoord.xy-resolution.xy)/resolution.y/t1/2.0;\n    uv += vec2(time/2.0,time/3.0)/t1/8.0;\n    //vec3 random1 = hash31(floor((time)/10.0+uv.x))*10.*.0;\n    //vec3 random2 = hash31(1.+floor((time)/10.0+uv.x));\n    vec3 random3 = (hash31(2.+floor((time)/10.0+uv.x))-vec3(.5))/4.;\n    vec3 random4 = (hash31(3.+floor((time)/10.0+uv.x))-vec3(.5))/4.;\n    \n    float offset = .5;\n    float scale2 = 1.16;\n    for(int c=0;c<3;c++){\n        float scale = c1.z;\n        //float scale1 = 1.0;\n        for(int i=0;i<3;i++)\n        {\n            uv = triangle_wave(uv.yx+offset,scale)+triangle_wave(uv,scale);\n            uv.x *= -1.0;\n\n            uv = triangle_wave((uv+offset)/(random4.y+1.),scale+random3.x);\n            uv.x /= -1.0;\n            \n            uv = triangle_wave(uv+offset,scale+random3.y);\n            uv.x *= -1.0;\n            \n            uv = triangle_wave((uv+offset)*(random4.x+1.),scale+random3.z);\n            uv.x /= -1.0;\n            \n            //uv.x *= -1.0;\n            //uv = triangle_wave(uv+c1.y,scale);\n            scale /= 1.+scale2*col.x;\n            //offset *= scale2/(1.+random4.x);\n            \n            uv = -uv.yx;\n            //uv = uv.yx;\n            scale2 += col.x/8.;\n             col[c] = fract((uv.x)-(uv.y));\n\n        }\n    }\n    \n    glFragColor = vec4(vec3(col),1.0);\n    \n}"});
R({name:"Truchet Tiles", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/ct23Dd\n\n/** \n\n    License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License\n    \n    Year of Truchets #002\n    01/18/2023  @byt3_m3chanic\n    \n    All year long I'm going to just focus on truchet tiles and the likes!\n    Truchet Core \\M/->.<-\\M/ 2023 \n    \n*/\n\n#define R resolution\n#define T time\n#define M mouse*resolution.xy\n\n#define PI          3.14159265359\n#define PI2         6.28318530718\n\n#define MIN_DIST    .0001\n#define MAX_DIST    50.\n\nfloat hash21(vec2 p) {return fract(sin(dot(p,vec2(23.43,84.21)))*4832.3234);}\nmat2 rot(float a){ return mat2(cos(a),sin(a),-sin(a),cos(a)); }\n\n//@iq https://iquilezles.org/articles/palettes/\nvec3 hue(float t){ \n    t+=T*.06;\n    return .55+.75*cos(PI2*t*(vec3(1.,.99,.95)+vec3(.1,.34,.27))); \n}\n//@iq https://iquilezles.org/articles/distfunctions2d/\nfloat line( in vec2 p){\n    vec2 a = vec2(.2,.5),b = vec2(.8,.5);\n    vec2 ba = b-a, pa = p-a;\n    float h = clamp( dot(pa,ba)/dot(ba,ba), 0., 1. );\n    float d = length(pa-h*ba);\n    return d-.1;\n}\n\nconst float scale = 8.;\n\nvoid main(void) { //WARNING - variables void ( out vec4 O, in vec2 F ) { need changing to glFragColor and gl_FragCoord.xy\n\n\tvec2 F = gl_FragCoord.xy;\n\tvec4 O = vec4(0.0);\n\n    // uv \n    vec2 uv = (2.* F.xy-R.xy)/max(R.x,R.y);\n    uv.x-=T*.05;\n    \n    // colors \n    vec3 h1 = hue(uv.y*.04+T*.01);\n    vec3 h2 = hue((15.+uv.y)*.04+T*.05);\n    vec3 h3 = hue(uv.x*.04+T*.01);\n    \n    vec3 C = hue((10.-uv.x)*.04+T*.1);\n    \n    // base grid and ids\n    vec2 id = floor(uv*scale);\n    vec2 gv = fract(uv*scale)-.5;\n    float px = scale/R.x;\n\n    float check = mod(id.y+id.x,2.)*2.-1.;\n    float rnd = hash21(id);\n    if(rnd>.5) gv.x *= -1.;\n    \n    // setup for truchet path\n    vec2 d2 = vec2(length(gv-.5),length(gv+.5));\n    vec2 g2 = d2.x<d2.y? gv-.5 : gv+.5;\n\n    float ft = .2+.1*sin(uv.y*5.2+T);\n    float d = length(g2)-.5;\n    float dl= smoothstep(px,-px,abs(abs(d)-ft)-.02);\n    d = smoothstep(-px,px,abs(d)-ft);\n\n    C = mix(C,h3,d);\n    C = mix(C,vec3(.8),dl);\n    \n    \n    // moving truchet parts\n    vec2 arc = gv-sign(gv.x+gv.y+.001)*.5;\n    float angle = atan(arc.x, arc.y);\n    d = length(arc);\n\n    float x = fract(3.*check*angle/PI+T*1.15);\n    float y = (d/.5)-.5;\n    \n    if(rnd<.5 ^^ check>0.) y=1.-y;\n    vec2 tuv = vec2(x,y);\n    \n    float ts = length(tuv-vec2(.5))-.25;\n    ts = smoothstep(.05+px,-px,abs(ts)-.125);\n    C = mix(C,vec3(.01),ts);\n    \n    float t = length(tuv-vec2(.5))-.25;\n    t = smoothstep(px,-px,abs(t)-.075);\n    C = mix(C,h2,t);\n    \n    ts = min(line(tuv-vec2(.5,0)),line(tuv+vec2(.5,0)));\n    ts = smoothstep(.05+px,-px,abs(ts)-.05);\n    C = mix(C,vec3(.01),ts);\n    \n    t = min(line(tuv-vec2(.5,0)),line(tuv+vec2(.5,0))); \n    t = smoothstep(px,-px,t);\n    C = mix(C,h1,t);\n    \n    C = pow(C, vec3(.4545));\n    O = vec4(C,1.);\n\n\tglFragColor = O;\n}"});
R({name:"Fractal Knots", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/slKGWw\n\n//change these constants to get different patterns!\n#define c1 vec3(1.,0.5,1.5)\n\nvec2 triangle_wave(vec2 a,float scale){\n    return abs(fract((a+c1.xy)*scale)-.5);\n    //return abs(fract((a+c1.xy)*scale+time/500.)-.5); //morphing\n}\n\nvoid main(void)\n{\n    glFragColor = vec4(0.0);\n    vec3 col;  \n    float t1 = 36.;\n    vec2 uv = (gl_FragCoord.xy-resolution.xy)/resolution.y/t1/2.0;\n    uv += vec2(time/2.0,time/3.0)/t1/8.0;\n    float scale = c1.z;\n    for(int i=0;i<9;i++)\n    {\n        vec2 t2 = vec2(0.);\n        vec2 t3 = vec2(0.);\n        for(int k = 0; k < 3; k++){    \n            //uv /= -scale-col.x;\n            uv /= -scale;\n            //uv -= (t2.yx)/(scale+col.x);\n            uv -= (t2.yx)/(scale);\n            //uv -= (t2.yx)/(scale+t3);\n\n            t2 = triangle_wave(uv.yx-.5,scale);\n            t3 = triangle_wave(uv,scale);\n            uv.yx = (t2+t3)/scale;\n        }\n        col.x = abs(uv.y-uv.x+col.x);\n        col = col.yzx;\n    }\n    glFragColor = vec4(col,1.0);   \n}"});
R({name:"Fire", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// Original by @301z => https://www.shadertoy.com/view/Xsl3zN\n\nfloat rand(vec2 n) { \n    return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);\n}\n\nfloat noise_u(vec2 n) {\n    const vec2 d = vec2(0.0, 1.0);\n    vec2 b = floor(n), f = smoothstep(vec2(0.0), vec2(1.0), fract(n));\n    return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);\n}\n\nfloat fbm(vec2 n) {\n    float total = 0.0, amplitude = 1.0;\n    for (int i = 0; i < 7; i++) {\n        total += noise_u(n) * amplitude;\n        n += n;\n        amplitude *= 0.5;\n    }\n    return total;\n}\n\nvoid main() {\n    const vec3 c1 = vec3(0.1, 0.0, 0.0);\n    const vec3 c2 = vec3(0.7, 0.0, 0.0);\n    const vec3 c3 = vec3(0.2, 0.0, 0.0);\n    const vec3 c4 = vec3(1.0, 0.9, 0.0);\n    const vec3 c5 = vec3(0.1);\n    const vec3 c6 = vec3(0.9);\n    vec2 p = gl_FragCoord.xy * 8.0 / resolution.xx;\n    float q = fbm(p - time * 0.1);\n    vec2 r = vec2(fbm(p + q + time * 0.7 - p.x - p.y), fbm(p + q - time * 0.4));\n    vec3 c = mix(c1, c2, fbm(p + r)) + mix(c3, c4, r.x) - mix(c5, c6, r.y);\n    glFragColor = vec4(c * cos(1.57 * gl_FragCoord.y / resolution.y), 1.0);\n}"});
R({name:"Terrain", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/Mt3XD8\n\nfloat random (in vec2 st) {\n    return fract(sin(dot(st.xy,\n                         vec2(12.9898,78.233)))*\n        43758.5453123);\n}\n\n// Based on Morgan McGuire @morgan3d\n// https://www.shadertoy.com/view/4dS3Wd\nfloat noise_u (in vec2 st) {\n    vec2 i = floor(st);\n    vec2 f = fract(st);\n\n    // Four corners in 2D of a tile\n    float a = random(i);\n    float b = random(i + vec2(1.0, 0.0));\n    float c = random(i + vec2(0.0, 1.0));\n    float d = random(i + vec2(1.0, 1.0));\n\n    vec2 u = f * f * (3.0 - 2.0 * f);\n\n    return mix(a, b, u.x) +\n            (c - a)* u.y * (1.0 - u.x) +\n            (d - b) * u.x * u.y;\n}\n\nfloat sdf_xz_plane(vec3 p, float y, float o)\n{   \n\n    float n = noise_u(p.xz) * 2.0;\n    n += noise_u(p.xz * 4.) * 0.25;\n    n += noise_u(p.xz * 8.) * 0.125;\n    n += noise_u(p.xz * 16.) * 0.0625;\n    return p.y - y - n;\n}\n\nvec2 trace(vec3 o, vec3 r){\n\n    float d = 0.0;\n    float t = 0.0;\n    \n    for(int i=0; i<32; i++){\n        vec3 p = o + r * t;\n        d = sdf_xz_plane(p, -1.25, 0.4);\n        t += d * 0.5;\n\n        if(d < 0.01 || t > 30.){\n            break;\n        }\n    }\n\n    return vec2(t, d);\n\n}\n\nvoid main(void)\n{\n    vec2 uv = gl_FragCoord.xy / resolution.xy;\n   \n    uv = uv * 2.0 - 1.0;\n    uv.x *= 1.5;\n    \n    vec3 r = normalize(vec3(uv, 1.0));\n\n    vec3 o = vec3(0.0, 2.0, time);\n\n    vec2 t = trace(o, r);\n\n    float fog = 1.0 / t.x * 2.0;\n\n    vec3 fc = vec3(fog);\n\n    glFragColor = vec4(fc, 1.0);\n\n}"});
R({name:"Cube Voyage", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/4dXGRM\n\n#define FOV_MORPH 1\n\nfloat box(vec3 p) {\n    return length(max(abs(p)-vec3(.5),0.0)) - 0.15;\n}\n\nvec3 rot(vec3 p, float f) {\n    float s = sin(f);\n    float c = cos(f);\n    p.xy *= mat2(c, -s, s, c);\n    p.yz *= mat2(c, -s, s, c);\n    return p;\n}\n\nvec3 trans(vec3 p, out float rotout) {\n    p.zx += time*8.0;\n\n    vec3 b = vec3(4.);\n    vec3 rep = floor(p/b);\n\n    p = mod(p,b)-0.5*b;\n    \n    rotout = time*1.88 + (rep.x+rep.z+rep.y)*0.3;\n    p = rot(p, rotout);\n    return p;    \n}\n\nfloat scene(vec3 p) {\n    float dummy;\n    return box(trans(p,dummy));\n}\n\nvec3 normal(vec3 p, float d) {\n    vec3 e = vec3(0.04,.0,.0);\n    return normalize(vec3(\n        scene(p+e.xyy)-d,\n        scene(p+e.yxy)-d,\n        scene(p+e.yyx)-d));\n    \n}\n\nvoid main(void)\n{\n    vec2 xy = gl_FragCoord.xy / resolution.xy - vec2(0.5,0.5);\n    xy.y *= -resolution.y / resolution.x;\n\n    float time2 = time*0.5;\n    vec3 ro = 1.5*normalize(vec3(cos(time2),cos(time2)*1.2,sin(time2)));\n    vec3 eyed = normalize(vec3(0.0) - ro);\n    vec3 ud = normalize(cross(vec3(0.0,1.0,0.0), eyed));\n    vec3 vd = normalize(cross(eyed,ud));\n\n#if FOV_MORPH\n    float fov = 3.14 * 0.8 + sin(time2*1.334)*1.45;\n#else\n    float fov = 3.14 * 0.7;\n#endif\n    \n    float f = fov * length(xy);\n    vec3 rd = normalize(normalize(xy.x*ud + xy.y*vd) + (1.0/tan(f))*eyed);\n\n    vec3 p = ro + rd;\n\n    float dall=0.0,d=0.0;\n    for(int i = 0; i < 64; i++) {\n        d = scene(p);\n        if(d < 0.06) break;\n        p += d*rd;\n        dall += d;\n    }\n\n    vec3 bg = normalize(p).zzz + 0.1;\n\n    if(d < 0.06) {\n        vec3 n = normal(p,d); \n        vec3 col = vec3(dot(vec3(0.0,0.0,1.0), n));\n        float objrot;\n        vec3 objp = trans(p,objrot);\n        vec3 objn = abs(rot(n,objrot));\n        \n        vec2 uv = \n            (objn.y > 0.707) ? vec2(objp.zx) : \n            (objn.x > 0.707) ? vec2(objp.zy) :\n                               vec2(objp.xy) ;\n        vec3 tex = vec3(0.0,0.0,0.0);\n        vec3 hl = smoothstep(0.6, 1.0, col);\n        col *= clamp(tex.xyz+0.3, 0.0, 1.0);\n\n        col = col + hl*.4;\n        float fog = clamp(dall/mix(90.0,40.0,((rd.z+1.0)*0.5)), 0.0, 1.0);\n\n        glFragColor = vec4(mix(col, bg, fog),1.0);\n    }\n    else {\n        glFragColor = vec4(bg, 1.0);\n    }\n        \n\n        \n}"});
R({name:"Mandala", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n//--- mandala\n// by Catzpaw 2018\n\n#define OCT 4\n#define ITER 64\n#define EPS 0.00427\n#define NEAR .5\n#define FAR 50.\n\nvec3 hsv2rgb(vec3 c){return ((clamp(abs(fract(c.x+vec3(0.,.7,.3))*7.-3.)-1.,0.,1.)-1.)*c.y+1.)*c.z;}\n\nfloat map(vec3 p){float d=0.,s=8.;p+=1.;\n    for(int i=0;i<OCT;i++){d=max(s*.590-length((fract(p/s)-.5)*s*.8455),d);s/=6.;}\n    return d;}\n\nfloat trace(vec3 ro,vec3 rd,out float n){float t=NEAR,d;\n    for(int i=0;i<ITER;i++){d=map(ro+rd*t);if(abs(d)<EPS||t>FAR)break;t+=step(d,1.)*d*.2+d*.5;n+=1.;}\n    return min(t,FAR);}\n\nvoid main(void){\n    vec2 uv=(gl_FragCoord.xy-.5*resolution.xy)/resolution.y; uv *= 2.5;\n    float n=0.,a=sin(time*.05)*3.,s=sin(a),c=cos(a);uv*=mat2(c,s,-s,c);\n    float v=1.-trace(vec3(1.+sin(time*0.29)*.9,1.+sin(time*.127)*.5,1.-(time*0.927)),vec3(uv,-.5),n)/FAR;\n    n/=float(ITER);\n    glFragColor=vec4(mix(vec3(1),mix(hsv2rgb(vec3(0.5)),vec3(0),v),n)*v,1);\n}"});
R({name:"Perlin Sunset", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n// http://www.kamend.com/2012/06/perlin-noise-and-glsl/\n\nvec4 mod289(vec4 x)\n{\n    return x - floor(x * (1.0 / 289.0)) * 289.0;\n}\n\nvec4 permute(vec4 x)\n{\n    return mod289(((x*34.0)+1.0)*x);\n}\n\nvec4 taylorInvSqrt(vec4 r)\n{\n    return 1.79284291400159 - 0.85373472095314 * r;\n}\n\nvec2 fade(vec2 t) {\n    return t*t*t*(t*(t*6.0-15.0)+10.0);\n}\n\n// Classic Perlin noise\nfloat cnoise(vec2 P)\n{\n    vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);\n    vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);\n    Pi = mod289(Pi); // To avoid truncation effects in permutation\n    vec4 ix = Pi.xzxz;\n    vec4 iy = Pi.yyww;\n    vec4 fx = Pf.xzxz;\n    vec4 fy = Pf.yyww;\n    \n    vec4 i = permute(permute(ix) + iy);\n    \n    vec4 gx = fract(i * (1.0 / 41.0)) * 2.0 - 1.0 ;\n    vec4 gy = abs(gx) - 0.5 ;\n    vec4 tx = floor(gx + 0.5);\n    gx = gx - tx;\n    \n    vec2 g00 = vec2(gx.x,gy.x);\n    vec2 g10 = vec2(gx.y,gy.y);\n    vec2 g01 = vec2(gx.z,gy.z);\n    vec2 g11 = vec2(gx.w,gy.w);\n    \n    vec4 norm = taylorInvSqrt(vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11)));\n    g00 *= norm.x;  \n    g01 *= norm.y;  \n    g10 *= norm.z;  \n    g11 *= norm.w;  \n    \n    float n00 = dot(g00, vec2(fx.x, fy.x));\n    float n10 = dot(g10, vec2(fx.y, fy.y));\n    float n01 = dot(g01, vec2(fx.z, fy.z));\n    float n11 = dot(g11, vec2(fx.w, fy.w));\n    \n    vec2 fade_xy = fade(Pf.xy);\n    vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);\n    float n_xy = mix(n_x.x, n_x.y, fade_xy.y);\n    return 2.3 * n_xy;\n}\n\n// Classic Perlin noise, periodic variant\nfloat pnoise(vec2 P, vec2 rep)\n{\n    vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);\n    vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);\n    Pi = mod(Pi, rep.xyxy); // To create noise with explicit period\n    Pi = mod289(Pi);        // To avoid truncation effects in permutation\n    vec4 ix = Pi.xzxz;\n    vec4 iy = Pi.yyww;\n    vec4 fx = Pf.xzxz;\n    vec4 fy = Pf.yyww;\n    \n    vec4 i = permute(permute(ix) + iy);\n    \n    vec4 gx = fract(i * (1.0 / 41.0)) * 2.0 - 1.0 ;\n    vec4 gy = abs(gx) - 0.5 ;\n    vec4 tx = floor(gx + 0.5);\n    gx = gx - tx;\n    \n    vec2 g00 = vec2(gx.x,gy.x);\n    vec2 g10 = vec2(gx.y,gy.y);\n    vec2 g01 = vec2(gx.z,gy.z);\n    vec2 g11 = vec2(gx.w,gy.w);\n    \n    vec4 norm = taylorInvSqrt(vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11)));\n    g00 *= norm.x;  \n    g01 *= norm.y;  \n    g10 *= norm.z;  \n    g11 *= norm.w;  \n    \n    float n00 = dot(g00, vec2(fx.x, fy.x));\n    float n10 = dot(g10, vec2(fx.y, fy.y));\n    float n01 = dot(g01, vec2(fx.z, fy.z));\n    float n11 = dot(g11, vec2(fx.w, fy.w));\n    \n    vec2 fade_xy = fade(Pf.xy);\n    vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);\n    float n_xy = mix(n_x.x, n_x.y, fade_xy.y);\n    return 2.3 * n_xy;\n}\n\nfloat fbm(vec2 P, const int octaves, float lacunarity, float gain)\n{\n    float sum = 0.0;\n    float amp = 1.0;\n    vec2 pp = P;\n    \n    //seems like you cant do i < octaves in webgl, you have to compare against a constant\n    //but then in your code your always using 10 anywayz\n    //sucks tho, would love a solution/work around\n    for(int i=0 ; i < 10; i++)\n    {\n        amp *= gain; \n        sum += amp * cnoise(pp);\n        pp *= lacunarity;\n    }\n    return sum;\n\n}\n\nfloat pattern(in vec2 p) {\n    float l = 2.5;\n    float g = 0.4;\n    int oc = 10;\n    \n    vec2 q = vec2( fbm( p + vec2(0.0,0.0),oc,l,g),fbm( p + vec2(5.2,1.3),oc,l,g));\n    vec2 r = vec2( fbm( p + 4.0*q + vec2(1.7,9.2),oc,l,g ), fbm( p + 4.0*q + vec2(8.3,2.8) ,oc,l,g));\n    return fbm( p + 4.0*r ,oc,l,g);    \n}\n\nfloat pattern2( in vec2 p, out vec2 q, out vec2 r , in float time)\n{\n    float l = 2.3;\n    float g = 0.4;\n    int oc = 10; \n    \n    q.x = fbm( p + vec2(time,time),oc,l,g);\n    q.y = fbm( p + vec2(5.2*time,1.3*time) ,oc,l,g);\n    \n    r.x = fbm( p + 4.0*q + vec2(1.7,9.2),oc,l,g );\n    r.y = fbm( p + 4.0*q + vec2(8.3,2.8) ,oc,l,g);\n    \n    return fbm( p + 4.0*r ,oc,l,g);\n}\n\nvoid main() {\n    \n    vec2 q = gl_FragCoord.xy / vec2(640.0,480.0);\n    vec2 p = -1.0 + 2.0 * q;\n    vec2 qq;\n    vec2 r;\n    float color = pattern2(p,qq,r,time*0.01);\n    \n    vec4 c = vec4(color * p.x + qq.y + qq.x,qq.x + p.y * color + r.y + r.y, qq.x * r.x + qq.x+color,1.);\n    c *= 3.5;\n    \n    glFragColor = c;\n}"});
R({name:"Noise Field", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define NUM_OCTAVES 16\n\nmat3 rotX(float a) {\n    float c = cos(a);\n    float s = sin(a);\n    return mat3(\n        1, 0, 0,\n        0, c, -s,\n        0, s, c\n    );\n}\nmat3 rotY(float a) {\n    float c = cos(a);\n    float s = sin(a);\n    return mat3(\n        c, 0, -s,\n        0, 1, 0,\n        s, 0, c\n    );\n}\n\nfloat random(vec2 pos) {\n    return fract(sin(dot(pos.xy, vec2(12.9898, 78.233))) * 43758.5453123);\n}\n\nfloat noise_u(vec2 pos) {\n    vec2 i = floor(pos);\n    vec2 f = fract(pos);\n    float a = random(i + vec2(0.0, 0.0));\n    float b = random(i + vec2(1.0, 0.0));\n    float c = random(i + vec2(0.0, 1.0));\n    float d = random(i + vec2(1.0, 1.0));\n    vec2 u = f * f * (3.0 - 2.0 * f);\n    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;\n}\n\nfloat fbm(vec2 pos) {\n    float v = 0.0;\n    float a = 0.5;\n    vec2 shift = vec2(100.0);\n    mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));\n    for (int i=0; i<NUM_OCTAVES; i++) {\n        v += a * noise_u(pos);\n        pos = rot * pos * 2.0 + shift;\n        a *= 0.5;\n    }\n    return v;\n}\n\nvoid main(void) {\n    vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);\n\n    float t = 0.0, d;\n    \n    float time2 = time / 2.0;\n    \n    vec2 q = vec2(0.0);\n    q.x = fbm(p + 0.00 * time2);\n    q.y = fbm(p + vec2(1.0));\n    vec2 r = vec2(0.0);\n    r.x = fbm(p + 1.0 * q + vec2(1.7, 9.2) + 0.15 * time2);\n    r.y = fbm(p + 1.0 * q + vec2(8.3, 2.8) + 0.126 * time2);\n    float f = fbm(p + r);\n    vec3 color = mix(\n        vec3(0.101961, 0.619608, 1.666667),\n        vec3(0.666667, 0.666667, 1.498039),\n        clamp((f * f) * 4.0, 0.0, 1.0)\n    );\n\n    color = mix(\n        color,\n        vec3(0, 0, 0.164706),\n        clamp(length(q), 0.0, 1.0)\n    );\n\n    color = mix(\n        color,\n        vec3(0.666667, 1, 1),\n        clamp(length(r.x), 0.0, 1.0)\n    );\n\n    color = (f *f * f + 0.6 * f * f + 0.5 * f) * color;\n    \n    glFragColor = vec4(color, 1.0);\n}"});
R({name:"Nebula Fly", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n//uniform vec2 mouse;\n\nfloat field(in vec3 p,float s) {\n    float strength = 7. + .03 * log(1.e-6 + fract(sin(time) * 12000.11));\n    float accum = s/6.;\n    float prev = 0.;\n    float tw = 0.;\n    for (int i = 0; i < 26; ++i) {\n        float mag = dot(p, p);\n        p = abs(p) / mag + vec3(-.5, -.4, -1.5);\n        float w = exp(-float(i) / 7.);\n        accum += w * exp(-strength * pow(abs(mag - prev), 2.2));\n        tw += w;\n        prev = mag;\n    }\n    return max(0., 5. * accum / tw - .7);\n}\n\n// Less iterations for second layer\nfloat field2(in vec3 p, float s) {\n    float strength = 7. + .03 * log(1.e-6 + fract(sin(time) * 4373.11));\n    float accum = s/4.;\n    float prev = 0.1;\n    float tw = 0.;\n    for (int i = 0; i < 18; ++i) {\n        float mag = dot(p, p);\n        p = abs(p) / mag + vec3(-.5, -.4, -1.5);\n        float w = exp(-float(i) / 7.);\n        accum += w * exp(-strength * pow(abs(mag - prev), 2.2));\n        tw += w;\n        prev = mag;\n    }\n    return max(0., 5. * accum / tw - .7);\n}\n\nvec3 nrand3( vec2 co )\n{\n    vec3 a = fract( cos( co.x*10.3e-3 + co.y )*vec3(10.3e5, 4.7e5, 2.9e5) );\n    vec3 b = fract( sin( co.x*0.8e-3 + co.y )*vec3(8.1e5, 1.0e5, 0.1e5) );\n    vec3 c = mix(a, b, 0.5);\n    return c;\n}\n\nvoid main() {\n    vec2 uv = 2. * gl_FragCoord.xy / resolution.xy - 1.;\n    vec2 uvs = uv * resolution.xy / max(resolution.x, resolution.y);\n    vec3 p = vec3(uvs / 4., 0) + vec3(1., -1.3, 0.);\n    p += .2 * vec3(sin(time / 16.), sin(time / 12.),  sin(time / 128.));\n    \n    float freqs[4];\n    freqs[0] = 0.04;\n    freqs[1] = 0.5;\n    freqs[2] = 0.3;\n    freqs[3] = 0.3;\n    \n    float t = field(p,freqs[2]);\n    float v = (1. - exp((abs(uv.x) - 1.) * 6.)) * (1. - exp((abs(uv.y) - 1.) * 6.));\n    \n    //Second Layer\n    vec3 p2 = vec3(uvs / (4.+sin(time*0.11)*0.2+0.2+sin(time*0.15)*0.3+0.4), 1.5) + vec3(2., -1.3, -1.);\n    p2 += 0.25 * vec3(sin(time / 16.), sin(time / 12.),  sin(time / 128.));\n    float t2 = field2(p2,freqs[3]);\n    vec4 c2 = mix(.4, 1., v) * vec4(1.3 * t2 * t2 * t2 ,1.8  * t2 * t2 , t2* freqs[0], t2);\n    \n    \n    //Let's add some stars\n    //Thanks to http://glsl.heroku.com/e#6904.0\n    vec2 seed = p.xy * 1.1;    \n    seed = floor(seed * resolution.x);\n    vec3 rnd = nrand3( seed );\n    vec4 starcolor = vec4(pow(rnd.y,19.0));\n    \n    //Second Layer\n    vec2 seed2 = p2.xy * 2.0;\n    seed2 = floor(seed2 * resolution.x);\n    vec3 rnd2 = nrand3( seed2 );\n    starcolor += vec4(pow(rnd2.y,40.0));\n    \n    glFragColor = mix(freqs[3]-.3, 1., v) * vec4(3.5*freqs[2] * t * t* t , 1.2*freqs[2] * t * t, freqs[3]*t, 1.0)+c2+starcolor;\n}"});
