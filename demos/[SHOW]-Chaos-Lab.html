<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-VoC</title>
<style>
  :root{--bg:#0a0a0f;--panel:#15151f;--fg:#d8d8e0;--accent:#6ce;--err:#f55;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Consolas,monospace;overflow:hidden;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #ui{position:fixed;top:0;left:0;max-width:320px;padding:10px;background:rgba(21,21,31,.82);border-bottom-right-radius:10px;backdrop-filter:blur(6px);z-index:10;user-select:none;}
  #ui h1{font-size:13px;margin:0 0 8px;color:var(--accent);letter-spacing:.5px;}
  select,button{background:var(--panel);color:var(--fg);border:1px solid #2a2a3a;border-radius:5px;padding:5px 7px;font:inherit;width:100%;margin-top:5px;}
  button{cursor:pointer;width:auto;}
  button:hover,select:hover{border-color:var(--accent);}
  #cycle{position:absolute;top:9px;right:10px;width:auto;padding:3px 9px;font-size:15px;line-height:1;border-radius:6px;}
  #cycle.on{color:var(--accent);border-color:var(--accent);}
  /* conic-gradient cooldown ring around the edge, fills over 5s each cycle */
  #cycle::after{content:'';position:absolute;inset:-4px;border-radius:9px;padding:3px;
    background:conic-gradient(var(--accent) calc(var(--p,0)*360deg), rgba(255,255,255,.10) 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:0;transition:opacity .25s;}
  #cycle.on::after{opacity:1;}
  #params{margin-top:8px;}
  .row{display:flex;align-items:center;gap:6px;margin:4px 0;}
  .row label{flex:0 0 96px;color:#9a9ab0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);}
  .row .val{flex:0 0 46px;text-align:right;color:#cdcde0;font-variant-numeric:tabular-nums;}
  #hud{position:fixed;bottom:6px;left:8px;color:#667;z-index:10;font-size:11px;text-shadow:0 1px 2px #000;pointer-events:none;}
  #err{position:fixed;bottom:0;left:0;right:0;max-height:40%;overflow:auto;background:rgba(40,0,0,.92);color:var(--err);padding:8px 10px;white-space:pre-wrap;font-size:11px;z-index:20;display:none;border-top:1px solid #500;}
</style>
</head>

<script>
"use strict";
/*=============================================================================
 Mini-VoC engine  (raw WebGL2, dependency-free)
 -----------------------------------------------------------------------------
 A registry-based, multi-runtime engine that hosts many generative "modes".
 Mode modules live in /src/modes/<family>.js and self-register via VOC.register.

 ===========================  HOW TO ADD A MODE  =============================
 VOC.register({
   name:     'Mandelbrot',            // unique
   category: '2D Fractals',           // dropdown group
   type:     'frag'|'pingpong'|'custom',
   params:   [ {key:'zoom',label:'zoom',min:.3,max:300,step:.01,value:.9}, ... ],
   // -- type:'frag' / 'pingpong' --
   frag:     `uniform float zoom; void main(){ ... gl_FragColor = vec4(col,1.); }`,
   hdr:      false,   // pingpong only: true => RGBA16F targets (reaction-diffusion etc.)
   // -- type:'custom' --
   init(api){ ...; return state },         // build GL/JS resources, return state object
   frame(api, state){ ... },               // called every animation frame
   dispose(api, state){ ... },             // optional cleanup on mode switch
   reset(api, state){ ... },               // optional: respond to reset/reseed button
 })

 ----------------------------  FRAGMENT ABI  --------------------------------
 'frag' & 'pingpong' fragment BODIES are wrapped with this preamble (do NOT
 put #version in your body):
   #version 300 es ; precision highp float/int ; out vec4 voc_out;
   uniform float u_time;  uniform vec2 u_resolution;  uniform vec2 u_mouse;
   uniform int u_frame;   uniform sampler2D u_backbuffer;  uniform sampler2D u_palette;
   aliases: time/iTime->u_time, resolution/iResolution->u_resolution,
            mouse->u_mouse/u_resolution, gl_FragColor & glFragColor -> voc_out,
            backbuffer/iChannel0 -> u_backbuffer, texture2D->texture.
   palette(float t) -> vec3   (samples the active palette, t in 0..1)
 Shadertoy-style bodies that define `void mainImage(out vec4 c, vec2 fragCoord)`
 and no `main` get an automatic main() wrapper.

 -----------------------------  CUSTOM api  ---------------------------------
 init/frame receive `api`:
   api.gl, api.canvas, api.W, api.H, api.frame, api.time(), api.params, api.mouse()
   api.buildProgram(fragBody)         -> WebGLProgram (fragment ABI, fullscreen)
   api.buildProgramVF(vsSrc, fsSrc)   -> WebGLProgram (raw; you supply both shaders)
   api.setCommon(program)             -> set u_time/res/mouse/frame + bind backbuffer(0)/palette(1)
   api.drawQuad()                     -> draw fullscreen triangle (program already in use)
   api.drawPoints(n, mode?)           -> draw n GL_POINTS (program/attribs set by you)
   api.makeTarget(hdr?)               -> {fbo, tex, w, h}   (offscreen render target)
   api.paletteTex                     -> current 256x1 palette texture (unit 1)
   api.toScreen()                     -> bind default framebuffer + viewport
   api.clear(r,g,b,a)
   api.quadVAO                        -> VAO with attribute 0 = vec2 'p' clip-space triangle
 selfTest() and the hidden-tab rAF fallback are built in.
=============================================================================*/

const VOC = (function(){

//------------------------------------------------------------------ canvas/gl
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, preserveDrawingBuffer:true, alpha:false });
const errBox = document.getElementById('err');
function showErr(m){ console.error('[mini-voc]', m); if(errBox){ errBox.style.display='block'; errBox.textContent=String(m); } }
function clearErr(){ if(errBox){ errBox.style.display='none'; errBox.textContent=''; } }

const hasFloatRT = !!gl.getExtension('EXT_color_buffer_float');

//------------------------------------------------------------------ shader ABI
const QUAD_VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;

const PREAMBLE = `#version 300 es
precision highp float; precision highp int;
out vec4 voc_out;
uniform float u_time; uniform vec2 u_resolution; uniform vec2 u_mouse;
uniform int u_frame; uniform sampler2D u_backbuffer; uniform sampler2D u_palette;
#define time u_time
#define iTime u_time
#define resolution u_resolution
#define iResolution vec3(u_resolution,1.0)
#define mouse (u_mouse/u_resolution)
#define iMouse vec4(u_mouse,0.0,0.0)
#define backbuffer u_backbuffer
#define iChannel0 u_backbuffer
#define texture2D texture
#define gl_FragColor voc_out
#define glFragColor voc_out
vec3 palette(float t){ return texture(u_palette, vec2(clamp(t,0.0,1.0),0.5)).rgb; }
`;

const SHADERTOY_MAIN = `
void main(){ vec4 c=vec4(0.); mainImage(c, gl_FragCoord.xy); voc_out=c; }
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s); gl.deleteShader(s);
    throw new Error('compile:\n'+log);

  return s;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, 'p');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: '+gl.getProgramInfoLog(p));
  return p;
}
function buildProgram(fragBody){
  let body = fragBody;
  if(/\bmainImage\b/.test(body) && !/\bvoid\s+main\s*\(/.test(body)) body += SHADERTOY_MAIN;
  return link(compile(gl.VERTEX_SHADER, QUAD_VS), compile(gl.FRAGMENT_SHADER, PREAMBLE + body));
}
function buildProgramVF(vsSrc, fsSrc){
  return link(compile(gl.VERTEX_SHADER, vsSrc), compile(gl.FRAGMENT_SHADER, fsSrc));
}

//------------------------------------------------------------------ geometry
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

const BLIT = buildProgram(`uniform sampler2D u_tex; void main(){ voc_out = texture(u_tex, gl_FragCoord.xy/u_resolution); }`);

//------------------------------------------------------------------ render targets
let W=0, H=0;
function makeTexture(w,h,hdr){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  const internal = (hdr && hasFloatRT) ? gl.RGBA16F : gl.RGBA8;
  const type = (hdr && hasFloatRT) ? gl.FLOAT : gl.UNSIGNED_BYTE;
  gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,gl.RGBA,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function makeTarget(hdr){
  const tex = makeTexture(W,H,hdr), fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, tex, w:W, h:H };
}
// ping-pong pair for 'pingpong' modes (reallocated on resize)
let pp = null;
function allocPingPong(hdr){
  if(pp){ pp.forEach(t=>{ gl.deleteFramebuffer(t.fbo); gl.deleteTexture(t.tex); }); }
  pp = [ makeTarget(hdr), makeTarget(hdr) ];
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(2, Math.floor(innerWidth*dpr)), h = Math.max(2, Math.floor(innerHeight*dpr));
  if(w===W && h===H) return false;
  W=w; H=h; canvas.width=W; canvas.height=H;
  if(current && current.type==='pingpong') allocPingPong(current.hdr);
  frame=0;
  return true;
}
window.addEventListener('resize', resize);

//------------------------------------------------------------------ palette
let paletteTex = gl.createTexture();
function setPaletteStops(stops){ // stops: array of [r,g,b] 0..255
  const N = 256, data = new Uint8Array(N*4);
  const n = stops.length;
  for(let i=0;i<N;i++){
    const f = i/(N-1)*(n-1), a = Math.floor(f), b = Math.min(n-1,a+1), t = f-a;
    for(let c=0;c<3;c++) data[i*4+c] = Math.round(stops[a][c]*(1-t)+stops[b][c]*t);
    data[i*4+3]=255;
  }
  gl.bindTexture(gl.TEXTURE_2D, paletteTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,N,1,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
// built-in default palette (turbo-ish) until palettes.json loads
let PALETTES = [{name:'turbo', stops:[[48,18,59],[70,107,227],[40,187,210],[100,222,98],[230,210,55],[250,130,40],[185,40,30],[122,4,3]]}];
let paletteIndex = 0;
setPaletteStops(PALETTES[0].stops);

//------------------------------------------------------------------ input
let mouseX=0, mouseY=0;
canvas.addEventListener('pointermove', e=>{ const dpr=Math.min(devicePixelRatio||1,2);
  mouseX=e.clientX*dpr; mouseY=(innerHeight-e.clientY)*dpr; });

//------------------------------------------------------------------ registry
const MODES = [];
function register(def){
  if(!def || !def.name || !def.type){ console.warn('bad mode def', def); return; }
  def.params = def.params || [];
  MODES.push(def);
}

//------------------------------------------------------------------ runtime state
let current=null, prog=null, dispProg=null, locs={}, state=null, frame=0, startT=performance.now();
const params = {};

// cache uniform locations per program (lookups every frame were a real perf cost)
const _ulocCache = new WeakMap();
function uloc(program, name){
  let m=_ulocCache.get(program); if(!m){ m=new Map(); _ulocCache.set(program,m); }
  if(m.has(name)) return m.get(name);
  const l=gl.getUniformLocation(program,name); m.set(name,l); return l;
}
function setCommon(program){
  const u=(n)=>uloc(program,n);
  gl.uniform1f(u('u_time'), (performance.now()-startT)/1000);
  gl.uniform2f(u('u_resolution'), W, H);
  gl.uniform2f(u('u_mouse'), mouseX, mouseY);
  gl.uniform1i(u('u_frame'), frame);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, paletteTex);
  gl.uniform1i(u('u_palette'), 1);
}
function setParamUniforms(program){
  for(const p of current.params){ const l=uloc(program,p.key); if(l) gl.uniform1f(l, params[p.key]); }
}
function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null); }
function toScreen(){ gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H); }
function clear(r,g,b,a){ gl.clearColor(r,g,b,a||1); gl.clear(gl.COLOR_BUFFER_BIT); }
// blit a 2D canvas (or image) full-screen — for 'cpu' modes that draw with Canvas2D
let blit2DTex=null, blit2DW=0, blit2DH=0;
function present2D(src){
  gl.activeTexture(gl.TEXTURE0);
  if(!blit2DTex){
    blit2DTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, blit2DTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);   // sticky — set once
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  } else gl.bindTexture(gl.TEXTURE_2D, blit2DTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);                        // scoped: global pixelStore state
  if(src.width!==blit2DW || src.height!==blit2DH){                     // (re)allocate only on size change
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE, src); blit2DW=src.width; blit2DH=src.height;
  } else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  toScreen(); gl.useProgram(BLIT);
  gl.uniform2f(uloc(BLIT,'u_resolution'),W,H);
  gl.uniform1i(uloc(BLIT,'u_tex'),0);
  drawQuad();
}

// ---- shared helpers hoisted from mode modules (dedup) ----------------------
// deterministic RNG (mulberry32) so a 'seed' param reproducibly varies output
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
// additive round GL_POINTS renderer coloured through the palette (points modes)
const PTS_VS = `#version 300 es
in vec3 pos; uniform float u_psize; out float v_t;
void main(){ gl_Position=vec4(pos.xy,0.,1.); gl_PointSize=u_psize; v_t=pos.z; }`;
const PTS_FS = `#version 300 es
precision highp float; in float v_t; out vec4 o;
uniform sampler2D u_pal; uniform float u_alpha;
void main(){ vec2 d=gl_PointCoord-0.5; float r=dot(d,d); if(r>0.25) discard;
  o=vec4(texture(u_pal,vec2(clamp(v_t,0.0,1.0),0.5)).rgb, u_alpha*(1.0-r*4.0)); }`;
function ptsMake(maxPoints){
  const MAX=maxPoints||120000, prog=buildProgramVF(PTS_VS,PTS_FS);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER, MAX*3*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  return {prog,vao,buf,MAX,data:new Float32Array(MAX*3)};
}
function ptsDraw(g,count,psize,alpha){
  toScreen(); clear(0,0,0,1); if(count<=0) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(g.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, paletteTex);
  gl.uniform1i(uloc(g.prog,'u_pal'),1); gl.uniform1f(uloc(g.prog,'u_psize'),psize);
  gl.uniform1f(uloc(g.prog,'u_alpha'), alpha==null?1.0:alpha);
  gl.bindVertexArray(g.vao); gl.drawArrays(gl.POINTS,0,Math.min(count,g.MAX)); gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}
function ptsDispose(g){ gl.deleteBuffer(g.buf); gl.deleteVertexArray(g.vao); gl.deleteProgram(g.prog); }

// ---- WebAudio for Music modes (lazy AudioContext; resumes on first gesture) --
let _ac=null, _master=null, _beeps=0;
function audio(){
  if(_ac===false) return null;
  if(!_ac){ try{
      _ac=new (window.AudioContext||window.webkitAudioContext)();
      _master=_ac.createGain(); _master.gain.value=0.25;
      const comp=_ac.createDynamicsCompressor();          // limiter so chords don't clip
      _master.connect(comp); comp.connect(_ac.destination);
    }catch(e){ _ac=false; return null; } }
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
// play one enveloped note. freq Hz, dur s, gain 0..1, type oscillator wave.
function beep(freq, dur, gain, type){
  const ac=audio(); if(!ac||!_master||!isFinite(freq)) return;
  freq=Math.max(20,Math.min(8000,freq)); const t=ac.currentTime, d=dur||0.25;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain==null?0.2:gain), t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);

// Synchronous self-test: drives step() directly so it is immune to background-tab

function selfTestSync(warmFrames){

// Slideshow: every 2s advance to the next mode AND the next palette. Palette

let cycleOn=false, cycleTimer=null, cycleStart=0, cyBtn=null;
const CYCLE_MS=2000;
function updateCycleRing(){ if(cycleOn && cyBtn){ const pr=Math.min(1,(performance.now()-cycleStart)/CYCLE_MS); cyBtn.style.setProperty('--p', pr.toFixed(3)); } }
function setCycle(on){
  cycleOn=on;
  if(cyBtn){ cyBtn.classList.toggle('on', on); if(!on) cyBtn.style.setProperty('--p','0'); }

function cycleStep(){
  cycleStart=performance.now();                                       // reset cooldown ring
  const sel=document.getElementById('mode'); const idx=sel?(+sel.value):0;

  // black at low t and many modes sit there, so a blind loop would show black.
  if(PALETTES.length>1){

    }

<script>
/* b1.js — Cellular Automata > 1D family (pingpong scroll-buffer waterfalls).
   Each mode evolves a 1D row of cells; successive generations stream upward so
   the screen shows the classic space-time diagram. State is stored in the
   pingpong backbuffer: the bottom scan-row holds the live generation, every
   other row is a copy of the row below it from the previous frame (a vertical
   scroll). New generation is computed at the bottom from the previous bottom row.

   Encoding (RGBA8 backbuffer, read as 0..1):
     r  = cell value normalised to 0..1  (value = round(r*(states-1)))
     For 2nd-order modes we also stash the previous generation's value in g.
   Color is produced via palette(value/(states-1)) so sliders/palette both bite.

   IIFE; registers each mode once into window.VOC. */
(function(){
const R = window.VOC.register;
const CAT = 'Cellular Automata';

// State packing in the RGBA8 backbuffer:
//   The engine BLITs the destination texture straight to screen, so the texture
//   must already hold a displayable colour. We also need to read back the integer
//   cell VALUE for the next generation. We do both:
//       rgb = palette(normalisedValue)   (full-colour display)
//       a   = normalisedValue            (logic channel, read by neighbours)
//   The offscreen RGBA8 ping-pong targets preserve alpha, so cellVal() reads .a.
//   For second-order ("two steps back") rules the previous generation is simply
//   the row ONE ABOVE the live bottom row in the previous frame (it scrolled up),
//   so cellPrev() samples that row's alpha — no extra channel needed.
//
//   Layout: the live (newest) generation is the bottom scan-row (gl_FragCoord.y<1).
//   Every frame the whole image scrolls up one pixel; a fresh generation is
//   computed at the bottom from the previous bottom row. Result = the classic
//   1D space-time waterfall streaming upward.
//
// Each mode supplies `vec2 rule(cx,W,st)` returning vec2(newValue, unused) plus its
// uniforms and a states-count expression. buildFrag pastes the shared wrapper.
function buildFrag(extraUniforms, ruleGLSL, statesExpr){
  return `
${extraUniforms}
uniform float seedMode;
float hash11(float p){ return fract(sin(p*127.1+13.7)*43758.5453123); }
float STATES(){ return ${statesExpr}; }
// normalised value (0..1) of cell at column cx on the live bottom row of prev frame
float cellVal(float cx, float W){
  float x = clamp(cx, 0.0, W-1.0);
  vec2 uv = vec2((x+0.5)/W, 0.5/u_resolution.y);
  return texture(u_backbuffer, uv).a;
}
// previous-generation value: cell at column cx on the row ABOVE the live row (t-1)
vec2 cellVP(float cx, float W){
  float x = clamp(cx, 0.0, W-1.0);
  float cur  = texture(u_backbuffer, vec2((x+0.5)/W, 0.5/u_resolution.y)).a;
  float prev = texture(u_backbuffer, vec2((x+0.5)/W, 1.5/u_resolution.y)).a;
  return vec2(cur, prev);
}
${ruleGLSL}
vec4 emit(float nval){
  float st = STATES();
  float n = (st>1.0)? clamp(nval,0.0,st-1.0)/(st-1.0) : clamp(nval,0.0,1.0);
  vec3 col = palette(n);
  return vec4(col, n);   // rgb = display colour, a = normalised value
}
void main(){
  vec2 fc = gl_FragCoord.xy;
  float W = u_resolution.x;
  float st = STATES();
  if(u_frame==0){
    float v;
    if(fc.y < 1.0){
      if(seedMode < 0.5){ v = (abs(fc.x - floor(W*0.5)) < 0.5) ? (st-1.0) : 0.0; }
      else { v = floor(hash11(fc.x+7.0)*st); v = clamp(v,0.0,st-1.0); }
    } else {
      v = 0.0;   // fill the rest of the screen with the background state colour
    }
    gl_FragColor = emit(v);
    return;
  }
  if(fc.y >= 1.0){
    vec2 uv = vec2(fc.x/W, (fc.y-1.0)/u_resolution.y);
    gl_FragColor = texture(u_backbuffer, uv);   // scroll up
    return;
  }
  float cx = floor(fc.x);
  vec2 r = rule(cx, W, st);
  gl_FragColor = emit(r.x);
}
`;
}

//============================================================ 1D Cellular Automata
// Wolfram elementary CA: 8-bit rule (default 30). 2 states. Neighbourhood {l,c,r}.
R({
  name:'1D Cellular Automata', category:CAT, type:'pingpong',
  params:[ {key:'ruleNumber',label:'rule number',min:0,max:255,step:1,value:30},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float ruleNumber;`,
    `vec2 rule(float cx, float W, float st){
        float l = step(0.5, cellVal(cx-1.0,W));
        float c = step(0.5, cellVal(cx    ,W));
        float r = step(0.5, cellVal(cx+1.0,W));
        float idx = l*4.0 + c*2.0 + r;       // 0..7
        // bit (idx) of ruleNumber
        float bit = floor(mod(floor(ruleNumber / pow(2.0, idx)), 2.0));
        return vec2(bit, c);
     }`,
    `2.0`)
});

//============================================================ 1D Cellular Automata 2
// Variant: 4-state, the rule maps the SUM tendency but keeps elementary flavour by
// using two independent elementary rules on two bitplanes -> richer texture.
R({
  name:'1D Cellular Automata 2', category:CAT, type:'pingpong',
  params:[ {key:'ruleA',label:'rule A',min:0,max:255,step:1,value:90},
           {key:'ruleB',label:'rule B',min:0,max:255,step:1,value:110},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:1} ],
  frag: buildFrag(
    `uniform float ruleA, ruleB;`,
    `float elem(float l, float c, float r, float rule){
        float idx = l*4.0 + c*2.0 + r;
        return floor(mod(floor(rule / pow(2.0, idx)), 2.0));
     }
     vec2 rule(float cx, float W, float st){
        // decode 4-state value into two bits (bit0,bit1)
        float vl = floor(cellVal(cx-1.0,W)*(st-1.0)+0.5);
        float vc = floor(cellVal(cx    ,W)*(st-1.0)+0.5);
        float vr = floor(cellVal(cx+1.0,W)*(st-1.0)+0.5);
        float l0=mod(vl,2.0), c0=mod(vc,2.0), r0=mod(vr,2.0);
        float l1=floor(vl/2.0), c1=floor(vc/2.0), r1=floor(vr/2.0);
        float b0 = elem(l0,c0,r0, ruleA);
        float b1 = elem(l1,c1,r1, ruleB);
        return vec2(b0 + 2.0*b1, vc);
     }`,
    `4.0`)
});

//============================================================ 1D Totalistic CA
// k-colour totalistic: next state depends only on the SUM of the 3 neighbours.
// Rule number is decoded in base-k over the possible sums (0..3*(k-1)).
R({
  name:'1D Totalistic CA', category:CAT, type:'pingpong',
  params:[ {key:'ruleNumber',label:'rule number',min:0,max:9841,step:1,value:777},
           {key:'states',label:'colors',min:2,max:4,step:1,value:3},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float ruleNumber, states;`,
    `vec2 rule(float cx, float W, float st){
        float vl = floor(cellVal(cx-1.0,W)*(st-1.0)+0.5);
        float vc = floor(cellVal(cx    ,W)*(st-1.0)+0.5);
        float vr = floor(cellVal(cx+1.0,W)*(st-1.0)+0.5);
        float sum = vl+vc+vr;                 // 0 .. 3*(st-1)
        // digit number 'sum' of ruleNumber in base st
        float digit = mod(floor(ruleNumber / pow(st, sum)), st);
        return vec2(floor(digit), vc);
     }`,
    `floor(states)`)
});

//============================================================ Cascade CA
// "Cascade": a totalistic-style rule where new state = (sum of neighbourhood +
// rule offset) folded modulo states — produces cascading diagonal triangles.
R({
  name:'Cascade CA', category:CAT, type:'pingpong',
  params:[ {key:'states',label:'colors',min:3,max:8,step:1,value:5},
           {key:'offset',label:'cascade offset',min:0,max:7,step:1,value:1},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float states, offset;`,
    `vec2 rule(float cx, float W, float st){
        float vl = floor(cellVal(cx-1.0,W)*(st-1.0)+0.5);
        float vc = floor(cellVal(cx    ,W)*(st-1.0)+0.5);
        float vr = floor(cellVal(cx+1.0,W)*(st-1.0)+0.5);
        float nv = mod(vl + vc + vr + offset, st);
        return vec2(nv, vc);
     }`,
    `floor(states)`)
});

//============================================================ Combinations CA
// Rule keys off the multiset combination (min/max/centre) of the neighbourhood:
// next = f(centre, min, max). Uses rule bits over a small index space.
R({
  name:'Combinations CA', category:CAT, type:'pingpong',
  params:[ {key:'states',label:'colors',min:2,max:6,step:1,value:4},
           {key:'ruleNumber',label:'rule number',min:0,max:4096,step:1,value:1387},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:1} ],
  frag: buildFrag(
    `uniform float states, ruleNumber;`,
    `vec2 rule(float cx, float W, float st){
        float vl = floor(cellVal(cx-1.0,W)*(st-1.0)+0.5);
        float vc = floor(cellVal(cx    ,W)*(st-1.0)+0.5);
        float vr = floor(cellVal(cx+1.0,W)*(st-1.0)+0.5);
        float mn = min(vl, min(vc, vr));
        float mx = max(vl, max(vc, vr));
        // index from (centre, min, max) compressed, then pick digit base st
        float idx = mod(vc*7.0 + mn*3.0 + mx, 11.0);
        float digit = mod(floor(ruleNumber / pow(st, mod(idx,4.0))) + idx, st);
        return vec2(floor(digit), vc);
     }`,
    `floor(states)`)
});

//============================================================ Extended Neighborhood CA
// Totalistic rule over a wider radius-R neighbourhood (default r=2 => 5 cells).
R({
  name:'Extended Neighborhood CA', category:CAT, type:'pingpong',
  params:[ {key:'radius',label:'radius',min:1,max:4,step:1,value:2},
           {key:'states',label:'colors',min:2,max:4,step:1,value:2},
           {key:'ruleNumber',label:'rule number',min:0,max:65535,step:1,value:6203},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float radius, states, ruleNumber;`,
    `vec2 rule(float cx, float W, float st){
        float rad = floor(radius);
        float sum = 0.0;
        for(int i=-4;i<=4;i++){
          if(abs(float(i)) > rad) continue;
          sum += floor(cellVal(cx+float(i),W)*(st-1.0)+0.5);
        }
        // totalistic over sum range 0 .. (2*rad+1)*(st-1)
        float digit = mod(floor(ruleNumber / pow(st, sum)), st);
        return vec2(floor(digit), floor(cellVal(cx,W)*(st-1.0)+0.5));
     }`,
    `floor(states)`)
});

//============================================================ Next Nearest Neighbor CA
// Elementary-style rule but neighbourhood is {l2,l1,c,r1,r2} reduced to a 32-entry
// table via a packed rule number split across two 8-bit halves of an outer rule.
R({
  name:'Next Nearest Neighbor CA', category:CAT, type:'pingpong',
  params:[ {key:'ruleLo',label:'rule low 8',min:0,max:255,step:1,value:30},
           {key:'ruleHi',label:'rule high (l2,r2 mix)',min:0,max:255,step:1,value:150},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float ruleLo, ruleHi;`,
    `vec2 rule(float cx, float W, float st){
        float l2= step(0.5, cellVal(cx-2.0,W));
        float l1= step(0.5, cellVal(cx-1.0,W));
        float c = step(0.5, cellVal(cx    ,W));
        float r1= step(0.5, cellVal(cx+1.0,W));
        float r2= step(0.5, cellVal(cx+2.0,W));
        // inner elementary from {l1,c,r1}
        float innerIdx = l1*4.0 + c*2.0 + r1;
        float inner = floor(mod(floor(ruleLo / pow(2.0, innerIdx)), 2.0));
        // outer modulation from {l2,r2}
        float outerIdx = l2*2.0 + r2;
        float outer = floor(mod(floor(ruleHi / pow(2.0, outerIdx + innerIdx*0.0 + l2*0.0)), 2.0));
        // combine: XOR inner with outer-gated bit
        float bit = mod(inner + outer*step(0.5, l2+r2), 2.0);
        return vec2(bit, c);
     }`,
    `2.0`)
});

//============================================================ Traffic CA
// Rule 184 traffic flow. Cell=1 (car) moves right into empty cell.
//   next(i) = 1 if (car at i and car at i+1) OR (no car at i and car at i-1)
R({
  name:'Traffic CA', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'car density',min:0.1,max:0.9,step:0.01,value:0.45},
           {key:'seedMode',label:'seed (force random)',min:1,max:1,step:1,value:1} ],
  frag: buildFrag(
    `uniform float density;`,
    `float carSeed(float cx){ return (fract(sin(cx*91.7+3.3)*49157.0) < density) ? 1.0 : 0.0; }
     vec2 rule(float cx, float W, float st){
        float c  = step(0.5, cellVal(cx    ,W));
        float l  = step(0.5, cellVal(cx-1.0,W));
        float r  = step(0.5, cellVal(cx+1.0,W));
        // Rule 184
        float nv;
        if(c > 0.5){ nv = (r > 0.5) ? 1.0 : 0.0; }   // car stays only if blocked ahead
        else       { nv = (l > 0.5) ? 1.0 : 0.0; }   // empties fill from car behind
        return vec2(nv, c);
     }`,
    `2.0`)
});

//============================================================ Two Steps Back CA
// Second-order elementary CA: next = elementary(l,c,r) XOR previousGeneration(c).
// Reversible CA family. Needs the previous generation's value (stored in blue).
R({
  name:'Two Steps Back CA', category:CAT, type:'pingpong',
  params:[ {key:'ruleNumber',label:'rule number',min:0,max:255,step:1,value:90},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float ruleNumber;`,
    `vec2 rule(float cx, float W, float st){
        float l = step(0.5, cellVal(cx-1.0,W));
        float c = step(0.5, cellVal(cx    ,W));
        float r = step(0.5, cellVal(cx+1.0,W));
        float prevC = step(0.5, cellVP(cx,W).y);   // generation t-1
        float idx = l*4.0 + c*2.0 + r;
        float bit = floor(mod(floor(ruleNumber / pow(2.0, idx)), 2.0));
        float nv = mod(bit + prevC, 2.0);          // XOR with two-steps-back
        return vec2(nv, c);                        // store current c as new prev
     }`,
    `2.0`)
});

//============================================================ Two Steps Back Extended CA
// Second-order totalistic over radius-2, multi-state, subtract previous gen mod k.
R({
  name:'Two Steps Back Extended CA', category:CAT, type:'pingpong',
  params:[ {key:'states',label:'colors',min:2,max:5,step:1,value:3},
           {key:'ruleNumber',label:'rule number',min:0,max:9841,step:1,value:5310},
           {key:'radius',label:'radius',min:1,max:3,step:1,value:2},
           {key:'seedMode',label:'seed (0=point,1=random)',min:0,max:1,step:1,value:0} ],
  frag: buildFrag(
    `uniform float states, ruleNumber, radius;`,
    `vec2 rule(float cx, float W, float st){
        float rad = floor(radius);
        float sum = 0.0;
        for(int i=-3;i<=3;i++){
          if(abs(float(i)) > rad) continue;
          sum += floor(cellVal(cx+float(i),W)*(st-1.0)+0.5);
        }
        float digit = mod(floor(ruleNumber / pow(st, sum)), st);
        float prevC = floor(cellVP(cx,W).y*(st-1.0)+0.5);
        float nv = mod(digit - prevC + st, st);    // reversible second-order step
        float c  = floor(cellVal(cx,W)*(st-1.0)+0.5);
        return vec2(nv, c);
     }`,
    `floor(states)`)
});

})();

<script>
/* b10.js — Agent-Based Modelling (particles archetype, CPU-simulated).
   Modes: 2D Particle Life, Physarum, Physarum 2, Primordial Particle Systems.
   Each mode CPU-simulates agents into an offscreen 2D canvas every frame and
   presents it via api.present2D (the robust path described in the cookbook).
   Grids/agent counts are capped for speed; all params are wired to sliders and
   actually drive the simulation. */
(function(){
const R = window.VOC.register;

// deterministic RNG so seeds reproduce now lives in the engine as api.rng.
function hsv2rgb(h,s,v){ // h 0..1
  const i=Math.floor(h*6), f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0: r=v;g=t;b=p;break; case 1: r=q;g=v;b=p;break;
    case 2: r=p;g=v;b=t;break; case 3: r=p;g=q;b=v;break;
    case 4: r=t;g=p;b=v;break; default: r=v;g=p;b=q;break;
  }
  return [r*255,g*255,b*255];
}

//============================================================ 2D Particle Life
R({
  name:'2D Particle Life', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'numParticles', label:'particles',    min:100, max:1200, step:10,   value:600},
    {key:'particleTypes',label:'types',        min:2,   max:8,    step:1,    value:5},
    {key:'minAttraction',label:'min attract',  min:-1,  max:0,    step:.001, value:-0.557},
    {key:'maxAttraction',label:'max attract',  min:0,   max:1,    step:.001, value:0.770},
    {key:'forceRadius',  label:'force radius',  min:20,  max:120,  step:1,    value:60},
    {key:'friction',     label:'friction',     min:0,   max:.5,   step:.005, value:0.05},
    {key:'displayRadius',label:'dot radius',   min:1,   max:8,    step:.5,   value:3},
    {key:'seed',         label:'seed',         min:1,   max:9999, step:1,    value:137},
  ],
  init(api){
    const c=document.createElement('canvas'); c.width=api.W; c.height=api.H;
    return {c, ctx:c.getContext('2d'), key:'', N:0, x:null,y:null,vx:null,vy:null,t:null, mat:null, P:0, cols:null};
  },
  reset(api,st){ st.key=''; },
  frame(api,st){
    const p=api.params;
    if(st.c.width!==api.W||st.c.height!==api.H){ st.c.width=api.W; st.c.height=api.H; st.key=''; }
    const W=st.c.width, H=st.c.height;
    const N=Math.round(p.numParticles)|0, P=Math.round(p.particleTypes)|0;
    const key=[N,P,p.minAttraction,p.maxAttraction,p.seed].join(',');
    if(key!==st.key){
      const rnd=api.rng((p.seed|0)*2654435761>>>0);
      st.N=N; st.P=P;
      st.x=new Float32Array(N); st.y=new Float32Array(N);
      st.vx=new Float32Array(N); st.vy=new Float32Array(N); st.t=new Uint8Array(N);
      for(let i=0;i<N;i++){ st.x[i]=rnd()*W; st.y[i]=rnd()*H; st.t[i]=(rnd()*P)|0; }
      // attraction matrix P*P in [min,max]
      st.mat=new Float32Array(P*P);
      for(let i=0;i<P*P;i++) st.mat[i]=p.minAttraction+(p.maxAttraction-p.minAttraction)*rnd();
      st.cols=[]; for(let k=0;k<P;k++) st.cols.push(hsv2rgb(k/P,0.85,1.0));
      // black background to start
      st.ctx.fillStyle='#000'; st.ctx.fillRect(0,0,W,H);
      st.key=key;
    }
    const x=st.x,y=st.y,vx=st.vx,vy=st.vy,t=st.t,mat=st.mat;
    const Pn=st.P, rmax=p.forceRadius, rmax2=rmax*rmax, beta=0.3, fric=1-p.friction;
    // O(N^2) force accumulation (N<=1200 capped)
    for(let i=0;i<N;i++){
      let fx=0,fy=0; const xi=x[i],yi=y[i],ti=t[i];
      for(let j=0;j<N;j++){
        if(j===i) continue;
        let dx=x[j]-xi, dy=y[j]-yi;
        // wraparound shortest delta
        if(dx>W*.5)dx-=W; else if(dx<-W*.5)dx+=W;
        if(dy>H*.5)dy-=H; else if(dy<-H*.5)dy+=H;
        const d2=dx*dx+dy*dy;
        if(d2>=rmax2||d2<1e-4) continue;
        const d=Math.sqrt(d2), r=d/rmax;
        let f;
        if(r<beta){ f=r/beta-1.0; }              // close-range repulsion
        else { const a=mat[ti*Pn+t[j]]; f=a*(1.0-Math.abs(2.0*r-1.0-beta)/(1.0-beta)); }
        fx+=dx/d*f; fy+=dy/d*f;
      }
      vx[i]=(vx[i]+fx*rmax*0.08)*fric;
      vy[i]=(vy[i]+fy*rmax*0.08)*fric;
    }
    for(let i=0;i<N;i++){
      x[i]+=vx[i]; y[i]+=vy[i];
      if(x[i]<0)x[i]+=W; else if(x[i]>=W)x[i]-=W;
      if(y[i]<0)y[i]+=H; else if(y[i]>=H)y[i]-=H;
    }
    // fade-trace render
    const ctx=st.ctx; ctx.globalAlpha=0.18; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1.0;
    const rad=p.displayRadius;
    for(let i=0;i<N;i++){
      const c=st.cols[t[i]];
      ctx.fillStyle='rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
      ctx.beginPath(); ctx.arc(x[i],y[i],rad,0,6.2832); ctx.fill();
    }
    api.present2D(st.c);
  },
});

//---------- shared physarum simulator (single channel) -------------------
function physarumStep(st, p, depositKey){
  const {gw,gh}=st;
  const trail=st.trail, ax=st.ax, ay=st.ay, ah=st.ah, N=st.N;
  const senseA=p.senseAngle*Math.PI/180, turnA=p.turnAngle*Math.PI/180;
  const senseD=p.senseDistance, moveD=p.moveDistance, dep=p.depositAmount, lowest=st.lowest;
  function sample(px,py){
    let ix=px|0, iy=py|0;
    if(ix<0)ix+=gw; else if(ix>=gw)ix-=gw;
    if(iy<0)iy+=gh; else if(iy>=gh)iy-=gh;
    return trail[iy*gw+ix];
  }
  for(let i=0;i<N;i++){
    const a=ah[i], px=ax[i], py=ay[i];
    const fx=Math.cos(a), fy=Math.sin(a);
    const lc=Math.cos(a-senseA), ls=Math.sin(a-senseA);
    const rc=Math.cos(a+senseA), rs=Math.sin(a+senseA);
    const sF=sample(px+fx*senseD, py+fy*senseD);
    const sL=sample(px+lc*senseD, py+ls*senseD);
    const sR=sample(px+rc*senseD, py+rs*senseD);
    let na=a;
    if(!lowest){
      if(sF>sL && sF>sR){}
      else if(sF<sL && sF<sR){ na += (st.rng()<0.5? turnA:-turnA); }
      else if(sL<sR){ na += turnA; }
      else if(sR<sL){ na -= turnA; }
    } else {
      if(sF<sL && sF<sR){}
      else if(sF>sL && sF>sR){ na += (st.rng()<0.5? turnA:-turnA); }
      else if(sL>sR){ na += turnA; }
      else if(sR>sL){ na -= turnA; }
    }
    let nx=px+Math.cos(na)*moveD, ny=py+Math.sin(na)*moveD;
    if(nx<0)nx+=gw; else if(nx>=gw)nx-=gw;
    if(ny<0)ny+=gh; else if(ny>=gh)ny-=gh;
    ax[i]=nx; ay[i]=ny; ah[i]=na;
    const gi=(ny|0)*gw+(nx|0);
    trail[gi]+=dep;
  }
  // evaporate + 3x3 box blur (separable, into tmp)
  const ev=1-p.evaporationRate, tmp=st.tmp;
  for(let yy=0;yy<gh;yy++){
    const ym=((yy-1+gh)%gh)*gw, yp=((yy+1)%gh)*gw, yc=yy*gw;
    for(let xx=0;xx<gw;xx++){
      const xm=(xx-1+gw)%gw, xp=(xx+1)%gw;
      const s=trail[yc+xm]+trail[yc+xx]+trail[yc+xp]
             +trail[ym+xm]+trail[ym+xx]+trail[ym+xp]
             +trail[yp+xm]+trail[yp+xx]+trail[yp+xp];
      tmp[yc+xx]=(s/9)*ev;
    }
  }
  st.trail=tmp; st.tmp=trail;
}

function physarumInit(api, lowest){
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  return {c, ctx, key:'', lowest, gw:0,gh:0, N:0, ax:null,ay:null,ah:null, trail:null, tmp:null, img:null, rng:Math.random};
}

function physarumAllocIfNeeded(api, st, p, numParticles){
  // grid scaled down from canvas for speed (cap ~360 wide)
  const maxW=360;
  const scale=Math.min(1, maxW/api.W);
  const gw=Math.max(64, Math.round(api.W*scale));
  const gh=Math.max(64, Math.round(api.H*scale));
  const key=[gw,gh,numParticles,(p.seed!==undefined?p.seed:0)].join(',');
  if(key===st.key) return;
  st.gw=gw; st.gh=gh; st.N=numParticles;
  st.c.width=gw; st.c.height=gh;
  st.trail=new Float32Array(gw*gh);
  st.tmp=new Float32Array(gw*gh);
  st.ax=new Float32Array(numParticles);
  st.ay=new Float32Array(numParticles);
  st.ah=new Float32Array(numParticles);
  const seed=(p.seed!==undefined? (p.seed|0):12345);
  const rnd=api.rng((seed*2246822519)>>>0);
  st.rng=rnd;
  for(let i=0;i<numParticles;i++){
    st.ax[i]=rnd()*gw; st.ay[i]=rnd()*gh; st.ah[i]=rnd()*6.2832; // whole screen start
  }
  st.img=st.ctx.createImageData(gw,gh);
  st.key=key;
}

//============================================================ Physarum
R({
  name:'Physarum', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'senseAngle',     label:'sense angle',  min:1,  max:90,  step:1,   value:10},
    {key:'senseDistance',  label:'sense dist',   min:1,  max:30,  step:.5,  value:8},
    {key:'turnAngle',      label:'turn angle',   min:1,  max:90,  step:1,   value:47},
    {key:'moveDistance',   label:'move dist',    min:.2, max:4,   step:.1,  value:1},
    {key:'depositAmount',  label:'deposit',      min:.2, max:6,   step:.01, value:2.520},
    {key:'evaporationRate',label:'evaporate',    min:.005,max:.2, step:.001,value:0.036},
    {key:'numParticles',   label:'particles',    min:500,max:8000,step:100, value:4000},
    {key:'seed',           label:'seed',         min:1,  max:9999,step:1,   value:42},
  ],
  init(api){ return physarumInit(api,false); },
  reset(api,st){ st.key=''; },
  frame(api,st){
    const p=api.params;
    physarumAllocIfNeeded(api, st, p, Math.round(p.numParticles)|0);
    physarumStep(st, p, 'd');
    // render gray-scale pheromone with palette tone
    const {gw,gh,trail,img}=st, d=img.data;
    // normalize against a soft cap
    let mx=1e-6; for(let i=0;i<trail.length;i++) if(trail[i]>mx)mx=trail[i];
    const inv=1/Math.max(mx*0.6, 0.5);
    for(let i=0;i<trail.length;i++){
      let v=trail[i]*inv; if(v>1)v=1;
      const g=Math.pow(v,0.7);
      const o=i*4;
      // yellow-ish particle color tint (R=G high, B low)
      d[o]=g*255; d[o+1]=g*245; d[o+2]=g*90; d[o+3]=255;
    }
    st.ctx.putImageData(img,0,0);
    api.present2D(st.c);
  },
});

//============================================================ Physarum 2 (RGB species)
R({

  params:[

    const N=Math.round(p.numParticles)|0;

    if(key!==st.key){
      st.gw=gw; st.gh=gh; st.c.width=gw; st.c.height=gh;
      st.img=st.ctx.createImageData(gw,gh);
      for(let s=0;s<3;s++){
        const seed=((p.seed|0)*131+s*977)>>>0;
        const rnd=api.rng((seed*2246822519)>>>0);
        const sp={gw,gh,N,lowest:true, ax:new Float32Array(N),ay:new Float32Array(N),ah:new Float32Array(N),

        for(let i=0;i<N;i++){ sp.ax[i]=rnd()*gw; sp.ay[i]=rnd()*gh; sp.ah[i]=rnd()*6.2832; }
        st.species[s]=sp;
      }
      st.key=key;
    }
    for(let s=0;s<3;s++) physarumStep(st.species[s], p, 'd');
    const img=st.img, d=img.data, n=gw*gh;
    const chan=[st.species[0].trail, st.species[1].trail, st.species[2].trail];

//============================================================ Primordial Particle Systems
R({
  name:'Primordial Particle Systems', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'particleCount',label:'particles',  min:100, max:1500, step:10,  value:800},
    {key:'radius',       label:'radius',     min:20,  max:200,  step:1,   value:100},
    {key:'velocity',     label:'velocity',   min:1,   max:30,   step:.5,  value:10},
    {key:'fixedRot',     label:'fixed rot',  min:-180,max:180,  step:1,   value:47},
    {key:'propRot',      label:'prop rot',   min:-5,  max:5,    step:.05, value:1},
    {key:'worldWidth',   label:'world width',min:300, max:2000, step:10,  value:1000},
    {key:'displayRadius',label:'dot radius', min:1,   max:8,    step:.5,  value:4},
    {key:'seed',         label:'seed',       min:1,   max:9999, step:1,   value:5},
  ],
  init(api){
    const c=document.createElement('canvas'); c.width=api.W; c.height=api.H;
    return {c, ctx:c.getContext('2d'), key:'', N:0, x:null,y:null,h:null, neigh:null, ww:0, scale:1};
  },
  reset(api,st){ st.key=''; },
  frame(api,st){
    const p=api.params;
    if(st.c.width!==api.W||st.c.height!==api.H){ st.c.width=api.W; st.c.height=api.H; st.key=''; }
    const W=st.c.width, H=st.c.height;
    const N=Math.round(p.particleCount)|0, ww=p.worldWidth, wh=ww*(H/W);
    const key=[N,p.worldWidth,p.seed].join(',');
    if(key!==st.key){
      st.N=N; st.ww=ww; st.wh=wh;
      st.x=new Float32Array(N); st.y=new Float32Array(N); st.h=new Float32Array(N);
      st.neigh=new Int32Array(N);
      const rnd=api.rng(((p.seed|0)*2654435761)>>>0);
      for(let i=0;i<N;i++){ st.x[i]=rnd()*ww; st.y[i]=rnd()*wh; st.h[i]=rnd()*6.2832; }
      st.ctx.fillStyle='#000'; st.ctx.fillRect(0,0,W,H);
      st.key=key;
    }
    const x=st.x,y=st.y,h=st.h,neigh=st.neigh;
    const r=p.radius, r2=r*r, alpha=p.fixedRot*Math.PI/180, beta=p.propRot*Math.PI/180, v=p.velocity;
    const wwL=st.ww, whL=st.wh;
    // count left/right neighbours within radius (O(N^2), N<=1500 capped)
    for(let i=0;i<N;i++){
      const xi=x[i],yi=y[i],hi=h[i];
      let L=0,Rr=0;
      const cosh=Math.cos(hi), sinh=Math.sin(hi);
      for(let j=0;j<N;j++){
        if(j===i) continue;
        let dx=x[j]-xi, dy=y[j]-yi;
        if(dx>wwL*.5)dx-=wwL; else if(dx<-wwL*.5)dx+=wwL;
        if(dy>whL*.5)dy-=whL; else if(dy<-whL*.5)dy+=whL;
        if(dx*dx+dy*dy>r2) continue;
        // cross product sign => left/right
        const cross=cosh*dy - sinh*dx;
        if(cross>0) L++; else Rr++;
      }
      neigh[i]=L+Rr;
      const tot=L+Rr;
      const dphi=alpha + beta*tot*Math.sign(Rr-L);
      h[i]=hi+dphi;
    }
    for(let i=0;i<N;i++){
      x[i]+=Math.cos(h[i])*v; y[i]+=Math.sin(h[i])*v;
      if(x[i]<0)x[i]+=wwL; else if(x[i]>=wwL)x[i]-=wwL;
      if(y[i]<0)y[i]+=whL; else if(y[i]>=whL)y[i]-=whL;
    }
    // render: color by neighbour density (PPS classic green/brown/blue/yellow bands)
    const ctx=st.ctx; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

      else if(n<15) col='rgb(150,110,60)';  // brown
      else if(n<35) col='rgb(70,130,230)';  // blue
      else col='rgb(240,220,60)';           // yellow (dense cell wall)
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x[i]*sx, y[i]*sy, rad, 0, 6.2832); ctx.fill();
    }
    api.present2D(st.c);
  },
});

})();

<script>
/* b11.js — Agent-Based Modelling batch (particles archetype).
   Modes: 2D Huegene, 2D Wa-Tor, Species.
   Each is a type:'custom' mode that CPU-simulates agents and draws GL_POINTS
   with per-vertex position + RGB color (mimics demo.js Clifford, but recomputes
   every frame). Registers into window.VOC. */
(function(){
const R = window.VOC.register;

//--------------------------------------------------------------- shared helpers
// A point program with per-vertex position (clip space) + color, fixed point size.
const PT_VS = `#version 300 es
in vec2 pos; in vec3 col; uniform float u_size; out vec3 v_col;
void main(){ gl_Position=vec4(pos,0.,1.); gl_PointSize=u_size; v_col=col; }`;
const PT_FS = `#version 300 es
precision highp float; in vec3 v_col; out vec4 o;
void main(){ o=vec4(v_col,1.0); }`;

// Build a points renderer: interleaved buffer [x,y,r,g,b] * N  (stride 20 bytes).
function makePoints(api, N){
  const gl=api.gl;
  const prog=api.buildProgramVF(PT_VS, PT_FS);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, N*5*4, gl.DYNAMIC_DRAW);
  const posL=gl.getAttribLocation(prog,'pos'), colL=gl.getAttribLocation(prog,'col');
  gl.enableVertexAttribArray(posL); gl.vertexAttribPointer(posL,2,gl.FLOAT,false,20,0);
  gl.enableVertexAttribArray(colL); gl.vertexAttribPointer(colL,3,gl.FLOAT,false,20,8);
  gl.bindVertexArray(null);
  return { prog, vao, buf, data:new Float32Array(N*5), cap:N };
}
function drawPointsState(api, pts, count, size){
  const gl=api.gl;
  gl.bindBuffer(gl.ARRAY_BUFFER, pts.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, pts.data.subarray(0, count*5));
  gl.useProgram(pts.prog);
  gl.uniform1f(gl.getUniformLocation(pts.prog,'u_size'), size);
  gl.bindVertexArray(pts.vao);
  gl.drawArrays(gl.POINTS, 0, count);
  gl.bindVertexArray(null);
}
function disposePoints(api, pts){
  const gl=api.gl; gl.deleteBuffer(pts.buf); gl.deleteVertexArray(pts.vao); gl.deleteProgram(pts.prog);
}
// HSV(0..1) -> RGB(0..1)
function hsv(h,s,v,out,o){
  h=(h%1+1)%1; const i=Math.floor(h*6), f=h*6-i;
  const p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s); let r,g,b;
  switch(i%6){ case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q; }
  out[o]=r; out[o+1]=g; out[o+2]=b;
}
// tiny deterministic PRNG (mulberry32)
function rng(seed){ let s=seed>>>0; return function(){ s|=0; s=s+0x6D2B79F5|0;
  let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

//=============================================================================
// 2D Huegene — plants spread with a mutating hue gene; herbivores graze them.
// Grid CA with genetics. Cell state: 0=empty, plant(hue,age), herbivore(hue,age,energy).
//=============================================================================
R({
  name:'2D Huegene', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'initialFill',         label:'initial fill %',   min:5,  max:90, step:1,   value:50},
    {key:'plantHueChange',      label:'plant hue mut',    min:0,  max:0.3,step:.005,value:0.1},
    {key:'plantPropagateAge',   label:'plant prop age',   min:1,  max:10, step:1,   value:2},
    {key:'herbivoreHueChange',  label:'herb hue mut',     min:0,  max:0.1,step:.001,value:0.001},
    {key:'herbivoreBreedAge',   label:'herb breed age',   min:1,  max:10, step:1,   value:1},
    {key:'herbivoreStarveTime', label:'herb starve',      min:2,  max:20, step:1,   value:5},
    {key:'cellSize',            label:'cell size',        min:3,  max:12, step:1,   value:5},
  ],
  init(api){
    const pts=makePoints(api, 1); // grown lazily to grid size
    return { pts, gw:0, gh:0, kind:null, hue:null, age:null, energy:null, count:0, key:'', seeded:false };
  },
  reset(api,st){ st.seeded=false; },
  frame(api,st){
    const gl=api.gl, p=api.params;
    const cs=Math.max(3, Math.round(p.cellSize));
    const gw=Math.max(8, Math.floor(api.W/cs)), gh=Math.max(8, Math.floor(api.H/cs));
    const ncell=gw*gh;
    // (re)allocate grid + point buffer on size change
    if(st.gw!==gw || st.gh!==gh){
      st.gw=gw; st.gh=gh;
      st.kind=new Uint8Array(ncell);   // 0 empty, 1 plant, 2 herbivore
      st.hue=new Float32Array(ncell);
      st.age=new Uint16Array(ncell);
      st.energy=new Int16Array(ncell);
      disposePoints(api, st.pts); st.pts=makePoints(api, ncell);
      st.seeded=false;
    }
    // seed reproducibly
    const seedKey=[gw,gh,p.initialFill].join(',');
    if(!st.seeded || seedKey!==st.key){
      const rnd=rng(0x51075|((gw*131+gh)>>>0));
      st.kind.fill(0); st.age.fill(0); st.energy.fill(0);
      const fill=p.initialFill/100;
      // central circle of plants, sprinkle herbivores
      const cx=gw/2, cy=gh/2, rad=Math.min(gw,gh)*0.35;
      for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
        const i=y*gw+x; const dx=x-cx, dy=y-cy;
        if(dx*dx+dy*dy<rad*rad && rnd()<fill){
          st.kind[i]=1; st.hue[i]=rnd(); st.age[i]=0;
        }
      }
      // herbivores: small count near center
      let herb=Math.max(4, Math.floor(ncell*0.002));
      while(herb-->0){ const i=(Math.floor(cy+ (rnd()-.5)*rad)*gw + Math.floor(cx+(rnd()-.5)*rad))|0;
        if(i>=0&&i<ncell){ st.kind[i]=2; st.hue[i]=rnd(); st.age[i]=0; st.energy[i]=p.herbivoreStarveTime|0; } }
      st.seeded=true; st.key=seedKey;
    }
    // ---- one CA step ----
    const {kind,hue,age,energy}=st;
    const rnd=rng((api.frame*2654435761)>>>0);
    const diag=false;
    const nx=[1,-1,0,0,1,1,-1,-1], ny=[0,0,1,-1,1,-1,1,-1];
    const nn=diag?8:4;
    const pHueChange=p.plantHueChange, hHueChange=p.herbivoreHueChange;
    const pPropAge=p.plantPropagateAge|0, hBreedAge=p.herbivoreBreedAge|0, hStarve=p.herbivoreStarveTime|0;
    // process herbivores first (eat/move/breed), then plant growth — into next arrays
    const nkind=new Uint8Array(ncell), nhue=new Float32Array(ncell),
          nage=new Uint16Array(ncell), nen=new Int16Array(ncell);
    // copy current state forward
    nkind.set(kind); nhue.set(hue); nage.set(age); nen.set(energy);
    // herbivores act
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; if(kind[i]!==2) continue;
      // already moved/handled in next? skip if cell changed kind away from herb
      if(nkind[i]!==2) continue;
      let ate=false, target=-1, empty=-1;
      const o=(rnd()*nn)|0;
      for(let k=0;k<nn;k++){
        const d=(o+k)%nn; let xx=x+nx[d], yy=y+ny[d];
        xx=(xx+gw)%gw; yy=(yy+gh)%gh; const j=yy*gw+xx;
        if(nkind[j]===1 && target<0) target=j;
        if(nkind[j]===0 && empty<0) empty=j;
      }
      let curEnergy=nen[i], curAge=nage[i], curHue=nhue[i];
      if(target>=0){ // eat plant -> move there
        curEnergy=hStarve; ate=true;
        curHue += (rnd()*2-1)*hHueChange;
        nkind[i]=0; // leave
        nkind[target]=2; nhue[target]=curHue; nage[target]=curAge+1; nen[target]=curEnergy;
        // breed back into old cell if old enough
        if(curAge>=hBreedAge){ nkind[i]=2; nhue[i]=curHue+(rnd()*2-1)*hHueChange; nage[i]=0; nen[i]=hStarve; }
      } else {
        curEnergy--; curAge++;
        if(curEnergy<=0){ nkind[i]=0; } // starved
        else if(empty>=0){ nkind[i]=0; nkind[empty]=2; nhue[empty]=curHue; nage[empty]=curAge; nen[empty]=curEnergy; }
        else { nage[i]=curAge; nen[i]=curEnergy; }
      }
    }
    // plants grow into empty neighbors when old enough
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; if(kind[i]!==1) continue;
      if(nkind[i]!==1) continue; // got eaten
      nage[i]=age[i]+1;
      if(nage[i]>=pPropAge){
        const d=(rnd()*nn)|0; let xx=(x+nx[d]+gw)%gw, yy=(y+ny[d]+gh)%gh; const j=yy*gw+xx;
        if(nkind[j]===0){ nkind[j]=1; nhue[j]=hue[i]+(rnd()*2-1)*pHueChange; nage[j]=0; }
      }
    }
    st.kind=nkind; st.hue=nhue; st.age=nage; st.energy=nen;
    // ---- render: each live cell -> one point at its grid center ----
    const data=st.pts.data; let c=0;
    const sx=2/gw, sy=2/gh;
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; const k=nkind[i]; if(k===0) continue;
      const px=(x+0.5)*sx-1, py=(y+0.5)*sy-1;
      const b=c*5; data[b]=px; data[b+1]=py;
      if(k===1){ hsv((nhue[i]%1+1)%1, 0.85, 0.9, data, b+2); }
      else { // herbivore: bright near-white tinted by hue
        hsv((nhue[i]%1+1)%1, 0.35, 1.0, data, b+2);
      }
      c++;
    }
    st.count=c;
    api.toScreen(); api.clear(0.02,0.02,0.03,1);
    gl.disable(gl.BLEND);
    drawPointsState(api, st.pts, c, cs);
  },
  dispose(api,st){ disposePoints(api, st.pts); }
});

//=============================================================================
// 2D Wa-Tor — classic predator/prey on a toroidal grid.
// Fish breed; sharks eat fish, breed, and starve. (Dewdney's Wa-Tor.)
//=============================================================================
R({
  name:'2D Wa-Tor', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'initialFish',    label:'initial fish %',  min:5,  max:90, step:1, value:60},
    {key:'initialFilled',  label:'world filled %',  min:5,  max:60, step:1, value:25},
    {key:'fishBreedAge',   label:'fish breed age',  min:1,  max:20, step:1, value:3},
    {key:'sharkBreedAge',  label:'shark breed age', min:2,  max:30, step:1, value:15},
    {key:'sharkStarve',    label:'shark starve',    min:3,  max:30, step:1, value:12},
    {key:'cellSize',       label:'cell size',       min:3,  max:14, step:1, value:6},
  ],
  init(api){
    const pts=makePoints(api, 1);
    return { pts, gw:0, gh:0, kind:null, age:null, energy:null, count:0, key:'', seeded:false };
  },
  reset(api,st){ st.seeded=false; },
  frame(api,st){
    const gl=api.gl, p=api.params;
    const cs=Math.max(3, Math.round(p.cellSize));
    const gw=Math.max(8, Math.floor(api.W/cs)), gh=Math.max(8, Math.floor(api.H/cs));
    const ncell=gw*gh;
    if(st.gw!==gw || st.gh!==gh){
      st.gw=gw; st.gh=gh;
      st.kind=new Uint8Array(ncell);   // 0 ocean, 1 fish, 2 shark
      st.age=new Uint16Array(ncell);
      st.energy=new Int16Array(ncell);
      disposePoints(api, st.pts); st.pts=makePoints(api, ncell);
      st.seeded=false;
    }
    const seedKey=[gw,gh,p.initialFish,p.initialFilled].join(',');
    if(!st.seeded || seedKey!==st.key){
      const rnd=rng(0xA7012|((gw*257+gh)>>>0));
      st.kind.fill(0); st.age.fill(0); st.energy.fill(0);
      const filled=p.initialFilled/100, fishFrac=p.initialFish/100;
      for(let i=0;i<ncell;i++){
        if(rnd()<filled){
          if(rnd()<fishFrac){ st.kind[i]=1; st.age[i]=(rnd()*p.fishBreedAge)|0; }
          else { st.kind[i]=2; st.age[i]=(rnd()*p.sharkBreedAge)|0; st.energy[i]=(1+rnd()*p.sharkStarve)|0; }
        }
      }
      st.seeded=true; st.key=seedKey;
    }
    const {kind,age,energy}=st;
    const fishBreed=p.fishBreedAge|0, sharkBreed=p.sharkBreedAge|0, sharkStarve=p.sharkStarve|0;
    const nx=[1,-1,0,0], ny=[0,0,1,-1];
    const rnd=rng((api.frame*40503 + 12345)>>>0);
    // Wa-Tor updates in place with a moved flag (process in random-ish scan).
    const moved=new Uint8Array(ncell);
    // sharks first
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; if(kind[i]!==2 || moved[i]) continue;
      let curAge=age[i]+1, curEn=energy[i]-1;
      if(curEn<=0){ kind[i]=0; age[i]=0; energy[i]=0; continue; } // starved
      // look for adjacent fish
      let fishCell=-1, emptyCell=-1; const o=(rnd()*4)|0;
      for(let k=0;k<4;k++){ const d=(o+k)&3; const xx=(x+nx[d]+gw)%gw, yy=(y+ny[d]+gh)%gh; const j=yy*gw+xx;
        if(!moved[j]){ if(kind[j]===1 && fishCell<0) fishCell=j; else if(kind[j]===0 && emptyCell<0) emptyCell=j; } }
      let dest=-1, ate=false;
      if(fishCell>=0){ dest=fishCell; ate=true; }
      else if(emptyCell>=0){ dest=emptyCell; }
      if(dest>=0){
        if(ate) curEn+=sharkStarve; // gain energy from fish
        kind[dest]=2; age[dest]=curAge; energy[dest]=curEn; moved[dest]=1;
        if(curAge>=sharkBreed){ kind[i]=2; age[i]=0; energy[i]=(curEn/2)|0; energy[dest]=(curEn/2)|0; age[dest]=0; moved[i]=1; }
        else { kind[i]=0; age[i]=0; energy[i]=0; }
      } else { age[i]=curAge; energy[i]=curEn; } // stay
    }
    // fish
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; if(kind[i]!==1 || moved[i]) continue;
      let curAge=age[i]+1;
      let emptyCell=-1; const o=(rnd()*4)|0;
      for(let k=0;k<4;k++){ const d=(o+k)&3; const xx=(x+nx[d]+gw)%gw, yy=(y+ny[d]+gh)%gh; const j=yy*gw+xx;
        if(!moved[j] && kind[j]===0){ emptyCell=j; break; } }
      if(emptyCell>=0){
        kind[emptyCell]=1; age[emptyCell]=curAge; moved[emptyCell]=1;
        if(curAge>=fishBreed){ kind[i]=1; age[i]=0; age[emptyCell]=0; moved[i]=1; }
        else { kind[i]=0; age[i]=0; }
      } else { age[i]=curAge; }
    }
    // render
    const data=st.pts.data; let c=0;
    const sx=2/gw, sy=2/gh;
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const i=y*gw+x; const k=kind[i]; if(k===0) continue;
      const px=(x+0.5)*sx-1, py=(y+0.5)*sy-1; const b=c*5; data[b]=px; data[b+1]=py;
      if(k===1){ data[b+2]=0.45; data[b+3]=0.95; data[b+4]=0.45; } // light green fish
      else { // shark: red(healthy)->blue->gray(starving) by energy
        const e=Math.max(0, Math.min(1, energy[i]/sharkStarve));
        if(e>0.5){ data[b+2]=0.95; data[b+3]=0.15; data[b+4]=0.15; }      // healthy red
        else if(e>0.2){ data[b+2]=0.25; data[b+3]=0.35; data[b+4]=0.95; } // normal blue
        else { data[b+2]=0.6; data[b+3]=0.6; data[b+4]=0.6; }            // starving gray
      }
      c++;
    }
    st.count=c;
    api.toScreen(); api.clear(0.0,0.0,0.02,1); // ocean ~ black
    gl.disable(gl.BLEND);
    drawPointsState(api, st.pts, c, cs);
  },
  dispose(api,st){ disposePoints(api, st.pts); }
});

//=============================================================================
// Species — particle-life style ecosystem (settings dialog not in source video,
// so per BUILD_SPEC we use Particle-Life-like agent defaults). N species with
// an asymmetric attraction matrix; agents flock/repel into emergent structures.
//=============================================================================
R({
  name:'Species', category:'Agent-Based Modelling', type:'custom',
  params:[
    {key:'numSpecies',  label:'species',     min:2,   max:6,   step:1,   value:5},
    {key:'attract',     label:'attraction',  min:-1,  max:1,   step:.01, value:0.55},
    {key:'radius',      label:'interact rad',min:30,  max:160, step:1,   value:90},
    {key:'friction',    label:'friction',    min:0.5, max:0.98,step:.01, value:0.85},
    {key:'force',       label:'force',       min:0.1, max:3,   step:.01, value:1.0},
    {key:'pointSize',   label:'point size',  min:1,   max:8,   step:1,   value:3},
  ],
  init(api){
    const N=1200;
    const pts=makePoints(api, N);
    return {
      pts, N,
      px:new Float32Array(N), py:new Float32Array(N),
      vx:new Float32Array(N), vy:new Float32Array(N),
      sp:new Uint8Array(N), mat:null, key:'', seeded:false, ns:0
    };
  },
  reset(api,st){ st.seeded=false; },
  frame(api,st){
    const gl=api.gl, p=api.params, N=st.N, W=api.W, H=api.H;
    const ns=Math.max(2, Math.min(6, Math.round(p.numSpecies)));
    // build attraction matrix from a deterministic seed + the attraction param
    const matKey=ns+'|'+p.attract.toFixed(3);
    if(!st.seeded || matKey!==st.key || st.ns!==ns){
      const rnd=rng(0x5EC1E5);
      st.mat=new Float32Array(ns*ns);
      for(let a=0;a<ns;a++)for(let b=0;b<ns;b++){
        // base random asymmetric matrix scaled toward the attraction slider
        st.mat[a*ns+b]=(rnd()*2-1)*0.6 + (a===b? p.attract*0.4 : p.attract*(rnd()*2-1));
      }
      // (re)seed particle positions only on first seed or species count change
      if(!st.seeded || st.ns!==ns){
        const r2=rng(0xABCDEF);
        for(let i=0;i<N;i++){
          st.px[i]=r2()*W; st.py[i]=r2()*H;
          st.vx[i]=0; st.vy[i]=0; st.sp[i]=(r2()*ns)|0;
        }
      }
      st.ns=ns; st.key=matKey; st.seeded=true;
    }
    const {px,py,vx,vy,sp,mat}=st;
    const Rad=p.radius, R2=Rad*Rad, fric=p.friction, F=p.force*0.08;
    // O(N^2) force accumulation (N=1200 -> ~1.44M pairs/frame, acceptable)
    for(let i=0;i<N;i++){
      let ax=0, ay=0; const xi=px[i], yi=py[i], si=sp[i]*ns;
      for(let j=0;j<N;j++){
        if(j===i) continue;
        let dx=px[j]-xi, dy=py[j]-yi;
        // toroidal wrap to nearest image
        if(dx> W*0.5) dx-=W; else if(dx<-W*0.5) dx+=W;
        if(dy> H*0.5) dy-=H; else if(dy<-H*0.5) dy+=H;
        const d2=dx*dx+dy*dy;
        if(d2>R2 || d2<1e-4) continue;
        const d=Math.sqrt(d2);
        const g=mat[si+sp[j]];
        // close-range repulsion + mid-range species-typed force
        let f;
        const beta=0.3*Rad;
        if(d<beta){ f=(d/beta - 1.0); }            // always repel when very close
        else { f=g*(1.0 - Math.abs(2.0*d-beta-Rad)/(Rad-beta)); }
        const inv=1.0/d;
        ax+=dx*inv*f; ay+=dy*inv*f;
      }
      vx[i]=(vx[i]+ax*F)*fric; vy[i]=(vy[i]+ay*F)*fric;
    }
    for(let i=0;i<N;i++){
      let x=px[i]+vx[i], y=py[i]+vy[i];
      if(x<0) x+=W; else if(x>=W) x-=W;
      if(y<0) y+=H; else if(y>=H) y-=H;
      px[i]=x; py[i]=y;
    }
    // render
    const data=st.pts.data; const col=new Float32Array(ns*3);
    for(let s=0;s<ns;s++) hsv(s/ns, 0.85, 1.0, col, s*3);
    for(let i=0;i<N;i++){
      const b=i*5; data[b]=px[i]/W*2-1; data[b+1]=py[i]/H*2-1;
      const cb=sp[i]*3; data[b+2]=col[cb]; data[b+3]=col[cb+1]; data[b+4]=col[cb+2];
    }
    api.toScreen(); api.clear(0.02,0.02,0.03,1);
    gl.disable(gl.BLEND);
    drawPointsState(api, st.pts, N, Math.max(1, Math.round(p.pointSize)));
  },
  dispose(api,st){ disposePoints(api, st.pts); }
});

})();
