<script>
/* b16.js — Fractals + Strange Attractors (points archetype).
   Modes: Buddhabrot, 2D Strange Attractors, 3D Strange Attractors,
   3D Strange Attractors 2.
   Each is a type:'custom' point-accumulation mode. CPU iterates the map/orbit
   into a Float32 buffer (recomputed only when params change), then draws
   additive GL_POINTS (gl.ONE, gl.ONE) coloured through the active palette.
   Mimics the Clifford Attractor reference in demo.js. */
(function(){
const R = window.VOC.register;

// Shared additive point shader: per-vertex packs a clip-space xy + a "t" value
// in 0..1 used to look up the palette colour (so depth/iteration can colour).
const VS = `#version 300 es
in vec2 pos; in float t; out float vt;
uniform float u_size;
void main(){ vt=t; gl_Position=vec4(pos,0.,1.); gl_PointSize=u_size; }`;
const FS = `#version 300 es
precision highp float; in float vt; out vec4 o;
uniform sampler2D u_pal; uniform float u_alpha;
void main(){ o=vec4(texture(u_pal,vec2(clamp(vt,0.,1.),0.5)).rgb, u_alpha); }`;

// build a points program + interleaved [x,y,t] buffer/VAO for N points
function makePoints(api, N){
  const gl=api.gl;
  const prog=api.buildProgramVF(VS,FS);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER, N*3*4, gl.DYNAMIC_DRAW);
  // stride = 3 floats: pos.xy at 0, t at 8
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,12,0);
  const tl=gl.getAttribLocation(prog,'t');
  if(tl>=0){ gl.enableVertexAttribArray(tl); gl.vertexAttribPointer(tl,1,gl.FLOAT,false,12,8); }
  gl.bindVertexArray(null);
  return {prog,vao,buf,N,data:new Float32Array(N*3),tloc:tl};
}
function drawPoints(api, st, alpha, size){
  const gl=api.gl;
  api.toScreen(); api.clear(0,0,0,1);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(st.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, api.paletteTex);
  gl.uniform1i(gl.getUniformLocation(st.prog,'u_pal'),1);
  gl.uniform1f(gl.getUniformLocation(st.prog,'u_alpha'), alpha);
  gl.uniform1f(gl.getUniformLocation(st.prog,'u_size'), size||1.0);
  gl.bindVertexArray(st.vao); gl.drawArrays(gl.POINTS,0,st.N); gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}
// cheap deterministic PRNG so output is stable & reproducible
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

//============================================================ Buddhabrot
// Iterate random complex c; only points that ESCAPE within maxIter contribute,
// and we plot every step of their orbit (the Buddhabrot signature). Symmetric
// about the real axis so we mirror each orbit point vertically.
R({
  name:'Buddhabrot', category:'Fractals', type:'custom',
  params:[ {key:'minIter',label:'min iterations',min:0,max:400,step:1,value:20},
           {key:'maxIter',label:'max iterations',min:50,max:2000,step:10,value:600},
           {key:'samples',label:'samples (k)',min:20,max:200,step:5,value:80},
           {key:'gain',label:'brightness',min:0.5,max:6,step:.1,value:2.0} ],
  init(api){ const st=makePoints(api, 200000*8); st.key=''; st.dirty=true; st.count=0; return st; },
  reset(api,st){ st.dirty=true; },
  frame(api,st){
    const p=api.params;
    const SAMPLES=Math.floor(p.samples)*1000;
    const minI=Math.floor(p.minIter), maxI=Math.floor(p.maxIter);
    const key=[SAMPLES,minI,maxI].join(',');
    if(st.dirty || key!==st.key){
      const d=st.data, cap=st.N; let w=0;
      const rnd=rng(1234567);
      const orbX=new Float32Array(maxI), orbY=new Float32Array(maxI);
      for(let s=0;s<SAMPLES && w+2<cap;s++){
        // sample c in the interesting region [-2.2,1.0] x [-1.4,1.4]
        const cr=-2.2+rnd()*3.2, ci=-1.4+rnd()*2.8;
        let zr=0,zi=0,n=0,esc=false;
        for(;n<maxI;n++){ const t=zr*zr-zi*zi+cr; zi=2*zr*zi+ci; zr=t; orbX[n]=zr; orbY[n]=zi;
          if(zr*zr+zi*zi>16.0){ esc=true; n++; break; } }
        if(!esc || n<minI) continue;
        // plot orbit: map complex plane to clip space. plane re in [-2.2,1.0]
        for(let i=0;i<n && w+2<cap;i++){
          const x=orbX[i], y=orbY[i];
          const cx=(x+0.6)/1.7, cyv=y/1.5;          // centre ~ -0.6, scale to ~[-1,1]
          if(cx<-1.05||cx>1.05) continue;
          const tcol=i/maxI;                          // colour by orbit depth
          d[w*3]=cx;   d[w*3+1]=cyv;  d[w*3+2]=tcol;  w++;
          d[w*3]=cx;   d[w*3+1]=-cyv; d[w*3+2]=tcol;  w++; // mirror (symmetry)
        }
      }
      st.count=w;
      const gl=api.gl; gl.bindBuffer(gl.ARRAY_BUFFER,st.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,d.subarray(0,Math.max(3,w*3)));
      st.dirty=false; st.key=key;
    }
    // draw only the filled portion
    const gl=api.gl;
    api.toScreen(); api.clear(0,0,0,1);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(st.prog);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, api.paletteTex);
    gl.uniform1i(gl.getUniformLocation(st.prog,'u_pal'),1);
    gl.uniform1f(gl.getUniformLocation(st.prog,'u_alpha'), 0.02*p.gain);
    gl.uniform1f(gl.getUniformLocation(st.prog,'u_size'), 1.0);
    gl.bindVertexArray(st.vao); gl.drawArrays(gl.POINTS,0,Math.max(1,st.count)); gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  },
  dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.buf); gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
});

//============================================================ 2D Strange Attractors
// Several classic 2D maps selectable by `attractor` index. Default settings echo
// the VoC dialog (A=-2.9585, B=-2.2965, C=-2.88029, D=-0.1622, Fractal Dream).
R({
  name:'2D Strange Attractors', category:'Strange Attractors', type:'custom',
  params:[ {key:'attractor',label:'attractor',min:0,max:5,step:1,value:0},
           {key:'A',label:'A',min:-3,max:3,step:.0001,value:-2.9585},
           {key:'B',label:'B',min:-3,max:3,step:.0001,value:-2.2965},
           {key:'C',label:'C',min:-3,max:3,step:.0001,value:-2.88029},
           {key:'D',label:'D',min:-3,max:3,step:.0001,value:-0.1622} ],
  init(api){ const st=makePoints(api, 400000); st.key=''; st.dirty=true; return st; },
  reset(api,st){ st.dirty=true; },
  frame(api,st){
    const p=api.params;
    const mode=Math.round(p.attractor)%6;
    const key=[mode,p.A,p.B,p.C,p.D].join(',');
    if(st.dirty || key!==st.key){
      const d=st.data,N=st.N; const A=p.A,B=p.B,C=p.C,D=p.D;
      let x=0.1,y=0.1, scale=0.32;
      for(let i=0;i<N;i++){
        let nx,ny;
        switch(mode){
          case 0: // Fractal Dream
            nx=Math.sin(y*B)+C*Math.sin(x*B); ny=Math.sin(x*A)+D*Math.sin(y*A); scale=0.38; break;
          case 1: // Clifford
            nx=Math.sin(A*y)+C*Math.cos(A*x); ny=Math.sin(B*x)+D*Math.cos(B*y); scale=0.33; break;
          case 2: // Peter de Jong
            nx=Math.sin(A*y)-Math.cos(B*x); ny=Math.sin(C*x)-Math.cos(D*y); scale=0.42; break;
          case 3: // Johnny Svensson
            nx=D*Math.sin(A*x)-Math.sin(B*y); ny=C*Math.cos(A*x)+Math.cos(B*y); scale=0.33; break;
          case 4: // Hopalong
            nx=y-1.0-Math.sqrt(Math.abs(B*x-1.0-C))*(x<0?-1:1); ny=A-x; scale=0.04; break;
          default:// Gumowski-Mira (mu = A)
            { const g=v=> A*v + 2*(1-A)*v*v/(1+v*v);
              nx=y+g(x); ny=-x+g(nx); scale=0.10; }
        }
        x=nx; y=ny;
        let cx=x*scale, cy=y*scale;
        if(!isFinite(cx)||!isFinite(cy)){ x=0.1; y=0.1; cx=0; cy=0; }
        cx=Math.max(-1,Math.min(1,cx)); cy=Math.max(-1,Math.min(1,cy));
        const aspect=api.W/api.H;
        d[i*3]=cx/Math.max(1,aspect); d[i*3+1]=cy; d[i*3+2]=fract(i/N+0.15);
      }
      const gl=api.gl; gl.bindBuffer(gl.ARRAY_BUFFER,st.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,d);
      st.dirty=false; st.key=key;
    }
    drawPoints(api,st,0.10,1.0);
  },
  dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.buf); gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
});

//============================================================ 3D Strange Attractors
// Discrete 3D polynomial maps (Quadratic / Cubic). Iterate in 3D, project with a
// rotating camera (u_time) and colour by depth (z). Default = Cubic.
R({
  name:'3D Strange Attractors', category:'Strange Attractors', type:'custom',
  params:[ {key:'attractor',label:'type',min:0,max:1,step:1,value:1}, // 0=Quadratic 1=Cubic
           {key:'spin',label:'rotation',min:0,max:2,step:.01,value:0.4},
           {key:'tilt',label:'tilt',min:-1,max:1,step:.01,value:0.35},
           {key:'seed',label:'variant',min:0,max:30,step:1,value:7} ],
  init(api){ const st=makePoints(api, 350000); st.key=''; st.dirty=true; st.pts=null; return st; },
  reset(api,st){ st.dirty=true; },
  frame(api,st){
    const p=api.params;
    const mode=Math.round(p.attractor)%2, seed=Math.round(p.seed);
    const key=[mode,seed].join(',');
    if(st.dirty || key!==st.key){
      // Random 3D polynomial maps usually diverge or collapse, so scan seeds
      // starting from `seed` until one yields a bounded, non-degenerate orbit.
      // Coefficients are scaled smaller for the cubic (it diverges more easily).
      const nco=mode===0?30:60;            // quadratic:10/dim*3 ; cubic:20/dim*3
      const amp=mode===0?1.2:0.9;
      const N=st.N; const pts=st.pts||(st.pts=new Float32Array(N*3));
      let mnx,mxx,mny,mxy,mnz,mxz, ok=false;
      for(let attempt=0; attempt<40 && !ok; attempt++){
        const rnd=rng(1000+(seed+attempt)*7919);
        const co=new Float32Array(nco); for(let i=0;i<nco;i++) co[i]=-amp+rnd()*amp*2;
        let x=0.05,y=0.05,z=0.05, bad=false;
        for(let k=0;k<300;k++){ const r=step3(mode,co,x,y,z); x=r[0];y=r[1];z=r[2];
          if(!isFinite(x)||!isFinite(y)||!isFinite(z)||Math.abs(x)+Math.abs(y)+Math.abs(z)>1e3){ bad=true; break; } }
        if(bad) continue;
        mnx=1e9;mxx=-1e9;mny=1e9;mxy=-1e9;mnz=1e9;mxz=-1e9;
        for(let i=0;i<N;i++){
          const r=step3(mode,co,x,y,z); x=r[0];y=r[1];z=r[2];
          if(!isFinite(x)||!isFinite(y)||!isFinite(z)||Math.abs(x)+Math.abs(y)+Math.abs(z)>1e3){ bad=true; break; }
          pts[i*3]=x; pts[i*3+1]=y; pts[i*3+2]=z;
          if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; if(z<mnz)mnz=z; if(z>mxz)mxz=z;
        }
        if(bad) continue;
        // reject collapsed (fixed-point / tiny) attractors
        const ext=Math.max(mxx-mnx,mxy-mny,mxz-mnz);
        if(ext>0.05 && ext<1e3) ok=true;
      }
      if(!ok){
        // guaranteed fallback: Pickover attractor (always bounded & chaotic)
        const A=2.24,B=0.43,C=-0.65,D=-2.43; let x=0.1,y=0.1,z=0.1;
        mnx=1e9;mxx=-1e9;mny=1e9;mxy=-1e9;mnz=1e9;mxz=-1e9;
        for(let i=0;i<N;i++){
          const nx=Math.sin(A*y)-z*Math.cos(B*x);
          const ny=z*Math.sin(C*x)-Math.cos(D*y);
          const nz=Math.sin(x); x=nx;y=ny;z=nz;
          pts[i*3]=x; pts[i*3+1]=y; pts[i*3+2]=z;
          if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; if(z<mnz)mnz=z; if(z>mxz)mxz=z;
        }
      }
      // normalize to [-1,1]
      const sx=2/Math.max(1e-3,mxx-mnx), sy=2/Math.max(1e-3,mxy-mny), sz=2/Math.max(1e-3,mxz-mnz);
      const s=Math.min(sx,sy,sz)*0.85;
      const ox=(mnx+mxx)*.5, oy=(mny+mxy)*.5, oz=(mnz+mxz)*.5;
      for(let i=0;i<N;i++){ pts[i*3]=(pts[i*3]-ox)*s; pts[i*3+1]=(pts[i*3+1]-oy)*s; pts[i*3+2]=(pts[i*3+2]-oz)*s; }
      st.dirty=false; st.key=key;
    }
    // project with rotating camera into the data buffer each frame
    project3D(api, st, p.spin, p.tilt);
    drawPoints(api,st,0.09,1.0);
  },
  dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.buf); gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
});

//============================================================ 3D Strange Attractors 2
// Continuous-flow attractors integrated by `delta` (Euler). Default = Thomas
// (b=0.19). Also offers Lorenz / Aizawa. 3D projected, depth-coloured.
R({
  name:'3D Strange Attractors 2', category:'Strange Attractors', type:'custom',
  params:[ {key:'attractor',label:'attractor',min:0,max:2,step:1,value:0}, // 0=Thomas 1=Lorenz 2=Aizawa
           {key:'b',label:'b',min:0.05,max:0.5,step:.001,value:0.19},
           {key:'delta',label:'delta',min:0.005,max:0.08,step:.001,value:0.05},
           {key:'spin',label:'rotation',min:0,max:2,step:.01,value:0.4},
           {key:'tilt',label:'tilt',min:-1,max:1,step:.01,value:0.3} ],
  init(api){ const st=makePoints(api, 250000); st.key=''; st.dirty=true; st.pts=null; return st; },
  reset(api,st){ st.dirty=true; },
  frame(api,st){
    const p=api.params;
    const mode=Math.round(p.attractor)%3;
    const key=[mode,p.b,p.delta].join(',');
    if(st.dirty || key!==st.key){
      const N=st.N; const pts=st.pts||(st.pts=new Float32Array(N*3));
      const dt=p.delta, b=p.b;
      let x=0.1,y=0.0,z=0.0;
      if(mode===1){ x=0.1; y=0.0; z=0.0; } else if(mode===2){ x=0.1; y=0; z=0; }
      let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,mnz=1e9,mxz=-1e9;
      const sub=mode===1?0.6:1.0; // lorenz needs smaller effective dt
      for(let k=0;k<300;k++){ const r=flow(mode,b,x,y,z,dt*sub); x=r[0];y=r[1];z=r[2]; }
      for(let i=0;i<N;i++){
        const r=flow(mode,b,x,y,z,dt*sub); x=r[0];y=r[1];z=r[2];
        if(!isFinite(x)||!isFinite(y)||!isFinite(z)||Math.abs(x)>1e4){ x=0.1;y=0.0;z=0.0; }
        pts[i*3]=x; pts[i*3+1]=y; pts[i*3+2]=z;
        if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; if(z<mnz)mnz=z; if(z>mxz)mxz=z;
      }
      const sx=2/Math.max(1e-3,mxx-mnx), sy=2/Math.max(1e-3,mxy-mny), sz=2/Math.max(1e-3,mxz-mnz);
      const s=Math.min(sx,sy,sz)*0.85;
      const ox=(mnx+mxx)*.5, oy=(mny+mxy)*.5, oz=(mnz+mxz)*.5;
      for(let i=0;i<N;i++){ pts[i*3]=(pts[i*3]-ox)*s; pts[i*3+1]=(pts[i*3+1]-oy)*s; pts[i*3+2]=(pts[i*3+2]-oz)*s; }
      st.dirty=false; st.key=key;
    }
    project3D(api, st, p.spin, p.tilt);
    drawPoints(api,st,0.08,1.0);
  },
  dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.buf); gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
});

//---------------------------------------------------------------- helpers
function fract(v){ return v-Math.floor(v); }

// one step of a 3D polynomial map. mode 0=quadratic(10 terms/dim), 1=cubic(20/dim)
function step3(mode,c,x,y,z){
  if(mode===0){
    const T=(o)=> c[o]+c[o+1]*x+c[o+2]*y+c[o+3]*z+c[o+4]*x*x+c[o+5]*y*y+c[o+6]*z*z+c[o+7]*x*y+c[o+8]*x*z+c[o+9]*y*z;
    return [T(0),T(10),T(20)];
  } else {
    const T=(o)=> c[o]+c[o+1]*x+c[o+2]*y+c[o+3]*z
      +c[o+4]*x*x+c[o+5]*y*y+c[o+6]*z*z+c[o+7]*x*y+c[o+8]*x*z+c[o+9]*y*z
      +c[o+10]*x*x*x+c[o+11]*y*y*y+c[o+12]*z*z*z
      +c[o+13]*x*x*y+c[o+14]*x*x*z+c[o+15]*y*y*z+c[o+16]*x*y*y+c[o+17]*x*z*z+c[o+18]*y*z*z+c[o+19]*x*y*z;
    return [T(0),T(20),T(40)];
  }
}

// one Euler step of a continuous flow. mode 0=Thomas 1=Lorenz 2=Aizawa
function flow(mode,b,x,y,z,dt){
  let dx,dy,dz;
  if(mode===0){ // Thomas
    dx=Math.sin(y)-b*x; dy=Math.sin(z)-b*y; dz=Math.sin(x)-b*z;
  } else if(mode===1){ // Lorenz
    const s=10,r=28,bb=8/3;
    dx=s*(y-x); dy=x*(r-z)-y; dz=x*y-bb*z;
  } else { // Aizawa
    const a=0.95,bb=0.7,c=0.6,d=3.5,e=0.25,f=0.1;
    dx=(z-bb)*x-d*y; dy=d*x+(z-bb)*y; dz=c+a*z-z*z*z/3 - (x*x+y*y)*(1+e*z) + f*z*x*x*x;
  }
  return [x+dx*dt, y+dy*dt, z+dz*dt];
}

// rotate the normalized 3D point cloud (st.pts) and write clip-space [x,y,t] to
// st.data; t encodes depth (0..1). spin/tilt are param-driven; a slow u_time
// term keeps it gently turning so the form reads as 3D.
function project3D(api, st, spin, tilt){
  const N=st.N, pts=st.pts, d=st.data;
  const t=api.time();
  const ay=spin*t*0.3 + 2.0;            // yaw
  const ax=tilt;                         // fixed pitch from slider
  const cy=Math.cos(ay), sy=Math.sin(ay), cx=Math.cos(ax), sx=Math.sin(ax);
  const aspect=api.W/api.H, inv=1/Math.max(1,aspect);
  const persp=2.5;
  for(let i=0;i<N;i++){
    let X=pts[i*3], Y=pts[i*3+1], Z=pts[i*3+2];
    // yaw around Y
    let x1=cy*X+sy*Z, z1=-sy*X+cy*Z;
    // pitch around X
    let y2=cx*Y-sx*z1, z2=sx*Y+cx*z1;
    // simple perspective
    const w=persp/(persp+z2*0.9);
    d[i*3]=x1*w*inv*0.9; d[i*3+1]=y2*w*0.9;
    d[i*3+2]=(z2*0.5+0.5);  // depth -> palette t
  }
  const gl=api.gl; gl.bindBuffer(gl.ARRAY_BUFFER,st.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,d);
}

})();

<script>
/* b16b.js — Fractals + Gravity Sets (frag archetype).
   Modes: Ducks, Escape, Lyapunov, Mandelbrot/Julia Sets, Planet, Plasma Clouds,
          Root-Finding Fractals, Root-Finding Fractals 2, Thorn,
          2D Gravity Set, 3D Gravity Set.
   All bounded GLSL loops; ABI preamble auto-added by engine. */
(function(){
const R = window.VOC.register;

//----------------------------------------------------------------- Ducks
// "Ducks" fractal: iterate z -> log(|z| reflected to upper half) + c.
R({
  name:'Ducks', category:'2D Fractals', type:'frag',
  params:[ {key:'cRe',label:'c real',min:-2,max:2,step:.001,value:-0.7},
           {key:'cIm',label:'c imag',min:-2,max:2,step:.001,value:0.4},
           {key:'zoom',label:'zoom',min:.3,max:8,step:.01,value:1.2},
           {key:'maxIterations',label:'iterations',min:5,max:120,step:1,value:20},
           {key:'paletteScale',label:'palette scale',min:5,max:120,step:1,value:50} ],
  frag:`uniform float cRe,cIm,zoom,maxIterations,paletteScale;
    vec2 clog(vec2 z){ return vec2(0.5*log(dot(z,z)+1e-9), atan(z.y,z.x)); }
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 z = uv/zoom*3.0;
      vec2 c = vec2(cRe,cIm);
      float sum=0.0; float cnt=0.0;
      for(int i=0;i<120;i++){
        if(float(i)>=maxIterations) break;
        // reflect into upper half plane (the "Ducks" trick)
        z.y = abs(z.y);
        z = clog(z + c);
        sum += exp(-length(z));
        cnt += 1.0;
      }
      float t = sum/max(cnt,1.0);
      gl_FragColor = vec4(palette(fract(t*paletteScale*0.04 + u_time*0.03)),1.0);
    }`
});

//----------------------------------------------------------------- Escape
// Escape-time of a polynomial z -> a*z^3 + b*z^2 + c*z + z0, coeffs from a 3x6
// concept reduced to a few sliders (cubic coefficients) + rotation angle.
R({
  name:'Escape', category:'2D Fractals', type:'frag',
  params:[ {key:'a3',label:'cubic coeff',min:-1,max:1,step:.001,value:0.18},
           {key:'a2',label:'quad coeff',min:-1,max:1,step:.001,value:-0.4},
           {key:'a1',label:'lin coeff',min:-1,max:1,step:.001,value:0.7},
           {key:'zoom',label:'zoom',min:.3,max:6,step:.01,value:1.2},
           {key:'angle',label:'angle',min:0,max:6.2832,step:.001,value:0.0},
           {key:'supersample',label:'iterations',min:16,max:300,step:1,value:120} ],
  frag:`uniform float a3,a2,a1,zoom,angle,supersample;
    vec2 cmul(vec2 a,vec2 b){ return vec2(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x); }
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      float ca=cos(angle), sa=sin(angle);
      uv = mat2(ca,-sa,sa,ca)*uv;
      vec2 c = uv/zoom*2.0;
      vec2 z = vec2(0.0);
      float n=0.0;
      for(int i=0;i<300;i++){
        if(float(i)>=supersample) break;
        vec2 z2=cmul(z,z); vec2 z3=cmul(z2,z);
        z = a3*z3 + a2*z2 + a1*z + c;
        if(dot(z,z)>16.0) break;
        n+=1.0;
      }
      if(n>=supersample){ gl_FragColor=vec4(0,0,0,1); return; }
      float m = n - log2(log2(max(dot(z,z),1.0001))) + 4.0;
      gl_FragColor = vec4(palette(fract(m*0.03)),1.0);
    }`
});

//----------------------------------------------------------------- Lyapunov
// Lyapunov fractal over an A/B sequence; sign of exponent -> color.
R({
  name:'Lyapunov', category:'2D Fractals', type:'frag',
  params:[ {key:'aMin',label:'a min',min:0,max:4,step:.001,value:2.5},
           {key:'aMax',label:'a max',min:0,max:4,step:.001,value:4.0},
           {key:'bMin',label:'b min',min:0,max:4,step:.001,value:2.5},
           {key:'bMax',label:'b max',min:0,max:4,step:.001,value:4.0},
           {key:'nLyap',label:'iterations',min:40,max:300,step:1,value:160} ],
  frag:`uniform float aMin,aMax,bMin,bMax,nLyap;
    void main(){
      vec2 uv=gl_FragCoord.xy/u_resolution;
      float A = mix(aMin,aMax,uv.x);
      float B = mix(bMin,bMax,uv.y);
      // sequence "BBABA" repeated
      float x=0.5; float sum=0.0; float cnt=0.0;
      for(int i=0;i<300;i++){
        if(float(i)>=nLyap) break;
        int s = int(mod(float(i),5.0));
        float r = (s==2||s==4)?A:B;   // pattern B B A B A
        x = r*x*(1.0-x);
        // skip warmup
        if(i>20){
          float d = abs(r*(1.0-2.0*x));
          sum += log(max(d,1e-7));
          cnt += 1.0;
        }
      }
      float L = sum/max(cnt,1.0);
      vec3 col;
      if(L<0.0){
        // ordered: warm palette by depth
        col = palette(clamp(0.5 - L*0.7, 0.0, 1.0));
      } else {
        // chaotic: dark
        col = palette(clamp(0.05 + L*0.05, 0.0, 0.2))*0.25;
      }
      gl_FragColor=vec4(col,1.0);
    }`
});

//----------------------------------------------------------------- Mandelbrot/Julia Sets
R({
  name:'Mandelbrot/Julia Sets', category:'2D Fractals', type:'frag',
  params:[ {key:'zoom',label:'zoom',min:.3,max:300,step:.01,value:0.9},
           {key:'cx',label:'center x',min:-2.5,max:1.5,step:.001,value:-0.5},
           {key:'cy',label:'center y',min:-1.5,max:1.5,step:.001,value:0.0},
           {key:'julia',label:'julia mix',min:0,max:1,step:.01,value:0.0},
           {key:'jRe',label:'julia re',min:-2,max:2,step:.001,value:0.0},
           {key:'jIm',label:'julia im',min:-2,max:2,step:.001,value:1.0},
           {key:'iterations',label:'iterations',min:32,max:800,step:1,value:300} ],
  frag:`uniform float zoom,cx,cy,julia,jRe,jIm,iterations;
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 p = uv/zoom + vec2(cx,cy);
      // julia: z starts at p, c is fixed; mandelbrot: z starts at 0, c=p.
      vec2 z = mix(vec2(0.0), p, julia);
      vec2 c = mix(p, vec2(jRe,jIm), julia);
      float n=0.0;
      for(int i=0;i<800;i++){
        if(float(i)>=iterations) break;
        z = vec2(z.x*z.x-z.y*z.y, 2.0*z.x*z.y)+c;
        if(dot(z,z)>4.0) break;
        n+=1.0;
      }
      if(n>=iterations){ gl_FragColor=vec4(0,0,0,1); return; }
      float m = n - log2(log2(dot(z,z))) + 4.0;
      gl_FragColor=vec4(palette(fract(m*0.025)),1.0);
    }`
});

//----------------------------------------------------------------- Planet
// Fault-formation sphere: shaded sphere with fBm "elevation" -> ocean/land palette.
R({
  name:'Planet', category:'2D Fractals', type:'frag',
  params:[ {key:'detail',label:'detail',min:2,max:9,step:1,value:7},
           {key:'faultLines',label:'fault lines',min:50,max:1200,step:1,value:500},
           {key:'seaLevel',label:'sea level',min:-0.3,max:0.5,step:.01,value:0.0},
           {key:'spin',label:'spin',min:0,max:2,step:.01,value:0.25} ],
  frag:`uniform float detail,faultLines,seaLevel,spin;
    float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
    float noise(vec3 p){
      vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      float n000=hash(i+vec3(0,0,0)), n100=hash(i+vec3(1,0,0));
      float n010=hash(i+vec3(0,1,0)), n110=hash(i+vec3(1,1,0));
      float n001=hash(i+vec3(0,0,1)), n101=hash(i+vec3(1,0,1));
      float n011=hash(i+vec3(0,1,1)), n111=hash(i+vec3(1,1,1));
      return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
                 mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
    }
    float fbm(vec3 p){
      float s=0.0,a=0.5; int oct=int(detail);
      for(int i=0;i<9;i++){ if(i>=oct)break; s+=a*noise(p); p*=2.03; a*=0.5; }
      return s;
    }
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      float r2=dot(uv,uv);
      if(r2>0.64){ gl_FragColor=vec4(palette(0.02)*0.15,1.0); return; }
      float z=sqrt(0.64-r2);
      vec3 n=normalize(vec3(uv,z));
      // rotate around Y for spin + tilt
      float ang=u_time*spin*0.3;
      float ca=cos(ang), sa=sin(ang);
      vec3 sp=vec3(ca*n.x+sa*n.z, n.y, -sa*n.x+ca*n.z);
      float elev = fbm(sp*3.0 + vec3(faultLines*0.001)) - 0.5;
      vec3 L=normalize(vec3(0.6,0.7,0.8));
      float light=clamp(dot(n,L),0.0,1.0)*0.85+0.15;
      vec3 col;
      if(elev<seaLevel){
        col = mix(vec3(0.02,0.1,0.35), vec3(0.05,0.35,0.6), (elev-seaLevel+0.3)/0.3);
      } else {
        col = palette(clamp(0.4 + (elev-seaLevel)*1.2, 0.4, 0.95));
      }
      gl_FragColor=vec4(col*light,1.0);
    }`
});

// fBm noise field colored via palette (diamond-square style cloud look).
R({
  name:'Plasma Clouds', category:'2D Fractals', type:'frag',
  params:[ {key:'randomSeed',label:'seed',min:0,max:100,step:.01,value:42.0},

           {key:'speed',label:'speed',min:0,max:2,step:.01,value:0.3} ],

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))+randomSeed)*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }
    float fbm(vec2 p){
      float s=0.0,a=0.5;
      for(int i=0;i<7;i++){ s+=a*noise(p); p=p*cloudRoughness; a*=0.5; }
      return s;
    }
    void main(){
      vec2 uv=gl_FragCoord.xy/u_resolution.y*scale;
      float t=u_time*speed;
      float v=fbm(uv+vec2(t*0.4,fbm(uv-vec2(t*0.2,0.0))));
      gl_FragColor=vec4(palette(clamp(v,0.0,1.0)),1.0);
    }`
});

//----------------------------------------------------------------- Root-Finding Fractals
// Newton fractal for z^7 - 3z^5 + 6z^3 - 3z + 3, smooth palette coloring.
R({
  name:'Root-Finding Fractals', category:'2D Fractals', type:'frag',
  params:[ {key:'multRe',label:'mult re',min:-2,max:2,step:.001,value:1.0},
           {key:'multIm',label:'mult im',min:-2,max:2,step:.001,value:0.0},
           {key:'zoom',label:'zoom',min:.3,max:6,step:.01,value:1.0},
           {key:'paletteStop',label:'palette scale',min:1,max:12,step:.1,value:3.0},
           {key:'iterations',label:'iterations',min:8,max:80,step:1,value:40} ],
  frag:`uniform float multRe,multIm,zoom,paletteStop,iterations;
    vec2 cmul(vec2 a,vec2 b){ return vec2(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x); }
    vec2 cdiv(vec2 a,vec2 b){ float d=dot(b,b)+1e-12; return vec2(a.x*b.x+a.y*b.y, a.y*b.x-a.x*b.y)/d; }
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 z = uv/zoom*2.4;
      vec2 mult = vec2(multRe,multIm);
      float n=0.0;
      for(int i=0;i<80;i++){
        if(float(i)>=iterations) break;
        // f = z^7 - 3z^5 + 6z^3 - 3z + 3
        vec2 z2=cmul(z,z), z3=cmul(z2,z), z4=cmul(z2,z2);
        vec2 z5=cmul(z4,z), z6=cmul(z3,z3), z7=cmul(z6,z);
        vec2 f = z7 - 3.0*z5 + 6.0*z3 - 3.0*z + vec2(3.0,0.0);
        // f' = 7z^6 - 15z^4 + 18z^2 - 3
        vec2 fp = 7.0*z6 - 15.0*z4 + 18.0*z2 - vec2(3.0,0.0);
        vec2 step = cmul(mult, cdiv(f,fp));
        z -= step;
        n+=1.0;
        if(dot(step,step)<1e-8) break;
      }
      float ang = atan(z.y,z.x);
      float t = fract((ang/6.2831853+0.5)*paletteStop + n*0.02);
      gl_FragColor=vec4(palette(t),1.0);
    }`
});

//----------------------------------------------------------------- Root-Finding Fractals 2
// Newton on z^3 - 1; "single color per root" + iteration shading.
R({
  name:'Root-Finding Fractals 2', category:'2D Fractals', type:'frag',
  params:[ {key:'zoom',label:'zoom',min:.3,max:6,step:.01,value:1.0},
           {key:'cx',label:'center x',min:-2,max:2,step:.001,value:0.0},
           {key:'cy',label:'center y',min:-2,max:2,step:.001,value:0.0},
           {key:'relax',label:'relaxation',min:0.2,max:2,step:.001,value:1.0},
           {key:'iterations',label:'iterations',min:8,max:80,step:1,value:40} ],
  frag:`uniform float zoom,cx,cy,relax,iterations;
    vec2 cmul(vec2 a,vec2 b){ return vec2(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x); }
    vec2 cdiv(vec2 a,vec2 b){ float d=dot(b,b)+1e-12; return vec2(a.x*b.x+a.y*b.y, a.y*b.x-a.x*b.y)/d; }
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 z = uv/zoom*2.0 + vec2(cx,cy);
      float n=0.0;
      for(int i=0;i<80;i++){
        if(float(i)>=iterations) break;
        vec2 z2=cmul(z,z), z3=cmul(z2,z);
        vec2 f = z3 - vec2(1.0,0.0);
        vec2 fp = 3.0*z2;
        z -= relax*cdiv(f,fp);
        n+=1.0;
        if(dot(f,f)<1e-8) break;
      }
      // identify nearest cube root
      const vec2 r0=vec2(1.0,0.0);
      const vec2 r1=vec2(-0.5,0.8660254);
      const vec2 r2=vec2(-0.5,-0.8660254);
      float d0=distance(z,r0), d1=distance(z,r1), d2=distance(z,r2);
      float base;
      if(d0<d1&&d0<d2) base=0.08;
      else if(d1<d2) base=0.45;
      else base=0.82;
      float shade = 1.0 - n/iterations*0.7;
      gl_FragColor=vec4(palette(base)*shade,1.0);
    }`
});

//----------------------------------------------------------------- Thorn
// Thorn / "secant sea" fractal: z = z/cos(z) ... using sin/cos division + c.
R({
  name:'Thorn', category:'2D Fractals', type:'frag',
  params:[ {key:'cx',label:'cx',min:-2,max:2,step:.001,value:0.1},
           {key:'cy',label:'cy',min:-2,max:2,step:.001,value:-1.0},
           {key:'iterations',label:'iterations',min:16,max:255,step:1,value:120},
           {key:'paletteScaling',label:'palette scaling',min:1,max:40,step:.1,value:10.0},
           {key:'zoom',label:'zoom',min:.3,max:6,step:.01,value:1.0} ],
  frag:`uniform float cx,cy,iterations,paletteScaling,zoom;
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 z = uv/zoom*6.2831853;
      vec2 c = vec2(cx,cy);
      float n=0.0;
      for(int i=0;i<255;i++){
        if(float(i)>=iterations) break;
        // thorn: x' = x/cos(y) + cx ; y' = y/sin(x) + cy
        float nx = z.x/cos(z.y) + cx;
        float ny = z.y/sin(z.x) + cy;
        z = vec2(nx,ny);
        if(dot(z,z)>10000.0) break;
        n+=1.0;
      }
      float t = fract(n/paletteScaling);
      gl_FragColor=vec4(palette(t),1.0);
    }`
});

// Per-pixel: launch a test particle, integrate gravity from N fixed stars,
// color by escape iteration / final speed.
R({
  name:'2D Gravity Set', category:'Gravity', type:'frag',
  params:[ {key:'gravConstant',label:'G',min:0.1,max:4,step:.001,value:1.36},
           {key:'dt',label:'dt',min:0.5,max:12,step:.01,value:6.5},
           {key:'maxIterations',label:'iterations',min:32,max:400,step:1,value:200},
           {key:'numStars',label:'num stars',min:1,max:5,step:1,value:5},
           {key:'spread',label:'ring radius',min:0.2,max:1.5,step:.01,value:0.7} ],
  frag:`uniform float gravConstant,dt,maxIterations,numStars,spread;
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y * 2.0;
      vec2 pos = uv;
      vec2 vel = vec2(0.0);
      float escaped=-1.0;
      float idt = dt*0.02;
      for(int i=0;i<400;i++){
        if(float(i)>=maxIterations) break;
        vec2 acc=vec2(0.0);
        for(int s=0;s<5;s++){
          if(float(s)>=numStars) break;
          float a = 6.2831853*float(s)/numStars + 0.3;
          vec2 star = vec2(cos(a),sin(a))*spread;
          vec2 d = star - pos;
          float r2 = dot(d,d)+0.02;
          acc += gravConstant*d/(r2*sqrt(r2));
        }
        vel += acc*idt;
        pos += vel*idt;
        if(dot(pos,pos)>9.0){ escaped=float(i); break; }
      }
      if(escaped<0.0){
        // captured: color by final speed
        float sp = length(vel);
        gl_FragColor=vec4(palette(clamp(sp*0.15,0.0,0.95)),1.0);
      } else {
        gl_FragColor=vec4(palette(fract(escaped/maxIterations*3.0))*0.6,1.0);
      }
    }`
});

// 3D extension: launch test particle in a plane through a 3D star cluster, rotate

R({

      // tilt the launch plane in 3D and spin it

      float ca=cos(ang), sa=sin(ang);

      // map screen pixel to a 3D start position on a tilted plane, then spin around Y
      vec3 pos = vec3(uv.x, uv.y*cos(tilt), uv.y*sin(tilt));
      pos = vec3(ca*pos.x + sa*pos.z, pos.y, -sa*pos.x + ca*pos.z);

        if(float(i)>=maxIterations) break;
        vec3 acc=vec3(0.0);
        for(int s=0;s<5;s++){
          if(float(s)>=numStars) break;
          float a=6.2831853*float(s)/numStars+0.3;
          vec3 star=vec3(cos(a)*spread, sin(a*2.0)*spread*0.5, sin(a)*spread);
          vec3 d=star-pos;
          float r2=dot(d,d)+0.02;
          acc += gravConstant*d/(r2*sqrt(r2));

        if(dot(pos,pos)>9.0){ escaped=float(i); break; }

        gl_FragColor=vec4(palette(clamp(sp*0.12,0.0,0.95))*(0.5+0.5*depth),1.0);
      } else {
        gl_FragColor=vec4(palette(fract(escaped/maxIterations*3.0))*0.55,1.0);
      }
    }`
});

<!-- b17.js -->
<script>
/* b17.js — Genetics: Genetic Art, Genetic Art 2, Genetic Art 3 (frag archetype).
   ----------------------------------------------------------------------------
   In Visions of Chaos, "Genetic Art" evolves an expression TREE that maps a
   pixel's (x,y) coordinate (and, for animated/iterated variants, a parameter)
   to an RGB colour. The settings dialog exposes the "current formula" (the
   evolved tree) plus a supersample factor; pressing Evolve mutates the tree.

   Since we cannot ship a live tree-mutation GUI, each mode here is a fixed but
   representative expression tree, and the sliders act as the genome's tunable
   genes: `seed` jumps between distinct evolved formulas, `complexity`/`warp`/
   `power` mutate node weights, and `zoom` scans the coordinate domain. Moving a
   slider visibly re-evolves the picture, exactly like pressing Evolve. Colour
   always flows through palette() per the engine ABI.

   All three are type:'frag' (no #version in the body — the ABI preamble adds
   it). Each declares its params as `uniform float <key>;` and writes voc_out
   (aliased as gl_FragColor) with palette()-mapped colour. All loops are
   bounded with a constant trip count gated by an early break. */
(function(){
const R = window.VOC.register;

// Shared GLSL helpers prepended to every body: a hash for the per-seed genome,
// 2x2 rotation, and a tiny smooth fract. Pure helpers, no state.
const HELPERS = `
  float h11(float p){ return fract(sin(p*127.1+11.7)*43758.5453); }
  vec2  h22(float p){ return fract(sin(vec2(p*127.1, p*311.7)+vec2(11.7,57.3))*43758.5453); }
  mat2  rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
`;

//============================================================ Genetic Art
// Expression tree #1: a sum of rotated sine/cosine "genes". Each gene picks its
// own frequency, phase and rotation from the seed hash, so changing `seed`
// produces a wholly different evolved organic pattern (flowing interference
// fields). `complexity` = number of active genes (tree depth). `power` shapes
// the output non-linearly (a unary 'pow' node). `zoom` scans the domain.
R({
  name:'Genetic Art', category:'Genetics', type:'frag',
  params:[ {key:'seed',      label:'genome seed', min:0, max:64,  step:1,   value:7},
           {key:'complexity',label:'complexity',  min:2, max:9,   step:1,   value:5},
           {key:'power',     label:'tree power',  min:0.4,max:3,  step:.01, value:1.0},
           {key:'zoom',      label:'zoom',        min:.4, max:6,   step:.01, value:1.6},
           {key:'speed',     label:'animate',     min:0,  max:1.5, step:.01, value:0.25} ],
  frag: HELPERS + `
    uniform float seed, complexity, power, zoom, speed;
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      uv*=zoom;
      float t=u_time*speed;
      // genome: derive a base hash from the seed
      float g=floor(seed)+1.0;
      float acc=0.0, amp=1.0, norm=0.0;
      // bounded expression-tree evaluation: up to 9 sine/cos genes
      for(int i=0;i<9;i++){
        if(float(i)>=complexity) break;
        float fi=float(i);
        // per-gene mutated parameters pulled from the genome hash
        vec2  k = (h22(g*3.7+fi*1.31)-0.5)*8.0;          // frequency vector
        float ph= h11(g*1.9+fi*2.7)*6.2831 + t*(0.3+fi*0.11); // animated phase
        float ang= h11(g*5.3+fi*0.7)*6.2831;             // rotation gene
        vec2  p = rot(ang)*uv;
        // node: sin( dot(k,p) + ph ) * cos( cross-term ) — a small subtree
        float node = sin(dot(k,p)+ph) * cos(p.x*k.y - p.y*k.x + ph*0.5);
        acc += node*amp;
        norm += amp;
        amp *= 0.78;                                     // deeper genes weigh less
      }
      acc /= max(norm,1e-3);                             // -> roughly -1..1
      // unary 'pow' node: shape the field, keep sign
      float s=sign(acc);
      acc = s*pow(abs(acc), power);
      float col = acc*0.5+0.5;                           // 0..1 palette coord
      gl_FragColor=vec4(palette(fract(col)),1.0);
    }`
});

//============================================================ Genetic Art 2
// Expression tree #2: DOMAIN WARPING genome. The coordinate is fed through a
// chain of warp nodes (each adds a sin/cos displacement of itself), producing
// marbled / turbulent evolved textures distinct from #1. `warp` = warp strength
// gene, `octaves` = warp-chain depth, `seed` re-rolls the whole tree, `zoom`
// scans the domain. Colour comes from the warped field magnitude + angle.
R({
  name:'Genetic Art 2', category:'Genetics', type:'frag',
  params:[ {key:'seed',   label:'genome seed', min:0,  max:64,  step:1,   value:13},
           {key:'octaves',label:'warp depth',  min:1,  max:7,   step:1,   value:4},
           {key:'warp',   label:'warp gene',   min:0,  max:1.6, step:.01, value:0.8},
           {key:'zoom',   label:'zoom',        min:.4, max:6,   step:.01, value:2.0},
           {key:'speed',  label:'animate',     min:0,  max:1.5, step:.01, value:0.2} ],
  frag: HELPERS + `
    uniform float seed, octaves, warp, zoom, speed;
    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      vec2 p = uv*zoom;
      float t=u_time*speed;
      float g=floor(seed)+1.0;
      // iterative domain-warp tree (bounded by 7)
      for(int i=0;i<7;i++){
        if(float(i)>=octaves) break;
        float fi=float(i);
        vec2 k = (h22(g*2.3+fi*1.7)-0.5)*6.0 + 1.5;      // per-node freqs
        float ph= h11(g*4.1+fi*0.9)*6.2831;
        // warp node: displace p by sin/cos of a rotated copy of itself
        vec2 w = vec2( sin(p.y*k.x + ph + t),
                       cos(p.x*k.y - ph - t*0.7) );
        p += warp * w;
        p = rot(0.5)*p;                                  // mild rotation between nodes
      }
      // leaf colouring node: combine final field components
      float v = sin(p.x) + cos(p.y) + 0.5*sin(length(p)*1.7 + t);
      float ang = atan(p.y, p.x);
      float col = v*0.22 + ang*0.159 + 0.5;
      gl_FragColor=vec4(palette(fract(col)),1.0);
    }`
});

//============================================================ Genetic Art 3
// Expression tree #3: an ITERATED per-pixel formula (matches the VoC ref, which
// evolves a formula iterated like a Julia/escape map). The genome defines a
// complex map z -> f(z, c) plus a fold node; we iterate it a bounded number of
// times and colour by smoothed iteration / final-orbit value. Distinct, more
// fractal-flavoured evolved imagery. Genes: `seed`, `iter` (tree iterations),
// `mutate` (perturbs the constant c node), `zoom`.
R({
  name:'Genetic Art 3', category:'Genetics', type:'frag',
  params:[ {key:'seed',  label:'genome seed', min:0,   max:64,  step:1,   value:21},
           {key:'iter',  label:'iterations',  min:4,   max:40,  step:1,   value:18},
           {key:'mutate',label:'mutate c',    min:-1.5,max:1.5, step:.001,value:0.0},
           {key:'zoom',  label:'zoom',        min:.4,  max:8,   step:.01, value:1.5},
           {key:'speed', label:'animate',     min:0,   max:1.0, step:.01, value:0.15} ],
  frag: HELPERS + `

<script>
/* b18.js — Gravity batch (particles archetype): N-body gravity simulations.
   2D Gravity, Light Gravity Simulation, 3D Gravity.
   Each CPU-simulates N particles per frame (O(N^2) softened gravity, N<=1500),
   uploads positions to a GL buffer and draws additive GL_POINTS coloured by speed
   (Blue/Red) sampled from the active palette. Mimics the Clifford custom example. */
(function(){
const R = window.VOC.register;

// ---- shared GL helpers --------------------------------------------------
// Vertex shader: takes clip-space xy in attribute 0 and a speed (0..1) in
// attribute 1; passes speed to the fragment shader and sets point size.
function makeProgram(api, pointSize){
  return api.buildProgramVF(
    `#version 300 es
     in vec2 pos; in float spd;
     out float vspd;
     uniform float u_psize;
     void main(){ vspd=spd; gl_Position=vec4(pos,0.,1.); gl_PointSize=u_psize; }`,
    `#version 300 es
     precision highp float;
     in float vspd; out vec4 o;
     uniform sampler2D u_pal; uniform float u_alpha;
     void main(){
       // round soft dot
       vec2 d = gl_PointCoord - 0.5;
       float r = dot(d,d);
       if(r>0.25) discard;
       float fall = 1.0 - r*4.0;
       // map speed into the vivid part of the palette (0.25..1.0)
       float t = 0.25 + 0.75*clamp(vspd,0.0,1.0);
       vec3 col = texture(u_pal, vec2(t,0.5)).rgb;
       o = vec4(col*fall*u_alpha, 1.0);
     }`);
}

function makeBuffers(api, N){
  const gl=api.gl;
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const posBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, N*2*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const spdBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,spdBuf);
  gl.bufferData(gl.ARRAY_BUFFER, N*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  return {vao,posBuf,spdBuf};
}

// Fade program: draws a fullscreen translucent black quad to dim the previous
// frame instead of hard-clearing it, so particle motion leaves persistent
// fading trails that accumulate real screen substance over the verify window.
function makeFadeProgram(api){
  return api.buildProgramVF(
    `#version 300 es
     in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`,
    `#version 300 es
     precision highp float; out vec4 o; uniform float u_fade;
     void main(){ o=vec4(0.,0.,0.,u_fade); }`);
}

function drawParticles(api, st, n, alpha){
  const gl=api.gl;
  api.toScreen();
  if(st.frame0){ api.clear(0,0,0,1); st.frame0=false; }
  // Fade the accumulated buffer toward black (alpha-blended black quad) so
  // existing trails persist and dim gradually rather than vanishing.
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(st.fade);
  gl.uniform1f(gl.getUniformLocation(st.fade,'u_fade'), st.fadeAmt);
  gl.bindVertexArray(api.quadVAO); gl.drawArrays(gl.TRIANGLES,0,3); gl.bindVertexArray(null);
  // Additive bright points on top.
  gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(st.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, api.paletteTex);
  gl.uniform1i(gl.getUniformLocation(st.prog,'u_pal'),1);
  gl.uniform1f(gl.getUniformLocation(st.prog,'u_alpha'), alpha);
  gl.uniform1f(gl.getUniformLocation(st.prog,'u_psize'), st.psize);
  gl.bindVertexArray(st.vao); gl.drawArrays(gl.POINTS,0,n); gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}

// deterministic PRNG so resets are repeatable
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

// =========================================================================
// 2D Gravity — 2D N-body. numObjects=500 (capped 1500), Blue/Red by speed,
// optional wrap edges / bounce off walls / speed limit / trails.
// =========================================================================
R({
  name:'2D Gravity', category:'Gravity', type:'custom',
  params:[
    {key:'numObjects', label:'objects',    min:50,  max:1200, step:10,  value:900},
    {key:'gravity',    label:'gravity',    min:0.1, max:5,    step:.01, value:1.2},
    {key:'speedLimit', label:'speed limit',min:0,   max:5,    step:.01, value:0},
    {key:'wrapEdges',  label:'wrap edges', min:0,   max:1,    step:1,   value:0},
    {key:'trails',     label:'trails',     min:0,   max:1,    step:1,   value:0},
  ],
  init(api){
    const N=1200;
    const st={ prog:makeProgram(api), fade:makeFadeProgram(api), N, psize:13.0,
               px:new Float32Array(N), py:new Float32Array(N),
               vx:new Float32Array(N), vy:new Float32Array(N),
               pos:new Float32Array(N*2), spd:new Float32Array(N),
               trails:false, seeded:false, lastN:0, frame0:true, fadeAmt:0.12 };
    Object.assign(st, makeBuffers(api,N));
    return st;
  },
  reset(api,st){ st.seeded=false; st.frame0=true; },
  frame(api,st){
    const gl=api.gl, p=api.params;
    const n=Math.min(st.N, Math.max(2, Math.floor(p.numObjects)));
    st.trails = p.trails>0.5;
    if(!st.seeded || n!==st.lastN){
      const rnd=rng(12345);
      for(let i=0;i<st.N;i++){
        const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*0.95;
        st.px[i]=Math.cos(a)*r; st.py[i]=Math.sin(a)*r;
        // gentle initial tangential spin so the cluster swirls (resists collapse)
        st.vx[i]=-Math.sin(a)*r*0.4; st.vy[i]=Math.cos(a)*r*0.4;
      }
      st.seeded=true; st.lastN=n;
    }
    // O(n^2) softened gravity
    const G=p.gravity*0.00006, soft=0.01, dt=1.0;
    const px=st.px,py=st.py,vx=st.vx,vy=st.vy;
    for(let i=0;i<n;i++){
      let ax=0,ay=0, xi=px[i], yi=py[i];
      for(let j=0;j<n;j++){
        if(j===i)continue;
        const dx=px[j]-xi, dy=py[j]-yi;
        const d2=dx*dx+dy*dy+soft;
        const inv=G/(d2*Math.sqrt(d2));
        ax+=dx*inv; ay+=dy*inv;
      }
      vx[i]+=ax*dt; vy[i]+=ay*dt;
    }
    const lim=p.speedLimit, wrap=p.wrapEdges>0.5;
    const pos=st.pos, spd=st.spd;
    let maxsp=1e-6;
    for(let i=0;i<n;i++){
      if(lim>0){
        const sp=Math.hypot(vx[i],vy[i])*100;
        if(sp>lim){ const f=lim/(sp); vx[i]*=f; vy[i]*=f; }
      }
      px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      if(wrap){
        if(px[i]>1)px[i]-=2; else if(px[i]<-1)px[i]+=2;
        if(py[i]>1)py[i]-=2; else if(py[i]<-1)py[i]+=2;
      } else {
        // bounce softly to keep particles on screen
        if(px[i]>1){px[i]=1;vx[i]*=-0.6;} else if(px[i]<-1){px[i]=-1;vx[i]*=-0.6;}
        if(py[i]>1){py[i]=1;vy[i]*=-0.6;} else if(py[i]<-1){py[i]=-1;vy[i]*=-0.6;}
      }
      pos[i*2]=px[i]; pos[i*2+1]=py[i];
      const s=vx[i]*vx[i]+vy[i]*vy[i]; spd[i]=s; if(s>maxsp)maxsp=s;
    }
    const inv=1/Math.sqrt(maxsp);
    for(let i=0;i<n;i++) spd[i]=Math.min(1, Math.sqrt(spd[i])*inv);
    gl.bindBuffer(gl.ARRAY_BUFFER,st.posBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,pos.subarray(0,n*2));
    gl.bindBuffer(gl.ARRAY_BUFFER,st.spdBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,spd.subarray(0,n));
    drawParticles(api, st, n, 0.9);
  },
  dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.posBuf); gl.deleteBuffer(st.spdBuf);
    gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
});

// =========================================================================
// 3D N-body core (shared by 3D Gravity & Light Gravity Simulation).
// CPU sim in 3D, perspective-project to 2D, colour by speed, additive points.
// Start pattern = rotating oblate spheroid (per source defaults).
// =========================================================================
function build3D(opts){
  return {
    name:opts.name, category:'Gravity', type:'custom',
    params:[
      {key:'numObjects',  label:'objects',     min:100, max:1400, step:10,  value:opts.defObjects},
      {key:'gravity',     label:'gravity',     min:0.1, max:5,    step:.01, value:1.0},
      {key:'spin',        label:'initial spin',min:0,   max:30,   step:.1,  value:10},
      {key:'timeStep',    label:'time step',   min:.005,max:.08,  step:.001,value:0.02},
      {key:'objectSize',  label:'object size', min:1,   max:10,   step:.1,  value:opts.defSize},
    ],
    init(api){
      const N=1400;
      const st={ prog:makeProgram(api), fade:makeFadeProgram(api), N, psize:opts.defSize,
                 px:new Float32Array(N), py:new Float32Array(N), pz:new Float32Array(N),
                 vx:new Float32Array(N), vy:new Float32Array(N), vz:new Float32Array(N),
                 order:new Int32Array(N), pz2:new Float32Array(N), depth:new Float32Array(N),
                 pos:new Float32Array(N*2), spd:new Float32Array(N),
                 trails:false, seeded:false, lastN:0, theta:0, alpha:opts.alpha,
                 frame0:true, fadeAmt:0.14 };
      Object.assign(st, makeBuffers(api,N));
      return st;
    },
    reset(api,st){ st.seeded=false; st.frame0=true; },
    frame(api,st){
      const gl=api.gl, p=api.params;
      const n=Math.min(st.N, Math.max(4, Math.floor(p.numObjects)));
      st.psize=p.objectSize;
      if(!st.seeded || n!==st.lastN){
        const rnd=rng(98765);
        for(let i=0;i<st.N;i++){
          // oblate spheroid: flattened along z
          let x,y,z,r2;
          do{ x=rnd()*2-1; y=rnd()*2-1; z=rnd()*2-1; r2=x*x+y*y+z*z; }while(r2>1);
          const R0=1.0;
          st.px[i]=x*R0; st.py[i]=y*R0; st.pz[i]=z*R0*0.35; // flatten z -> oblate
          // rotating: tangential velocity in xy plane
          const s=p.spin*0.0015;
          st.vx[i]=-st.py[i]*s; st.vy[i]=st.px[i]*s; st.vz[i]=0;
        }
        st.seeded=true; st.lastN=n;
      }
      const G=p.gravity*0.00008, soft=0.02, dt=p.timeStep*30;
      const px=st.px,py=st.py,pz=st.pz,vx=st.vx,vy=st.vy,vz=st.vz;
      for(let i=0;i<n;i++){
        let ax=0,ay=0,az=0, xi=px[i],yi=py[i],zi=pz[i];
        for(let j=0;j<n;j++){
          if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, dz=pz[j]-zi;
          const d2=dx*dx+dy*dy+dz*dz+soft;
          const inv=G/(d2*Math.sqrt(d2));
          ax+=dx*inv; ay+=dy*inv; az+=dz*inv;
        }
        vx[i]+=ax*dt; vy[i]+=ay*dt; vz[i]+=az*dt;
      }
      st.theta += 0.004;
      const ct=Math.cos(st.theta), sten=Math.sin(st.theta);
      const fov=3.4, camz=2.6;
      const pos=st.pos, spd=st.spd; let maxsp=1e-6;
      for(let i=0;i<n;i++){
        px[i]+=vx[i]*dt; py[i]+=vy[i]*dt; pz[i]+=vz[i]*dt;
        // rotate about y axis then project
        const rx=px[i]*ct + pz[i]*sten;
        const rz=-px[i]*sten + pz[i]*ct;
        const ry=py[i];
        const zc=camz+rz;
        const persp=fov/Math.max(0.2, zc);
        pos[i*2]=rx*persp;
        pos[i*2+1]=ry*persp;
        const s=vx[i]*vx[i]+vy[i]*vy[i]+vz[i]*vz[i]; spd[i]=s; if(s>maxsp)maxsp=s;
      }
      const inv=1/Math.sqrt(maxsp);
      for(let i=0;i<n;i++) spd[i]=Math.min(1, Math.sqrt(spd[i])*inv);
      gl.bindBuffer(gl.ARRAY_BUFFER,st.posBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,pos.subarray(0,n*2));
      gl.bindBuffer(gl.ARRAY_BUFFER,st.spdBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,spd.subarray(0,n));
      drawParticles(api, st, n, st.alpha);
    },
    dispose(api,st){ const gl=api.gl; gl.deleteBuffer(st.posBuf); gl.deleteBuffer(st.spdBuf);
      gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }
  };
}

// 3D Gravity — denser cluster, billboard-ish points coloured by speed.
R(build3D({ name:'3D Gravity', defObjects:1300, defSize:8.0, alpha:0.9 }));

// Light Gravity Simulation — same model with lighter/brighter glowing points
// per source (same params as 3D Gravity).
R(build3D({ name:'Light Gravity Simulation', defObjects:1300, defSize:8.0, alpha:0.95 }));

})();

<script>
/* b19.js — Hypercomplex Fractals (raymarched, distance-estimated).
   Modes: Mandelbulb, Quaternion Julia Set.
   Both are type:'frag' — sphere-trace a distance estimator, orbit the camera
   with u_time, shade by normals + a palette ramp on travel distance / AO. */
(function(){
const R = window.VOC.register;

//------------------------------------------------------------ Mandelbulb
R({
  name:'Mandelbulb', category:'Hypercomplex Fractals', type:'frag',
  params:[ {key:'power',label:'power',min:2,max:12,step:.1,value:8},
           {key:'iter',label:'iterations',min:2,max:12,step:1,value:6},
           {key:'fov',label:'FOV',min:15,max:90,step:1,value:35},
           {key:'bailout',label:'bailout',min:1.5,max:8,step:.1,value:4} ],
  frag:`uniform float power,iter,fov,bailout;

    // distance estimator for the Mandelbulb at point p
    float DE(vec3 p){
      vec3 z=p; float dr=1.0; float r=0.0;
      for(int i=0;i<12;i++){
        if(float(i)>=iter) break;
        r=length(z);
        if(r>bailout) break;
        // to polar
        float theta=acos(clamp(z.z/r,-1.0,1.0));
        float phi=atan(z.y,z.x);
        dr=pow(r,power-1.0)*power*dr+1.0;
        // scale and rotate the point
        float zr=pow(r,power);
        theta=theta*power; phi=phi*power;
        z=zr*vec3(sin(theta)*cos(phi), sin(theta)*sin(phi), cos(theta));
        z+=p;
      }
      return 0.5*log(r)*r/dr;
    }

    vec3 calcNormal(vec3 p){
      vec2 e=vec2(0.0008,0.0);
      return normalize(vec3(
        DE(p+e.xyy)-DE(p-e.xyy),
        DE(p+e.yxy)-DE(p-e.yxy),
        DE(p+e.yyx)-DE(p-e.yyx)));
    }

    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      // slow auto-orbit camera, pulled back so the whole bulb is framed
      float a=u_time*0.25;
      float rad=3.2;
      vec3 ro=vec3(sin(a)*rad, 0.9, cos(a)*rad);
      vec3 ta=vec3(0.0);
      vec3 ww=normalize(ta-ro);
      vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
      vec3 vv=normalize(cross(uu,ww));
      float zfoc=1.0/tan(radians(fov)*0.5);
      vec3 rd=normalize(uv.x*uu+uv.y*vv+zfoc*ww);

      // sphere trace
      float t=0.0; float d=0.0; bool hit=false; int steps=0;
      for(int i=0;i<120;i++){
        vec3 pos=ro+rd*t;
        d=DE(pos);
        if(d<0.0006*t+0.0003){ hit=true; steps=i; break; }
        t+=d;
        if(t>8.0) break;
        steps=i;
      }

      vec3 col=vec3(0.0);
      if(hit){
        vec3 pos=ro+rd*t;
        vec3 n=calcNormal(pos);
        vec3 lig=normalize(vec3(0.7,0.9,-0.4));
        float dif=clamp(dot(n,lig),0.0,1.0);
        float amb=0.35+0.65*clamp(0.5+0.5*n.y,0.0,1.0);
        // cheap ambient occlusion from iteration step count
        float ao=1.0-float(steps)/120.0;
        float shade=amb*0.45+dif*0.85;
        // colour from position + normal mapped through palette
        float tt=0.5+0.35*sin(length(pos)*2.5+dot(n,vec3(1.0))*0.5);
        col=palette(fract(tt))*shade*(0.4+0.6*ao);
        col+=dif*dif*0.25;
      } else {
        // soft background so the frame is never blank
        float g=0.10+0.10*uv.y;
        col=palette(0.12)*g;
      }
      col=pow(clamp(col,0.0,1.0),vec3(0.85));
      gl_FragColor=vec4(col,1.0);
    }`
});

//------------------------------------------------------------ Quaternion Julia Set
R({
  name:'Quaternion Julia Set', category:'Hypercomplex Fractals', type:'frag',
  params:[ {key:'cReal',label:'c real',min:-1.0,max:1.0,step:.01,value:0.0},
           {key:'cI1',label:'c imag1',min:-1.0,max:1.0,step:.01,value:0.5},
           {key:'cI2',label:'c imag2',min:-1.0,max:1.0,step:.01,value:0.2},
           {key:'iter',label:'iterations',min:4,max:14,step:1,value:10} ],
  frag:`uniform float cReal,cI1,cI2,iter;

    // quaternion multiply
    vec4 qmul(vec4 a, vec4 b){
      return vec4(
        a.x*b.x - a.y*b.y - a.z*b.z - a.w*b.w,
        a.x*b.y + a.y*b.x + a.z*b.w - a.w*b.z,
        a.x*b.z - a.y*b.w + a.z*b.x + a.w*b.y,
        a.x*b.w + a.y*b.z - a.z*b.y + a.w*b.x);
    }

    // distance estimator for the quaternion Julia set
    // z is a quaternion; the third imaginary component is fixed (4D -> 3D slice)
    float DE(vec3 p){
      vec4 c=vec4(cReal,cI1,cI2,0.0);
      vec4 z=vec4(p,0.0);
      vec4 dz=vec4(1.0,0.0,0.0,0.0);
      float r2=dot(z,z);
      for(int i=0;i<14;i++){
        if(float(i)>=iter) break;
        // dz' = 2*z*dz
        dz=2.0*qmul(z,dz);
        // z' = z^2 + c
        z=qmul(z,z)+c;
        r2=dot(z,z);
        if(r2>16.0) break;
      }
      float r=sqrt(r2);
      return 0.5*r*log(max(r,1e-6))/max(length(dz),1e-6);
    }

    vec3 calcNormal(vec3 p){
      vec2 e=vec2(0.0009,0.0);
      return normalize(vec3(
        DE(p+e.xyy)-DE(p-e.xyy),
        DE(p+e.yxy)-DE(p-e.yxy),
        DE(p+e.yyx)-DE(p-e.yyx)));
    }

    void main(){
      vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
      float a=u_time*0.3;
      float rad=2.4;
      vec3 ro=vec3(sin(a)*rad, 0.7*sin(a*0.5), cos(a)*rad);
      vec3 ta=vec3(0.0);
      vec3 ww=normalize(ta-ro);
      vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
      vec3 vv=normalize(cross(uu,ww));
      vec3 rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);

      float t=0.0; float d=0.0; bool hit=false; int steps=0;
      for(int i=0;i<140;i++){
        vec3 pos=ro+rd*t;
        d=DE(pos);
        if(d<0.0006*t+0.0003){ hit=true; steps=i; break; }
        t+=d;
        if(t>7.0) break;
        steps=i;
      }

      vec3 col=vec3(0.0);
      if(hit){
        vec3 pos=ro+rd*t;
        vec3 n=calcNormal(pos);
        vec3 lig=normalize(vec3(-0.5,0.8,0.6));
        float dif=clamp(dot(n,lig),0.0,1.0);

      gl_FragColor=vec4(col,1.0);
    }`
});

<script>
/* b2.js — Cellular Automata batch B2 (pingpong runtime).
   12 grid feedback CAs. State is stored in the ALPHA channel (normalized
   0..1) so it round-trips losslessly through the ping-pong buffers, while RGB
   carries the palette() colour that the engine BLITs to screen (canvas is
   alpha:false, so on-screen alpha is ignored). Each mode SEEDs on u_frame==0
   with a hash and samples its neighbourhood from u_backbuffer every other frame.
   Every settings param is wired to a uniform float and actually used. */
(function(){
const R = window.VOC.register;
const CAT = 'Cellular Automata';

/* shared GLSL helpers prepended to every body.
   stateAt(fc): previous cell state index (rounded 0..S-1) via toroidal wrap.
   emit(state,S): write colour to rgb + raw normalized state to alpha.        */
const H = `
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
vec4 prev(vec2 fc){ return texture(u_backbuffer, fract(fc/u_resolution)); }
float stateAt(vec2 fc,float S){ return floor(prev(fc).a*(S-1.)+0.5); }
void emit(float st,float S){
  float t = (S<=1.5)? st : st/(S-1.);
  voc_out = vec4( palette(t), st/(S-1.) );
}
`;

//============================================================ 2D Generations CA
// Generations family: a live cell (state 1) survives on certain neighbour
// counts, a dead cell (0) is born on others, and dying cells age 2..S-1 through
// refractory steps before vanishing. (Classic "Star Wars" 345/2/4 vibe.)
R({
  name:'2D Generations CA', category:CAT, type:'pingpong',
  params:[ {key:'states',label:'states',min:2,max:8,step:1,value:4},
           {key:'sLo',label:'survive min',min:0,max:8,step:1,value:3},
           {key:'sHi',label:'survive max',min:0,max:8,step:1,value:5},
           {key:'bLo',label:'birth min',min:0,max:8,step:1,value:2},
           {key:'bHi',label:'birth max',min:0,max:8,step:1,value:2},
           {key:'density',label:'seed',min:.05,max:.6,step:.01,value:.3} ],
  frag:H+`uniform float states,sLo,sHi,bLo,bHi,density;
    void main(){
      vec2 fc=gl_FragCoord.xy; float S=max(2.,states);
      if(u_frame==0){ emit(hash(fc+.7)<density?1.:0., S); return; }
      float me=stateAt(fc,S);
      float n=0.;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        float v=stateAt(fc+vec2(float(dx),float(dy)),S);
        if(v>0.5&&v<1.5) n+=1.;
      }
      float ns;
      if(me<0.5){ ns=(n>=bLo-.5&&n<=bHi+.5)?1.:0.; }
      else if(me<1.5){ ns=(n>=sLo-.5&&n<=sHi+.5)?1.:2.; }
      else { ns=(me+1.>S-1.+.5)?0.:me+1.; }
      emit(ns,S);
    }`
});

//================================================== 2D Hexagonal Generations CA
// Generations logic on a 6-neighbour hexagonal lattice (offset-row scheme:
// the diagonal neighbours flip side depending on the row's parity).
R({
  name:'2D Hexagonal Generations CA', category:CAT, type:'pingpong',
  params:[ {key:'states',label:'states',min:2,max:8,step:1,value:5},

  frag:H+`uniform float states,sLo,sHi,bLo,bHi,density;
    float live(vec2 fc,float S){ float v=stateAt(fc,S); return (v>0.5&&v<1.5)?1.:0.; }
    void main(){

      float me=stateAt(fc,S);

//============================================================ 2D Totalistic CA

//================================================================== Archean CA

R({

  params:[ {key:'states',label:'states',min:3,max:12,step:1,value:8},

//=================================================================== Cyclic CA

R({

  params:[ {key:'states',label:'states',min:3,max:16,step:1,value:8},

  frag:H+`uniform float states,threshold,range;
    void main(){

<script>
/* b20.js — Iterated Function Systems family (points archetype).
   Modes: Flame Fractals, Iterated Function Systems.

   Both render via the "chaos game": a point is iterated through a set of
   affine maps chosen at random by probability, and every plotted point is
   accumulated additively into the framebuffer (gl.ONE,gl.ONE blend). Colour
   is carried per-point through a colour coordinate sampled from the active
   palette, mimicking the Scott Draves "flame" colouring.

   - Iterated Function Systems: pure affine chaos game (Barnsley fern,
     Sierpinski, Dragon, etc. selectable). Draves rendering style, gamma +
     contrast tone-mapping wired to the additive alpha so the sliders visibly
     change density/exposure.
   - Flame Fractals: same chaos game, but each affine map is followed by a
     nonlinear "variation" (sinusoidal / spherical / swirl / horseshoe /
     handkerchief blend) producing organic flame structure. gamma, brightness
     and contrast control log-density tone mapping via the per-point alpha.

   Points are computed on the CPU and only recomputed when a structural
   parameter (variant / variation / point budget) changes; gamma/brightness/
   contrast only retune the draw, so they stay smooth. Registers into window.VOC. */
(function(){
const R = window.VOC.register;

// ---- shared point program: pos.xy in clip space, pos.z = colour coord 0..1 ----
const VS = `#version 300 es
in vec3 pos;
out float v_t;
void main(){ gl_Position=vec4(pos.xy,0.,1.); gl_PointSize=1.0; v_t=pos.z; }`;

const FS = `#version 300 es
precision highp float;
in float v_t; out vec4 o;
uniform sampler2D u_pal; uniform float u_alpha;
void main(){
  o = vec4(texture(u_pal, vec2(clamp(v_t,0.0,1.0),0.5)).rgb * u_alpha, u_alpha);
}`;

// deterministic RNG so output is stable frame-to-frame (no flicker)
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function makePointGL(api, MAX){
  const gl=api.gl;
  const prog=api.buildProgramVF(VS,FS);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER, MAX*3*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  return {prog,vao,buf,MAX,data:new Float32Array(MAX*3),count:0};
}

function uploadAndDraw(api,g,alpha){
  const gl=api.gl;
  api.toScreen(); api.clear(0,0,0,1);
  if(g.count<=0) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);   // additive accumulation
  gl.useProgram(g.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, api.paletteTex);
  gl.uniform1i(gl.getUniformLocation(g.prog,'u_pal'),1);
  gl.uniform1f(gl.getUniformLocation(g.prog,'u_alpha'),alpha);
  gl.bindVertexArray(g.vao);
  gl.drawArrays(gl.POINTS,0,g.count);
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}

// map gamma/brightness/contrast sliders to a single per-point additive alpha.
// Higher point budgets accumulate more, so alpha is scaled down by count to keep
// exposure roughly constant; gamma<1 boosts low density, contrast deepens it.
function exposure(count, gamma, brightness, contrast){
  const base = 16000.0 / Math.max(1, count);    // normalise by point count
  // gamma applied as an exponent on the base exposure (1.3 default -> dimmer-ish)
  const g = Math.max(0.2, gamma);
  let a = brightness * base * Math.pow(base, (1.0/g) - 1.0);
  a *= (1.0 + contrast * 0.6);                    // contrast lifts the per-hit weight
  return Math.min(0.9, Math.max(0.0025, a));
}

// ----------------------------------------------------------- affine IFS systems
// each system = array of maps; each map = {a,b,c,d,e,f, p, col}
//   x' = a*x + b*y + c ;  y' = d*x + e*y + f ;  p = probability ; col = palette coord
const IFS_SYSTEMS = [
  // 0: Barnsley Fern
  [
    {a:0,b:0,c:0,d:0,e:0.16,f:0,p:0.01,col:0.05},
    {a:0.85,b:0.04,c:0,d:-0.04,e:0.85,f:1.6,p:0.85,col:0.35},
    {a:0.20,b:-0.26,c:0,d:0.23,e:0.22,f:1.6,p:0.07,col:0.65},

  ],

const IFS_BOUNDS = [   // [minX,maxX,minY,maxY] used to fit each system to clip space
  [-2.5, 2.7,  0.0, 10.5],   // fern
  [ 0.0, 1.0,  0.0, 1.0],    // sierpinski
  [-0.4, 1.15,-0.65,0.65],   // dragon
  [-3.0, 3.0, -3.0, 3.0],    // maple
];

function buildIFS(g, variant, seed){
  const sys = IFS_SYSTEMS[variant % IFS_SYSTEMS.length];
  const bnd = IFS_BOUNDS[variant % IFS_BOUNDS.length];
  // cumulative probability table
  const cum=[]; let acc=0;
  for(const m of sys){ acc+=m.p; cum.push(acc); }
  const total=acc;
  const rng=mulberry32((seed|0) + variant*1013904223);
  const d=g.data; const N=g.MAX;
  const sx=1.86/(bnd[1]-bnd[0]), sy=1.86/(bnd[3]-bnd[2]);
  const cx=(bnd[0]+bnd[1])*0.5, cy=(bnd[2]+bnd[3])*0.5;
  let x=0.0, y=0.0, col=0.5, w=0;
  // warm-up so the orbit lands on the attractor
  for(let i=0;i<30;i++){
    const r=rng()*total; let k=0; while(cum[k]<r) k++;
    const m=sys[k];
    const nx=m.a*x+m.b*y+m.c, ny=m.d*x+m.e*y+m.f; x=nx; y=ny;
  }
  for(let i=0;i<N;i++){
    const r=rng()*total; let k=0; while(cum[k]<r) k++;
    const m=sys[k];
    const nx=m.a*x+m.b*y+m.c, ny=m.d*x+m.e*y+m.f; x=nx; y=ny;
    col = (col + m.col)*0.5;                         // blend colour toward map's hue
    d[w++] = (x-cx)*sx;                              // -> clip x
    d[w++] = (y-cy)*sy;                              // -> clip y
    d[w++] = col;                                    // palette coord
  }
  g.count = N;
  const gl_=g._gl;
  gl_.bindBuffer(gl_.ARRAY_BUFFER, g.buf);
  gl_.bufferSubData(gl_.ARRAY_BUFFER, 0, d);
}

// ---------------------------------------------------------------- Flame Fractals
// affine map followed by a nonlinear "variation" (Draves flame). Each variation
// id picks the post-transform applied to (x,y).
function variation(vid, x, y){
  const r2 = x*x + y*y;
  const r = Math.sqrt(r2);
  const theta = Math.atan2(x, y);
  switch(vid){
    case 0: return [x, y];                                   // linear
    case 1: return [Math.sin(x), Math.sin(y)];               // sinusoidal
    case 2: { const k=1.0/(r2+1e-6); return [x*k, y*k]; }    // spherical
    case 3: return [x*Math.sin(r2)-y*Math.cos(r2),           // swirl
                    x*Math.cos(r2)+y*Math.sin(r2)];
    case 4: { const k=1.0/(r+1e-6); return [(x-y)*(x+y)*k, 2.0*x*y*k]; } // horseshoe
    case 5: return [r*Math.sin(theta+r), r*Math.cos(theta-r)]; // handkerchief-ish
    case 6: { const s=Math.sin(theta), c=Math.cos(theta);    // disc
              const t=theta/Math.PI;
              return [t*Math.sin(Math.PI*r), t*Math.cos(Math.PI*r)]; }
    default: return [x, y];
  }
}

// a fixed bank of affine maps with colour coords; the chaos game randomly
// selects one each step, applies it, then applies the chosen variation.
const FLAME_MAPS = [
  {a: 0.55,b:-0.62,c: 0.10,d: 0.62,e: 0.55,f: 0.05,p:0.34,col:0.10},
  {a: 0.45,b: 0.50,c:-0.30,d:-0.50,e: 0.45,f: 0.20,p:0.33,col:0.55},
  {a:-0.50,b: 0.40,c: 0.20,d: 0.40,e: 0.50,f:-0.25,p:0.33,col:0.92},
];

function buildFlame(g, vid, seed){
  const sys=FLAME_MAPS;
  const cum=[]; let acc=0; for(const m of sys){ acc+=m.p; cum.push(acc); }
  const total=acc;
  const rng=mulberry32((seed|0) + (vid+1)*2246822519);
  const d=g.data, N=g.MAX;
  let x=rng()*2-1, y=rng()*2-1, col=0.5, w=0;
  // measure extent on a probe pass to auto-fit, then plot
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  let px=x, py=y, pcol=col;
  const probe=Math.min(4000, N);
  for(let i=0;i<probe+40;i++){
    const r=rng()*total; let k=0; while(cum[k]<r) k++; const m=sys[k];
    let nx=m.a*px+m.b*py+m.c, ny=m.d*px+m.e*py+m.f;
    const v=variation(vid, nx, ny); px=v[0]; py=v[1];
    if(i>40 && isFinite(px) && isFinite(py)){
      if(px<minX)minX=px; if(px>maxX)maxX=px;
      if(py<minY)minY=py; if(py>maxY)maxY=py;
    }
  }
  if(!isFinite(minX)||minX>=maxX){ minX=-1.2; maxX=1.2; }
  if(!isFinite(minY)||minY>=maxY){ minY=-1.2; maxY=1.2; }
  // pad bounds a touch
  const padX=(maxX-minX)*0.08, padY=(maxY-minY)*0.08;
  minX-=padX; maxX+=padX; minY-=padY; maxY+=padY;
  const sx=1.9/(maxX-minX), sy=1.9/(maxY-minY);
  const cx=(minX+maxX)*0.5, cy=(minY+maxY)*0.5;
  // warm-up the plotting orbit
  for(let i=0;i<40;i++){
    const r=rng()*total; let k=0; while(cum[k]<r) k++; const m=sys[k];
    let nx=m.a*x+m.b*y+m.c, ny=m.d*x+m.e*y+m.f;
    const v=variation(vid, nx, ny); x=v[0]; y=v[1];
    col=(col+m.col)*0.5;
  }
  for(let i=0;i<N;i++){
    const r=rng()*total; let k=0; while(cum[k]<r) k++; const m=sys[k];
    let nx=m.a*x+m.b*y+m.c, ny=m.d*x+m.e*y+m.f;
    const v=variation(vid, nx, ny); x=v[0]; y=v[1];
    if(!isFinite(x)||!isFinite(y)){ x=rng()*2-1; y=rng()*2-1; col=0.5; }
    col=(col+m.col)*0.5;
    d[w++]=(x-cx)*sx;
    d[w++]=(y-cy)*sy;
    d[w++]=col;
  }
  g.count=N;
  const gl_=g._gl;
  gl_.bindBuffer(gl_.ARRAY_BUFFER, g.buf);
  gl_.bufferSubData(gl_.ARRAY_BUFFER, 0, d);
}
