<script>
/* b9.js — Dendritic Growth + Fluid (pingpong batch)
   Modes: Dendritic Crystal Growth, Gravner-Griffeath Snowflakes,
          Reiter Snowflakes, Ripple Tank.
   All are float-state ('hdr') pingpong feedback sims:
     state packed in r/g/b channels of u_backbuffer, seeded at u_frame==0,
     8/6-neighbour stencil sampled at +/-1px, coloured via palette().
   Registers into window.VOC. */
(function(){
const R = window.VOC.register;

//============================================================ Dendritic Crystal Growth
// Phase-field-style melt-front solidification. A solid seed grows into an
// undercooled medium; latent heat released at the front feeds back and the
// anisotropy parameter gives the classic 6-fold dendrite arms.
//   state.r = phase phi  (0=liquid, 1=solid)
//   state.g = temperature u (0=undercooled bath, rises toward teq at front)
R({
  name:'Dendritic Crystal Growth', category:'Dendritic Growth', type:'pingpong', hdr:true,
  params:[ {key:'k',          label:'k (coupling)',  min:0.5, max:3.0,  step:0.01, value:1.7},
           {key:'alpha',      label:'alpha (diff)',  min:0.1, max:2.0,  step:0.01, value:0.9},
           {key:'teq',        label:'teq',           min:0.5, max:2.0,  step:0.01, value:1.3},
           {key:'anisotropy', label:'anisotropy',    min:0.0, max:12.0, step:1.0,  value:5.0},
           {key:'gamma',      label:'gamma (drive)', min:1.0, max:20.0, step:0.1,  value:10.0} ],
  frag:`uniform float k,alpha,teq,anisotropy,gamma;
    vec2 St(vec2 fc){ return texture(u_backbuffer, fc/u_resolution).rg; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      if(u_frame==0){
        // undercooled liquid everywhere (u=0), a small solid seed at centre
        float d=length(fc-0.5*u_resolution);
        float seed=d<4.0?1.0:0.0;
        gl_FragColor=vec4(seed, seed*teq, 0.0, 1.0); return;
      }
      vec2 c=St(fc);
      float phi=c.r, u=c.g;
      // laplacians (5-point) of phase and temperature
      vec2 L=vec2(0.);
      L+=St(fc+vec2( 1.,0.));   L+=St(fc+vec2(-1.,0.));
      L+=St(fc+vec2( 0.,1.));   L+=St(fc+vec2( 0.,-1.));
      L-=4.0*c;
      float lapPhi=L.r, lapU=L.g;
      // local gradient angle of phase -> orientation-dependent driving force
      float gx=St(fc+vec2(1.,0.)).r - St(fc+vec2(-1.,0.)).r;
      float gy=St(fc+vec2(0.,1.)).r - St(fc+vec2(0.,-1.)).r;
      float ang=atan(gy,gx);
      float aniso=1.0 + 0.30*cos(anisotropy*ang);
      // bistable reaction: m drives phi toward 0 or 1 depending on undercooling.
      // Kobayashi phase-field: m>0 (cell colder than teq) pushes phi -> solid.
      float m=(alpha/3.14159)*atan(gamma*(teq-u));
      float dphi=aniso*( 0.80*lapPhi + 1.4*phi*(1.0-phi)*(phi-0.5+m) );
      phi=clamp(phi+dphi,0.0,1.0);
      // temperature diffuses + gains latent heat from the freezing front
      u=u + 0.30*alpha*lapU + k*dphi;
      u=clamp(u,0.0,2.5);
      // hdr float targets: this texture is blitted straight to screen, so the
      // stored state must ALSO read as a plausible image. Feedback reads .rg, so
      // r and g must stay pure: r=phi (crystal), g=u (temperature). The free b
      // channel adds a cold-blue rim from the (read-only) gradient shade so the
      // dendrite looks 3D-shaded rather than flat red/green.
      float shade=0.55+0.45*clamp((gx+gy)*6.0,-1.0,1.0);
      float blue = phi*0.4*shade + 0.06 + 0.12*clamp(u,0.0,1.0);
      gl_FragColor=vec4(phi, u, blue, 1.0);
    }`
});

//============================================================ Gravner-Griffeath Snowflakes
// Hex-lattice diffusion/deposition snowflake (the "Snowflakes 2" model).
// Six hex neighbours approximated on the square grid (axial offsets). A vapour
// field diffuses; boundary cells (liquid-adjacent-to-ice) freeze a fraction of
// nearby vapour; ice slowly sublimates back to vapour.
//   r = ice mass (a)          (boundary/attached crystal)
//   g = diffusive vapour (d)
//   b = is-frozen flag        (>0.5 == part of the crystal)
R({
  name:'Gravner-Griffeath Snowflakes', category:'Dendritic Growth', type:'pingpong', hdr:true,
  params:[ {key:'density',     label:'vapour density',   min:0.30, max:0.90, step:0.01,  value:0.58},
           {key:'anisotropy',  label:'anisotropy',       min:0.0,  max:6.0,  step:0.1,   value:2.0},
           {key:'aftergrowth', label:'aftergrowth',      min:0.0,  max:1.0,  step:0.01,  value:0.30},
           {key:'crystallize', label:'crystallization',  min:0.01, max:0.30, step:0.005, value:0.05},
           {key:'melting',     label:'melting',          min:0.0,  max:0.10, step:0.002, value:0.01} ],
  frag:`uniform float density,anisotropy,aftergrowth,crystallize,melting;
    vec3 St(vec2 fc){ return texture(u_backbuffer, fc/u_resolution).rgb; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      if(u_frame==0){
        float d=length(fc-0.5*u_resolution);
        float frozen=d<2.0?1.0:0.0;
        // ice cells start fully attached; everywhere else holds vapour=density
        gl_FragColor=vec4(frozen, frozen>0.5?1.0:density, frozen, 1.0); return;
      }
      vec3 c=St(fc);
      float ice=c.r, vap=c.g, frozen=c.b;
      // hexagonal axial neighbours mapped onto the square grid
      vec2 o[6]; o[0]=vec2(1.,0.); o[1]=vec2(-1.,0.); o[2]=vec2(0.,1.);
      o[3]=vec2(0.,-1.); o[4]=vec2(1.,1.); o[5]=vec2(-1.,-1.);
      float vsum=0.0, fcount=0.0;
      for(int i=0;i<6;i++){ vec3 n=St(fc+o[i]); vsum+=n.g; fcount+=n.b; }
      bool isFrozen = frozen>0.5;
      bool boundary = !isFrozen && fcount>0.5;
      if(isFrozen){
        // crystal: slow sublimation back into vapour (melting)
        float sub=melting*ice;
        ice-=sub; vap+=sub;
      } else {
        // diffusion of vapour (anisotropic: hex directions weighted)
        float lap=(vsum - 6.0*vap)/6.0;
        float aw=1.0 + 0.05*anisotropy;
        vap += 0.5*aw*lap;
        if(boundary){
          // freeze a fraction; threshold lowered where many frozen neighbours
          float thr=density*(1.0 - 0.12*fcount) - aftergrowth*0.05*fcount;
          if(vap>thr){
            frozen=1.0; ice=vap*crystallize+aftergrowth*0.2*fcount;
            vap*=(1.0-crystallize);
          }
        }
      }
      vap=clamp(vap,0.0,3.0); ice=clamp(ice,0.0,3.0);
      // hdr float targets blitted straight to screen, so rgb is both state and
      // image. Feedback reads .rgb, so all three stay pure: r=ice (crystal mass,
      // shows red/warm), g=vap (vapour field, green haze), b=frozen flag (0/1,
      // icy-blue crystal). The combination reads as a blue-white flake on a
      // green vapour field. Reads back cleanly for the next step.
      gl_FragColor=vec4(ice, vap, frozen, 1.0);
    }`
});

//============================================================ Reiter Snowflakes
// Reiter (1993) two-class cellular snowflake on a (square-approx) hex grid.
//   s = water amount per cell. Receptive cells (s>=1, or neighbour-of-frozen)
//   are removed from diffusion and gain background vapour beta each step plus a
//   constant addition gamma; non-receptive cells diffuse with constant alpha.
//   r = total water s ; b = receptive/frozen flag
R({
  name:'Reiter Snowflakes', category:'Dendritic Growth', type:'pingpong', hdr:true,
  params:[ {key:'alpha', label:'alpha (diffusion)', min:0.5,  max:2.0,  step:0.01,  value:1.0},
           {key:'beta',  label:'beta (vapour)',     min:0.3,  max:0.9,  step:0.005, value:0.6},
           {key:'gamma', label:'gamma (addition)',  min:0.0,  max:0.01, step:0.0001,value:0.0008} ],
  frag:`uniform float alpha,beta,gamma;
    // returns vec2(s, frozen) for a cell
    vec2 Cell(vec2 fc){ vec3 t=texture(u_backbuffer, fc/u_resolution).rgb; return vec2(t.r, t.b); }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      if(u_frame==0){
        float d=length(fc-0.5*u_resolution);
        float frozen=d<1.5?1.0:0.0;
        // background vapour beta everywhere, single frozen seed (s=1) at centre
        gl_FragColor=vec4(frozen>0.5?1.0:beta, 0.0, frozen, 1.0); return;
      }
      vec2 me=Cell(fc);
      float s=me.x, frozen=me.y;
      // hex neighbourhood (6 cells)
      vec2 o[6]; o[0]=vec2(1.,0.); o[1]=vec2(-1.,0.); o[2]=vec2(0.,1.);
      o[3]=vec2(0.,-1.); o[4]=vec2(1.,1.); o[5]=vec2(-1.,-1.);
      float nFrozen=0.0;
      for(int i=0;i<6;i++){ if(Cell(fc+o[i]).y>0.5) nFrozen+=1.0; }
      // a cell is receptive if frozen or adjacent to a frozen cell
      bool receptive = (frozen>0.5) || (nFrozen>0.5);
      // split field: receptive cells hold their water (the "u/v" Reiter split),
      // non-receptive cells participate in diffusion.
      // average of NON-receptive neighbour water for the diffusion term:
      float sumDiff=0.0;
      for(int i=0;i<6;i++){
        vec2 n=Cell(fc+o[i]);
        bool rFrz=false;
        // neighbour receptive? frozen, or one of ITS neighbours frozen — approx
        if(n.y>0.5) rFrz=true;
        float un = rFrz ? 0.0 : n.x;   // only non-receptive water diffuses
        sumDiff+=un;
      }
      float uMe = receptive ? 0.0 : s;
      // discrete Laplacian diffusion (Reiter uses average-of-neighbours blend)
      float diff = uMe + (alpha/12.0)*(sumDiff - 6.0*uMe);
      float newS;
      if(receptive){
        // receptive: keep water + constant vapour addition (beta done at seed),
        // plus the diffused vapour that arrived, plus gamma growth term
        newS = s + diff + gamma;
        // freeze once enough water accumulates
        if(newS>=1.0) frozen=1.0;
      } else {
        newS = diff;
      }
      newS=clamp(newS,0.0,2.0);
      float t = frozen>0.5 ? 0.5+0.5*clamp(newS-1.0,0.0,1.0)
                           : 0.05+0.35*clamp(newS,0.0,1.0);
      // pack state: r=s, g=colour-helper, b=frozen. We display rgb directly so
      // bias r toward something visible while preserving frozen in b.
      gl_FragColor=vec4(newS, t, frozen, 1.0);
    }`
});

//============================================================ Ripple Tank
// 2D wave equation (finite-difference) on a feedback grid. A central oscillating
// source plus a moving mouse-driven source emit circular waves; damping bleeds
// energy so it stays bounded.
//   r = height at t      (h)
//   g = height at t-1    (hPrev)
R({
  name:'Ripple Tank', category:'Fluid', type:'pingpong', hdr:true,
  params:[ {key:'speed',     label:'wave speed',  min:0.05, max:0.50, step:0.005, value:0.30},
           {key:'damping',   label:'damping',     min:0.90, max:1.00, step:0.001, value:0.996},
           {key:'frequency', label:'source freq', min:0.05, max:2.00, step:0.01,  value:0.40} ],
  frag:`uniform float speed,damping,frequency;
    float H(vec2 fc){ return texture(u_backbuffer, fc/u_resolution).r; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      if(u_frame==0){ gl_FragColor=vec4(0.0,0.0,0.0,1.0); return; }
      vec2 c=texture(u_backbuffer, fc/u_resolution).rg;
      float h=c.r, hPrev=c.g;
      // 5-point laplacian
      float lap=H(fc+vec2(1.,0.))+H(fc+vec2(-1.,0.))
               +H(fc+vec2(0.,1.))+H(fc+vec2(0.,-1.))-4.0*h;
      float c2=speed*speed;
      float hNew=(2.0*h - hPrev + c2*lap)*damping;
      // central driven source
      vec2 ctr=0.5*u_resolution;
      float dC=length(fc-ctr);
      if(dC<3.0) hNew=sin(u_time*frequency*6.2831)*1.0;
      // mouse source (when the pointer is on-screen)
      if(u_mouse.x>1.0 || u_mouse.y>1.0){
        float dM=length(fc-u_mouse);
        if(dM<3.0) hNew=sin(u_time*frequency*6.2831*1.7)*1.0;
      }
      hNew=clamp(hNew,-1.5,1.5);
      // colour: map signed height through palette; store state in r,g
      float t=0.5+0.5*clamp(hNew,-1.0,1.0);
      gl_FragColor=vec4(hNew, h, t, 1.0);
    }`
});

})();

</script>

R({name:"Plasma HSV", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvec3 hsv(float h,float s,float v) {\n    return mix(vec3(1.),clamp((abs(fract(h+vec3(3.,2.,1.)/3.)*6.-3.)-1.),0.,1.),s)*v;\n}\n\nvoid main( void ) {\n    vec2 position = (gl_FragCoord.xy/resolution.y-vec2((resolution.x/resolution.y)/2.0,0.5))/1.0;\n    float value = sin(1.0-distance(position,vec2(sin(atan(position.y, position.x)+time),sin(time+atan(time, position.y)-length(position))))*32.0+time*8.0)*.3+.3;\n    glFragColor = vec4(hsv(value+position.x*position.y, 1.0, 1.0), 1.0 );\n}"});
R({name:"Plasma Colormap", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/tsSBzW\n\n#define pi 3.141579\n\nmat2 rot(float deg) {\n    deg /= 180./3.141579; // convert to radians;\n    float s=sin(deg), c=cos(deg);\n    return mat2(c, -s, s, c);\n}\n\nvec3 colormap(float v) {\n   float r = (.5+.5*sin(pi * v));\n   float g = ( .5 + .5 * sin(pi * v + 2.0 * pi / 3.0));\n   float b = ( .5 + .5 * sin(pi * v + 4.0 * pi / 3.0));\n   return vec3(r,g,b);\n}\n\nfloat calc (vec2 cv, vec2 uv, float t,float cost3,float sint5,float sint2) {\n     float v = 0.0;\n    float x = uv.x;\n    float y = uv.y;\n    float cx = cv.x;\n    float cy = cv.y;\n    float v0 = sin((x * 10.0) + t);\n    float v1 = sin(10.0 * ( x * sint2 + y * cost3));\n    float v2 = sin(sqrt(100.0*((cx*cx)+(cy*cy)))+1.0+t);\n    v = ((v0 + v1 + v2) + cos(v2 + y + t)) / 2.0;\n    return v;\n}\n\nvoid main(void)\n{\n\n    vec2 uv = (gl_FragCoord.xy-.5*resolution.xy)/resolution.y;\n    vec2 ov = uv;\n    uv.x += sin((time/1.)/5.0);                    // x movement\n    uv.y += cos((time/1.)/3.0);                    // y movement\n    uv *= .5 * (2.+(1.*sin(2.*pi*.04*time)/10.));  // zoom\n    uv *= rot(22.5+(180.*sin(2.*pi*.01*time)));    // rotation\n    float t = time;\n    float tt=t / 1.0;\n    float cost3 = cos(tt/3.0);\n    float sint5 = sin(tt/5.0);\n    float sint2 = sin(tt/2.0);\n    float v = calc(uv,ov,tt,cost3,sint5,sint2);\n    vec3 hole = colormap(v);\n   \n    glFragColor = vec4(hole,1.0);\n    \n}"});
R({name:"Plasma Drift", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/wsjfWy\n\nfloat plasma(vec2 uv, float t) {\n    // these are just random values with time added (I'm not sure if I actually need this many)\n    vec2 p0 = vec2(0.23 + t, 0.76 - 0.4 * t);\n    vec2 p1 = vec2(-0.77 + 0.1 * t, 0.11 + 0.7 * t);\n    vec2 p2 = vec2(0.63 - 0.3 * t, 0.26 + 0.2 * t);\n    vec2 p3 = vec2(-0.47 - 0.55 * t, 0.91 - 0.35 * t);\n    float a = 2.0;\n    // here is the formula\n    float grey = dot(sin(p0 + uv + a * sin(p1 + 1.6 * uv.yx)), sin(p2 + 1.4 * uv.yx + a * sin(p3 + 1.2 * uv)));\n    return 0.5 + grey * 0.25;\n}\n\nvoid main(void)\n{\n    // Normalized pixel coordinates (from 0 to 1)\n    vec2 uv = gl_FragCoord.xy/resolution.xy;\n    // Time varying pixel color\n    uv *= 4.0;\n    vec3 col = vec3(plasma(uv, 0.0 + time), plasma(uv, 0.3 + time), plasma(uv, 0.6 + time));\n    // Output to screen\n    glFragColor = vec4(col,1.0);\n}"});
R({name:"Spiral Motion Blur", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/lssXzs\n\nconst float AaSqrt = 4.;\nconst float ShutterSpeed = 1.0/30.0;\n\n#define PI  3.14159265359\n#define TAU 6.28318530718\n\nfloat Saw(float t)\n{\n    return fract(t);\n}\n\nfloat SmoothSaw(float t)\n{\n    return smoothstep(0.0, 1.0, fract(t));\n}\n\nfloat SmootherSaw(float t)\n{\n    return smoothstep(0.0, 1.0, smoothstep(0.0, 1.0, fract(t)));\n}\n    \nvec3 Scene(vec2 q, float t)\n{\n    t = SmoothSaw(t/2.);\n    \n    float r = length(q);\n    float a = atan(q.y,q.x);\n    float u = 0.0;\n    \n\n    u = 10.*a + 3.*TAU*t*(1.- 4.0*(1. - r)*sin(TAU*t));\n    u = 20.0*r*(1.0 + 0.1*cos(u));\n\n    \n    u = 0.5 + 0.5*cos(u);\n    u = min(floor(2.0*u),1.0);\n    \n    u *= 1.0-smoothstep(1.,1.+0.00001,r);\n\n    vec3 Col1 = vec3(0.01);\n    vec3 Col2 = vec3(0.95);\n    \n    return mix(Col1, Col2, u);\n}\n\nvoid main(void)\n{\n    float Ratio = 0.45*min(resolution.x, resolution.y);\n    \n    const float AaCount = AaSqrt*AaSqrt;\n    \n    // Render scene in linear space with motion blur and AA:\n    vec3 ColSum = vec3(0);\n    for(float F=0.0; F<AaCount; F++)\n    {\n        // AA:\n        vec2 Off = vec2(1. + F/AaSqrt, mod(1. + F,AaSqrt)) / AaSqrt;\n        vec2 UV = (gl_FragCoord.xy  + Off - resolution.xy/2.0) / Ratio;    \n        \n        // Motion blur:\n        float t = time + F*ShutterSpeed / AaCount;\n        \n        // Render:\n        ColSum += Scene(UV, t);\n    }\n    \n    ColSum /= AaCount;\n    \n    // Apply gamma:\n    ColSum = pow(ColSum, vec3(1.0/2.2));\n    \n    glFragColor = vec4(ColSum,1.0);\n}"});
R({name:"Spiral Bloom", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvec3 hsv(float h,float s,float v) {\n    return mix(vec3(1.),clamp((abs(fract(h+vec3(3.,2.,1.)/3.)*6.-3.)-1.),0.,1.),s)*v;\n}\n\nvoid main( void ) {\n    vec2 p =-1.0+2.0* ( gl_FragCoord.xy / resolution.xy );\n    p.x *= resolution.x/resolution.y;\n    float iter = 0.0;\n    float s = sin(time*0.1);\n    float c = cos(time*0.1);\n    vec3 col = vec3(0);\n    for (int i = 0; i < 100; i++) {\n        p = vec2(p.x*p.x*(1.0*p.y-p.x)+p.y, p.y*p.y*(1.0*p.x-p.y)+p.x);\n        p = vec2(s*p.y+c*p.x, s*p.x-c*p.y);\n        //if (dot(p,p) >2.0) break;\n        col += hsv(dot(p,p),0.3,0.05)*smoothstep(16.0,0.0,dot(p,p));\n        iter++;\n    }\n\n    glFragColor = vec4( sin(col), 1.0 );\n\n}"});
R({name:"Spiral Pi", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// spiral with lots of pi, by the very bored ninnghazad\n\nmat2 rot(float angle) {\n    return mat2( cos( angle ), -sin( angle ),sin( angle ),  cos( angle ));\n}\n#define PI2 6.28318530718\nvoid main( void ) {\n    vec2 position = (sin(time)*PI2+PI2*PI2) * ((PI2 * gl_FragCoord.xy - resolution) / resolution.xx) * rot(-time*PI2+(-PI2*(sin(time))))/PI2;\n    float a = atan(position.y, position.x);\n    a = a + PI2 * float(floor(((PI2*length(position)) - a + PI2) / PI2));\n    glFragColor.rgb = vec3(sin(-a/PI2+time*PI2))*normalize(vec3(sin(time),cos(time),sin(time)*cos(time)));\n}"});
R({name:"Twist Raymarch", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define ITER_MAX 100\n#define MAX_DIST 50.0\n#define EPS 0.002\n\nfloat sphere(in vec3 p, float radius)\n{\n    return length(p) - radius;\n}\n\nfloat box(in vec3 p, in vec3 sz, float r)\n{\n    return length(max(abs(p) - sz, 0.0)) - r;    \n}\n\nvec3 twist(in vec3 p)\n{\n    float c = cos(6. * p.y * sin(time*.2));\n    float s = sin(6. * p.y * sin(time*.2));\n\n    mat2  m = mat2(c, -s, s, c);\n    vec3  q = vec3(m * p.xz, p.y);\n    \n    return q;\n\n}\n\nfloat F(in vec3 p)\n{\n    return box(twist(p+vec3(0.,2.,0.)), vec3(.3+cos((time+p.y)*3.)*.3, .3+sin((time+p.y)*5.)*.2, 4.9), 0.1);\n    //return sphere(twist(p), 1.0);\n}\n\nvec3 getNormal(vec3 p)\n{\n    vec3 e = vec3(0.0, EPS, 0.0);\n    vec3 n = vec3(F(p + e.yxx) - F(p - e.yxx),\n                      F(p + e.xyx) - F(p - e.xyx),\n                      F(p + e.xxy) - F(p - e.xxy));\n        n = normalize(n);\n        return n;\n}\n\nvec3 rayCast(in vec3 o, in vec3 d)\n{\n    float dist = 0.0;\n    float totalDist = 0.0;\n    vec3 FogColor = vec3(0.5);\n    vec3 color = FogColor * 0.5;\n    float minDist = 0.0001;\n    \n    vec3 LightPos = vec3(2.0, 1.5, 1.0);\n    vec3 LightColor = vec3(0.8, 0.8, 0.8);\n    \n    for (int step = 0; step < ITER_MAX; step++)\n    {\n        vec3 p = o + totalDist * d;\n        dist = F(p)*.5; // mul * const to allow for more distortion\n        totalDist += dist;\n    \n        if (dist < minDist)\n            break;\n        \n        if (totalDist > MAX_DIST)\n        {\n            totalDist = MAX_DIST;\n            break;\n        }\n    }\n    \n    // hit\n    if (dist < 0.001)\n    {\n        vec3 P = o + totalDist * d;\n        vec3 N = getNormal(P); //P; // sphere normal = P\n        vec3 L = normalize(LightPos - P);\n        // Phong et falloff todo\n        //vec3 V, H\n        //float falloff = ...\n        \n        float ambient = max(0.1, dot(N, d));\n        float diffuse = max(0.0, dot(N, L));\n        \n        //float spec = todo\n        //float ao = todo\n        \n        vec3 objColor = vec3(0.9, 0.6, 0.3);\n        \n        color = (objColor *  LightColor * diffuse) + (objColor * ambient);\n        \n        // *= ao;\n    }\n\n    color = mix(color, FogColor, smoothstep(0.0, 1.0, totalDist / MAX_DIST));\n    return color;\n    \n}\n\nvoid main( void )\n{\n\n    vec2 texcoord = gl_FragCoord.xy / resolution;\n    vec2 pix = -1.0 + 2.0 * texcoord;\n    pix.x *= resolution.x / resolution.y;\n    pix.x = -pix.x;\n\n    float r = abs(sin(time / 12.0) * 4.0) + 2.0;\n    vec3 campos = vec3(3.0, 2.0, 3.0);//vec3(r * cos(time), sin(time / 5.0), r * sin(time));\n    \n    vec3 camLookAt = vec3(0.0);\n    vec3 upVector = vec3(0.0, 1.0, 0.0);\n\n    vec3 rayOrigin = campos;\n    vec3 ww = normalize(camLookAt - rayOrigin);\n    vec3 uu = normalize(cross(upVector, ww));\n    vec3 vv = normalize(cross(ww, uu));\n    vec3 rayDir = normalize(pix.x * uu + pix.y * vv + 1.5 * ww);\n        \n    vec3 color = rayCast(rayOrigin, rayDir);\n    \n    glFragColor = vec4(color, 1.0);\n\n}"});
R({name:"Twist Squares", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n// original https://www.shadertoy.com/view/XsXXDH\n\nconst float PI = 3.14159265;\n\nvec2 rotate_u(vec2 v, float a) {\n    float sinA = sin(a);\n    float cosA = cos(a);\n    return vec2(v.x * cosA - v.y * sinA, v.y * cosA + v.x * sinA);     \n}\n\nfloat square(vec2 uv, float d) {\n    return max(abs(uv.x), abs(uv.y)) - d;    \n}\n\nfloat smootheststep(float edge0, float edge1, float x)\n{\n    x = clamp((x - edge0)/(edge1 - edge0), 0.0, 1.0) * 3.14159265;\n    return 0.5 - (cos(x) * 0.5);\n}\n\nvoid main(void)\n{\n    vec2 uv = gl_FragCoord.xy / resolution.xy;\n    uv = uv * 2.0 - 1.0;\n    uv.x *= resolution.x / resolution.y;\n    uv *= 1.5;\n    \n    float period = 5.0;\n    float time = time / period;\n    time = mod(time, 1.0);\n    time = smootheststep(0.0, 1.0, time);\n    \n    glFragColor = vec4(0.0, 0.0, 0.0, 1.0);\n    for (int i = 0; i < 9; i++) {\n        float n = float(i);\n        float size = 1.0 - n / 9.0;\n        float rotateAmount = (n * 0.5 + 0.25) * PI * 2.0; \n        if (square(rotate_u(uv, -rotateAmount * time), size) < 0.0) glFragColor.rgb = vec3(1.0);\n        float blackOffset = mix(1.0 / 4.0, 1.0 / 2.0, n / 9.0) / 9.0;\n        if (square(rotate_u(uv, -(rotateAmount + PI / 2.0) * time), size - blackOffset) < 0.0) glFragColor.rgb = vec3(0.0);\n    }\n}"});
R({name:"Interference Rings", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define M_PI 3.1415926535897932384\n\nfloat derp(float angle, float d) {\n    float x = 1.0;\n    //x *= sin(angle*3.)*0.5;\n    //x *= sin(sin(angle*1.)*1.+time*7.)*0.5;\n    x += 0.5;\n    x *= sin(d*128. - time*20.)*0.5;\n\n    return x;\n}\n\nfloat herp(vec2 pos, vec2 dpos) {\n    vec2 position = (( pos / resolution.xy ) - 0.5) / vec2(resolution.y/resolution.x, 1.0) + dpos;\n    float angle = atan(position.y,position.x);\n    float d = length(position);\n    return derp(angle, d);\n}\n\nvoid main( void ) {\n    vec3 color = vec3(1., 0., 0.);\n\n    vec2 a = vec2(cos(time * 0.6) * 0.2, sin(time * 0.5) * 0.2);\n    vec2 b = vec2(cos(time * 0.3) * 0.2, sin(time * 1.0) * 0.2);\n    vec2 c = vec2(cos(time * 0.2) * 0.2, sin(time * 0.2) * 0.2);\n\n    color.r = herp(gl_FragCoord.xy, a);\n    color.r += herp(gl_FragCoord.xy, b);\n    color.r += herp(gl_FragCoord.xy, c);\n\n    color.r += 0.9;\n    if (color.r < 0.) color.r = 0.;\n    else if (color.r > 1.) color.r = 1.;\n\n    color.r = pow(color.r, 6.0);\n    color = vec3(color.r);\n\n    glFragColor = vec4(color, 1.0);\n}"});
R({name:"Interference Waves", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvoid main( void ) {\n\n    vec2 position = ( gl_FragCoord.xy / resolution.xy * 2.0 ) - 1.0;\n    float aspect = resolution.x / resolution.y;\n    position *= 50.0;\n    position.x *= aspect;\n    vec2 m = mouse * 2.0 - 1.0;\n    m *= 50.0;\n    m.x *= aspect;\n    float color = 0.0;\n    color += sin(length(position) - time * 10.0);\n    color += sin(distance(m, position) - time * 10.0);\n    glFragColor = vec4( vec3( color * 0.0 , color * 0.5, color * 1.0), 1.0 );\n\n}"});
R({name:"FBM Flow", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/XlXXz8\n\nfloat noise3D(vec3 p)\n{\n    return fract(sin(dot(p ,vec3(12.9898,78.233,126.7378))) * 43758.5453)*2.0-1.0;\n}\n\nfloat linear3D(vec3 p)\n{\n    vec3 p0 = floor(p);\n    vec3 p1x = vec3(p0.x+1.0, p0.y, p0.z);\n    vec3 p1y = vec3(p0.x, p0.y+1.0, p0.z);\n    vec3 p1z = vec3(p0.x, p0.y, p0.z+1.0);\n    vec3 p1xy = vec3(p0.x+1.0, p0.y+1.0, p0.z);\n    vec3 p1xz = vec3(p0.x+1.0, p0.y, p0.z+1.0);\n    vec3 p1yz = vec3(p0.x, p0.y+1.0, p0.z+1.0);\n    vec3 p1xyz = p0+1.0;\n    \n    float r0 = noise3D(p0);\n    float r1x = noise3D(p1x);\n    float r1y = noise3D(p1y);\n    float r1z = noise3D(p1z);\n    float r1xy = noise3D(p1xy);\n    float r1xz = noise3D(p1xz);\n    float r1yz = noise3D(p1yz);\n    float r1xyz = noise3D(p1xyz);\n    \n    float a = mix(r0, r1x, p.x-p0.x);\n    float b = mix(r1y, r1xy, p.x-p0.x);\n    float ab = mix(a, b, p.y-p0.y);\n    float c = mix(r1z, r1xz, p.x-p0.x);\n    float d = mix(r1yz, r1xyz, p.x-p0.x);\n    float cd = mix(c, d, p.y-p0.y);\n    \n    \n    float res = mix(ab, cd, p.z-p0.z);\n    \n    return res;\n}\n\nfloat fbm(vec3 p)\n{\n    float f = 0.5000*linear3D(p*1.0); \n          f+= 0.2500*linear3D(p*2.01); \n          f+= 0.1250*linear3D(p*4.02); \n          f+= 0.0625*linear3D(p*8.03);\n          f/= 0.9375;\n    return f;\n}\n\nvoid main(void)\n{\n    vec2 uv = gl_FragCoord.xy/resolution.xy*2.0-1.0;\n    uv.x*=1.78;\n    float ang = time*0.1;\n    mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));\n    uv*=16.0*(sin(time*0.1)+1.5)*rot;\n    \n    float f = fbm(vec3(uv,time)+fbm(vec3(uv,time)+fbm(vec3(uv,time))))*0.5+0.5;\n    \n    vec3 col;\n    col = vec3(fbm(vec3(uv*f*0.3,time*0.75)))*vec3((sin(time*0.2)*0.5+1.5),1.0,0.6);\n    col += vec3(0.1,0.7,0.8)*f;\n    \n    vec3 col2;\n    col2 = vec3(fbm(vec3(uv*f*0.3,time*0.75)))*vec3(0.9,1.0,(sin(time*0.2)*0.5+1.5));\n    col2 += vec3(0.8,0.5,0.1)*f;\n    \n    col = mix(col, col2, smoothstep(-50.0,50.0,uv.x));\n    \n    col *= mix(0.5,sin(time*0.5)*0.25+1.0,length(col));\n    glFragColor = vec4(col,1.0);\n}"});
R({name:"FBM Marble", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define noise(p1,p2) 0.2*sin(p1 * 2.0 + p2) * cos(0.5 -p1 * 7.0)\n\nfloat fbm(vec2 n)\n    {\n    float total = -0.5, amplitude = 8.0;\n    for (int i = 0; i < 3; i++)\n        {\n            \n        total += noise(n.x, n.y) * amplitude;\n        n += n;\n        amplitude *= 0.3;\n        }\n    return total;\n    }\n\nvoid main( void ) \n    {\n    \n    const vec3 c1 = vec3(0.8, 0.5, 1.0);\n    const vec3 c3 = vec3(0.8, 0.5, 0.4);\n    const vec3 c5 = vec3(0);\n    vec2 p = gl_FragCoord.xy * 12.0 /resolution.xy;\n    float q = fbm(p*p/60.0 - vec2(1.0, time * 0.2));\n    vec2 r = vec2(fbm(p + 2.0* q + time * 0.7 - p.x - p.y), fbm(p + q - vec2(0.5, time * 0.94)));\n    vec3 c = mix(c1, c3, fbm(p + r * 0.7)) + mix(c3, c5, r.x) - mix(c1, c5, r.y);\n    c=pow(c* cos(1.57 * gl_FragCoord.y / 600.0), vec3(1.0));    \n    glFragColor = vec4(c, 0);\n    }"});
R({name:"Perlin Clouds", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvec4 mod289(vec4 x)\n{\n  return x - floor(x * (1.0 / 289.0)) * 289.0;\n}\n\nvec4 permute(vec4 x)\n{\n  return mod289(((x*34.0)+1.0)*x);\n}\n\nvec4 taylorInvSqrt(vec4 r)\n{\n  return 1.79284291400159 - 0.85373472095314 * r;\n}\n\nvec2 fade(vec2 t) {\n  return t*t*t*(t*(t*6.0-15.0)+10.0);\n}\n\n// Classic Perlin noise\nfloat cnoise(vec2 P)\n{\n  vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);\n  vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);\n  Pi = mod289(Pi); // To avoid truncation effects in permutation\n  vec4 ix = Pi.xzxz;\n  vec4 iy = Pi.yyww;\n  vec4 fx = Pf.xzxz;\n  vec4 fy = Pf.yyww;\n\n  vec4 i = permute(permute(ix) + iy);\n\n  vec4 gx = fract(i * (1.0 / 41.0)) * 2.0 - 1.0 ;\n  vec4 gy = abs(gx) - 0.5 ;\n  vec4 tx = floor(gx + 0.5);\n  gx = gx - tx;\n\n  vec2 g00 = vec2(gx.x,gy.x);\n  vec2 g10 = vec2(gx.y,gy.y);\n  vec2 g01 = vec2(gx.z,gy.z);\n  vec2 g11 = vec2(gx.w,gy.w);\n\n  vec4 norm = taylorInvSqrt(vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11)));\n  g00 *= norm.x;  \n  g01 *= norm.y;  \n  g10 *= norm.z;  \n  g11 *= norm.w;  \n\n  float n00 = dot(g00, vec2(fx.x, fy.x));\n  float n10 = dot(g10, vec2(fx.y, fy.y));\n  float n01 = dot(g01, vec2(fx.z, fy.z));\n  float n11 = dot(g11, vec2(fx.w, fy.w));\n\n  vec2 fade_xy = fade(Pf.xy);\n  vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);\n  float n_xy = mix(n_x.x, n_x.y, fade_xy.y);\n  return 2.3 * n_xy;\n}\n\nfloat fbm(vec2 v) {\n    int i;\n    float c = 0.0;\n    float w = 0.5;\n    float s = 2.0;\n    \n    c = c + pow(w,0.0)*cnoise(v*pow(s,0.0));\n    c = c + pow(w,1.0)*cnoise(v*pow(s,1.0));\n    c = c + pow(w,2.0)*cnoise(v*pow(s,2.0));\n    c = c + pow(w,3.0)*cnoise(v*pow(s,3.0));\n    c = c + pow(w,4.0)*cnoise(v*pow(s,4.0));\n    c = c + pow(w,5.0)*cnoise(v*pow(s,5.0));\n    c = c + pow(w,6.0)*cnoise(v*pow(s,6.0));\n    c = c + pow(w,7.0)*cnoise(v*pow(s,7.0));    \n    c = c + pow(w,8.0)*cnoise(v*pow(s,8.0));\n    //c = c + pow(w,9.0)*cnoise(v*pow(s,9.0));\n    //c = c + pow(w,10.0)*cnoise(v*pow(s,10.0));\n    \n    return c+0.5;\n}\n\nvoid main(void)\n{\n    vec2 uv = gl_FragCoord.xy / resolution.xy;\n    vec2 p = uv+1.0;\n    vec2 q = vec2(fbm(p), fbm(p+vec2(5.2,1.3)));\n    float c;\n    c = fbm(p+4.0*q+0.2*time);\n    glFragColor = vec4(c-sin(time)*0.4,c,c+cos(time)*0.3,1.0);\n}"});
R({name:"Perlin Fire", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define PI 3.14159265359\n\nfloat rand(vec2 c){\n    return fract(sin(dot(c.xy ,vec2(12.9898,78.233))) * 43758.5453);\n}\n\nfloat noise_u(vec2 p, float freq ){\n    float unit = (resolution.x / resolution.y)/freq;\n    vec2 ij = floor(p/unit);\n    vec2 xy = mod(p,unit)/unit;\n    //xy = 3.*xy*xy-2.*xy*xy*xy;\n    xy = .5*(1.-cos(PI*xy));\n    float a = rand((ij+vec2(0.,0.)));\n    float b = rand((ij+vec2(1.,0.)));\n    float c = rand((ij+vec2(0.,1.)));\n    float d = rand((ij+vec2(1.,1.)));\n    float x1 = mix(a, b, xy.x);\n    float x2 = mix(c, d, xy.x);\n    return mix(x1, x2, xy.y);\n}\n\nfloat pNoise(vec2 p, int res){\n    float persistance = .5;\n    float n = 0.;\n    float normK = 0.;\n    float f = 4.;\n    float amp = 1.;\n    int iCount = 0;\n    for (int i = 0; i<50; i++){\n        n+=amp*noise_u(p, f);\n        f*=2.;\n        normK+=amp;\n        amp*=persistance;\n        if (iCount == res) break;\n        iCount++;\n    }\n    float nf = n/normK;\n    return nf*nf*nf*nf;\n}\n\nvoid main( void ) {\n\n    float aspectRatio = resolution.x / resolution.y;\n    vec2 position = ( gl_FragCoord.xy / resolution.xy );\n    position.x *= aspectRatio;\n    vec2 midp = vec2(aspectRatio, 1.0);\n    \n    float noise_u = pNoise(position * 2.0 + time * 0.1, 10);\n    vec2 p2 = position;\n    p2.x += noise_u;\n    p2.y += noise_u;\n    float noise2 = noise_u + pNoise(p2 * 2.0, 10);\n    float noise3 = noise2 + pNoise(p2 * 4.0, 10);\n    float noise4 = noise3 + pNoise(p2 * 8.0, 10);\n    \n    float rblend = smoothstep(0.0, 0.7, noise4);\n    float yblend = smoothstep(0.5, 0.9, noise4);\n    float wblend = smoothstep(0.7, 1.0, noise4);\n    \n    vec3 r = vec3(1.0, 0.0, 0.0);\n    vec3 y = vec3(1.0, 1.0, 0.0);\n    vec3 w = vec3(1.0, 1.0, 1.0);\n    \n    vec3 color = rblend * r + yblend * y + wblend * w;\n    \n    \n    \n    //vec3 color = vec3(noise4, noise4, noise4);\n\n    glFragColor = vec4( color, 1.0 );\n\n}"});
R({name:"Worley Cells", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/tlf3zn\n\n//2D hash function:\nvec2 hash2(vec2 p)\n{\n     return fract(cos(p*mat2(56.,37.,81.,-26.))*28.9);   \n}\n//Simple Worley noise function:\nfloat worley(vec2 p)\n{\n    vec3 s = vec3(-1,0,1);\n     vec2 f = floor(p);\n    \n    vec2 v = hash2(f+s.xx)-p+f+s.xx;\n    float d = dot(v,v);\n    v = hash2(f+s.yx)-p+f+s.yx;\n    d = min(d,dot(v,v));\n    v = hash2(f+s.zx)-p+f+s.zx;\n    d = min(d,dot(v,v));\n    \n    v = hash2(f+s.xy)-p+f+s.xy;\n    d = min(d,dot(v,v));\n    v = hash2(f+s.yy)-p+f+s.yy;\n    d = min(d,dot(v,v));\n    v = hash2(f+s.zy)-p+f+s.zy;\n    d = min(d,dot(v,v));\n\n    v = hash2(f+s.xz)-p+f+s.xz;\n    d = min(d,dot(v,v));\n    v = hash2(f+s.yz)-p+f+s.yz;\n    d = min(d,dot(v,v));\n    v = hash2(f+s.zz)-p+f+s.zz;\n    d = min(d,dot(v,v));\n    return sqrt(d);\n}\n\nvoid main(void)\n{\n    float noise = worley(gl_FragCoord.xy/64.+time);\n    glFragColor = vec4(noise,noise,noise,1.);\n}"});
R({name:"Domain Warp", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// domain warping on noise_u. about : http://www.iquilezles.org/www/articles/warp/warp.htm\n\nmat2 m = mat2( 0.80,  0.60, -0.60,  0.9 );\n\nfloat hash( float n )\n{\n    return fract(sin(n)*7919.0);//*\n}\n\nfloat noise_u( in vec2 x )\n{\n    vec2 p = floor(x);\n    vec2 f = fract(x);\n    f = f*f*(3.0-2.0*f);\n    float n = p.x + p.y*7919.0;\n    float res = mix(mix( hash(n+ 0.0), hash(n +1.0),f.x), mix( hash(n+ 7919.0), hash(n+ 7920.0),f.x),f.y);\n    return res;\n}\n\nint mod_u(int a, int b) {\n    return a - ((a / b) * b);\n}\n\nfloat fbm( vec2 p ) {\n    p*=3.;\n    float f = 0.0;\n        f += 0.25000*noise_u( p ); p = m*p*0.02;\n        f += 0.12500*noise_u( p ); p = m*p*0.13;\n        f += 0.06250*noise_u( p ); p = m*p*0.01;\n        f += 0.03125*noise_u( p ); p = m*p*0.04;\n        f += 0.01500*noise_u( p );\n    return f/0.38375;\n}\n\nvec2 r(vec2 v, float a) {\n    mat2 m = mat2 (cos(a), -sin(a),\n               -sin(a), cos(a*a/20000.) );\n    return m*v;\n}\n\nvoid main( void ) {\n    vec3 col;\n    vec2 p=-1.0+2.0*gl_FragCoord.xy/resolution.xy;\n    p.x*=resolution.x/resolution.y;\n\n        vec2 dx1 = vec2(1.0,0.0);    \n    vec2 dy1 = vec2(1.2,1.3);\n    \n    vec2 dx2 = vec2(1.7,1.2);\n    vec2 dy2 = vec2(1.3,1.8);\n    \n    dx1 = r(dx1,time/12.);\n    //dy1 = r(dy1,time/8.);\n    \n    //dx2 = r(dx2,time/120.);\n    //dy2 = r(dy2,time/170.);\n    \n    vec2 q = vec2(fbm( p + dx1 ) , \n              fbm( p + dy1 ) );\n    \n    vec2 r = vec2( fbm( p + 1.5*q + dx2 ),\n                       fbm( p + 1.5*q + dy2 ) );\n\n    vec2 s = vec2( fbm( p + 1.5*r + dx1+dx2 ),\n                       fbm( p + 1.5*r + dy2+dy2 ) );\n        \n    float v = fbm( p + 4. * s );\n    col = v * vec3(q.x,r.x,s.x) + vec3(q.y,r.y,s.y);\n    glFragColor = vec4( col, 1. );\n\n}"});
R({name:"Clouds God Rays", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n//some ugly clouds\n//noise_u function lifted from that eye\n//added modification so I have 3d noise_u\n//and now with some ugly god rays\n\n//CBS: Playing around with some sin / cos functions\n\nmat2 m = mat2( 0.90,  0.110, -0.70,  1.00 );\nfloat numfreq = 2.0;\n\nfloat hash( float n )\n{\n    return fract(sin(n)*758.5453);\n}\n\nfloat noise_u( in vec3 x )\n{\n    vec3 p = floor(x);\n    vec3 f = fract(x);\n    //f = f*f*(3.0-2.0*f);\n    float n = p.x + p.y*57.0 + p.z*800.0;\n    float res = mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x), mix( hash(n+ 57.0), hash(n+ 58.0),f.x),f.y),\n                    mix(mix( hash(n+800.0), hash(n+801.0),f.x), mix( hash(n+857.0), hash(n+858.0),f.x),f.y),f.z);\n    return res;\n}\n\nfloat fbm( vec3 p )\n{\n    float f = 0.0;\n    f += 0.50000*noise_u( p ); p = p*numfreq+0.02;\n    f += 0.25000*noise_u( p ); p = p*numfreq+0.03;\n    f += 0.12500*noise_u( p ); p = p*numfreq+0.01;\n    f += 0.06250*noise_u( p ); p = p*numfreq+0.04;\n    f += 0.03125*noise_u( p );\n    return f/0.984375;\n}\n\nfloat cloud(vec3 p)\n{\n    p+=fbm(vec3(p.x,p.y,0.0)*0.5)*2.9;\n    \n    \n    float a =0.0;\n    a+=fbm(p*3.0)*2.2-0.9;\n    if (a<0.0) a=0.0;\n    //a=a*a;\n    return a;\n}\n\nvec3 f2(vec3 c)\n{\n    c+=hash(time+gl_FragCoord.x+gl_FragCoord.y*9.9)*0.01;\n    \n    \n    c*=0.7-length(gl_FragCoord.xy / resolution.xy -0.5)*0.7;\n    float w=length(c);\n    c=mix(c*vec3(1.0,1.2,1.6),vec3(w,w,w)*vec3(1.4,1.2,1.0),w*1.1-0.2);\n    return c;\n}\n\nfloat rand(vec2 co){\n    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43768.5453);\n}\n\nvoid main( void ) {\n    \n    vec2 position = ( gl_FragCoord.xy / resolution.xy ) ;\n    position.y+=0.2;\n    \n    vec2 coord= vec2((position.x-0.5)/position.y,1.0/(position.y+0.2))*vec2(-0.5,0.5);\n    coord+=time*0.01;\n    \n    \n    float q = cloud(vec3(coord*1.0,time*0.0222));\n    float qx= cloud(vec3(coord+vec2(0.156,0.0),time*0.0222));\n    float qy= cloud(vec3(coord+vec2(0.0,0.156),time*0.0222));\n    q+=qx+qy; q*=0.33333;\n    qx=q-qx;\n    qy=q-qy;\n    \n    float s =(-qx*2.0-qy*0.3); if (s<-0.05) s=-0.05;\n    \n    vec3 d=s*vec3(0.9,0.6,0.3);\n    //d=max(vec3(0.0),d);\n    //d+=0.1;\n    d*=0.3;\n    d=mix(vec3(1.0,1.0,1.0)*0.1+d*1.0,vec3(1.0,1.0,1.0)*0.9,1.0-pow(q,0.03)*1.1);\n    d*=8.0;\n    //d+=cos(time*0.01-0.5);\n        \n    //Stars\n    float scale = 8.0;\n    vec2 position2 = ((((gl_FragCoord.xy / resolution ))) * scale);\n    float gradient = 0.0;\n    float fade = 0.0;\n    float z = 0.0;\n     vec2 centered_coord = position2*rand(position)+(s*0.1)/2.0;\n    vec3 color;\n    for (float i=1.0; i<=30.0; i++)\n    {\n        vec2 star_pos = vec2(rand(vec2(i)) * 250.0, rand(vec2(i*i)) * 250.0);\n        float z = mod(sin(i*i*i)*s + 200.0, 256.0);\n        float fade = (256.0 - z) /256.0;\n        vec2 blob_coord = star_pos / z;\n        gradient += ((fade / 384.0) / pow(length(centered_coord - blob_coord), 1.5)) * (fade);\n    }\n    \n    vec3 col =mix(vec3(sin(time*0.1-3.6)-2.0/(position.y*2.5+0.2),sin(time*0.1+0.5)/(position.y*9.5),0.2)*cos(time*0.1+sin(time*0.1-1.0))+gradient*cos(time*0.1),d,clamp(0.0,q*2.9,1.0));\n    \n    //vec3 col =mix(vec3(0.1,0.5,0.8)/(position.y*0.5+0.7)*gradient*0.1,d,q);\n    color = vec3(gradient, gradient, gradient / 1.0);\n    col += (color*0.6);\n    \n    glFragColor = vec4( f2(col), 1.0 );\n}"});
R({name:"Clouds Raymarch", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// Created by inigo quilez - iq/2013\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n\nmat3 m = mat3( 0.00,  0.80,  0.60,\n              -0.80,  0.36, -0.48,\n              -0.60, -0.48,  0.64 );\n\nfloat hash( float n )\n{\n    return fract(sin(n)*43758.5453);\n}\n\nfloat noise_u( in vec3 x )\n{\n    vec3 p = floor(x);\n    vec3 f = fract(x);\n\n    f = f*f*(3.0-2.0*f);\n\n    float n = p.x + p.y*57.0 + 113.0*p.z;\n\n    float res = mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),\n                        mix( hash(n+ 57.0), hash(n+ 58.0),f.x),f.y),\n                    mix(mix( hash(n+113.0), hash(n+114.0),f.x),\n                        mix( hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);\n    return res;\n}\n\nfloat fbm( vec3 p )\n{\n    float f;\n    f  = 0.5000*noise_u( p ); p = m*p*2.02;\n    f += 0.2500*noise_u( p ); p = m*p*2.03;\n    f += 0.1250*noise_u( p ); p = m*p*2.01;\n    f += 0.0625*noise_u( p );\n    return f;\n}\n\nvec4 map( in vec3 p )\n{\n    float d = 0.2 - p.y;\n\n    d += 3.0 * fbm( p*1.0 - vec3(1.0,0.1,0.0)*time );\n\n    d = clamp( d, 0.0, 1.0 );\n    \n    vec4 res = vec4( d );\n\n    res.xyz = mix( 1.15*vec3(1.0,0.95,0.8), vec3(0.7,0.7,0.7), res.x );\n    \n    return res;\n}\n\nvec3 sundir = vec3(-1.0,0.0,0.0);\n\nvec4 raymarch( in vec3 ro, in vec3 rd )\n{\n    vec4 sum = vec4(0, 0, 0, 0);\n\n    float t = 0.0;\n    for(int i=0; i<44; i++)\n    {\n        vec3 pos = ro + t*rd;\n        vec4 col = map( pos );\n        \n        #if 1\n        float dif =  clamp((col.w - map(pos+0.3*sundir).w)/0.6, 0.0, 1.0 );\n\n        vec3 brdf = vec3(0.65,0.68,0.7)*1.35 + 0.45*vec3(0.7, 0.5, 0.3)*dif;\n        col.xyz *= brdf;\n        #endif\n        \n        col.a *= 0.35;\n        col.rgb *= col.a;\n\n        sum = sum + col*(1.0 - sum.a);    \n\n        //if (sum.a > 0.99) break;\n        #if 0\n        t += 0.1;\n        #else\n        t += max(0.1,0.05*t);\n        #endif\n    }\n\n    sum.xyz /= (0.001+sum.w);\n\n    return clamp( sum, 0.0, 1.0 );\n}\n\nvoid main(void)\n{\n    vec2 q = gl_FragCoord.xy / resolution.xy;\n    vec2 p = -1.0 + 2.0*q;\n    p.x *= resolution.x/ resolution.y;\n    vec2 mo = -1.0 + 2.0*mouse.xy / resolution.xy;\n    \n    // camera\n    vec3 ro = 4.0*normalize(vec3(cos(2.75-3.0*mo.x), 0.7+(mo.y+1.0), sin(2.75-3.0*mo.x)));\n    vec3 ta = vec3(0.0, 1.0, 0.0);\n    vec3 ww = normalize( ta - ro);\n    vec3 uu = normalize(cross( vec3(0.0,1.0,0.0), ww ));\n    vec3 vv = normalize(cross(ww,uu));\n    vec3 rd = normalize( p.x*uu + p.y*vv + 1.5*ww );\n\n    \n    vec4 res = raymarch( ro, rd );\n\n    float sun = clamp( dot(sundir,rd), 0.0, 1.0 );\n    vec3 col = vec3(0.6,0.71,0.75) - rd.y*0.2*vec3(1.0,0.5,1.0) + 0.15*0.5;\n    col += 0.2*vec3(1.0,.6,0.1)*pow( sun, 8.0 );\n    col *= 0.95;\n    col = mix( col, res.xyz, res.w );\n    col += 0.1*vec3(1.0,0.4,0.2)*pow( sun, 3.0 );\n        \n    glFragColor = vec4( col, 1.0 );\n}"});
R({name:"Voronoi Edges", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/3tycWt\n\nvec2 N22(vec2 p){\n    vec3 a = fract(p.xyx*vec3(123.34, 234.34, 345.65));\n    a+=dot(a, a+34.45);\n    return fract(vec2(a.x*a.y, a.y*a.z));\n}\n\nvoid main(void)\n{\n    // Normalized pixel coordinates (from 0 to 1)\n   \n    vec2 uv = (2.*gl_FragCoord.xy-resolution.xy)/resolution.y;\n    \n    float m = 0.;//N22(uv).x;\n    float t = time;\n    \n    float minDist = 100.;\n    float cellIndex = 0.;\n    \n\n        uv *= 3.;\n        vec2 gv = fract(uv)-.5;\n        vec2 id = floor(uv);\n        vec2 cid = vec2(0);\n        vec2 mo = vec2(0.0);\n        vec2 mp = vec2(0.0);\n        for (float y=-1.; y <= 1.;y++){\n            for (float x=-1.; x <= 1.;x++){\n                vec2 offset = vec2(x, y);\n                vec2 n = N22(id+offset);\n                vec2 p = offset+sin(n*t)*.5;\n                p -= gv;\n                float d = length(p);\n                if(d < minDist){\n                    minDist = d;\n                    cid = id+offset;\n                    mo = offset;\n                    mp = p;\n                }\n            }\n        }\n     \n        for (float y=-2.; y <= 2.;y++){\n            for (float x=-2.; x <= 2.;x++){\n                vec2 offset = vec2(x, y);\n                vec2 n = N22(id+offset);\n                vec2 p = offset+sin(n*t)*.5;\n                p -= gv;\n                float d = length(mp-p);\n                if(d > 0.01){\n                    minDist = min(minDist, dot((p+mp), normalize(p-mp)) );\n                   \n                }\n            }\n        }\n        \n          if (minDist<.07) {minDist = smoothstep(0.7, 1., 1.-minDist)*.2; }\n            vec3 col = minDist*(exp(minDist*2.0))*vec3(1.0, 0.5, 0.0);\n            \n           // col = mix(col, vec3(1.0, 0.0, 0.0), smoothstep(0.07, 0.01, minDist));\n           \n        \n    \n       \n    \n    \n    // Output to screen\n    glFragColor = vec4(col,1.0);\n}"});
R({name:"Voronoi Cells", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/7lS3Rw\n\nvec2 spin(vec2 uv,float t){\n    return vec2(uv.x*cos(t)-uv.y*sin(t),uv.y*cos(t)+uv.x*sin(t));\n}\n\nvec2 R22(vec2 p) \n{\n    vec3 a = fract(p.xyx * vec3(123.34, 234.34, 345.65));\n    a += dot(a, a + 34.45);\n    return fract(vec2(a.x*a.y, a.y*a.z));\n}\n\nvoid main(void)\n{\n    vec2 uv = (2.*gl_FragCoord.xy-resolution.xy)/resolution.y;\n    \n    float t = time;\n   \n    float minDist = 10.;\n    \n    uv *= 5.;\n    \n    vec3 col = vec3(.0);\n    \n    vec2 gv = fract(uv)-.5;\n    vec2 id = floor(uv);\n    \n    for (float y = -1.; y <= 1.; y ++)\n    {\n        for(float x = -1.; x <= 1.; x++)\n        {\n        \n            vec2 offset = vec2(x,y);\n            vec2 n = R22(id + offset);\n            vec2 p = offset+sin(n*t)*.5;\n            \n            float dist = length(gv-p);\n            \n            if(dist < minDist)\n            {\n                minDist = dist;\n            }\n        }\n    }\n    \n    col += smoothstep(1.2, .0, minDist*.4);\n    \n    glFragColor = vec4(col,1.0);\n}"});
R({name:"Metaballs Halftone", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nconst float PI = 3.14159;\nconst float RADIUS = 60.;\n\nconst float CELL_SIZE = 8.;\nconst float CELL_THICK = 1.;\nconst float CELL_RADIUS = .5*CELL_SIZE - CELL_THICK;\n\nfloat\nsquared_distance(const in vec2 a, const in vec2 b)\n{\n    vec2 d = a - b;\n    return dot(d, d);\n}\n\nfloat\nadd_blob(const in vec2 center)\n{\n    return 1.5e5/(1. + squared_distance(gl_FragCoord.xy, center));\n}\n\nvoid main(void)\n{\n    vec2 origin  = .5*resolution;\n    float v =\n        add_blob(origin + vec2(60.*sin(.1 + 0.6*time), 80.*cos(.7 + 1.8*time))) +\n        add_blob(origin + vec2(70.*cos(.2 + 1.1*time), 70.*sin(.5 + 2.2*time))) +\n        add_blob(origin + vec2(80.*sin(.3 + 1.6*time), 60.*cos(.3 + 1.6*time)));    \n    float w = v - RADIUS;\n    \n    float r = pow(1. + pow(w, 2.), -.2)*CELL_RADIUS;\n\n    vec2 offs = vec2(step(CELL_SIZE, mod(gl_FragCoord.y, 2.*CELL_SIZE))*.5*CELL_SIZE, 0);\n    vec2 cell_center = offs + CELL_SIZE*floor((gl_FragCoord.xy - offs)/CELL_SIZE) + .5*vec2(CELL_SIZE, CELL_SIZE);\n    float d = distance(gl_FragCoord.xy, cell_center);\n    float c = smoothstep(r + CELL_THICK, r, d);\n    \n    glFragColor = vec4(c, c, c, 1);\n}"});
R({name:"Metaballs Lit", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nfloat k = 50.0;\nfloat f = 0.0;\nvec3 colour = vec3(0.0,0.0,0.0);\nfloat threshold = 10.0;\nvec3 normal = vec3(0.0,0.0,0.0);\n\nvec3 lightPos;\nvec3 lightColour = vec3(0.5,0.5,0.5);\nvec3 ambient = vec3(0.1,0.0,0.0);\nfloat shinyness = 20.0;\n\nvec2 center ( vec2 border , vec2 offset , vec2 vel ) {\n    vec2 c = offset + vel * time * 0.5;\n    c = mod ( c , 2. - 4. * border );\n    if ( c.x > 1. - border.x ) c.x = 2. - c.x - 2. * border.x;\n    if ( c.x < border.x ) c.x = 2. * border.x - c.x;\n    if ( c.y > 1. - border.y ) c.y = 2. - c.y - 2. * border.y;\n    if ( c.y < border.y ) c.y = 2. * border.y - c.y;\n    return c;\n}\n\nfloat field ( float b, float r ) {\n    if ( r > b )\n        return 0.0;\n    if ( r >= b/3.0 ) {\n        float rb = 1.0 - r/b;\n        return (3.0*k)/2.0 * rb * rb;\n    }\n    if ( r >= 0.0 && r <= b/3.0 ) {\n        return k * ( 1.0 - ( (3.0*r*r)/(b*b) ) );    \n    }\n    return 0.0;\n}\n\nvoid circle ( float r , vec3 col , vec2 offset , vec2 vel ) {\n    vec2 pos = gl_FragCoord.xy / resolution.y;\n    float aspect = resolution.x / resolution.y;\n    vec2 c = center ( vec2 ( r / aspect , r ) , offset , vel );\n    c.x *= aspect;\n    float d = distance ( pos , c );\n    float thisField = field (r, d);\n    f += thisField;\n    colour += col * thisField;\n    normal += normalize(vec3(pos.x-c.x, pos.y-c.y,r))*thisField;\n}\n    \nvoid main( void ) {\n\n    lightPos = vec3(resolution.xy/2.0,200.0);\n\n    circle ( .10 , vec3 ( 0.7 , 0.2 , 0.8 ) , vec2 ( .6 ) , vec2 ( .30 , .70 ) );\n    circle ( .09 , vec3 ( 0.7 , 0.9 , 0.6 ) , vec2 ( .1 ) , vec2 ( .02 , .20 ) );\n    circle ( .12 , vec3 ( 0.3 , 0.4 , 0.1 ) , vec2 ( .1 ) , vec2 ( .10 , .04 ) );\n    circle ( .15 , vec3 ( 0.2 , 0.5 , 0.1 ) , vec2 ( .3 ) , vec2 ( .10 , .20 ) );\n    circle ( .20 , vec3 ( 0.1 , 0.3 , 0.7 ) , vec2 ( .2 ) , vec2 ( .40 , .25 ) );\n    circle ( .30 , vec3 ( 0.9 , 0.4 , 0.2 ) , vec2 ( .0 ) , vec2 ( .15 , .20 ) );\n    \n    vec3 c;\n    \n    if (f < threshold)\n        c = vec3(0.0,0.0,0.0);\n    else {\n        colour /= f;\n        normal = normal/f;\n        \n        c = ambient;\n        vec3 lightDir = lightPos - vec3(gl_FragCoord.xy,0.0);\n        c += colour * 0.005 * max(dot(normal,lightDir), 0.0);\n        vec3 r = normalize ( reflect ( lightDir, normal ) );\n        c += lightColour * pow(max(dot(r,vec3(0.0,0.0,-1.0)), 0.0), shinyness);    \n    }\n    \n    glFragColor = vec4( c, 1.0 );\n}"});
R({name:"Starfield Warp", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvoid main( void ) {\n\n    vec2 position = ( gl_FragCoord.xy -  resolution.xy*.5 ) / resolution.x;\n\n    // 256 angle steps\n    float angle = atan(position.y,position.x)/(2.*3.14159265359);\n    angle -= floor(angle);\n    float rad = length(position);\n    \n    float color = 0.0;\n    for (int i = 0; i < 100; i++) {\n        float angleFract = fract(angle*32.);\n        float angleRnd = floor(angle*32.)+1.;\n        float angleRnd1 = fract(angleRnd*fract(angleRnd*.7235)*45.1);\n        float angleRnd2 = fract(angleRnd*fract(angleRnd*.82657)*13.724);\n        float t = time+angleRnd1*10.;\n        float radDist = sqrt(angleRnd2+float(i)+2.);\n        \n        float adist = radDist/rad*.1;\n        float dist = (t*.1+adist);\n        dist = abs(fract(dist)-.5);\n        float xdist = dist*5./adist;\n        float ydist = abs(angleFract-.5);\n        \n        \n        color += max(0.,.5-(xdist*xdist+ydist*ydist)*(adist*adist*radDist*radDist)*40.)*5.;\n        \n        angle = fract(angle+.61);\n    }\n\n    glFragColor = vec4( color )*.6;\n\n}"});
R({name:"Starfield Spiral", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// Posted by Trisomie21\n\n#define LAYERS 5.0\n\nfloat rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }\n\nvoid main( void ) {\n    \n    vec2 pos = gl_FragCoord.xy - resolution.xy*.5;\n    float dist = length(pos) / resolution.y;\n    vec2 coord = vec2(dist, atan(pos.x, pos.y) / (3.1415926*2.0));\n    \n    vec3 color = vec3(0.0);\n    for (float i = 0.0; i < LAYERS; ++i)\n    {\n        float t = i*100.0+time*(i*i);\n        \n        vec2 uv = coord;\n        \n        uv.y += (i*.1)*(i*.02);\n        uv.y = fract(uv.y);\n        \n        float r = pow(uv.x, .1) - (t*.001);\n        \n        vec2 p = vec2(r, uv.y*.5);\n        \n        // UV coord in cell\n        uv.x = mod(r, 0.01)/.01;\n        uv.y = mod(uv.y, 0.02)/.02;\n    \n        // Shape\n        float a = 1.0-length(uv*2.0-1.0);\n    \n        // Color\n        vec3 m = fract(r*100.0 * vec3(0.25, 1.0, -0.5))*.8+i*.2;\n        \n        // Mask cell\n        p = floor(p*100.0);\n        float d = (rand(p)-0.6)*10.0;\n        d = clamp(d*dist, 0.0, 1.0);\n    \n        color = max(color, a*m*d);\n    }\n\n    glFragColor =  vec4(color, 1.0 );\n}"});
R({name:"Tunnel Reflect", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nfloat oa(vec3 q)\n{\n return 0.51*acos(-abs(q.x)*0.1)+cos(q.x)+cos(q.y*1.5)+cos(q.z)+cos(q.y*20.)*.05;\n}\n\nfloat ob(vec3 q)\n{\n return length(max(abs(q-vec3(cos(q.z*1.5)*.3,-.5+cos(q.z)*.2,.0))-vec3(.125,.02,time+3.),vec3(.0)));\n}\n\nfloat o(vec3 q)\n{\n return min(oa(q),ob(q));\n}\n\nvec3 gn(vec3 q)\n{\n vec3 f=vec3(.01,0,0);\n return normalize(vec3(o(q+f.xyy),o(q+f.yxy),o(q+f.yyx)));\n}\n\nvoid main(void)\n{\n vec2 p = -1.0 + 2.0 * gl_FragCoord.xy / resolution.xy;\n p.x *= resolution.x/resolution.y;\n vec4 c=vec4(1.0);\n vec3 org=vec3(sin(time)*.5,cos(time*.5)*.25+.25,time),dir=normalize(vec3(p.x*1.6,p.y,1.0)),q=org,pp;\n float d=.0;\nfloat beam=0.1;\n for(int i=0;i<32;i++)\n {\n  d=o(q);\n  q+=d*dir;\n  if (d<beam) break;\n  beam+=0.1;\n }\n pp=q;\n float f=length(q-org)*0.02;\n dir=reflect(dir,gn(q));\n q+=dir;\n beam=0.1;\n for(int i=0;i<32;i++)\n {\n d=o(q);\n q+=d*dir;\n if (d<beam) break;\n beam+=0.91;\n }\n c=max(dot(gn(q),vec3(.1,.1,.0)),.0)+vec4(.3,cos(time*.5)*.5+.5,sin(time*.5)*.5+.5,1.)*min(length(q-org)*.04,1.);\n if(oa(pp)>ob(pp))c=mix(c,vec4(cos(time*.3)*.5+.5,cos(time*.2)*.5+.5,sin(time*.3)*.5+.5,1.),.3);\n vec4 fcolor = ((c+vec4(f))+(1.-min(pp.y+1.9,1.))*vec4(1.,.8,.7,1.))*min(time*.5,1.);\n fcolor-=0.3*normalize(fcolor);// some simple contrast grading\n glFragColor=vec4(fcolor.xyz,1.0);\n}"});
R({name:"Tunnel Chroma", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvec2 R;\nvec2 Offset;\nvec2 Scale=vec2(0.002,0.002);\nfloat Saturation = 0.8; // 0 - 1;\nvec3 lungth(vec2 x,vec3 c){\n       return vec3(length(x+c.r),length(x+c.g),length(c.b));\n}\n\nvoid main( void ) {\n    R = resolution;\n    vec2 position = (gl_FragCoord.xy - resolution * 0.5) / resolution.yy;\n    float th = atan(position.y, position.x) / (2.0 * 3.1415926);\n    float dd = length(position) + 0.005;\n    float d = 0.5 / dd + time;\n        vec2 x = gl_FragCoord.xy;\n        vec3 c2=vec3(0,0,0);\n       x=x*Scale*R/R.x;\n        x+=sin(x.yx*sqrt(vec2(13,9)))/1.;\n        c2=lungth(sin(x*sqrt(vec2(33,43))),vec3(5,6,7)*Saturation * d);\n    x+=sin(x.yx*sqrt(vec2(73,53)))/5.;\n        c2=2.*lungth(sin(time+x*sqrt(vec2(33.,23.))),c2/9.);\n        x+=sin(x.yx*sqrt(vec2(93,73)))/3.;\n        c2=lungth(sin(x*sqrt(vec2(13.,1.))),c2/2.0);\n        c2=.5+.5*sin(c2*8.);\n    vec3 uv = vec3(th + d, th - d, th + sin(d) * 0.45);\n    float a = 0.5 + cos(uv.x * 3.1415926 * 2.0) * 0.5;\n    float b = 0.5 + cos(uv.y * 3.1415926 * 2.0) * 0.5;\n    float c = 0.5 + cos(uv.z * 3.1415926 * 6.0) * 0.5;\n    vec3 color =     mix(vec3(0.1, 0.5, 0.5),     vec3(0.1, 0.1, 0.2),  pow(a, 0.2)) * 3.;\n    color +=     mix(vec3(0.8, 0.2, 1.0),     vec3(0.1, 0.1, 0.2),  pow(b, 0.1)) * 0.75;\n    color +=     mix(c2,             vec3(0.1, 0.2, 0.2),  pow(c, 0.1)) * 0.75;\n    glFragColor = vec4( (color * dd), 1.0);\n}"});
R({name:"Tunnel Pipe", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// from http://frank.bitsnbites.eu/safe.html\n\nfloat gc;\nfloat gb;\nfloat PI=3.14159;\nvec3 ff(vec2 p){\n    vec2 q=vec2(sin(.08*p.x),4.*p.y);\n    vec3 c=vec3(0);\n    for(float i=0.;i<15.;i++)\n      c+=(1.+sin(i*sin(time)+vec3(0.,1.3,2.2)))*.2/length(q-vec2(sin(i),12.*sin(.3*time+i)));\n    return c+vec3(mix(mod(floor(p.x*.2)+floor(p.y*2.2),2.),.001,gc));\n}\nvec3 ft(vec3 o,vec3 d){\n    d.y*=.65+.1*sin(.5*time);\n    float D=1./(d.y*d.y+d.z*d.z),\n          a=(o.y*d.y+o.z*d.z)*D,\n          b=(o.y*o.y+o.z*o.z-36.)*D,\n          t=-a-sqrt(a*a-b);\n    o+=t*d;\n    return ff(vec2(o.x,atan(o.y,o.z)))*(1.+.01*t);\n}\nvoid main(){\n    gc=fract(time*3.2/3.);\n    gb=fract(gc*2.);\n    vec2 p=(2.*gl_FragCoord.xy-resolution)/resolution.y,\n         q=2.*gl_FragCoord.xy/resolution-1.;\n    vec3 cp=vec3(-time*20.+1.,1.6*sin(time*1.2),2.+2.*cos(time*.3)),\n         ct=cp+vec3(1.,.3*cos(time),-.2),\n         cd=normalize(ct-cp),\n         cr=normalize(cross(cd,vec3(.5*cos(.3*time),0.,1.))),\n         cu=cross(cr,cd),\n         rd=normalize(2.*cd+cr*p.x+cu*p.y),\n         c=ft(cp,rd)*\n           min(1.,1.8-dot(q,q))*(.9+.1*sin(3.*sin(gc)*gl_FragCoord.y));\n    glFragColor=vec4(c,1);\n}"});
R({name:"Galaxy", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/MdXSzS\n\nvoid main()\n{\n    \n    vec2 uv = (gl_FragCoord.xy/resolution.xy)-.5;\n\n    float time2 = time * .1 + ((.25+.05*sin(time*.1))/(length(uv.xy)+.07))* 2.2;\n    float si = sin(time2);\n    float co = cos(time2);\n    mat2 ma = mat2(co, si, -si, co);\n\n    float c = 0.0;\n    float v1 = 0.0;\n    float v2 = 0.0;\n    \n    for (int i = 0; i < 100; i++)\n    {\n        float s = float(i) * .035;\n        vec3 p = s * vec3(uv, 0.0);\n        p.xy *= ma;\n        p += vec3(.22,.3, s-1.5-sin(time2*.13)*.1);\n        for (int i = 0; i < 8; i++)\n        {\n            p = abs(p) / dot(p,p) - 0.659;\n        }\n        v1 += dot(p,p)*.0015 * (1.8+sin(length(uv.xy*13.0)+.5-time*.2));\n        v2 += dot(p,p)*.0015 * (1.5+sin(length(uv.xy*13.5)+2.2-time*.3));\n        c = length(p.xy*.5) * .35;\n    }\n    \n    float len = length(uv);\n    v1 *= smoothstep(.7, .0, len);\n    v2 *= smoothstep(.6, .0, len);\n    \n    \n\n    float re = clamp(c, 0.0, 1.0);\n    float gr = clamp((v1+c)*.25, 0.0, 1.0);\n    float bl = clamp(v2, 0.0, 1.0);\n    vec3 col = vec3(re, gr, bl) + smoothstep(0.15, .0, len) * .9;\n\n    glFragColor=vec4(col, 1.0);\n}"});
R({name:"Julia Gold", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvoid main(void){\n    vec2 p = gl_FragCoord.xy / resolution.xy;\n    vec4 dmin = vec4(1000.);\n    vec2 z = (-1.0 + 2.0*p)*vec2(1.7,1.0);\n    for( int i=0; i<64; i++ ){\n        z = (mouse-vec2(0.5))*1.6+vec2(z.x*z.x-z.y*z.y,2.0*z.x*z.y);\n        dmin=min(dmin,vec4(abs(0.0+z.y+0.5*sin(z.x)),abs(1.0+z.x+0.5*sin(z.y)),dot(z,z),length(fract(z)-0.5)));}    \n    vec3 color = vec3( dmin.w );\n    color = mix( color, vec3(1.00,0.80,0.0),     min(1.0,pow(dmin.x*0.25,0.20)));\n    color = mix( color, vec3(0.72,0.70,0.60),     min(1.0,pow(dmin.y*0.50,0.50)));\n    color = mix( color, vec3(1.00,1.00,1.00), 1.0-min(1.0,pow(dmin.z*1.00,0.15)));\n    color = 1.25*color*color;\n    glFragColor = vec4(color*(0.5 + 0.5*pow(16.0*p.x*(1.0-p.x)*p.y*(1.0-p.y),0.15)),1.0);\n}"});
R({name:"Mandelbrot Zoom", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// co3moz - mandelbrot\n\n#define ITERATION 256\n\nvec3 mandelbrot(vec2 p) {\n  vec2 s = p;\n  float d = 0.0, l;\n    \n  for (int i = 0; i < ITERATION; i++) {\n    s = vec2(s.x * s.x - s.y * s.y + p.x, 2.0 * s.x * s.y + p.y);\n    l = length(s);\n    d += l + 5.9;\n    if (l > 2.0) return vec3(sin(d * 0.0314), sin(d * 0.02), sin(d * 0.01));\n  }\n    \n  return vec3(9.4);\n}\n    \nvoid main() {\n  vec2 a = resolution.xy / min(resolution.x, resolution.y);\n  vec2 p = ((gl_FragCoord.xy / resolution.xy) * 4.0  - 2.0) * a;\n  float f = sin(time * 0.05 + 99.0) * 0.5 + 0.5;\n  p *= pow(1.5, f * (-30.0));\n  p += vec2(-1.002029, 0.303864);\n    \n  glFragColor = vec4(1.0 - mandelbrot(p), 1.0);\n}"});
R({name:"Mandelbrot Palette", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n// original https://www.shadertoy.com/view/tsXBRX\n\n/*\n Formula by IQ, with added translation (qd) and elongation/compression (qc)\n*/\nvec3 pal(in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d, in float qc, in float qd){\n    return a + b * sin(2.0 * 3.14159265359 * (c * t * qc + d  + qd));\n}\n\n/*\n From http://www.flong.com/texts/code/shapers_circ/\n*/\nfloat trafoDCircSeat(in float x, in float a){\n    float b = clamp(a,0.0,1.0);\n    if(x <=b ){\n        return b - sqrt(b * b - x * x);\n    }else{\n        return b + sqrt((1.0-b)*(1.0-b)-(x-1.0)*(x-1.0));\n    }\n}\n\n/*\nDefault z*z+c, scaled a bit for 16/9\n*/\nfloat mb(in vec2 ri, in float time){\n    float r = (ri.x-0.5)*4.5-0.5;\n    float i = (ri.y-0.5)*3.0;\n    float zr = 0.0;\n    float zi = 0.0;\n    float max = time;\n    for(float k=0.0;k<max;k++){\n        float t = zr*zr - zi*zi + r;\n        zi = 2.0*zr*zi + i;\n        zr = t;\n        if(zr*zr+zi*zi > 4.0){\n            return k/max;\n        }\n    }\n    return 1.0;\n}\n\nvoid main(void)\n{\n    // Normalized pixel coordinates (from 0 to 1)\n    vec2 uv = gl_FragCoord.xy/resolution.xy;\n    \n    // Coloring\n    float t2 = trafoDCircSeat(uv.x, 0.5)*0.5 + 0.5*trafoDCircSeat(uv.y,0.5);\n    vec3 col = pal(t2, vec3(0.5),vec3(0.25),vec3(0.5),vec3(0.2,0.5,0.7),3.0,time);\n    float u = 0.1+mod(time*0.25,0.9);\n    u = u*u*200.0;\n    if(u > 100.0){\n        u = 200.0-u;\n    }\n    col = col*0.3 + col*vec3(mb(uv,u));\n\n    // Output to screen\n    glFragColor = vec4(col,1.0);\n}"});
R({name:"Newton Lissajous", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n#define sLenght(a) dot((a),(a))\n\nvec2 cInv(vec2 c){\n    float sl = dot(c,c);\n    return vec2(c.x / sl, -c.y / sl);\n}\n\nvec2 cMul(vec2 a, vec2 b){\n    vec4 t = a.xyxy * b.xyyx;\n    return vec2(t.x - t.y, t.z + t.w);\n}\n\nvoid main(void)\n{\n    float zoom = (sin(time/4.0)+1.0) * 8.0 + 1.0;\n    vec2 p = -(zoom/2.0) + zoom * gl_FragCoord.xy / resolution.xy;\n    p.x *= resolution.x/resolution.y;\n    \n    float t = time/2.0;\n    \n    //setting roots of a third grade poly using a Lissajous curve\n    vec2 root1 = vec2(sin(t + 0.00000000) , sin(2.0 * t + 0.00000000));\n    vec2 root2 = vec2(sin(t + 2.09439510) , sin(2.0 * t + 2.09439510));\n    vec2 root3 = vec2(sin(t + 4.18879020) , sin(2.0 * t + 4.18879020));\n    \n    const int maxIters = 16;\n    float tolerance = 1e-8;\n    vec2 r1,r2,r3;\n    vec2 prevP = p;\n    float iters = 0.0;\n    \n    r1 = p-root1;\n    r2 = p-root2;\n    r3 = p-root3;\n\n    for(int iterations = 0; iterations < maxIters; iterations++ ){\n        prevP = p;\n        //newton-rhapson method iteration\n        p = p - cInv( cInv(r1) + cInv(r2) + cInv(r3) );\n        \n        //check how near we are from the nearest root\n        r1 = p-root1;\n        r2 = p-root2;\n        r3 = p-root3;\n        if (min(sLenght(r1),min(sLenght(r2),sLenght(r3))) < tolerance ) {break;}\n        iters += 1.0;\n    }\n    float co = iters;\n    \n    //the code could be more compact but repeating code makes changing the gradients easier\n    float l1 = length(p-root1);\n    float l2 = length(p-root2);\n    float l3 = length(p-root3);\n    float dist0,dist1;\n    float tol = log(tolerance);\n    if (l1 <= l2 && l1 <= l3){\n        dist0 = log(sLenght(prevP-root1));\n        dist1 = log(sLenght(p-root1));\n        if (dist1 < tol && dist0 > tol) { co += (tol - dist0) / (dist1 - dist0); }\n        co = clamp(co/float(maxIters),0.0,1.0);\n        \n        //gradient for root1\n        glFragColor = vec4(\n            0.5+0.89*cos(6.2831855*co+0.0),\n            0.5+0.48000002*cos(25.132742*co+2.0734513),\n            0.5+0.38*cos(50.265484*co+4.1469026),\n            1.0);\n            \n    }else if (l2 <= l1 && l2 <= l3){\n        dist0 = log(sLenght(prevP-root2));\n        dist1 = log(sLenght(p-root2));\n        if (dist1 < tol && dist0 > tol) { co += (tol - dist0) / (dist1 - dist0); }\n        co = clamp(co/float(maxIters),0.0,1.0);\n        \n        //gradient for root2 \n        glFragColor = vec4(\n            0.5+0.6*cos(2.0106194*co+-1.5079645),\n            0.5+1.0*cos(4.5867257*co+2.576106),\n            0.5+0.82*cos(3.015929*co+2.3247786),\n            1.0);\n            \n    }else if (l3 <= l2 && l3 <= l1){\n        dist0 = log(sLenght(prevP-root3));\n        dist1 = log(sLenght(p-root3));\n        if (dist1 < tol && dist0 > tol) { co += (tol - dist0) / (dist1 - dist0); }\n        co = clamp(co/float(maxIters),0.0,1.0);\n        \n        //gradient for root3 \n        glFragColor = vec4( .5+.5*cos(6.2831*co+0.0),\n                         .5+.5*cos(6.2831*co+0.4),\n                         .5+.5*cos(6.2831*co+0.7),\n                         1.0 );\n                         \n    }else{\n        glFragColor = vec4(0.0 , 0.0, 0.0, 1.0 );\n    }\n}"});
R({name:"Newton Spin", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/4lBGRm\n\nvec2 cmult(vec2 c1, vec2 c2) {\n    return vec2\n        ( c1.x * c2.x - c1.y * c2.y \n        , c1.x * c2.y + c2.x * c1.y\n        );\n}\n\nvec2 cdiv(vec2 c1, vec2 c2) {\n    float d = c2.x * c2.x + c2.y * c2.y;\n    \n    return vec2\n        ( c1.x * c2.x + c1.y * c2.y \n        , c2.x * c1.y - c1.x * c2.y\n        ) / d;\n}\n\nvec2 step_u(vec2 x) {\n    float t = time * 3.0;\n    vec2 p = vec2(cos(t), sin(t));\n    vec2 q = vec2(cos(t * 0.9), sin(t * 0.9));\n    vec2 r = vec2(cos(t * 1.1), sin(t * 1.1));\n    vec2 s = vec2(cos(t * 1.2), sin(t * 1.2));\n    \n    return x - cdiv(\n        cmult(p, cmult(cmult(x, x), x)) +\n        cmult(q, cmult(x, x)) +\n        s,\n        3.0 * cmult(p, cmult(x, x)) +\n        2.0 * cmult(q, x));\n}\n\nvec2 iter(vec2 x) \n{\n    for (int i = 0; i < 50; i++) {\n        x = step_u(x);\n    }\n  \n    return x;   \n}\n\nvoid main(void)\n{    \n    vec2 x = gl_FragCoord.xy / resolution.xy * 3.0 - vec2(1.5, 1.5);\n    \n    float d = cos(atan(iter(x).y, iter(x).x)) * 0.3 + 0.5;\n    \n    glFragColor = vec4(d, d, d * 2.0, 1.0);  \n}"});
R({name:"KIFS Fractal", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// by @acaudwell\n\n// based on fractal discovered by knighty:\n// http://www.fractalforums.com/3d-fractal-generation/kaleidoscopic-(escape-time-ifs)/\n\n#define MAX_RAY_STEPS 22\n#define MAX_DE_STEPS  24\n#define M mat4(-5.740254e-01, 4.547220e-01, 1.309093e+00, 0.000000e+00, -4.547220e-01, 1.276698e+00, -6.428610e-01, 0.000000e+00, -1.309093e+00, -6.428610e-01, -3.507233e-01, -0.000000e+00, 3.896400e-01, -1.814265e-01, -5.258469e-02-mouse.y*0.3, 1.000000e+00-mouse.x*0.5)\n\nfloat aspect_ratio;\nfloat ray_scale;\nfloat fov          = tan ( 45.0 * 0.017453292 * 0.5 );\n\nfloat distance_u(vec3 p) {\n\n    vec4 q = vec4(p, 1.0);\n\n    for(int i=0;i<MAX_DE_STEPS;i++) {\n        q = M * abs(q);\n    }\n\n    return length(q) * pow(1.5, float(-MAX_DE_STEPS));\n}\n\nvoid main( void ) {\n\n    aspect_ratio = resolution.y / resolution.x;\n    ray_scale    = (1.0 / max(resolution.x, resolution.y)) * 0.67;\n\n    vec2 tx = (gl_FragCoord.xy / resolution)-0.5;\n\n    float a  = time;\n    float sa = sin(a);\n    float ca = cos(a);\n\n    vec3 dir = vec3( tx.x * fov , tx.y * fov * aspect_ratio, 1.0 );\n \n    dir.xy   = vec2( dir.x * ca - dir.y * sa, dir.x * sa + dir.y * ca);\n    dir.xz   = vec2( dir.x * ca - dir.z * sa, dir.x * sa + dir.z * ca);\n\n    dir = normalize(dir);\n\n    vec3 cam = vec3(0.0, 0.0, -6.0);\n    cam.xz   = vec2( cam.x * ca - cam.z * sa, cam.x * sa + cam.z * ca);\n\n    vec3 ray = cam;\n\n    float l  = 0.0;\n    float d  = 0.0;\n    float e  = 0.00001;\n    float it = 0.0;\n\n    for(int i=0;i<MAX_RAY_STEPS;i++) {\n        d = distance_u(ray);\n\n        ray += d * dir;\n        l += d;\n\n        if(d<e) break;\n\n        e  = ray_scale * l;\n        it++;\n    }\n\n    float f = 1.0-(it/float(MAX_RAY_STEPS));\n\n    float s = max(0.0, pow(1.0-d,50.0));\n\n    vec3 bg = vec3(pow(length(tx),3.5));\n\n    glFragColor = vec4(bg + f*s, 1.0);\n}"});
R({name:"Kaleido Blobs", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/MsGfzD\n\n#define KALEIDO 1\n#define MAXSTEPS 200\n\n#define v2Resolution resolution\n#define out_color glFragColor\n\nfloat sph(vec3 p, float r) {\n  return length(p)-r;\n}\n\nfloat cyl(vec3 p, vec2 s) {\n  return max(length(p.xz)-s.x,abs(p.y)-s.y);\n}\n\nvec3 rep(vec3 p, vec3 s) {\n  return (fract(p/s+0.5)-0.5)*s;\n}\n\nvec3 repid(vec3 p, vec3 s) {\n  return floor(p/s+0.5);\n}\n\nmat2 rot(float a) {\n  float co=cos(a);\n  float so=sin(a);\n  return mat2(co,so,-so,co);\n}\n\nfloat smin(float a, float b, float h) {\n  float k=clamp(0.5+0.5*(a-b)/h,0.0,1.0);\n  return mix(a,b,k)-k*(1.0-k)*h;\n}\n\nfloat smax(float a, float b, float h) {\n  float k=clamp(0.5+0.5*(b-a)/h,0.0,1.0);\n  return mix(a,b,k)+k*(1.0-k)*h;\n}\n\nfloat map(vec3 p) {\n\n  vec3 m0 = p;\n  //m0.xy=abs(m0.xy);\n\n  float tt = time * 0.2;\n  float tt2 = time * 0.5;\n\n  vec3 r0 = m0;\n  r0.xz *= rot(tt);\n  r0.yz *= rot(tt*2.3975);\n  vec3 r1 = rep(r0, vec3(2.0));\n  vec3 def = repid(r0, vec3(2.0));\n  \n  float d = sph(r1, 0.1);\n\n  for(int i=0;i<7;++i) {\n    vec3 r2 = r1;\n    r2.xy *= rot(tt2*0.221 + float(i)*1.986 + dot(def,def));\n    r2.yz *= rot(tt2*1.674 + float(i)*5.34);\n    d=smin(d,cyl(r2+vec3(0.0), vec2(0.02,0.8)), 0.2);\n  }\n\n  for(int i=0;i<7;++i) {\n    vec3 r2 = r1;\n    r2.xy *= rot(tt2*0.8742 + float(i)*2.1243);\n    r2.yz *= rot(tt2*1.9865 + float(i)*6.974 + dot(def,def));\n    d=smax(d,-cyl(r2+vec3(0.0), vec2(0.02,0.8)),0.1);\n  }\n\n  float ex=smax(sph(r1,0.3),-sph(r1,1.1),0.2);\n\n  d=smin(d,ex,0.8);\n  d=smax(d, sph(r1,0.8),0.2);\n\n  return d;\n\n}\n\nvec3 norm(vec3 p) {\n\n  float base = map(p);\n  vec2 off = vec2(0.0,0.001);\n  return normalize(vec3(base-map(p+off.yxx),base-map(p+off.xyx),base-map(p+off.xxy)));\n\n}\n\nvec2 mirror(vec2 uv, float a) {\n  mat2 rr = rot(a);\n  vec2 m=uv*rr;\n  m.x=abs(m.x);\n  return m*rr;\n}\n\nvoid main(void)\n{\n  vec2 uv = vec2(2.0*gl_FragCoord.x / v2Resolution.x-1.0, 1.0-2.0*gl_FragCoord.y / v2Resolution.y);\n  uv /= vec2(v2Resolution.y / v2Resolution.x, 1);\n\n  vec2 off = vec2(cos(time),sin(time)) * 0.3;\n  //uv=abs(uv)-abs(off);\n\n  float tt=time*0.5;\n#if KALEIDO\n  uv = mirror(uv, tt*0.1);\n  uv = mirror(uv, -tt*0.3 + 0.124);\n  uv = mirror(uv, tt*2.3);\n\n  uv -= abs(off);\n#endif\n\n  vec3 col = vec3(0.0);\n  \n  vec3 ro = vec3(0,0,-1);\n  vec3 rd = normalize(vec3(uv, 1.0));\n  \n  vec3 p = ro;\n\n  float e = 0.0;\n\n  for(int i=0;i<MAXSTEPS;++i) {\n\n    float d = map(p);\n    if(d<0.0001) {\n\n      break;\n    }\n    e += (1.0-clamp(length(p-ro)/10.0,0.0,1.0))*0.00001/(d);\n    p += d*rd;\n  }\n\n  vec3 n = norm(p);\n  float lum = clamp(dot(n,normalize(vec3(0.7))),0.0,1.0);\n\n  float depth = length(p-ro);\n\n  col = vec3(1.0/depth);\n  col *= lum;\n  col += 0.3*vec3(0.0,1.0,1.0)*max(0.0,n.y);\n  col += (pow(depth,0.3))*vec3(0.2,0.0,0.5)*0.2;\n\n  col += e * vec3(1.0,0.6,0.0);\n\n  out_color = vec4(col,0);\n\n  //out_color = vec4(fract(uv*5.0),0,0);\n}"});
R({name:"Sphere Grid", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\nvec2 rotate_u(vec2 k, float t) {\n  return vec2(cos(t)*k.x - sin(t)*k.y, sin(t)*k.x + cos(t)*k.y);\n}\n\nfloat cast_sky(vec3 p) {\n  float t1 = length( abs(mod(vec3(p.x, p.y - time, p.z - time), 2.0) - 1.0)) - 0.4;\n  return t1;\n}\n\nvoid main( void ) {\n  vec2 position = ( gl_FragCoord.xy / resolution.xy );\n  vec2 uv = -1.0 + 2.0 * position;\n  vec3 dir = normalize(vec3(uv * vec2(1.25, 1.0), 1.0));\n  \n  dir.xy = rotate_u(dir.xy, time * 0.2);\n  dir.zx = rotate_u(dir.zx, time * 0.01);\n  vec3 pos = vec3(0.0, 2.0, time * 3.0);\n  vec3 ray = pos;\n  float  t = 0.0;\n  for(int i = 0 ; i < 70; i++) {\n    float k = cast_sky(ray + dir * t);\n    t += k * 0.75;\n  }\n  vec3 hit = ray + dir * t;\n  vec2 h   = vec2(0.01, 0.00);\n\n  vec3 N   = normalize(vec3(\n    cast_sky(hit + h.xyy),\n    cast_sky(hit + h.yxy),\n    cast_sky(hit + h.yyx)) - cast_sky(hit));\n    glFragColor = vec4(1.0-(N + t * 0.1), 1);\n}"});
R({name:"Torus Thingy", category:'Shaders', type:'frag', params:[{key:'speed',label:'speed',min:0,max:3,step:.01,value:1}], frag:"uniform float speed;\n#undef time\n#define time (u_time*speed)\n#undef iTime\n#define iTime (u_time*speed)\n// original https://www.shadertoy.com/view/4t2yW1\n\n/*\n* License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n* Created by bal-khan\n*/\n\nvec2    march(vec3 pos, vec3 dir);\nvec3    camera(vec2 uv);\nvoid    rotate_u(inout vec2 v, float angle);\nvec3    calcNormal( in vec3 pos, float e, vec3 dir);\nfloat    loop_circle(vec3 p);\nfloat    circle(vec3 p, float phase);\nfloat    sdTorus( vec3 p, vec2 t, float phase );\nfloat    mylength(vec2 p);\nfloat    nrand( vec2 n );\n\nfloat     t;            // time\nvec3    ret_col;    // torus color\nvec3    h;             // light amount\n\n#define I_MAX        200.\n#define E            0.0001\n#define FAR            10.\n#define PI            3.14\n\nvoid main(void)\n{\n    vec2 f=gl_FragCoord.xy;\n    t  = time*.125;\n    vec3    col = vec3(0., 0., 0.);\n    vec2 R = resolution.xy,\n          uv  = vec2(f-R/2.) / R.y;\n    vec3    dir = camera(uv);\n    vec3    pos = vec3(.0, .0, 0.0);\n\n    pos.z = 4.5+1.5*sin(t*10.);    \n    h*=0.;\n    vec2    inter = (march(pos, dir));\n    if (inter.y <= FAR)\n        col.xyz = ret_col*(1.-inter.x*.0025);\n    else\n        col *= 0.;\n    col += h*.005125;\n    glFragColor =  vec4(col,1.0);\n}\n\nfloat    scene(vec3 p)\n{  \n    float    var;\n    float    mind = 1e5;\n    rotate_u(p.xz, 1.57-.5*time);\n    rotate_u(p.yz, 1.57-.5*time);\n    vec2 q = vec2(length(p.xy)-2.,p.z);\n    \n    var =\n        step(cos(floor( (atan(p.x,p.y))*10.)/1.+time*1.)*3.14, atan(q.x, p.z ))\n        *\n        step(atan(q.x, p.z )-2., cos(floor( (atan(p.x,p.y))*10.)/1.+time*1.)*3.14)\n        ;\n    \n    ret_col = 1.-vec3(.5-var*.5, .5, .3+var*.5);\n    mind = mylength(q)-.5-.1*var;\n    h += vec3(.5,.8,.5)*(var!=0.?0.:1.)*vec3(1.)*.0125/(.01+(mind-var*.1)*(mind-var*.1) );\n    h += vec3(.5,.8,.5)*(var!=0.?1.:0.)*vec3(1.)*.0125/(.01+mind*mind);\n    \n    return (mind);\n}\n\nvec2    march(vec3 pos, vec3 dir)\n{\n    vec2    dist = vec2(0.0, 0.0);\n    vec3    p = vec3(0.0, 0.0, 0.0);\n    vec2    s = vec2(0.0, 0.0);\n\n        for (float i = -1.; i < I_MAX; ++i)\n        {\n            p = pos + dir * dist.y;\n            dist.x = scene(p);\n            dist.y += dist.x*.2; // makes artefacts disappear\n            if (dist.x < E || dist.y > FAR)\n            {\n                break;\n            }\n            s.x++;\n    }\n    s.y = dist.y;\n    return (s);\n}\n\nfloat    mylength(vec2 p)\n{\n    float    ret;\n    \n    p = p*p*p*p;\n    p = p*p;\n    ret = (p.x+p.y);\n    ret = pow(ret, 1./8.);\n    \n    return ret;\n}\n\n// Utilities\n\nvoid rotate_u(inout vec2 v, float angle)\n{\n    v = vec2(cos(angle)*v.x+sin(angle)*v.y,-sin(angle)*v.x+cos(angle)*v.y);\n}\n\nvec2    rot(vec2 p, vec2 ang)\n{\n    float    c = cos(ang.x);\n    float    s = sin(ang.y);\n    mat2    m = mat2(c, -s, s, c);\n    \n    return (p * m);\n}\n\nvec3    camera(vec2 uv)\n{\n    float        fov = 1.;\n    vec3        forw  = vec3(0.0, 0.0, -1.0);\n    vec3        right = vec3(1.0, 0.0, 0.0);\n    vec3        up    = vec3(0.0, 1.0, 0.0);\n\n    return (normalize((uv.x) * right + (uv.y) * up + fov * forw));\n}\n\nvec3 calcNormal( in vec3 pos, float e, vec3 dir)\n{\n    vec3 eps = vec3(e,0.0,0.0);\n\n    return normalize(vec3(\n           march(pos+eps.xyy, dir).y - march(pos-eps.xyy, dir).y,\n           march(pos+eps.yxy, dir).y - march(pos-eps.yxy, dir).y,\n           march(pos+eps.yyx, dir).y - march(pos-eps.yyx, dir).y ));\n}"});
