<script>
/* b25.js — Fluid batch (custom archetype, Tier C best-effort) + Terrain.
   Modes:
     2D Multiphase SPH                 — CPU particle SPH, 2 phases, additive points
     Eulerian Marker-and-Cell Fluid    — coarse MAC grid (Canvas2D via present2D)
     Jos Stam 2D Fluid                 — Stable Fluids on a coarse grid (Canvas2D)
     Lattice Boltzmann Method 1        — D2Q9 LBM in a channel (Canvas2D)
     Lattice Boltzmann Method 2        — D2Q9 LBM with circular obstacles (Canvas2D)
     Viscoelastic Fluid                — Clavet double-density-relaxation particles (points)
     3D Multiphase SPH                 — 3D CPU SPH, 4 coloured emitters, projected points
     Jos Stam 3D Fluid                 — 3D Stable Fluids, projected density point cloud
     Terrain                           — fault+erosion heightfield, shaded 3D mesh (Canvas2D)

   APPROXIMATION NOTES (Tier C):
   - All particle counts are kept small (<=1500 for O(N^2)-ish neighbour passes,
     grid <=128) for headless-frame speed; these are plausible reductions of the
     full VoC sims, not 1:1 ports.
   - Grid fluids (MAC, Jos Stam 2D, LBM) run on a coarse CPU grid and are drawn
     with Canvas2D through api.present2D — a faithful visualisation of the field,
     not a GPU multipass solver.
   - 3D modes (3D SPH, Jos Stam 3D) simulate in 3D then perspective-project to a
     rotating 2D point cloud (NOTE: voxel/sphere/billboard render approximated by
     additive points).
   - Terrain renders a lit heightfield as a projected triangle-strip mesh in
     Canvas2D (NOTE: approximation of the full OpenGL mesh renderer).

   Registers into window.VOC. */
(function(){
const R = window.VOC.register;

// deterministic PRNG so seeds / resets are repeatable
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// ----------------------------------------------------------------------------
// Shared additive point program: attr0 = vec2 clip pos, attr1 = float colour t,
// attr2 = float pointSize. Soft round dots coloured via the active palette.
// ----------------------------------------------------------------------------
function makePointProg(api){
  return api.buildProgramVF(
    `#version 300 es
     in vec2 pos; in float ct; in float psz;
     out float vt;
     void main(){ vt=ct; gl_Position=vec4(pos,0.,1.); gl_PointSize=psz; }`,
    `#version 300 es
     precision highp float;
     in float vt; out vec4 o;
     uniform sampler2D u_pal; uniform float u_alpha;
     void main(){
       vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
       if(r>0.25) discard;
       float fall=1.0-r*4.0;
       vec3 col=texture(u_pal, vec2(clamp(vt,0.0,1.0),0.5)).rgb;
       // lift the floor so clustered fluid reads brightly even when sparse
       col=col*0.6+0.4;
       o=vec4(col*fall, u_alpha*fall);
     }`);
}
function makePointBuffers(api, N){
  const gl=api.gl;
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const posBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, N*2*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const ctBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,ctBuf);
  gl.bufferData(gl.ARRAY_BUFFER, N*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,0,0);
  const szBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,szBuf);
  gl.bufferData(gl.ARRAY_BUFFER, N*4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
  return {vao,posBuf,ctBuf,szBuf};
}
function drawPoints(api, st, n, alpha){
  const gl=api.gl;
  api.toScreen(); api.clear(0,0,0,1);
  if(n<=0) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(st.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, api.paletteTex);
  gl.uniform1i(gl.getUniformLocation(st.prog,'u_pal'),1);
  gl.uniform1f(gl.getUniformLocation(st.prog,'u_alpha'),alpha);
  gl.bindVertexArray(st.vao); gl.drawArrays(gl.POINTS,0,n); gl.bindVertexArray(null);
  gl.disable(gl.BLEND);
}
function uploadPoints(api, st, n){
  const gl=api.gl;
  gl.bindBuffer(gl.ARRAY_BUFFER,st.posBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,st.pos.subarray(0,n*2));
  gl.bindBuffer(gl.ARRAY_BUFFER,st.ctBuf);  gl.bufferSubData(gl.ARRAY_BUFFER,0,st.col.subarray(0,n));
  gl.bindBuffer(gl.ARRAY_BUFFER,st.szBuf);  gl.bufferSubData(gl.ARRAY_BUFFER,0,st.siz.subarray(0,n));
}
function disposePoints(api,st){ const gl=api.gl;
  gl.deleteBuffer(st.posBuf); gl.deleteBuffer(st.ctBuf); gl.deleteBuffer(st.szBuf);
  gl.deleteVertexArray(st.vao); gl.deleteProgram(st.prog); }

// ----------------------------------------------------------------------------
// Shared Canvas2D helper for grid-field modes.
// ----------------------------------------------------------------------------
function makeCanvas(api){
  const c=document.createElement('canvas');
  c.width=Math.max(2,api.W); c.height=Math.max(2,api.H);
  return c;
}

// Read a palette colour (0..1) from the engine palette texture into [r,g,b] 0..255.
// We rebuild a small JS LUT from a fixed turbo-ish ramp so Canvas2D modes have
// colour without GL readback (kept independent of the live palette for speed).
const LUT_STOPS=[[48,18,59],[70,107,227],[40,187,210],[100,222,98],[230,210,55],[250,130,40],[185,40,30],[122,4,3]];
function palLUT(t){
  if(!(t>=0)) t=0; else if(t>1) t=1;   // also catches NaN
  const f=t*(LUT_STOPS.length-1), a=Math.floor(f), b=Math.min(LUT_STOPS.length-1,a+1), k=f-a;
  return [ LUT_STOPS[a][0]*(1-k)+LUT_STOPS[b][0]*k,
           LUT_STOPS[a][1]*(1-k)+LUT_STOPS[b][1]*k,
           LUT_STOPS[a][2]*(1-k)+LUT_STOPS[b][2]*k ];
}

// =====================================================================
// 1) 2D Multiphase SPH  — CPU particle SPH, 2 phases (heavy/light).
//    Double-density relaxation pressure (cheap, stable), gravity, walls.
// =====================================================================
R({
  name:'2D Multiphase Smoothed-Particle Hydrodynamics', category:'Fluid', type:'custom',
  params:[
    {key:'particles', label:'particles', min:300, max:1400, step:20,  value:1000},
    {key:'gravity',   label:'gravity',   min:0,   max:3,    step:.01, value:1.0},
    {key:'stiffness', label:'stiffness', min:.05, max:1.5,  step:.01, value:0.4},
    {key:'viscosity', label:'viscosity', min:0,   max:1,    step:.01, value:0.15},
  ],
  init(api){
    const N=1400;
    const st={prog:makePointProg(api), N,
      px:new Float32Array(N), py:new Float32Array(N),
      vx:new Float32Array(N), vy:new Float32Array(N),
      ph:new Uint8Array(N), rho:new Float32Array(N),
      pos:new Float32Array(N*2), col:new Float32Array(N), siz:new Float32Array(N),
      seeded:false, lastN:0,
      // uniform spatial grid for neighbour search
      gw:0, gh:0, cell:0.09, head:null, next:new Int32Array(N)};
    Object.assign(st, makePointBuffers(api,N));
    return st;
  },
  reset(api,st){ st.seeded=false; },
  frame(api,st){
    const p=api.params, n=Math.min(st.N, Math.max(50, Math.floor(p.particles)));
    const ax=api.W/api.H;
    if(!st.seeded || n!==st.lastN){
      const rnd=mulberry32(424242);
      for(let i=0;i<st.N;i++){
        // two blocks dropped: heavy phase lower-left, light phase upper-right
        const heavy=i<st.N*0.5;
        st.ph[i]=heavy?0:1;
        st.px[i]=(rnd()*0.8-0.9)+(heavy?0:0.9);
        st.py[i]=heavy?(rnd()*0.7-0.9):(rnd()*0.7+0.1);
        st.vx[i]=0; st.vy[i]=0;
      }
      st.seeded=true; st.lastN=n;
      // grid sized to clip space [-1,1]
      st.gw=Math.max(4,Math.ceil(2/st.cell)); st.gh=st.gw;
      st.head=new Int32Array(st.gw*st.gh);
    }
    const h=0.11, h2=h*h, dt=0.016;
    const px=st.px,py=st.py,vx=st.vx,vy=st.vy,rho=st.rho;
    const k=p.stiffness*0.6, kNear=p.stiffness*1.2, rho0=6.0;
    const visc=p.viscosity, g=p.gravity*0.45;
    // build grid
    const gw=st.gw,gh=st.gh,cell=st.cell,head=st.head,next=st.next;
    head.fill(-1);
    const gidx=(x,y)=>{ let cx=Math.floor((x+1)/cell), cy=Math.floor((y+1)/cell);
      if(cx<0)cx=0; else if(cx>=gw)cx=gw-1; if(cy<0)cy=0; else if(cy>=gh)cy=gh-1; return cy*gw+cx; };
    for(let i=0;i<n;i++){ const c=gidx(px[i],py[i]); next[i]=head[c]; head[c]=i; }
    // density (double density relaxation style)
    const rnear=new Float32Array(n);
    for(let i=0;i<n;i++){
      let d=0, dn=0; const xi=px[i], yi=py[i];
      let cx=Math.floor((xi+1)/cell), cy=Math.floor((yi+1)/cell);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox, gy=cy+oy; if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
        for(let j=head[gy*gw+gx]; j!==-1; j=next[j]){
          if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, r2=dx*dx+dy*dy;
          if(r2<h2){ const q=1-Math.sqrt(r2)/h; d+=q*q; dn+=q*q*q; }
        }
      }
      rho[i]=d; rnear[i]=dn;
    }
    // pressure displacement
    for(let i=0;i<n;i++){
      const pr=k*(rho[i]-rho0), prN=kNear*rnear[i];
      const xi=px[i], yi=py[i];
      let cx=Math.floor((xi+1)/cell), cy=Math.floor((yi+1)/cell);
      let dxA=0, dyA=0;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox, gy=cy+oy; if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
        for(let j=head[gy*gw+gx]; j!==-1; j=next[j]){
          if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, r2=dx*dx+dy*dy;
          if(r2<h2 && r2>1e-9){ const r=Math.sqrt(r2), q=1-r/h;
            const D=(pr*q + prN*q*q)*dt*dt*0.5;
            const nx=dx/r, ny=dy/r;
            dxA-=nx*D; dyA-=ny*D;
            px[j]+=nx*D; py[j]+=ny*D;
          }
        }
      }
      px[i]+=dxA; py[i]+=dyA;
    }
    // integrate + viscosity-ish damping + gravity + walls
    const pos=st.pos, col=st.col, siz=st.siz, ph=st.ph;
    for(let i=0;i<n;i++){
      vy[i]-=g*dt;
      vx[i]*=(1-visc*0.5); vy[i]*=(1-visc*0.5);
      px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      // walls (clip space, leave x margin for aspect)
      const xm=0.98;
      if(px[i]<-xm){px[i]=-xm; vx[i]*=-0.4;} else if(px[i]>xm){px[i]=xm; vx[i]*=-0.4;}
      if(py[i]<-0.98){py[i]=-0.98; vy[i]*=-0.4;} else if(py[i]>0.98){py[i]=0.98; vy[i]*=-0.4;}
      // velocity from position change is implicit; recover a little from displacement
      pos[i*2]=px[i]/Math.max(1,ax); pos[i*2+1]=py[i];
      col[i]= ph[i]===0 ? 0.78 : 0.35;   // heavy=warm, light=cool
      siz[i]=12.0;
    }
    uploadPoints(api, st, n);
    drawPoints(api, st, n, 1.0);
  },
  dispose:disposePoints
});

// =====================================================================
// Shared grid-fluid (Jos Stam Stable Fluids 2D) used by Jos Stam 2D and
// the MAC-fluid visualisation. Coarse CPU grid, Canvas2D output.
// =====================================================================
function stableFluidMode(name, opts){
  return {
    name, category:'Fluid', type:'custom',
    params:[
      {key:'force',     label:'force',     min:1,   max:20,  step:.5,  value:opts.force||8},
      {key:'diffusion', label:'diffusion', min:0,   max:.001,step:.00001,value:0.00005},
      {key:'viscosity', label:'viscosity', min:0,   max:.001,step:.00001,value:0.00002},
      {key:'fade',      label:'dye fade',  min:0,   max:.05, step:.001,value:0.012},
    ],
    init(api){
      const Ngrid=opts.N||96;
      const sz=(Ngrid+2)*(Ngrid+2);
      const st={
        c:makeCanvas(api), ctx:null, N:Ngrid,
        u:new Float32Array(sz), v:new Float32Array(sz),
        u0:new Float32Array(sz), v0:new Float32Array(sz),
        d:new Float32Array(sz), d0:new Float32Array(sz),
        img:null, frame0:true, t:0, mode:opts.mode||'stam'
      };
      st.ctx=st.c.getContext('2d');
      st.img=st.ctx.createImageData(Ngrid, Ngrid);
      return st;
    },
    reset(api,st){ st.u.fill(0); st.v.fill(0); st.d.fill(0); st.frame0=true; st.t=0; },
    frame(api,st){
      const N=st.N, p=api.params;
      const IX=(i,j)=>i+(N+2)*j;
      const u=st.u,v=st.v,u0=st.u0,v0=st.v0,d=st.d,d0=st.d0;
      const dt=0.12;
      function set_bnd(b,x){
        for(let i=1;i<=N;i++){
          x[IX(0,i)]   = b===1? -x[IX(1,i)] : x[IX(1,i)];
          x[IX(N+1,i)] = b===1? -x[IX(N,i)] : x[IX(N,i)];
          x[IX(i,0)]   = b===2? -x[IX(i,1)] : x[IX(i,1)];
          x[IX(i,N+1)] = b===2? -x[IX(i,N)] : x[IX(i,N)];
        }
        x[IX(0,0)]    =0.5*(x[IX(1,0)]+x[IX(0,1)]);
        x[IX(0,N+1)]  =0.5*(x[IX(1,N+1)]+x[IX(0,N)]);
        x[IX(N+1,0)]  =0.5*(x[IX(N,0)]+x[IX(N+1,1)]);
        x[IX(N+1,N+1)]=0.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
      }
      function lin_solve(b,x,x0,a,c){
        const ic=1/c;
        for(let k=0;k<10;k++){
          for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
            x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)]))*ic;
          }
          set_bnd(b,x);
        }
      }
      function diffuse(b,x,x0,diff){ const a=dt*diff*N*N; lin_solve(b,x,x0,a,1+4*a); }
      function advect(b,dn,d0a,ud,vd){
        const dt0=dt*N;
        for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
          let x=i-dt0*ud[IX(i,j)], y=j-dt0*vd[IX(i,j)];
          if(x<0.5)x=0.5; if(x>N+0.5)x=N+0.5; const i0=x|0, i1=i0+1;
          if(y<0.5)y=0.5; if(y>N+0.5)y=N+0.5; const j0=y|0, j1=j0+1;
          const s1=x-i0,s0=1-s1, t1=y-j0,t0=1-t1;
          dn[IX(i,j)]=s0*(t0*d0a[IX(i0,j0)]+t1*d0a[IX(i0,j1)])
                      +s1*(t0*d0a[IX(i1,j0)]+t1*d0a[IX(i1,j1)]);
        }
        set_bnd(b,dn);
      }
      function project(ud,vd,pp,div){
        for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
          div[IX(i,j)]=-0.5*(ud[IX(i+1,j)]-ud[IX(i-1,j)]+vd[IX(i,j+1)]-vd[IX(i,j-1)])/N;
          pp[IX(i,j)]=0;
        }
        set_bnd(0,div); set_bnd(0,pp);
        lin_solve(0,pp,div,1,4);
        for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
          ud[IX(i,j)]-=0.5*N*(pp[IX(i+1,j)]-pp[IX(i-1,j)]);
          vd[IX(i,j)]-=0.5*N*(pp[IX(i,j+1)]-pp[IX(i,j-1)]);
        }
        set_bnd(1,ud); set_bnd(2,vd);
      }

      // ---- inject sources (a rotating fountain near bottom + swirling jet) ----
      st.t+=dt;
      const cx=(N*0.5)|0;
      const f=p.force;
      // bottom-centre upward jet of dye + velocity
      for(let i=-2;i<=2;i++){
        const ix=cx+i;
        d[IX(ix, 3)] += 30;
        v[IX(ix, 3)] += f*0.9;
        u[IX(ix, 3)] += Math.sin(st.t*1.3)*f*0.5;
      }
      // two side swirls so the field stays lively for MAC look
      const sw=Math.sin(st.t)*f*0.6;
      u[IX((N*0.25)|0,(N*0.5)|0)] += sw;
      v[IX((N*0.25)|0,(N*0.5)|0)] += f*0.3;
      u[IX((N*0.75)|0,(N*0.5)|0)] -= sw;
      v[IX((N*0.75)|0,(N*0.5)|0)] += f*0.3;
      if(st.frame0){
        // seed a little dye everywhere so frame 1 is not blank
        for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
          d[IX(i,j)] = 4.0*Math.exp(-((i-cx)*(i-cx)+(j-N*0.3)*(j-N*0.3))/(N*2.0));
        }
        st.frame0=false;
      }

      // ---- velocity step ----
      u0.set(u); v0.set(v);
      diffuse(1,u0,u,p.viscosity); diffuse(2,v0,v,p.viscosity);
      project(u0,v0,u,v);
      u.set(u0); v.set(v0); // advect uses copy
      advect(1,u,u0,u0,v0); advect(2,v,v0,u0,v0);
      project(u,v,u0,v0);
      // ---- density step ----
      d0.set(d);
      diffuse(0,d0,d,p.diffusion);
      advect(0,d,d0,u,v);
      // fade
      const fade=1-p.fade;
      for(let q=0;q<d.length;q++) d[q]*=fade;

      // ---- render to Canvas2D ----
      const img=st.img.data;
      const showVel=(st.mode==='mac'); // MAC visualises velocity magnitude tint
      for(let j=0;j<N;j++)for(let i=0;i<N;i++){
        const dv=d[IX(i+1,j+1)];
        let t;
        if(showVel){
          const sp=Math.hypot(u[IX(i+1,j+1)],v[IX(i+1,j+1)]);
          t = Math.min(1, sp*0.6 + dv*0.05);
        } else {
          t = Math.min(1, dv*0.05);
        }
        const col=palLUT(t);
        // canvas row 0 = top; sim j grows upward, so flip vertically
        const o=((N-1-j)*N + i)*4;
        const bright=Math.min(1, dv*0.04+0.04);
        img[o]  =col[0]*bright + (showVel?col[0]*0.0:0);
        img[o+1]=col[1]*bright;
        img[o+2]=col[2]*bright;
        // make velocity-mode brighter
        if(showVel){ img[o]=col[0]; img[o+1]=col[1]; img[o+2]=col[2]; img[o]*=t*0.9+0.1; img[o+1]*=t*0.9+0.1; img[o+2]*=t*0.9+0.1; }
        else { img[o]=col[0]*Math.min(1,t+0.05); img[o+1]=col[1]*Math.min(1,t+0.05); img[o+2]=col[2]*Math.min(1,t+0.05); }
        img[o+3]=255;
      }
      st.ctx.putImageData(st.img,0,0);
      // scale the small grid image up to full canvas
      st.ctx.imageSmoothingEnabled=true;
      st.ctx.drawImage(st.c, 0,0,N,N, 0,0,st.c.width,st.c.height);
      api.present2D(st.c);
    },
    dispose(api,st){}
  };
}

// =====================================================================
// Lattice Boltzmann D2Q9 (shared) — channel flow, Canvas2D curl render.
// =====================================================================
function lbmMode(name, opts){
  return {
    name, category:'Fluid', type:'custom',
    params:[
      {key:'flowSpeed', label:'flow speed', min:0.01, max:0.15, step:.005, value:opts.flow||0.07},
      {key:'viscosity', label:'viscosity', min:0.005,max:0.12, step:.001, value:opts.visc||0.02},
      {key:'contrast',  label:'contrast',  min:5,    max:80,   step:1,    value:30},
      {key:'steps',     label:'steps/frame',min:1,   max:30,   step:1,    value:opts.steps||12},
    ],
    init(api){
      const W=opts.W||140, H=opts.H||70, n=W*H;
      // D2Q9 weights and velocities
      const ex=[0,1,0,-1,0,1,-1,-1,1], ey=[0,0,1,0,-1,1,1,-1,-1];
      const w=[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36];
      const f=[], feq=[];
      for(let k=0;k<9;k++){ f.push(new Float32Array(n)); feq.push(new Float32Array(n)); }
      const st={c:makeCanvas(api), ctx:null, W,H,n, ex,ey,w, f,feq,
        rho:new Float32Array(n), ux:new Float32Array(n), uy:new Float32Array(n),
        barrier:new Uint8Array(n), img:null, seeded:false, kind:opts.kind||'channel'};
      st.ctx=st.c.getContext('2d');
      st.img=st.ctx.createImageData(W,H);
      return st;
    },
    reset(api,st){ st.seeded=false; },
    seed(st,flow){
      const {W,H,n,f,w,ex,ey}=st;
      const u0=flow;
      for(let k=0;k<9;k++){
        const fk=f[k], wk=w[k], cu0=3*ex[k]*u0, u2=1.5*u0*u0;
        for(let q=0;q<n;q++) fk[q]=wk*(1+cu0+0.5*cu0*cu0-u2);
      }
      st.barrier.fill(0);
      const bar=st.barrier;
      if(st.kind==='channel'){
        // single bar obstacle mid-left to shed a Karman vortex street
        const bx=(W*0.25)|0, by0=(H*0.4)|0, by1=(H*0.6)|0;
        for(let y=by0;y<=by1;y++) bar[y*W+bx]=1;
      } else {
        // many circles (LBM 2 default "Many circles")
        const rnd=mulberry32(20240601);
        const circles=7;
        for(let cI=0;cI<circles;cI++){
          const ccx=(W*(0.2+0.55*rnd()))|0, ccy=(H*(0.15+0.7*rnd()))|0, rad=2+(rnd()*3)|0;
          for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){
            if(x*x+y*y<=rad*rad){ const px=ccx+x, py=ccy+y;
              if(px>=1&&px<W-1&&py>=1&&py<H-1) bar[py*W+px]=1; }
          }
        }
      }
      // walls top/bottom
      for(let x=0;x<W;x++){ bar[x]=1; bar[(H-1)*W+x]=1; }
      st.seeded=true;
    },
    frame(api,st){
      const p=api.params;
      const {W,H,n,ex,ey,w,f,rho,ux,uy,barrier}=st;
      const flow=p.flowSpeed;
      if(!st.seeded) this.seed(st,flow);
      const omega=1/(3*p.viscosity+0.5);
      const steps=Math.max(1,Math.floor(p.steps));
      const IX=(x,y)=>x+W*y;
      for(let s=0;s<steps;s++){
        // collide
        for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
          const q=IX(x,y); if(barrier[q])continue;
          let r=0, mx=0, my=0;
          for(let k=0;k<9;k++){ const fk=f[k][q]; r+=fk; mx+=ex[k]*fk; my+=ey[k]*fk; }
          rho[q]=r; const ix=mx/r, iy=my/r; ux[q]=ix; uy[q]=iy;
          const u2=1.5*(ix*ix+iy*iy);
          for(let k=0;k<9;k++){
            const cu=3*(ex[k]*ix+ey[k]*iy);
            const fe=w[k]*r*(1+cu+0.5*cu*cu-u2);
            f[k][q]+=omega*(fe-f[k][q]);
          }
        }
        // stream (pull scheme into temp via index shift); simple copy approach
        for(let k=0;k<9;k++){
          const fk=f[k], dx=ex[k], dy=ey[k];
          if(dx===0&&dy===0)continue;
          // iterate in correct order to avoid overwrite
          if(dx>0){
            for(let x=W-2;x>=1;x--)for(let y=1;y<H-1;y++){ const q=IX(x,y);
              if(barrier[q])continue; const src=IX(x-dx,y-dy); if(barrier[src])continue; fk[q]=fk[src]; }
          } else if(dx<0){
            for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++){ const q=IX(x,y);
              if(barrier[q])continue; const src=IX(x-dx,y-dy); if(barrier[src])continue; fk[q]=fk[src]; }
          } else {
            if(dy>0){ for(let y=H-2;y>=1;y--)for(let x=1;x<W-1;x++){ const q=IX(x,y);
                if(barrier[q])continue; const src=IX(x-dx,y-dy); if(barrier[src])continue; fk[q]=fk[src]; } }
            else { for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){ const q=IX(x,y);
                if(barrier[q])continue; const src=IX(x-dx,y-dy); if(barrier[src])continue; fk[q]=fk[src]; } }
          }
        }
        // bounce-back at barriers (reflect neighbours)
        const opp=[0,3,4,1,2,7,8,5,6];
        for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
          const q=IX(x,y); if(!barrier[q])continue;
          for(let k=1;k<9;k++){ const nx=x+ex[k], ny=y+ey[k];
            if(nx<0||ny<0||nx>=W||ny>=H)continue; const nq=IX(nx,ny); if(barrier[nq])continue;
            f[opp[k]][nq]=f[k][q]; }
        }
        // inflow left column / outflow right column (zou-he-ish: reset to eq)
        for(let y=1;y<H-1;y++){
          const cu0=3*flow, u2=1.5*flow*flow;
          for(let k=0;k<9;k++){ const cu=ex[k]*cu0;
            f[k][IX(0,y)]=w[k]*(1+cu+0.5*cu*cu-u2);
            f[k][IX(W-1,y)]=f[k][IX(W-2,y)];
          }
        }
      }
      // ---- render curl ----
      const img=st.img.data, contrast=p.contrast;
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const q=IX(x,y);
        const o=((H-1-y)*W+x)*4;
        if(barrier[q]){ img[o]=15; img[o+1]=15; img[o+2]=20; img[o+3]=255; continue; }
        let curl=0;
        if(x>0&&x<W-1&&y>0&&y<H-1){
          curl=(uy[IX(x+1,y)]-uy[IX(x-1,y)])-(ux[IX(x,y+1)]-ux[IX(x,y-1)]);
        }
        const t=0.5+curl*contrast;
        const col=palLUT(t);
        img[o]=col[0]; img[o+1]=col[1]; img[o+2]=col[2]; img[o+3]=255;
      }
      st.ctx.putImageData(st.img,0,0);
      st.ctx.imageSmoothingEnabled=true;
      st.ctx.drawImage(st.c, 0,0,W,H, 0,0,st.c.width,st.c.height);
      api.present2D(st.c);
    },
    dispose(api,st){}
  };
}

// =====================================================================
// 6) Viscoelastic Fluid — Clavet et al. particle fluid with springs.
//    Double density relaxation + viscosity + elastic springs between
//    close pairs (plasticity). Drawn as additive points.
// =====================================================================
R({
  name:'Viscoelastic Fluid', category:'Fluid', type:'custom',
  params:[
    {key:'particles',  label:'particles',  min:300, max:1200, step:20,  value:900},
    {key:'gravity',    label:'gravity',    min:0,   max:3,    step:.01, value:1.0},
    {key:'stiffness',  label:'stiffness',  min:.05, max:1.2,  step:.01, value:0.35},
    {key:'elasticity', label:'elasticity', min:0,   max:1,    step:.01, value:0.4},
  ],
  init(api){
    const N=1200;
    const st={prog:makePointProg(api), N,
      px:new Float32Array(N), py:new Float32Array(N),
      vx:new Float32Array(N), vy:new Float32Array(N),
      pxo:new Float32Array(N), pyo:new Float32Array(N),
      pos:new Float32Array(N*2), col:new Float32Array(N), siz:new Float32Array(N),
      seeded:false, lastN:0,
      gw:0, gh:0, cell:0.1, head:null, next:new Int32Array(N)};
    Object.assign(st, makePointBuffers(api,N));
    return st;
  },
  reset(api,st){ st.seeded=false; },
  frame(api,st){
    const p=api.params, n=Math.min(st.N, Math.max(50, Math.floor(p.particles)));
    const ax=api.W/api.H;
    if(!st.seeded || n!==st.lastN){
      const rnd=mulberry32(99001);
      // drop a tall column so it splashes (shows viscoelastic stretch)
      for(let i=0;i<st.N;i++){
        st.px[i]=rnd()*0.5-0.25;
        st.py[i]=rnd()*1.4-0.2;
        st.vx[i]=0; st.vy[i]=0;
      }
      st.seeded=true; st.lastN=n;
      st.gw=Math.max(4,Math.ceil(2/st.cell)); st.gh=st.gw;
      st.head=new Int32Array(st.gw*st.gh);
    }
    const h=0.12, h2=h*h, dt=0.016;
    const px=st.px,py=st.py,vx=st.vx,vy=st.vy,pxo=st.pxo,pyo=st.pyo;
    const g=p.gravity*0.5;
    const k=p.stiffness*0.4, kNear=p.stiffness*0.9, rho0=4.0;
    const kSpring=p.elasticity*0.3;
    // apply gravity, save old pos, predict
    for(let i=0;i<n;i++){ vy[i]-=g*dt; pxo[i]=px[i]; pyo[i]=py[i]; px[i]+=vx[i]*dt; py[i]+=vy[i]*dt; }
    // grid
    const gw=st.gw,gh=st.gh,cell=st.cell,head=st.head,next=st.next;
    head.fill(-1);
    for(let i=0;i<n;i++){ let cx=Math.floor((px[i]+1)/cell), cy=Math.floor((py[i]+1)/cell);
      if(cx<0)cx=0;else if(cx>=gw)cx=gw-1; if(cy<0)cy=0;else if(cy>=gh)cy=gh-1;
      const c=cy*gw+cx; next[i]=head[c]; head[c]=i; }
    // double density relaxation (+ light elastic restoring toward rest spacing)
    for(let i=0;i<n;i++){
      let d=0, dn=0; const xi=px[i], yi=py[i];
      let cx=Math.floor((xi+1)/cell), cy=Math.floor((yi+1)/cell);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox, gy=cy+oy; if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
        for(let j=head[gy*gw+gx]; j!==-1; j=next[j]){ if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, r2=dx*dx+dy*dy;
          if(r2<h2){ const q=1-Math.sqrt(r2)/h; d+=q*q; dn+=q*q*q; } }
      }
      const pr=k*(d-rho0), prN=kNear*dn;
      let dxA=0,dyA=0;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox, gy=cy+oy; if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
        for(let j=head[gy*gw+gx]; j!==-1; j=next[j]){ if(j===i)continue;
          const dx=px[j]-xi, dy=py[j]-yi, r2=dx*dx+dy*dy;
          if(r2<h2 && r2>1e-9){ const r=Math.sqrt(r2), q=1-r/h;
            // elastic spring: pull toward rest length 0.6h (gives stringy look)
            const rest=0.6*h, springD=kSpring*(rest-r)*q*dt*dt;
            const D=(pr*q + prN*q*q)*dt*dt*0.5 - springD;
            const nx=dx/r, ny=dy/r;
            dxA-=nx*D; dyA-=ny*D; px[j]+=nx*D; py[j]+=ny*D; }
        }
      }
      px[i]+=dxA; py[i]+=dyA;
    }
    // walls + recompute velocity from displacement (Clavet)
    const pos=st.pos, col=st.col, siz=st.siz;
    for(let i=0;i<n;i++){
      const xm=0.98;
      if(px[i]<-xm)px[i]=-xm; else if(px[i]>xm)px[i]=xm;
      if(py[i]<-0.98)py[i]=-0.98; else if(py[i]>0.98)py[i]=0.98;
      vx[i]=(px[i]-pxo[i])/dt; vy[i]=(py[i]-pyo[i])/dt;
      pos[i*2]=px[i]/Math.max(1,ax); pos[i*2+1]=py[i];
      const sp=Math.min(1,Math.hypot(vx[i],vy[i])*0.15);
      col[i]=0.25+sp*0.6; siz[i]=12.0;
    }
    uploadPoints(api, st, n);
    drawPoints(api, st, n, 1.0);
  },
  dispose:disposePoints
});

// =====================================================================
// 7) 3D Multiphase SPH — 3D CPU SPH, 4 coloured emitters, projected points.
//    NOTE: approximation — 3D sphere render replaced by additive billboards.
// =====================================================================
R({
  name:'3D Multiphase Smoothed-Particle Hydrodynamics', category:'Fluid', type:'custom',
  params:[
    {key:'particles', label:'particles', min:200, max:1100, step:20,  value:800},
    {key:'gravity',   label:'gravity',   min:0,   max:3,    step:.01, value:1.0},
    {key:'stiffness', label:'stiffness', min:.05, max:1.2,  step:.01, value:0.35},
    {key:'spin',      label:'rotate',    min:0,   max:2,    step:.01, value:0.6},
  ],
  init(api){
    const N=1100;
    const st={prog:makePointProg(api), N,
      px:new Float32Array(N), py:new Float32Array(N), pz:new Float32Array(N),
      vx:new Float32Array(N), vy:new Float32Array(N), vz:new Float32Array(N),
      ph:new Uint8Array(N),
      pos:new Float32Array(N*2), col:new Float32Array(N), siz:new Float32Array(N),
      seeded:false, lastN:0, theta:0,
      gw:0, cell:0.16, head:null, next:new Int32Array(N)};
    Object.assign(st, makePointBuffers(api,N));
    return st;
  },
  reset(api,st){ st.seeded=false; st.theta=0; },
  frame(api,st){
    const p=api.params, n=Math.min(st.N, Math.max(40, Math.floor(p.particles)));
    if(!st.seeded || n!==st.lastN){
      const rnd=mulberry32(70707);
      // four coloured blobs at corners of a cube (4 emitters: R/G/B/Y)
      const corners=[[-0.6,0.5,-0.6],[0.6,0.6,0.6],[0.6,0.5,-0.6],[-0.6,0.6,0.6]];
      for(let i=0;i<st.N;i++){
        const ph=i&3; st.ph[i]=ph; const c=corners[ph];
        st.px[i]=c[0]+rnd()*0.3-0.15;
        st.py[i]=c[1]+rnd()*0.3-0.15;
        st.pz[i]=c[2]+rnd()*0.3-0.15;
        st.vx[i]=0; st.vy[i]=0; st.vz[i]=0;
      }
      st.seeded=true; st.lastN=n;
      st.gw=Math.max(4,Math.ceil(2/st.cell)); st.head=new Int32Array(st.gw*st.gw*st.gw);
    }
    const h=0.18, h2=h*h, dt=0.016;
    const px=st.px,py=st.py,pz=st.pz,vx=st.vx,vy=st.vy,vz=st.vz;
    const g=p.gravity*0.45, k=p.stiffness*0.5, kNear=p.stiffness*1.0, rho0=5.0;
    // grid
    const gw=st.gw, cell=st.cell, head=st.head, next=st.next;
    head.fill(-1);
    const cidx=(x,y,z)=>{ let cx=Math.floor((x+1)/cell),cy=Math.floor((y+1)/cell),cz=Math.floor((z+1)/cell);
      if(cx<0)cx=0;else if(cx>=gw)cx=gw-1; if(cy<0)cy=0;else if(cy>=gw)cy=gw-1; if(cz<0)cz=0;else if(cz>=gw)cz=gw-1;
      return (cz*gw+cy)*gw+cx; };
    for(let i=0;i<n;i++){ const c=cidx(px[i],py[i],pz[i]); next[i]=head[c]; head[c]=i; }
    const rho=new Float32Array(n), rnear=new Float32Array(n);
    for(let i=0;i<n;i++){
      let d=0,dn=0; const xi=px[i],yi=py[i],zi=pz[i];
      let cx=Math.floor((xi+1)/cell),cy=Math.floor((yi+1)/cell),cz=Math.floor((zi+1)/cell);
      for(let oz=-1;oz<=1;oz++)for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox,gy=cy+oy,gz=cz+oz; if(gx<0||gy<0||gz<0||gx>=gw||gy>=gw||gz>=gw)continue;
        for(let j=head[(gz*gw+gy)*gw+gx]; j!==-1; j=next[j]){ if(j===i)continue;
          const dx=px[j]-xi,dy=py[j]-yi,dz=pz[j]-zi, r2=dx*dx+dy*dy+dz*dz;
          if(r2<h2){ const q=1-Math.sqrt(r2)/h; d+=q*q; dn+=q*q*q; } }
      }
      rho[i]=d; rnear[i]=dn;
    }
    for(let i=0;i<n;i++){
      const pr=k*(rho[i]-rho0), prN=kNear*rnear[i];
      const xi=px[i],yi=py[i],zi=pz[i];
      let cx=Math.floor((xi+1)/cell),cy=Math.floor((yi+1)/cell),cz=Math.floor((zi+1)/cell);
      let dxA=0,dyA=0,dzA=0;
      for(let oz=-1;oz<=1;oz++)for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox,gy=cy+oy,gz=cz+oz; if(gx<0||gy<0||gz<0||gx>=gw||gy>=gw||gz>=gw)continue;
        for(let j=head[(gz*gw+gy)*gw+gx]; j!==-1; j=next[j]){ if(j===i)continue;
          const dx=px[j]-xi,dy=py[j]-yi,dz=pz[j]-zi, r2=dx*dx+dy*dy+dz*dz;
          if(r2<h2&&r2>1e-9){ const r=Math.sqrt(r2), q=1-r/h;
            const D=(pr*q+prN*q*q)*dt*dt*0.5; const nx=dx/r,ny=dy/r,nz=dz/r;
            dxA-=nx*D; dyA-=ny*D; dzA-=nz*D; px[j]+=nx*D; py[j]+=ny*D; pz[j]+=nz*D; } }
      }
      px[i]+=dxA; py[i]+=dyA; pz[i]+=dzA;
    }
    // integrate + walls (cube)
    for(let i=0;i<n;i++){
      vy[i]-=g*dt;
      px[i]+=vx[i]*dt; py[i]+=vy[i]*dt; pz[i]+=vz[i]*dt;
      const m=0.95;
      if(px[i]<-m){px[i]=-m;vx[i]*=-0.4;}else if(px[i]>m){px[i]=m;vx[i]*=-0.4;}
      if(py[i]<-m){py[i]=-m;vy[i]*=-0.4;}else if(py[i]>m){py[i]=m;vy[i]*=-0.4;}
      if(pz[i]<-m){pz[i]=-m;vz[i]*=-0.4;}else if(pz[i]>m){pz[i]=m;vz[i]*=-0.4;}
    }
    // project rotating camera
    st.theta += 0.01*p.spin + 0.004;
    const ct=Math.cos(st.theta), sn=Math.sin(st.theta);
    const aspect=api.W/api.H, fov=1.8, camz=3.2;
    const pos=st.pos, col=st.col, siz=st.siz, ph=st.ph;
    const phaseCol=[0.85,0.45,0.1,0.65]; // R,G(cool),B,Y-ish from palette
    for(let i=0;i<n;i++){
      const rx=px[i]*ct + pz[i]*sn;
      const rz=-px[i]*sn + pz[i]*ct;
      const ry=py[i];
      const zc=camz+rz, persp=fov/Math.max(0.3,zc);
      pos[i*2]=(rx*persp)/Math.max(1,aspect);
      pos[i*2+1]=ry*persp;
      col[i]=phaseCol[ph[i]];
      siz[i]=Math.max(9.0, 20.0*persp);
    }
    uploadPoints(api, st, n);
    drawPoints(api, st, n, 1.0);
  },
  dispose:disposePoints
});

// =====================================================================
// 8) Jos Stam 3D Fluid — 3D Stable Fluids on a small grid, rendered as a
//    rotating projected density point cloud (NOTE: spheres approximated by
//    additive billboards; only voxels above a density threshold are drawn).
// =====================================================================
R({
  name:'Jos Stam 3D Fluid', category:'Fluid', type:'custom',
  params:[
    {key:'force',     label:'source force', min:2,  max:40,  step:.5,  value:18},
    {key:'buoyancy',  label:'buoyancy',     min:0,  max:5,   step:.05, value:1.5},
    {key:'vorticity', label:'vorticity',    min:0,  max:2,   step:.05, value:0.8},
    {key:'spin',      label:'rotate',       min:0,  max:2,   step:.01, value:0.6},
  ],
  init(api){
    const N=24; // 3D grid (N^3 cells incl. borders -> keep small for speed)
    const M=N+2, sz=M*M*M;
    const st={prog:makePointProg(api), N, M, sz,
      u:new Float32Array(sz), v:new Float32Array(sz), w:new Float32Array(sz),
      u0:new Float32Array(sz), v0:new Float32Array(sz), w0:new Float32Array(sz),
      d:new Float32Array(sz), d0:new Float32Array(sz),
      pos:new Float32Array(sz*2), col:new Float32Array(sz), siz:new Float32Array(sz),
      theta:0, frame0:true};
    Object.assign(st, makePointBuffers(api,sz));
    return st;
  },
  reset(api,st){ st.u.fill(0); st.v.fill(0); st.w.fill(0); st.d.fill(0); st.frame0=true; st.theta=0; },
  frame(api,st){
    const N=st.N, M=st.M, p=api.params;
    const IX=(i,j,k)=>i+M*j+M*M*k;
    const u=st.u,v=st.v,w=st.w,u0=st.u0,v0=st.v0,w0=st.w0,d=st.d,d0=st.d0;
    const dt=0.1;
    function lin(b,x,x0,a,c){ const ic=1/c;
      for(let it=0;it<6;it++){
        for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
          x[IX(i,j,k)]=(x0[IX(i,j,k)]+a*(x[IX(i-1,j,k)]+x[IX(i+1,j,k)]
            +x[IX(i,j-1,k)]+x[IX(i,j+1,k)]+x[IX(i,j,k-1)]+x[IX(i,j,k+1)]))*ic;
        }
      }
    }
    function advect(dn,d0a,ud,vd,wd){
      const dt0=dt*N;
      for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
        let x=i-dt0*ud[IX(i,j,k)], y=j-dt0*vd[IX(i,j,k)], z=k-dt0*wd[IX(i,j,k)];
        if(x<0.5)x=0.5; if(x>N+0.5)x=N+0.5; const i0=x|0,i1=i0+1;
        if(y<0.5)y=0.5; if(y>N+0.5)y=N+0.5; const j0=y|0,j1=j0+1;
        if(z<0.5)z=0.5; if(z>N+0.5)z=N+0.5; const k0=z|0,k1=k0+1;
        const s1=x-i0,s0=1-s1,t1=y-j0,t0=1-t1,r1=z-k0,r0=1-r1;
        dn[IX(i,j,k)]=
          r0*(s0*(t0*d0a[IX(i0,j0,k0)]+t1*d0a[IX(i0,j1,k0)])+s1*(t0*d0a[IX(i1,j0,k0)]+t1*d0a[IX(i1,j1,k0)]))
         +r1*(s0*(t0*d0a[IX(i0,j0,k1)]+t1*d0a[IX(i0,j1,k1)])+s1*(t0*d0a[IX(i1,j0,k1)]+t1*d0a[IX(i1,j1,k1)]));
      }
    }
    function project(ud,vd,wd,pp,div){
      for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
        div[IX(i,j,k)]=-0.5*(ud[IX(i+1,j,k)]-ud[IX(i-1,j,k)]
          +vd[IX(i,j+1,k)]-vd[IX(i,j-1,k)]+wd[IX(i,j,k+1)]-wd[IX(i,j,k-1)])/N;
        pp[IX(i,j,k)]=0;
      }
      lin(0,pp,div,1,6);
      for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
        ud[IX(i,j,k)]-=0.5*N*(pp[IX(i+1,j,k)]-pp[IX(i-1,j,k)]);
        vd[IX(i,j,k)]-=0.5*N*(pp[IX(i,j+1,k)]-pp[IX(i,j-1,k)]);
        wd[IX(i,j,k)]-=0.5*N*(pp[IX(i,j,k+1)]-pp[IX(i,j,k-1)]);
      }
    }
    // ---- source: single fountain at bottom centre ----
    const c=(N>>1)+1, f=p.force;
    for(let dj=0;dj<2;dj++)for(let di=-1;di<=1;di++)for(let dk=-1;dk<=1;dk++){
      const q=IX(c+di,2+dj,c+dk);
      d[q]+=20; v[q]+=f;
    }
    if(st.frame0){
      // seed a broad central plume so the first frames already have visible dye
      for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
        const dx=i-c,dy=j-N*0.45,dz=k-c;
        d[IX(i,j,k)]=14*Math.exp(-(dx*dx+dy*dy+dz*dz)/(N*2.2));
        v[IX(i,j,k)]+=2.0; // gentle upward kick everywhere
      }
      st.frame0=false;
    }
    // buoyancy: hot dye rises
    const buoy=p.buoyancy*0.05;
    for(let q=0;q<v.length;q++) v[q]+=buoy*d[q]*dt;
    // vorticity confinement (cheap): add curl-aligned swirl near fountain
    if(p.vorticity>0){
      const vc=p.vorticity*0.5;
      for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
        const cx=(w[IX(i,j+1,k)]-w[IX(i,j-1,k)])-(v[IX(i,j,k+1)]-v[IX(i,j,k-1)]);
        const cz=(v[IX(i+1,j,k)]-v[IX(i-1,j,k)])-(u[IX(i,j+1,k)]-u[IX(i,j-1,k)]);
        u[IX(i,j,k)]+=cx*vc*dt; w[IX(i,j,k)]+=cz*vc*dt;
      }
    }
    // velocity step (no diffusion for default visc=0)
    project(u,v,w,u0,v0);
    u0.set(u); v0.set(v); w0.set(w);
    advect(u,u0,u0,v0,w0); advect(v,v0,u0,v0,w0); advect(w,w0,u0,v0,w0);
    project(u,v,w,u0,v0);
    // density step
    d0.set(d);
    advect(d,d0,u,v,w);
    for(let q=0;q<d.length;q++) d[q]*=0.985; // slow fade
    // ---- render: project voxels with density above threshold ----
    st.theta += 0.01*p.spin + 0.004;
    const ct=Math.cos(st.theta), sn=Math.sin(st.theta);
    const aspect=api.W/api.H, fov=1.6, camz=3.2;
    const pos=st.pos, col=st.col, siz=st.siz;
    let cnt=0;
    for(let k=1;k<=N;k++)for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
      const dv=d[IX(i,j,k)];
      if(dv<0.15) continue;
      // map grid -> [-1,1]
      const x=(i/(N+1))*2-1, y=(j/(N+1))*2-1, z=(k/(N+1))*2-1;
      const rx=x*ct+z*sn, rz=-x*sn+z*ct, ry=y;
      const zc=camz+rz, persp=fov/Math.max(0.3,zc);
      pos[cnt*2]=(rx*persp)/Math.max(1,aspect);
      pos[cnt*2+1]=ry*persp;
      col[cnt]=Math.min(0.95, 0.25+dv*0.05);
      siz[cnt]=Math.max(7, 18*persp);
      cnt++;
      if(cnt>=st.sz) break;
    }
    uploadPoints(api, st, cnt);
    drawPoints(api, st, cnt, 0.8);
  },
  dispose:disposePoints
});

// =====================================================================
// 9) Terrain — fault+erosion fractal heightfield, rendered as a lit,
//    perspective-projected triangle mesh in Canvas2D (present2D).
//    NOTE: approximation of the full OpenGL mesh renderer.
// =====================================================================
R({
  name:'Terrain', category:'Fractals', type:'custom',
  params:[
    {key:'octaves',  label:'fault lines', min:50,  max:600, step:10, value:300},
    {key:'erosion',  label:'erosion',     min:0,   max:1,   step:.01,value:0.5},
    {key:'seed',     label:'seed',        min:1,   max:50,  step:1,  value:7},
    {key:'rotate',   label:'rotate',      min:0,   max:2,   step:.01,value:0.5},
  ],
  init(api){
    const G=64; // heightfield resolution
    const st={c:makeCanvas(api), ctx:null, G, h:new Float32Array(G*G),
      seeded:false, key:'', theta:0};
    st.ctx=st.c.getContext('2d');
    return st;
  },
  reset(api,st){ st.seeded=false; },
  generate(st, faults, erosion, seed){
    const G=st.G, h=st.h; h.fill(0);
    const rnd=mulberry32(seed*2654435761>>>0);
    // fault formation: many random planes raise/lower one side
    for(let f=0; f<faults; f++){
      const a=rnd()*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
      const off=(rnd()-0.5)*G;
      const disp=(rnd()<0.5?1:-1)*1.0;
      for(let y=0;y<G;y++)for(let x=0;x<G;x++){
        const cx=x-G/2, cy=y-G/2;
        if(cx*ca+cy*sa > off) h[y*G+x]+=disp; else h[y*G+x]-=disp*0.3;
      }
    }
    // normalise
    let mn=1e9,mx=-1e9; for(let q=0;q<h.length;q++){ if(h[q]<mn)mn=h[q]; if(h[q]>mx)mx=h[q]; }
    const inv=1/Math.max(1e-6,mx-mn);
    for(let q=0;q<h.length;q++) h[q]=(h[q]-mn)*inv;
    // thermal erosion: smooth toward neighbours (approx hydraulic erosion)
    const passes=Math.round(erosion*6);
    const tmp=new Float32Array(h.length);
    for(let pI=0;pI<passes;pI++){
      for(let y=1;y<G-1;y++)for(let x=1;x<G-1;x++){
        const q=y*G+x;
        const avg=(h[q-1]+h[q+1]+h[q-G]+h[q+G])*0.25;
        tmp[q]=h[q]*0.5+avg*0.5;
      }
      for(let y=1;y<G-1;y++)for(let x=1;x<G-1;x++) h[y*G+x]=tmp[y*G+x];
    }
  },
  frame(api,st){
    const p=api.params;
    const key=[Math.round(p.octaves), p.erosion.toFixed(2), Math.round(p.seed)].join(',');
    if(!st.seeded || key!==st.key){
      this.generate(st, Math.round(p.octaves), p.erosion, Math.round(p.seed));
      st.seeded=true; st.key=key;
    }
    st.theta += 0.005*p.rotate;
    const G=st.G, h=st.h, ctx=st.c.getContext('2d');
    // resize backing canvas if engine canvas changed
    if(st.c.width!==api.W || st.c.height!==api.H){ st.c.width=Math.max(2,api.W); st.c.height=Math.max(2,api.H); }
    const Wc=st.c.width, Hc=st.c.height;
    ctx.fillStyle='#05070d'; ctx.fillRect(0,0,Wc,Hc);
    // camera: look down at the field, rotating about y
    const ct=Math.cos(st.theta), sn=Math.sin(st.theta);
    const tiltC=Math.cos(0.95), tiltS=Math.sin(0.95);
    const camz=2.6, fov=1.5, hScale=0.55;
    function project(gx,gy){
      // map grid to [-1,1] xz plane, height -> y
      let x=(gx/(G-1))*2-1, z=(gy/(G-1))*2-1;
      const yH=h[gy*G+gx]*hScale - 0.15;
      // rotate about Y
      let rx=x*ct+z*sn, rz=-x*sn+z*ct, ry=yH;
      // tilt about X
      const ty=ry*tiltC - rz*tiltS, tz=ry*tiltS + rz*tiltC;
      const zc=camz+tz, persp=fov/Math.max(0.3,zc);
      return [ (rx*persp)*0.5*Wc + Wc*0.5, (-ty*persp)*0.5*Hc + Hc*0.5, zc ];
    }
    // draw as filled quads back-to-front (painter): iterate rows far->near.
    // For lighting use heightfield gradient (Lambert with a fixed light).
    const lx=0.5,ly=0.8,lz=0.4; const ll=1/Math.hypot(lx,ly,lz);
    const step=1;
    for(let gy=G-2; gy>=0; gy-=step){
      for(let gx=0; gx<G-1; gx+=step){
        const p00=project(gx,gy), p10=project(gx+1,gy), p11=project(gx+1,gy+1), p01=project(gx,gy+1);
        // normal from cross of two edges in height space
        const hL=h[gy*G+gx], hR=h[gy*G+gx+1], hD=h[(gy+1)*G+gx];
        let nx=(hL-hR), ny=0.15, nz=(hL-hD);
        const nl=1/Math.hypot(nx,ny,nz); nx*=nl; ny*=nl; nz*=nl;
        let diff=(nx*lx+ny*ly+nz*lz)*ll; diff=Math.max(0.15,diff);
        // colour by height: water->sand->grass->rock->snow
        const hh=h[gy*G+gx];
        const t=Math.min(1, hh);
        const col=palLUT(t);
        const r=Math.min(255, col[0]*diff*1.3+10)|0;
        const g=Math.min(255, col[1]*diff*1.3+10)|0;
        const b=Math.min(255, col[2]*diff*1.3+15)|0;
        ctx.fillStyle='rgb('+r+','+g+','+b+')';
        ctx.beginPath();
        ctx.moveTo(p00[0],p00[1]); ctx.lineTo(p10[0],p10[1]);
        ctx.lineTo(p11[0],p11[1]); ctx.lineTo(p01[0],p01[1]);
        ctx.closePath(); ctx.fill();
      }
    }
    api.present2D(st.c);
  },
  dispose(api,st){}
});

})();

<script>
/* b26.js — Reaction-Diffusion category.
   Modes: Multi-Scale Turing Patterns, Reaction-Diffusion.
   Both authored as pingpong (backbuffer feedback) with HDR float state so
   continuous chemical/scalar fields survive frame-to-frame.
   Registers into window.VOC. */
(function(){
const R = window.VOC.register;

//----------------------------------------------------------------------------
// Multi-Scale Turing Patterns  (multi-scale activator/inhibitor Turing system)
//
// A single continuous scalar field (channel R, 0..1) on a coarsened lattice.
// Each frame we sum a difference-of-Gaussians (Mexican-hat) band-pass response
// over several spatial scales -- w_i*(blur(r_i) - blur(2 r_i)) -- and step the
// field in that direction. The band-pass amplifies whichever wavelength
// dominates and suppresses the rest, so low-amplitude noise self-organises into
// the classic smooth Turing stripes/spots/labyrinth at the selected scales.
//----------------------------------------------------------------------------
R({
  name:'Multi-Scale Turing Patterns', category:'Reaction-Diffusion', type:'pingpong', hdr:true,
  params:[
    {key:'baseScale',  label:'base scale',  min:1.0, max:5.0,  step:.5,  value:2.0},
    {key:'numLayers',  label:'num layers',  min:2,   max:5,    step:1,   value:4},
    {key:'stepAmount', label:'small amount',min:.02, max:.20,  step:.005,value:.08},
    {key:'contrast',   label:'contrast',    min:.5,  max:4.0,  step:.05, value:1.6},
    {key:'pixelSize',  label:'pixel size',  min:1.0, max:5.0,  step:1.0, value:3.0},
    {key:'colorMix',   label:'color mix',   min:0.0, max:1.0,  step:.01, value:0.5}
  ],
  // Multi-scale Turing patterns on a coarsened lattice (P x P pixel cells via
  // 'pixel size' so structures are several screen pixels wide). The scalar
  // field lives in channel r, biased to 0..1 (0.5 neutral). Each frame we form
  // a difference-of-Gaussians (Mexican-hat) band-pass response by SUMMING, over
  // several scales, w_i*(blur(r_i) - blur(2 r_i)). This band-pass operator
  // amplifies whichever spatial wavelength dominates and suppresses the rest,
  // so the field grows from low-amplitude noise into smooth Turing
  // stripes/spots/labyrinths at the selected scale ladder. 'base scale' sets
  // the finest wavelength; larger layers add coarser structure on top. The
  // field is renormalised toward [0,1] each step with a tanh limiter, and a
  // gentle pull to its own large-scale blur removes residual per-cell noise.
  // Display = field grayscale ("Linear grayscale" default), palette-tinted by
  // colorMix; channel r stays the field so the feedback read is exact.
  frag:`
    uniform float baseScale, numLayers, stepAmount, contrast, pixelSize, colorMix;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    vec2 cellUV(vec2 cell){ return (cell + 0.5)*pixelSize / u_resolution; }
    float fld(vec2 cell){ return texture(u_backbuffer, cellUV(cell)).r; }

    // 13-tap box-ish blur: centre + 8-ring at r + 4-ring at r/2
    float blur(vec2 cell, float r){
      float h = r*0.5, d = r*0.7071;
      float s = fld(cell);
      s += fld(cell+vec2( r,0.))+fld(cell+vec2(-r,0.))+fld(cell+vec2(0., r))+fld(cell+vec2(0.,-r));
      s += fld(cell+vec2( d, d))+fld(cell+vec2(-d, d))+fld(cell+vec2( d,-d))+fld(cell+vec2(-d,-d));
      s += fld(cell+vec2( h,0.))+fld(cell+vec2(-h,0.))+fld(cell+vec2(0., h))+fld(cell+vec2(0.,-h));
      return s/13.0;
    }

    void main(){
      vec2 fc   = gl_FragCoord.xy;
      vec2 cell = floor(fc / pixelSize);

      if(u_frame==0){
        float n = 0.5 + (hash(cell*0.13 + 0.31)-0.5)*0.4;   // low-amp noise
        gl_FragColor = vec4(n, 0.0, 0.0, 1.0);
        return;
      }

      float here   = fld(cell);
      int   layers = int(numLayers + 0.5);

      // multi-scale Mexican-hat band-pass response (sum of DoG over scales)
      float resp   = 0.0;
      float wsum   = 0.0;
      float radius = baseScale;
      float coarse = here;                      // track the coarsest blur
      for(int i=0;i<5;i++){
        if(i>=layers) break;
        float inner = blur(cell, radius);
        float outer = blur(cell, radius*2.0);
        float w = 1.0/(float(i)+1.0);           // finer scales weighted higher
        resp += w * (inner - outer);            // +ve where activator dominates
        wsum += w;
        coarse = outer;
        radius *= 2.0;
      }
      resp /= max(wsum, 1e-3);

      // grow the dominant wavelength: step the field in the band-pass direction
      float nv = here + sign(resp) * stepAmount;
      // remove residual per-cell noise by easing toward the coarsest blur a bit
      nv = mix(nv, coarse, 0.18);
      // contrast sharpening + soft limiter keeps the field inside (0,1) and
      // crisps the structures into clean stripes/spots.
      nv = 0.5 + 0.5*tanh((nv-0.5)*2.0*contrast);

      vec3 pal = palette(clamp(nv, 0.0, 1.0));
      gl_FragColor = vec4(nv, mix(nv, pal.g, colorMix), mix(nv, pal.b, colorMix), 1.0);
    }`
});

//----------------------------------------------------------------------------
// Reaction-Diffusion  —  ALL 5 VoC models in one mode, picked via a dropdown
// (Turing, Meinhardt, Gray-Scott, Complex Ginzburg-Landau, FitzHugh-Nagumo),
// matching the original's "Model / dt / c1 / c2" dialog. Two scalar fields live
// in r,g of an HDR float ping-pong buffer; a separate `display` pass colorises
// the chosen field through the palette (so raw state is preserved for feedback).
// 9-point Laplacian on a lattice coarsened by 'pixel size'. c1,c2 are the two
// generic model coefficients (interpreted per model); defaults c1=-0.6,c2=0.1
// match the CGL dialog and give every model a sensible look out of the box.
//----------------------------------------------------------------------------
R({
  name:'Reaction-Diffusion', category:'Reaction-Diffusion', type:'pingpong', hdr:true,
  params:[
    {key:'model', label:'model', type:'select',
      options:['Turing','Meinhardt','Gray-Scott','Complex Ginzburg-Landau','FitzHugh-Nagumo'], value:2},
    {key:'dt',        label:'dt',        min:0.1, max:1.5, step:.01,  value:1.0},
    {key:'c1',        label:'c1',        min:-2.0,max:2.0, step:.01,  value:-0.6},
    {key:'c2',        label:'c2',        min:-2.0,max:2.0, step:.01,  value:0.1},
    {key:'pixelSize', label:'pixel size',min:1.0, max:8.0, step:1.0,  value:4.0}
  ],
  // ---- update pass: advance the two fields one explicit-Euler step ----------
  frag:`
    uniform float model, dt, c1, c2, pixelSize;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    vec2 cellUV(vec2 cell){ return (cell + 0.5)*pixelSize / u_resolution; }
    vec2 chem(vec2 cell){ return texture(u_backbuffer, cellUV(cell)).rg; }

    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=floor(fc/pixelSize); int M=int(model+0.5);

      if(u_frame==0){
        float h=hash(cell*0.137+1.7), h2=hash(cell*0.911+4.3); vec2 s;
        if(M==2){                                   // Gray-Scott: U=1, V blobs
          vec2 g=floor(cell/8.0); float seed=(hash(g*1.7+3.1)>0.78)?1.0:0.0;
          vec2 ctr=u_resolution*0.5/pixelSize; if(distance(cell,ctr)<6.0) seed=1.0;
          s=vec2(1.0, seed);
        } else if(M==3){ vec2 g=floor(cell/3.0); s=vec2(hash(g*1.3+2.1)*2.0-1.0, hash(g*2.7+5.9)*2.0-1.0); } // CGL coarse complex
        else if(M==4){ s=vec2((h-0.5)*1.2,(h2-0.5)*0.6); }    // FHN: random -> sustained excitable waves
        else { vec2 g=floor(cell/3.0); s=vec2(1.0+(hash(g*1.7+0.7)-0.5)*0.6, 1.0); }  // GM/Meinhardt coarse
        gl_FragColor=vec4(s,0.0,1.0); return;
      }

      vec2 c=chem(cell);
      vec2 lap=c*(-1.0);
      lap+=chem(cell+vec2( 1.,0.))*0.20; lap+=chem(cell+vec2(-1.,0.))*0.20;
      lap+=chem(cell+vec2(0., 1.))*0.20; lap+=chem(cell+vec2(0.,-1.))*0.20;
      lap+=chem(cell+vec2( 1.,1.))*0.05; lap+=chem(cell+vec2(-1.,1.))*0.05;
      lap+=chem(cell+vec2( 1.,-1.))*0.05;lap+=chem(cell+vec2(-1.,-1.))*0.05;

      float u=c.r, v=c.g, nu=u, nv=v;

      if(M==2){                                     // Gray-Scott
        float feed=0.037+0.01*(c1+0.6), kill=0.060+0.01*(c2-0.1);
        float r=u*v*v; float du=0.21*lap.r-r+feed*(1.0-u); float dv=0.105*lap.g+r-(feed+kill)*v;
        float t=clamp(dt,0.0,1.0); nu=clamp(u+t*du,0.0,1.0); nv=clamp(v+t*dv,0.0,1.0);
      } else if(M==3){                              // Complex Ginzburg-Landau
        float a=c1,b=c2,D=0.12,amp=u*u+v*v;
        float du=u+D*(lap.r-a*lap.g)-amp*(u-b*v);
        float dv=v+D*(lap.g+a*lap.r)-amp*(v+b*u);
        float t=min(dt,1.0)*0.15; nu=u+t*du; nv=v+t*dv;
        float m2=nu*nu+nv*nv; if(m2>9.0){ float s=3.0/sqrt(m2); nu*=s; nv*=s; }
      } else if(M==4){                              // FitzHugh-Nagumo
        float a0=0.0+0.1*c1, a1=0.5+0.1*c2, eps=0.02;
        float du=0.18*lap.r+u-u*u*u-v; float dv=0.09*lap.g+eps*(u-a1*v+a0);
        float t=clamp(dt,0.0,1.0)*0.4; nu=clamp(u+t*du,-2.0,2.0); nv=clamp(v+t*dv,-2.0,2.0);
      } else {                                      // Turing (GM) / Meinhardt (saturated -> stripes)
        float Da=0.09, Dh=1.0, mu=0.06+0.02*c1, nuh=0.06+0.02*c2, rho=0.06;
        float h=max(v,0.05); float sat=(M==1)?(1.0+0.25*u*u):1.0;
        float da=Da*lap.r+rho*(u*u/(h*sat))-mu*u; float dh=Dh*lap.g+rho*u*u-nuh*v;
        float t=clamp(dt,0.0,1.0)*0.12; nu=clamp(u+t*da,0.0,4.0); nv=clamp(v+t*dh,0.0,6.0);
      }
      // b channel = display-ready scalar (single source of per-model truth so the
      // display pass is model-agnostic and needs no model uniform)
      float f=(M==2)? nv*0.9+0.05 : ((M==3||M==4)? nu*0.5+0.5 : clamp(nu*0.35,0.0,1.0));
      gl_FragColor=vec4(nu, nv, clamp(f,0.0,1.0), 1.0);
    }`,
  // ---- display pass: just palette-map the b channel written by the update pass ---
  display:`
    void main(){ gl_FragColor=vec4(palette(clamp(texture(u_backbuffer, gl_FragCoord.xy/u_resolution).b,0.0,1.0)),1.0); }`
});

})();

</script>

<script>
/* b27.js — Simulations batch (pingpong)
   Modes: Biham-Middleton-Levine Traffic, Cell Conquest, Forest Fire
   Each is a grid CA simulated in a feedback (ping-pong) texture. State is packed
   into the r/g/b channels of u_backbuffer; cells are quantised to a coarse grid
   (cellSize) so the automaton reads/writes one logical cell per block of pixels.
   Seeded on u_frame==0 with a hash; coloured via palette() / explicit colours. */
(function(){
const R = window.VOC.register;

//========================================================== Biham-Middleton-Levine
// Two car species on a torus. Yellow cars (r channel) move EAST, Red cars
// (g channel) move SOUTH. They take turns: on even sim-steps all yellow cars
// advance, on odd steps all red cars advance, each moving only if the target
// cell is empty. Classic BML traffic jam / free-flow phase transition.
R({
  name:'Biham-Middleton-Levine Traffic', category:'Simulations', type:'pingpong',
  params:[ {key:'cars1Density',label:'yellow density',min:0,max:.6,step:.005,value:.31},
           {key:'cars2Density',label:'red density',  min:0,max:.6,step:.005,value:.316},
           {key:'cellSize',    label:'cell size',    min:1,max:12,step:1,   value:5} ],
  frag:`uniform float cars1Density, cars2Density, cellSize;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    // logical cell coordinate for the current fragment
    vec2 cellOf(vec2 fc){ return floor(fc/cellSize); }
    // The stored RGB IS the display colour; state is recovered from r/g so the
    // colours stay true (empty dark, yellow, red). 0=empty 0.4=yellow 0.8=red.
    float stateOf(vec2 cell){
      vec2 px=(cell+0.5)*cellSize;
      vec3 c=texture(u_backbuffer, px/u_resolution).rgb;
      if(c.r<0.3) return 0.0;          // empty (dark)
      if(c.g>0.5) return 0.4;          // yellow (high g)
      return 0.8;                      // red (high r, low g)
    }
    vec4 pack(float st){
      if(st>0.6) return vec4(0.95,0.16,0.12,1.0);  // red
      if(st>0.2) return vec4(1.0,0.85,0.1,1.0);    // yellow
      return vec4(0.02,0.02,0.04,1.0);             // empty
    }
    void main(){
      vec2 cell=cellOf(gl_FragCoord.xy);
      vec2 grid=floor(u_resolution/cellSize);
      if(u_frame==0){
        float st=0.0;
        if(hash(cell+0.123)<cars1Density) st=0.4;            // yellow
        else if(hash(cell+7.7)<cars2Density) st=0.8;         // red
        gl_FragColor=pack(st);
        return;
      }
      bool yellowPhase = (mod(float(u_frame),2.0) < 0.5);
      float me=stateOf(cell);
      bool meEmpty = me<0.2, meYellow = (me>0.2&&me<0.6), meRed = me>0.6;
      float outSt=me;
      if(yellowPhase){
        vec2 west=vec2(mod(cell.x-1.0+grid.x,grid.x), cell.y);
        vec2 east=vec2(mod(cell.x+1.0,grid.x), cell.y);
        float w=stateOf(west), e=stateOf(east);
        bool wYellow=(w>0.2&&w<0.6);
        bool eEmpty=(e<0.2);
        // empty cell receives a yellow car from the west if that car can move (I'm its target & empty)
        if(meEmpty && wYellow){ outSt=0.4; }
        // yellow car leaves if the east cell is empty
        else if(meYellow && eEmpty){ outSt=0.0; }
      } else {
        vec2 north=vec2(cell.x, mod(cell.y+1.0,grid.y));      // +y up
        vec2 south=vec2(cell.x, mod(cell.y-1.0+grid.y,grid.y));
        float n=stateOf(north), s=stateOf(south);
        bool nRed=(n>0.6);
        bool sEmpty=(s<0.2);
        // red cars travel toward decreasing y: empty cell receives from north
        if(meEmpty && nRed){ outSt=0.8; }
        else if(meRed && sEmpty){ outSt=0.0; }
      }
      gl_FragColor=pack(outSt);
    }`
});

//========================================================== Cell Conquest
// Up to 4 competing factions (1..4) plus empty. Each faction has a distinct
// solid colour stored directly in RGB; the faction id is recovered each step by
// nearest-colour matching (so the displayed texture IS the state — no separate
// pass needed). Rules per step (Moore neighbourhood, toroidal):
//   empty cell  -> claimed by its dominant neighbour faction if that faction has
//                  >= requiredNeighbours and a spread% roll passes.
//   owned cell  -> conquered by a dominant DIFFERENT faction (>=3 neighbours)
//                  when an attack% roll passes; else may die back to empty with a
//                  small probability scaled by 1/lifespan (older rule -> churn).
R({
  name:'Cell Conquest', category:'Simulations', type:'pingpong',
  params:[ {key:'factions',   label:'factions',     min:2,max:4,  step:1,  value:4},
           {key:'spread',     label:'spread %',     min:5,max:100,step:1,  value:55},
           {key:'attack',     label:'attack %',     min:0,max:100,step:1,  value:45},
           {key:'lifespan',   label:'lifespan',     min:20,max:400,step:1, value:160},
           {key:'cellSize',   label:'cell size',    min:1,max:12, step:1,  value:5} ],
  frag:`uniform float factions, spread, attack, lifespan, cellSize;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float hash3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
    vec2 cellOf(vec2 fc){ return floor(fc/cellSize); }
    vec3 factionColor(float id){
      if(id<0.5) return vec3(0.02,0.02,0.03);   // empty
      if(id<1.5) return vec3(0.92,0.20,0.18);   // 1 red
      if(id<2.5) return vec3(0.22,0.78,0.32);   // 2 green
      if(id<3.5) return vec3(0.26,0.46,0.96);   // 3 blue
      return vec3(0.92,0.62,0.14);              // 4 orange
    }
    // recover faction id (0..4) from a stored colour by nearest match
    float idAt(vec2 cell){
      vec2 px=(cell+0.5)*cellSize;
      vec3 c=texture(u_backbuffer, px/u_resolution).rgb;
      float best=1e9, bid=0.0;
      for(int k=0;k<5;k++){
        float d=distance(c, factionColor(float(k)));
        if(d<best){ best=d; bid=float(k); }
      }
      return bid;
    }
    void main(){
      vec2 cell=cellOf(gl_FragCoord.xy);
      vec2 grid=floor(u_resolution/cellSize);
      if(u_frame==0){
        float id=0.0;
        vec2 c=cell/grid;
        if(length(c-vec2(0.10,0.10))<0.07) id=1.0;
        else if(length(c-vec2(0.90,0.10))<0.07) id=min(2.0,factions);
        else if(length(c-vec2(0.10,0.90))<0.07) id=min(3.0,factions);
        else if(length(c-vec2(0.90,0.90))<0.07) id=min(4.0,factions);
        else if(hash(cell+3.3)<0.02) id=floor(hash(cell+9.1)*factions)+1.0;
        if(id>factions) id=factions;
        gl_FragColor=vec4(factionColor(id),1.0);
        return;
      }
      float myId=idAt(cell);
      float cnt[5];
      for(int k=0;k<5;k++) cnt[k]=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0) continue;
        vec2 nc=vec2(mod(cell.x+float(dx)+grid.x,grid.x), mod(cell.y+float(dy)+grid.y,grid.y));
        int idx=int(idAt(nc));
        cnt[idx]+=1.0;
      }
      float domId=0.0, domCnt=0.0;
      for(int k=1;k<5;k++){ if(float(k)<=factions && cnt[k]>domCnt){ domCnt=cnt[k]; domId=float(k); } }
      float outId=myId;
      float rnd=hash3(vec3(cell, float(u_frame)));
      if(myId<0.5){
        if(domCnt>=2.0 && rnd < spread/100.0){ outId=domId; }
      } else {
        if(domId>0.5 && domId!=myId && domCnt>=3.0 && rnd < (attack/100.0)*(domCnt/8.0)){
          outId=domId;                    // conquered
        } else if(rnd > 1.0-(1.0/lifespan)){
          outId=0.0;                      // natural death (rate ~ 1/lifespan)
        }
      }
      if(outId>factions) outId=0.0;
      gl_FragColor=vec4(factionColor(outId),1.0);
    }`
});

//========================================================== Forest Fire
// Drossel-Schwabl forest fire. 3 states: empty(0), tree(1), burning(2).
//   tree -> burning  if any neighbour burning
//   burning -> empty
//   empty -> tree    with regrowth probability
// Seeded as a forest of given density; fire ignited along the left edge.
R({
  name:'Forest Fire', category:'Simulations', type:'pingpong',
  params:[ {key:'treeDensity',   label:'tree density %',min:10,max:95,step:1,  value:61},
           {key:'regrowthChance',label:'regrowth %',    min:0, max:20,step:.1, value:0.5},
           {key:'cellSize',      label:'cell size',     min:1, max:12,step:1,  value:5} ],
  frag:`uniform float treeDensity, regrowthChance, cellSize;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float hash3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
    vec2 cellOf(vec2 fc){ return floor(fc/cellSize); }
    // The stored RGB IS the display colour; state recovered from r/g so colours
    // stay true. 0.0 = empty (dark), 0.5 = tree (green), 1.0 = burning (orange).
    float stateOf(vec2 cell){
      vec2 px=(cell+0.5)*cellSize;
      vec3 c=texture(u_backbuffer, px/u_resolution).rgb;
      if(c.r>0.6) return 1.0;          // burning (bright red)
      if(c.g>0.3) return 0.5;          // tree (green)
      return 0.0;                      // empty
    }
    void main(){
      vec2 cell=cellOf(gl_FragCoord.xy);
      vec2 grid=floor(u_resolution/cellSize);
      if(u_frame==0){
        float tree=(hash(cell+0.5)<treeDensity/100.0)?0.5:0.0;
        // ignite left edge cells that are trees
        if(cell.x<1.5 && tree>0.25) tree=1.0;
        gl_FragColor= tree>0.75 ? vec4(1.0,0.55,0.05,1.0) : (tree>0.25 ? vec4(0.10,0.55,0.15,1.0) : vec4(0.02,0.04,0.02,1.0));
        return;
      }
      float me=stateOf(cell);
      float rnd=hash3(vec3(cell,float(u_frame)));
      float out_;
      if(me>0.75){
        out_=0.0; // burning -> empty
      } else if(me>0.25){
        // tree: catches if any neighbour burning (Moore, toroidal)
        float burning=0.0;
        for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
          if(dx==0&&dy==0) continue;
          vec2 nc=vec2(mod(cell.x+float(dx)+grid.x,grid.x), mod(cell.y+float(dy)+grid.y,grid.y));
          if(stateOf(nc)>0.75) burning+=1.0;
        }
        // small chance of spontaneous lightning so a static forest still ignites
        out_ = (burning>0.5 || rnd<0.0002) ? 1.0 : 0.5;
      } else {
        // empty: regrow with probability
        out_ = (rnd < regrowthChance/100.0) ? 0.5 : 0.0;
      }
      if(out_>0.75) gl_FragColor=vec4(1.0,0.55,0.05,1.0);      // burning orange
      else if(out_>0.25) gl_FragColor=vec4(0.10,0.55,0.15,1.0); // tree green
      else gl_FragColor=vec4(0.02,0.04,0.02,1.0);               // empty dark
    }`
});

})();

</script>

<script>
/* b28.js — Video Feedback family (pingpong).
   Classic video-feedback: each frame resamples the previous frame through an
   affine / warp transform, plus a continuously-injected moving source so the
   image keeps regenerating instead of decaying to black or saturating to white.
   Registers into window.VOC. */
(function(){
const R = window.VOC.register;
const CAT = 'Video Feedback';

//----------------------------------------------------------------- Video Feedback
// Classic affine feedback: zoom + rotation + offset on the prior frame, hue
// rotation of the fed-back color, and an animated injected source shape.
R({
  name:'Video Feedback', category:CAT, type:'pingpong',
  params:[ {key:'zoom',label:'zoom',min:0.90,max:1.10,step:0.001,value:1.012},
           {key:'rotation',label:'rotation',min:-0.20,max:0.20,step:0.001,value:0.035},
           {key:'offsetX',label:'offset x',min:-0.05,max:0.05,step:0.001,value:0.0},
           {key:'offsetY',label:'offset y',min:-0.05,max:0.05,step:0.001,value:0.004},
           {key:'colorRotate',label:'color rotate',min:0.0,max:0.20,step:0.001,value:0.03},
           {key:'decay',label:'decay',min:0.80,max:1.00,step:0.001,value:0.965} ],
  frag:`uniform float zoom,rotation,offsetX,offsetY,colorRotate,decay;
    vec3 hueRot(vec3 c, float a){
      // rotate hue around the RGB grey axis
      const mat3 toY = mat3(0.299,0.587,0.114, -0.14713,-0.28886,0.436, 0.615,-0.51499,-0.10001);
      const mat3 toR = mat3(1.0,0.0,1.13983, 1.0,-0.39465,-0.58060, 1.0,2.03211,0.0);
      vec3 yuv = toY*c; float s=sin(a),co=cos(a);
      yuv.yz = mat2(co,-s,s,co)*yuv.yz;
      return toR*yuv;
    }
    void main(){
      vec2 res=u_resolution; vec2 fc=gl_FragCoord.xy;
      vec2 uv=fc/res; vec2 p=uv-0.5; p.x*=res.x/res.y;
      // moving injected source: a soft colored blob orbiting the centre,
      // plus a steady glow at the centre so the trail always has fuel.
      float t=u_time;
      vec2 src=vec2(cos(t*0.7),sin(t*0.9))*0.28;
      float d=length(p-src);
      vec3 inject=palette(fract(t*0.07+0.15))*smoothstep(0.18,0.0,d);
      inject+=palette(fract(t*0.05+0.5))*smoothstep(0.12,0.0,length(p))*0.8;
      if(u_frame==0){ gl_FragColor=vec4(inject,1.0); return; }
      // affine sample of previous frame about the centre
      float s=sin(rotation), c=cos(rotation);
      mat2 rot=mat2(c,-s,s,c);
      vec2 q=rot*(p/zoom)+vec2(offsetX,offsetY);
      q.x/=res.x/res.y; vec2 suv=q+0.5;
      vec3 prev=texture(u_backbuffer,suv).rgb;
      prev=hueRot(prev,colorRotate)*decay;
      vec3 col=max(prev,inject);
      gl_FragColor=vec4(col,1.0);
    }`
});

//----------------------------------------------------------------- Video Feedback 2
// Droste-style swirl feedback: radial zoom + angular swirl warp of the prior
// frame, plus a small box-blur smear and a pulsing ring source.
R({
  name:'Video Feedback 2', category:CAT, type:'pingpong',
  params:[ {key:'zoom',label:'zoom',min:0.92,max:1.08,step:0.001,value:1.02},
           {key:'swirl',label:'swirl',min:-2.0,max:2.0,step:0.01,value:0.9},
           {key:'blur',label:'blur',min:0.0,max:3.0,step:0.05,value:1.2},
           {key:'colorRotate',label:'color rotate',min:0.0,max:0.25,step:0.001,value:0.05},
           {key:'decay',label:'decay',min:0.85,max:1.00,step:0.001,value:0.97} ],
  frag:`uniform float zoom,swirl,blur,colorRotate,decay;
    vec3 hueRot(vec3 c, float a){
      const mat3 toY = mat3(0.299,0.587,0.114, -0.14713,-0.28886,0.436, 0.615,-0.51499,-0.10001);
      const mat3 toR = mat3(1.0,0.0,1.13983, 1.0,-0.39465,-0.58060, 1.0,2.03211,0.0);
      vec3 yuv=toY*c; float s=sin(a),co=cos(a); yuv.yz=mat2(co,-s,s,co)*yuv.yz; return toR*yuv;
    }
    vec3 sampleBlur(vec2 uv, float r){
      vec2 px=r/u_resolution;
      vec3 s=texture(u_backbuffer,uv).rgb*0.4;
      s+=texture(u_backbuffer,uv+vec2(px.x,0)).rgb*0.15;
      s+=texture(u_backbuffer,uv-vec2(px.x,0)).rgb*0.15;
      s+=texture(u_backbuffer,uv+vec2(0,px.y)).rgb*0.15;
      s+=texture(u_backbuffer,uv-vec2(0,px.y)).rgb*0.15;
      return s;
    }
    void main(){
      vec2 res=u_resolution; vec2 fc=gl_FragCoord.xy;
      vec2 uv=fc/res; vec2 p=uv-0.5; p.x*=res.x/res.y;
      float t=u_time;
      float r=length(p), ang=atan(p.y,p.x);
      // pulsing ring + spoke source so structure keeps feeding in
      float ring=smoothstep(0.02,0.0,abs(r-(0.22+0.06*sin(t*1.3))));
      float spokes=0.5+0.5*sin(ang*6.0+t*2.0);
      vec3 inject=palette(fract(ang/6.2831+t*0.05))*ring*spokes;
      if(u_frame==0){ gl_FragColor=vec4(inject,1.0); return; }
      // swirl: rotate more the closer to centre, and zoom radially
      float a=swirl*(0.35-r);
      float s=sin(a), c=cos(a); mat2 rot=mat2(c,-s,s,c);
      vec2 q=rot*(p/zoom);
      q.x/=res.x/res.y; vec2 suv=q+0.5;
      vec3 prev=sampleBlur(suv,blur);
      prev=hueRot(prev,colorRotate)*decay;
      vec3 col=max(prev,inject);
      gl_FragColor=vec4(col,1.0);
    }`
});

//----------------------------------------------------------------- Video Feedback 3
// Kaleidoscopic feedback: prior frame is mirrored into N angular slices then
// zoomed, with per-channel chromatic offset (RGB sampled at slightly different
// scales) for a psychedelic split-color trail.
R({
  name:'Video Feedback 3', category:CAT, type:'pingpong',
  params:[ {key:'zoom',label:'zoom',min:0.93,max:1.07,step:0.001,value:1.018},
           {key:'slices',label:'mirror slices',min:2,max:12,step:1,value:6},
           {key:'chroma',label:'chromatic',min:0.0,max:0.06,step:0.001,value:0.02},
           {key:'rotation',label:'rotation',min:-0.15,max:0.15,step:0.001,value:0.02},
           {key:'decay',label:'decay',min:0.85,max:1.00,step:0.001,value:0.968} ],
  frag:`uniform float zoom,slices,chroma,rotation,decay;
    // sample previous frame about centre with a per-channel scale (chromatic)
    vec3 chromaSample(vec2 p, float scale, float chr){
      vec2 res=u_resolution; float asp=res.x/res.y;
      vec3 o;
      vec2 pr=p/(scale*(1.0+chr)); pr.x/=asp; o.r=texture(u_backbuffer,pr+0.5).r;
      vec2 pg=p/ scale;            pg.x/=asp; o.g=texture(u_backbuffer,pg+0.5).g;
      vec2 pb=p/(scale*(1.0-chr)); pb.x/=asp; o.b=texture(u_backbuffer,pb+0.5).b;
      return o;
    }
    void main(){
      vec2 res=u_resolution; vec2 fc=gl_FragCoord.xy;
      vec2 uv=fc/res; vec2 p=uv-0.5; p.x*=res.x/res.y;
      float t=u_time;
      // injected source: rotating bright bar through the centre
      float bar=smoothstep(0.05,0.0,abs(p.y*cos(t*0.8)-p.x*sin(t*0.8)));
      bar*=smoothstep(0.34,0.0,length(p));
      vec3 inject=palette(fract(0.5+0.5*sin(t*0.6)))*bar;
      if(u_frame==0){ gl_FragColor=vec4(inject,1.0); return; }
      // kaleidoscope fold of the sampling coordinate
      float r=length(p); float ang=atan(p.y,p.x)+rotation;
      float seg=6.2831853/max(slices,2.0);
      ang=mod(ang,seg); ang=abs(ang-seg*0.5);
      vec2 kp=vec2(cos(ang),sin(ang))*r;
      vec3 prev=chromaSample(kp,zoom,chroma)*decay;
      vec3 col=max(prev,inject);
      gl_FragColor=vec4(col,1.0);
    }`
});

})();

</script>
