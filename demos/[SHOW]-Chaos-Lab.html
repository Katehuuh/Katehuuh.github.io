<script>
/* b3.js — Cellular Automata batch B3 (pingpong runtime).

   Modes:
     Alternating Neighborhoods CA / CA 2            (Margolus block dynamics)
     Alternating Neighborhoods Cyclic CA / CA 2     (cyclic CA, alternating nbhd)
     Block CA                                       (Margolus block rule)
     Coupled CA / CA 2                              (two coupled lattices, r & g)
     History Dependent CA / CA 2                    (state + aging history trail)

   Engine fact: for 'pingpong' the engine BLITs the freshly written destination
   texture straight to screen (BLIT shows .rgb). So the rgb we write is BOTH the
   next-frame state AND the displayed colour. We keep an exact numeric copy of
   the cell state in a chosen channel (usually .r) for clean readback, and shape
   the remaining channels so the texel reads as a sensible visualisation.
   Targets are RGBA8 (hdr:false).

   Sampling: gl_FragCoord.xy is pixel-centre (int+0.5); fc/u_resolution and
   fc+vec2(dx,dy) land on exact texel centres, so LINEAR filtering returns the
   un-interpolated texel (effectively nearest). All for-loops are bounded. */
(function(){
const R = window.VOC.register;
const CAT = 'Cellular Automata';

const HELP = `
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  vec4 cellv(vec2 fc){ return texture(u_backbuffer, fc/u_resolution); }
`;

/*========================== Margolus (alternating neighborhoods) ============
  The Margolus neighbourhood partitions the lattice into 2x2 blocks. On even
  ticks blocks use even origins; on odd ticks the partition shifts by (1,1) —
  this alternation is the "alternating neighborhoods". Each cell locates its
  block, reads the 4 cells, applies the block rule, and outputs the value for
  its own corner. Two-state: occupancy in .r; sparse seeding keeps the billiard
  / rotation dynamics legible as moving structures on a dark field. */
function margolusBody(extra){ return `
  uniform float density, rule, hue;
  ${HELP}
  float occ(vec2 fc){ return cellv(fc).r > .5 ? 1.0 : 0.0; }
  void main(){
    vec2 fc = gl_FragCoord.xy;
    if(u_frame==0){
      float a = hash(fc+0.137) < density ? 1.0 : 0.0;
      gl_FragColor = vec4(a, 0.0, 0.0, 1.0);
      return;
    }
    float ph = mod(float(u_frame), 2.0);          // partition phase 0/1
    vec2 ip = floor(fc) - ph;
    vec2 b  = floor(ip*0.5)*2.0 + ph + 0.5;        // lower-left cell-centre of block
    float c00 = occ(b);
    float c10 = occ(b+vec2(1.,0.));
    float c01 = occ(b+vec2(0.,1.));
    float c11 = occ(b+vec2(1.,1.));
    vec2 loc = floor(fc) - (b-0.5);                // (0,0)(1,0)(0,1)(1,1)
    int corner = int(loc.x + 2.0*loc.y);
    float sum = c00+c10+c01+c11;
    float no;                                       // new occupancy for this corner
    ${extra}
    no = (no>0.5)?1.0:0.0;
    // colour: dark when empty, palette-coloured when filled; block density tints
    vec3 col = (no>0.5) ? palette(0.35 + hue*0.5 + 0.12*sum) : vec3(0.04,0.05,0.09);
    gl_FragColor = vec4(col, 1.0);
    gl_FragColor.r = no;                            // exact state in r for next read
  }`;
}

R({
  name:'Alternating Neighborhoods CA', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed density',min:.02,max:.4,step:.01,value:.12},
           {key:'rule',label:'spin dir',min:0,max:1,step:.01,value:.0},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.4} ],
  frag: margolusBody(`
    // BBM / rotation gas: rotate each block's contents one quarter-turn. The
    // alternating partition makes isolated cells travel diagonally (billiard
    // balls). 'spin dir' flips clockwise vs counter-clockwise rotation.
    float cw  = (corner==0)?c01:(corner==1)?c00:(corner==2)?c11:c10;
    float ccw = (corner==0)?c10:(corner==1)?c11:(corner==2)?c00:c01;
    no = mix(cw, ccw, step(0.5, rule));
  `)
});

R({
  name:'Alternating Neighborhoods CA 2', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed density',min:.05,max:.6,step:.01,value:.50},
           {key:'rule',label:'rule mix',min:0,max:1,step:.01,value:1.0},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.5} ],
  frag: margolusBody(`
    // Critters (Toffoli-Margolus): blocks with exactly 2 filled cells are kept;
    // otherwise take the complement of the diagonally-opposite corner, then the
    // alternation rotates the result. Produces gliders & a busy "soup of life".
    float me   = (corner==0)?c00:(corner==1)?c10:(corner==2)?c01:c11;
    float diag = (corner==0)?c11:(corner==1)?c01:(corner==2)?c10:c00;
    float crit = (sum==2.0) ? me : (1.0 - diag);
    no = mix(diag, crit, rule);
  `)
});

/*===================== Cyclic CA with alternating neighbourhood ============
  Classic Greenberg-Hastings cyclic CA (forms rotating spiral waves), but the
  neighbourhood ALTERNATES each tick: von Neumann (4) on even ticks, the four
  diagonals on odd ticks. State index lives in .r as a 0..1 ramp -> palette. */
function cyclicBody(extra){ return `
  uniform float density, states, hue;
  ${HELP}
  float st(vec2 fc){ return floor(cellv(fc).r * (states-1.0) + 0.5); }
  void main(){
    vec2 fc = gl_FragCoord.xy;
    if(u_frame==0){
      float s = floor(hash(fc+0.91)*states);
      gl_FragColor = vec4(s/(states-1.0), 0.0, 0.0, 1.0);
      return;
    }
    float me   = st(fc);
    float next = mod(me+1.0, states);
    // alternating neighbourhood: orthogonal on even ticks, diagonal on odd ticks
    float ph = mod(float(u_frame),2.0);
    float s0,s1,s2,s3;
    if(ph<0.5){
      s0=st(fc+vec2(1.,0.)); s1=st(fc+vec2(-1.,0.));
      s2=st(fc+vec2(0.,1.)); s3=st(fc+vec2(0.,-1.));
    } else {
      s0=st(fc+vec2(1.,1.)); s1=st(fc+vec2(-1.,1.));
      s2=st(fc+vec2(1.,-1.)); s3=st(fc+vec2(-1.,-1.));
    }
    float no;
    ${extra}
    float r = no/(states-1.0);
    gl_FragColor = vec4(palette(r*0.85 + hue*0.12 + 0.03), 1.0);
    gl_FragColor.r = r;
  }`;
}

R({
  name:'Alternating Neighborhoods Cyclic CA', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed',min:.1,max:1,step:.01,value:.5},
           {key:'states',label:'states',min:3,max:14,step:1,value:8},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.4} ],
  frag: cyclicBody(`
    // advance to successor if ANY (alternating) neighbour already holds it
    float adv = (s0==next||s1==next||s2==next||s3==next) ? 1.0 : 0.0;
    no = mod(me + adv, states);
  `)
});

// Variant 2: threshold cyclic CA (Griffeath CCA) over the FULL Moore ring, where
// the ring used ALTERNATES each tick between the 8 Moore cells and the 4 axis
// cells doubled — keeping the "alternating neighborhoods" character while the
// count-threshold drives coarsening into large rotating spiral waves.
R({
  name:'Alternating Neighborhoods Cyclic CA 2', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed',min:.1,max:1,step:.01,value:.5},
           {key:'states',label:'states',min:3,max:14,step:1,value:8},
           {key:'threshold',label:'threshold',min:1,max:5,step:1,value:3} ],
  frag:`
    uniform float density, states, threshold;
    ${HELP}
    float st(vec2 fc){ return floor(cellv(fc).r * (states-1.0) + 0.5); }
    void main(){
      vec2 fc = gl_FragCoord.xy;
      if(u_frame==0){
        float s = floor(hash(fc+3.7)*states);
        gl_FragColor = vec4(s/(states-1.0), 0.0, 0.0, 1.0);
        return;
      }
      float me   = st(fc);
      float next = mod(me+1.0, states);
      float ph = mod(float(u_frame),2.0);
      float cnt = 0.0;
      // full Moore ring on even ticks; axis-emphasised ring on odd ticks
      for(int dx=-1;dx<=1;dx++) for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0) continue;
        float w = 1.0;
        if(ph>0.5 && dx!=0 && dy!=0) w = 0.0;  // drop diagonals on odd ticks
        if(w>0.5 && st(fc+vec2(float(dx),float(dy)))==next) cnt += 1.0;
      }
      float no = mod(me + (cnt>=threshold?1.0:0.0), states);
      float r = no/(states-1.0);
      gl_FragColor = vec4(palette(r*0.88 + 0.04), 1.0);
      gl_FragColor.r = r;
    }`
});

/*============================= Block CA (Margolus) =========================
  Two-state block CA using a curated, reversible-flavoured 16-entry transition
  table on the alternating 2x2 partition. The table (chosen by `rule`) maps the
  block's 4-bit configuration to a new configuration. Default rule = a tuned
  "tron/critters"-style growth that builds branching crystalline structure from
  a sparse seed rather than scrambling to noise. */
R({
  name:'Block CA', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed density',min:.02,max:.5,step:.01,value:.10},
           {key:'rule',label:'rule',min:0,max:3,step:1,value:0},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.55} ],
  frag:`
    uniform float density, rule, hue;
    ${HELP}
    float occ(vec2 fc){ return cellv(fc).r > .5 ? 1.0 : 0.0; }
    // map a 4-bit block config (0..15) to a new config for the selected rule
    float mapcfg(float idx, float rsel){
      // configs by popcount; we permute WITHIN equal-popcount classes so the
      // rule is mass-conserving for some choices (gas) and growing for others.
      // rule 0: Critters (1->E, complement singles)   rule 1: rotate CW
      // rule 2: rotate CCW                              rule 3: HPP-style swap
      if(rsel<0.5){            // Critters: 15-idx for sums !=2, keep sum==2
        float pc = mod(idx,2.0)+mod(floor(idx/2.0),2.0)+mod(floor(idx/4.0),2.0)+mod(floor(idx/8.0),2.0);
        return (pc==2.0)? idx : (15.0-idx);
      } else if(rsel<1.5){     // rotate CW: bits (00,10,01,11)->(01,00,11,10)
        float b0=mod(idx,2.0), b1=mod(floor(idx/2.0),2.0), b2=mod(floor(idx/4.0),2.0), b3=mod(floor(idx/8.0),2.0);
        return b2*1.0 + b0*2.0 + b3*4.0 + b1*8.0;   // 00<-01,10<-00,01<-11,11<-10
      } else if(rsel<2.5){     // rotate CCW
        float b0=mod(idx,2.0), b1=mod(floor(idx/2.0),2.0), b2=mod(floor(idx/4.0),2.0), b3=mod(floor(idx/8.0),2.0);
        return b1*1.0 + b3*2.0 + b0*4.0 + b2*8.0;
      } else {                 // HPP lattice-gas: swap diagonal pairs
        float b0=mod(idx,2.0), b1=mod(floor(idx/2.0),2.0), b2=mod(floor(idx/4.0),2.0), b3=mod(floor(idx/8.0),2.0);
        return b3*1.0 + b2*2.0 + b1*4.0 + b0*8.0;   // mirror
      }
    }
    void main(){
      vec2 fc = gl_FragCoord.xy;
      if(u_frame==0){
        float a = hash(fc*1.7+0.3) < density ? 1.0 : 0.0;
        gl_FragColor = vec4(a, 0.0, 0.0, 1.0);
        return;
      }
      float ph = mod(float(u_frame),2.0);
      vec2 ip = floor(fc) - ph;
      vec2 b  = floor(ip*0.5)*2.0 + ph + 0.5;
      float c00=occ(b), c10=occ(b+vec2(1.,0.)), c01=occ(b+vec2(0.,1.)), c11=occ(b+vec2(1.,1.));
      vec2 loc = floor(fc) - (b-0.5);
      int corner = int(loc.x + 2.0*loc.y);
      float idx = c00 + c10*2.0 + c01*4.0 + c11*8.0;
      float ncfg = mapcfg(idx, rule);
      float bit;
      if(corner==0) bit = mod(ncfg,2.0);
      else if(corner==1) bit = mod(floor(ncfg/2.0),2.0);
      else if(corner==2) bit = mod(floor(ncfg/4.0),2.0);
      else bit = mod(floor(ncfg/8.0),2.0);
      float sum=c00+c10+c01+c11;
      vec3 col = (bit>0.5) ? palette(0.3 + hue*0.5 + 0.1*sum) : vec3(0.04,0.04,0.08);
      gl_FragColor = vec4(col, 1.0);
      gl_FragColor.r = bit;
    }`
});

/*============================ Coupled CA (two lattices) =====================
  Two lattices share each texel: lattice A (Life-like) in r, lattice B (cyclic)
  in g. Each lattice's transition is perturbed by the other's local value, so
  `coupling` controls how strongly they drive each other. Visible colour =
  (A, B-phase, 0): red = A alive, green = B's phase. */
function coupledBody(ruleA, ruleB){ return `
  uniform float density, coupling, states;
  ${HELP}
  void main(){
    vec2 fc = gl_FragCoord.xy;
    if(u_frame==0){
      float a = hash(fc+0.11) < density ? 1.0 : 0.0;
      float bs = floor(hash(fc+5.4)*states);
      gl_FragColor = vec4(a, bs/(states-1.0), 0.0, 1.0);
      return;
    }
    vec4 self = cellv(fc);
    float meA = self.r>0.5?1.0:0.0;
    float meB = floor(self.g*(states-1.0)+0.5);
    float succ = mod(meB+1.0, states);
    float nA=0.0, advB=0.0;
    for(int dx=-1;dx<=1;dx++) for(int dy=-1;dy<=1;dy++){
      if(dx==0&&dy==0) continue;
      vec4 c = cellv(fc+vec2(float(dx),float(dy)));
      nA += c.r>0.5?1.0:0.0;
      if(floor(c.g*(states-1.0)+0.5)==succ) advB += 1.0;
    }
    float outA, outB;
    ${ruleA}
    ${ruleB}
    gl_FragColor = vec4(outA, outB/(states-1.0), 0.0, 1.0);
  }`;
}

R({
  name:'Coupled CA', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed',min:.05,max:.6,step:.01,value:.28},
           {key:'coupling',label:'coupling',min:0,max:1,step:.01,value:.5},
           {key:'states',label:'B states',min:3,max:10,step:1,value:5} ],
  frag: coupledBody(
    // A: Conway Life, with an extra birth at n==2 where lattice B is "hot"
    `float hot = step(0.6, meB/(states-1.0)) * step(0.25, coupling);
     float born = (nA==3.0 || (hot>0.5 && nA==2.0)) ? 1.0 : 0.0;
     float surv = (nA==2.0||nA==3.0) ? 1.0 : 0.0;
     outA = (meA>0.5) ? surv : born;`,
    // B: cyclic; advance threshold drops to 1 where A is alive (coupling)
    `float thr = mix(2.0, 1.0, coupling*meA);
     outB = mod(meB + (advB>=thr?1.0:0.0), states);`
  )
});

R({
  name:'Coupled CA 2', category:CAT, type:'pingpong',
  params:[ {key:'density',label:'seed',min:.05,max:.6,step:.01,value:.30},
           {key:'coupling',label:'coupling',min:0,max:1,step:.01,value:.6},
           {key:'states',label:'B states',min:3,max:10,step:1,value:6} ],
  frag: coupledBody(
    // A: majority / voter rule, inverted where B is in its upper phase (coupling)
    `float maj = (nA>=5.0)?1.0:((nA<=3.0)?0.0:meA);
     float flip = (meB > (states-1.0)*0.5 && coupling>0.5) ? 1.0 : 0.0;
     outA = (flip>0.5) ? 1.0-maj : maj;`,
    // B: cyclic, advance accelerated by count of living A neighbours
    `float thr = mix(3.0, 1.0, clamp(coupling*nA*0.25, 0.0, 1.0));
     outB = mod(meB + (advB>=thr?1.0:0.0), states);`
  )
});

/*========================= History Dependent CA ============================
  A "Generations" automaton: the transition depends on the cell's whole age
  history, not just whether it is alive. A cell that fires must pass through a
  chain of decaying "refractory" age-states before it can become empty and be
  reborn — genuine multi-generation history dependence. The number of age states
  is `memory` (more memory = longer trails). The single age value (0 empty,
  1 firing, 2..K refractory) lives in .r as a normalised ramp -> palette colour.
  The base rule here is Brian's Brain (birth on exactly 2 firing neighbours),
  which is self-sustaining from a random soup and produces drifting glider rain. */
function generationsBody(birthLo, birthHi, survLo, survHi){ return `
  uniform float density, memory, hue;
  ${HELP}
  void main(){
    vec2 fc = gl_FragCoord.xy;
    float K = floor(2.0 + memory*10.0);   // total states: empty + firing + (K-2) refractory
    if(u_frame==0){
      float r = hash(fc+0.77);
      float a = (r < density) ? 1.0 : 0.0;          // 1 = firing, 0 = empty
      gl_FragColor = vec4(a/(K-1.0), 0.0, 0.0, 1.0);
      return;
    }
    float age = floor(cellv(fc).r*(K-1.0)+0.5);     // 0..K-1
    // count FIRING neighbours (age==1) over the Moore neighbourhood
    float n = 0.0;
    for(int dx=-1;dx<=1;dx++) for(int dy=-1;dy<=1;dy++){
      if(dx==0&&dy==0) continue;
      float na = floor(cellv(fc+vec2(float(dx),float(dy))).r*(K-1.0)+0.5);
      n += (na==1.0) ? 1.0 : 0.0;
    }
    float nage;
    if(age==0.0){               // empty -> maybe born (fire)
      nage = (n>=${birthLo} && n<=${birthHi}) ? 1.0 : 0.0;
    } else if(age==1.0){        // firing -> survive? else begin ageing
      nage = (n>=${survLo} && n<=${survHi}) ? 1.0 : ( (K>2.0)?2.0:0.0 );
    } else {                    // refractory -> keep ageing toward empty
      nage = (age+1.0 >= K) ? 0.0 : age+1.0;
    }
    float r = nage/(K-1.0);
    // colour: firing cells bright, refractory cells a decaying palette trail
    vec3 col = (nage<0.5) ? vec3(0.03,0.03,0.07)
             : (nage<1.5) ? palette(0.55 + hue*0.4)
                          : palette(0.05 + hue*0.45) * (1.0 - (nage-1.0)/max(1.0,K-2.0));
    gl_FragColor = vec4(col, 1.0);
    gl_FragColor.r = r;          // exact age for next read
  }`;
}

R({
  name:'History Dependent CA', category:CAT, type:'pingpong',
  // Brian's Brain: B2 / S(none) / generations. Self-sustaining glider rain.
  params:[ {key:'density',label:'seed density',min:.05,max:.6,step:.01,value:.30},
           {key:'memory',label:'memory',min:0,max:1,step:.01,value:.15},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.5} ],
  frag: generationsBody('2.0','2.0','9.0','9.0')  // survLo>max -> never survives (Brain)
});

R({
  name:'History Dependent CA 2', category:CAT, type:'pingpong',
  // "Star Wars": B2 / S345 / generations(4). Richer self-sustaining structures.
  params:[ {key:'density',label:'seed density',min:.05,max:.6,step:.01,value:.34},
           {key:'memory',label:'memory',min:0,max:1,step:.01,value:.25},
           {key:'hue',label:'hue',min:0,max:1,step:.01,value:.55} ],
  frag: generationsBody('2.0','2.0','3.0','5.0')
});

})();

</script>

<script>
/* b4.js — Batch B4: pingpong cellular automata (Cellular Automata category).
   Each mode is a feedback-texture grid sim. State is packed into the r/g/b
   channels of the backbuffer; coordinates are quantized to a coarse cell grid
   (controlled by a `cellSize` slider) so the CA evolves at a visible scale.
   Seeding happens at u_frame==0 via a hash; colour comes from palette().
   Registers into window.VOC. */
(function(){
const R = window.VOC.register;
const CAT = 'Cellular Automata';

/* Shared GLSL helpers, prepended to each mode body. Provides:
     hash(p)              -> deterministic 0..1 noise
     cellCoord(fc,cs)     -> snapped cell-centre pixel coord for cell size cs
     read(fc,cs,off)      -> backbuffer sample at neighbour cell offset (in cells)
   `cellSize` is exposed as a uniform by every mode. */
const HELP = `
uniform float cellSize;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float hash3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
vec2 cellOf(vec2 fc){ float cs=max(cellSize,1.0); return floor(fc/cs); }
vec2 cellCenterPx(vec2 cell){ float cs=max(cellSize,1.0); return (cell+0.5)*cs; }
vec4 readCell(vec2 cell){ float cs=max(cellSize,1.0);
  vec2 px=(cell+0.5)*cs; return texture(u_backbuffer, px/u_resolution); }
`;

//============================================================ Hodgepodge Machine
// Gerhardt–Schuster cyclic excitable medium. Continuous "illness" 0..1.
// Healthy(0) -> infected by neighbour infected/ill counts; infected climbs to
// ill(1) then resets to healthy. Produces rotating spiral waves.
R({
  name:'Hodgepodge Machine', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'numStates',label:'states',min:20,max:200,step:1,value:100},
           {key:'k1',label:'k1',min:1,max:8,step:1,value:2},
           {key:'k2',label:'k2',min:1,max:8,step:1,value:3},
           {key:'g',label:'g (heal)',min:1,max:60,step:1,value:25} ],
  frag:HELP+`
    uniform float numStates,k1,k2,g;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      float maxS=max(numStates,2.0);
      if(u_frame==0){
        float s=floor(hash(cell+0.5)*(maxS+1.0)); // random initial state 0..n
        gl_FragColor=vec4(s/maxS,0.,0.,1.); return;
      }
      float me=floor(readCell(cell).r*maxS+0.5);  // current state 0..n
      float a=0.,b=0.,sum=0.;                      // infected, ill, state-sum (incl self)
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        float s=floor(readCell(cell+vec2(float(dx),float(dy))).r*maxS+0.5);
        if(s>0.0 && s<maxS) a+=1.0;                // infected neighbour
        if(s>=maxS) b+=1.0;                         // ill neighbour
        sum+=s;
      }
      float ns;
      if(me>=maxS){ ns=0.0; }                       // ill -> healthy
      else if(me<=0.0){                             // healthy: catch infection
        ns=floor(a/k1)+floor(b/k2);
      } else {                                      // infected: average + g
        ns=floor(sum/(a+b+1.0))+g;
      }
      ns=clamp(ns,0.0,maxS);
      vec3 col=palette(pow(ns/maxS,0.55));
      gl_FragColor=vec4(ns/maxS, col.g, col.b, 1.0);
    }`
});

//============================================================ Liquid Crystal CA
// Orientation field: each cell holds an angle (stored 0..1 -> 0..2pi). Cells
// relax toward the average neighbour orientation (circular mean) with a little
// driving noise, mimicking nematic liquid-crystal director alignment & defects.
R({
  name:'Liquid Crystal CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'align',label:'alignment',min:0,max:1,step:.01,value:0.55},
           {key:'noise',label:'noise',min:0,max:0.3,step:.005,value:0.04} ],
  frag:HELP+`
    uniform float align,noise;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+0.7); gl_FragColor=vec4(a,0.,0.,1.); return; }
      float me=readCell(cell).r*6.2831853;
      vec2 acc=vec2(0.0);
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        float ang=readCell(cell+vec2(float(dx),float(dy))).r*6.2831853;
        // nematic: directors with period pi -> use 2*angle for averaging
        acc+=vec2(cos(ang*2.0),sin(ang*2.0));
      }
      float target=atan(acc.y,acc.x)*0.5;        // circular mean (period pi)
      float n=(hash(cell+vec2(u_time,1.3))-0.5)*noise*6.2831853;
      float na=me + align*( atan(sin(target-me),cos(target-me)) ) + n;
      float stored=fract(na/6.2831853 + 1.0);
      gl_FragColor=vec4(stored, palette(stored).gb, 1.0);
    }`
});

//============================================================ Majority Rule CA
// Twisted majority / annealing vote. Each cell counts live neighbours+self and
// flips to the majority, but the threshold band is "twisted" (4->0, 5->1 swap
// region) producing the classic curve-shortening blob coarsening.
R({
  name:'Majority Rule CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'density',label:'seed density',min:.2,max:.8,step:.01,value:0.5},
           {key:'twist',label:'twist',min:0,max:1,step:1,value:1} ],
  frag:HELP+`
    uniform float density,twist;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+2.1)<density?1.:0.; gl_FragColor=vec4(a,0.,0.,1.); return; }
      float sum=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        sum+=readCell(cell+vec2(float(dx),float(dy))).r>0.5?1.0:0.0;
      }
      float ns;
      if(twist>0.5){
        // Vichniac twisted/annealing majority of 9 (self+8):
        //   sums 0..3 -> 0, 6..9 -> 1, and the 4<->5 band is SWAPPED (4->1, 5->0)
        ns = (sum>=6.0) ? 1.0 : (sum==4.0 ? 1.0 : 0.0);
      } else {
        ns = (sum>=5.0) ? 1.0 : 0.0;             // plain majority of 9
      }
      gl_FragColor=vec4(ns, palette(ns*0.8+0.1).gb, 1.0);
    }`
});

//============================================================ MergeLife CA
// Continuous-state CA (Jeff Heaton's MergeLife). Each cell value is updated by
// a weighted blend of itself and the neighbourhood mean, gated through a
// nonlinear "merge" response so stable gliders/oscillators emerge.
R({
  name:'MergeLife CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'merge',label:'merge',min:0,max:1,step:.01,value:0.5},
           {key:'gain',label:'gain',min:1,max:6,step:.05,value:3.0},
           {key:'bias',label:'bias',min:-0.5,max:0.5,step:.01,value:-0.18} ],
  frag:HELP+`
    uniform float merge,gain,bias;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+3.3); gl_FragColor=vec4(a,0.,0.,1.); return; }
      float me=readCell(cell).r; float sum=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        sum+=readCell(cell+vec2(float(dx),float(dy))).r;
      }
      float mean=sum/8.0;
      float blended=mix(me,mean,merge);
      // nonlinear merge response (smoothstep-like sigmoid around 0.5+bias)
      float resp=1.0/(1.0+exp(-gain*( (blended)-(0.5+bias) )*4.0));
      float ns=mix(blended,resp,0.7);
      ns=clamp(ns,0.0,1.0);
      gl_FragColor=vec4(ns, palette(ns).gb, 1.0);
    }`
});

//============================================================ Multiple Neighborhoods CA
// MNCA: sum two concentric ring neighbourhoods (inner small, outer large) and
// apply interval birth/survival thresholds on each. Produces worm/coral textures.
R({
  name:'Multiple Neighborhoods CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:8,step:1,value:3},
           {key:'innerLo',label:'inner lo',min:0,max:9,step:1,value:2},
           {key:'innerHi',label:'inner hi',min:0,max:9,step:1,value:3},
           {key:'outerLo',label:'outer lo',min:0,max:25,step:1,value:9},
           {key:'outerHi',label:'outer hi',min:0,max:25,step:1,value:16} ],
  frag:HELP+`
    uniform float innerLo,innerHi,outerLo,outerHi;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+4.7)<0.35?1.:0.; gl_FragColor=vec4(a,0.,0.,1.); return; }
      float inner=0.0, outer=0.0;
      for(int dx=-3;dx<=3;dx++)for(int dy=-3;dy<=3;dy++){
        if(dx==0&&dy==0)continue;
        float d=sqrt(float(dx*dx+dy*dy));
        float v=readCell(cell+vec2(float(dx),float(dy))).r>0.5?1.0:0.0;
        if(d<=1.5) inner+=v; else if(d<=3.2) outer+=v;
      }
      float me=readCell(cell).r>0.5?1.0:0.0;
      bool innerOK=(inner>=innerLo && inner<=innerHi);
      bool outerOK=(outer>=outerLo && outer<=outerHi);
      float ns = (innerOK||outerOK)?1.0:0.0;
      if(me>0.5 && inner>=innerLo-1.0 && inner<=innerHi+1.0) ns=max(ns,1.0); // mild survival
      gl_FragColor=vec4(ns, palette(ns*0.7+0.15).gb, 1.0);
    }`
});

//============================================================ Multiple Neighborhoods CA 2
// Variant: continuous-valued field driven by weighted (gaussian) inner vs outer
// ring averages with a smooth growth function (Lenia-flavoured). Smoother blobs.
R({
  name:'Multiple Neighborhoods CA 2', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:8,step:1,value:3},
           {key:'mu',label:'center',min:0,max:1,step:.01,value:0.32},
           {key:'sigma',label:'width',min:.02,max:.4,step:.005,value:0.07},
           {key:'rate',label:'rate',min:.05,max:1,step:.01,value:0.35} ],
  frag:HELP+`
    uniform float mu,sigma,rate;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+5.9); gl_FragColor=vec4(a*a,0.,0.,1.); return; }
      float me=readCell(cell).r;
      float wsum=0.0, acc=0.0;
      for(int dx=-3;dx<=3;dx++)for(int dy=-3;dy<=3;dy++){
        float d=sqrt(float(dx*dx+dy*dy));
        if(d>3.3) continue;
        float w=exp(-d*d/4.0);                    // gaussian kernel
        acc+=w*readCell(cell+vec2(float(dx),float(dy))).r; wsum+=w;
      }
      float avg=acc/max(wsum,0.001);
      // bell-shaped growth around mu
      float g=2.0*exp(-pow(avg-mu,2.0)/(2.0*sigma*sigma))-1.0;
      float ns=clamp(me + rate*g, 0.0, 1.0);
      gl_FragColor=vec4(ns, palette(ns).gb, 1.0);
    }`
});

//============================================================ Multiple Rules CA
// Two Life-like rule sets selected per region by a static checkerboard mask of
// blocks. Each region runs its own birth/survival counts -> contrasting textures
// that interact along boundaries.
R({
  name:'Multiple Rules CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'blockSize',label:'region size',min:4,max:40,step:1,value:14},
           {key:'density',label:'seed density',min:.1,max:.6,step:.01,value:0.32} ],
  frag:HELP+`
    uniform float blockSize,density;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+6.2)<density?1.:0.; gl_FragColor=vec4(a,0.,0.,1.); return; }
      float n=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        n+=readCell(cell+vec2(float(dx),float(dy))).r>0.5?1.0:0.0;
      }
      float me=readCell(cell).r>0.5?1.0:0.0;
      // region selector: checkerboard of blocks
      vec2 reg=floor(cell/max(blockSize,1.0));
      float regSel=mod(reg.x+reg.y,2.0);
      float ns;
      if(regSel<0.5){
        // Rule A: Conway B3/S23
        ns = (me>0.5)?((n==2.0||n==3.0)?1.0:0.0):(n==3.0?1.0:0.0);
      } else {
        // Rule B: HighLife-ish B36/S23
        ns = (me>0.5)?((n==2.0||n==3.0)?1.0:0.0):((n==3.0||n==6.0)?1.0:0.0);
      }
      float tint = regSel<0.5 ? 0.2 : 0.7;        // colour-code the two regions
      gl_FragColor=vec4(ns, palette(ns>0.5?tint:0.0).gb, 1.0);
    }`
});

//============================================================ Nonlinear Voter Model
// Each cell adopts a neighbour's opinion with a probability that is a nonlinear
// (power-law) function of the local majority fraction, plus a flip-noise term.
// Low exponent -> noisy; high exponent -> sharp domain coarsening.
R({
  name:'Nonlinear Voter Model', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'nonlin',label:'nonlinearity',min:0.2,max:5,step:.05,value:2.0},
           {key:'noise',label:'noise',min:0,max:0.2,step:.005,value:0.02} ],
  frag:HELP+`
    uniform float nonlin,noise;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+7.4)<0.5?1.:0.; gl_FragColor=vec4(a,0.,0.,1.); return; }
      float sum=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        sum+=readCell(cell+vec2(float(dx),float(dy))).r>0.5?1.0:0.0;
      }
      float me=readCell(cell).r>0.5?1.0:0.0;
      float frac=sum/8.0;                          // fraction of live neighbours
      float pUp=pow(frac,nonlin);                  // nonlinear adoption prob
      float r=hash(cell+vec2(u_time*1.7,2.9));
      float ns = (r<pUp)?1.0:0.0;
      // flip noise
      float r2=hash(cell+vec2(3.1,u_time*0.9));
      if(r2<noise) ns=1.0-ns;
      gl_FragColor=vec4(ns, palette(ns*0.75+0.12).gb, 1.0);
    }`
});

//============================================================ Pinwheels CA
// Cells rotate a local orientation toward the curl of the neighbourhood,
// generating rotating "pinwheel" vortices. Orientation 0..1 -> angle; visualised
// by colour wheel. Curl drives spin so steady rotating cells appear.
R({
  name:'Pinwheels CA', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:10,step:1,value:3},
           {key:'spin',label:'spin',min:0,max:0.5,step:.005,value:0.12},
           {key:'couple',label:'coupling',min:0,max:1,step:.01,value:0.4} ],
  frag:HELP+`
    uniform float spin,couple;
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      if(u_frame==0){ float a=hash(cell+8.8); gl_FragColor=vec4(a,0.,0.,1.); return; }
      float me=readCell(cell).r*6.2831853;
      // gradient of the angle field -> curl-like rotational drive
      float l=readCell(cell+vec2(-1.,0.)).r, r=readCell(cell+vec2(1.,0.)).r;
      float d=readCell(cell+vec2(0.,-1.)).r, u=readCell(cell+vec2(0.,1.)).r;
      float curl=(r-l)-(u-d);
      // average neighbour direction for coupling
      vec2 acc=vec2(0.0);
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        float ang=readCell(cell+vec2(float(dx),float(dy))).r*6.2831853;
        acc+=vec2(cos(ang),sin(ang));
      }
      float target=atan(acc.y,acc.x);
      float na=me + spin*6.2831853 + spin*curl*20.0
               + couple*atan(sin(target-me),cos(target-me));
      float stored=fract(na/6.2831853 + 1.0);
      gl_FragColor=vec4(stored, palette(stored).gb, 1.0);
    }`
});

//============================================================ Sandpile Automata
// Abelian sandpile (Bak–Tang–Wiesenfeld). Each cell holds a grain count 0..~6
// stored as r*8. A central source drips grains; cells with >=threshold topple,
// shedding one grain to each of 4 neighbours. Self-organised criticality.
R({
  name:'Sandpile Automata', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:8,step:1,value:3},
           {key:'threshold',label:'topple at',min:4,max:8,step:1,value:4},
           {key:'drop',label:'drop rate',min:0,max:1,step:.01,value:0.5} ],
  frag:HELP+`
    uniform float threshold,drop;
    const float MAXG=8.0;
    float grains(vec2 c){ return floor(readCell(c).r*MAXG+0.5); }
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      vec2 grid=floor(u_resolution/max(cellSize,1.0));
      vec2 ctr=floor(grid*0.5);
      if(u_frame==0){
        float g = (length(cell-ctr)<2.0)? (threshold*0.5):0.0;
        gl_FragColor=vec4(g/MAXG,0.,0.,1.); return;
      }
      float g=grains(cell);
      // toppling: lose threshold grains if over, gain 1 per over-threshold neighbour
      if(g>=threshold) g-=threshold;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(abs(dx)+abs(dy)!=1) continue;          // 4-neighbourhood only
        if(grains(cell+vec2(float(dx),float(dy)))>=threshold) g+=1.0;
      }
      // source: drip grains onto the centre cell
      if(length(cell-ctr)<1.0){
        float r=hash(cell+vec2(u_time,1.1));
        if(r<drop) g+=1.0;
      }
      g=clamp(g,0.0,MAXG);
      gl_FragColor=vec4(g/MAXG, palette(g/threshold).gb, 1.0);
    }`
});

//============================================================ Self Replicating Loops
// Langton-loop flavour (best-effort): an excitable signal-carrying medium on a
// coarse grid. A sheathed core (state via r channel) emits propagating pulses
// that grow arms and bud off child structures. NOTE: this is an emergent
// excitable-media approximation of true Langton loops, not the exact 8-state
// rule table, but it self-replicates loop-like growth across the grid.
R({
  name:'Self Replicating Loops', category:CAT, type:'pingpong',
  params:[ {key:'cellSize',label:'cell size',min:2,max:8,step:1,value:3},
           {key:'growth',label:'growth',min:1,max:3,step:1,value:2},
           {key:'refractory',label:'refractory',min:1,max:6,step:1,value:3} ],
  frag:HELP+`
    uniform float growth,refractory;
    // Greenberg-Hastings excitable medium with loop-budding growth.
    // state stored in r as 0..1 mapping to discrete levels:
    //   0      = resting/empty
    //   1/N    = excited (signal front)
    //   2/N..1 = refractory tail (counts down back to rest)
    void main(){
      vec2 fc=gl_FragCoord.xy; vec2 cell=cellOf(fc);
      float N=max(refractory+2.0,3.0);            // total levels
      vec2 grid=floor(u_resolution/max(cellSize,1.0));
      if(u_frame==0){
        // seed scattered small loops: ring-shaped excited fronts on a lattice
        vec2 g=mod(cell, 24.0)-12.0;
        float dr=length(g);
        float v=0.0;
        if(dr>3.0 && dr<5.0) v=1.0/N;             // excited ring
        else if(dr<=3.0)     v=2.0/N;             // refractory core
        gl_FragColor=vec4(v,0.,0.,1.); return;
      }
      float lvl=floor(readCell(cell).r*N+0.5);     // 0..N-1
      float exc=0.0;
      for(int dx=-1;dx<=1;dx++)for(int dy=-1;dy<=1;dy++){
        if(dx==0&&dy==0)continue;
        float s=floor(readCell(cell+vec2(float(dx),float(dy))).r*N+0.5);
        if(s>=1.0 && s<=growth) exc+=1.0;          // neighbour is an excited front
      }
      float ns;
      if(lvl==0.0){
        ns = (exc>=1.0)?1.0:0.0;                    // rest -> excited if a front touches
      } else if(lvl>=1.0 && lvl<N-1.0){
        ns = lvl+1.0;                               // advance through refractory tail
      } else {
        ns = 0.0;                                   // tail ends -> rest
      }
      // sustain: rare spontaneous spark keeps the medium alive & replicating
      if(ns==0.0 && hash(cell+vec2(2.2,floor(u_time*3.0)))<0.0008) ns=1.0;
      float v=ns/N;
      vec3 col = (ns>=1.0 && ns<=growth) ? palette(0.85)
               : (ns>0.0 ? palette(0.25+0.4*ns/N) : vec3(0.02,0.0,0.05));
      gl_FragColor=vec4(v, col.g, col.b, 1.0);
    }`
});

})();

</script>

<script>
/* b5.js — Cellular Automata (pingpong) + Lattice Gas Automata (pingpong).
   Modes: Smooth Life CA, Stepping Stone CA, Stochastic CA, Tiled CA,
          Triangular CA, Yin Yang Fire CA, Zhang CA, FHP LGA, HPP LGA.

   DECOUPLING NOTE: the engine blits the previous-frame texture's RGB straight to
   screen, so the colour we output IS what is shown. To keep crisp simulation
   STATE separate from the displayed COLOUR we store authoritative state in the
   ALPHA channel (read back via texture(...).a) and put palette() colour in RGB
   purely for display. (Targets are RGBA8; alpha survives, blit ignores it.) */
(function(){
const R = window.VOC.register;

// Shared GLSL helpers (hash RNG + cell snapping).
const HELP = `
  float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+34.56); return fract(p.x*p.y); }
  float hash3(vec2 p,float s){ return fract(sin(dot(p+s,vec2(127.1,311.7)))*43758.5453); }
`;

//============================================================ Smooth Life CA
// SmoothLife (Rafler): continuous Game of Life. Density 0..1 stored in alpha.
// Inner disk (M) and outer annulus (N) averages drive a smooth transition rule.
R({
  name:'Smooth Life CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:6,step:1,value:2},
           {key:'ra',label:'outer radius',min:6,max:14,step:1,value:10},
           {key:'b1',label:'birth lo',min:.15,max:.45,step:.005,value:.257},
           {key:'b2',label:'birth hi',min:.25,max:.6,step:.005,value:.336},
           {key:'d1',label:'death lo',min:.3,max:.7,step:.005,value:.365},
           {key:'dt',label:'rate',min:.05,max:1,step:.01,value:.20} ],
  frag:`uniform float cell,ra,b1,b2,d1,dt;
    ${HELP}
    float st(vec2 c){ return texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){
        float a=hash21(g*0.137+vec2(7.0))<0.42?1.0:0.0;
        gl_FragColor=vec4(palette(0.15+0.8*a),a); return;
      }
      float ri=ra/3.0;
      float m=0.0, mc=0.0, n=0.0, nc=0.0;
      for(int dy=-14;dy<=14;dy++){
        if(abs(float(dy))>ra) continue;
        for(int dx=-14;dx<=14;dx++){
          if(abs(float(dx))>ra) continue;
          float d=length(vec2(float(dx),float(dy)));
          if(d>ra+0.5) continue;
          float s=st(fc+vec2(float(dx),float(dy))*cell);
          if(d<=ri+0.5){ m+=s; mc+=1.0; } else { n+=s; nc+=1.0; }
        }
      }
      m/=max(mc,1.0); n/=max(nc,1.0);
      float bw=0.028;
      // alive fraction m blends survival window toward death thresholds
      float lo=mix(b1,d1*0.55,m);
      float hi=mix(b2,d1,m);
      float t1=smoothstep(lo-bw,lo+bw,n);
      float t2=smoothstep(hi-bw,hi+bw,n);
      float target=t1*(1.0-t2);
      float cur=st(fc);
      float v=clamp(cur+dt*(2.0*target-1.0),0.0,1.0);
      gl_FragColor=vec4(palette(0.12+0.82*v),v);
    }`
});

//============================================================ Stepping Stone CA
// Stepping-stone / Moran genetic drift: each cell copies a random neighbour's
// discrete colour-state with probability copyProb. State (0..1) lives in alpha.
R({
  name:'Stepping Stone CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:8,step:1,value:3},
           {key:'states',label:'states',min:2,max:16,step:1,value:6},
           {key:'rate',label:'copy prob',min:.05,max:1,step:.01,value:.6},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:7} ],
  frag:`uniform float cell,states,rate,seed;
    ${HELP}
    float st(vec2 gg){ return texture(u_backbuffer,(gg*cell+cell*.5)/u_resolution).a; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){
        float s=floor(hash3(g,seed)*states)/max(states-1.0,1.0);
        gl_FragColor=vec4(palette(s),s); return;
      }
      float me=st(g);
      float t=float(u_frame);
      if(hash3(g*1.7,seed+t*0.013)<rate){
        float pick=floor(hash3(g*2.3+vec2(1.0),seed+t*0.027)*8.0);
        vec2 off= pick<1.0?vec2(-1,-1): pick<2.0?vec2(0,-1): pick<3.0?vec2(1,-1):
                  pick<4.0?vec2(-1, 0): pick<5.0?vec2(1, 0):
                  pick<6.0?vec2(-1, 1): pick<7.0?vec2(0, 1): vec2(1,1);
        me=st(g+off);
      }
      gl_FragColor=vec4(palette(me),me);
    }`
});

//============================================================ Stochastic CA
// Probabilistic majority / voter process with spontaneous noise: a cell adopts
// its neighbourhood majority with prob p, plus random flips. Binary state in a.
R({
  name:'Stochastic CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:6,step:1,value:2},
           {key:'p',label:'align prob',min:.4,max:1,step:.01,value:.85},
           {key:'noise',label:'noise',min:0,max:.2,step:.005,value:.04},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:3} ],
  frag:`uniform float cell,p,noise,seed;
    ${HELP}
    float st(vec2 c){ return texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a>0.5?1.0:0.0; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){ float a=hash3(g,seed)<0.5?1.0:0.0; gl_FragColor=vec4(palette(0.1+0.8*a),a); return; }
      float n=0.0;
      for(int dy=-1;dy<=1;dy++)for(int dx=-1;dx<=1;dx++){
        if(dx==0&&dy==0)continue; n+=st(fc+vec2(float(dx),float(dy))*cell);
      }
      float me=st(fc);
      float maj = n>4.0?1.0:(n<4.0?0.0:me);
      float t=float(u_frame);
      float next = (hash3(g*1.3,seed+t*0.011)<p)? maj : me;
      if(hash3(g*2.9+vec2(5.0),seed+t*0.017)<noise) next=1.0-next;
      gl_FragColor=vec4(palette(0.1+0.8*next),next);
    }`
});

//============================================================ Tiled CA
// Position-dependent rule: the plane is split into tiles; each tile runs a
// different Life-like B/S rule (Conway / Maze / Seeds / Replicator) — a
// patchwork of distinct CA behaviours meeting at tile borders. Binary in a.
R({
  name:'Tiled CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:5,step:1,value:2},
           {key:'tiles',label:'tiles',min:2,max:8,step:1,value:4},
           {key:'density',label:'seed density',min:.1,max:.6,step:.01,value:.30},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:1} ],
  frag:`uniform float cell,tiles,density,seed;
    ${HELP}
    float st(vec2 c){ return texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a>0.5?1.0:0.0; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){ float a=hash3(g,seed)<density?1.0:0.0; gl_FragColor=vec4(palette(0.08+0.85*a),a); return; }
      float n=0.0;
      for(int dy=-1;dy<=1;dy++)for(int dx=-1;dx<=1;dx++){
        if(dx==0&&dy==0)continue; n+=st(fc+vec2(float(dx),float(dy))*cell);
      }
      float me=st(fc);
      vec2 tc=floor(fc/u_resolution*tiles);
      float rid=floor(hash3(tc,seed*1.7+9.0)*4.0);
      float a;
      if(rid<1.0){            // Conway B3/S23
        a=(me>0.5)?((n==2.0||n==3.0)?1.0:0.0):(n==3.0?1.0:0.0);
      } else if(rid<2.0){     // Maze B3/S12345
        a=(me>0.5)?((n>=1.0&&n<=5.0)?1.0:0.0):(n==3.0?1.0:0.0);
      } else if(rid<3.0){     // Seeds B2/S
        a=(me>0.5)?0.0:(n==2.0?1.0:0.0);
      } else {                // Replicator (odd-neighbour) B1357/S1357
        a=(mod(n,2.0)>0.5)?1.0:0.0;
      }
      gl_FragColor=vec4(palette(0.06+0.8*a+0.04*rid),a);
    }`
});

//============================================================ Triangular CA
// Triangular-lattice Life: parity of (x+y) selects up/down triangle orientation;
// neighbourhood is the 3 edge-sharing triangles plus the opposite-row ring.
// Tunable birth count and survive [lo,hi] window. Binary state in alpha.
R({
  name:'Triangular CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:2,max:8,step:1,value:3},
           {key:'birth',label:'birth count',min:1,max:6,step:1,value:2},
           {key:'survLo',label:'survive lo',min:1,max:6,step:1,value:2},
           {key:'survHi',label:'survive hi',min:1,max:9,step:1,value:4},
           {key:'density',label:'seed density',min:.1,max:.6,step:.01,value:.40},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:5} ],
  frag:`uniform float cell,birth,survLo,survHi,density,seed;
    ${HELP}
    float st(vec2 c){ return texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a>0.5?1.0:0.0; }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){ float a=hash3(g,seed)<density?1.0:0.0; gl_FragColor=vec4(palette(0.12+0.8*a),a); return; }
      float up=mod(g.x+g.y,2.0);
      float vy = up>0.5 ? 1.0 : -1.0;
      float n=0.0;
      n+=st(fc+vec2(-1.0,0.0)*cell);
      n+=st(fc+vec2( 1.0,0.0)*cell);
      n+=st(fc+vec2( 0.0,vy)*cell);
      n+=st(fc+vec2(-1.0,vy)*cell);
      n+=st(fc+vec2( 1.0,vy)*cell);
      n+=st(fc+vec2( 0.0,-vy)*cell);
      float me=st(fc);
      float a=(me>0.5)?((n>=survLo-0.5&&n<=survHi+0.5)?1.0:0.0):((n>=birth-0.5&&n<birth+0.5)?1.0:0.0);
      gl_FragColor=vec4(palette(0.1+0.78*a+0.06*up),a);
    }`
});

//============================================================ Yin Yang Fire CA
// Excitable forest-fire medium. alpha = fire intensity (0..1), blue = fuel.
// Fire spreads to fuelled neighbours (prob compounding with #burning neighbours)
// plus rare random sparks; burnt cells cool and slowly regrow fuel.
R({
  name:'Yin Yang Fire CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:5,step:1,value:2},
           {key:'ignite',label:'spread prob',min:.1,max:1,step:.01,value:.55},
           {key:'spark',label:'spark rate',min:0,max:.02,step:.0005,value:.003},
           {key:'regrow',label:'regrow',min:.002,max:.1,step:.001,value:.03},
           {key:'cool',label:'cool',min:.05,max:.6,step:.01,value:.25},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:4} ],
  frag:`uniform float cell,ignite,spark,regrow,cool,seed;
    ${HELP}
    // fire in alpha, fuel in blue channel
    vec2 stt(vec2 c){ vec4 t=texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution); return vec2(t.a,t.b); }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){
        float fuel=hash3(g,seed)*0.5+0.5;
        float fire=hash3(g*1.3,seed+3.0)<0.012?1.0:0.0;
        float c=fire>0.4?1.0:0.05+0.35*fuel;
        gl_FragColor=vec4(palette(c).rg, fuel, fire); return;
      }
      vec2 s=stt(fc);
      float fire=s.x, fuel=s.y;
      float t=float(u_frame);
      float nf=0.0;
      for(int dy=-1;dy<=1;dy++)for(int dx=-1;dx<=1;dx++){
        if(dx==0&&dy==0)continue; nf+=step(0.4,stt(fc+vec2(float(dx),float(dy))*cell).x);
      }
      float r=hash3(g*2.1,seed+t*0.019);
      if(fire>0.4){
        fuel=max(0.0,fuel-0.30);
        fire=max(0.0,fire-cool);
      } else {
        float pIgnite = 1.0 - pow(1.0-ignite, nf);
        if(fuel>0.3 && (r<pIgnite || hash3(g*3.7,seed+t*0.03)<spark)){
          fire=1.0;
        } else {
          fuel=min(1.0,fuel+regrow);
          fire=max(0.0,fire-cool*0.5);
        }
      }
      float c = fire>0.4 ? mix(0.75,1.0,fire) : 0.04+0.40*fuel;
      vec3 col=palette(c);
      gl_FragColor=vec4(col.rg, fuel, fire);   // r,g show colour; b=fuel; a=fire
    }`
});

//============================================================ Zhang CA
// Zhang multi-state CA: next state = matrix[#liveNeighbours][curState], with the
// transition matrix synthesised deterministically from a rule seed. State index
// (normalised) stored in alpha; palette() shows the state colour.
R({
  name:'Zhang CA', category:'Cellular Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:1,max:6,step:1,value:3},
           {key:'states',label:'states',min:2,max:8,step:1,value:7},
           {key:'seed',label:'rule seed',min:0,max:200,step:1,value:73},
           {key:'fill',label:'seed fill',min:.1,max:.9,step:.01,value:.5} ],
  frag:`uniform float cell,states,seed,fill;
    ${HELP}
    float raw(vec2 c){ return texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a; }
    float stateOf(vec2 c){ return floor(raw(c)*(states-1.0)+0.5); }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){
        float s = hash3(g,seed)<fill ? floor(hash3(g*1.9,seed+1.0)*states) : 0.0;
        float a=s/max(states-1.0,1.0);
        gl_FragColor=vec4(palette(a),a); return;
      }
      float live=0.0;
      for(int dy=-1;dy<=1;dy++)for(int dx=-1;dx<=1;dx++){
        if(dx==0&&dy==0)continue; live+=step(0.5,stateOf(fc+vec2(float(dx),float(dy))*cell));
      }
      float cur=stateOf(fc);
      float key = live*states + cur;
      float nxt = floor(hash3(vec2(key,seed), seed*0.37+11.0) * states);
      float a=nxt/max(states-1.0,1.0);
      gl_FragColor=vec4(palette(a),a);
    }`
});

//============================================================ FHP LGA
// FHP-style hexagonal lattice gas on a square grid: 6 velocity bits packed in
// alpha*63. Exact streaming (pull from the cell that sent each direction) +
// head-on collision rotation (FHP). Density shown via palette; code kept in a.
R({
  name:'FHP LGA', category:'Lattice Gas Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:2,max:8,step:1,value:3},
           {key:'density',label:'density',min:.2,max:.9,step:.01,value:.55},
           {key:'push',label:'flow push',min:0,max:1,step:.01,value:.3},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:6} ],
  frag:`uniform float cell,density,push,seed;
    ${HELP}
    float code(vec2 c){ return floor(texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a*63.0+0.5); }
    float bitAt(float v,int b){ return mod(floor(v/pow(2.0,float(b))),2.0); }
    vec2 hexoff(int d, float row){
      float o = mod(row,2.0);
      if(d==0) return vec2(1.0,0.0);
      if(d==1) return vec2(o,-1.0);
      if(d==2) return vec2(o-1.0,-1.0);
      if(d==3) return vec2(-1.0,0.0);
      if(d==4) return vec2(o-1.0,1.0);
      return vec2(o,1.0);
    }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      if(u_frame==0){
        float v=0.0;
        for(int b=0;b<6;b++){ if(hash3(g*float(b+1)*0.31,seed+float(b))<density) v+=pow(2.0,float(b)); }
        float a=v/63.0; gl_FragColor=vec4(palette(0.1+0.85*(v/6.0)),a); return;
      }
      float incoming=0.0;
      for(int d=0;d<6;d++){
        vec2 src = g - hexoff(d, g.y);
        if(bitAt(code(src*cell),d)>0.5) incoming+=pow(2.0,float(d));
      }
      if(push>0.0 && bitAt(incoming,0)<0.5 && hash3(g,seed+float(u_frame)*0.01)<push*0.05) incoming+=1.0;
      float res=incoming;
      for(int p=0;p<3;p++){
        if(bitAt(incoming,p)>0.5 && bitAt(incoming,p+3)>0.5){
          res -= pow(2.0,float(p)) + pow(2.0,float(p+3));
          res += pow(2.0,mod(float(p)+1.0,6.0)) + pow(2.0,mod(float(p)+4.0,6.0));
        }
      }
      res=clamp(floor(res+0.5),0.0,63.0);
      float dens=0.0; for(int b=0;b<6;b++) dens+=bitAt(res,b);
      gl_FragColor=vec4(palette(0.08+0.85*(dens/6.0)), res/63.0);
    }`
});

//============================================================ HPP LGA
// HPP lattice gas: square lattice, 4 velocity bits (E,N,W,S) packed in alpha*15.
// Exact streaming with bounce-back walls + the single HPP head-on collision
// (E&W <-> N&S). Classic central-box gas that leaks/diffuses outward.
R({
  name:'HPP LGA', category:'Lattice Gas Automata', type:'pingpong',
  params:[ {key:'cell',label:'cell px',min:2,max:8,step:1,value:3},
           {key:'density',label:'density',min:.2,max:.9,step:.01,value:.60},
           {key:'seed',label:'seed',min:0,max:50,step:1,value:9} ],
  frag:`uniform float cell,density,seed;
    ${HELP}
    float code(vec2 c){ return floor(texture(u_backbuffer,(floor(c/cell)*cell+cell*.5)/u_resolution).a*15.0+0.5); }
    float bitAt(float v,int b){ return mod(floor(v/pow(2.0,float(b))),2.0); }
    vec2 doff(int d){ if(d==0)return vec2(1,0); if(d==1)return vec2(0,-1); if(d==2)return vec2(-1,0); return vec2(0,1); }
    void main(){
      vec2 fc=gl_FragCoord.xy;
      vec2 g=floor(fc/cell);
      vec2 grid=floor(u_resolution/cell);
      if(u_frame==0){
        float v=0.0;
        bool inBox = g.x>grid.x*0.25 && g.x<grid.x*0.55 && g.y>grid.y*0.25 && g.y<grid.y*0.75;
        for(int b=0;b<4;b++){ if(inBox && hash3(g*float(b+1)*0.41,seed+float(b))<density) v+=pow(2.0,float(b)); }
        float a=v/15.0; gl_FragColor=vec4(palette(0.08+0.9*(v/4.0)),a); return;
      }
      float incoming=0.0;
      for(int d=0;d<4;d++){
        vec2 src=g-doff(d);
        if(src.x<0.0||src.y<0.0||src.x>=grid.x||src.y>=grid.y){
          int opp=int(mod(float(d)+2.0,4.0));
          if(bitAt(code(g*cell),opp)>0.5) incoming+=pow(2.0,float(d));   // bounce-back
          continue;
        }
        if(bitAt(code(src*cell),d)>0.5) incoming+=pow(2.0,float(d));
      }
      float e=bitAt(incoming,0), n=bitAt(incoming,1), w=bitAt(incoming,2), s=bitAt(incoming,3);
      float res=incoming;
      if(e>0.5 && w>0.5 && n<0.5 && s<0.5){ res = 2.0+8.0; }
      else if(n>0.5 && s>0.5 && e<0.5 && w<0.5){ res = 1.0+4.0; }
      float dens=e+n+w+s;
      gl_FragColor=vec4(palette(0.06+0.9*(dens/4.0)), res/15.0);
    }`
});

})();
