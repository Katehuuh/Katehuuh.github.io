<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>X-ish toy clone</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --fg: #e7e9ea;
    --muted: #71767b;
    --line: #2f3336;
    --accent: #1d9bf0;
    --accent-hover: #1a8cd8;
    --card-bg: #16181c;
    --hover-overlay: rgba(231,233,234,0.1);
    --accent-blue-hover: rgba(29,155,240,0.1);
    --accent-green-hover: rgba(0,186,124,0.1);
    --accent-pink-hover: rgba(249,24,128,0.1);
    --accent-green-text: rgb(0,186,124);
    --accent-pink-text: rgb(249,24,128);
    --header-bg: rgba(0,0,0,0.65);
    --shadow: 0 0 15px rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Chirp', 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.3125;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }
  textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .layout {
    display: grid;
    grid-template-columns: 275px minmax(0, 600px) 350px;
    max-width: 1265px;
    margin: 0 auto;
    gap: 0;
  }

  /* LEFT SIDEBAR */
  .left {
    position: sticky; top: 0;
    height: 100vh;
    padding: 0 12px;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
  }
  .brand {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9999px;
    margin: 2px 0;
  }
  .brand:hover { background: var(--hover-overlay); }
  .nav { display: flex; flex-direction: column; }
  .nav-item {
    display: inline-flex; align-items: center; gap: 20px;
    padding: 12px;
    border-radius: 9999px;
    color: var(--fg);
    background: transparent;
    border: 0;
    font-size: 20px;
    font-weight: 400;
    cursor: pointer;
    align-self: flex-start;
    text-align: left;
    transition: background-color .15s;
  }
  .nav-item:hover { background: var(--hover-overlay); }
  .nav-item.active { font-weight: 700; }
  .nav-item svg { width: 26.25px; height: 26.25px; }
  .post-btn {
    margin-top: 16px;
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 9999px;
    font-weight: 700;
    font-size: 17px;
    transition: background-color .15s;
  }
  .post-btn:hover { background: var(--accent-hover); }
  .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .left-bottom {
    margin-top: auto; padding: 12px 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .me-pill {
    display: flex; align-items: center; gap: 12px;
    padding: 10px;
    border-radius: 9999px;
    flex: 1;
    cursor: pointer;
    background: transparent;
    border: 0;
    color: var(--fg);
    min-width: 0;
  }
  .me-pill:hover { background: var(--hover-overlay); }
  .me-pill img { width: 40px; height: 40px; border-radius: 9999px; object-fit: cover; flex-shrink: 0; }
  .me-pill .me-text { display: flex; flex-direction: column; min-width: 0; }
  .me-pill .me-text strong, .me-pill .me-text span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left;
  }
  .me-pill .me-text span { color: var(--muted); font-size: 14px; }
  /* CENTER */
  .center {
    border-right: 1px solid var(--line);
    min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
  }
  .header-title { padding: 16px; font-size: 20px; font-weight: 700; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; position: relative; }
  .tabs::after {
    content: '';
    position: absolute;
    left: calc(25% - 28px);
    bottom: 0;
    width: 56px; height: 4px;
    background: var(--accent);
    border-radius: 9999px;
    transition: left .22s cubic-bezier(.2,.8,.2,1);
  }
  .tabs.following::after { left: calc(75% - 28px); }
  .tab {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-weight: 500;
    padding: 16px;
    cursor: pointer;
    font-size: 15px;
    position: relative;
    transition: background-color .15s;
  }
  .tab:hover { background: var(--hover-overlay); }
  .tab.active { color: var(--fg); font-weight: 700; }

  .composer {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .composer img.avatar {
    width: 40px; height: 40px; border-radius: 9999px; object-fit: cover;
  }
  .composer-body { display: flex; flex-direction: column; gap: 8px; }
  .composer textarea {
    background: transparent;
    border: 0;
    color: var(--fg);
    font-size: 20px;
    resize: none;
    outline: none;
    width: 100%;
    min-height: 56px;
    padding: 8px 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .composer-actions { display: flex; gap: 4px; }
  .composer-icon-btn {
    width: 34px; height: 34px;
    border: 0; background: transparent; color: var(--accent);
    border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
  }
  .composer-icon-btn:hover { background: var(--accent-blue-hover); }
  .composer-post {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 8px 16px;
    border-radius: 9999px;
    font-weight: 700;
    font-size: 15px;
  }
  .composer-post:disabled { opacity: 0.5; cursor: not-allowed; }
  .composer-post:not(:disabled):hover { background: var(--accent-hover); }
  .char-counter {
    width: 34px; height: 34px;
    margin-right: 12px;
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .char-counter svg { width: 26px; height: 26px; transform: rotate(-90deg); }
  .char-counter .track { stroke: var(--line); }
  .char-counter .bar {
    stroke: currentColor;
    transition: stroke-dashoffset .16s, stroke .16s;
  }
  .char-counter.warn { color: #ffd400; }
  .char-counter.danger, .char-counter.over { color: var(--accent-pink-text); }
  .char-counter.over::after {
    content: '';
    position: absolute; inset: 2px;
    border: 1px solid currentColor;
    border-radius: 9999px;
  }
  .char-counter-num {
    position: absolute;
    inset: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: currentColor;
    font-weight: 700;
  }

  /* POST ROW */
  .post {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    transition: background-color .1s;
    animation: postEnter .28s ease both;
  }
  .post.keyboard-focused {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: rgba(29,155,240,0.08);
  }
  @keyframes postEnter {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .post-menu {
    margin-left: auto;
    width: 30px; height: 30px;
    border-radius: 9999px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s, color .15s;
    flex-shrink: 0;
  }
  .post-menu:hover { background: var(--accent-blue-hover); color: var(--accent); }
  .post-menu svg { width: 18px; height: 18px; }
  /* Removed cursor:pointer + hover-overlay on .post: there was no click handler
     on the article itself, so the hand cursor was a UX lie. Hover stays subtle
     via individual interactive children (avatar, name, actions). */
  .post img.avatar {
    width: 40px; height: 40px; border-radius: 9999px; object-fit: cover;
    cursor: pointer;
  }
  .post-head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .post-head .name { font-weight: 700; color: var(--fg); cursor: pointer; }
  .post-head .name:hover { text-decoration: underline; }
  .post-head .handle, .post-head .dot, .post-head .time { color: var(--muted); }
  .verified-badge {
    display: inline-flex; align-items: center;
    color: var(--accent);
    flex-shrink: 0;
    margin-right: 2px;
  }
  .verified-badge.gold { color: #e2b719; }
  .nav-badge {
    position: absolute;
    top: -2px; left: 18px;
    background: var(--accent);
    color: #fff;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    padding: 0 5px;
    min-width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
    pointer-events: none;
  }
  .nav-item { position: relative; }
  @keyframes bellPing {
    0% { color: var(--fg); transform: scale(1); }
    35% { color: var(--accent-green-text); transform: scale(1.18) rotate(-8deg); }
    70% { color: var(--accent-green-text); transform: scale(1.05) rotate(6deg); }
    100% { color: var(--fg); transform: scale(1); }
  }
  .nav-item.bell-ping svg,
  .mobile-nav button.bell-ping svg {
    animation: bellPing .85s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes likeBurst {
    0%   { transform: scale(1); }
    25%  { transform: scale(0.1); }
    50%  { transform: scale(1.4); }
    75%  { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  .action.like.bursting .icon-wrap { animation: likeBurst .45s cubic-bezier(.2,.8,.2,1); }
  .post-body {
    margin-top: 4px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: var(--fg);
  }
  .post-image {
    margin-top: 12px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    max-width: 100%;
    /* Use min aspect ratio + max-height so a slow Pollinations response keeps a
       visible skeleton, while a successful load can shrink to natural size. */
    aspect-ratio: 16 / 9;
    max-height: 510px;
    position: relative;
    background:
      linear-gradient(110deg, var(--card-bg) 30%, rgba(255,255,255,0.04) 50%, var(--card-bg) 70%);
    background-size: 200% 100%;
    animation: img-skeleton 1.6s ease-in-out infinite;
  }
  .post-image.loaded {
    animation: none;
    background: var(--card-bg);
    aspect-ratio: auto;
  }
  .post-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .post-image.loaded img { opacity: 1; height: auto; }
  @keyframes img-skeleton {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .post-meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .actions {
    display: flex; justify-content: space-between;
    margin-top: 8px;
    max-width: 425px;
  }
  .action {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 0;
    color: var(--muted);
    padding: 0;
    font-size: 13px;
    transition: color .15s;
  }
  .action .icon-wrap {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px;
    transition: background-color .15s;
  }
  .action svg { width: 18.75px; height: 18.75px; }
  .action.reply:hover, .action.reply:hover .icon-wrap { color: var(--accent); }
  .action.reply:hover .icon-wrap { background: var(--accent-blue-hover); }
  .action.quote:hover, .action.quote:hover .icon-wrap { color: var(--accent); }
  .action.quote:hover .icon-wrap { background: var(--accent-blue-hover); }
  .action.retweet:hover, .action.retweet:hover .icon-wrap { color: var(--accent-green-text); }
  .action.retweet:hover .icon-wrap { background: var(--accent-green-hover); }
  .action.retweet.on { color: var(--accent-green-text); }
  .action.like:hover, .action.like:hover .icon-wrap { color: var(--accent-pink-text); }
  .action.like:hover .icon-wrap { background: var(--accent-pink-hover); }
  .action.like.on { color: var(--accent-pink-text); }
  .action.like.on svg { fill: var(--accent-pink-text); }
  .action.bookmark:hover, .action.bookmark:hover .icon-wrap { color: var(--accent); }
  .action.bookmark:hover .icon-wrap { background: var(--accent-blue-hover); }
  .action.bookmark.on { color: var(--accent); }
  .action.bookmark.on svg { fill: var(--accent); }
  .action.share:hover, .action.share:hover .icon-wrap { color: var(--accent); }
  .action.share:hover .icon-wrap { background: var(--accent-blue-hover); }

  /* token links inside posts */
  .tok-link { color: var(--accent); cursor: pointer; }
  .tok-link:hover { text-decoration: underline; }
  .new-posts-banner {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background-color .15s;
  }
  .new-posts-banner:hover { background: var(--accent-blue-hover); }
  .pull-refresh {
    height: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: height .16s ease;
  }
  .pull-refresh.ready { color: var(--accent-green-text); }
  .pull-refresh .x-spinner { width: 24px; height: 24px; border-width: 2px; }
  .quote-card {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--fg);
    background: rgba(255,255,255,0.02);
  }
  .quote-card .quote-head {
    display: flex; align-items: center; gap: 4px;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .quote-card .quote-name { font-weight: 700; }
  .quote-card .quote-handle { color: var(--muted); }
  .quote-card .quote-text {
    color: var(--fg);
    font-size: 14px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .context-menu {
    position: fixed;
    z-index: 220;
    min-width: 190px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
  }
  .context-menu button {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--fg);
    text-align: left;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    cursor: pointer;
  }
  .context-menu button:hover { background: var(--hover-overlay); }
  .profile-hover-card {
    position: fixed;
    z-index: 210;
    width: 292px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px;
    color: var(--fg);
  }
  .profile-hover-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .profile-hover-card img {
    width: 56px; height: 56px;
    border-radius: 9999px;
    object-fit: cover;
  }
  .profile-hover-name { margin-top: 8px; font-weight: 800; font-size: 17px; }
  .profile-hover-handle { color: var(--muted); font-size: 14px; }
  .profile-hover-bio { margin-top: 10px; font-size: 14px; line-height: 1.35; }
  .profile-hover-stats {
    display: flex; gap: 14px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .profile-hover-stats strong { color: var(--fg); font-weight: 700; }

  /* Reply composer + comments */
  .replies { padding: 0 16px 12px 76px; border-bottom: 1px solid var(--line); }
  .reply-composer {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 8px;
    align-items: center;
    padding: 8px 0;
  }
  .reply-composer img { width: 32px; height: 32px; border-radius: 9999px; object-fit: cover; }
  .reply-composer input {
    background: transparent; border: 0; outline: none;
    color: var(--fg); font-size: 15px; padding: 6px 0;
  }
  .reply-composer button {
    background: var(--accent); color: #fff; border: 0;
    padding: 6px 14px; border-radius: 9999px; font-weight: 700;
  }
  .reply-composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  .comment {
    display: grid; grid-template-columns: 32px 1fr; gap: 8px;
    padding: 8px 0;
    border-top: 1px dashed var(--line);
  }
  .comment img { width: 32px; height: 32px; border-radius: 9999px; object-fit: cover; cursor: pointer; }
  .comment .c-head { font-size: 13px; }
  .comment .c-head strong { color: var(--fg); }
  .comment .c-head span { color: var(--muted); margin-left: 4px; }
  .comment .c-body { color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* RIGHT SIDEBAR */
  .right { padding: 0 16px; scrollbar-width: none; }
  .right::-webkit-scrollbar { width: 0; background: transparent; }
  .right-sticky { position: sticky; top: 0; padding-top: 8px; }
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .search-wrap input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid transparent;
    border-radius: 9999px;
    padding: 12px 16px 12px 48px;
    color: var(--fg);
    font-size: 15px;
    outline: none;
  }
  .search-wrap input:focus { background: var(--bg); border-color: var(--accent); }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; color: var(--muted);
  }
  .right-card {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
  }
  .right-card h2 {
    margin: 0; padding: 12px 16px;
    font-size: 20px; font-weight: 800;
  }
  .trend {
    padding: 12px 16px;
    cursor: pointer;
    transition: background-color .15s;
  }
  .trend:hover { background: var(--hover-overlay); }
  .trend small { color: var(--muted); font-size: 13px; display: block; }
  .trend strong { display: block; font-size: 15px; margin: 2px 0; }
  .show-more {
    padding: 14px 16px;
    color: var(--accent);
    cursor: pointer;
    font-size: 15px;
    border-radius: 0 0 16px 16px;
    transition: background-color .15s;
  }
  .show-more:hover { background: var(--hover-overlay); }
  .who-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    transition: background-color .15s;
  }
  .who-row:hover { background: var(--hover-overlay); }
  .who-row img { width: 40px; height: 40px; border-radius: 9999px; object-fit: cover; cursor: pointer; flex-shrink: 0; }
  .who-row .who-info { flex: 1; min-width: 0; cursor: pointer; }
  .who-row .who-name {
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .who-row .who-handle {
    color: var(--muted); font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .follow-btn {
    background: var(--fg); color: var(--bg);
    border: 0; border-radius: 9999px;
    font-weight: 700; font-size: 14px;
    padding: 6px 16px;
    cursor: pointer;
    transition: opacity .15s, background-color .15s, color .15s, border-color .15s;
    flex-shrink: 0;
  }
  .follow-btn:hover { opacity: 0.9; }
  .follow-btn.following {
    background: transparent; color: var(--fg);
    border: 1px solid var(--line);
  }
  .follow-btn.following:hover {
    color: var(--accent-pink-text);
    border-color: var(--accent-pink-hover);
    background: var(--accent-pink-hover);
  }
  .footer-links {
    padding: 16px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .footer-links .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .footer-links a { color: var(--muted); }
  .footer-links a:hover { text-decoration: underline; }
  .header-action {
    width: 34px; height: 34px;

async function aiTextOnce(url, prompt, maxTokens, timeoutMs, label) {
  const res = await fetchWithTimeout(url, {
    method: 'POST',
    headers: pollinationsHeaders(),
    body: JSON.stringify({
      model: 'openai',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: maxTokens
    })
  }, timeoutMs, label);
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    throw new Error('pollinations ' + res.status + (detail ? ': ' + detail.slice(0, 160) : ''));
  }
  const data = await res.json();
  const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!content) throw new Error('pollinations: empty completion');
  return content;
}

// --- Generate AI batch with timeout + fallback ---
async function generateBatch(hint) {
  const prompt =
    `Write 5 short funny tweet-style posts (<=200 chars each) loosely related to: ${hint || 'random daily life'}. ` +
    `Sometimes include one #hashtag or one [link:topic] token. For exactly 1 of the 5 posts include an "image_prompt" field with a short vivid visual description (subject, style, mood). ` +
    `Return strictly JSON: {"posts":[{"text":"...","image_prompt":"..."},...]}`;
  try {
    const text = await aiText(prompt, 500);
    const parsed = tryParseJSON(text);
    if (parsed && Array.isArray(parsed.posts) && parsed.posts.length) {
      return parsed.posts.slice(0, 5).map(p => ({
        text: typeof p.text === 'string' ? p.text : '',
        image_prompt: typeof p.image_prompt === 'string' && p.image_prompt.trim() ? p.image_prompt.trim() : null
      })).filter(p => p.text);
    }
    return fallbackBatch();
  } catch (e) {
    console.warn('generateBatch failed', e);
    return fallbackBatch();
  }
}

// --- Generated micro-page for hashtag/link ---
async function generateMicroPage(slug) {
  const prompt =
    `Write a witty fake encyclopedia micro-page about "${slug}". 3 short bullets, each <=140 chars. ` +
    `Return strictly JSON: {"title":"...","bullets":["...","...","..."]}`;
  try {
    const text = await aiText(prompt, 300);
    const parsed = tryParseJSON(text);
    if (parsed && Array.isArray(parsed.bullets) && parsed.bullets.length) {
      return {
        title: typeof parsed.title === 'string' ? parsed.title : slug,
        bullets: parsed.bullets.slice(0, 3).map(String)
      };
    }
  } catch (e) { console.warn('micro-page failed', e); }
  return {
    title: slug,
    bullets: [
      `${slug}: a topic so trending it forgot to be defined.`,
      `Common usage: yelling about it on the timeline at 2am.`,
      `Counterpoint: maybe touching grass would be the move.`
    ]
  };
}

// --- Trends (fallback "What's happening" when feed has no hashtags yet) ---
const FALLBACK_TRENDS = [
  { topic: 'Technology', tag: '#WebGPU', count: '124K posts' },
  { topic: 'Trending', tag: '#FridayFeels', count: '89K posts' },
  { topic: 'Programming', tag: '#JavaScript', count: '212K posts' },
  { topic: 'Music', tag: '#NowPlaying', count: '45K posts' },
];
// Derive up to 4 trending hashtags from recent feed text. Falls back to
// FALLBACK_TRENDS when fewer than 2 hashtags have been seen.
function deriveTrends(posts) {
  if (!posts || !posts.length) return FALLBACK_TRENDS;
  const counts = new Map();
  for (const p of posts.slice(0, 50)) {
    const txt = String(p.text || '');
    const tags = txt.match(/#[\w\-]{2,30}/g);
    if (!tags) continue;
    for (const raw of tags) {
      const tag = raw.toLowerCase();
      counts.set(tag, (counts.get(tag) || 0) + 1);
    }
  }
  if (counts.size < 2) return FALLBACK_TRENDS;
  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
  // Synthesize a plausible-looking count.
  return sorted.map(([tag, n], i) => ({
    topic: i === 0 ? 'Trending now' : 'Trending',
    tag,
    count: (n * 1000 + Math.floor(Math.random() * 9000)) + ' posts'
  }));
}

// --- SafeImg: <img> with a default error-to-transparent-gif behavior ---
// Replaces the repeated `onError=${onImageError}` boilerplate sprinkled across
// avatars and thumbnails. Use directly anywhere the source might 404.
// Throttled post-image renderer. Mounts with a placeholder src (or cached
// data URL if available), then enqueues the real Pollinations URL on the
// shared image throttle so we don't burst-429 the endpoint.
function PostImage({ url, text }) {
  const ref = useRef(null);
  const cached = cachedImageFor(url);
  useEffect(() => {
    const el = ref.current;
    if (!el || cached) return;
    enqueueImageLoad(el, url);
  }, [url, cached]);
  return h('div', { class: 'post-image' },
    h('img', {
      ref,
      src: cached || TRANSPARENT_GIF,
      'data-original-src': url,
      'data-image-text': text || '',
      alt: '',
      loading: 'lazy',
      decoding: 'async',
      crossorigin: 'anonymous',
      referrerpolicy: 'no-referrer',
      onLoad: onGeneratedImageLoad,
      onError: onGeneratedImageError
    })
  );
}

function SafeImg(props) {
  const { onError, fallbackName, src, ...rest } = props || {};
  // Optional name used by onImageError to build an SVG initials data URL when
  // the upstream image fails (Pollinations rate-limit, 502, offline, etc).
  const data = fallbackName
    ? { ...(rest['data-fallback-name'] ? {} : {}), 'data-fallback-name': fallbackName }
    : {};
  const effectiveSrc = (src && cachedImageFor(src)) || src;
  const handler = (e) => {
    onImageError(e);
    if (typeof onError === 'function') onError(e);
  };
  return h('img', { ...rest, ...data, src: effectiveSrc, onError: handler });
}

// --- App component ---
function App() {
  const me = useMemo(ensureIdentity, []);
  const myAvatar = useMemo(() => avatarUrl(me.name), [me.name]);

  const personasRef = useRef(null);
  if (!personasRef.current) personasRef.current = makePersonas();
  const personas = personasRef.current;

  const [activeTab, setActiveTab] = useState('foryou');
  const [composerText, setComposerText] = useState('');
  const [posts, setPosts] = useState([]); // newest first
  const [profiles, setProfiles] = useState(() => {

  const mergeRemote = useCallback((remote, options = {}) => {

    const localIds = new Set(localPosts.map(p => p.id));
    for (const p of pendingNewPostsRef.current) localIds.add(p.id);
    const remotePosts = Array.isArray(remote.posts) ? remote.posts : [];

      if (rp && rp.id && !localIds.has(rp.id)) {
        if (options.deferNewer && topTs && (rp.ts || 0) > topTs) {
          deferredPosts.push(rp);

          mergedPosts.push(rp);
          postsChanged = true;

        localIds.add(rp.id);

        for (const p of deferredPosts) {
          if (!seen.has(p.id)) {

            seen.add(p.id);
          }
        }
        return next.sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 50);

    if (postsChanged) {
      anyChange = true;
      mergedPosts.sort((a, b) => (b.ts || 0) - (a.ts || 0));

        const next = { ...prev };

            changed = true;
          }

        if (changed) anyChange = true;
        return changed ? next : prev;
      });

        let changed = false;
        const next = { ...prev };

          const local = next[pid] || [];
          const mergedSet = new Set(local);
          for (const userId of (Array.isArray(arr) ? arr : [])) mergedSet.add(userId);
          const merged = Array.from(mergedSet);
          // Set-aware compare so order shuffles from the remote don't trigger
          // re-renders + needless persists.
          if (!sameSet(local, merged)) {
            next[pid] = merged;
            changed = true;
          }

        if (changed) anyChange = true;
        return changed ? next : prev;
      });
    }

        return changed ? next : prev;

        // from the post body. LoremFlickr is keyless and rate-tolerant.
        const imageText = b.image_prompt || b.text;

      });
      setPosts(prev => {
        const have = new Set(prev.map(p => p.id));
        const additions = newPosts.filter(p => !have.has(p.id));
        return [...additions, ...prev].sort((a, b) => (b.ts || 0) - (a.ts || 0));
      });
      schedulePersist();
    } catch (e) {
      console.warn('loadMore caught', e);
      // hardcoded fallback to guarantee feed never gets stuck empty
      const persona = (personasRef.current || [])[0] || { id: me.id };
      setPosts(prev => [{
        id: uid(),
        profileId: persona.id,
        text: 'the network is being shy. here is a placeholder thought: have you tried turning your monday off and on again?',
        imageUrl: null,
        ts: Date.now()
      }, ...prev]);
    } finally {
      loadingRef.current = false;
      setFeedLoading(false);
    }
  }, [me.id, schedulePersist]);

  useEffect(() => {
    const onScroll = () => {
      if (loadingRef.current) return;
      if (window.innerHeight + window.scrollY > document.body.offsetHeight - 800) {
        loadMore('', 'older').catch(() => {});
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [loadMore]);

  const runPullRefresh = useCallback(async () => {
    if (pullRefreshing) return;
    setPullRefreshing(true);
    setPullDistance(0);
    try {
      const remote = await readStore();
      if (remote) {
        mergeRemote(remote);
        if (pendingNewPostsRef.current.length) loadPendingNewPosts();
      } else {
        await loadMore('', 'newer');
      }
    } finally {
      setTimeout(() => setPullRefreshing(false), 350);
    }
  }, [pullRefreshing, mergeRemote, loadMore, loadPendingNewPosts]);

  useEffect(() => {
    const el = centerRef.current;
    if (!el) return;
    let startY = null;
    let latest = 0;
    const onStart = (e) => {
      if (activePageRef.current !== 'home' || window.innerWidth > 700 || window.scrollY > 0 || pullRefreshing) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      startY = t.clientY;
      latest = 0;
    };
    const onMove = (e) => {
      if (startY == null) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      const dy = t.clientY - startY;
      if (dy <= 0 || window.scrollY > 0) {
        setPullDistance(0);
        return;
      }
      latest = Math.min(92, dy * 0.62);
      setPullDistance(latest);
      if (dy > 8) e.preventDefault();
    };
    const onEnd = () => {
      if (startY == null) return;
      const shouldRefresh = latest >= 60;
      startY = null;
      latest = 0;
      if (shouldRefresh) runPullRefresh();
      else setPullDistance(0);
    };
    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd, { passive: true });
    el.addEventListener('touchcancel', onEnd, { passive: true });
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('touchcancel', onEnd);
    };
  }, [runPullRefresh, pullRefreshing]);

  // --- Filter posts for tabs and search ---
  // No follow graph in this toy, so "Following" is intentionally empty with a hint.
  const visiblePosts = useMemo(() => {
    if (activeTab === 'following') return [];
    const q = searchQuery.trim().toLowerCase();
    if (!q) return posts;
    return posts.filter(p => {
      const author = profiles[p.profileId] || {};
      const hay = [
        p.text || '',
        author.displayName || '',
        author.handle ? '@' + author.handle : ''
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }, [posts, activeTab, searchQuery, profiles]);
  useEffect(() => {
    visiblePostsRef.current = visiblePosts;
    if (focusedPostId && !visiblePosts.some(p => p.id === focusedPostId)) {
      setFocusedPostId(null);
    }
  }, [visiblePosts, focusedPostId]);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'j' && e.key !== 'J' && e.key !== 'k' && e.key !== 'K') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (activePageRef.current !== 'home' || composeModalOpen || openProfileId || openSlug) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
      const ids = visiblePostsRef.current.map(p => p.id);
      if (!ids.length) return;
      e.preventDefault();
      const dir = (e.key === 'j' || e.key === 'J') ? 1 : -1;
      setFocusedPostId(prev => {
        const idx = ids.indexOf(prev);
        let nextIdx = idx < 0 ? 0 : idx + dir;
        nextIdx = Math.max(0, Math.min(ids.length - 1, nextIdx));
        return ids[nextIdx];
      });
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [composeModalOpen, openProfileId, openSlug]);
  useEffect(() => {
    if (!focusedPostId) return;
    const el = document.getElementById('post-' + focusedPostId);
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, [focusedPostId]);

  // --- Profile object lookup ---
  // Cache synthetic profiles per missing id so the avatar URL is stable across
  // renders (otherwise every render seeds a new pollinations request and the
  // image visibly reshuffles).
  const unknownProfilesRef = useRef(new Map());
  const profileFor = useCallback((id) => {
    if (profiles[id]) return profiles[id];
    const cache = unknownProfilesRef.current;
    let synth = cache.get(id);
    if (!synth) {
      synth = {
        id,
        displayName: 'Unknown',
        handle: 'unknown',
        gender: 'unknown',
        location: 'unknown',
        avatarUrl: avatarUrl(id)
      };
      cache.set(id, synth);
    }
    return synth;
  }, [profiles]);
  const profilePosts = useMemo(() => {
    if (!openProfileId) return [];
    return posts.filter(p => p.profileId === openProfileId);
  }, [openProfileId, posts]);
  const trends = useMemo(() => deriveTrends(posts), [posts]);
  const startProfileHover = useCallback((profile, e) => {
    if (!profile || window.innerWidth < 700) return;
    if (hoverCloseTimerRef.current) clearTimeout(hoverCloseTimerRef.current);
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    const rect = e.currentTarget.getBoundingClientRect();
    const x = Math.max(8, Math.min(rect.left, window.innerWidth - 308));
    const y = Math.max(8, Math.min(rect.bottom + 8, window.innerHeight - 260));
    hoverTimerRef.current = setTimeout(() => {
      setHoverCard({ profileId: profile.id, x, y });
    }, 400);
  }, []);
  const scheduleHoverClose = useCallback(() => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    if (hoverCloseTimerRef.current) clearTimeout(hoverCloseTimerRef.current);
    hoverCloseTimerRef.current = setTimeout(() => setHoverCard(null), 140);
  }, []);
  const keepHoverCard = useCallback(() => {
    if (hoverCloseTimerRef.current) clearTimeout(hoverCloseTimerRef.current);
  }, []);

  // --- Render ---
  return html`
    <div class="layout">
      <${LeftSidebar}
        me=${me}
        myAvatar=${myAvatar}
        activePage=${activePage}
        unreadNotifs=${unreadNotifs}
        bellPing=${bellPing}
        onNavigate=${(slug) => {
          setActivePage(slug);
          if (slug === 'notifications') {
            // Mark all read on entering Notifications tab.
            setNotifications(prev => prev.map(n => n.read ? n : { ...n, read: true }));
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }}
        onPostClick=${() => { setComposeQuote(null); setComposeModalOpen(true); }}
        onProfile=${() => openProfile(me.id)}
      />
      <main class="center" ref=${centerRef}>
        ${activePage === 'home' ? html`
          <${Header} activeTab=${activeTab} setActiveTab=${setActiveTab} />
          <${PullRefreshIndicator} distance=${pullDistance} refreshing=${pullRefreshing} />
          <${Composer}
            avatar=${myAvatar}
            meName=${me.name}
            value=${composerText}
            onChange=${setComposerText}
            onSubmit=${onPost}
          />
          <${Feed}
            posts=${visiblePosts}
            profileFor=${profileFor}
            me=${me}
            myAvatar=${myAvatar}
            likes=${likes}
            comments=${comments}
            retweets=${retweets}
            bookmarks=${bookmarks}
            onLike=${toggleLike}
            onReply=${addComment}
            onRetweet=${toggleRetweet}
            onQuote=${openQuoteComposer}
            onBookmark=${toggleBookmark}
            onShare=${share}
            onOpenProfile=${openProfile}
            onOpenSlug=${openSlugModal}
            onOpenHandle=${openHandle}
            onOpenContextMenu=${openContextMenu}
            onProfileHoverStart=${startProfileHover}
            onProfileHoverEnd=${scheduleHoverClose}
            focusedPostId=${focusedPostId}
            newPostCount=${pendingNewPosts.length}
            onLoadNewPosts=${loadPendingNewPosts}
            loading=${activeTab === 'following' ? false : feedLoading}
            emptyHint=${activeTab === 'following' ? 'Follow graph not implemented in this toy. Switch to "For you" to see posts.' : (searchQuery.trim() ? `No visible posts match "${searchQuery.trim()}".` : null)}
          />
        ` : html`
          <${SubPage}
            page=${activePage}
            me=${me}
            myAvatar=${myAvatar}
            personas=${personas}
            posts=${posts}
            profileFor=${profileFor}
            notifications=${notifications}
            freshNotifIds=${freshNotifIds}
            bookmarks=${bookmarks}
            likes=${likes}
            comments=${comments}
            retweets=${retweets}
            trends=${trends}
            onBack=${() => setActivePage('home')}
            onLike=${toggleLike}
            onReply=${addComment}
            onRetweet=${toggleRetweet}
            onQuote=${openQuoteComposer}
            onBookmark=${toggleBookmark}
            onShare=${share}
            onOpenProfile=${openProfile}
            onOpenSlug=${openSlugModal}
            onOpenHandle=${openHandle}
            onOpenContextMenu=${openContextMenu}
            onProfileHoverStart=${startProfileHover}
            onProfileHoverEnd=${scheduleHoverClose}
          />
        `}
      </main>
      <${RightSidebar} trends=${trends} personas=${personas} query=${searchQuery} onSearch=${setSearchQuery} onOpenProfile=${openProfile} onTrendClick=${(t) => openSlugModal(t.tag.replace(/^#/, ''))} />

      ${openProfileId ? html`<${ProfileModal}
        profile=${profileFor(openProfileId)}
        posts=${profilePosts}
        profileFor=${profileFor}
        me=${me}
        myAvatar=${myAvatar}
        likes=${likes}
        comments=${comments}
        retweets=${retweets}
        bookmarks=${bookmarks}
        onLike=${toggleLike}
        onReply=${addComment}
        onRetweet=${toggleRetweet}
        onQuote=${openQuoteComposer}
        onBookmark=${toggleBookmark}
        onShare=${share}
        onOpenProfile=${openProfile}
        onOpenSlug=${openSlugModal}
        onOpenHandle=${openHandle}
        onOpenContextMenu=${openContextMenu}
        onProfileHoverStart=${startProfileHover}
        onProfileHoverEnd=${scheduleHoverClose}
        onClose=${closeProfile}
      />` : null}

      ${composeModalOpen ? html`<${ComposeModal}
        avatar=${myAvatar}
        meName=${me.name}
        quotePost=${composeQuote}
        quoteAuthor=${composeQuote ? profileFor(composeQuote.profileId) : null}
        onSubmit=${(text, quote) => createPost(text, quote)}
        onClose=${closeComposeModal}
      />` : null}

      ${openSlug ? html`<${GeneratedPageModal}
        slug=${openSlug}
        cached=${genPageCache[openSlug]}
        onClose=${closeSlugModal}
      />` : null}

      ${contextMenu ? html`<${PostContextMenu}
        menu=${contextMenu}
        author=${profileFor(contextMenu.post.profileId)}
        onCopy=${share}
        onClose=${closeContextMenu}
      />` : null}

      ${hoverCard ? html`<${ProfileHoverCard}
        profile=${profileFor(hoverCard.profileId)}
        x=${hoverCard.x}
        y=${hoverCard.y}
        onMouseEnter=${keepHoverCard}
        onMouseLeave=${scheduleHoverClose}
        onOpen=${() => { setHoverCard(null); openProfile(hoverCard.profileId); }}
      />` : null}

      ${toast ? html`<div class="toast">${toast}</div>` : null}
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class=${activePage === 'home' ? 'active' : ''} title="Home" aria-label="Home" onClick=${() => { setActivePage('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>${activePage === 'home' ? I.homeFilled : I.homeOutline}</button>
        <button class=${activePage === 'explore' ? 'active' : ''} title="Explore" aria-label="Explore" onClick=${() => setActivePage('explore')}>${I.explore}</button>
        <button class=${(activePage === 'notifications' ? 'active' : '') + (bellPing ? ' bell-ping' : '')} title="Notifications" aria-label="Notifications" onClick=${() => { setActivePage('notifications'); setNotifications(prev => prev.map(n => n.read ? n : { ...n, read: true })); }} style="position:relative;">
          ${I.bell}
          ${unreadNotifs > 0 ? html`<span class="nav-badge" style="top:6px;left:auto;right:18px;">${unreadNotifs > 99 ? '99+' : unreadNotifs}</span>` : null}
        </button>
        <button class=${activePage === 'messages' ? 'active' : ''} title="Messages" aria-label="Messages" onClick=${() => setActivePage('messages')}>${I.messages}</button>
        <button title="Profile" aria-label="Profile" onClick=${() => openProfile(me.id)}>${I.profile}</button>
      </nav>
      <button class="fab" title="New post (n)" aria-label="New post" onClick=${() => { setComposeQuote(null); setComposeModalOpen(true); }}>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g><path d="M14.06 9.02l.92.92L5.92 19H5v-.92l9.06-9.06zm3.6-6.02c-.25 0-.51.1-.7.29l-1.83 1.83 3.75 3.75 1.83-1.83c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.2-.2-.45-.29-.71-.29zm-3.6 3.19L3 17.25V21h3.75L17.81 9.94l-3.75-3.75z"></path></g></svg>
      </button>
    </div>
  `;
}

function PullRefreshIndicator({ distance, refreshing }) {
  const show = refreshing || distance > 0;
  const height = refreshing ? 60 : Math.round(distance);
  return html`
    <div class=${'pull-refresh' + (distance >= 60 || refreshing ? ' ready' : '')} style=${show ? `height:${height}px` : null} aria-hidden=${!show}>
      ${refreshing ? html`<div class="x-spinner"></div>` : html`<span>${distance >= 60 ? 'Release to refresh' : 'Pull to refresh'}</span>`}
    </div>
  `;
}

// --- Composer ---
const MAX_POST_CHARS = 280;
const CHAR_COUNTER_RADIUS = 9;
const CHAR_COUNTER_CIRC = 2 * Math.PI * CHAR_COUNTER_RADIUS;
function charCounterClass(n) {
  if (n > MAX_POST_CHARS) return 'char-counter over';
  if (n >= MAX_POST_CHARS - 10) return 'char-counter danger';
  if (n >= MAX_POST_CHARS - 30) return 'char-counter warn';
  return 'char-counter';
}
function CharCounter({ count }) {
  const remaining = MAX_POST_CHARS - count;
  const pct = Math.min(Math.max(count / MAX_POST_CHARS, 0), 1);
  const dashOffset = CHAR_COUNTER_CIRC * (1 - pct);
  return html`
    <span class=${charCounterClass(count)} title=${`${remaining} characters remaining`}>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle class="track" cx="12" cy="12" r=${CHAR_COUNTER_RADIUS} fill="none" stroke-width="2"></circle>
        <circle class="bar" cx="12" cy="12" r=${CHAR_COUNTER_RADIUS} fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray=${CHAR_COUNTER_CIRC} stroke-dashoffset=${dashOffset}></circle>
      </svg>
      ${remaining <= 30 ? html`<span class="char-counter-num">${remaining}</span>` : null}
    </span>
  `;
}
function Composer({ avatar, value, onChange, onSubmit, meName }) {
  const taRef = useRef(null);
  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = Math.min(300, ta.scrollHeight) + 'px';
  }, [value]);
  const onKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      if (value.trim() && value.length <= MAX_POST_CHARS) onSubmit();
    }
  };
  const over = value.length > MAX_POST_CHARS;
  return html`
    <div class="composer">
      <${SafeImg} class="avatar" src=${avatar} fallbackName=${meName} alt="" />
      <div class="composer-body">
        <textarea
          ref=${taRef}
          placeholder="What is happening?!"
          value=${value}
          maxlength=${MAX_POST_CHARS + 50}
          onInput=${(e) => onChange(e.currentTarget.value)}
          onKeyDown=${onKeyDown}
          rows="1"
          aria-label="Compose post"
        ></textarea>
        <div class="composer-row">
          <div class="composer-actions">
            <button class="composer-icon-btn" title="Image (toy stub)" aria-label="Attach image" onClick=${() => showBodyToast('Image attach is a toy stub', 1800)}>${I.image}</button>
            <button class="composer-icon-btn" title="GIF (toy stub)" aria-label="Add GIF" onClick=${() => showBodyToast('GIF picker would open here', 1800)}>${I.gif}</button>
            <button class="composer-icon-btn" title="Poll (toy stub)" aria-label="Create poll" onClick=${() => showBodyToast('Poll composer would open here', 1800)}>${I.poll}</button>
            <button class="composer-icon-btn" title="Emoji (toy stub)" aria-label="Insert emoji" onClick=${() => showBodyToast('Emoji picker would open here', 1800)}>${I.emoji}</button>
            <button class="composer-icon-btn" title="Location (toy stub)" aria-label="Add location" onClick=${() => showBodyToast('Location tag would attach here', 1800)}>${I.pin}</button>
          </div>
          <div style="display: flex; align-items: center;">
            <${CharCounter} count=${value.length} />
            <button class="composer-post" disabled=${!value.trim() || over} onClick=${onSubmit} title="Cmd/Ctrl + Enter">Post</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// Stable empty refs so memo() inside PostRow doesn't see fresh `[]` per render.
const EMPTY_ARR = Object.freeze([]);

// --- Feed ---
const Feed = memo(function Feed({ posts, profileFor, me, myAvatar, likes, comments, retweets, bookmarks, onLike, onReply, onRetweet, onQuote, onBookmark, onShare, onOpenProfile, onOpenSlug, onOpenHandle, onOpenContextMenu, onProfileHoverStart, onProfileHoverEnd, focusedPostId, newPostCount, onLoadNewPosts, loading, emptyHint }) {
  const newPostsBanner = newPostCount ? html`
    <button class="new-posts-banner" onClick=${onLoadNewPosts}>
      ${newPostCount} new ${newPostCount === 1 ? 'post' : 'posts'} -- click to load
    </button>
  ` : null;
  if (!posts.length) {
    if (loading) {
      // Skeleton stack while the very first batch is mid-flight.
      return html`
        <div>
          ${newPostsBanner}
          ${[0, 1, 2].map(i => html`
            <div class="skeleton-post" key=${i}>
              <div class="skeleton-shape skeleton-avatar"></div>
              <div>
                <div class="skeleton-shape skeleton-line short"></div>
                <div class="skeleton-shape skeleton-line long"></div>
                <div class="skeleton-shape skeleton-line medium"></div>
              </div>
            </div>
          `)}
        </div>
      `;
    }
    return html`
      <div>
        ${newPostsBanner}
        <div class="feed-empty">
          <div class="feed-empty-emoji">${emptyHint ? '~' : '*'}</div>
          <h3>${emptyHint ? 'Nothing here yet' : 'Quiet in here'}</h3>
          <p>${emptyHint || 'Type a thought above and the AI will riff on it.'}</p>
        </div>
      </div>
    `;
  }
  return html`
    <div>
      ${newPostsBanner}
      ${posts.map((p, idx) => html`
        <${PostRow}
          key=${p.id}
          post=${p}
          author=${profileFor(p.profileId)}
          me=${me}
          myAvatar=${myAvatar}
          likes=${likes[p.id] || EMPTY_ARR}
          comments=${comments[p.id] || EMPTY_ARR}
          profileFor=${profileFor}
          retweeted=${!!retweets[p.id]}
          bookmarked=${!!bookmarks[p.id]}
          stagger=${idx}
          focused=${focusedPostId === p.id}
          onLike=${onLike}
          onReply=${onReply}
          onRetweet=${onRetweet}
          onQuote=${onQuote}
          onBookmark=${onBookmark}
          onShare=${onShare}
          onOpenProfile=${onOpenProfile}
          onOpenSlug=${onOpenSlug}
          onOpenHandle=${onOpenHandle}
          onOpenContextMenu=${onOpenContextMenu}
          onProfileHoverStart=${onProfileHoverStart}

// --- Token parsing for post body ---
function parseTokens(text) {
  if (!text) return [];
  const out = [];
  // Split keeping whitespace
  const parts = text.split(/(\s+)/);
  for (const part of parts) {
    if (!part) continue;
    if (/^\s+$/.test(part)) {
      out.push({ type: 'text', value: part });
      continue;
    }
    const linkMatch = part.match(/^\[link:([^\]]+)\](.*)$/);
    if (linkMatch) {
      out.push({ type: 'link', slug: linkMatch[1] });
      if (linkMatch[2]) out.push({ type: 'text', value: linkMatch[2] });
      continue;
    }
    if (/^https?:\/\//.test(part)) {
      out.push({ type: 'url', value: part });
      continue;
    }
    if (part.startsWith('#') && part.length > 1) {
      const tagMatch = part.match(/^#([\w\-]+)(.*)$/);
      if (tagMatch) {
        out.push({ type: 'hashtag', value: tagMatch[1] });
        if (tagMatch[2]) out.push({ type: 'text', value: tagMatch[2] });
        continue;
      }
    }
    if (part.startsWith('@') && part.length > 1) {
      const m = part.match(/^@([\w\-]+)(.*)$/);
      if (m) {
        out.push({ type: 'mention', value: m[1] });
        if (m[2]) out.push({ type: 'text', value: m[2] });
        continue;
      }
    }
    out.push({ type: 'text', value: part });
  }
  return out;
}
function renderToken(tk, i, { onOpenSlug, onOpenHandle }) {
  if (tk.type === 'text') return tk.value;
  if (tk.type === 'url') {
    return html`<a key=${i} href=${tk.value} target="_blank" rel="noreferrer" onClick=${(e) => e.stopPropagation()}>${tk.value}</a>`;
  }
  if (tk.type === 'hashtag') {
    return html`<span key=${i} class="tok-link" onClick=${(e) => { e.stopPropagation(); onOpenSlug(tk.value); }}>#${tk.value}</span>`;
  }
  if (tk.type === 'mention') {
    return html`<span key=${i} class="tok-link" onClick=${(e) => { e.stopPropagation(); onOpenHandle(tk.value); }}>@${tk.value}</span>`;
  }
  if (tk.type === 'link') {
    return html`<span key=${i} class="tok-link" onClick=${(e) => { e.stopPropagation(); onOpenSlug(tk.slug); }}>${tk.slug}</span>`;
  }
  return null;
}

function groupNotifications(items) {
  const out = [];
  for (const n of items) {
    if ((n.type === 'like' || n.type === 'retweet') && n.postId) {
      const last = out[out.length - 1];
      if (last && last.grouped && last.type === n.type && last.postId === n.postId) {
        last.ids.push(n.id);
        if (!last.fromProfileIds.includes(n.fromProfileId)) last.fromProfileIds.push(n.fromProfileId);
        last.count = last.fromProfileIds.length;
        last.read = last.read && n.read;
        continue;
      }
      out.push({ ...n, grouped: true, ids: [n.id], fromProfileIds: [n.fromProfileId], count: 1, groupKey: n.type + ':' + n.postId + ':' + n.id });
    } else {
      out.push(n);
    }
  }
  return out;
}

      <button class=${'page-tab' + (tab === 'mentions' ? ' active' : '')} onClick=${() => setTab('mentions')}>Mentions</button>
    </div>
    ${grouped.length === 0
      ? html`<${EmptyState} title="Nothing to see here yet" body="From likes to retweets, this is where it'll all happen." />`
      : grouped.map(n => {
        const fresh = n.ids ? n.ids.some(id => freshNotifIds && freshNotifIds[id]) : !!(freshNotifIds && freshNotifIds[n.id]);
        return html`<${NotificationRow} key=${n.groupKey || n.id} notif=${n} profileFor=${profileFor} fresh=${fresh} onOpenProfile=${onOpenProfile} />`;
      })
    }
  `;
}

// --- Compose modal ---
function ComposeModal({ avatar, quotePost, quoteAuthor, onSubmit, onClose, meName }) {
  const [text, setText] = useState('');
  const taRef = useRef(null);
  const over = text.length > MAX_POST_CHARS;
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && (text.trim() || quotePost) && !over) {
        e.preventDefault();
        onSubmit(text, quotePost || null);
        onClose();
      }
    };
    document.addEventListener('keydown', onKey);
    if (taRef.current) taRef.current.focus();
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose, onSubmit, text, over, quotePost]);
  const submit = () => {
    if ((!text.trim() && !quotePost) || over) return;
    onSubmit(text, quotePost || null);
    onClose();
  };
  return html`
    <div class="modal-backdrop" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="modal" role="dialog" aria-label="Compose post">
        <div class="modal-header">
          <button class="modal-close" onClick=${onClose} aria-label="Close">${I.close}</button>
        </div>
        <div class="modal-body">
          <div class="composer" style="border-bottom: 0;">
            <${SafeImg} class="avatar" src=${avatar} fallbackName=${meName} alt="" />
            <div class="composer-body">
              <textarea
                ref=${taRef}
                placeholder="What is happening?!"
                value=${text}
                maxlength=${MAX_POST_CHARS + 50}
                onInput=${(e) => setText(e.currentTarget.value)}
                rows="6"
                style="min-height: 140px;"
              ></textarea>
              ${quotePost ? html`<${QuoteBlock} quote=${quotePost} author=${quoteAuthor} />` : null}
              <div class="composer-row">
                <div class="composer-actions">
                  <button class="composer-icon-btn" title="Image (toy stub)" onClick=${() => showBodyToast('Image attach is a toy stub', 1800)}>${I.image}</button>
                  <button class="composer-icon-btn" title="GIF (toy stub)" onClick=${() => showBodyToast('GIF picker would open here', 1800)}>${I.gif}</button>
                  <button class="composer-icon-btn" title="Poll (toy stub)" onClick=${() => showBodyToast('Poll composer would open here', 1800)}>${I.poll}</button>
                  <button class="composer-icon-btn" title="Emoji (toy stub)" onClick=${() => showBodyToast('Emoji picker would open here', 1800)}>${I.emoji}</button>
                  <button class="composer-icon-btn" title="Location (toy stub)" onClick=${() => showBodyToast('Location tag would attach here', 1800)}>${I.pin}</button>
                </div>
                <div style="display: flex; align-items: center;">
                  <${CharCounter} count=${text.length} />
                  <button class="composer-post" disabled=${(!text.trim() && !quotePost) || over} onClick=${submit} title="Cmd/Ctrl + Enter">Post</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// --- Generated page modal ---
function GeneratedPageModal({ slug, cached, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const isLoading = !cached || cached.loading;
  return html`
    <div class="modal-backdrop" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="modal" role="dialog" aria-label="Topic page">
        <div class="modal-header">
          <button class="modal-close" onClick=${onClose} aria-label="Close">${I.close}</button>
          <div class="modal-title">#${slug}</div>
        </div>
        <div class="modal-body">
          <div class="gen-page-content">
            ${isLoading ? html`<div class="spinner">Generating witty micro-page about "${slug}"…</div>` : html`
              <h3>${cached.title || slug}</h3>
              <ul>
                ${(cached.bullets || []).map((b, i) => html`<li key=${i}>${b}</li>`)}
              </ul>
            `}
          </div>
        </div>
      </div>
    </div>
  `;
}
