<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dual Grid</title>
    <meta name="description" content="Connect the glowing core to every dark socket and watch the whole grid wake up from night to day.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: #020304; overflow: hidden; display: flex; flex-direction: column;
            height: 100vh; height: 100dvh; font-family: monospace; color: #0ff;
            overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: #050508; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            transition: opacity 0.3s ease-out;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        #loading-screen.fade-out .rb { visibility: hidden; }
        #loading-screen .symbol-container { position: relative; width: 200px; height: 200px; }
        #loading-screen canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #loading-screen #symBack { opacity: 0.3; filter: blur(1px); }
        #loading-screen #symFront { z-index: 1; }
        #loading-screen .loading-text {
            margin-top: 30px; color: #0ff; font-family: monospace; font-size: 12px;
            letter-spacing: 4px; text-shadow: 0 0 15px #0ff;
            animation: pulse 1.5s ease-in-out infinite;
        }
        #loading-screen .progress { margin-top: 15px; color: #0ff8; font-family: monospace; font-size: 10px; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Rainbow rings around the symbol. CSS transform animations only, so they keep turning while the main thread is busy. */
        /* ===== RAINBOW MOTION CONSTANTS: retune the motion here, nothing else needs to change ========================
           One row per ring, outermost first. Every ring is a half circle that turns about the common centre.
             rotate                     pose at the start of the loop, degrees (the staircase of the original frame)
             animation-duration         seconds for ONE full turn of that ring, shorter = faster
             animation-timing-function  linear = constant speed (the only seamless choice for an endless spin)
             animation-direction        normal = clockwise, reverse = counter clockwise
           Now: all clockwise, ring k makes k turns while the outer ring makes 1 (20 s), so speed rises towards the centre and
           the whole pattern comes back to its start pose every 20 s. Presets (turns per 20 s, outer to inner):
             alternating  1 -2 3 -4 5 -6 7 -8     rigid spin  1 1 1 1 1 1 1 1     analyst guess  4 3 2 1 0 -1 -2 -3
           A negative number means: same duration, animation-direction reverse. Duration = 20 / turns, a 0 means no animation.
           ============================================================================================================== */
        #loading-screen .rings > :nth-child(1) { rotate: 114.8deg;   animation: rb-spin 20s       linear infinite normal; }  /* purple */
        #loading-screen .rings > :nth-child(2) { rotate: 63.4deg;    animation: rb-spin 10s       linear infinite normal; }  /* magenta */
        #loading-screen .rings > :nth-child(3) { rotate: 11.9deg;    animation: rb-spin 6.66667s  linear infinite normal; }  /* red */
        #loading-screen .rings > :nth-child(4) { rotate: 320.5deg;   animation: rb-spin 5s        linear infinite normal; }  /* orange */
        #loading-screen .rings > :nth-child(5) { rotate: 269.1deg;   animation: rb-spin 4s        linear infinite normal; }  /* yellow */
        #loading-screen .rings > :nth-child(6) { rotate: 217.7deg;   animation: rb-spin 3.33333s  linear infinite normal; }  /* green */
        #loading-screen .rings > :nth-child(7) { rotate: 166.2deg;   animation: rb-spin 2.85714s  linear infinite normal; }  /* teal */
        #loading-screen .rings > :nth-child(8) { rotate: 114.8deg;   animation: rb-spin 2.5s      linear infinite normal; }  /* blue */
        /* ===== end of motion constants ===== */
        #loading-screen .rb {
            position: relative; flex: none; width: 344px; height: 344px; display: grid; place-content: center;
        }
        @media (max-width: 379px) { #loading-screen .rb { transform: scale(0.9); margin: -17.2px; } }
        @media (max-height: 459px) { #loading-screen .rb { transform: scale(0.85); margin: -25.8px; } }
        @media (max-width: 339px) { #loading-screen .rb { transform: scale(0.8); margin: -34.4px; } }
        @media (max-height: 409px) { #loading-screen .rb { transform: scale(0.75); margin: -43px; } }
        @media (max-height: 369px) { #loading-screen .rb { transform: scale(0.65); margin: -60.2px; } }
        #loading-screen .rings { position: absolute; inset: 0; }
        #loading-screen .rings > div { position: absolute; will-change: transform; }
        #loading-screen .rings svg { display: block; width: 100%; height: 100%; }
        #loading-screen .rings circle { fill: none; stroke-width: 7; }
        @keyframes rb-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #loading-screen .rings > div { animation-duration: 160s !important; } }

        #hud {
            flex: none; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
            gap: 6px 14px; min-height: 42px;
            padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
            font-size: 12px; letter-spacing: 1px; background: #020304;
            opacity: 0; transition: opacity 0.5s ease-in; position: relative; z-index: 100;
        }
        #hud.visible { opacity: 1; }
        .grp { display: flex; align-items: center; gap: 7px; }
        .lab { color: #0ff9; }
        #ttl { color: #0ff; font-weight: bold; margin-right: 8px; text-shadow: 0 0 12px #0ff8; letter-spacing: 3px; }
        #lvtxt { min-width: 34px; text-align: center; text-shadow: 0 0 10px #0ff8; }
        button {
            background: #0a1015; border: 1px solid #0ff4; color: #0ff; padding: 5px 11px; border-radius: 4px;
            cursor: pointer; font-family: monospace; font-size: 12px; letter-spacing: 1px; touch-action: manipulation;
            min-height: 28px;
        }
        button:hover { background: #0ff1; }
        button:active { background: #0ff3; }
        button:disabled { opacity: 0.3; cursor: default; }
        button.nav { padding: 4px 9px; }
        #snd[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; }
        .pips { display: flex; align-items: center; gap: 4px; }
        .pip { width: 10px; height: 10px; border: 1px solid #0ff9; background: #0ff; box-shadow: 0 0 7px #0ff9; transition: background 0.25s, box-shadow 0.25s, border-color 0.25s; }
        .pip.u { background: transparent; box-shadow: none; border-color: #0ff3; }
        .pips.nodes .pip { border-radius: 50%; width: 11px; height: 11px; background: transparent; box-shadow: none; border-color: #0ff8; }
        .pips.nodes .pip.u { background: #0ff; box-shadow: 0 0 9px #0ff; border-color: #0ff; }
        .pips.warn .pip { border-color: #fa6; box-shadow: 0 0 7px #fa68; }
        .pips.warn .pip.u { box-shadow: none; }
        #msg { color: #0ffc; text-shadow: 0 0 12px #0ff8; letter-spacing: 2px; }

        #stage { flex: 1; min-height: 0; position: relative; }
        #stage canvas { position: absolute; top: 0; left: 0; display: block; }
        #foot {
            flex: none; height: calc(26px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
            text-align: center; color: #0ffc; font-size: 12px; letter-spacing: 4px; text-shadow: 0 0 14px #0ff;
            line-height: 26px; opacity: 0; transition: opacity 0.4s; pointer-events: none; background: #020304;
        }
        #foot.on { opacity: 1; }
        @media (max-height: 460px) {
            #hud { min-height: 34px; padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: 3px; }
            #foot { height: calc(20px + env(safe-area-inset-bottom)); line-height: 20px; }
        }
        @media (max-width: 640px) { #ttl { display: none; } }
        @media (max-width: 430px) {
            #hud { gap: 6px 8px; letter-spacing: 0; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
            button { padding: 5px 8px; }
            button.nav { padding: 4px 7px; }
            .grp { gap: 5px; }
            .pips { gap: 3px; }
            .pip { width: 8px; height: 8px; }
            .pips.nodes .pip { width: 10px; height: 10px; }
            #lvtxt { min-width: 28px; }
        }

    <script>
        (function() {
            const layer1 = "⊕∩⊇∪⊆", layer2 = "∵∴", fontSize = 120, padding = 10;
            function measure(chars) {
                const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
                c.width = c.height = fontSize * 2;
                x.font = `${fontSize}px monospace`; x.textBaseline = 'middle'; x.textAlign = 'center';
                return [...chars].map(ch => {
                    x.clearRect(0,0,c.width,c.height); x.fillStyle = '#fff'; x.fillText(ch, c.width/2, c.height/2);
                    const d = x.getImageData(0,0,c.width,c.height).data;
                    let x1=c.width, x2=0, y1=c.height, y2=0;
                    for (let y=0; y<c.height; y++) for (let i=0; i<c.width; i++) if (d[(y*c.width+i)*4+3]>0) { x1=Math.min(x1,i); x2=Math.max(x2,i); y1=Math.min(y1,y); y2=Math.max(y2,y); }
                    return { ch, w: x2-x1+1, h: y2-y1+1, cx: (x1+x2)/2, cy: (y1+y2)/2, cs: c.width };
                });
            }
            function setup(id, m, col) {
                const mW = Math.max(...m.map(v=>v.w)), mH = Math.max(...m.map(v=>v.h));
                const c = document.getElementById(id), x = c.getContext('2d');
                c.width = mW + padding*2; c.height = mH + padding*2;
                m.forEach(v => v.sc = Math.min(mW/v.w, mH/v.h));
                return { c, x, m, col };
            }
            function draw(L, i) {
                const { x, c, m, col } = L, v = m[i % m.length];
                x.clearRect(0,0,c.width,c.height); x.save();
                x.translate(c.width/2, c.height/2); x.scale(v.sc, v.sc);
                x.font = `${fontSize}px monospace`; x.textBaseline = 'middle'; x.textAlign = 'center';
                x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 20;
                x.fillText(v.ch, v.cs/2 - v.cx, v.cs/2 - v.cy);
                x.restore();
            }
            const m1 = measure(layer1), m2 = measure(layer2);
            const L1 = setup('symFront', m1, '#0ff'), L2 = setup('symBack', m2, '#0ff');
            let i1=0, i2=0; draw(L1,i1); draw(L2,i2);
            window.loadingAnim = [setInterval(()=>draw(L1,++i1), 150), setInterval(()=>draw(L2,++i2), 300)];
            window.setProgress = (txt) => { document.getElementById('progress').textContent = txt; };
        })();
    </script>

            // 4 texture sets, 3 variants each (shared image data, different uv transform)
            const texSets = [];
            for (let ti = 0; ti < TYPES.length; ti++) {
                setProgress(`Generating ${TYPES[ti]} ${ti + 1}/4...`);
                const td = genTexData(COLORS[TYPES[ti]], PROPS[TYPES[ti]], ti * 1000 + 100);
                const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
                texSets.push({ map: dataTex(td.diff, aniso), norm: dataTex(td.norm, aniso), rm: dataTex(td.rm, aniso), env: PROPS[TYPES[ti]].env });
                await nextFrame();
            }
            for (let ti = 0; ti < TYPES.length; ti++) {
                MATS[ti] = [];
                const S = texSets[ti];
                for (let v = 0; v < 3; v++) {
                    const rm = variantTex(S.rm, v);
                    MATS[ti].push(new THREE.MeshStandardMaterial({
                        map: variantTex(S.map, v), normalMap: variantTex(S.norm, v), normalScale: new THREE.Vector2(0.55, 0.55),
                        roughnessMap: rm, roughness: 1, metalnessMap: rm, metalness: 1,
                        envMap, envMapIntensity: S.env,
                    }));
                }
            }
            // dark glossy socket and the glowing core brick
            nodeMat = MATS[T_BED][0].clone(); nodeMat.color.setHex(0x40484c); nodeMat.roughness = 0.5; nodeMat.metalness = 0.8; nodeMat.emissive.setHex(0x001a20);
            for (let v = 0; v < 3; v++) { const m = MATS[T_AND][v].clone(); m.emissive.setHex(0x0098a8); m.emissiveIntensity = 0.3; poweredMats.push(m); }
            sourceMat = MATS[T_BRICK][0].clone(); sourceMat.emissive.setHex(0x00b8c8); sourceMat.emissiveIntensity = 0.35;

            if (crystals) crystalU = crystals(); // the GPU bakes while the shards, blocks and grid are built
            setProgress('Building blocks...');
            for (let m = 0; m < 16; m++) GEO.push(mkGeo(m));
            await nextFrame();

            setProgress('Building grid...');
            const tileGeo = new THREE.BoxGeometry(TILE, 0.08, TILE);
            for (let i = 0; i < N; i++) {
                const t = new THREE.Mesh(tileGeo, MATS[T_GROUND][((i % GRID) + Math.floor(i / GRID)) % 3]);
                t.position.set(CELL_X(i), GROUND_Y, CELL_Z(i)); t.receiveShadow = true; t.matrixAutoUpdate = false; t.updateMatrix();
                scene.add(t); tiles.push(t);
                const c = new THREE.Mesh(GEO[0], MATS[T_BED][0]);
                c.castShadow = true; c.receiveShadow = true; c.matrixAutoUpdate = false; c.visible = false;
                c.position.set(CELL_X(i), CUBE_Y, CELL_Z(i)); c.updateMatrix();
                scene.add(c); cubes.push(c);
            }
            // same program as every other block (only uniforms differ), so there is one big shader to compile
            const baseMat = MATS[T_GROUND][0].clone();
            baseMat.color.setHex(0x030506); baseMat.roughness = 0.4; baseMat.metalness = 0.6; baseMat.envMapIntensity = 0.3;
            baseMat.normalScale.set(0, 0);
            const base = new THREE.Mesh(new THREE.PlaneGeometry(GRID * PITCH + 2, GRID * PITCH + 2), baseMat);
            base.rotation.x = -Math.PI / 2; base.position.y = GROUND_Y - 0.05; base.receiveShadow = true; base.matrixAutoUpdate = false; base.updateMatrix();
            scene.add(base);
            buildGlow();

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.07;
            controls.enablePan = false; controls.rotateSpeed = 0.8; controls.zoomSpeed = 0.9;
            controls.maxPolarAngle = Math.PI / 2.1; controls.minPolarAngle = 0.25;
            controls.addEventListener('change', request);
            controls.addEventListener('start', () => { userMoved = true; });
            DIR = r0.width / Math.max(1, r0.height) < 0.8 ? DIR_TALL : DIR_WIDE;
            fitD = fitView(r0.width / Math.max(1, r0.height)).D;
            camera.position.copy(DIR).multiplyScalar(fitD); camera.lookAt(0, 0, 0);
            controls.minDistance = fitD * 0.42; controls.maxDistance = fitD * 1.6;
            controls.update();
            bindInput(renderer.domElement);
            await nextFrame();

            setProgress('Warming up...');
            for (const S of texSets) { renderer.initTexture(S.map); renderer.initTexture(S.norm); renderer.initTexture(S.rm); }
            startLevel(0, { instant: true, all: true });
            for (let i = 0; i < N; i++) { cubes[i].updateMatrix(); }
            lastT = performance.now();
            // show every mask geometry once so all of them are uploaded before the game starts
            for (let m = 0; m < 16; m++) { cubes[m].visible = true; cubes[m].geometry = GEO[m]; }
            sun.shadow.needsUpdate = true;
            if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(scene, camera); else renderer.compile(scene, camera);
            applyPower(power);
            stepLights(10);
            refreshGlow();
            step(performance.now(), 0.016);
            render();
            for (let i = 0; i < N; i++) { cubes[i].visible = kind[i] !== K_EMPTY; refreshGeo(i); }
            shadowDirty = true;
            await nextFrame();

            setProgress('Ready!');
            ready = true;
            window.loadingAnim.forEach(i => clearInterval(i));
            const ls = document.getElementById('loading-screen');
            ls.classList.add('fade-out');
            hud.el.classList.add('visible');
            setTimeout(() => { ls.style.display = 'none'; }, 330);

            window.addEventListener('resize', onResize);
            new ResizeObserver(() => onResize()).observe(stage);
            window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
            hud.prev.addEventListener('click', () => gotoIndex(mode === 'sandbox' ? LEVELS.length - 1 : levelIdx - 1));
            hud.next.addEventListener('click', () => gotoIndex(mode === 'sandbox' ? 0 : levelIdx + 1));
            document.getElementById('reset').addEventListener('click', () => { if (mode === 'sandbox') gotoIndex(LEVELS.length); else gotoIndex(levelIdx); });
            onResize();
            pkStart = performance.now();
            wake(PK_DUR + 200);
            window.__game = makeApi(T0);
        }

        // ================= TEST API (harmless) =================
        function makeApi(T0) {
            const toXZ = i => [i % GRID, Math.floor(i / GRID)];
            return {
                levels: LEVELS, loadMs: performance.now() - T0,
                state: () => ({ mode, phase, level: levelIdx, used: usedBlocks(), budget, lit: litNodes, nodes: nodeTotal, power, powerTarget, renders: stats.renders, rafPending: !!rafId, hover: hoverCell, kinds: Array.from(kind), tg: Array.from(tg) }),
                info: () => ({ geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, programs: renderer.info.programs.length, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }),
                setLevel: (n) => { gotoIndex(n); },
                setLevelNow: (n) => { if (n >= LEVELS.length) startSandbox({ instant: true, all: true }); else startLevel(n, { instant: true, all: true }); wake(0); },
                toggle: (x, z, right) => actOn(z * GRID + x, !!right),
                setPower: (p) => { power = powerTarget = p; applyPower(p); wake(0); },
                setGridLines: (v) => { gridLines = !!v; },
                holdWin: (v) => { holdWin = !!v; },
                lights: () => lights.map((l, k) => ({ i: slotCell[k], I: l.intensity, y: l.position.y })),
                screenOf: (x, z, top) => {
                    const v = new THREE.Vector3(CELL_X(z * GRID + x), top ? TOP_Y : FLOOR_Y, CELL_Z(z * GRID + x)).project(camera);
                    const r = renderer.domElement.getBoundingClientRect();
                    return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
                },
                pickAt: (x, y) => pick(x, y),
                cursor: () => ({ cell: hoverCell, top: hoverTop, amt: aDarr[Q_CURSOR * 16 + 1], y: posArr[Q_CURSOR * 12 + 1], x: posArr[Q_CURSOR * 12] + 0.4, z: posArr[Q_CURSOR * 12 + 2] + 0.4 }),
                ringCell: (x, z) => ringCell(z * GRID + x),
                renderOnce: () => { render(); },
                counts: () => ({ cubes: cubes.length, visible: cubes.filter(c => c.visible).length }),
                camera: () => camera.position.toArray(),
                fit: () => ({ fitD, dist: camera.position.length(), min: controls.minDistance, max: controls.maxDistance }),
                resetCamera: () => { camera.position.copy(DIR).multiplyScalar(fitD); controls.update(); wake(0); },
                setCamera: (x, y, z) => { camera.position.set(x, y, z); controls.update(); wake(0); },
            };
        }

        init().catch(err => { console.error(err); setProgress('Error: ' + err.message); });
    </script>
</body>
</html>
