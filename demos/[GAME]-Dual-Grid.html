                    const d = x.getImageData(0,0,c.width,c.height).data;
                    let x1=c.width, x2=0, y1=c.height, y2=0;
                    for (let y=0; y<c.height; y++) for (let i=0; i<c.width; i++) if (d[(y*c.width+i)*4+3]>0) { x1=Math.min(x1,i); x2=Math.max(x2,i); y1=Math.min(y1,y); y2=Math.max(y2,y); }
                    return { ch, w: x2-x1+1, h: y2-y1+1, cx: (x1+x2)/2, cy: (y1+y2)/2, cs: c.width };
                });
            }
            function setup(id, m, col) {
                const mW = Math.max(...m.map(v=>v.w)), mH = Math.max(...m.map(v=>v.h));
                const c = document.getElementById(id), x = c.getContext('2d');
                c.width = mW + padding*2; c.height = mH + padding*2;
                m.forEach(v => v.sc = Math.min(mW/v.w, mH/v.h));
                return { c, x, m, col };
            }
            function draw(L, i) {
                const { x, c, m, col } = L, v = m[i % m.length];

                x.font = `${fontSize}px monospace`; x.textBaseline = 'middle'; x.textAlign = 'center';
                x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 20;
                x.fillText(v.ch, v.cs/2 - v.cx, v.cs/2 - v.cy);
                x.restore();
            }
            const m1 = measure(layer1), m2 = measure(layer2);
            const L1 = setup('symFront', m1, '#0ff'), L2 = setup('symBack', m2, '#0ff');
            let i1=0, i2=0; draw(L1,i1); draw(L2,i2);

        })();
    </script>

            // dark glossy socket and the glowing core brick
            nodeMat = MATS[T_BED][0].clone(); nodeMat.color.setHex(0x40484c); nodeMat.roughness = 0.5; nodeMat.metalness = 0.8; nodeMat.emissive.setHex(0x001a20);
            for (let v = 0; v < 3; v++) { const m = MATS[T_AND][v].clone(); m.emissive.setHex(0x0098a8); m.emissiveIntensity = 0.3; poweredMats.push(m); }
            sourceMat = MATS[T_BRICK][0].clone(); sourceMat.emissive.setHex(0x00b8c8); sourceMat.emissiveIntensity = 0.35;

            setProgress('Building blocks...');
            for (let m = 0; m < 16; m++) GEO.push(mkGeo(m));
            await nextFrame();

            setProgress('Building grid...');
            const tileGeo = new THREE.BoxGeometry(TILE, 0.08, TILE);
            for (let i = 0; i < N; i++) {
                const t = new THREE.Mesh(tileGeo, MATS[T_GROUND][((i % GRID) + Math.floor(i / GRID)) % 3]);
                t.position.set(CELL_X(i), GROUND_Y, CELL_Z(i)); t.receiveShadow = true; t.matrixAutoUpdate = false; t.updateMatrix();
                scene.add(t); tiles.push(t);
                const c = new THREE.Mesh(GEO[0], MATS[T_BED][0]);
                c.castShadow = true; c.receiveShadow = true; c.matrixAutoUpdate = false; c.visible = false;
                c.position.set(CELL_X(i), CUBE_Y, CELL_Z(i)); c.updateMatrix();
                scene.add(c); cubes.push(c);
            }
            // same program as every other block (only uniforms differ), so there is one big shader to compile
            const baseMat = MATS[T_GROUND][0].clone();
            baseMat.color.setHex(0x030506); baseMat.roughness = 0.4; baseMat.metalness = 0.6; baseMat.envMapIntensity = 0.3;
            baseMat.normalScale.set(0, 0);
            const base = new THREE.Mesh(new THREE.PlaneGeometry(GRID * PITCH + 2, GRID * PITCH + 2), baseMat);
            base.rotation.x = -Math.PI / 2; base.position.y = GROUND_Y - 0.05; base.receiveShadow = true; base.matrixAutoUpdate = false; base.updateMatrix();
            scene.add(base);
            buildGlow();

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.07;
            controls.enablePan = false; controls.rotateSpeed = 0.8; controls.zoomSpeed = 0.9;
            controls.maxPolarAngle = Math.PI / 2.1; controls.minPolarAngle = 0.25;
            controls.addEventListener('change', request);
            controls.addEventListener('start', () => { userMoved = true; });
            DIR = r0.width / Math.max(1, r0.height) < 0.8 ? DIR_TALL : DIR_WIDE;
            fitD = fitView(r0.width / Math.max(1, r0.height)).D;
            camera.position.copy(DIR).multiplyScalar(fitD); camera.lookAt(0, 0, 0);
            controls.minDistance = fitD * 0.42; controls.maxDistance = fitD * 1.6;
            controls.update();
            bindInput(renderer.domElement);
            await nextFrame();

            setProgress('Warming up...');
            for (const S of texSets) { renderer.initTexture(S.map); renderer.initTexture(S.norm); renderer.initTexture(S.rm); }
            startLevel(0, { instant: true, all: true });
            for (let i = 0; i < N; i++) { cubes[i].updateMatrix(); }
            lastT = performance.now();
            // show every mask geometry once so all of them are uploaded before the game starts
            for (let m = 0; m < 16; m++) { cubes[m].visible = true; cubes[m].geometry = GEO[m]; }
            sun.shadow.needsUpdate = true;
            if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(scene, camera); else renderer.compile(scene, camera);
            applyPower(power);
            stepLights(10);
            refreshGlow();
            step(performance.now(), 0.016);
            render();
            for (let i = 0; i < N; i++) { cubes[i].visible = kind[i] !== K_EMPTY; refreshGeo(i); }
            shadowDirty = true;
            await nextFrame();

            setProgress('Ready!');
            ready = true;
            window.loadingAnim.forEach(i => clearInterval(i));
            const ls = document.getElementById('loading-screen');
            ls.classList.add('fade-out');
            hud.el.classList.add('visible');
            setTimeout(() => { ls.style.display = 'none'; }, 330);

            window.addEventListener('resize', onResize);
            new ResizeObserver(() => onResize()).observe(stage);
            window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
            hud.prev.addEventListener('click', () => gotoIndex(mode === 'sandbox' ? LEVELS.length - 1 : levelIdx - 1));
            hud.next.addEventListener('click', () => gotoIndex(mode === 'sandbox' ? 0 : levelIdx + 1));
            document.getElementById('reset').addEventListener('click', () => { if (mode === 'sandbox') gotoIndex(LEVELS.length); else gotoIndex(levelIdx); });
            onResize();
            pkStart = performance.now();
            wake(PK_DUR + 200);
            window.__game = makeApi(T0);
        }

        // ================= TEST API (harmless) =================
        function makeApi(T0) {
            const toXZ = i => [i % GRID, Math.floor(i / GRID)];
            return {
                levels: LEVELS, loadMs: performance.now() - T0,
                state: () => ({ mode, phase, level: levelIdx, used: usedBlocks(), budget, lit: litNodes, nodes: nodeTotal, power, powerTarget, renders: stats.renders, rafPending: !!rafId, hover: hoverCell, kinds: Array.from(kind), tg: Array.from(tg) }),
                info: () => ({ geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, programs: renderer.info.programs.length, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }),
                setLevel: (n) => { gotoIndex(n); },
                setLevelNow: (n) => { if (n >= LEVELS.length) startSandbox({ instant: true, all: true }); else startLevel(n, { instant: true, all: true }); wake(0); },
                toggle: (x, z, right) => actOn(z * GRID + x, !!right),
                setPower: (p) => { power = powerTarget = p; applyPower(p); wake(0); },
                setGridLines: (v) => { gridLines = !!v; },
                holdWin: (v) => { holdWin = !!v; },
                lights: () => lights.map((l, k) => ({ i: slotCell[k], I: l.intensity, y: l.position.y })),
                screenOf: (x, z, top) => {
                    const v = new THREE.Vector3(CELL_X(z * GRID + x), top ? TOP_Y : FLOOR_Y, CELL_Z(z * GRID + x)).project(camera);
                    const r = renderer.domElement.getBoundingClientRect();
                    return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
                },
                pickAt: (x, y) => pick(x, y),
                cursor: () => ({ cell: hoverCell, top: hoverTop, amt: aDarr[Q_CURSOR * 16 + 1], y: posArr[Q_CURSOR * 12 + 1], x: posArr[Q_CURSOR * 12] + 0.4, z: posArr[Q_CURSOR * 12 + 2] + 0.4 }),
                ringCell: (x, z) => ringCell(z * GRID + x),
                renderOnce: () => { render(); },
                counts: () => ({ cubes: cubes.length, visible: cubes.filter(c => c.visible).length }),
                camera: () => camera.position.toArray(),
                fit: () => ({ fitD, dist: camera.position.length(), min: controls.minDistance, max: controls.maxDistance }),
                resetCamera: () => { camera.position.copy(DIR).multiplyScalar(fitD); controls.update(); wake(0); },
                setCamera: (x, y, z) => { camera.position.set(x, y, z); controls.update(); wake(0); },
            };
        }

        init().catch(err => { console.error(err); setProgress('Error: ' + err.message); });
    </script>
</body>
</html>
