<!DOCTYPE html>
<!-- prompt by _Neko (Katehuuh) on websim -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snow Riders - Prompt Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; color: #fff; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    canvas { display: block; }
    .panel {
      position: fixed; z-index: 10;
      padding: 8px 12px;
      color: #fff;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      font: 12px/1.4 monospace;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #hud-tl { top: 12px; left: 12px; min-width: 180px; }
    #hud-tr { top: 12px; right: 140px; min-width: 180px; }
    #minimap-wrap { position: fixed; top: 56px; right: 12px; z-index: 10;
      width: 158px; height: 158px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #minimap { width: 150px; height: 150px; display: block; border-radius: 6px; background: #0a0f1a; }
    #leaderboard { bottom: 12px; right: 12px; min-width: 200px; max-width: 240px; }
    #leaderboard h3 { margin: 0 0 4px 0; font: 600 12px/1.2 sans-serif; color: #93c5fd; letter-spacing: 0.4px; }
    #leaderboard ol { margin: 0; padding-left: 18px; }
    #leaderboard li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chat-wrap { position: fixed; bottom: 12px; left: 12px; z-index: 10;
      width: 320px;
      pointer-events: none;
    }
    #chat-msgs {
      display: flex; flex-direction: column-reverse;
      max-height: 180px; overflow: hidden;
      transition: opacity 0.6s ease;
    }
    .chat-msg {
      margin-top: 4px;
      padding: 4px 8px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      font: 12px/1.3 sans-serif;
      max-width: 100%;
      word-wrap: break-word;
    }
    .chat-msg .who { color: #93c5fd; font-weight: 600; margin-right: 4px; }
    #chat-input {
      pointer-events: auto;
      margin-top: 6px;
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      border: 1px solid rgba(147, 197, 253, 0.5);
      border-radius: 8px;
      font: 12px/1.3 sans-serif;
      outline: none;
      display: none;
    }
    #chat-input.active { display: block; }
    #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      font: 11px/1.2 sans-serif;
      color: #cbd5e1;
      pointer-events: none;
    }
    #copy-prompt {
      position: fixed; top: 12px; right: 12px; z-index: 11;
      padding: 10px 14px;
      color: #fff; background: rgba(29, 155, 240, 0.92);
      border: 0; border-radius: 999px;
      font: 600 12px/1.2 sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: background 0.15s, transform 0.1s;
    }
    #copy-prompt:hover { background: rgba(29, 155, 240, 1); }
    #copy-prompt:active { transform: scale(0.96); }
    #copy-prompt.copied { background: rgba(0, 186, 124, 0.95); }
    #toast {
      position: fixed; top: 56px; right: 12px; z-index: 12;
      padding: 8px 14px;
      color: #fff; background: rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      font: 13px/1.2 sans-serif;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateY(-8px);
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #loading {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      padding: 24px; color: #fff; text-align: center;
      background: radial-gradient(circle at center, rgba(20,30,50,0.96), rgba(0,0,5,0.98));
      font: 15px/1.45 sans-serif; letter-spacing: 0.3px;
      transition: opacity 0.2s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #93c5fd;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fatal {
      position: fixed; inset: 0; z-index: 30;
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.92);
      color: #fff;
      font: 14px/1.5 sans-serif;
      text-align: center;
    }
    #fatal.show { display: flex; }
    .row { display: flex; justify-content: space-between; gap: 10px; }
    .label { color: #93c5fd; }
    .pulse { color: #f59e0b; }
    .me-name { color: #fbbf24; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud-tl" class="panel">
    <div class="row"><span class="label">SPD</span><span id="hud-speed">0 km/h</span></div>
    <div class="row"><span class="label">TIME</span><span id="hud-time">00:00.00</span></div>
    <div class="row"><span class="label">GATE</span><span id="hud-gate">0 / 0</span></div>
    <div class="row"><span class="label">YOU</span><span id="hud-name" class="me-name">...</span></div>
  </div>

  <div id="hud-tr" class="panel">
    <div class="row"><span class="label">PEERS</span><span id="hud-peers">0</span></div>
    <div class="row"><span class="label">BEST</span><span id="hud-best">--:--.--</span></div>
    <div class="row"><span class="label">STATE</span><span id="hud-state">solo</span></div>
  </div>

  <div id="minimap-wrap"><canvas id="minimap" width="150" height="150"></canvas></div>

  <div id="leaderboard" class="panel">
    <h3>Leaderboard</h3>
    <ol id="lb-list"><li class="pulse">waiting...</li></ol>
  </div>

  <div id="chat-wrap">
    <div id="chat-msgs"></div>
    <input id="chat-input" type="text" maxlength="160" placeholder="Say something, Enter to send, Esc to cancel" />
  </div>

  <div id="help">WASD / arrows: ride &nbsp;&middot;&nbsp; Space: brake &nbsp;&middot;&nbsp; Shift: tuck &nbsp;&middot;&nbsp; Mouse drag: orbit &nbsp;&middot;&nbsp; T: chat &nbsp;&middot;&nbsp; R: respawn</div>

  <button id="copy-prompt" type="button">Copy prompt template</button>
  <div id="toast">Copied!</div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Carving fresh powder...</div>
  </div>

  <div id="fatal"><div id="fatal-msg"></div></div>

  <script type="module">
  "use strict";

  // --- Prompt template (verbatim) --------------------------------
  const PROMPT_TEMPLATE = `Create a web-based skiing/snowboarding game inspired by Lonely Mountains: Snow Riders with: CORE FEATURES: - Low-poly, procedural diorama-style 3D mountain environments - Physics-based skiing/snowboarding with momentum and realistic turning - Multiple paths and hidden shortcuts on each mountain - Time trials and trick-based challenges - Character customization and equipment progression - Simple multiplayer racing (2-8 players) and ghost data competition TECHNICAL IMPLEMENTATION: - Three.js for 3D rendering with optimized low-poly models - Physics engine (Cannon.js/Ammo.js) for realistic movement and crashes - Responsive controls for both desktop and mobile - WebSockets for basic multiplayer functionality - Dynamic snow effects (trails, powder spray) and particle systems GAMEPLAY MECHANICS: - Momentum-based skiing with different snow types affecting handling - Jump and trick system with mid-air controls and scoring - Quick respawn after crashes to maintain flow - Checkpoint system with time trials and exploration goals - Unlockable equipment that affects handling characteristics VISUAL & AUDIO STYLE: ultra realistic shader almost like ray tracing - Satisfying snow sounds that vary by speed and terrain - Ambient mountain audio and minimalist background music CREATE A GAME THAT BALANCES: - Challenge with relaxation - Accessibility with skill-based mastery - Competitive racing with peaceful exploration - Minimalist visuals with engaging gameplay Focus first on core physics and feel, then expand with additional features as development progresses. Think step by step longer and harder-deeper.`;

  // --- Copy prompt button ----------------------------------------
  const copyBtn = document.getElementById("copy-prompt");
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
  }
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(PROMPT_TEMPLATE);
      copyBtn.classList.add("copied");
      copyBtn.textContent = "Copied";
      showToast("Prompt copied to clipboard");
      setTimeout(() => { copyBtn.classList.remove("copied"); copyBtn.textContent = "Copy prompt template"; }, 1500);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = PROMPT_TEMPLATE;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("Prompt copied to clipboard"); }
      catch (_) { showToast("Copy failed - select manually"); }
      document.body.removeChild(ta);
    }
  });

  // --- Fatal error helper ----------------------------------------
  const fatalEl = document.getElementById("fatal");
  const fatalMsg = document.getElementById("fatal-msg");
  function fatal(msg) {
    fatalMsg.innerHTML = msg;
    fatalEl.classList.add("show");
    document.getElementById("loading").classList.add("hidden");
  }

  // --- Lib imports (try/catch each) ------------------------------
  let THREE, CANNON, GUN, createNoise2D;
  try {
    THREE = await import("https://esm.sh/three@0.161.0");
  } catch (e) {
    console.error(e);
    fatal("Failed to load Three.js. Check your internet connection.<br><br>" + (e.message || e));
    throw e;
  }
  try {
    CANNON = await import("https://esm.sh/cannon-es@0.20.0");
  } catch (e) {
    console.error(e);
    fatal("Failed to load cannon-es. Check your internet connection.<br><br>" + (e.message || e));
    throw e;
  }
  try {
    const sn = await import("https://esm.sh/simplex-noise@4.0.1");
    createNoise2D = sn.createNoise2D;
  } catch (e) {
    console.error(e);
    fatal("Failed to load simplex-noise.<br><br>" + (e.message || e));
    throw e;
  }
  // Gun is optional. Solo fallback if it fails.
  let gunOk = false, gun = null;
  try {
    const gunMod = await import("https://esm.sh/gun@0.2020.1240");
    GUN = gunMod.default || gunMod;
    if (typeof GUN === "function") {
      gun = GUN({ peers: ["https://gun-manhattan.herokuapp.com/gun"], localStorage: false, radisk: false });
      gunOk = true;
    } else {
      console.warn("Gun import shape unexpected, running solo.");
    }
  } catch (e) {
    console.warn("Gun.js failed to load, running solo:", e);
    gunOk = false;
  }

  // --- Constants -------------------------------------------------
  const TERRAIN_SIZE = 128;        // grid cells per side
  const CELL = 4;                  // meters per cell
  const HALF_W = TERRAIN_SIZE * CELL / 2;
  const MAX_HEIGHT = 90;
  const FIXED_DT = 1 / 120;
  const ROOM = "snowriders-v1";

  // --- Identity --------------------------------------------------
  const ADJ = ["Frosty","Silent","Brave","Powder","Pine","Glacial","Sunny","Wild","Crisp","Alpine","Snowy","Quiet","Bold","Drift","Whisker"];
  const NOUN = ["Yeti","Lynx","Marten","Falcon","Pika","Stag","Otter","Hare","Vixen","Badger","Owl","Wolf","Fox","Bear","Cat"];
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randomColor() {
    const palette = [0xef4444, 0xf59e0b, 0x10b981, 0x3b82f6, 0x8b5cf6, 0xec4899, 0xf97316, 0x06b6d4, 0xa3e635];
    return palette[Math.floor(Math.random() * palette.length)];
  }
  let myName = localStorage.getItem("snowriders.name");
  if (!myName) {
    myName = pick(ADJ) + " " + pick(NOUN);
    localStorage.setItem("snowriders.name", myName);
  }
  let myColorHex = parseInt(localStorage.getItem("snowriders.color") || "0", 10);
  if (!myColorHex) {
    myColorHex = randomColor();
    localStorage.setItem("snowriders.color", String(myColorHex));
  }
  const myId = (() => {
    let id = localStorage.getItem("snowriders.id");
    if (!id) {
      id = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      localStorage.setItem("snowriders.id", id);
    }
    return id;
  })();
  document.getElementById("hud-name").textContent = myName;

  // --- Three setup -----------------------------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbcd9ee);
  scene.fog = new THREE.Fog(0xbcd9ee, 80, 420);

  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1500);
  camera.position.set(0, 30, 30);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // Lights
  const hemi = new THREE.HemisphereLight(0xeaf3ff, 0x4a5b75, 0.65);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2d6, 1.15);
  sun.position.set(-180, 240, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sCam = sun.shadow.camera;
  sCam.left = -250; sCam.right = 250; sCam.top = 250; sCam.bottom = -250;
  sCam.near = 1; sCam.far = 700;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // --- Procedural terrain ----------------------------------------
  const noise2D = createNoise2D(() => 0.42);
  const noise2D_b = createNoise2D(() => 0.71);

  // heights[i][j] where i is X axis index, j is the second axis index used by cannon Heightfield.
  // The Heightfield body is rotated -PI/2 around X so its second axis maps to world -Z.
  const heights = new Array(TERRAIN_SIZE + 1);
  for (let i = 0; i <= TERRAIN_SIZE; i++) heights[i] = new Float32Array(TERRAIN_SIZE + 1);

  function radialFalloff(nx, nz) {
    // 0 at edges, 1 at center top of mountain
    const d = Math.sqrt(nx * nx + nz * nz);
    return Math.max(0, 1 - Math.pow(d, 1.6));
  }
  function ridge(x, z) {
    // 3-octave fbm
    let a = 0, amp = 1, freq = 1;
    for (let o = 0; o < 4; o++) {
      a += amp * noise2D(x * 0.012 * freq, z * 0.012 * freq);
      amp *= 0.5; freq *= 2.0;
    }
    return a; // ~[-1.875, 1.875]
  }
  function bumpDetail(x, z) {
    return 0.5 * noise2D_b(x * 0.07, z * 0.07) + 0.25 * noise2D_b(x * 0.18, z * 0.18);
  }

  // Build the heightmap. The mountain peak is biased toward +Z so the natural
  // ski direction is -Z (player starts near the top, descends toward -Z).
  const peakBiasZ = 0.35; // shift peak toward +Z
  for (let i = 0; i <= TERRAIN_SIZE; i++) {
    for (let j = 0; j <= TERRAIN_SIZE; j++) {
      const u = i / TERRAIN_SIZE - 0.5; // [-0.5, 0.5]
      const v = j / TERRAIN_SIZE - 0.5;
      // Convert grid -> world. Grid X = i, second axis = j.
      // After cannon rotation, heightfield's "j" axis becomes world -Z,
      // so larger j = larger -Z = further away in -Z. We want the peak at
      // small world Z (player descends toward +Z visually). Easier: just
      // pick the math so that after rotation the peak is near world +Z.
      const wx = u * 2; // [-1,1]
      const wz = v * 2;
      const fall = radialFalloff(wx, wz - peakBiasZ * 0.6);
      const r = ridge(i, j);
      const b = bumpDetail(i, j);
      let h = fall * MAX_HEIGHT + (r + 0.4) * 6 * fall + b * 1.4;
      // Carve a softer descent corridor along the visual slope
      // (a slight valley along x=0)
      const corridor = Math.exp(-Math.pow(wx * 4, 2)) * 4 * fall;
      h -= corridor;
      // Floor
      if (h < 0) h = 0;
      heights[i][j] = h;
    }
  }

  // Visual mesh from same data
  const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE * CELL, TERRAIN_SIZE * CELL, TERRAIN_SIZE, TERRAIN_SIZE);
  // Plane is created in XY plane facing +Z. We will rotate to XZ plane.
  // Vertex (i,j) of plane corresponds to grid (i,j).
  {
    const pos = terrainGeo.attributes.position;
    for (let j = 0; j <= TERRAIN_SIZE; j++) {
      for (let i = 0; i <= TERRAIN_SIZE; i++) {
        const idx = j * (TERRAIN_SIZE + 1) + i;
        // We want the visual mesh to match cannon's Heightfield orientation
        // after its rotation. Cannon Heightfield(data[i][j]) places elements
        // at local (i*element, j*element, data[i][j]). After body rotation
        // -PI/2 about X, local +Z becomes world +Y, local +Y becomes world -Z.
        // So world position of grid cell (i,j) is:
        //   world.x = i*CELL - HALF_W
        //   world.y = data[i][j]
        //   world.z = -(j*CELL - HALF_W)
        // For the plane, we set z (visual) to height and lay it via rotation.
        // We'll rotate the plane the same way cannon's body is rotated
        // (around X by -PI/2) so its built-in (x,y) become world (x,-z).
        pos.setZ(idx, heights[i][j]);
      }
    }
    terrainGeo.computeVertexNormals();
  }
  // Rotate terrain so it lies in XZ plane (matches heightfield rotation)
  terrainGeo.rotateX(-Math.PI / 2);

  // Snow material with subtle vertex tint (deeper = bluer)
  const colors = new Float32Array((TERRAIN_SIZE + 1) * (TERRAIN_SIZE + 1) * 3);
  {
    const pos = terrainGeo.attributes.position;
    for (let k = 0; k < pos.count; k++) {
      const y = pos.getY(k);
      // Higher = whiter, lower = slightly grey-blue
      const t = Math.min(1, Math.max(0, y / MAX_HEIGHT));
      const r = 0.93 + 0.05 * t;
      const g = 0.95 + 0.04 * t;
      const b = 0.97 + 0.03 * t;
      colors[k * 3] = r; colors[k * 3 + 1] = g; colors[k * 3 + 2] = b;
    }
  }
  terrainGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const snowMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.85,
    metalness: 0.0,
    flatShading: true
  });
  const terrainMesh = new THREE.Mesh(terrainGeo, snowMat);
  terrainMesh.receiveShadow = true;
  scene.add(terrainMesh);

  // --- Sample world height (mirrors cannon's local lookup) -------
  function sampleTerrainHeightAt(wx, wz) {
    // Inverse of: world.x = i*CELL - HALF_W ; world.z = -(j*CELL - HALF_W)
    const fi = (wx + HALF_W) / CELL;
    const fj = (-wz + HALF_W) / CELL;
    if (fi < 0 || fj < 0 || fi >= TERRAIN_SIZE || fj >= TERRAIN_SIZE) return 0;
    const i0 = Math.floor(fi), j0 = Math.floor(fj);
    const i1 = Math.min(i0 + 1, TERRAIN_SIZE);
    const j1 = Math.min(j0 + 1, TERRAIN_SIZE);
    const tx = fi - i0, tz = fj - j0;
    const h00 = heights[i0][j0];
    const h10 = heights[i1][j0];
    const h01 = heights[i0][j1];
    const h11 = heights[i1][j1];
    const a = h00 * (1 - tx) + h10 * tx;
    const b = h01 * (1 - tx) + h11 * tx;
    return a * (1 - tz) + b * tz;
  }

  // --- Cannon physics --------------------------------------------
  const world = new CANNON.World();
  world.gravity.set(0, -22, 0);
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = true;
  world.fixedTimeStep = FIXED_DT;

  const groundMat = new CANNON.Material("ground");
  const playerMat = new CANNON.Material("player");
  const treeMat = new CANNON.Material("tree");
  world.addContactMaterial(new CANNON.ContactMaterial(groundMat, playerMat, {
    friction: 0.06, restitution: 0.0
  }));
  world.addContactMaterial(new CANNON.ContactMaterial(treeMat, playerMat, {
    friction: 0.4, restitution: 0.05
  }));

  // Heightfield: pass 2D array data[i][j].
  const hfData = new Array(TERRAIN_SIZE + 1);
  for (let i = 0; i <= TERRAIN_SIZE; i++) {
    hfData[i] = new Array(TERRAIN_SIZE + 1);
    for (let j = 0; j <= TERRAIN_SIZE; j++) hfData[i][j] = heights[i][j];
  }
  const hfShape = new CANNON.Heightfield(hfData, { elementSize: CELL });
  const hfBody = new CANNON.Body({ mass: 0, material: groundMat });
  hfBody.addShape(hfShape);
  // Heightfield local origin sits at corner (i=0,j=0). Place corner at (-HALF_W, 0, +HALF_W)
  // and rotate -PI/2 about X so the j axis maps to world -Z.
  hfBody.position.set(-HALF_W, 0, HALF_W);
  hfBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
  world.addBody(hfBody);

  // --- Trees and rocks (instanced) -------------------------------
  const TREE_COUNT = 80;
  const ROCK_COUNT = 30;
  const treeBodies = [];
  // Trunks (cylinders) + cones for foliage
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 1.8, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1.0, flatShading: true });
  const foliageGeo = new THREE.ConeGeometry(1.6, 4.5, 7);
  const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.95, flatShading: true });
  const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
  const folInst = new THREE.InstancedMesh(foliageGeo, foliageMat, TREE_COUNT);
  trunkInst.castShadow = true; trunkInst.receiveShadow = true;
  folInst.castShadow = true; folInst.receiveShadow = true;
  scene.add(trunkInst); scene.add(folInst);

  const rockGeo = new THREE.OctahedronGeometry(1.0, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x7a8794, roughness: 1.0, flatShading: true });
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, ROCK_COUNT);
  rockInst.castShadow = true; rockInst.receiveShadow = true;
  scene.add(rockInst);

  // Use seeded picks (no Math.random in tick, but startup is fine).
  const tmpMat = new THREE.Matrix4();
  const tmpQ = new THREE.Quaternion();
  const tmpV = new THREE.Vector3();

  let placed = 0, attempts = 0;
  while (placed < TREE_COUNT && attempts < TREE_COUNT * 20) {
    attempts++;
    const wx = (Math.random() - 0.5) * (TERRAIN_SIZE - 6) * CELL;
    const wz = (Math.random() - 0.5) * (TERRAIN_SIZE - 6) * CELL;
    const h = sampleTerrainHeightAt(wx, wz);
    if (h < 4 || h > MAX_HEIGHT * 0.78) continue;
    // Avoid central corridor for clearer ski line
    if (Math.abs(wx) < 6 && Math.abs(wz) < 24 && Math.random() < 0.65) continue;
    const scale = 0.9 + Math.random() * 0.7;
    // Trunk
    tmpV.set(wx, h + 0.9 * scale, wz);
    tmpQ.identity();
    tmpMat.compose(tmpV, tmpQ, new THREE.Vector3(scale, scale, scale));
    trunkInst.setMatrixAt(placed, tmpMat);
    // Foliage on top
    tmpV.set(wx, h + 1.8 * scale + 2.2 * scale, wz);
    tmpMat.compose(tmpV, tmpQ, new THREE.Vector3(scale, scale, scale));
    folInst.setMatrixAt(placed, tmpMat);

    // Cannon body (sphere) for collision at trunk base
    const tb = new CANNON.Body({ mass: 0, material: treeMat });
    tb.addShape(new CANNON.Sphere(0.7 * scale));
    tb.position.set(wx, h + 1.0 * scale, wz);
    world.addBody(tb);
    treeBodies.push(tb);

    placed++;
  }
  trunkInst.count = placed; folInst.count = placed;
  trunkInst.instanceMatrix.needsUpdate = true;
  folInst.instanceMatrix.needsUpdate = true;

  let rPlaced = 0, rAttempts = 0;
  while (rPlaced < ROCK_COUNT && rAttempts < ROCK_COUNT * 20) {
    rAttempts++;
    const wx = (Math.random() - 0.5) * (TERRAIN_SIZE - 6) * CELL;
    const wz = (Math.random() - 0.5) * (TERRAIN_SIZE - 6) * CELL;
    const h = sampleTerrainHeightAt(wx, wz);
    if (h < 2 || h > MAX_HEIGHT * 0.95) continue;
    const scale = 0.6 + Math.random() * 1.2;
    tmpV.set(wx, h + 0.5 * scale, wz);
    tmpQ.setFromEuler(new THREE.Euler(Math.random() * 1.2, Math.random() * Math.PI * 2, Math.random() * 1.2));
    tmpMat.compose(tmpV, tmpQ, new THREE.Vector3(scale, scale * 0.7, scale));
    rockInst.setMatrixAt(rPlaced, tmpMat);
    rPlaced++;
  }
  rockInst.count = rPlaced;
  rockInst.instanceMatrix.needsUpdate = true;

  // --- Player ----------------------------------------------------
  // Capsule physics body (approximated with a sphere) - keep upright.
  const playerRadius = 0.7;
  const playerBody = new CANNON.Body({
    mass: 70,
    material: playerMat,
    fixedRotation: true,
    linearDamping: 0.04,
    angularDamping: 0.9
  });
  playerBody.addShape(new CANNON.Sphere(playerRadius));
  // Spawn near top of mountain (peak biased by peakBiasZ)
  const SPAWN_X = 0;
  const SPAWN_Z = -HALF_W * 0.35; // toward peak-biased side
  const spawnY = sampleTerrainHeightAt(SPAWN_X, SPAWN_Z) + 3;
  playerBody.position.set(SPAWN_X, spawnY, SPAWN_Z);
  playerBody.updateMassProperties();
  world.addBody(playerBody);

  // Visual skier (low-poly humanoid + skis)
  const skierGroup = new THREE.Group();
  scene.add(skierGroup);

  const outfitColor = new THREE.Color(myColorHex);
  const skinColor = new THREE.Color(0xf4d3b5);
  const skiColor = new THREE.Color(0x101524);

  function buildSkier(group, outfit) {
    // body
    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 1.0, 0.45),
      new THREE.MeshStandardMaterial({ color: outfit, roughness: 0.7, flatShading: true })
    );
    torso.position.y = 0.5;
    torso.castShadow = true;
    group.add(torso);
    // head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 8, 6),
      new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.9, flatShading: true })
    );
    head.position.y = 1.25;
    head.castShadow = true;
    group.add(head);
    // legs
    const legGeo = new THREE.BoxGeometry(0.28, 0.7, 0.28);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x202736, roughness: 0.8, flatShading: true });
    const lL = new THREE.Mesh(legGeo, legMat); lL.position.set(-0.18, -0.35, 0); lL.castShadow = true; group.add(lL);
    const lR = new THREE.Mesh(legGeo, legMat); lR.position.set( 0.18, -0.35, 0); lR.castShadow = true; group.add(lR);
    // arms
    const armGeo = new THREE.BoxGeometry(0.22, 0.7, 0.22);
    const armMat = new THREE.MeshStandardMaterial({ color: outfit, roughness: 0.7, flatShading: true });
    const aL = new THREE.Mesh(armGeo, armMat); aL.position.set(-0.45, 0.55, 0); aL.castShadow = true; group.add(aL);
    const aR = new THREE.Mesh(armGeo, armMat); aR.position.set( 0.45, 0.55, 0); aR.castShadow = true; group.add(aR);
    // skis (two long boxes)
    const skiGeo = new THREE.BoxGeometry(0.14, 0.06, 1.8);
    const skiMat = new THREE.MeshStandardMaterial({ color: skiColor, roughness: 0.5, metalness: 0.2, flatShading: true });
    const skiL = new THREE.Mesh(skiGeo, skiMat); skiL.position.set(-0.18, -0.74, 0.1); skiL.castShadow = true; group.add(skiL);
    const skiR = new THREE.Mesh(skiGeo, skiMat); skiR.position.set( 0.18, -0.74, 0.1); skiR.castShadow = true; group.add(skiR);
  }
  buildSkier(skierGroup, outfitColor);

  // --- Trail -----------------------------------------------------
  const TRAIL_LEN = 60;
  const trailPositions = new Float32Array(TRAIL_LEN * 3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  const trailLine = new THREE.Line(trailGeo, trailMat);
  scene.add(trailLine);
  let trailHead = 0;
  let trailLastT = 0;

  // --- Powder spray (instanced billboards) -----------------------
  const PARTICLES = 80;
  const sprayGeo = new THREE.PlaneGeometry(0.5, 0.5);
  const sprayMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false });
  const sprayInst = new THREE.InstancedMesh(sprayGeo, sprayMat, PARTICLES);
  sprayInst.frustumCulled = false;
  scene.add(sprayInst);
  const sprayState = []; // {pos, vel, life, max, scale}
  for (let i = 0; i < PARTICLES; i++) sprayState.push({ pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, max: 0, scale: 0 });
  let sprayIdx = 0;
  const _hideMat = new THREE.Matrix4().makeScale(0, 0, 0);
  for (let i = 0; i < PARTICLES; i++) sprayInst.setMatrixAt(i, _hideMat);
  sprayInst.instanceMatrix.needsUpdate = true;

  function emitSpray(x, y, z, dirX, dirZ, intensity) {
    const count = Math.min(6, 2 + Math.floor(intensity * 4));
    for (let k = 0; k < count; k++) {
      const s = sprayState[sprayIdx];
      sprayIdx = (sprayIdx + 1) % PARTICLES;
      s.pos.set(x, y, z);
      s.vel.set(
        -dirX * (0.5 + Math.random() * 1.5) + (Math.random() - 0.5) * 1.6,
        1.4 + Math.random() * 1.5,
        -dirZ * (0.5 + Math.random() * 1.5) + (Math.random() - 0.5) * 1.6
      );
      s.life = 0;
      s.max = 0.45 + Math.random() * 0.2;
      s.scale = 0.6 + Math.random() * 0.6;
    }
  }

  // --- Checkpoints -----------------------------------------------
  const NUM_GATES = 7;
  const gates = [];
  // Lay gates from spawn (roughly z=-HALF_W*0.35) descending toward +Z.
  // Find a roughly steepest-descent path by sampling.
  function buildGates() {
    let cx = SPAWN_X, cz = SPAWN_Z + 8;
    for (let i = 0; i < NUM_GATES; i++) {
      // Search forward in +Z for downhill direction
      const stepZ = (HALF_W * 0.7) / NUM_GATES;
      let bestDx = 0, bestH = sampleTerrainHeightAt(cx, cz + stepZ);
      for (let k = -3; k <= 3; k++) {
        const tx = cx + k * 6;
        if (Math.abs(tx) > HALF_W * 0.45) continue;
        const th = sampleTerrainHeightAt(tx, cz + stepZ);
        if (th < bestH) { bestH = th; bestDx = k * 6; }
      }
      cx = Math.max(-HALF_W * 0.45, Math.min(HALF_W * 0.45, cx + bestDx * 0.5));
      cz = cz + stepZ;
      const h = sampleTerrainHeightAt(cx, cz);
      gates.push({ x: cx, y: h + 1.5, z: cz, hit: false });
    }
  }
  buildGates();

  const gateGroup = new THREE.Group();
  scene.add(gateGroup);
  const gateMats = [];
  for (let i = 0; i < gates.length; i++) {
    const g = gates[i];
    const ringGeo = new THREE.TorusGeometry(2.4, 0.18, 8, 24);
    const m = new THREE.MeshStandardMaterial({ color: i === 0 ? 0xfde047 : 0x60a5fa, emissive: i === 0 ? 0x664400 : 0x102b55, roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0.9 });
    const ring = new THREE.Mesh(ringGeo, m);
    ring.position.set(g.x, g.y, g.z);
    ring.rotation.x = Math.PI / 2;
    ring.castShadow = false; ring.receiveShadow = false;
    gateGroup.add(ring);
    gateMats.push({ mat: m, mesh: ring });
  }

  // --- Camera orbit input ----------------------------------------
  const camState = { yaw: 0, pitch: 0.45, dist: 14 };
  let dragging = false; let lastX = 0, lastY = 0;
  renderer.domElement.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("mouseup", () => { dragging = false; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    camState.yaw -= (e.clientX - lastX) * 0.005;
    camState.pitch = Math.max(0.05, Math.min(0.9, camState.pitch + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener("wheel", (e) => {
    camState.dist = Math.max(8, Math.min(28, camState.dist + e.deltaY * 0.02));
  }, { passive: true });

  // --- Keyboard --------------------------------------------------
  const keys = {};
  let chatOpen = false;
  const chatInput = document.getElementById("chat-input");
  window.addEventListener("keydown", (e) => {
    if (chatOpen) {
      if (e.key === "Enter") { sendChat(chatInput.value.trim()); closeChat(); e.preventDefault(); }
      else if (e.key === "Escape") { closeChat(); e.preventDefault(); }
      return;
    }
    if (e.key === "t" || e.key === "T") { openChat(); e.preventDefault(); return; }
    if (e.key === "r" || e.key === "R") { respawn(); e.preventDefault(); return; }
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  function openChat() {
    chatOpen = true;
    chatInput.classList.add("active");
    chatInput.value = "";
    setTimeout(() => chatInput.focus(), 0);
  }
  function closeChat() {
    chatOpen = false;
    chatInput.classList.remove("active");
    chatInput.value = "";
    renderer.domElement.focus();
  }

  // --- Heading + steering ----------------------------------------
  let headingAngle = 0; // radians, 0 = facing +Z
  let crashed = false;
  let crashTimer = 0;

  // --- Web audio (wind + scrape) ---------------------------------
  let audioCtx = null, windNode = null, windGain = null, scrapeGain = null;
  function ensureAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Wind: white noise -> lowpass -> gain
      const bufSize = 2 * audioCtx.sampleRate;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      windNode = audioCtx.createBufferSource();
      windNode.buffer = buf;
      windNode.loop = true;
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 600;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windNode.connect(lp).connect(windGain).connect(audioCtx.destination);
      windNode.start();

      // Scrape: separate noise -> bandpass
      const scrapeNode = audioCtx.createBufferSource();
      const buf2 = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d2 = buf2.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d2[i] = Math.random() * 2 - 1;
      scrapeNode.buffer = buf2; scrapeNode.loop = true;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 0.7;
      scrapeGain = audioCtx.createGain();
      scrapeGain.gain.value = 0.0;
      scrapeNode.connect(bp).connect(scrapeGain).connect(audioCtx.destination);
      scrapeNode.start();
    } catch (e) {
      console.warn("Audio init failed:", e);
    }
  }
  // Resume on first user interaction
  const resumeAudio = () => { ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); window.removeEventListener("pointerdown", resumeAudio); window.removeEventListener("keydown", resumeAudio); };
  window.addEventListener("pointerdown", resumeAudio);
  window.addEventListener("keydown", resumeAudio);

  // --- Run state -------------------------------------------------
  let runActive = false;
  let runStart = 0;
  let runFinished = false;
  let lastFinishTime = 0;
  const bestKey = "snowriders.best";
  const bestPathKey = "snowriders.bestpath";
  let bestTime = parseFloat(localStorage.getItem(bestKey) || "0") || 0;
  let bestPath = [];
  try { bestPath = JSON.parse(localStorage.getItem(bestPathKey) || "[]"); } catch { bestPath = []; }
  function fmtTime(s) {
    if (!s || s <= 0) return "--:--.--";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    const ms = Math.floor((s - Math.floor(s)) * 100);
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}.${String(ms).padStart(2, "0")}`;
  }
  function setHudBest() { document.getElementById("hud-best").textContent = fmtTime(bestTime); }
  setHudBest();

  // Track current run path for ghost recording
  let runPath = [];
  let runPathLastT = 0;

  function startRun() {
    runActive = true;
    runStart = performance.now() / 1000;
    runFinished = false;
    runPath = [];
    runPathLastT = 0;
    for (const g of gates) g.hit = false;
    updateGateColors();
  }
  function finishRun() {
    runActive = false;
    runFinished = true;
    const t = performance.now() / 1000 - runStart;
    lastFinishTime = t;
    if (!bestTime || t < bestTime) {
      bestTime = t;
      localStorage.setItem(bestKey, String(bestTime));
      try { localStorage.setItem(bestPathKey, JSON.stringify(runPath)); } catch {}
      bestPath = runPath.slice();
      showToast("New personal best: " + fmtTime(t));
    } else {
      showToast("Run: " + fmtTime(t));
    }
    setHudBest();
    // Push to leaderboard
    if (gunOk && gun) {
      try {
        gun.get("snowriders").get(ROOM).get("leaderboard").set({
          name: myName, time: t, ts: Date.now()
        });
      } catch (e) { console.warn("leaderboard push failed", e); }
    } else {
      // local-only leaderboard fallback
      const local = JSON.parse(localStorage.getItem("snowriders.localLb") || "[]");
      local.push({ name: myName, time: t, ts: Date.now() });
      local.sort((a, b) => a.time - b.time);
      localStorage.setItem("snowriders.localLb", JSON.stringify(local.slice(0, 10)));
      renderLeaderboard(local);
    }
  }

  function updateGateColors() {
    let nextIdx = gates.findIndex(g => !g.hit);
    if (nextIdx < 0) nextIdx = gates.length;
    for (let i = 0; i < gates.length; i++) {
      const g = gates[i];
      const m = gateMats[i].mat;
      if (g.hit) {
        m.color.setHex(0x10b981); m.emissive.setHex(0x033728); m.opacity = 0.5;
      } else if (i === nextIdx) {
        m.color.setHex(0xfde047); m.emissive.setHex(0x664400); m.opacity = 0.95;
      } else {
        m.color.setHex(0x60a5fa); m.emissive.setHex(0x102b55); m.opacity = 0.85;
      }
    }
  }
  updateGateColors();

  function respawn() {
    const y = sampleTerrainHeightAt(SPAWN_X, SPAWN_Z) + 3;
    playerBody.position.set(SPAWN_X, y, SPAWN_Z);
    playerBody.velocity.set(0, 0, 0);
    playerBody.angularVelocity.set(0, 0, 0);
    headingAngle = 0;
    crashed = false; crashTimer = 0;
    runActive = false; runFinished = false;
    for (const g of gates) g.hit = false;
    updateGateColors();
  }

  // --- Ghost replay ----------------------------------------------
  const ghostGroup = new THREE.Group();
  scene.add(ghostGroup);
  const ghostMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.4 });
  buildGhost(ghostGroup);
  function buildGhost(group) {
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.45), ghostMat);
    torso.position.y = 0.5; group.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), ghostMat);
    head.position.y = 1.25; group.add(head);
    const skiL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 1.8), ghostMat); skiL.position.set(-0.18, -0.74, 0.1); group.add(skiL);
    const skiR = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 1.8), ghostMat); skiR.position.set( 0.18, -0.74, 0.1); group.add(skiR);
  }
  let ghostStart = 0;
  function updateGhost(now) {
    if (!runActive || !bestPath || bestPath.length < 2) {
      ghostGroup.visible = false;
      return;
    }
    ghostGroup.visible = true;
    const t = now / 1000 - runStart;
    // Find frame
    let i = 0;
    while (i < bestPath.length - 1 && bestPath[i + 1].t <= t) i++;
    if (i >= bestPath.length - 1) {
      const f = bestPath[bestPath.length - 1];
      ghostGroup.position.set(f.x, f.y, f.z);
      ghostGroup.rotation.y = f.h;
    } else {
      const a = bestPath[i], b = bestPath[i + 1];
      const tt = (t - a.t) / (b.t - a.t);
      ghostGroup.position.set(
        a.x + (b.x - a.x) * tt,
        a.y + (b.y - a.y) * tt,
        a.z + (b.z - a.z) * tt
      );
      ghostGroup.rotation.y = a.h + (b.h - a.h) * tt;
    }
  }

  // --- Gun multiplayer -------------------------------------------
  const peers = new Map(); // id -> {x,y,z,heading,speed,name,color, ts, mesh, target:{x,y,z,h}}
  let lastPresence = 0;
  let lbCache = new Map(); // key (id) -> {name, time, ts}

  function renderLeaderboard(list) {
    const ol = document.getElementById("lb-list");
    ol.innerHTML = "";
    list.slice(0, 5).forEach((row, i) => {
      const li = document.createElement("li");
      li.textContent = `${row.name || "anon"}  ${fmtTime(row.time)}`;
      ol.appendChild(li);
    });
    if (list.length === 0) {
      const li = document.createElement("li"); li.textContent = "no times yet"; li.className = "pulse"; ol.appendChild(li);
    }
  }

  function setupGun() {
    if (!gunOk || !gun) {
      // local fallback render
      const local = JSON.parse(localStorage.getItem("snowriders.localLb") || "[]");
      renderLeaderboard(local);
      document.getElementById("hud-state").textContent = "solo";
      return;
    }
    document.getElementById("hud-state").textContent = "online";

    // Subscribe to leaderboard
    try {
      gun.get("snowriders").get(ROOM).get("leaderboard").map().on((data, key) => {
        if (!data) { lbCache.delete(key); return; }
        if (typeof data.time !== "number") return;
        lbCache.set(key, { name: String(data.name || "anon").slice(0, 24), time: data.time, ts: data.ts || 0 });
        const arr = Array.from(lbCache.values()).filter(r => r.time > 0).sort((a, b) => a.time - b.time);
        renderLeaderboard(arr);
      });
    } catch (e) { console.warn(e); }

    // Subscribe to chat
    try {
      gun.get("snowriders").get(ROOM).get("chat").map().on((data, key) => {
        if (!data || !data.msg) return;
        addChatLine(String(data.name || "anon").slice(0, 24), String(data.msg).slice(0, 240), data.ts || 0);
      });
    } catch (e) { console.warn(e); }

    // Subscribe to player presence
    try {
      gun.get("snowriders").get(ROOM).get("players").map().on((data, key) => {
        if (!data || key === myId) return;
        if (typeof data.x !== "number") return;
        if (Date.now() - (data.ts || 0) > 8000) return; // stale
        let p = peers.get(key);
        if (!p) {
          p = {
            id: key, name: String(data.name || "rider").slice(0, 24), color: data.color | 0,
            target: { x: data.x, y: data.y, z: data.z, h: data.heading || 0 },
            current: { x: data.x, y: data.y, z: data.z, h: data.heading || 0 },
            speed: data.speed || 0, ts: data.ts || 0, mesh: null
          };
          const g = new THREE.Group();
          buildSkier(g, new THREE.Color(p.color || 0xffffff));
          scene.add(g);
          p.mesh = g;
          peers.set(key, p);
        } else {
          p.target.x = data.x; p.target.y = data.y; p.target.z = data.z; p.target.h = data.heading || 0;
          p.speed = data.speed || 0; p.ts = data.ts || 0;
          p.name = String(data.name || p.name).slice(0, 24);
          if (data.color) p.color = data.color | 0;
        }
      });
    } catch (e) { console.warn(e); }
  }
  setupGun();

  function pruneStalePeers() {
    const now = Date.now();
    for (const [id, p] of peers) {
      if (now - p.ts > 9000) {
        scene.remove(p.mesh);
        peers.delete(id);
      }
    }
    document.getElementById("hud-peers").textContent = String(peers.size);
  }

  // --- Chat ------------------------------------------------------
  const chatBox = document.getElementById("chat-msgs");
  const chatLines = []; // {name,msg,ts,el}
  const seenChat = new Set();
  let lastChatTs = 0;
  function addChatLine(name, msg, ts) {
    const key = `${name}|${msg}|${ts}`;
    if (seenChat.has(key)) return;
    seenChat.add(key);
    const div = document.createElement("div");
    div.className = "chat-msg";
    const w = document.createElement("span"); w.className = "who"; w.textContent = name + ":";
    const m = document.createElement("span"); m.textContent = " " + msg;
    div.appendChild(w); div.appendChild(m);
    chatBox.insertBefore(div, chatBox.firstChild);
    chatLines.unshift({ name, msg, ts, el: div });
    while (chatLines.length > 30) {
      const old = chatLines.pop();
      if (old.el && old.el.parentNode) old.el.parentNode.removeChild(old.el);
    }
    lastChatTs = performance.now();
    chatBox.style.opacity = "1";
  }
  function sendChat(text) {
    if (!text) return;
    if (gunOk && gun) {
      try {
        gun.get("snowriders").get(ROOM).get("chat").set({
          name: myName, msg: text, ts: Date.now()
        });
      } catch (e) {
        console.warn(e);
        addChatLine(myName, text, Date.now()); // local echo
      }
    } else {
      addChatLine(myName, text, Date.now());
    }
  }

  // --- Minimap ---------------------------------------------------
  const mmCanvas = document.getElementById("minimap");
  const mmCtx = mmCanvas.getContext("2d");
  // Pre-render mountain heightmap as base
  const mmBase = document.createElement("canvas");
  mmBase.width = 150; mmBase.height = 150;
  {
    const ctx = mmBase.getContext("2d");
    const img = ctx.createImageData(150, 150);
    for (let py = 0; py < 150; py++) {
      for (let px = 0; px < 150; px++) {
        // map px/py to grid i,j
        const i = Math.floor(px / 150 * TERRAIN_SIZE);
        const j = Math.floor((1 - py / 150) * TERRAIN_SIZE); // flip so peak appears at top
        const h = heights[i] && heights[i][j] != null ? heights[i][j] : 0;
        const t = Math.max(0, Math.min(1, h / MAX_HEIGHT));
        const o = (py * 150 + px) * 4;
        img.data[o]   = 60 + t * 195;
        img.data[o+1] = 80 + t * 175;
        img.data[o+2] = 120 + t * 135;
        img.data[o+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    // Outline gates
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1;
    for (let i = 0; i < gates.length; i++) {
      const g = gates[i];
      const px = ((g.x + HALF_W) / (TERRAIN_SIZE * CELL)) * 150;
      const py = (1 - ((-g.z + HALF_W) / (TERRAIN_SIZE * CELL))) * 150;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawMinimap() {
    mmCtx.drawImage(mmBase, 0, 0);
    // peers
    for (const [, p] of peers) {
      const px = ((p.current.x + HALF_W) / (TERRAIN_SIZE * CELL)) * 150;
      const py = (1 - ((-p.current.z + HALF_W) / (TERRAIN_SIZE * CELL))) * 150;
      mmCtx.fillStyle = "#" + (p.color || 0xffffff).toString(16).padStart(6, "0");
      mmCtx.beginPath(); mmCtx.arc(px, py, 2.5, 0, Math.PI * 2); mmCtx.fill();
    }
    // me
    const px = ((playerBody.position.x + HALF_W) / (TERRAIN_SIZE * CELL)) * 150;
    const py = (1 - ((-playerBody.position.z + HALF_W) / (TERRAIN_SIZE * CELL))) * 150;
    mmCtx.fillStyle = "#fbbf24";
    mmCtx.beginPath(); mmCtx.arc(px, py, 4, 0, Math.PI * 2); mmCtx.fill();
    mmCtx.strokeStyle = "rgba(0,0,0,0.6)";
    mmCtx.lineWidth = 1.5;
    mmCtx.stroke();
  }

  // --- Resize ----------------------------------------------------
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // --- Hide loading overlay --------------------------------------
  const loadingEl = document.getElementById("loading");
  setTimeout(() => loadingEl.classList.add("hidden"), 60);

  // --- Main loop -------------------------------------------------
  const clock = new THREE.Clock();
  let lastNow = performance.now();
  let lastTunnelCheck = 0;

  function update(dt, now) {
    if (crashed) {
      crashTimer += dt;
      if (crashTimer > 1.2) respawn();
    }

    // Inputs
    const turn = (keys["a"] || keys["arrowleft"]) ? 1 : (keys["d"] || keys["arrowright"]) ? -1 : 0;
    const forward = (keys["w"] || keys["arrowup"]);
    const braking = keys[" "] || keys["space"];
    const tucking = keys["shift"];

    // Steering: rotate headingAngle, apply carving lerp on velocity
    const turnRate = 1.8; // rad/s
    if (turn !== 0 && !crashed) {
      headingAngle += turn * turnRate * dt;
      // Carving: lerp velocity toward forward direction with same magnitude
      const v = playerBody.velocity;
      const speedH = Math.hypot(v.x, v.z);
      if (speedH > 0.5) {
        const fwdX = Math.sin(headingAngle), fwdZ = Math.cos(headingAngle);
        const targetX = fwdX * speedH, targetZ = fwdZ * speedH;
        const k = 0.10;
        v.x = v.x + (targetX - v.x) * k;
        v.z = v.z + (targetZ - v.z) * k;
      }
    }

    // Forward boost
    if (forward && !crashed) {
      const fwdX = Math.sin(headingAngle), fwdZ = Math.cos(headingAngle);
      const F = 220; // newtons-ish (mass 70)
      playerBody.applyForce(new CANNON.Vec3(fwdX * F, 0, fwdZ * F), playerBody.position);
    }

    // Brake
    if (braking && !crashed) {
      playerBody.velocity.x *= Math.pow(0.85, dt * 60);
      playerBody.velocity.z *= Math.pow(0.85, dt * 60);
    }

    // Tuck = lower drag
    playerBody.linearDamping = tucking ? 0.005 : 0.04;

    // Step physics with substeps
    world.step(FIXED_DT, dt, 8);

    // Failsafe: tunneling check
    lastTunnelCheck += dt;
    if (lastTunnelCheck > 0.05) {
      lastTunnelCheck = 0;
      const px = playerBody.position.x, pz = playerBody.position.z;
      const groundH = sampleTerrainHeightAt(px, pz);
      if (playerBody.position.y < groundH - 4) {
        playerBody.position.set(px, groundH + 2, pz);
        playerBody.velocity.set(0, 0, 0);
      }
      // Out of bounds -> respawn
      if (Math.abs(px) > HALF_W * 0.95 || Math.abs(pz) > HALF_W * 0.95 || playerBody.position.y < -50) {
        respawn();
      }
    }

    // Sync visual
    skierGroup.position.copy(playerBody.position);
    skierGroup.position.y -= playerRadius - 0.05;
    skierGroup.rotation.y = headingAngle;
    // Lean visual based on lateral velocity
    const v = playerBody.velocity;
    const localRight = { x: Math.cos(headingAngle), z: -Math.sin(headingAngle) };
    const lat = v.x * localRight.x + v.z * localRight.z;
    skierGroup.rotation.z = Math.max(-0.4, Math.min(0.4, -lat * 0.05));

    // Camera follow (orbit around player)
    const targetYaw = headingAngle + camState.yaw;
    const cd = camState.dist;
    const cy = Math.cos(camState.pitch) * cd;
    const cyy = Math.sin(camState.pitch) * cd;
    const cx = Math.sin(targetYaw) * cy;
    const cz = Math.cos(targetYaw) * cy;
    const desired = new THREE.Vector3(
      playerBody.position.x - cx,
      playerBody.position.y + cyy + 2,
      playerBody.position.z - cz
    );
    camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
    camera.lookAt(playerBody.position.x, playerBody.position.y + 1, playerBody.position.z);

    // Speed in km/h
    const speed = Math.hypot(v.x, v.z);
    document.getElementById("hud-speed").textContent = (speed * 3.6).toFixed(0) + " km/h";

    // Auto-start run on first sustained motion
    if (!runActive && !runFinished && speed > 4) {
      startRun();
    }
    if (runActive) {
      const t = now / 1000 - runStart;
      document.getElementById("hud-time").textContent = fmtTime(t);
      // Record path every ~80ms
      if (t - runPathLastT > 0.08) {
        runPathLastT = t;
        runPath.push({ t, x: playerBody.position.x, y: playerBody.position.y - playerRadius + 0.05, z: playerBody.position.z, h: headingAngle });
        if (runPath.length > 1500) runPath.shift();
      }
    }

    // Gate detection (in order)
    let nextIdx = gates.findIndex(g => !g.hit);
    if (nextIdx >= 0) {
      const g = gates[nextIdx];
      const dx = playerBody.position.x - g.x;
      const dz = playerBody.position.z - g.z;
      const dy = playerBody.position.y - g.y;
      if (dx * dx + dz * dz < 9 && Math.abs(dy) < 4) {
        g.hit = true;
        updateGateColors();
        if (gates.every(gg => gg.hit)) {
          finishRun();
        }
      }
    }
    document.getElementById("hud-gate").textContent = `${gates.filter(g => g.hit).length} / ${gates.length}`;

    // Trail
    if (now - trailLastT > 60 && speed > 1.5) {
      trailLastT = now;
      const wp = trailPositions;
      const head = trailHead;
      wp[head * 3] = playerBody.position.x;
      wp[head * 3 + 1] = (sampleTerrainHeightAt(playerBody.position.x, playerBody.position.z) + 0.06);
      wp[head * 3 + 2] = playerBody.position.z;
      trailHead = (trailHead + 1) % TRAIL_LEN;
      trailGeo.attributes.position.needsUpdate = true;
    }

    // Powder spray emission
    if (!crashed && speed > 5 && (Math.abs(turn) > 0 || braking)) {
      const groundH = sampleTerrainHeightAt(playerBody.position.x, playerBody.position.z);
      const fwdX = Math.sin(headingAngle), fwdZ = Math.cos(headingAngle);
      emitSpray(playerBody.position.x, groundH + 0.1, playerBody.position.z, fwdX, fwdZ, Math.min(1, speed / 18));
    }

    // Update particles
    for (let i = 0; i < PARTICLES; i++) {
      const s = sprayState[i];
      if (s.life >= s.max) {
        sprayInst.setMatrixAt(i, _hideMat);
        continue;
      }
      s.life += dt;
      s.pos.x += s.vel.x * dt;
      s.pos.y += s.vel.y * dt;
      s.pos.z += s.vel.z * dt;
      s.vel.y -= 6 * dt; // gravity
      const k = 1 - s.life / s.max;
      const m = new THREE.Matrix4();
      m.compose(s.pos, camera.quaternion, new THREE.Vector3(s.scale * (1 + (1 - k) * 0.6), s.scale * (1 + (1 - k) * 0.6), s.scale));
      sprayInst.setMatrixAt(i, m);
    }
    sprayInst.instanceMatrix.needsUpdate = true;

    // Audio modulation
    if (audioCtx && windGain) {
      const target = Math.min(0.15, speed * 0.005);
      windGain.gain.value = windGain.gain.value + (target - windGain.gain.value) * 0.1;
      const lp = windNode.context;
      // (filter freq mod skipped for simplicity)
    }
    if (audioCtx && scrapeGain) {
      // ground contact heuristic: y close to terrain
      const groundH = sampleTerrainHeightAt(playerBody.position.x, playerBody.position.z);
      const onGround = (playerBody.position.y - playerRadius - groundH) < 0.4;
      const target = (onGround && speed > 5) ? Math.min(0.07, (speed - 5) * 0.004) : 0.0;
      scrapeGain.gain.value = scrapeGain.gain.value + (target - scrapeGain.gain.value) * 0.15;
    }

    // Peer interpolation + rendering
    for (const [, p] of peers) {
      const k = 0.18;
      p.current.x += (p.target.x - p.current.x) * k;
      p.current.y += (p.target.y - p.current.y) * k;
      p.current.z += (p.target.z - p.current.z) * k;
      // angle lerp (shortest path)
      let dh = p.target.h - p.current.h;
      while (dh > Math.PI) dh -= Math.PI * 2;
      while (dh < -Math.PI) dh += Math.PI * 2;
      p.current.h += dh * k;
      if (p.mesh) {
        p.mesh.position.set(p.current.x, p.current.y - playerRadius + 0.05, p.current.z);
        p.mesh.rotation.y = p.current.h;
      }
    }

    // Send presence
    if (gunOk && gun && now - lastPresence > 80) {
      lastPresence = now;
      try {
        gun.get("snowriders").get(ROOM).get("players").get(myId).put({
          x: playerBody.position.x,
          y: playerBody.position.y,
          z: playerBody.position.z,
          heading: headingAngle,
          speed,
          name: myName,
          color: myColorHex,
          ts: Date.now()
        });
      } catch (e) { /* ignore */ }
    }

    // Prune + minimap + ghost + chat fade
    if (Math.floor(now / 1000) !== Math.floor((now - dt * 1000) / 1000)) {
      pruneStalePeers();
    }
    drawMinimap();
    updateGhost(now);
    if (performance.now() - lastChatTs > 10000) {
      chatBox.style.opacity = "0.15";
    }

    // Crash detection: hit a tree fast
    if (!crashed) {
      for (const tb of treeBodies) {
        const tdx = tb.position.x - playerBody.position.x;
        const tdz = tb.position.z - playerBody.position.z;
        const tdy = tb.position.y - playerBody.position.y;
        const distSq = tdx * tdx + tdz * tdz + tdy * tdy;
        if (distSq < 1.6 && speed > 8) {
          crashed = true;
          crashTimer = 0;
          showToast("Crash! respawning...");
          break;
        }
      }
    }
  }

  function loop() {
    const now = performance.now();
    let dt = (now - lastNow) / 1000;
    lastNow = now;
    dt = Math.min(0.1, dt);
    update(dt, now);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // expose for debugging
  window.__snowriders = { world, playerBody, sampleTerrainHeightAt, gates, peers };

  </script>
</body>
