<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.161.0",
    "simplex-noise": "https://esm.sh/simplex-noise@4.0.1",
    "gun": "https://esm.sh/gun@0.2020.1240"
  }
}
</script>
<script type="module">
"use strict";

import * as THREE from "three";
import { createNoise2D } from "simplex-noise";

// ============================================================
// Constants
// ============================================================
const TERRAIN_RADIUS = 220;     // half-extent of visible terrain in metres
const TERRAIN_VERTS = 161;      // grid resolution (must be odd)
const TERRAIN_STEP = (TERRAIN_RADIUS * 2) / (TERRAIN_VERTS - 1);

const PEAK_HEIGHT = 110;        // metres at center
const SPAWN_OFFSET_Z = 0;       // spawn at peak (0, peakY, 0)

const GRAVITY = 22;             // m/s^2 (tuned, not earth)
const PUSH_FORCE = 14;          // forward kick on W
const TURN_SPEED = 1.7;         // rad/s
const MAX_SPEED = 80;           // hard cap m/s
const SNOW_FRICTION = 0.992;    // tangent multiplier each step
const TUCK_FRICTION = 0.998;    // less drag while tucking
const BRAKE_FRICTION = 0.86;    // strong drag while braking
const CARVE_LERP = 0.05;        // how strongly velocity rotates toward heading
const RESPAWN_BELOW = -30;      // y threshold for falling-off failsafe

const NUM_CHECKPOINTS = 7;
const NUM_TREES = 220;
const NUM_ROCKS = 60;

const PLAYER_RADIUS = 0.55;
const TREE_RADIUS = 0.7;
const ROCK_RADIUS = 0.9;

// ============================================================
// Identity (auto-assigned, persisted in localStorage)
// ============================================================
const ADJ = ["Crimson", "Indigo", "Solar", "Lunar", "Velvet", "Stoic", "Brave", "Quiet", "Cosmic", "Glass", "Iron", "Neon", "Frost", "Bright", "Hollow", "Nimble"];
const NOUN = ["Falcon", "Comet", "Drifter", "Voyager", "Saber", "Pulsar", "Echo", "Vector", "Phantom", "Ranger", "Streak", "Kite", "Pilot", "Specter", "Glider"];
function pickFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let myName = localStorage.getItem("snowriders.name");
if (!myName) { myName = pickFrom(ADJ) + " " + pickFrom(NOUN); localStorage.setItem("snowriders.name", myName); }
const myId = (() => {
  let id = localStorage.getItem("snowriders.id");
  if (!id) { id = "p_" + Math.random().toString(36).slice(2, 10); localStorage.setItem("snowriders.id", id); }
  return id;
})();
const COLORS = [0xff5252, 0xffb152, 0xffe852, 0x70d050, 0x52d4ff, 0x6a8cff, 0xc060ff, 0xff60c0];
const myColor = COLORS[Math.abs(myId.charCodeAt(2) || 0) % COLORS.length];

// ============================================================
// Procedural terrain (analytical heightAt - same function the
// visual mesh samples AND the physics samples; can't get out of
// sync because there's only one function)
// ============================================================
const noise2D = createNoise2D(() => 0.4242);

function heightAt(x, z) {
  // Radial cone: high at 0,0, drops to ~0 at edges
  const r = Math.sqrt(x * x + z * z);
  const radial = Math.max(0, PEAK_HEIGHT * (1 - r / (TERRAIN_RADIUS * 0.95)));
  // Multi-octave noise for ridges + bumps
  let n = 0;
  n += noise2D(x * 0.008, z * 0.008) * 18;
  n += noise2D(x * 0.025, z * 0.025) * 6;
  n += noise2D(x * 0.09, z * 0.09) * 1.4;
  // Carve a deeper winding path along z so there's a clear runline
  const pathX = Math.sin(z * 0.014) * 18 + Math.cos(z * 0.005) * 8;
  const pathDist = Math.abs(x - pathX);
  const carve = Math.exp(-(pathDist * pathDist) / 100) * 6.5;
  return radial + n - carve;
}

function slopeNormalAt(x, z) {
  const eps = 0.6;
  const hL = heightAt(x - eps, z);
  const hR = heightAt(x + eps, z);
  const hD = heightAt(x, z - eps);
  const hU = heightAt(x, z + eps);
  const dx = (hR - hL) / (2 * eps);
  const dz = (hU - hD) / (2 * eps);
  return new THREE.Vector3(-dx, 1, -dz).normalize();
}

// ============================================================
// Three.js scene
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d0e8);
scene.fog = new THREE.Fog(0xc4d5e8, 60, TERRAIN_RADIUS * 1.4);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, TERRAIN_RADIUS * 4);
camera.position.set(0, 12, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Sky gradient (cheap, no asset)
{
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(TERRAIN_RADIUS * 2.5, 24, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {},
      vertexShader: `varying vec3 vWorld; void main(){vWorld=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader: `varying vec3 vWorld;
        void main(){
          float h = normalize(vWorld).y;
          vec3 top = vec3(0.55, 0.72, 0.92);
          vec3 mid = vec3(0.83, 0.90, 0.97);
          vec3 low = vec3(0.92, 0.86, 0.82);
          vec3 c = mix(low, mid, smoothstep(-0.2, 0.3, h));
          c = mix(c, top, smoothstep(0.3, 0.85, h));
          gl_FragColor = vec4(c, 1.0);
        }`
    })
  );
  scene.add(sky);
}

// Lighting - low warm sun for long dramatic shadows like LMSR
scene.add(new THREE.HemisphereLight(0xc8d6e8, 0x404858, 0.45));
const sun = new THREE.DirectionalLight(0xffe4b8, 1.6);
sun.position.set(60, 70, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SHADOW_R = 100;
sun.shadow.camera.left = -SHADOW_R; sun.shadow.camera.right = SHADOW_R;
sun.shadow.camera.top = SHADOW_R; sun.shadow.camera.bottom = -SHADOW_R;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ============================================================
// Terrain mesh (sampled from the same heightAt function)
// ============================================================
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_RADIUS * 2, TERRAIN_RADIUS * 2, TERRAIN_VERTS - 1, TERRAIN_VERTS - 1);
terrainGeo.rotateX(-Math.PI / 2); // lay flat (Y up)
{
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, heightAt(x, z));
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
}

// Snow material with subtle blue-ish shadow tint
const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xf2f6ff,
  roughness: 0.92,
  metalness: 0.02,
  flatShading: false
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// Far backdrop ring of low-poly snowy peaks for horizon depth
{
  const peakGroup = new THREE.Group();
  const peakMat = new THREE.MeshStandardMaterial({ color: 0xc8d8ec, roughness: 1, flatShading: true });
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2;
    const r = TERRAIN_RADIUS * 1.3;
    const h = 30 + Math.random() * 40;
    const peak = new THREE.Mesh(new THREE.ConeGeometry(20 + Math.random() * 10, h, 5), peakMat);
    peak.position.set(Math.cos(a) * r, h / 2 - 10, Math.sin(a) * r);
    peak.rotation.y = Math.random() * Math.PI;
    peakGroup.add(peak);
  }
  scene.add(peakGroup);
}

// ============================================================
// Trees + rocks (instanced)
// ============================================================
const trees = []; // {x, z}
const rocks = []; // {x, z}

function placeProps() {
  // Tiered pines: 3 stacked cones, decreasing in size, on a thin trunk.
  // Use 3 InstancedMesh layers sharing the same instance count + transforms.
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.95 });
  const tier1Mat = new THREE.MeshStandardMaterial({ color: 0x1f4429, roughness: 0.92, flatShading: true });
  const tier2Mat = new THREE.MeshStandardMaterial({ color: 0x274f33, roughness: 0.92, flatShading: true });
  const tier3Mat = new THREE.MeshStandardMaterial({ color: 0x2e5a3c, roughness: 0.92, flatShading: true });
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.22, 1.6, 6);
  const tier1Geo = new THREE.ConeGeometry(1.5, 1.6, 6);  // bottom (widest)
  const tier2Geo = new THREE.ConeGeometry(1.05, 1.5, 6); // middle
  const tier3Geo = new THREE.ConeGeometry(0.65, 1.4, 6); // top (narrowest)

  const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, NUM_TREES);
  const tier1Mesh = new THREE.InstancedMesh(tier1Geo, tier1Mat, NUM_TREES);
  const tier2Mesh = new THREE.InstancedMesh(tier2Geo, tier2Mat, NUM_TREES);
  const tier3Mesh = new THREE.InstancedMesh(tier3Geo, tier3Mat, NUM_TREES);
  for (const im of [trunkMesh, tier1Mesh, tier2Mesh, tier3Mesh]) {
    im.castShadow = true; im.receiveShadow = true;
  }

  const m = new THREE.Matrix4();
  const _s = new THREE.Vector3();
  function place(im, x, y, z, scale) {
    _s.set(scale, scale, scale);
    m.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), _s);
    im.setMatrixAt(placed, m);
  }

  let placed = 0, attempts = 0;
  while (placed < NUM_TREES && attempts < NUM_TREES * 10) {
    attempts++;
    const x = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.85;
    const z = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.85;
    // Avoid the runline (path) - need wider clearance now that path is wider
    const pathX = Math.sin(z * 0.014) * 18 + Math.cos(z * 0.005) * 8;
    if (Math.abs(x - pathX) < 10) continue;
    // Avoid steep slopes (cones look bad poking out sideways)
    const n = slopeNormalAt(x, z);
    if (n.y < 0.62) continue;
    const y = heightAt(x, z);
    if (y < 2) continue;
    const scale = 0.7 + Math.random() * 0.8;
    // Trunk centered at y + 0.8 * scale
    place(trunkMesh, x, y + 0.8 * scale, z, scale);
    // Tier 1 (bottom of foliage), Tier 2 above, Tier 3 top
    place(tier1Mesh, x, y + (1.6 + 0.8) * scale, z, scale);
    place(tier2Mesh, x, y + (1.6 + 1.85) * scale, z, scale);
    place(tier3Mesh, x, y + (1.6 + 2.85) * scale, z, scale);
    trees.push({ x, z });
    placed++;
  }
  for (const im of [trunkMesh, tier1Mesh, tier2Mesh, tier3Mesh]) {
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
  }

  // Sharper, more angular rocks. Build a faceted shape from a stretched
  // octahedron with random vertex jitter for variety. Use one InstancedMesh.
  const rockBase = new THREE.OctahedronGeometry(0.9, 0);
  // Squash vertically + randomize each vertex slightly
  {
    const p = rockBase.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i);
      p.setY(i, y * 0.55 + (Math.random() - 0.5) * 0.15);
      p.setX(i, p.getX(i) + (Math.random() - 0.5) * 0.2);
      p.setZ(i, p.getZ(i) + (Math.random() - 0.5) * 0.2);
    }
    p.needsUpdate = true;
    rockBase.computeVertexNormals();
  }
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x536068, roughness: 0.95, flatShading: true });
  const rockMesh = new THREE.InstancedMesh(rockBase, rockMat, NUM_ROCKS);
  rockMesh.castShadow = true; rockMesh.receiveShadow = true;
  let rPlaced = 0, rAttempts = 0;
  while (rPlaced < NUM_ROCKS && rAttempts < NUM_ROCKS * 10) {
    rAttempts++;
    const x = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.7;
    const z = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.7;
    const pathX = Math.sin(z * 0.014) * 18 + Math.cos(z * 0.005) * 8;
    if (Math.abs(x - pathX) < 8) continue;
    const y = heightAt(x, z);
    const scale = 0.7 + Math.random() * 1.6;
    const rot = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI * 2);
    m.compose(new THREE.Vector3(x, y + 0.3 * scale, z), rot, new THREE.Vector3(scale, scale * (0.7 + Math.random() * 0.5), scale));
    rockMesh.setMatrixAt(rPlaced, m);
    rocks.push({ x, z, r: ROCK_RADIUS * scale });
    rPlaced++;
  }
  rockMesh.instanceMatrix.needsUpdate = true;
  scene.add(rockMesh);
}
placeProps();

// ============================================================
// Snow sparkle - the signature LMSR look. Thousands of tiny
// twinkling specks scattered on the visible snow surface.
// ============================================================
{
  const SPARKLE_COUNT = 4000;
  const sparklePos = new Float32Array(SPARKLE_COUNT * 3);
  const sparklePhase = new Float32Array(SPARKLE_COUNT);
  for (let i = 0; i < SPARKLE_COUNT; i++) {
    // sample uniformly in disk, reject points on path
    let x, z, attempts = 0;
    do {
      x = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.95;
      z = (Math.random() * 2 - 1) * TERRAIN_RADIUS * 0.95;
      attempts++;
    } while (Math.sqrt(x * x + z * z) > TERRAIN_RADIUS * 0.95 && attempts < 4);
    const y = heightAt(x, z);
    const n = slopeNormalAt(x, z);
    sparklePos[i * 3] = x;
    sparklePos[i * 3 + 1] = y + 0.05 + Math.random() * 0.1;
    sparklePos[i * 3 + 2] = z;
    sparklePhase[i] = Math.random() * Math.PI * 2;
    // Hide sparkles on steep dark slopes (where there's no snow)
    if (n.y < 0.55) sparklePos[i * 3 + 1] = -1000;
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparklePos, 3));
  const sparkMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.12,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
    depthWrite: false
  });
  const sparkles = new THREE.Points(sparkGeo, sparkMat);
  scene.add(sparkles);
  // Twinkle: modulate opacity over time. Done in main loop.
  window.__sparkles = { points: sparkles, mat: sparkMat, phase: sparklePhase, count: SPARKLE_COUNT };
}

// ============================================================
// Checkpoints (rings along the runline, descending)
// ============================================================
const checkpoints = [];
{
  const ringGeo = new THREE.TorusGeometry(4, 0.3, 8, 24);
  for (let i = 0; i < NUM_CHECKPOINTS; i++) {
    const t = (i + 1) / (NUM_CHECKPOINTS + 1);
    const z = TERRAIN_RADIUS * 0.85 * (t * 2 - 1);
    const x = Math.sin(z * 0.014) * 14 + Math.cos(z * 0.005) * 6;
    const y = heightAt(x, z) + 4;
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe060, transparent: true, opacity: 0.85 }));
    ring.position.set(x, y, z);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
    checkpoints.push({ mesh: ring, x, y, z, passed: false, idx: i });
  }
}

// ============================================================
// Player (skier) - custom physics, samples heightAt directly
// ============================================================
function makeSkierMesh(color) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.35), bodyMat);
  torso.position.y = 1.05;
  torso.castShadow = true; torso.receiveShadow = true;
  g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffd0a0, roughness: 0.7 }));
  head.position.y = 1.55;
  head.castShadow = true;
  g.add(head);
  // helmet
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.21, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x222 }));
  helmet.position.y = 1.6;
  helmet.castShadow = true;
  g.add(helmet);
  // arms
  const armMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  for (const dx of [-0.36, 0.36]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.6, 6), armMat);
    arm.rotation.z = dx > 0 ? -0.2 : 0.2;
    arm.position.set(dx, 1.05, 0);
    arm.castShadow = true;
    g.add(arm);
  }
  // legs
  for (const dx of [-0.13, 0.13]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 6), new THREE.MeshStandardMaterial({ color: 0x202028, roughness: 0.6 }));
    leg.position.set(dx, 0.4, 0);
    leg.castShadow = true;
    g.add(leg);
  }
  // skis
  for (const dx of [-0.18, 0.18]) {
    const ski = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.05, 1.6), new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.4 }));
    ski.position.set(dx, 0.07, 0);
    ski.castShadow = true; ski.receiveShadow = true;
    g.add(ski);
  }
  return g;
}

const ghost = {
  mesh: null,
  active: false
};
function spawnGhost() {
  if (!bestRun || !bestRun.length) { ghost.active = false; return; }
  if (!ghost.mesh) {
    ghost.mesh = makeSkierMesh(0xa0a0c8);
    ghost.mesh.traverse(o => {
      if (o.isMesh) {
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.45;
        o.castShadow = false;
      }
    });
    scene.add(ghost.mesh);
  }
  ghost.active = true;
}
function tickGhost() {
  if (!ghost.active || !bestRun || !bestRun.length) return;
  if (!raceRunning) { ghost.mesh.visible = false; return; }
  ghost.mesh.visible = true;
  // find samples around raceTime
  let i = 0;
  while (i < bestRun.length - 1 && bestRun[i + 1].t < raceTime) i++;
  const a = bestRun[i], b = bestRun[Math.min(i + 1, bestRun.length - 1)];
  const span = Math.max(0.001, b.t - a.t);
  const k = Math.min(1, Math.max(0, (raceTime - a.t) / span));
  ghost.mesh.position.set(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, a.z + (b.z - a.z) * k);
  ghost.mesh.rotation.y = a.heading + (b.heading - a.heading) * k;
}
spawnGhost();

// ============================================================
// Physics step
// ============================================================
const _tmp = new THREE.Vector3();
const _normal = new THREE.Vector3();
const _tangent = new THREE.Vector3();
const _fwd = new THREE.Vector3();

function tickPlayer(dt) {
  if (player.finished) return;

  // Steering
  if (keys.a) player.heading += TURN_SPEED * dt;
  if (keys.d) player.heading -= TURN_SPEED * dt;

  // Heading vector in world (XZ)
  _fwd.set(-Math.sin(player.heading), 0, -Math.cos(player.heading));

  // Forward push (small kick on W)
  if (keys.w) {
    player.vel.addScaledVector(_fwd, PUSH_FORCE * dt);
  }
  // Light reverse on S only when slow (so it doesn't kill momentum mid-run)
  if (keys.s) {
    player.vel.addScaledVector(_fwd, -PUSH_FORCE * 0.3 * dt);
  }

  // Gravity
  player.vel.y -= GRAVITY * dt;

  // Integrate position
  player.pos.addScaledVector(player.vel, dt);

  // ---- Ground constraint ----
  // Sample analytical height at current x,z. If we're below, snap up
  // and project velocity onto the tangent plane. This is the entire
  // physics-vs-terrain story; no orientation mismatch is possible
  // because the visual mesh ALSO calls heightAt(x, z) for each vertex.
  const groundY = heightAt(player.pos.x, player.pos.z);
  const surfaceY = groundY + PLAYER_RADIUS;
  if (player.pos.y <= surfaceY + 0.01) {
    // Snap up
    player.pos.y = surfaceY;
    // Surface normal
    _normal.copy(slopeNormalAt(player.pos.x, player.pos.z));
    // Project velocity onto plane (remove inward component)
    const vDotN = player.vel.dot(_normal);
    if (vDotN < 0) {
      // landing impact: small bounce dampening
      player.vel.addScaledVector(_normal, -vDotN * 1.0);
    }
    // Tangent (horizontal-ish slide direction)
    _tangent.copy(player.vel).addScaledVector(_normal, -player.vel.dot(_normal));

    // Carving: lerp tangent direction toward heading (preserves speed)
    const horizSpeed = Math.sqrt(_tangent.x * _tangent.x + _tangent.z * _tangent.z);
    if (horizSpeed > 0.5) {
      const targetX = -Math.sin(player.heading) * horizSpeed;
      const targetZ = -Math.cos(player.heading) * horizSpeed;
      _tangent.x += (targetX - _tangent.x) * CARVE_LERP;
      _tangent.z += (targetZ - _tangent.z) * CARVE_LERP;
    }

    // Friction
    let f = SNOW_FRICTION;
    if (keys.brake) f = BRAKE_FRICTION;
    else if (keys.tuck) f = TUCK_FRICTION;
    _tangent.multiplyScalar(Math.pow(f, dt * 60));

    // Reassemble velocity
    player.vel.copy(_tangent);
    // We snapped to surface; gravity along normal becomes slide accel along slope
    // (gravity already added; normal component just got removed)
    player.airborne = false;
  } else {
    player.airborne = true;
  }

  // Speed cap
  if (player.vel.lengthSq() > MAX_SPEED * MAX_SPEED) player.vel.setLength(MAX_SPEED);

  // ---- Tree collisions (push out + speed loss) ----
  for (const t of trees) {
    const dx = player.pos.x - t.x;
    const dz = player.pos.z - t.z;
    const d2 = dx * dx + dz * dz;
    const r = PLAYER_RADIUS + TREE_RADIUS;
    if (d2 < r * r && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const k = (r - d) / d;
      player.pos.x += dx * k;
      player.pos.z += dz * k;
      // hard slow on impact
      player.vel.multiplyScalar(0.35);
      flashCrash();
    }
  }
  for (const ro of rocks) {
    const dx = player.pos.x - ro.x;
    const dz = player.pos.z - ro.z;
    const d2 = dx * dx + dz * dz;
    const r = PLAYER_RADIUS + ro.r;
    if (d2 < r * r && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      const k = (r - d) / d;
      player.pos.x += dx * k;
      player.pos.z += dz * k;
      player.vel.multiplyScalar(0.4);
      flashCrash();
    }
  }

  // ---- Failsafes ----
  if (player.pos.y < RESPAWN_BELOW || Math.abs(player.pos.x) > TERRAIN_RADIUS || Math.abs(player.pos.z) > TERRAIN_RADIUS) {
    findSpawn();
    showBanner("Out of bounds<small>respawned at peak</small>", 1500);
  }

  // Sync visual mesh
  player.mesh.position.copy(player.pos);
  // Visual mesh is at FEET (0,0); we add a half-radius below pos
  player.mesh.position.y -= PLAYER_RADIUS;
  player.mesh.rotation.y = player.heading;

  // Slight forward tilt based on slope and movement
  const tiltN = slopeNormalAt(player.pos.x, player.pos.z);
  const slopeAngle = Math.atan2(Math.sqrt(tiltN.x * tiltN.x + tiltN.z * tiltN.z), tiltN.y);
  player.mesh.rotation.x = -slopeAngle * 0.6;
  // Lean into turns
  const targetLean = (keys.a ? 0.25 : 0) + (keys.d ? -0.25 : 0);
  player.mesh.rotation.z += (targetLean - player.mesh.rotation.z) * 0.15;
}

let crashTimer = 0;
function flashCrash() { crashTimer = 0.25; }

// ============================================================
// Camera chase
// ============================================================
const camTarget = new THREE.Vector3();
const camPosLerp = new THREE.Vector3();
function tickCamera(dt) {
  // LMSR-style: camera looks at where player is GOING, not where they ARE.
  // The lookahead distance scales with speed so high-speed sections show
  // more terrain ahead. Camera position pulls back further at speed too.
  const speed = player.vel.length();
  const speedF = Math.min(1, speed / 25);
  const back = new THREE.Vector3(Math.sin(player.heading), 0, Math.cos(player.heading));
  const camPos = player.pos.clone()
    .addScaledVector(back, 7 + speedF * 3)
    .add(new THREE.Vector3(0, 5 + speedF * 1.5, 0));
  camPosLerp.lerp(camPos, 0.12);
  camera.position.copy(camPosLerp);

  // Look-ahead target: player.pos + velocity * lookahead, clamped
  const lookAhead = new THREE.Vector3(player.vel.x, 0, player.vel.z).multiplyScalar(0.35);
  if (lookAhead.length() > 12) lookAhead.setLength(12);
  const target = player.pos.clone().add(lookAhead);
  camTarget.lerp(target, 0.18);
  camera.lookAt(camTarget.x, camTarget.y + 1.2, camTarget.z);
}

// ============================================================
// Snow trail (line behind player)
// ============================================================
// Persistent ski tracks - dark depression line that stays carved into snow
const trailMax = 240;
const trailGeo = new THREE.BufferGeometry();
const trailPositions = new Float32Array(trailMax * 3);
trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
const trailMat = new THREE.LineBasicMaterial({ color: 0x6a82a4, transparent: true, opacity: 0.55, linewidth: 2 });
const trailLine = new THREE.Line(trailGeo, trailMat);
trailLine.renderOrder = 1;
scene.add(trailLine);
let trailIdx = 0;
let trailLastTime = 0;
function tickTrail(now) {
  if (now - trailLastTime < 0.04) return;
  trailLastTime = now;
  const idx = trailIdx % trailMax;
  trailPositions[idx * 3] = player.pos.x;
  trailPositions[idx * 3 + 1] = player.pos.y - PLAYER_RADIUS + 0.05;
  trailPositions[idx * 3 + 2] = player.pos.z;
  trailIdx++;
  trailGeo.attributes.position.needsUpdate = true;
  // limit drawcount until buffer fills
  trailGeo.setDrawRange(0, Math.min(trailIdx, trailMax));
}

// ============================================================
// Powder spray particles
// ============================================================
const sprayCount = 80;
const sprayPos = new Float32Array(sprayCount * 3);
const sprayVel = new Float32Array(sprayCount * 3);
const sprayLife = new Float32Array(sprayCount);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute("position", new THREE.BufferAttribute(sprayPos, 3));
const sprayMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.8, depthWrite: false });
const sprayPts = new THREE.Points(sprayGeo, sprayMat);
scene.add(sprayPts);
let sprayIdx = 0;
function emitSpray() {
  const i = sprayIdx % sprayCount;
  sprayPos[i * 3] = player.pos.x + (Math.random() - 0.5) * 0.4;
  sprayPos[i * 3 + 1] = player.pos.y - PLAYER_RADIUS + 0.05;
  sprayPos[i * 3 + 2] = player.pos.z + (Math.random() - 0.5) * 0.4;
  sprayVel[i * 3] = (Math.random() - 0.5) * 4;
  sprayVel[i * 3 + 1] = 1 + Math.random() * 2;
  sprayVel[i * 3 + 2] = (Math.random() - 0.5) * 4;
  sprayLife[i] = 0.6;
  sprayIdx++;
}
function tickSpray(dt) {
  for (let i = 0; i < sprayCount; i++) {
    if (sprayLife[i] > 0) {
      sprayLife[i] -= dt;
      sprayPos[i * 3] += sprayVel[i * 3] * dt;
      sprayPos[i * 3 + 1] += (sprayVel[i * 3 + 1] - 5 * dt) * dt;
      sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt;
      sprayVel[i * 3 + 1] -= 9 * dt;
    } else {
      // park dead particles below ground
      sprayPos[i * 3 + 1] = -1000;
    }
  }
  sprayGeo.attributes.position.needsUpdate = true;
}

// ============================================================
// Web Audio (procedural wind + scrape)
// ============================================================
let audio = null;
function initAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // wind: low-passed white noise
    const bufSize = 2 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const out = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
    const wind = ctx.createBufferSource();
    wind.buffer = buf; wind.loop = true;
    const windFilter = ctx.createBiquadFilter();
    windFilter.type = "lowpass"; windFilter.frequency.value = 600;
    const windGain = ctx.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter).connect(windGain).connect(ctx.destination);
    wind.start();

    const scrape = ctx.createBufferSource();
    scrape.buffer = buf; scrape.loop = true;
    const scrapeFilter = ctx.createBiquadFilter();
    scrapeFilter.type = "bandpass"; scrapeFilter.frequency.value = 2200; scrapeFilter.Q.value = 0.7;
    const scrapeGain = ctx.createGain(); scrapeGain.gain.value = 0;
    scrape.connect(scrapeFilter).connect(scrapeGain).connect(ctx.destination);
    scrape.start();

    audio = { ctx, windGain, scrapeGain };
  } catch (_) { /* noop */ }
}
addEventListener("pointerdown", () => { if (!audio) initAudio(); }, { once: true });
addEventListener("keydown", () => { if (!audio) initAudio(); }, { once: true });
function tickAudio() {
  if (!audio) return;
  const speed = player.vel.length();
  audio.windGain.gain.value = Math.min(0.15, speed * 0.004);
  audio.scrapeGain.gain.value = player.airborne ? 0 : Math.min(0.18, Math.max(0, (speed - 4) * 0.008));
}

// ============================================================
// Race + checkpoints + recording
// ============================================================
function tickRace(dt) {
  if (player.finished) return;
  // Start the timer the moment we leave the spawn
  if (!raceRunning) {
    if (player.vel.lengthSq() > 1) {
      raceRunning = true;
      recordingStartTime = performance.now() / 1000;
      raceTime = 0;
    }
  } else {
    raceTime += dt;
  }

  // Record sample every ~120ms while running
  if (raceRunning && (recordingSamples.length === 0 || raceTime - recordingSamples[recordingSamples.length - 1].t > 0.12)) {
    recordingSamples.push({ t: raceTime, x: player.pos.x, y: player.pos.y, z: player.pos.z, heading: player.heading });
    if (recordingSamples.length > 2000) recordingSamples.shift();
  }

  // Checkpoint detection (each must be passed in order, but for a casual feel
  // we only require touching them, not strict order)
  for (let i = 0; i < checkpoints.length; i++) {
    const cp = checkpoints[i];
    if (cp.passed) continue;
    const dx = player.pos.x - cp.x;
    const dz = player.pos.z - cp.z;
    const dy = player.pos.y - cp.y;
    if (dx * dx + dz * dz < 25 && Math.abs(dy) < 8) {
      cp.passed = true;
      cp.mesh.material.color.set(0x60ff80);
      updateCheckpointHud();
      const remaining = checkpoints.filter(c => !c.passed).length;
      if (remaining === 0) finishRun();
    }
  }

  // Rotate ring meshes
  for (const cp of checkpoints) cp.mesh.rotation.z += dt * 1.2;
}

function finishRun() {
  player.finished = true;
  raceRunning = false;
  const finalTime = raceTime;
  const isPb = !bestTime || finalTime < bestTime;
  if (isPb) saveBest(finalTime);
  showBanner(`Run finished<small>${fmtTime(finalTime)}${isPb ? " - new personal best!" : ""}</small>`, 4000);
  // Push to gun leaderboard
  if (gunOk) {
    try {
      gun.get("snowriders").get("lb").set({ name: myName, time: finalTime, ts: Date.now() });
    } catch (_) {}
  } else {
    // local leaderboard fallback
    const local = JSON.parse(localStorage.getItem("snowriders.locallb") || "[]");
    local.push({ name: myName, time: finalTime, ts: Date.now() });
    local.sort((a, b) => a.time - b.time);
    localStorage.setItem("snowriders.locallb", JSON.stringify(local.slice(0, 20)));
  }
  // Auto-respawn after 3.5s
  setTimeout(() => findSpawn(), 3500);
}

// ============================================================
// Multiplayer: Gun.js (position sync, leaderboard, chat, minimap)
// ============================================================
let gun = null;
let gunOk = false;
const peers = new Map(); // id -> { mesh, last: {x,z,heading}, color, name }

(async function setupGun() {
  try {
    const Gun = (await import("gun")).default;
    gun = Gun(["https://gun-manhattan.herokuapp.com/gun", "https://peer.wallie.io/gun"]);
    gunOk = true;
    document.getElementById("net").textContent = "online";

    // Subscribe to other players' presence
    gun.get("snowriders").get("players").map().on((data, id) => {
      if (!data || id === myId) return;
      const stale = Date.now() - (data.ts || 0) > 12000;
      if (stale) {
        const p = peers.get(id);
        if (p) { scene.remove(p.mesh); peers.delete(id); }
        return;
      }
      let p = peers.get(id);
      if (!p) {
        const mesh = makeSkierMesh(data.color || 0xaaaaaa);
        // name label
        const cnv = document.createElement("canvas");
        cnv.width = 256; cnv.height = 64;
        const cctx = cnv.getContext("2d");
        cctx.font = "bold 26px sans-serif";
        cctx.textAlign = "center";
        cctx.shadowColor = "rgba(0,0,0,0.85)";
        cctx.shadowBlur = 6;
        cctx.fillStyle = "#fff";
        cctx.fillText(data.name || "Stranger", 128, 32);
        const tex = new THREE.CanvasTexture(cnv);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
        sprite.scale.set(5, 1.25, 1);
        sprite.position.y = 2.4;
        mesh.add(sprite);
        scene.add(mesh);
        p = { mesh, last: { x: 0, z: 0, heading: 0 }, color: data.color, name: data.name };
        peers.set(id, p);
      }
      p.last.x = data.x;
      p.last.z = data.z;
      p.last.heading = data.heading;
      p.last.y = data.y;
      p.name = data.name;
    });

    // Subscribe to leaderboard
    gun.get("snowriders").get("lb").map().on((data, id) => {
      if (!data) return;
      lbCache.set(id, { name: data.name, time: data.time, ts: data.ts });
      renderLeaderboard();
    });

    // Subscribe to chat
    gun.get("snowriders").get("chat").map().on((data, id) => {
      if (!data || !data.msg) return;
      if (chatSeen.has(id)) return;
      chatSeen.add(id);
      pushChatMessage(data.name || "?", data.msg, data.ts || 0);
    });

    // Broadcast presence loop
    setInterval(() => {
      if (!gunOk) return;
      try {
        gun.get("snowriders").get("players").get(myId).put({
          name: myName,
          color: myColor,
          x: player.pos.x,
          y: player.pos.y,
          z: player.pos.z,
          heading: player.heading,
          ts: Date.now()
        });
      } catch (_) {}
    }, 90);
  } catch (e) {
    console.warn("Gun unavailable, running solo:", e);
    document.getElementById("net").textContent = "solo (gun.js failed to load)";
    // still show the local leaderboard
    const local = JSON.parse(localStorage.getItem("snowriders.locallb") || "[]");
    for (const r of local) lbCache.set("local-" + r.ts, r);
    renderLeaderboard();
  }
})();

// HUD updates that depend on peers
function tickPeers() {
  document.getElementById("net").textContent = gunOk
    ? (peers.size === 0 ? "online (alone)" : peers.size === 1 ? "1 peer online" : `${peers.size} peers online`)
    : "solo";
  // Smoothly move peer meshes toward last known position
  for (const p of peers.values()) {
    if (p.last.x === undefined) continue;
    const target = new THREE.Vector3(p.last.x, (p.last.y ?? heightAt(p.last.x, p.last.z) + PLAYER_RADIUS) - PLAYER_RADIUS, p.last.z);
    p.mesh.position.lerp(target, 0.18);
    // smoothly rotate heading
    let dh = p.last.heading - p.mesh.rotation.y;
    while (dh > Math.PI) dh -= Math.PI * 2;
    while (dh < -Math.PI) dh += Math.PI * 2;
    p.mesh.rotation.y += dh * 0.18;
  }
}

// ============================================================
// Leaderboard render
// ============================================================
const lbCache = new Map();
function renderLeaderboard() {
  const arr = Array.from(lbCache.values()).filter(x => x && typeof x.time === "number");
  arr.sort((a, b) => a.time - b.time);
  const top = arr.slice(0, 6);
  const me = bestTime ? { name: myName + " (you)", time: bestTime } : null;
  const html = top.map((r, i) => {
    const isMe = me && r.name === myName;
    return `<div class="row${isMe ? " me" : ""}"><span>${i + 1}. ${escapeHtml(r.name).slice(0, 14)}</span><span>${fmtTime(r.time)}</span></div>`;
  }).join("");
  let extra = "";
  if (me && !top.some(r => r.name === myName)) {
    extra = `<div class="row me"><span>- ${escapeHtml(myName).slice(0, 14)} (you)</span><span>${fmtTime(bestTime)}</span></div>`;
  }
  document.getElementById("lb-rows").innerHTML = html + extra ||
    `<div class="row" style="opacity:.55;">No times yet.</div>`;
}
function escapeHtml(s) { return String(s || "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c])); }
renderLeaderboard();

// ============================================================
// Chat
// ============================================================
const chatMsgsEl = document.getElementById("chat-msgs");
const chatInputEl = document.getElementById("chat-in");
const chatWrap = document.getElementById("chat");
const chatMessages = [];
const chatSeen = new Set();
let chatHideTimer = null;
function pushChatMessage(name, msg, ts) {
  chatMessages.push({ name, msg, ts });
  if (chatMessages.length > 12) chatMessages.shift();
  renderChat();
  chatWrap.querySelector(".messages").classList.remove("dim");
  clearTimeout(chatHideTimer);
  chatHideTimer = setTimeout(() => chatWrap.querySelector(".messages").classList.add("dim"), 8000);
}
function renderChat() {
  chatMsgsEl.innerHTML = chatMessages.map(m => `<div class="m"><b>${escapeHtml(m.name).slice(0, 18)}</b>${escapeHtml(m.msg)}</div>`).join("");
}
function openChat() {
  chatBox.typing = true;
  chatWrap.classList.add("typing");
  chatInputEl.value = "";
  chatInputEl.focus();
}
function closeChat(send) {
  if (send) {
    const v = chatInputEl.value.trim().slice(0, 120);
    if (v) {
      const ts = Date.now();
      const cid = `${myId}_${ts}`;
      if (gunOk) {
        try { gun.get("snowriders").get("chat").get(cid).put({ name: myName, msg: v, ts }); } catch (_) {}
      }
      pushChatMessage(myName, v, ts);
      chatSeen.add(cid);
    }
  }
  chatBox.typing = false;
  chatWrap.classList.remove("typing");
  chatInputEl.blur();
}

// ============================================================
// Minimap
// ============================================================
const miniCanvas = document.getElementById("minimap");
const miniCtx = miniCanvas.getContext("2d");
function tickMinimap() {
  const w = 160, h = 160;
  miniCtx.clearRect(0, 0, w, h);
  // scale: terrain spans -R..+R, draw to 0..160
  const k = w / (TERRAIN_RADIUS * 2);
  const cx = w / 2, cy = h / 2;
  function toMini(x, z) { return [cx + x * k, cy + z * k]; }
  // background
  miniCtx.fillStyle = "rgba(255,255,255,0.06)";
  miniCtx.fillRect(0, 0, w, h);
  // path line
  miniCtx.strokeStyle = "rgba(160,200,255,0.4)";
  miniCtx.lineWidth = 1;
  miniCtx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const z = -TERRAIN_RADIUS + (i / 60) * TERRAIN_RADIUS * 2;
    const x = Math.sin(z * 0.014) * 14 + Math.cos(z * 0.005) * 6;
    const [mx, my] = toMini(x, z);
    if (i === 0) miniCtx.moveTo(mx, my); else miniCtx.lineTo(mx, my);
  }
  miniCtx.stroke();
  // checkpoints
  for (const cp of checkpoints) {
    const [mx, my] = toMini(cp.x, cp.z);
    miniCtx.fillStyle = cp.passed ? "rgba(120,255,140,0.9)" : "rgba(255,224,96,0.9)";
    miniCtx.beginPath();
    miniCtx.arc(mx, my, 2.2, 0, Math.PI * 2);
    miniCtx.fill();
  }
  // peers
  for (const p of peers.values()) {
    if (p.last.x === undefined) continue;
    const [mx, my] = toMini(p.last.x, p.last.z);
    miniCtx.fillStyle = `#${(p.color || 0xaaaaaa).toString(16).padStart(6, "0")}`;
    miniCtx.beginPath();
    miniCtx.arc(mx, my, 2.5, 0, Math.PI * 2);
    miniCtx.fill();
  }
  // me
  const [mx, my] = toMini(player.pos.x, player.pos.z);
  miniCtx.fillStyle = "#ffffff";
  miniCtx.beginPath();
  miniCtx.arc(mx, my, 3.5, 0, Math.PI * 2);
  miniCtx.fill();
  // my heading arrow
  miniCtx.strokeStyle = "#ffffff";
  miniCtx.lineWidth = 2;
  miniCtx.beginPath();
  miniCtx.moveTo(mx, my);
  miniCtx.lineTo(mx + Math.sin(player.heading + Math.PI) * 8, my + Math.cos(player.heading + Math.PI) * 8);
  miniCtx.stroke();
}

function tickHud() {
  const speedKmh = (player.vel.length() * 3.6).toFixed(0);
  document.getElementById("speed").textContent = `${speedKmh} km/h`;

const PROMPT_TEMPLATE = `Create a web-based skiing/snowboarding game inspired by Lonely Mountains: Snow Riders with: CORE FEATURES: - Low-poly, procedural diorama-style 3D mountain environments - Physics-based skiing/snowboarding with momentum and realistic turning - Multiple paths and hidden shortcuts on each mountain - Time trials and trick-based challenges - Character customization and equipment progression - Simple multiplayer racing (2-8 players) and ghost data competition TECHNICAL IMPLEMENTATION: - Three.js for 3D rendering with optimized low-poly models - Physics engine (Cannon.js/Ammo.js) for realistic movement and crashes - Responsive controls for both desktop and mobile - WebSockets for basic multiplayer functionality - Dynamic snow effects (trails, powder spray) and particle systems GAMEPLAY MECHANICS: - Momentum-based skiing with different snow types affecting handling - Jump and trick system with mid-air controls and scoring - Quick respawn after crashes to maintain flow - Checkpoint system with time trials and exploration goals - Unlockable equipment that affects handling characteristics VISUAL & AUDIO STYLE: ultra realistic shader almost like ray tracing - Satisfying snow sounds that vary by speed and terrain - Ambient mountain audio and minimalist background music CREATE A GAME THAT BALANCES: - Challenge with relaxation - Accessibility with skill-based mastery - Competitive racing with peaceful exploration - Minimalist visuals with engaging gameplay Focus first on core physics and feel, then expand with additional features as development progresses. Think step by step longer and harder-deeper.`;

const copyBtn = document.getElementById("copy-prompt");
const toastEl = document.getElementById("toast");
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}
copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(PROMPT_TEMPLATE);
    copyBtn.classList.add("ok");
    copyBtn.textContent = "Copied";
    showToast("Prompt copied to clipboard");
    setTimeout(() => { copyBtn.classList.remove("ok"); copyBtn.textContent = "Copy prompt template"; }, 1600);
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = PROMPT_TEMPLATE;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("Prompt copied to clipboard"); }
    catch (_e) { showToast("Copy failed - select manually"); }
    document.body.removeChild(ta);
  }
});

// ============================================================
// Main loop
// ============================================================
const FIXED_DT = 1 / 120; // physics fixed-step
let accumulator = 0;
const clock = new THREE.Clock();
let bootHidden = false;

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, clock.getDelta());
  accumulator += dt;
  // Run physics in fixed steps (substeps avoid skip-through)
  let steps = 0;
  while (accumulator >= FIXED_DT && steps < 8) {
    tickPlayer(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  // capped catch-up: if we fell way behind, just drop the residual
  if (accumulator > FIXED_DT * 8) accumulator = 0;

  tickRace(dt);
  tickGhost();
  tickCamera(dt);
  tickTrail(performance.now() / 1000);
  // emit spray on ground when moving
  if (!player.airborne && player.vel.length() > 6) {
    if (Math.random() < 0.7) emitSpray();
  }
  tickSpray(dt);
  tickAudio();
  tickPeers();
  tickHud();
  tickMinimap();

  // Twinkle the snow sparkle
  if (window.__sparkles) {
    const t = performance.now() * 0.001;
    window.__sparkles.mat.opacity = 0.7 + Math.sin(t * 1.7) * 0.15;
    window.__sparkles.mat.size = 0.10 + Math.sin(t * 3.3) * 0.03;
  }

  if (!bootHidden) {
    bootHidden = true;
    setTimeout(() => document.getElementById("boot").classList.add("gone"), 200);
  }

  renderer.render(scene, camera);
}
loop();
</script>
