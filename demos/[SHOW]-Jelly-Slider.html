<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Slider</title>
<meta name="description" content="A WebGL2 jelly slider where a simulated rope drives a ray marched jelly body whose crispy edge wears with use.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efede8; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #panel, #credit { position: fixed; z-index: 2; font: 12px/1.2 system-ui, sans-serif; }
  #panel { top: 12px; right: 12px; display: grid; gap: 7px; min-width: 170px; padding: 10px 12px; border-radius: 10px; background: rgba(18, 18, 20, 0.72); color: #f2f2f2; user-select: none; }
  #panel label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
  #panel input[type=range] { width: 96px; margin: 0; }
  #panel input[type=color] { width: 30px; height: 20px; padding: 0; border: 0; background: none; }
  #panel input[type=checkbox] { margin: 0; }
  #panel select, #panel button { font: inherit; color: inherit; background: #2b2b30; border: 1px solid #5a5a62; border-radius: 4px; }
  #wear { display: flex; align-items: center; gap: 8px; }
  #wear span { flex: 1; }
  #wear input { width: 60px; }
  #wear button { padding: 0 5px; font-size: 11px; }
  #credit { left: 50%; bottom: 10px; transform: translateX(-50%); padding: 6px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.66); color: #fff; white-space: nowrap; }
  #credit a { color: #87ceeb; text-decoration: none; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Jelly slider"></canvas>
<div id="panel">
  <label>Quality
    <select id="quality">
      <option value="auto">Auto</option>
      <option value="0.3">Very Low</option>
      <option value="0.5">Low</option>
      <option value="0.7">Medium</option>
      <option value="0.85">High</option>
      <option value="1">Ultra</option>
    </select>
  </label>
  <label>Light dir <input id="light" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label>Jelly Color <input id="color" type="color" value="#ff7313"></label>
  <label>Blur <input id="blur" type="checkbox"></label>
  <div id="wear">
    <span>Wear <output id="wearOut"></output></span>
    <input id="wearIn" type="range" min="0" max="1" step="0.01" aria-label="Wear">
    <button id="reset" type="button">Reset</button>
  </div>
</div>
<div id="credit">Inspired by work of <a href="https://x.com/cerpow/status/1964953851603358112" target="_blank" rel="noopener">Voicu Apostol</a></div>
<div id="msg">WebGL 2 is not available in this browser.</div>
<script>
"use strict";

// Rope: 17 point Verlet chain, same constants as the original
const N = 17, X0 = -1, X1 = Math.fround(0.9), YO = -0.03, LEN = X1 - X0, REST = LEN / (N - 1);
const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const rope = (() => {
  const P = new Float32Array(2 * N), Q = new Float32Array(2 * N), NR = new Float32Array(2 * N);
  const C = new Float32Array(2 * N - 2), prevP = new Float32Array(2 * N);
  let targetX = X1;
  for (let i = 0; i < N; i++) {
    P[2 * i] = Q[2 * i] = X0 * (1 - i / (N - 1)) + X1 * (i / (N - 1));
    P[2 * i + 1] = Q[2 * i + 1] = YO;
  }
  const mass = (i) => (i > 0 && i < N - 1 ? 1 : 0); // both ends are pinned
  function pull(i, j, rest, k) {
    const dx = P[2 * j] - P[2 * i], dy = P[2 * j + 1] - P[2 * i + 1], len = Math.hypot(dx, dy);
    const w1 = mass(i), w2 = mass(j), ws = w1 + w2;
    if (len < 1e-8 || ws <= 0) return;
    const f = (len - rest) / len, c1 = (w1 / ws) * k, c2 = (w2 / ws) * k;
    P[2 * i] += dx * f * c1; P[2 * i + 1] += dy * f * c1;
    P[2 * j] -= dx * f * c2; P[2 * j + 1] -= dy * f * c2;
  }
  function pin() {
    P[0] = X0; P[1] = YO; P[2 * N - 2] = targetX; P[2 * N - 1] = 0.08 + YO;
  }
  function substep(h, compression) {
    for (let i = 1; i < N - 1; i++) {
      const px = P[2 * i], py = P[2 * i + 1];
      const vx = (px - Q[2 * i]) * (1 - 0.01), vy = (py - Q[2 * i + 1]) * (1 - 0.01);
      let ay = 0;
      if (compression > 0) { // arch bias while the slider is pushed in
        const t = i / (N - 1);
        ay = 2 * (Math.sin(Math.PI * t) * smooth(0.01, 0.99, t) * smooth(0.01, 0.99, 1 - t)) * compression;
      }
      Q[2 * i] = px; Q[2 * i + 1] = py;
      P[2 * i] = px + vx;
      P[2 * i + 1] = Math.max(py + vy + ay * h * h, YO);
    }
    pin();
    for (const i of [0, N - 1]) { Q[2 * i] = P[2 * i]; Q[2 * i + 1] = P[2 * i + 1]; }
    for (let it = 0; it < 16; it++) {
      for (let i = 0; i < N - 1; i++) pull(i, i + 1, REST, 0.1);
      for (let i = 1; i < N - 1; i++) pull(i - 1, i + 1, 2 * REST, 0.1 * (0.05 + 0.95 * (Math.abs(i / (N - 1) - 0.5) * 2) ** 1.2));
      for (const i of [1, N - 2]) P[2 * i + 1] += (YO - P[2 * i + 1]) * 0.05; // flatten next to the ends
      pin();
    }
  }
  // Advances the chain, refreshes normals and bezier control points, returns the largest point motion.
  function update(dt) {
    if (dt <= 0) return 0;
    prevP.set(P);
    const compression = Math.max(0, 1 - Math.abs(targetX - X0) / LEN);
    for (let s = 0; s < 6; s++) substep(dt / 6, compression);
    for (let i = 0; i < N; i++) {
      const a = Math.max(i - 1, 0), b = Math.min(i + 1, N - 1);
      const dx = P[2 * b] - P[2 * a], dy = P[2 * b + 1] - P[2 * a + 1], len = Math.hypot(dx, dy) || 1;
      NR[2 * i] = -dy / len; NR[2 * i + 1] = dx / len;
    }
    for (let i = 0; i < N - 1; i++) { // control point where the end tangents meet
      const ax = P[2 * i], ay = P[2 * i + 1], dx = P[2 * i + 2] - ax, dy = P[2 * i + 3] - ay;
      const tax = NR[2 * i + 1], tay = -NR[2 * i], tbx = NR[2 * i + 3], tby = -NR[2 * i + 2];
      const den = tax * tby - tay * tbx;
      if (i === 0 || i === N - 2 || NR[2 * i] * NR[2 * i + 2] + NR[2 * i + 1] * NR[2 * i + 3] > 0.99 || Math.abs(den) <= 1e-6) {
        C[2 * i] = (ax + P[2 * i + 2]) * 0.5; C[2 * i + 1] = (ay + P[2 * i + 3]) * 0.5;
      } else {
        const t = (dx * tby - dy * tbx) / den;
        C[2 * i] = ax + t * tax; C[2 * i + 1] = ay + t * tay;
      }
    }
    return Math.max(...P.map((v, i) => Math.abs(v - prevP[i])));
  }
  return { P, C, update, setDrag: (x) => { targetX = clamp(x, X0 - LEN, X0 + LEN); } };
})();

// Shaders
const BW = 192, BH = 96; // rope texture size
const BOX = 'const vec4 BOX = vec4(-1.019, 1.09, -0.3, 0.65);'; // world rectangle covered by the rope texture

const VS = `#version 300 es
void main() { gl_Position = vec4(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0, 0.0, 1.0); }`;

// Bakes the rope: distance, progress along the rope, distance gradient.
const FS_BEZIER = `#version 300 es
precision highp float;
${BOX}
uniform vec2 uP[17], uC[16];
out vec4 o;

float sdBez(vec2 pt, vec2 A, vec2 B, vec2 C) { // quadratic bezier distance, as in @typegpu/sdf
  vec2 a = B - A, b = A - 2.0 * B + C, c = a * 2.0, d = A - pt;
  float kk = 1.0 / max(dot(b, b), 1e-4);
  float kx = kk * dot(a, b);
  float ky = kk * (2.0 * dot(a, a) + dot(d, b)) / 3.0;
  float kz = kk * dot(d, a);
  float p = ky - kx * kx, p3 = p * p * p;
  float q = kx * (2.0 * kx * kx - 3.0 * ky) + kz;
  float h = q * q + 4.0 * p3;
  if (h >= 0.0) {
    h = sqrt(h);
    vec2 x = (vec2(h, -h) - q) * 0.5;
    vec2 uv = sign(x) * pow(abs(x), vec2(1.0 / 3.0));
    float t = clamp(uv.x + uv.y - kx, 0.0, 1.0);
    return length(d + (c + b * t) * t);
  }
  float z = sqrt(-p);
  float v = acos(clamp(q / (p * z * 2.0), -1.0, 1.0)) / 3.0;
  float m = cos(v), n = sin(v) * 1.732050808;
  vec3 t = clamp(vec3(m + m, -n - m, n - m) * z - kx, 0.0, 1.0);
  vec2 e1 = d + (c + b * t.x) * t.x, e2 = d + (c + b * t.y) * t.y;
  return sqrt(min(dot(e1, e1), dot(e2, e2)));
}
float nearest(vec2 p) { float m = 1e10; for (int i = 0; i < 16; i++) m = min(m, sdBez(p, uP[i], uC[i], uP[i + 1])); return m; }

void main() {
  vec2 sp = vec2(mix(BOX.x, BOX.y, gl_FragCoord.x / ${BW}.0), mix(BOX.w, BOX.z, gl_FragCoord.y / ${BH}.0));
  float m = 1e10, ct = 0.0;
  int seg = 0;
  for (int i = 0; i < 16; i++) {
    float d = sdBez(sp, uP[i], uC[i], uP[i + 1]);
    if (d >= m) continue;
    m = d; seg = i;
    vec2 AB = uP[i + 1] - uP[i];
    float abl = length(AB);
    ct = abl > 0.0 ? clamp(dot(sp - uP[i], AB) / (abl * abl), 0.0, 1.0) : 0.0;
  }
  vec2 g = vec2(0.0); // gradient by central differences, only needed near the rope
  if (m < 0.12) {
    const vec2 e = vec2(0.03, 0.0);
    g = vec2(nearest(sp + e) - nearest(sp - e), nearest(sp + e.yx) - nearest(sp - e.yx)) / 0.06;
  }
  o = vec4(m, (float(seg) + ct) / 16.0, g);
}`;

const FS_RAY = `#version 300 es
precision highp float;
precision highp int;
const float LR = 0.024, LH = 0.17, SURF = 0.001; // jelly radius, half depth, hit distance
const vec3 CAM = vec3(0.024, 2.7, 1.9);
${BOX}
uniform sampler2D uBez, uTxt, uWearTex;
uniform vec3 uJelly, uLight;
uniform vec4 uEnd;                     // second last and last rope point
uniform vec2 uRes, uTan, uJit, uSeed;
uniform float uBlur, uWear;
out vec4 fragColor;

uint rs;
float rnd() { // PCG hash as a tiny random stream
  rs = rs * 747796405u + 2891336453u;
  uint w = ((rs >> ((rs >> 28u) + 4u)) ^ rs) * 277803737u;
  return float(((w >> 22u) ^ w) & 0xFFFFFFu) / 16777216.0;
}
float ext(float d, float a, float h) { vec2 w = vec2(d, abs(a) - h); return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)); } // extrusion
float pie(vec2 p, float r) { p.x = abs(p.x); return max(length(p) - r, distance(p, vec2(clamp(p.x, 0.0, r), 0.0)) * -sign(p.y)); }

// ground with the slot
float rect(vec2 p) { vec2 d = abs(p) - vec2(0.8, 0.0); return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - 0.22; }
float ground(vec3 p) { return min(p.y + 0.06, ext(-rect(p.xz), p.y, 0.01) - 0.02); }
#define NORMAL(f, p, e) normalize(k.xyy * f(p + k.xyy * e) + k.yyx * f(p + k.yyx * e) + k.yxy * f(p + k.yxy * e) + k.xxx * f(p + k.xxx * e))
const vec3 k = vec3(1.0, -1.0, 0.0); // tetrahedron directions for normals by differences
vec3 groundN(vec3 p) { return abs(p.z) > 0.22 || abs(p.x) > 1.02 ? vec3(0.0, 1.0, 0.0) : NORMAL(ground, p, 0.0001); }

// jelly: rope texture (distance, progress, gradient) and the round end cap
vec4 bez(vec2 p) { return textureLod(uBez, clamp(vec2(p.x - BOX.x, BOX.w - p.y) / vec2(BOX.y - BOX.x, BOX.w - BOX.z), 0.0, 1.0), 0.0); }
vec2 cs; // direction of the last rope segment, the end cap is rotated to it
vec3 capQ(vec3 p) { vec3 q = p - vec3(uEnd.xy, 0.0); return vec3(cs.x * q.x + cs.y * q.y, cs.x * q.y - cs.y * q.x, q.z); }
float cap(vec3 q) { return ext(pie(q.zx, LH), q.y, 0.001) - LR; }
float capAt(vec3 p) { return cap(capQ(p)); }
vec3 capN(vec3 p) { return NORMAL(capAt, p, 0.01); }
vec3 jellyN(vec3 p, vec4 s, float hitT) {
  float th = LH * 0.85, zd = max(0.0, (abs(p.z) - th) * LH / (LH - th));
  float edge = 0.9 * LR + 0.1 * LH, blend = smoothstep(0.0, edge, edge - zd * 0.1 - (LR - s.x) * 0.9);
  vec3 n = normalize(mix(vec3(0.0, 0.0, sign(p.z)), vec3(s.zw, 0.0), blend * 0.5 + 0.5));
  return hitT > 0.94 ? normalize(mix(n, capN(p), (hitT - 0.94) / 0.02)) : n;
}

// wear: rim offsets baked by FS_WEAR, only read close to the jelly surface
// Rim coordinates of a point: x signed distance to the rim line, y arc length along the rim, z which rim.
vec3 rimAt(vec3 p, vec4 s, vec3 q) {
  if (s.y > 0.94) return vec3(length(vec2(q.z, max(q.x, 0.0))) - LH, 1.78 + LH * atan(max(q.x, 0.0), abs(q.z) + 1e-4), step(0.0, p.z));
  return vec3(abs(p.z) - LH, s.y * 1.9, step(0.0, p.z));
}
vec2 wearAt(vec3 r) { // distance offset, crust weight
  return textureLod(uWearTex, vec2(r.y / 2.1, (r.z * 32.0 + clamp((r.x + 0.09) / 0.12 * 32.0, 0.5, 31.5)) / 64.0), 0.0).xy;
}
float jelly(vec3 p, vec4 s, bool worn) { // distance to the jelly, with worn rim when close
  bool cp = s.y > 0.94;
  vec3 q = cp ? capQ(p) : p;
  float d = cp ? cap(q) : ext(s.x, p.z, LH) - LR;
  return worn && d < 0.05 ? d + wearAt(rimAt(p, s, q)).x : d;
}

// lighting
vec3 fakeShadow(vec3 p, vec3 L) {
  if (p.y < -0.03) return vec3(clamp(1.0 - (rect(p.xz) + 0.02) * 30.0, 0.0, 1.0) * clamp(-p.z * 4.0 * L.z + 1.0, 0.0, 1.0) * 0.5);
  vec2 fuv = vec2((p.x - p.z * L.x * sign(L.z)) * 0.5 + 0.5, 1.0 - (-p.z / L.z) * 0.5 - 0.2);
  vec4 data = textureLod(uBez, fuv, 0.0);
  vec3 shadowColor = mix(vec3(0.0), uJelly, mix(0.0, data.y, clamp(p.x * 1.5 + 1.1, 0.0, 1.0)));
  float contrast = 20.0 * clamp(fuv.y, 0.0, 1.0) * (0.8 + uEnd.x * 0.2);
  float feather = clamp(fuv.x * 10.0, 0.0, 1.0) * clamp((1.0 - fuv.x) * 10.0, 0.0, 1.0) * clamp((1.0 - fuv.y) * 10.0, 0.0, 1.0) * clamp(fuv.y, 0.0, 1.0);
  return mix(vec3(1.0), mix(shadowColor, vec3(1.0), clamp(data.x * contrast - 0.3, 0.0, 1.0)), clamp((1.0 - L.y) * 2.0, 0.0, 1.0) * feather);
}
float occlusion(vec3 p, vec3 n) { // three step ambient occlusion
  float occ = 0.0, wt = 1.0;
  for (int i = 1; i <= 3; i++) {
    float h = 0.1 / 3.0 * float(i);
    vec3 q = p + n * h;
    bool inBox = q.x > BOX.x && q.x < BOX.y && q.y > BOX.z && q.y < BOX.w;
    occ += max(0.0, h - (min(ground(q), inBox ? ext(bez(q.xy).x, q.z, LH) - LR : 1e9) - 0.005)) * wt;
    wt *= 0.5;
    if (occ > 0.2) break;
  }
  return clamp(1.0 - 5.0 * occ, 0.0, 1.0);
}
vec3 lighting(vec3 hp, vec3 n, vec3 ro) {
  vec3 L = -uLight, shadow = fakeShadow(hp, L);
  float spec = pow(max(dot(normalize(ro - hp), reflect(-L, n)), 0.0), 10.0) * 0.6;
  return clamp(0.9 * max(dot(n, L), 0.0) * shadow + 0.324 + spec * shadow, 0.0, 1.0);
}
vec3 background(vec3 ro, vec3 rd, float dist, float offset) { // ground, text, glow of the jelly
  vec3 hp = ro + rd * dist;
  float text = 0.0, highlights = 0.0, endX = uEnd.x;
  if (abs(hp.x - 0.72) < 0.19 && abs(hp.z) < 0.165) text = textureLod(uTxt, vec2((hp.x - 0.53) / 0.38, (hp.z + 0.165) / 0.33), 0.0).x;
  vec2 off = vec2(-uLight.x * 0.2, 0.05 + uLight.z * 0.2);
  if (abs(hp.x + off.x) < 1.0 && abs(hp.z + off.y) < 0.2) {
    float ac = abs((hp.z + off.y + 0.4) * 2.5 - 1.0) * 2.0;
    float dens = max(0.0, (textureLod(uBez, vec2((hp.x + off.x + 2.0) * 0.5 - 0.5, 1.0 - ac * ac * 0.3), 0.0).x - 0.25) * 8.0);
    float edgeFade = smoothstep(0.0, 0.2, endX - hp.x) * clamp(1.0 - ac * ac * ac, 0.0, 1.0) * clamp(1.0 - (endX + 1.0) * 0.5, 0.0, 1.0);
    highlights = dens * dens * dens * edgeFade * 3.0 * (1.0 + uLight.z) / 1.5;
  }
  float yb = clamp(ro.y + 0.01, 0.0, 1.0);
  vec3 p = hp + vec3(0.0, offset * (yb / (1.0 + yb)) * (1.0 + rnd() / 2.0), 0.0);
  vec3 n = groundN(p);
  float sq = dot(hp - vec3(endX, 0.0, 0.0), hp - vec3(endX, 0.0, 0.0));
  vec3 bounce = uJelly * (0.4 / (sq * 15.0 + 1.0) + 0.3 / (sq * 40.0 + 1.0) * abs(n.z));
  vec3 col = lighting(p, n, ro) * occlusion(p, n) + bounce;
  return mix(col, clamp(col * 0.5, 0.0, 1.0), text) * (1.0 + highlights);
}
vec3 groundOnly(vec3 ro, vec3 rd) { // refracted ray: ground only, few steps
  float dist = 0.0, hit = 0.0;
  for (int i = 0; i < 6; i++) {
    hit = ground(ro + rd * dist);
    dist += hit;
    if (dist > 10.0 || hit < SURF * 10.0) break;
  }
  return dist < 10.0 ? background(ro, rd, dist, uBlur * 0.87) : vec3(0.0);
}

vec3 shadeJelly(vec3 hp, vec3 I, float hitT) {
  vec4 s = bez(hp.xy);
  vec3 N = hitT < 0.96 ? jellyN(hp, s, hitT) : capN(hp);
  float crust = 0.0, lip = 0.0;
  if (uWear > 0.0) { // crust weight, and bumps from the wear offset of the distance field
    vec3 q = s.y > 0.94 ? capQ(hp) : hp, r = rimAt(hp, s, q);
    crust = wearAt(r).y; lip = r.x / LR;
    vec4 d;
    for (int i = 0; i < 4; i++) { // forward differences, one loop keeps the shader small
      vec3 o = hp + 0.002 * vec3(i == 1, i == 2, i == 3);
      vec4 t = bez(o.xy);
      d[i] = jelly(o, t, true) - jelly(o, t, false);
    }
    N = normalize(N + (d.yzw - d.x) / 0.002);
  }
  float cosi = clamp(dot(-I, N), 0.0, 1.0);
  float r0 = (1.0 - 1.42) / (1.0 + 1.42); r0 *= r0;
  float F = r0 + (1.0 - r0) * pow(1.0 - cosi, 5.0);
  vec3 refracted = vec3(0.0);
  float eta = 1.0 / 1.42, kr = 1.0 - eta * eta * (1.0 - cosi * cosi);
  if (kr > 0.0) {
    vec3 rd = normalize(I * eta + N * (eta * cosi - sqrt(kr)));
    vec3 env = groundOnly(hp + rd * (SURF * 4.0), rd);
    vec3 T = exp(-((1.0 - uJelly) * 20.0 * (1.0 + 1.6 * crust) * hitT * hitT) * 0.08); // Beer-Lambert
    refracted = env * T + uJelly * 1.5 * (3.0 * max(0.0, dot(-uLight, rd)) * hitT * hitT * hitT);
    refracted = mix(refracted, uJelly * uJelly * (0.35 + 0.65 * max(dot(N, -uLight), 0.0)), crust * 0.5); // caramel crust
  }
  vec3 col = mix(refracted, clamp(vec3(hp.y + 0.2), 0.0, 1.0), F);
  return col + mix(vec3(1.0, 0.93, 0.8), uJelly, 0.2) * crust * 1.2 * smoothstep(0.55, 0.9, lip) * (0.4 + 0.6 * pow(1.0 - cosi, 2.0)); // thin pale rim line
}

vec3 trace(vec3 ro, vec3 rd) {
  float bgDist = 0.0;
  for (int i = 0; i < 64; i++) {
    float h = ground(ro + rd * bgDist);
    bgDist += h;
    if (h < SURF) break;
  }
  vec3 t1 = (vec3(BOX.x, BOX.z, -0.25) - ro) / rd, t2 = (vec3(BOX.y, BOX.w, 0.25) - ro) / rd, a = min(t1, t2), b = max(t1, t2);
  float tIn = max(max(a.x, a.y), a.z), tOut = min(min(b.x, b.y), b.z);
  if (tOut >= tIn && tOut >= 0.0) { // only rays through the box around the jelly look for it
    float dist = max(0.0, tIn);
    for (int i = 0; i < 64; i++) {
      vec3 p = ro + rd * dist;
      vec4 s = bez(p.xy);
      float j = jelly(p, s, uWear > 0.0), g = ground(p);
      dist += min(j, g);
      if (min(j, g) < SURF) {
        if (j < g) return shadeJelly(ro + rd * dist, rd, s.y);
        break;
      }
      if (dist > bgDist || dist > tOut) break;
    }
  }
  return background(ro, rd, bgDist, 0.0);
}

void main() {
  uvec2 u = floatBitsToUint(uSeed * vec2(gl_FragCoord.x / uRes.x, 1.0 - gl_FragCoord.y / uRes.y));
  rs = u.x ^ (u.y * 2654435761u);
  rnd();
  cs = normalize(uEnd.zw - uEnd.xy);
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0 - uJit;
  vec3 f = normalize(-CAM), r = normalize(cross(f, vec3(0.0, 1.0, 0.0))), up = cross(r, f);
  fragColor = vec4(tanh(trace(CAM, normalize(f + r * (ndc.x * uTan.x) + up * (ndc.y * uTan.y))) * 1.3), 1.0);
}`;

// Bakes the wear of the rim into a 1024x64 texture: x runs along the rim, y is the distance to the rim (32 rows per side).
// Channels: distance offset (pinch, rolled lip, wrinkles, chips), crust weight.
const FS_WEAR = `#version 300 es
precision highp float;
uniform vec2 uWear; // wear 0..1 and the fixed seed of this slider
out vec4 o;
float hash(vec2 p) { p = fract(p * vec2(0.1031, 0.103)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + 1.0), f.x), f.y);
}
void main() {
  float side = step(32.0, gl_FragCoord.y), u = gl_FragCoord.x / 1024.0 * 2.1;
  float e = (gl_FragCoord.y - 32.0 * side) / 32.0 * 0.12 - 0.09;
  vec2 q = vec2(u, side * 31.0 + uWear.y * 17.0);
  // uneven wear: stronger towards the pulled end and varied by noise
  float k = pow(clamp(uWear.x * mix(0.55, 1.0, vnoise(q * 2.3)) * mix(0.5, 1.0, u / 1.9), 0.0, 1.0), 0.45);
  float rim = smoothstep(-0.035, 0.0, e), tip = smoothstep(-0.015, 0.012, e);
  float roll = smoothstep(-0.045, -0.02, e) * (1.0 - smoothstep(-0.02, 0.0, e)) * (0.0015 + 0.003 * k) * (0.5 + vnoise(q * 4.7)); // rolled lip
  float uw = u + 0.012 * vnoise(q * 9.0); // warped so the wrinkles do not look regular
  float crease = 1.0 - abs(2.0 * vnoise(vec2(uw * 47.0, e * 25.0 + q.y)) - 1.0); // sharp creases across the rim, in patches
  crease *= crease * smoothstep(0.25, 0.75, vnoise(q * 3.1 + 5.0)) * k * k * k * 0.0055;
  float wrinkle = ((vnoise(q * 13.0) - 0.5) * 0.004 + (vnoise(vec2(uw * 71.0 + 3.1, q.y)) - 0.5) * 0.002) * k + crease;
  float chip = smoothstep(0.4, 0.95, k) * (pow(smoothstep(0.64, 0.95, vnoise(q * 19.0 + 9.0)), 1.5) * 0.012 + smoothstep(0.7, 0.95, vnoise(q * 83.0)) * 0.004);
  o = vec4(tip * (0.011 * (1.0 - 0.65 * k) + chip) + rim * wrinkle - roll, k * smoothstep(-0.03, 0.01, e), 0.0, 0.0);
}`;

// Temporal anti aliasing: history clamped to the neighbourhood, resolved into the history target.
const FS_TAA = `#version 300 es
precision mediump float;
uniform sampler2D uCur, uHist;
uniform highp vec2 uDim;
uniform float uBlend;
out vec4 fragColor;
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
void main() {
  ivec2 g = ivec2(gl_FragCoord.xy), mx = ivec2(uDim) - 1;
  vec3 cur = texelFetch(uCur, g, 0).rgb, lo = cur, hi = cur;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec3 c = texelFetch(uCur, clamp(g + ivec2(x, y), ivec2(0), mx), 0).rgb;
    lo = min(lo, c); hi = max(hi, c);
  }
  vec3 hist = clamp(texelFetch(uHist, g, 0).rgb, lo, hi);
  vec2 uv = vec2(g.x, mx.y - g.y) / uDim;
  float text = ss(0.69, 0.73, uv.x) * (1.0 - ss(0.83, 0.87, uv.x)) * ss(0.45, 0.49, uv.y) * (1.0 - ss(0.53, 0.57, uv.y));
  fragColor = vec4(mix(cur, hist, mix(uBlend, min(uBlend, 0.7), text)), 1.0);
}`;

// WebGL setup
const $ = (id) => document.getElementById(id);
const canvas = $('scene');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false });
function fail(text) { $('msg').style.display = 'grid'; $('msg').textContent = text; throw new Error(text); }
if (!gl) fail('WebGL 2 is not available in this browser.');
// The rope and wear textures are RGBA16F targets: the half float extension is enough, no CPU fallback needed.
if (!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))) fail('This device cannot render to float textures.');

function program(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('This device could not compile the jelly shaders.');
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('This device could not compile the jelly shaders.');
  p.u = {};
  return p;
}
function uni(p, name, ...v) { // floats, or one array for a vec2 array
  const l = (p.u[name] ??= gl.getUniformLocation(p, name));
  if (v[0].length) gl.uniform2fv(l, v[0]); else gl['uniform' + v.length + 'f'](l, ...v);
}
const pBez = program(FS_BEZIER), pRay = program(FS_RAY), pTaa = program(FS_TAA), pWear = program(FS_WEAR);
gl.bindVertexArray(gl.createVertexArray());

function target(w, h, internal = gl.RGBA8, type = gl.UNSIGNED_BYTE) { // texture with its framebuffer
  const tex = gl.createTexture(), fbo = gl.createFramebuffer();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('This device cannot render to the needed textures.');
  return { tex, fbo };
}
const bezier = target(BW, BH, gl.RGBA16F, gl.HALF_FLOAT), wearTex = target(1024, 64, gl.RGBA16F, gl.HALF_FLOAT), digits = target(512, 256);
const bind = (unit, tex) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); };
const pass = (t, prog, w, h) => { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.viewport(0, 0, w, h); gl.useProgram(prog); };

// The percentage text is one canvas texture, redrawn when the number changes.
const textCanvas = Object.assign(document.createElement('canvas'), { width: 512, height: 256 });
const tctx = textCanvas.getContext('2d');
tctx.textAlign = 'right'; tctx.textBaseline = 'middle'; tctx.fillStyle = 'white';
let shownPct = -1;
function drawPct(pct) {
  shownPct = pct;
  tctx.clearRect(0, 0, 512, 256);
  tctx.font = '180px monospace'; tctx.fillText(pct + ' ', 492, 128);
  tctx.font = '140px monospace'; tctx.fillText('%', 492, 138);
  bind(1, digits.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
}

gl.useProgram(pRay);
['uBez', 'uTxt', 'uWearTex'].forEach((name, i) => gl.uniform1i(gl.getUniformLocation(pRay, name), i));
gl.useProgram(pTaa);
['uCur', 'uHist'].forEach((name, i) => gl.uniform1i(gl.getUniformLocation(pTaa, name), i));

// State: wear, controls, pointer
// Wear (0 fresh, 1 worn out) grows with the sliding distance and is kept in localStorage with a fixed seed.
const KEY = 'jelly-slider-wear', WEAR0 = 0.15, SEED0 = 0.37;
let wear = WEAR0, seed = SEED0;
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && s.w >= 0 && s.w <= 1) { wear = s.w; seed = typeof s.s === 'number' ? s.s : SEED0; }
} catch (e) { /* storage blocked: the page works without it */ }
function saveWear() {
  try { localStorage.setItem(KEY, JSON.stringify({ w: +wear.toFixed(4), s: seed })); } catch (e) { /* ignore */ }
}
function showWear() {
  const t = wear.toFixed(2);
  if ($('wearOut').textContent !== t) { $('wearOut').textContent = t; $('wearIn').value = wear; }
}
showWear();

const ui = { jelly: [1, 0.45, 0.075], blur: 0, quality: 'auto' };
const unit = (v) => v.map((x) => x / Math.hypot(...v));
const DIR_A = unit([0.18, -0.3, 0.64]), DIR_B = unit([-0.5, -0.14, -0.8]);
function setLight(v) { // a direction, or the slider position between two directions
  ui.light = unit(v.length ? v : DIR_A.map((a, i) => a * (1 - v) + DIR_B[i] * v));
}
setLight([0.19, -0.24, 0.75]);

const pointer = { down: false, x: 1, target: 1 };
function aim(clientX) {
  const r = canvas.getBoundingClientRect();
  pointer.target = ((clamp((clientX - r.left) / r.width, 0.45, 0.9) - 0.4) / 0.5) * 1.7 - 0.5;
}

// Rendering: progressive resolution and render on demand
// While the rope moves the image renders at a low scale. At rest it is full resolution, converges for a few frames and stops.
const LEVELS = [0.3, 0.5, 0.7]; // Auto scale while moving
let level = 1, maxLevel = 2, slow = 0, fast = 0;
let raf = 0, last = 0, holdUntil = 0, idle = 0, n = 0, parity = 0, frames = 0, bakeDue = true, bakedWear = -1, busy = false, curSet = null;
const sets = new Map();

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === canvas.width && h === canvas.height) return;
  canvas.width = w; canvas.height = h;
  for (const s of sets.values()) for (const t of [s.rm, ...s.taa]) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
  sets.clear();
}
function renderSet(scale) { // raymarch target and two history targets for one resolution
  const w = Math.max(1, Math.round(canvas.width * scale)), h = Math.max(1, Math.round(canvas.height * scale)), key = w + 'x' + h;
  if (!sets.has(key)) sets.set(key, { w, h, rm: target(w, h), taa: [target(w, h), target(w, h)] });
  return sets.get(key);
}

function draw(set) {
  const { P, C } = rope, cur = parity ^= 1, e = Array.from(P.slice(30, 34));
  const pct = clamp(Math.floor((e[0] + 0.43) * 84), 0, 100);
  if (pct !== shownPct) drawPct(pct);
  if (bakeDue) { // rope to texture, only when it moved
    pass(bezier, pBez, BW, BH);
    uni(pBez, 'uP', P); uni(pBez, 'uC', C);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    bakeDue = false;
  }
  if (wear > 0 && Math.round(wear * 500) !== bakedWear) { // wear texture, only when the wear changed
    bakedWear = Math.round(wear * 500);
    pass(wearTex, pWear, 1024, 64);
    uni(pWear, 'uWear', wear, seed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  const asp = set.w / set.h, ty = Math.tan(Math.PI / 8) / Math.min(asp, 1);
  const jit = [0.7548776662, 0.5698402910].map((a) => ((n + 1) * a) % 1 - 0.5); // sub pixel jitter, R2 sequence

  pass(set.rm, pRay, set.w, set.h);
  bind(0, bezier.tex); bind(1, digits.tex); bind(2, wearTex.tex);
  uni(pRay, 'uRes', set.w, set.h); uni(pRay, 'uTan', ty * asp, ty);
  uni(pRay, 'uJit', jit[0] * 2 / set.w, jit[1] * 2 / set.h);
  uni(pRay, 'uSeed', Math.random() * 2 - 1, Math.random() * 2 - 1);
  uni(pRay, 'uWear', wear); uni(pRay, 'uBlur', ui.blur);
  uni(pRay, 'uEnd', ...e);
  uni(pRay, 'uJelly', ...ui.jelly); uni(pRay, 'uLight', ...ui.light);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  pass(set.taa[cur], pTaa, set.w, set.h);
  bind(0, set.rm.tex); bind(1, n ? set.taa[1 - cur].tex : set.rm.tex);
  uni(pTaa, 'uDim', set.w, set.h); uni(pTaa, 'uBlend', n ? Math.min(0.9, 1 - 1 / (n + 1)) : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, set.taa[cur].fbo); // resolve and blit in one copy
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, set.w, set.h, 0, 0, canvas.width, canvas.height, gl.COLOR_BUFFER_BIT, gl.LINEAR);
  n++; frames++;
}

// One frame of simulation and drawing. Returns true while more frames are needed.
function tick(dt) {
  fit();
  if (pointer.down) pointer.x += (pointer.target - pointer.x) * 0.08;
  const endX = rope.P[2 * N - 2];
  rope.setDrag(pointer.x);
  const moved = rope.update(dt);
  if (moved > 0) {
    bakeDue = true;
    const dx = Math.abs(rope.P[2 * N - 2] - endX); // sliding wears the edge: one sweep adds 1/40, slowing down towards 1
    if (dx > 0) {
      wear = Math.min(1, wear + (dx / 1.2 / 40) * (1.05 - wear)); showWear();
    }
  }
  busy = moved > 3e-3 || (pointer.down && Math.abs(pointer.target - pointer.x) > 1e-4) || performance.now() < holdUntil;
  const set = renderSet(ui.quality === 'auto' ? (busy ? LEVELS[level] : 1) : +ui.quality);
  if (set !== curSet) { curSet = set; n = 0; } // new resolution: restart the history
  draw(set);
  idle = busy ? 0 : idle + 1;
  return busy || idle < (ui.blur ? 24 : 10);
}

function loop(ts) {
  raf = 0;
  const ms = ts - last, dt = last ? Math.min(ms / 1000, 0.1) : 0;
  last = ts;
  if (busy && dt && ui.quality === 'auto') { // dynamic resolution: down after slow frames, slowly back up
    if (ms > 24) { fast = 0; if (++slow > 6 && level > 0) { level -= 1; maxLevel = level; slow = 0; } }
    else { slow = 0; if (ms < 17.5 && level < maxLevel && ++fast > 90) { level++; fast = 0; } }
  }
  if (tick(dt)) raf = requestAnimationFrame(loop);
}
function wake(hold) {
  idle = 0;
  if (hold) holdUntil = performance.now() + 250;
  if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
}

// Events
canvas.addEventListener('pointerdown', (e) => {
  pointer.down = true; aim(e.clientX);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  wake();
});
canvas.addEventListener('pointermove', (e) => { if (pointer.down) { aim(e.clientX); wake(); } });
for (const type of ['pointerup', 'pointercancel']) canvas.addEventListener(type, () => { pointer.down = false; saveWear(); wake(); });
addEventListener('pagehide', saveWear);
canvas.addEventListener('webglcontextlost', (e) => e.preventDefault()); // idle pages draw nothing, so start over once the context is back
canvas.addEventListener('webglcontextrestored', () => location.reload());
addEventListener('resize', () => { wake(true); tick(0); });
$('quality').onchange = (e) => { ui.quality = e.target.value; level = 1; maxLevel = 2; wake(true); };
$('light').oninput = (e) => { setLight(+e.target.value); wake(true); };
$('color').oninput = (e) => { ui.jelly = [1, 3, 5].map((i) => parseInt(e.target.value.slice(i, i + 2), 16) / 255); wake(true); };
$('blur').onchange = (e) => { ui.blur = +e.target.checked; wake(true); };
$('wearIn').oninput = (e) => { wear = +e.target.value; showWear(); saveWear(); wake(true); };
$('reset').onclick = () => { wear = WEAR0; seed = SEED0; try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } showWear(); wake(true); };

// Start: settle the rope, show the finished piece at full resolution
fit();
for (let i = 0; i < 120; i++) rope.update(1 / 60);
tick(0);
wake();
</script>
</body>
