<!--
  Prompt: Blind-playable Labyrinth with 2D ray-traced spatial audio + haptics.
  Single self-contained HTML, inline CSS/JS. three.js + cannon-es + Web Audio.
  Inspired by BRIO 34000 (wooden box, glass top, metal ball, gravity tilt).
  Navigate blindly: sound volume = distance to exit (close=hot, far=cold).
  S(t) = (1-M_t)*G_dir*EQ(E_dir)*A_dir*delta(t-d/c) + sum[reflections]

  Vibe: Satisfaction next-level 3D Physics Showcase, pleasing/relaxing, always
  self-indicate in realistic way WHERE you are via 3D spatial audio.

  Aesthetic direction:
  - Visually stunning nebula with volumetric fog/cloud effects, lighting passthrough
    refraction/ray casting for realistic and believable moving sci-fi effects.
    Fog for atmospheric depth, cosmic glow, semi-transparent smoke particles slowly
    rotating. Starry sky with glowing, ethereal effects. Deep space aesthetics with
    floating elements. Nice and fascinating. Performance acceptable for mobile.
  - Exit beacon: soft, warm, never whiny. Rolling ball more noticeable than exit.
    Rolling never masks alerts (sidechain ducking).
  - Walls feel solid like office room, not thin prototype lines.
  - Holes emit low rumble + intermittent ticking as you cross risk thresholds.
  - Grooved path mode toggle for channelized blind-friendly experience.
  - Debug overlay (D key): show rays, LOS ratio, tap count.
  - URL params: ?difficulty=easy|medium|hard&groove=1&audioRays=128
  - Permissions flow: Enable Audio + Enable Motion gate before gameplay starts.

  Mistakes to avoid:
  - Ball escapes map with fake isometric view. Orientation must give velocity to ball
    for left/right, not clip underground or jump above walls.
  - Maze grid MUST be odd-sized (11 not 10) or step=2 carve creates unreachable exits.
  - Start/exit coords must land on odd cells (carve lattice), use (N-2)|1.
  - Do NOT create oscillators per frame. Node pooling, reuse, EMA smoothing everywhere.
  - Do NOT run ray tracing on main thread (Worker only, 15Hz).
  - Key release must immediately zero force (key state map, not cumulative).
  - On win/respawn: one clean rebuild only, guard with regenerating flag.
  - Collision callback: Math.abs(fn||0) not Math.abs(fn||0.5) - zero-force contacts
    must not trigger phantom sounds.
  - Reflection tap attenuation: apply proxGate once (per-band OR mix), not both.
  - Stars render BEHIND clouds (multiply by transmittance T), not on top.
  - No constant background drone when far from exit. Beacon proximity-gated.
  - Ray trace bounces must not self-intersect: offset origin by small epsilon along
    reflection vector after each bounce, or rays re-hit the same wall instantly.
  - Listener is the hearer - rays from source must not count the source position
    itself as a "hit". Check listener-circle intersection on path segments only.
  - PannerNode rolloffFactor must be 0 when doing manual distance attenuation,
    or you get double falloff (once in panner, once in gain math).
-->

<body>

  <script type="module">
/*
Strict equation mapping:

S(t) = (1 - M_t) G_dir(θ_dir) EQ(E_dir) A_dir δ(t - d_dir/c)
     + Σ_r Σ_j H_{r,j} E_{r,j} (1/d_{r,j}^2) G_pan(θ_{r,j}) EQ(E_{r,j}) δ(t - d_{r,j}/c)
*/
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import * as CANNON from 'cannon-es';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ============================================================
   Ray‑marched Volumetric Clouds — smooth "v1" aesthetic
   - Single ShaderPass behind scene
   - Larger features, fewer octaves, center focus mask
   - Yellow god‑rays inside shader with soft shadows
============================================================ */
const VolumetricCloudsShader = {
  uniforms: {
    uTime:        { value: 0 },
    uResolution:  { value: new THREE.Vector2(1,1) },
    uCamPos:      { value: new THREE.Vector3() },
    uCamDir:      { value: new THREE.Vector3(0,0,-1) },
    uCamRight:    { value: new THREE.Vector3(1,0,0) },
    uCamUp:       { value: new THREE.Vector3(0,1,0) },
    uFovY:        { value: 50 * Math.PI / 180 },
    uAspect:      { value: 1.0 },
    uLightDir:    { value: new THREE.Vector3(0.35, 0.35, -0.88).normalize() },

    // Look
    uDensity:     { value: 0.42 },
    uBrightness:  { value: 0.84 },
    uAmbient:     { value: 0.08 },
    uNoiseScale:  { value: 0.012 },   // larger structures (less noisy)
    uSteps:       { value: 52.0 },    // float (mobile-stable)

    // Aesthetic colors
    uCloudColor1: { value: new THREE.Color(0x4cc9f0) },
    uCloudColor2: { value: new THREE.Color(0xf72585) },

    // Center focus
    uFocusStrength:{ value: 0.65 },   // 0..1 amount of center emphasis
    uFocusRadius:  { value: 0.55 },   // 0..1 radius in NDC

    // Jitter and shadowing
    uJitterAmp:   { value: 0.25 },    // smaller => less shimmer
    uShadowTaps:  { value: 6.0 },

    // God-rays
    uBeamColor:   { value: new THREE.Color(1.0, 0.88, 0.52) }, // warm yellow
    uBeamStrength:{ value: 0.85 },    // shaft intensity
    uAniso:       { value: 0.65 }     // HG anisotropy
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;

    uniform vec2  uResolution;
    uniform float uTime, uFovY, uAspect, uDensity, uBrightness, uAmbient, uSteps, uNoiseScale;
    uniform float uJitterAmp, uShadowTaps, uFocusStrength, uFocusRadius, uAniso, uBeamStrength;
    uniform vec3  uCamPos, uCamDir, uCamRight, uCamUp, uLightDir, uCloudColor1, uCloudColor2, uBeamColor;

    // Starfield: procedural stars visible behind clouds
    float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float starField(vec3 rd){
      // Project ray direction to spherical coords for stable star positions
      vec2 uv = vec2(atan(rd.z, rd.x), asin(clamp(rd.y,-1.0,1.0)));
      uv *= vec2(20.0, 20.0); // grid density
      vec2 id = floor(uv);
      vec2 f = fract(uv);
      float star = 0.0;
      // Check 3x3 neighborhood for nearest star
      for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
        vec2 n = vec2(float(i),float(j));
        vec2 p = vec2(hash2(id+n), hash2(id+n+73.1));
        vec2 d = n + p - f;
        float dist = length(d);
        float brightness = hash2(id+n+137.3);
        // Only ~30% of cells have visible stars
        if(brightness > 0.7){
          float sz = 0.015 + brightness * 0.012;
          float s = smoothstep(sz, sz*0.3, dist);
          // Subtle twinkle
          s *= 0.5 + 0.5 * sin(brightness*6.28 + uTime*0.8 + hash2(id+n+42.0)*6.28);
          star = max(star, s * (brightness - 0.7) * 3.33);
        }
      }
      return star;
    }

    // 3D value noise + fbm (fewer octaves => smoother look)
    float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }

    float noise3D(vec3 x){
      vec3 p = floor(x);
      vec3 f = fract(x);
      f = f*f*(3.0-2.0*f);
      float n = dot(p, vec3(1.0,57.0,113.0));
      float a = hash(p);
      float b = hash(p + vec3(1.0,0.0,0.0));
      float c = hash(p + vec3(0.0,1.0,0.0));
      float d = hash(p + vec3(1.0,1.0,0.0));
      float e = hash(p + vec3(0.0,0.0,1.0));
      float fz= hash(p + vec3(1.0,0.0,1.0));
      float g = hash(p + vec3(0.0,1.0,1.0));
      float h = hash(p + vec3(1.0,1.0,1.0));
      float k1 = mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
      float k2 = mix(mix(e,fz,f.x),mix(g,h,f.x), f.y);
      return mix(k1, k2, f.z);
    }

    float fbm(vec3 p){
      float sum=0.0, amp=0.55;
      for(int i=0;i<4;i++){    // 4 octaves only (less noisy)
        sum += amp * noise3D(p);
        p *= 2.0;
        amp *= 0.5;
      }
      return sum;
    }

    // Soft density with domain warp and tight thresholds (v1 feel)
    float smoothDensity(vec3 p){
      vec3 q = p * uNoiseScale + vec3(0.0, uTime*0.02, 0.0);
      float w1 = fbm(q);
      float w2 = fbm(q*1.7 + w1);
      float n  = fbm(q + w2*1.35);
      // Tighter window -> smoother blobs, less speckle
      return smoothstep(0.60, 0.80, n);
    }

    // Henyey–Greenstein phase
    float hg(float g, float ct){
      float gg=g*g;
      return (1.0 - gg) / pow(1.0 + gg - 2.0*g*ct, 1.5);
    }

    void main(){
      vec2 uv = vUv*2.0 - 1.0;
      float tanFov = tan(0.5 * uFovY);
      vec3 rd = normalize(uCamDir + uv.x * uAspect * tanFov * uCamRight + uv.y * tanFov * uCamUp);
      vec3 ro = uCamPos;

      float tMin = 12.0;
      float tMax = 160.0;

      // tiny temporal jitter for anti-banding without shimmer
      float seed = fract(sin(dot(uv, vec2(12.9898,78.233)) + uTime*0.73) * 43758.5453);
      float jitter = (seed - 0.5) * uJitterAmp;

      const int MAX_STEPS = 96;
      float stepLen = (tMax - tMin) / max(1.0, uSteps);

      vec3  col = vec3(0.0);
      float T   = 1.0;
      vec3  L   = normalize(uLightDir);
      float g   = clamp(uAniso, 0.0, 0.95);

      // Center-focus mask in NDC
      float r2 = dot(uv, uv);
      float sigma2 = max(1e-3, uFocusRadius*uFocusRadius);
      float focus = exp(-r2 / sigma2);
      float focusMix = mix(1.0, focus, clamp(uFocusStrength, 0.0, 1.0));

      for (int i=0; i<MAX_STEPS; i++){
        if (float(i) >= uSteps) break;
        float t = tMin + (float(i) + jitter) * stepLen;
        vec3 p = ro + rd * t;

        float d = smoothDensity(p) * uDensity * focusMix;
        if (d > 0.001){
          // Soft shadow along light
          float occ = 0.0;
          vec3  lp  = p;
          float lstep = 11.0;
          int taps = int(clamp(uShadowTaps, 0.0, 8.0));
          for (int s=0; s<8; s++){
            if (s >= taps) break;
            lp -= L * lstep;
            occ += smoothDensity(lp) * 0.09;
          }
          float shadow = exp(-occ * 1.7);

          // Color and phase
          float ct = dot(rd, -L);
          float phase = hg(g, ct);

          // Yellow god-ray boost along sun axis
          float beam = pow(max(ct,0.0), 18.0) * uBeamStrength;

          float absorb = exp(-d * stepLen * 1.6);

          float mixv = clamp(fbm(p * (uNoiseScale*2.4)), 0.0, 1.0);
          vec3 scatterCol = mix(uCloudColor1, uCloudColor2, mixv);

          vec3 contrib = (scatterCol * phase + uBeamColor * beam) * shadow;

          col += (1.0 - absorb) * contrib * T;
          T   *= absorb;

          if (T < 0.02) break;
        }
      }

      // Stars behind clouds: only visible where transmittance is high (no cloud)
      float stars = starField(rd) * 0.6;
      vec3 starCol = mix(vec3(0.8,0.85,1.0), vec3(1.0,0.9,0.8), hash2(rd.xz*10.0));
      col += stars * starCol * T; // T is remaining transmittance - clouds occlude stars

      // Ambient tone + background
      col += vec3(0.02, 0.02, 0.03) * uAmbient;
      vec3 bg = vec3(0.02, 0.03, 0.05);
      col = col * uBrightness + bg * T * 0.5;

      gl_FragColor = vec4(col, 1.0);
    }
  `
};

/* ============================================================
   Worker — occlusion + transmission + reflections (unchanged)
============================================================ */
const RAY_WORKER = `
const SPEED_OF_SOUND = 343;
const AIR = { low: 0.001, mid: 0.01, high: 0.05 };
const MATERIALS = {
  wall: {
    absorb:   { low: 0.05, mid: 0.10, high: 0.20 },
    reflect:  { low: 0.90, mid: 0.85, high: 0.75 },
    transmit: { low: 0.05, mid: 0.05, high: 0.05 },
    thickness: 0.3
  }
};
let walls = [];

self.onmessage = (e) => {
  const { type, data } = e.data || {};
  if (type === 'init') {
    walls = data.walls || [];
  } else if (type === 'trace') {
    const { source, listener, numRays=64, maxBounces=5 } = data;
    const occlusion = computeOcclusion(source, listener, walls);
    const Edir = computeDirectTransmission(source, listener, walls, MATERIALS.wall);
    const reflections = traceReflections(source, listener, walls, numRays, maxBounces);
    self.postMessage({ occlusion, Edir, reflections });
  }
};

function computeOcclusion(source, listener, w) {
    const dx = listener.x - source.x, dz = listener.z - source.z;
    const d = Math.hypot(dx, dz) || 1e-6;

    // Hard LOS check: if the straight ray hits a wall before the listener, we are blocked.
    const dir0 = { x: dx / d, z: dz / d };
    const hit0 = findClosest(source, dir0, w);
    if (hit0 && hit0.distance < d - 1e-4) return 1.0;

    // Wedge sampling around the direct path for partial occlusion
    const base = Math.atan2(dz, dx);
    const N = 31, spread = Math.PI/18;
    let occ = 0;
    for (let k=0;k<N;k++){
      const a = base + (k/(N-1)-0.5)*spread;
      const dir={x:Math.cos(a),z:Math.sin(a)};
      const hit=findClosest(source, dir, w);
      if (hit && hit.distance < d-0.1) occ++;
    }
    return occ/N;
  }

function computeDirectTransmission(source, listener, w, mat) {
  const dx = listener.x - source.x, dz = listener.z - source.z;
  const total = Math.hypot(dx, dz) || 1e-6;
  const dir = { x: dx/total, z: dz/total };
  let pos={x:source.x, z:source.z}, remaining=total;
  let E={ low:1, mid:1, high:1 };
  const th = mat.thickness;

  for (let i=0;i<24 && remaining>0.01;i++){
    const hit=findClosest(pos, dir, w);
    if (!hit || hit.distance >= remaining) {
      E.low *= Math.exp(-AIR.low*remaining);
      E.mid *= Math.exp(-AIR.mid*remaining);
      E.high*= Math.exp(-AIR.high*remaining);
      break;
    }
    E.low *= Math.exp(-AIR.low*hit.distance);
    E.mid *= Math.exp(-AIR.mid*hit.distance);
    E.high*= Math.exp(-AIR.high*hit.distance);

    const aL = 1 - Math.pow(1 - mat.absorb.low, th);
    const aM = 1 - Math.pow(1 - mat.absorb.mid, th);
    const aH = 1 - Math.pow(1 - mat.absorb.high, th);
    E.low *= Math.pow(mat.transmit.low, th) * (1 - aL);
    E.mid *= Math.pow(mat.transmit.mid, th) * (1 - aM);
    E.high*= Math.pow(mat.transmit.high, th) * (1 - aH);

    pos={ x: hit.point.x + dir.x*1e-3, z: hit.point.z + dir.z*1e-3 };
    remaining -= hit.distance;
  }
  return E;
}

function traceReflections(source, listener, w, numRays, maxBounces) {
  const taps=[];
  for (let i=0;i<numRays;i++){
    const ang=(i/numRays)*Math.PI*2;
    let pos={x:source.x, z:source.z};
    let dir={x:Math.cos(ang), z:Math.sin(ang)};
    let E={low:1, mid:1, high:1};
    let traveled=0;

    for (let b=0;b<maxBounces;b++){
      const hit=findClosest(pos, dir, w);
      if(!hit) break;
      traveled += hit.distance;

      E.low *= Math.exp(-AIR.low*hit.distance);
      E.mid *= Math.exp(-AIR.mid*hit.distance);
      E.high*= Math.exp(-AIR.high*hit.distance);

      // compute reflected direction at this hit (specular)
      const nd0 = dir.x*hit.normal.x + dir.z*hit.normal.z;
      const dirRef = { x: dir.x - 2*nd0*hit.normal.x, z: dir.z - 2*nd0*hit.normal.z };

      // test if listener is reachable from this bounce point
      const vLx = listener.x - hit.point.x;
      const vLz = listener.z - hit.point.z;
      const dL = Math.hypot(vLx, vLz);
      if (dL > 1e-3) {
        const dirToL = { x: vLx/dL, z: vLz/dL };
        // alignment 0..1: favor bounces that point toward listener
        const align = Math.max(0, dirRef.x*dirToL.x + dirRef.z*dirToL.z);
        // line-of-sight from bounce to listener
        const hitL = findClosest(hit.point, dirToL, w);
        if (!hitL || hitL.distance >= dL - 1e-3) {
          const dTot = traveled + dL;
          const atten = 1 / Math.max(0.5, dTot*dTot);
          const g = 0.35 + 0.65*align; // weight by alignment
          taps.push({
            delay: dTot / SPEED_OF_SOUND,
            energy: { low: E.low*atten*g, mid: E.mid*atten*g, high: E.high*atten*g },
            angle: Math.atan2(vLz, vLx)
          });
        }
      }

      const th = 0.3;
      const aL = 1 - Math.pow(1 - 0.05, th);
      const aM = 1 - Math.pow(1 - 0.10, th);
      const aH = 1 - Math.pow(1 - 0.20, th);
      E.low *= 0.90 * (1 - aL);
      E.mid *= 0.85 * (1 - aM);
      E.high*= 0.75 * (1 - aH);

      const nd = dir.x*hit.normal.x + dir.z*hit.normal.z;
      dir = { x: dir.x - 2*nd*hit.normal.x, z: dir.z - 2*nd*hit.normal.z };
      pos = { x: hit.point.x + dir.x*1e-3, z: hit.point.z + dir.z*1e-3 };

      if ((E.low+E.mid+E.high) < 1e-3) break;
    }
  }
  taps.sort((a,b)=> ((b.energy.low+b.energy.mid+b.energy.high) - (a.energy.low+a.energy.mid+a.energy.high)));
  return taps.slice(0, 16);
}

function findClosest(origin, dir, w) {
  let best=null, min=Infinity;
  for (const S of w){
    const h = raySeg(origin, dir, {x:S.x1,z:S.z1}, {x:S.x2,z:S.z2});
    if (h && h.distance>1e-4 && h.distance<min){ best=h; min=h.distance; }
  }
  return best;
}
function raySeg(o, d, a, b){
  const sx=b.x-a.x, sz=b.z-a.z;
  const det = d.x*sz - d.z*sx; if (Math.abs(det)<1e-10) return null;
  const t = ((a.x-o.x)*sz - (a.z-o.z)*sx)/det;
  const u = ((a.x-o.x)*d.z - (a.z-o.z)*d.x)/det;
  if (t>0 && u>=0 && u<=1){
    const x = o.x + d.x*t, z = o.z + d.z*t;
    const len = Math.hypot(sx,sz)||1, nx=sz/len, nz=-sx/len;
    return { distance:t, point:{x,z}, normal:{x:nx,z:nz} };
  }
  return null;
}
function segmentNearListener(p1,p2,c,r){
  const vx = p2.x - p1.x, vz = p2.z - p1.z, wx = c.x - p1.x, wz = c.z - p1.z;
  const vv=vx*vx+vz*vz; if (vv<1e-10) return false;
  let t=(wx*vx+wz*vz)/vv; t=Math.max(0,Math.min(1,t));
  const px=p1.x+t*vx, pz=p1.z+t*vz;
  const dx=c.x-px, dz=c.z-pz;
  return (dx*dx+dz*dz)<=r*r;
}
`;

/* ============================================================
   Haptics
============================================================ */
class Haptics {
  constructor() { this.enabled = 'vibrate' in navigator; this.nextAt = 0; }
  update(prox, mt, speed) {
    if (!this.enabled) return;
    const now = performance.now();
    const minPeriod = 120, maxPeriod = 450;
    const period = lerp(maxPeriod, minPeriod, prox);
    if (now < this.nextAt) return;
    const base = lerp(3, 24, prox);
    const speedBoost = Math.min(10, speed * 2);
    const strength = Math.min(40, base + speedBoost);
    const occ = mt;
    const trimmed = Math.max(5, strength * (0.85 - 0.5 * occ));
    if (occ > 0.4) navigator.vibrate([trimmed, 60, trimmed * 0.6]); else navigator.vibrate(trimmed);
    this.nextAt = now + period;
  }
  impact(v) { if (!this.enabled) return; navigator.vibrate(Math.min(200, 40 + v * 160)); }
}

/* ============================================================
   Audio engine — balanced beacon/rolling (math intact)
============================================================ */
class PerfectRayAudio {
  constructor(){
    this.ctx=null; this.master=null;
    this.sourceBus=null;
    this.direct={ gain:null, low:null, mid:null, high:null, tone:null, delay:null, panner:null, osc1:null, tremOsc:null, tremDepth:null, trem:null };
    this.taps=[];
    this.ball={ filter:null, gain:null, panner:null, ema:0 };
    this.worker=null; this.initialized=false;
    this.M_t=0; this.E_dir={low:1,mid:1,high:1};
    this.lastTrace=0;
    this.listenerPos={x:0,z:0};
    this.lastProximity=0;
    this.minAudibleFloor = 0.025;
    this.wallsPending = null;
  }

  async init(){
    const start = async ()=>{
      if (this.initialized) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx({ latencyHint:'interactive', sampleRate:48000 });

      const comp=this.ctx.createDynamicsCompressor();
      comp.threshold.value=-12; comp.knee.value=8; comp.ratio.value=4; comp.attack.value=0.002; comp.release.value=0.1;
      this.master=this.ctx.createGain(); this.master.gain.value=0.75;
      this.master.connect(comp); comp.connect(this.ctx.destination);

      this.initSignal();
      this.initDirectChain();
      this.initTaps(16);
      this.initBall();
      this.initWorker();

      this.initialized=true;
      document.removeEventListener('pointerdown', start);
      document.removeEventListener('keydown', start);
    };
    document.addEventListener('pointerdown', start, { once:true });
    document.addEventListener('keydown', start, { once:true });
  }

  // --- FIX START: AUDIO RESET ---
  reset() {
    if (!this.initialized) return;

    // Reset all state variables
    this.M_t = 0;
    this.E_dir = {low:1, mid:1, high:1};
    this.lastTrace = 0;
    this.listenerPos = {x:0, z:0};
    this.lastProximity = 0;

    // Reset audio parameters to initial values
    const now = this.ctx.currentTime;
    this.direct.gain.gain.setTargetAtTime(0, now, 0.01);
    this.direct.tremDepth.gain.setTargetAtTime(0, now, 0.01);

    // Reset EQ filters and frequencies to initial values
    this.direct.low.gain.setTargetAtTime(0, now, 0.01);
    this.direct.mid.gain.setTargetAtTime(-1, now, 0.01);
    this.direct.high.gain.setTargetAtTime(-2, now, 0.01);
    this.direct.tone.frequency.setTargetAtTime(1350, now, 0.01);
    this.direct.osc1.frequency.setTargetAtTime(195, now, 0.01);
    this.direct.tremOsc.frequency.setTargetAtTime(2.2, now, 0.01);

    this.ball.ema = 0;
    this.ball.gain.gain.setTargetAtTime(0, now, 0.01);

    // Reset all reflection taps
    for (let i = 0; i < this.taps.length; i++) {
      this.taps[i].mix.gain.setTargetAtTime(0, now, 0.01);
    }
  }
  // --- FIX END: AUDIO RESET ---

  initSignal(){
    const noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let x1=0,x2=0,x3=0;
    for (let i=0;i<d.length;i++){
      const w = Math.random()*2-1;
      x1 = 0.997*x1 + w*0.05;
      x2 = 0.985*x2 + w*0.03;
      x3 = 0.950*x3 + w*0.02;
      d[i] = (x1+x2+x3)*0.33;
    }
    const noise = this.ctx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true;
    const noiseLP = this.ctx.createBiquadFilter(); noiseLP.type='lowpass'; noiseLP.frequency.value=1100; noiseLP.Q.value=0.4;
    const noiseGain = this.ctx.createGain(); noiseGain.gain.value = 0.18;

    const tri1 = this.ctx.createOscillator(); tri1.type='triangle'; tri1.frequency.value=195;
    const tri2 = this.ctx.createOscillator(); tri2.type='sine';     tri2.frequency.value=390;
    const g1 = this.ctx.createGain(); g1.gain.value = 0.10;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.06;

    const vib = this.ctx.createOscillator(); vib.type='sine'; vib.frequency.value=3.2;
    const vibG = this.ctx.createGain(); vibG.gain.value=1.4;
    vib.connect(vibG); vibG.connect(tri1.frequency); vibG.connect(tri2.frequency);

    const src = this.ctx.createGain(); src.gain.value = 1;
    noise.connect(noiseLP); noiseLP.connect(noiseGain); noiseGain.connect(src);
    tri1.connect(g1); g1.connect(src);
    tri2.connect(g2); g2.connect(src);
    noise.start(); tri1.start(); tri2.start(); vib.start();

    this.sourceBus = src;
    this.direct.osc1 = tri1;
  }

  initDirectChain(){
    const tremOsc=this.ctx.createOscillator(); tremOsc.type='sine'; tremOsc.frequency.value=2.2;
    const tremDepth=this.ctx.createGain(); tremDepth.gain.value=0;
    const trem=this.ctx.createGain(); trem.gain.value=1.0;
    const tremDC=this.ctx.createConstantSource(); tremDC.offset.value=1.0; tremDC.start();
    tremOsc.connect(tremDepth); tremDepth.connect(trem.gain); tremDC.connect(trem.gain);

    const gain=this.ctx.createGain(); gain.gain.value=0;
    const low=this.ctx.createBiquadFilter(); low.type='lowshelf'; low.frequency.value=180;
    const mid=this.ctx.createBiquadFilter(); mid.type='peaking'; mid.frequency.value=1000; mid.Q.value=1.2; mid.gain.value=-1;
    const high=this.ctx.createBiquadFilter(); high.type='highshelf'; high.frequency.value=3500; high.gain.value=-2.0;
    const tone=this.ctx.createBiquadFilter(); tone.type='lowpass'; tone.frequency.value=1350; tone.Q.value=0.5;

    const delay=this.ctx.createDelay(1.5);
    const panner=new PannerNode(this.ctx,{panningModel:'HRTF', distanceModel:'inverse', rolloffFactor:0, refDistance:1, maxDistance:20});

    this.sourceBus.connect(trem);
    trem.connect(gain); gain.connect(low); low.connect(mid); mid.connect(high); high.connect(tone); tone.connect(delay); delay.connect(panner); panner.connect(this.master);
    tremOsc.start();

    this.direct={ gain, low, mid, high, tone, delay, panner, osc1: this.direct.osc1, tremOsc, tremDepth, trem };
  }

  initTaps(n){
    this.taps.length=0;
    for(let i=0;i<n;i++){
      const delay=this.ctx.createDelay(3);
      const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
      const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=1;
      const hp=this.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000;
      const gL=this.ctx.createGain(), gM=this.ctx.createGain(), gH=this.ctx.createGain();
      const mix=this.ctx.createGain(); mix.gain.value=0;
      const pan=new PannerNode(this.ctx,{panningModel:'HRTF', distanceModel:'inverse', rolloffFactor:0, refDistance:1, maxDistance:20});
      this.sourceBus.connect(delay);
      delay.connect(lp); delay.connect(bp); delay.connect(hp);
      lp.connect(gL); bp.connect(gM); hp.connect(gH);
      gL.connect(mix); gM.connect(mix); gH.connect(mix);
      mix.connect(pan); pan.connect(this.master);
      this.taps.push({ delay, gL, gM, gH, mix, pan });
    }
  }

  initBall(){
    const noise=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
    const d=noise.getChannelData(0); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<d.length;i++){ const w=Math.random()*2-1;
      b0=0.99886*b0 + w*0.0555179; b1=0.99332*b1 + w*0.0750759; b2=0.96900*b2 + w*0.1538520;
      b3=0.86650*b3 + w*0.3104856; b4=0.55000*b4 + w*0.5329522; b5=-0.7616*b5 - w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6 + w*0.5362)*0.06; b6=w*0.115926;
    }
    const src=this.ctx.createBufferSource(); src.buffer=noise; src.loop=true;
    const filt=this.ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=300; filt.Q.value=2.2;
    const gain=this.ctx.createGain(); gain.gain.value=0;
    const pan=new PannerNode(this.ctx,{panningModel:'HRTF', distanceModel:'inverse', rolloffFactor:0, refDistance:0.1, maxDistance:10});
    src.connect(filt); filt.connect(gain); gain.connect(pan); pan.connect(this.master); src.start();
    this.ball={ filter:filt, gain, panner:pan, ema:0 };
  }

  initWorker(){
    const blob=new Blob([RAY_WORKER],{type:'application/javascript'});
    this.worker=new Worker(URL.createObjectURL(blob));
    this.worker.onmessage=(e)=>{
      if(!this.initialized||!this.ctx) return;
      const { occlusion, Edir, reflections } = e.data||{};
      if (typeof occlusion==='number'){
        const k=0.15; this.M_t = (1-k)*this.M_t + k*occlusion;
      }
      if (Edir) this.E_dir = Edir;
      if (Array.isArray(reflections)) { this.updateReflectionTaps(reflections); }
    };
    if (this.wallsPending) this.worker.postMessage({ type:'init', data:{ walls: this.wallsPending } });
  }

  setWalls(segs){
    this.wallsPending = segs;
    if (this.worker) {
      this.worker.postMessage({ type:'init', data:{ walls: segs } });
    }
  }

  setListener(pos){
    if(!this.initialized||!this.ctx) return;
    this.listenerPos = { x: pos.x, z: pos.z };
    const L=this.ctx.listener, t=this.ctx.currentTime;
    if ('positionX' in L){
      L.positionX.setValueAtTime(pos.x,t); L.positionY.setValueAtTime(0.5,t); L.positionZ.setValueAtTime(pos.z,t);
      L.forwardX.setValueAtTime(0,t); L.forwardY.setValueAtTime(0,t); L.forwardZ.setValueAtTime(-1,t);
      L.upX.setValueAtTime(0,t); L.upY.setValueAtTime(1,t); L.upZ.setValueAtTime(0,t);
    } else {
      L.setPosition(pos.x,0.5,pos.z); L.setOrientation(0,0,-1, 0,1,0);
    }
  }

  updateDirectPath(ball, exit){
    if(!this.initialized||!this.ctx) return;
    const now=this.ctx.currentTime;
    const dx=exit.x-ball.x, dz=exit.z-ball.z, dist=Math.hypot(dx,dz);

    this.direct.delay.delayTime.setTargetAtTime(Math.min(dist/343,1.5), now, 0.01);

    const maxRange = 12;
    const nd = clamp(dist / maxRange, 0, 1);
    const curve = Math.pow(1 - nd, 1.7);
    const A_phys = clamp(curve * (1 - this.M_t), 0, 0.16);
    const assist = this.minAudibleFloor * (1 - 0.3 * this.M_t);
    const gain = Math.max(A_phys, assist) * 0.7;
    this.direct.gain.gain.setTargetAtTime(gain, now, 0.05);

    const tremDepth = lerp(0.16, 0.04, curve);
    const tremRate = lerp(2.0, 4.0, curve);
    this.direct.tremDepth.gain.setTargetAtTime(tremDepth, now, 0.2);
    this.direct.tremOsc.frequency.setTargetAtTime(tremRate, now, 0.2);

    if ('positionX' in this.direct.panner){
      this.direct.panner.positionX.setValueAtTime(exit.x, now);
      this.direct.panner.positionY.setValueAtTime(0.5, now);
      this.direct.panner.positionZ.setValueAtTime(exit.z, now);
    } else this.direct.panner.setPosition(exit.x,0.5,exit.z);

    const toDb = (x)=> 10*Math.log10(Math.max(1e-8, x));
    this.direct.low.gain.setTargetAtTime( toDb(this.E_dir.low) + this.M_t*3, now, 0.05);
    this.direct.mid.gain.setTargetAtTime( toDb(this.E_dir.mid) - this.M_t*5, now, 0.05);
    this.direct.high.gain.setTargetAtTime(toDb(this.E_dir.high) - this.M_t*10, now, 0.05);

    const cutoff = 1100 + curve * 1200;
    this.direct.tone.frequency.setTargetAtTime(cutoff, now, 0.1);

    const base = 200, spread = 90;
    this.direct.osc1.frequency.setTargetAtTime(base + spread * curve, now, 0.12);

    this.lastProximity = curve * (1 - this.M_t);

    const ms=performance.now();
    if (ms - this.lastTrace > 50){
      this.lastTrace = ms;
      if (this.worker) this.worker.postMessage({ type:'trace', data:{ source: exit, listener: ball, numRays:64, maxBounces:5 } });
    }
  }

  updateReflectionTaps(list){
    if(!this.initialized||!this.ctx) return;
    const now=this.ctx.currentTime, N=Math.min(this.taps.length, list.length);
    const lp = this.listenerPos || { x:0, z:0 };
    // Gate reflections by proximity so there's no constant drone when far away
    const proxGate = clamp(this.lastProximity * 2.0, 0, 1);
    for (let i=0;i<N;i++){
      const r=list[i], node=this.taps[i];
      node.delay.delayTime.setTargetAtTime(Math.min(r.delay,3), now, 0.02);
      const boost = 14.0; // scale energy -> audible amplitude (tune 10..20)
      node.gL.gain.setTargetAtTime(Math.min(r.energy.low*0.35*boost, 0.60) * proxGate, now, 0.05);
      node.gM.gain.setTargetAtTime(Math.min(r.energy.mid*0.35*boost, 0.60) * proxGate, now, 0.05);
      node.gH.gain.setTargetAtTime(Math.min(r.energy.high*0.35*boost, 0.60) * proxGate, now, 0.05);
      const tot = (r.energy.low + r.energy.mid + r.energy.high) * (boost / 3);
      node.mix.gain.setTargetAtTime(Math.min(tot, 0.60), now, 0.05);
      const R=2.0, x=lp.x+Math.cos(r.angle)*R, z=lp.z+Math.sin(r.angle)*R;
      if ('positionX' in node.pan){
        node.pan.positionX.setValueAtTime(x, now);
        node.pan.positionY.setValueAtTime(0.5, now);
        node.pan.positionZ.setValueAtTime(z, now);
      } else node.pan.setPosition(x,0.5,z);
    }
    for (let i=N;i<this.taps.length;i++){
      this.taps[i].mix.gain.setTargetAtTime(0, now, 0.1);
    }
  }

  updateBallRolling(vel,pos,angVel){
    if(!this.initialized||!this.ctx) return;
    const angContrib = angVel ? Math.hypot(angVel.x, angVel.z) * 0.15 : 0;
    const sp=Math.hypot(vel.x,vel.z) + angContrib;
    this.ball.ema = 0.85*this.ball.ema + 0.15*sp;
    const sEff = Math.max(0, this.ball.ema - 0.03);
    // no idle noise; base fades in only once it's actually rolling
    const base = sEff > 0.015 ? 0.10 : 0.0;
    // duck rolling under the beacon as you get closer
    const duck = 1 - 0.45 * clamp(this.lastProximity, 0, 1);
    const vol = Math.min((base + sEff/2.0) * duck, 0.28);
    const now=this.ctx.currentTime;
    this.ball.gain.gain.setTargetAtTime(vol, now, 0.05);
    this.ball.filter.frequency.setTargetAtTime(200 + sEff*180, now, 0.08);
    if ('positionX' in this.ball.panner){
      this.ball.panner.positionX.setValueAtTime(pos.x, now);
      this.ball.panner.positionY.setValueAtTime(0.25, now);
      this.ball.panner.positionZ.setValueAtTime(pos.z, now);
    } else this.ball.panner.setPosition(pos.x,0.25,pos.z);
  }

  playCollision(intensity=0.5,pos={x:0,z:0}){
    if(!this.initialized||!this.ctx) return;
    if (intensity < 0.12) return;
    const dur=0.1, buf=this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate*dur), this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.28)); }
    const src=this.ctx.createBufferSource(); src.buffer=buf;

    const lp = this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000;
    const g=this.ctx.createGain(); g.gain.value=Math.min(0.12 + intensity*0.18, 0.3);

    const p=new PannerNode(this.ctx,{panningModel:'HRTF', distanceModel:'inverse', rolloffFactor:0, refDistance:0.1, maxDistance:10});
    src.connect(lp); lp.connect(g); g.connect(p); p.connect(this.master);
    const t=this.ctx.currentTime;
    if ('positionX' in p){ p.positionX.setValueAtTime(pos.x,t); p.positionY.setValueAtTime(0.25,t); p.positionZ.setValueAtTime(pos.z,t); }
    else p.setPosition(pos.x,0.25,pos.z);
    src.start();

    // Short sine tone for richer impact
    const sine=this.ctx.createOscillator(); sine.type='sine'; sine.frequency.value=80;
    const sineG=this.ctx.createGain(); sineG.gain.setValueAtTime(0.3*intensity, t);
    sineG.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    sine.connect(sineG); sineG.connect(p);
    sine.start(t); sine.stop(t+0.06);
  }
}

/* ============================================================
   Renderer — BG ShaderPass first, then scene, then bloom
============================================================ */
class Renderer {
  constructor(){
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(50, 1, 0.1, 500);
    this.renderer=new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias:true, powerPreference:'high-performance' });
    this.renderer.shadowMap.enabled=true; this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    this.renderer.toneMapping=THREE.ACESFilmicToneMapping; this.renderer.toneMappingExposure=1.1;

    this.composer=new EffectComposer(this.renderer);

    // Background clouds
    this.bgPass = new ShaderPass(VolumetricCloudsShader);
    this.composer.addPass(this.bgPass);

    // Scene on top of background: don't clear color; DO clear depth
    const renderPass = new RenderPass(this.scene, this.camera);
    renderPass.clear = false;
    renderPass.clearDepth = true;
    this.composer.addPass(renderPass);

    // Bloom
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.3, 0.9);
    this.composer.addPass(bloom);

    // Environment
    const pmrem=new THREE.PMREMGenerator(this.renderer);
    this.staticEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    this.scene.environment=this.staticEnv;

    // Board group
    this.group=new THREE.Group();
    this.scene.add(this.group);

    // Lighting
    const hemi=new THREE.HemisphereLight(0x455a88, 0x0a0b12, 0.35);
    this.scene.add(hemi);
    const dir=new THREE.DirectionalLight(0xa0aefb, 0.75);
    dir.position.set(6,16,8);
    dir.castShadow=true; dir.shadow.mapSize.set(4096,4096); dir.shadow.bias=-0.0002; dir.shadow.normalBias=0.05;
    this.scene.add(dir);

    const rimL = new THREE.PointLight(0x66ccff, 0.35, 12); rimL.position.set(-3, 3.5, 5);
    const rimR = new THREE.PointLight(0xff6699, 0.28, 12); rimR.position.set( 3, 3.5,-5);
    this.scene.add(rimL, rimR);

    // Dynamic cube map for the ball
    const crt = new THREE.WebGLCubeRenderTarget(512, { generateMipmaps:true, minFilter:THREE.LinearMipmapLinearFilter });
    this.cubeCam=new THREE.CubeCamera(0.1, 100, crt); this.scene.add(this.cubeCam);
    this.ballEnvMap=crt.texture;

    this.ballMesh=null; this.lastEnv=0;

    window.addEventListener('resize', ()=>this.onResize());
    this.onResize();
  }

  createMaze(data){
    while(this.group.children.length){
      const m=this.group.children.pop();
      if (m.geometry && typeof m.geometry.dispose === 'function') m.geometry.dispose();
      if (Array.isArray(m.material)) { m.material.forEach(mm=>{ if (mm && typeof mm.dispose === 'function') mm.dispose(); }); }
      else if (m.material && typeof m.material.dispose === 'function') m.material.dispose();
    }

    // Floor
    const floorGeo=new THREE.BoxGeometry(data.size, 0.2, data.size);
    const floorCanvas=document.createElement('canvas'); floorCanvas.width=floorCanvas.height=512;
    const ctx=floorCanvas.getContext('2d');
    const grad=ctx.createRadialGradient(256,256,0,256,256,300);
    grad.addColorStop(0,'#0d121b');
    grad.addColorStop(0.65,'#121826');
    grad.addColorStop(1,'#151c2a');
    ctx.fillStyle=grad; ctx.fillRect(0,0,512,512);
    const floorTex=new THREE.CanvasTexture(floorCanvas);
    floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(4,4);

    const floorMat=new THREE.MeshPhysicalMaterial({
      color:0x151c2a, metalness:0.65, roughness:0.22,
      clearcoat:0.6, clearcoatRoughness:0.15,
      reflectivity:0.5,
      envMap:this.staticEnv,
      envMapIntensity:0.5,
      map:floorTex
    });
    const floor=new THREE.Mesh(floorGeo, floorMat);
    floor.position.set(0,-0.1,0); floor.receiveShadow=true; this.group.add(floor);

    // Walls — full cell-size blocks for solid room/office look
    const wallH=0.6, cellSize=1.0;
    const wallMat=new THREE.MeshStandardMaterial({ color:0x2a2535, roughness:0.7, metalness:0.1 });
    const wallGeo=new THREE.BoxGeometry(cellSize, wallH, cellSize);
    const N=data.size;
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      if (data.maze[y][x]!==1) continue;
      const wx = x - (N-1)/2;
      const wz = y - (N-1)/2;
      const wall=new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(wx, wallH/2, wz);
      wall.castShadow=true; wall.receiveShadow=true;
      this.group.add(wall);
    }

    // Exit
    const exitGeo=new THREE.CylinderGeometry(0.35,0.35,0.1,64);
    const exitMat=new THREE.MeshStandardMaterial({ color:0x00ff88, emissive:0x00ff88, emissiveIntensity:1.5, roughness:0.1, metalness:0.9 });
    const exitMesh=new THREE.Mesh(exitGeo, exitMat); exitMesh.position.set(data.exit.x,0.05,data.exit.z); exitMesh.receiveShadow=true; this.group.add(exitMesh);
    const exitLight=new THREE.PointLight(0x00ff88,1.1,3.2); exitLight.position.set(data.exit.x,0.7,data.exit.z); this.group.add(exitLight);

    // Ball
    const r=0.25;
    const ballGeo=new THREE.SphereGeometry(r,128,64);
    const ballMat=new THREE.MeshPhysicalMaterial({
      color:0xffffff, metalness:1.0, roughness:0.03, clearcoat:1.0, clearcoatRoughness:0.0, reflectivity:1.0,
      envMap:this.ballEnvMap, envMapIntensity:1.7
    });
    this.ballMesh=new THREE.Mesh(ballGeo, ballMat); this.ballMesh.position.set(data.start.x, r, data.start.z); this.ballMesh.castShadow=true; this.ballMesh.receiveShadow=true; this.group.add(this.ballMesh);

    this.fitCameraToGroup();
  }

  fitCameraToGroup(){
    const box=new THREE.Box3().setFromObject(this.group);
    const size=new THREE.Vector3(), center=new THREE.Vector3();
    box.getSize(size); box.getCenter(center);
    const aspect=window.innerWidth/window.innerHeight;
    const fov=this.camera.fov*Math.PI/180;
    const half=Math.max(size.x,size.z)*0.55;
    const dist=Math.max(half/Math.tan(fov/2), (half/aspect)/Math.tan(fov/2))*1.3;
    this.camera.position.set(center.x, dist*0.95, center.z + dist*0.35);
    this.camera.lookAt(center.x,0,center.z);
  }

  updateBall(pos, quat){
    if (!this.ballMesh) return;
    this.ballMesh.position.copy(pos);
    this.ballMesh.quaternion.copy(quat);
    const now=performance.now();
    if (this.cubeCam && this.ballEnvMap && now - this.lastEnv > 100){
      this.lastEnv=now;
      this.cubeCam.position.copy(this.ballMesh.position);
      this.ballMesh.visible=false; this.cubeCam.update(this.renderer, this.scene); this.ballMesh.visible=true;
    }
  }

  update(t, prox=0){
    // Update BG shader
    if (this.bgPass && this.bgPass.material && this.bgPass.material.uniforms){
      const u = this.bgPass.material.uniforms;
      u.uTime.value = t;
      const camDir = new THREE.Vector3(); this.camera.getWorldDirection(camDir);
      const camRight = new THREE.Vector3().crossVectors(camDir, this.camera.up).normalize();
      const camUp = new THREE.Vector3().crossVectors(camRight, camDir).normalize();
      u.uCamPos.value.copy(this.camera.position);
      u.uCamDir.value.copy(camDir);
      u.uCamRight.value.copy(camRight);
      u.uCamUp.value.copy(camUp);
      u.uFovY.value = this.camera.fov * Math.PI / 180;
      const w = this.renderer.domElement.width, h = this.renderer.domElement.height;
      u.uAspect.value = w / Math.max(1, h);
      u.uResolution.value.set(w, h);

      // Perf/adaptive samples
      const minDim = Math.min(w, h);
      u.uSteps.value = (minDim < 900 ? 44.0 : 52.0);

      // Slightly lift brightness as you near goal
      u.uBrightness.value = 0.82 + 0.12 * prox;
    }
  }

  render(){ this.composer.render(); }

  onResize(){
    const w=window.innerWidth, h=window.innerHeight;
    this.renderer.setSize(w,h); this.composer.setSize(w,h);
    this.camera.aspect=w/h; this.camera.updateProjectionMatrix();
    this.fitCameraToGroup();
    if (this.bgPass && this.bgPass.material && this.bgPass.material.uniforms){
      this.bgPass.material.uniforms.uResolution.value.set(w,h);
    }
  }
}

/* ============================================================
   Physics — stronger damping when no input (stops cleanly)
============================================================ */
class Physics {
  constructor(){
    this.world=new CANNON.World();
    this.world.gravity.set(0,-9.82,0);
    this.world.solver.iterations=40;
    this.world.solver.tolerance=1e-6;
    this.world.broadphase=new CANNON.SAPBroadphase(this.world);

    this.matBall=new CANNON.Material('ball');
    this.matWall=new CANNON.Material('wall');
    this.world.addContactMaterial(new CANNON.ContactMaterial(this.matBall, this.matWall, {
      friction:0.55, restitution:0.06, contactEquationStiffness:1e8, contactEquationRelaxation:3
    }));

    this.ballBody=null; this.lastTilt={x:0,z:0};
  }

  createMaze(data){
    while(this.world.bodies.length) this.world.removeBody(this.world.bodies[0]);

    const ground=new CANNON.Body({ mass:0, shape:new CANNON.Box(new CANNON.Vec3(data.size/2,0.1,data.size/2)), material:this.matWall });
    ground.position.set(0,-0.1,0); this.world.addBody(ground);

    // Full cell-size wall bodies
    const wallH=0.6, cellSize=1.0;
    const N=data.size;
    const wallShape=new CANNON.Box(new CANNON.Vec3(cellSize/2, wallH/2, cellSize/2));
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      if (data.maze[y][x]!==1) continue;
      const wx = x - (N-1)/2;
      const wz = y - (N-1)/2;
      const body=new CANNON.Body({ mass:0, material:this.matWall });
      body.addShape(wallShape);
      body.position.set(wx, wallH/2, wz);
      this.world.addBody(body);
    }

    const r=0.25;
    this.ballBody=new CANNON.Body({
      mass:0.3,
      shape:new CANNON.Sphere(r),
      position:new CANNON.Vec3(data.start.x, r+0.1, data.start.z),
      material:this.matBall,
      linearDamping:0.35,
      angularDamping:0.35
    });
    this.world.addBody(this.ballBody);
  }

  onCollide(cb){
    if (this.ballBody) {
      this.ballBody.addEventListener('collide', (e)=>{
        const fn = e.contact && typeof e.contact.getImpactVelocityAlongNormal === 'function'
          ? e.contact.getImpactVelocityAlongNormal()
          : 0.5;
        const v = Math.abs(fn || 0);
        cb(v);
      });
    }
  }

  updateGravity(tx,tz){
    const maxTilt=Math.PI/10, g=9.82;
    const gx=tx*maxTilt*g*2.0, gz=tz*maxTilt*g*2.0;
    this.lastTilt={x:tx,z:tz}; this.world.gravity.set(gx,-9.82,gz);
  }

  step(dt){
    this.world.step(1/180, dt, 10);
    const v = this.ballBody.velocity;
    const av = this.ballBody.angularVelocity;
    const sp = Math.hypot(v.x, v.z);
    const asp = Math.hypot(av.x, av.y, av.z);
    const noInput = Math.abs(this.lastTilt.x) < 0.01 && Math.abs(this.lastTilt.z) < 0.01;

    if (noInput) {
      v.x *= 0.72; v.z *= 0.72;
      av.x *= 0.60; av.y *= 0.60; av.z *= 0.60;
      if (sp < 0.05) { v.x = 0; v.z = 0; }
      if (asp < 0.2) { av.set(0,0,0); }
    }

    // Fall detection handled by App.checkWin() which regenerates the maze
  }
}

/* ============================================================
   Maze — 10×10
============================================================ */
class PerfectMaze {
  constructor(size=11){ this.size=size; this.grid=[]; }
  worldFromGrid(x,y){ return { x: x - (this.size - 1)/2, z: y - (this.size - 1)/2 }; }

  generate(){
    const N=this.size;
    this.grid=Array.from({length:N},()=>Array(N).fill(1));
    const corners=[ {x:1,y:1}, {x:(N-2)|1,y:1}, {x:1,y:(N-2)|1}, {x:(N-2)|1,y:(N-2)|1} ];
    const sIdx=(Math.random()*4)|0, eIdx=(sIdx+2)%4;
    const start=corners[sIdx], exit=corners[eIdx];

    const stack=[{...start}]; this.grid[start.y][start.x]=0;
    const dirs=[{dx:0,dy:-2,wx:0,wy:-1},{dx:2,dy:0,wx:1,wy:0},{dx:0,dy:2,wx:0,wy:1},{dx:-2,dy:0,wx:-1,wy:0}];
    while(stack.length){
      const cur=stack[stack.length-1]; const cand=[];
      for (const d of dirs){
        const nx=cur.x+d.dx, ny=cur.y+d.dy;
        if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&this.grid[ny][nx]===1) cand.push({nx,ny,wx:cur.x+d.wx,wy:cur.y+d.wy});
      }
      if (!cand.length){ stack.pop(); continue; }
      const next=cand[(Math.random()*cand.length)|0];
      this.grid[next.wy][next.wx]=0; this.grid[next.ny][next.nx]=0; stack.push({x:next.nx,y:next.ny});
    }
    this.grid[exit.y][exit.x]=0;

    const segments=[];
    const add=(x1,z1,x2,z2)=>segments.push({x1,z1,x2,z2});
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if (this.grid[y][x]===0){
      const c=this.worldFromGrid(x,y);
      const left  = (x===0   || this.grid[y][x-1]===1);
      const right = (x===N-1 || this.grid[y][x+1]===1);
      const up    = (y===0   || this.grid[y-1][x]===1);
      const down  = (y===N-1 || this.grid[y+1][x]===1);
      if (left)  add(c.x-0.5,c.z-0.5, c.x-0.5,c.z+0.5);
      if (right) add(c.x+0.5,c.z-0.5, c.x+0.5,c.z+0.5);
      if (up)    add(c.x-0.5,c.z-0.5, c.x+0.5,c.z-0.5);
      if (down)  add(c.x-0.5,c.z+0.5, c.x+0.5,c.z+0.5);
    }

    const startW=this.worldFromGrid(start.x,start.y);
    const exitW =this.worldFromGrid(exit.x,exit.y);
    return { maze:this.grid, size:N, start:startW, exit:exitW, segments };
  }
}

/* ============================================================
   Input
============================================================ */
class Input {
  constructor(){
    this.tilt={x:0,z:0};
    this.target={x:0,z:0};
    this.keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
    this.accelSmooth=0.18;   // smoothing when accelerating
    this.decelSmooth=0.40;   // faster return to zero on release
    this.maxTilt=0.8;        // reduced sensitivity
    this.usingDeviceOrientation = false;
    this.init();
  }

  init(){
    document.addEventListener('keydown',(e)=>{
      if(e.key in this.keys){
        e.preventDefault();
        this.keys[e.key]=true;
      }
    }, { passive:false });

    document.addEventListener('keyup',(e)=>{
      if(e.key in this.keys){
        this.keys[e.key]=false;
        // Immediately zero the target for released axis
        if (e.key==='ArrowLeft'||e.key==='ArrowRight'){
          if (!this.keys['ArrowLeft']&&!this.keys['ArrowRight']) this.target.x=0;
        }
        if (e.key==='ArrowUp'||e.key==='ArrowDown'){
          if (!this.keys['ArrowUp']&&!this.keys['ArrowDown']) this.target.z=0;
        }
      }
    });

    if (window.DeviceOrientationEvent){
      const ask=async()=>{
        try{
          if(typeof DeviceOrientationEvent.requestPermission==='function'){
            const s=await DeviceOrientationEvent.requestPermission();
            if(s!=='granted') return;
          }
        }catch{}
      };
      window.addEventListener('pointerdown', ask, { once:true });
      window.addEventListener('deviceorientation', (e)=>{
        if(e.beta!=null&&e.gamma!=null){
          this.usingDeviceOrientation = true;
          this.target.x=clamp(e.gamma/18,-1,1)*this.maxTilt;
          this.target.z=clamp((e.beta-45)/18,-1,1)*this.maxTilt;
        }
      });
    }
  }

  getTilt(){
    // Keyboard: set target directly from key state
    const kx = (this.keys['ArrowLeft']?-1:0) + (this.keys['ArrowRight']?1:0);
    const kz = (this.keys['ArrowUp']?-1:0) + (this.keys['ArrowDown']?1:0);
    const keyboardActive = kx!==0||kz!==0;

    if (keyboardActive) {
      this.target.x = kx * this.maxTilt;
      this.target.z = kz * this.maxTilt;
    } else if (!this.usingDeviceOrientation) {
      this.target.x = 0;
      this.target.z = 0;
    }

    // Asymmetric smoothing: faster decel when returning to center
    const sx = (Math.abs(this.target.x) < Math.abs(this.tilt.x)) ? this.decelSmooth : this.accelSmooth;
    const sz = (Math.abs(this.target.z) < Math.abs(this.tilt.z)) ? this.decelSmooth : this.accelSmooth;
    this.tilt.x += (this.target.x - this.tilt.x) * sx;
    this.tilt.z += (this.target.z - this.tilt.z) * sz;

    // Hard zero when close to prevent drift
    if (Math.abs(this.tilt.x) < 0.005 && this.target.x===0) this.tilt.x = 0;
    if (Math.abs(this.tilt.z) < 0.005 && this.target.z===0) this.tilt.z = 0;

    return this.tilt;
  }
}

/* ============================================================
   App
============================================================ */
class App {
  constructor(){
    this.audio=new PerfectRayAudio();
    this.physics=new Physics();
    this.renderer=new Renderer();
    this.input=new Input();
    this.haptics=new Haptics();
    this.maze=null;
    this.last=performance.now(); this.fpsLast=performance.now(); this.fpsCount=0; this.fpsEl=document.getElementById('fps');
    this.regenerating=false;
    this.init();
  }

  async init(){
    await this.audio.init();
    this.newMaze();
    this.loop();
    // ensure worker receives walls as soon as audio actually starts (first user gesture)
    const ensureWalls = () => {
      if (this.audio.initialized && this.maze) {
        this.audio.setWalls(this.maze.segments);
        return;
      }
      requestAnimationFrame(ensureWalls);
    };
    ensureWalls();
  }

  newMaze(){
    this.regenerating=true;
    const gen=new PerfectMaze(11);
    this.maze=gen.generate();
    this.renderer.createMaze(this.maze);
    this.physics.createMaze(this.maze);
    this.physics.onCollide((v)=>{ const p=this.physics.ballBody.position; if(this.audio.initialized) this.audio.playCollision(v,{x:p.x,z:p.z}); if (navigator.vibrate) this.haptics.impact(v); });

    if(this.audio.initialized) {
        this.audio.reset();
    }
    this.audio.setWalls(this.maze.segments);
    this.regenerating=false;
  }

  checkWin(){
    if(!this.physics.ballBody||!this.maze||this.regenerating) return;
    const p=this.physics.ballBody.position, e=this.maze.exit;
    // Reached exit
    if (Math.hypot(p.x-e.x,p.z-e.z) < 0.45){
      this.newMaze();
      return;
    }
    // Fell off / fell in hole
    if (p.y < -1){
      this.newMaze();
    }
  }

  loop(){
    requestAnimationFrame(()=>this.loop());
    const now=performance.now(), dt=Math.min((now-this.last)/1000, 0.05); this.last=now;

    const t=this.input.getTilt();
    this.physics.updateGravity(t.x,t.z);
    this.physics.step(dt);

    const ball = this.physics.ballBody && this.physics.ballBody.position;
    if (ball){
      this.renderer.updateBall(this.physics.ballBody.position, this.physics.ballBody.quaternion);
      if (this.audio.initialized){
        const bp={ x:ball.x, z:ball.z };
        this.audio.setListener(bp);
        this.audio.updateDirectPath(bp, this.maze.exit);
        this.audio.updateBallRolling(this.physics.ballBody.velocity, bp, this.physics.ballBody.angularVelocity);

        const speed = Math.hypot(this.physics.ballBody.velocity.x, this.physics.ballBody.velocity.z);
        this.haptics.update(this.audio.lastProximity, this.audio.M_t, speed);
      }
    }

    this.checkWin();
    this.renderer.update(now/1000, this.audio.lastProximity);
    this.renderer.render();

    this.fpsCount++;
    if (now - this.fpsLast > 1000){
      this.fpsEl.textContent = `${Math.round(this.fpsCount*1000/(now-this.fpsLast))} fps`;
      this.fpsCount=0;
      this.fpsLast=now;
    }
  }
}

// Start
new App();
  </script>
