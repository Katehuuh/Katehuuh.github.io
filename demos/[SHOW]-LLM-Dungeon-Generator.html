<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Dungeon Generator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0a0a; color: #e0e0e0; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
canvas { display: block; image-rendering: pixelated; }
#hud { position: fixed; top: 12px; left: 12px; z-index: 10; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
#overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,10,0.85); transition: opacity 0.3s; }
#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay .loader { width: 50px; height: 50px; border: 4px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
#win { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); }
#win.show { display: flex; }
#win h1 { font-size: 3rem; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin-bottom: 16px; }
#win button { padding: 12px 28px; font-size: 1.1rem; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
#hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #555; font-size: 12px; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<div id="overlay"><div class="loader"></div><div id="gen-msg">Generating dungeon...</div></div>
<div id="hud">
  <div>LLM Dungeon</div>
  <div>Key: <span id="key-icon">--</span></div>
</div>
<div id="win"><h1>You Win!</h1><button id="replay">New Dungeon</button></div>
<div id="hint">WASD to move | Find Key (gold) then Exit (purple)</div>
<canvas id="c"></canvas>
<script>
"use strict";
var TILE = 28;
var SPEED = 380;
var FRIC = 0.85;

var TILE_COLORS = {
  '#': '#1a1a30',
  '.': '#2a2a3e',
  ',': '#1e1e2e',
  'S': '#2a3a2a',
  'K': '#2a2a3e',
  'E': '#2a2a3e',
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

var dungeon = null;
var player = null;
var hasKey = false;
var cam = { x: 0, y: 0 };
var inputKeys = {};
addEventListener('keydown', function(e) { inputKeys[e.code] = true; if (e.code.indexOf('Arrow') === 0) e.preventDefault(); });
addEventListener('keyup', function(e) { inputKeys[e.code] = false; });

function fallbackDungeon() {
  return [
    "##############################",
    "#S.....#,,,,,,#..............#",
    "#......#,,,,,,#..............#",
    "#......#,,,,,,#....####.....#",
    "#..##..#,,,,,,#....#K.#.....#",
    "#......#,,,,,,,....####.....#",
    "#......#,,,,,,#..............#",
    "####,####,,,,####,###########",
    "#,,,,,,,,,,,,,,,,,,,,,,,,,,,,#",
    "#,,,,,,,,,,,,,,,,,,,,,,,,,,,,#",
    "####,####,,,,####,###########",
    "#......#,,,,,,#..............#",
    "#......#,,,,,,,..........##.#",
    "#......#,,,,,,#..........#E.#",
    "#......#,,,,,,#..........##.#",
    "##############################",
  ];
}

async function askLLM(prompt) {
  try {
    var res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'You generate ASCII dungeon maps. Output ONLY the grid lines. No markdown fences, no explanation, no commentary.' },
          { role: 'user', content: prompt }
        ],
        max_tokens: 32000,
        temperature: 0.9,
        model: 'openai',
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var msg = data && data.choices && data.choices[0] && data.choices[0].message;
    var text = (msg && msg.content) || '';
    if (!text && msg && msg.reasoning) {
      // Model put everything in reasoning, try to extract grid from it
      var lines = msg.reasoning.split('\n').filter(function(l) {
        var t = l.trim();
        return t.length >= 20 && /^[#.,SKE\s"]+$/.test(t);
      });
      if (lines.length >= 10) text = lines.join('\n');
    }
    return text.trim();
  } catch (e) {
    console.warn('Pollinations failed:', e);
    return null;
  }
}

function parseGrid(text) {
  if (!text) return null;
  // Strip markdown fences and quotes
  text = text.replace(/```[a-z]*\n?/g, '').replace(/```/g, '').trim();
  text = text.replace(/^"/gm, '').replace(/"$/gm, '').replace(/",?$/gm, '');
  var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length >= 15; });
  if (lines.length < 10) return null;

  // Normalize chars
  var grid = lines.map(function(row) {
    return row.split('').map(function(ch) {
      if ('#.,SKE'.indexOf(ch) !== -1) return ch;
      if (ch === ' ' || ch === '-' || ch === '|') return '#';
      return '.';
    }).join('');
  });

  // Pad rows to same width
  var maxW = 0;
  for (var i = 0; i < grid.length; i++) if (grid[i].length > maxW) maxW = grid[i].length;
  grid = grid.map(function(row) {
    while (row.length < maxW) row += '#';
    return row;
  });

  var flat = grid.join('');
  if (flat.indexOf('S') === -1 || flat.indexOf('K') === -1 || flat.indexOf('E') === -1) return null;
  return grid;
}

async function generateDungeon() {
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('gen-msg').textContent = 'Asking AI for dungeon...';

  var prompt = 'Generate a dungeon room map as ASCII.\n'
    + 'Size: 30 columns wide, 16 rows tall.\n'
    + 'Characters: # wall, . room floor, , corridor\n'
    + 'S = start (one), K = key (one), E = exit (one)\n'
    + 'Rules:\n'
    + '- Outer border is all # walls\n'
    + '- Create 3-5 rooms of . connected by , corridors\n'
    + '- S in one room, K in another room, E in a third\n'
    + '- Must have walkable path S to K to E\n'
    + '- Add interior # walls for interesting layout\n'
    + 'Output the 16 lines of 30 chars each. Nothing else.';

  var text = await askLLM(prompt);
  var grid = parseGrid(text);

  if (!grid) {
    document.getElementById('gen-msg').textContent = 'Fallback dungeon...';
    await new Promise(function(r) { setTimeout(r, 300); });
    grid = fallbackDungeon();
  }

  startGame(grid);
  document.getElementById('overlay').classList.add('hidden');
}

function startGame(grid) {
  dungeon = grid;
  hasKey = false;
  document.getElementById('key-icon').textContent = '--';
  document.getElementById('win').classList.remove('show');

  var sx = 1, sy = 1;
  for (var y = 0; y < dungeon.length; y++) {
    var x = dungeon[y].indexOf('S');
    if (x !== -1) { sx = x; sy = y; break; }
  }
  player = { x: sx * TILE + TILE / 2, y: sy * TILE + TILE / 2, vx: 0, vy: 0 };
  cam.x = player.x - canvas.width / 2;
  cam.y = player.y - canvas.height / 2;
}

function tileAt(px, py) {
  var tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (!dungeon || ty < 0 || ty >= dungeon.length) return '#';
  var row = dungeon[ty];
  if (tx < 0 || tx >= row.length) return '#';
  return row[tx];
}

function solid(px, py) { return tileAt(px, py) === '#'; }

function tick(dt) {
  if (!player || !dungeon) return;
  var dx = 0, dy = 0;
  if (inputKeys['ArrowLeft'] || inputKeys['KeyA']) dx = -1;
  if (inputKeys['ArrowRight'] || inputKeys['KeyD']) dx = 1;
  if (inputKeys['ArrowUp'] || inputKeys['KeyW']) dy = -1;
  if (inputKeys['ArrowDown'] || inputKeys['KeyS']) dy = 1;
  var m = Math.sqrt(dx * dx + dy * dy);
  if (m > 0) { dx /= m; dy /= m; }
  player.vx += dx * SPEED * dt;
  player.vy += dy * SPEED * dt;
  player.vx *= FRIC; player.vy *= FRIC;

  var r = 7;
  var nx = player.x + player.vx * dt;
  if (solid(nx - r, player.y - r) || solid(nx + r, player.y - r) || solid(nx - r, player.y + r) || solid(nx + r, player.y + r)) { nx = player.x; player.vx = 0; }
  var ny = player.y + player.vy * dt;
  if (solid(player.x - r, ny - r) || solid(player.x + r, ny - r) || solid(player.x - r, ny + r) || solid(player.x + r, ny + r)) { ny = player.y; player.vy = 0; }
  player.x = nx; player.y = ny;

  var tile = tileAt(player.x, player.y);
  if (tile === 'K' && !hasKey) {
    hasKey = true;
    document.getElementById('key-icon').textContent = 'YES';
    var ty = Math.floor(player.y / TILE), tx = Math.floor(player.x / TILE);
    dungeon[ty] = dungeon[ty].substring(0, tx) + '.' + dungeon[ty].substring(tx + 1);
  }
  if (tile === 'E' && hasKey) document.getElementById('win').classList.add('show');

  cam.x += (player.x - canvas.width / 2 - cam.x) * 0.1;
  cam.y += (player.y - canvas.height / 2 - cam.y) * 0.1;
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!dungeon || !player) return;

  var mapH = dungeon.length;
  var mapW = dungeon[0] ? dungeon[0].length : 0;
  var sy = Math.max(0, Math.floor(cam.y / TILE));
  var ey = Math.min(mapH, Math.ceil((cam.y + canvas.height) / TILE) + 1);
  var sx = Math.max(0, Math.floor(cam.x / TILE));
  var ex = Math.min(mapW, Math.ceil((cam.x + canvas.width) / TILE) + 1);

  for (var y = sy; y < ey; y++) {
    for (var x = sx; x < ex; x++) {
      var ch = dungeon[y][x];
      var px = x * TILE - cam.x, py = y * TILE - cam.y;
      ctx.fillStyle = TILE_COLORS[ch] || TILE_COLORS['.'];
      ctx.fillRect(px, py, TILE, TILE);
      if (ch === 'K') {
        var pulse = Math.sin(Date.now() * 0.004) * 3;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(px + TILE/2, py + TILE/2, TILE/3 + pulse, 0, Math.PI * 2); ctx.fill();
      }
      if (ch === 'E') {
        var p2 = Math.sin(Date.now() * 0.003) * 3;
        ctx.fillStyle = hasKey ? '#e040fb' : '#662266';
        ctx.beginPath(); ctx.arc(px + TILE/2, py + TILE/2, TILE/3 + p2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // Player
  var ppx = player.x - cam.x, ppy = player.y - cam.y;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(ppx, ppy + 5, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#00ff88';
  ctx.beginPath(); ctx.arc(ppx, ppy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

  // Minimap
  var ms = 3, mmw = mapW * ms, mmh = mapH * ms;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(canvas.width - mmw - 16, 12, mmw + 8, mmh + 8);
  for (var my = 0; my < mapH; my++) for (var mx = 0; mx < mapW; mx++) {
    var mc = dungeon[my][mx];
    if (mc === '#') continue;
    var cl = '#444';
    if (mc === 'K') cl = '#ffd700'; else if (mc === 'E') cl = '#e040fb'; else if (mc === 'S') cl = '#0a0';
    ctx.fillStyle = cl;
    ctx.fillRect(canvas.width - mmw - 12 + mx * ms, 16 + my * ms, ms - 1, ms - 1);
  }
  var pmx = Math.floor(player.x / TILE), pmy = Math.floor(player.y / TILE);
  ctx.fillStyle = '#00ff88';
  ctx.fillRect(canvas.width - mmw - 12 + pmx * ms - 1, 16 + pmy * ms - 1, ms + 1, ms + 1);
}

var lastT = 0;
function loop(t) {
  var dt = Math.min((t - (lastT || t)) / 1000, 0.05);
  lastT = t;
  tick(dt);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('replay').addEventListener('click', function() { generateDungeon(); });
generateDungeon().then(function() { requestAnimationFrame(loop); });
</script>
</body>
</html>
