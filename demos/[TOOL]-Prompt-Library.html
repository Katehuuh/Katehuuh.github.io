<!DOCTYPE html>
<html lang="en">
<head>

<title>Prompt Library</title>
<meta name="description" content="Prompts I use to benchmark frontier models, each with a Python and a single-file HTML version, plus a self-improving prompt engineer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f2f2f7;
  --surface: #fff;
  --fill: rgba(118,118,128,.12);
  --fill-2: rgba(118,118,128,.2);
  --sep: rgba(60,60,67,.16);
  --text: #000;
  --text-2: rgba(60,60,67,.62);
  --text-3: rgba(60,60,67,.36);
  --accent: #007aff;
  --code: #f6f6f9;
  --code-text: #1d1d1f;
  --hl-ph: #c93400;
  --hl-xml: #1a7f37;
  --hl-sec: #8a3ffc;
  --hl-num: #b45f06;
  --hl-hash: #0a66c2;
  --easy: #248a3d; --medium: #c93400; --hard: #d70015; --extreme: #8944ab;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --surface: #1c1c1e;
    --fill: rgba(118,118,128,.24);
    --fill-2: rgba(118,118,128,.36);
    --sep: rgba(84,84,88,.55);
    --text: #fff;
    --text-2: rgba(235,235,245,.6);
    --text-3: rgba(235,235,245,.3);
    --accent: #0a84ff;
    --code: #111113;
    --code-text: #e5e5ea;
    --hl-ph: #ff9f0a;
    --hl-xml: #7ee787;
    --hl-sec: #bf9bff;
    --hl-num: #ffb340;
    --hl-hash: #64d2ff;
    --easy: #30d158; --medium: #ff9f0a; --hard: #ff453a; --extreme: #bf5af2;
  }
}
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  color: var(--text); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
  max-width: 760px; margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ---- top bar ---- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

/* iOS segmented control */
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); flex-shrink: 0; }
.seg button {
  position: relative; padding: 4px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text);
  line-height: 1.35;
  transition: background .15s;
}
.seg button[aria-pressed="true"] {
  background: var(--surface); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  .seg button[aria-pressed="true"] { background: #636366; box-shadow: none; }
}

/* ---- search ---- */
.search { display: block; position: relative; margin-bottom: 20px; }
.search svg { position: absolute; left: 9px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
.search input {
  width: 100%; height: 36px; padding: 0 10px 0 31px; border: 0; border-radius: 10px;
  background: var(--fill); color: var(--text); font: inherit; font-size: 16px; outline: 0;
  -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--text-2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ---- grouped list ---- */
.group { margin-bottom: 22px; }
.group h2 {
  font-size: 12px; font-weight: 400; text-transform: uppercase; letter-spacing: .03em;
  color: var(--text-2); padding: 0 16px 6px;
}
/* clip, not hidden: hidden would make .list a scroll box and break the
   sticky toolbar */
.list { background: var(--surface); border-radius: 12px; overflow: clip; }
.row { position: relative; scroll-margin-top: 12px; }
.row:not([hidden]) ~ .row::before {   /* hairline inset past the icon, like a Settings list */
  content: ''; position: absolute; top: 0; left: 58px; right: 0; height: .5px; background: var(--sep);
}
.row.open + .row::before { left: 0; }
.head {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 14px; min-height: 58px;
}
.head:active { background: var(--fill); }
@media (hover: hover) { .head:hover { background: rgba(118,118,128,.06); } }
.ico {
  width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 16px; line-height: 1;
  background: color-mix(in srgb, var(--c) 18%, transparent);
}
.txt { flex: 1; min-width: 0; }
.t { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.s { display: block; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s b { font-weight: 600; }
.s b.easy { color: var(--easy); } .s b.medium { color: var(--medium); }
.s b.hard { color: var(--hard); } .s b.extreme { color: var(--extreme); }
/* First lines of the prompt, so a closed row shows what it is at a glance.
   Hidden once open, where the full prompt takes over. */
.peek {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-top: 6px; padding: 6px 9px 0; border-radius: 7px;
  /* bottom padding as a border: overflow clips at the padding box, so a
     padding would let the clamped third line peek through */
  border-bottom: 6px solid var(--code);
  background: var(--code); color: var(--text-2);
  font: 11.5px/1.45 var(--mono); white-space: normal; overflow-wrap: anywhere;
}
.row.open .peek { display: none; }
.head { align-items: flex-start; }
.ico { margin-top: 2px; }
.chev { align-self: center; }
.chev { width: 14px; height: 14px; color: var(--text-3); flex-shrink: 0; transition: transform .2s; }
.row.open .chev { transform: rotate(90deg); }

/* ---- open panel ---- */
.panel { padding: 0 12px 12px; }
.panel[hidden] { display: none; }
.tools {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 2px;
  background: var(--surface);
  box-shadow: 0 .5px 0 var(--sep);
}
.tools .seg { background: #efeff0; }
@media (prefers-color-scheme: dark) { .tools .seg { background: #323236; } }
.meta { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn {
  height: 28px; padding: 0 12px; border-radius: 99px; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
  position: relative;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
  transition: background .15s, color .15s;
}
.btn.fill { background: var(--accent); color: #fff; min-width: 84px; }
.btn[data-act="example"] { min-width: 92px; }
.btn:active { opacity: .7; }
.btn.done, .btn.fill.done { background: var(--easy); color: #fff; }
.btn svg { width: 13px; height: 13px; }

.prompt {
  background: var(--code); color: var(--code-text); border-radius: 10px;
  padding: 12px 14px; font: 12.5px/1.5 var(--mono);
  white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2;
  -webkit-user-select: text; user-select: text;
}
.prompt .ph   { color: var(--hl-ph); font-weight: 600; }
.prompt .xml  { color: var(--hl-xml); }
.prompt .sec  { color: var(--hl-sec); font-weight: 600; }
.prompt .num  { color: var(--hl-num); }
.prompt .hash { color: var(--hl-hash); }
.prompt .md   { font-weight: 700; }
.prompt .md i { font-style: normal; font-weight: 400; color: var(--text-3); }
.note { font-size: 12px; color: var(--text-2); margin: 8px 2px 0; line-height: 1.45; }
.note code { font-family: var(--mono); font-size: 11.5px; }

.empty { display: none; text-align: center; color: var(--text-2); font-size: 14px; padding: 28px 0; }
.foot { font-size: 12px; color: var(--text-2); text-align: center; }
@media (hover: none) { .foot { display: none; } }
kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--fill); }

.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 9;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 600;
  background: var(--text); color: var(--bg);
  transition: opacity .18s, transform .18s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 480px) {
  h1 { font-size: 26px; }
  .meta { display: none; }
  .tools .seg { margin-right: auto; }
  .panel { padding: 0 0 4px; }
  .tools { padding: 6px 14px; }
  .prompt { border-radius: 0; padding: 10px 14px; font-size: 12px; line-height: 1.45; }
  .note { margin: 8px 14px 4px; }
}
/* 44pt touch targets without making the controls look bigger */
@media (pointer: coarse) {
  .seg button { min-height: 28px; padding: 0 14px; }
  .btn { height: 32px; padding: 0 14px; }
  .btn::after, .seg button::after { content: ''; position: absolute; inset: -8px -2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header class="bar">
  <h1>Prompts</h1>
  <div class="seg" id="global" role="group" aria-label="Show every prompt as">
    <button type="button" data-g="python" aria-pressed="false">Python</button>
    <button type="button" data-g="html" aria-pressed="false">HTML</button>
  </div>
</header>
<label class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search prompts">
</label>
<main id="groups"></main>
<p class="empty" id="empty">No results</p>

<div class="toast" id="toast" role="alert"></div>

<script>
'use strict';

/* ======================================================================
   PROMPTS
   ====================================================================== */

var SELF_IMPROVE = `You are an expert prompt engineer. Given a task description and the expected result, your job is to craft the optimal prompt that would make any LLM produce that result.

<task>
Instruction: [INSTRUCTION]
Context:
"""
[INPUT — optional, delete this line if none]
"""
Expected output:
"""
[GROUND TRUTH — the ideal answer you want a prompt to produce]
"""
</task>

Follow this self-improvement methodology. Each round you generate a prompt, test it, evaluate, and iterate. Continue until the prompt reliably produces output matching the expected result.

Round 1:

<prompt-1>
Write your best first attempt at a prompt here. It must be self-contained — a stranger reading only this prompt (plus the context if any) should produce the expected output without ever seeing it. Do not embed, quote, or paraphrase the expected output inside the prompt.
</prompt-1>

<answer-1>
Now answer the prompt above as if you were a completely fresh LLM seeing it for the first time. While writing this answer, deliberately set aside your knowledge of the expected output — answer only from the prompt's instructions. Be honest; a biased answer defeats the purpose.
</answer-1>

<evaluation-1>
Compare your answer to the expected output:
- What matched
- What diverged and why
- Specific changes to make in the next prompt iteration
- Score: X/10
</evaluation-1>

If score is below 9, continue to round 2 with <prompt-2>, <answer-2>, <evaluation-2>, and so on. Each new prompt must try a genuinely different approach — not just minor rewording.

Stop when score >= 9/10. Output the final winning prompt clearly labeled:

<final-prompt>
[The prompt that scored 9+]
</final-prompt>

---
Additional rules:
- The prompt must be generalizable. Never hardcode the expected answer or use examples that only work for this specific input.
- Each iteration must attempt a different prompting strategy (e.g., role-play, step-by-step decomposition, output format constraints, few-shot with unrelated examples, chain-of-thought, structured output schema).
- If you have access to a separate LLM call, subagent, or tool-use capability, use that for the <answer-N> step instead of self-answering — this prevents unconscious bias toward the expected output and gives a more honest evaluation.`;

// Pre-filled example: YouTube video transcript -> compact tl;dr bullet list
// Based on yt.com/watch?v=8z1an7o_oQQ
// Full unabridged transcript so the example is realistic end-to-end.
var _EX_INSTRUCTION = `From the video transcript, create a bulleted list of 4-5 lines in total. Each line MUST combine several distinct, unrelated life hacks, separated by commas. Each hack is a 2-6 word, verb-first phrase describing a specific, down-to-earth application (e.g. '...to draw', '...from fridge photos', '...notifications from ChatGPT'). Keep them clever and compact; skip common or abstract ones. Bold the *technique or method*, sometimes the **tool used**, never the starting verb.`;
var _EX_OUTPUT = `AI use cases:
-   **Code hand-tracking** to draw, automate moving/deleting files with a **script**.
-   Get **simple prompts** improved, **draft your counter-offers**, get **outside-perspective advice** on life decisions.
-   Get **daily notifications** by asking ChatGPT for scheduled reminders.
-   **Create a prompt** from an image, apply **image filters** or **style transfer** with GPT image editing.
-   **Find locations** GeoGuessr-style, get movie picks **from your own ratings**, transcribe notes **from a photo**, get **recipes from fridge photos**.`;
var _EX_INPUT = "I bet you're not using ChatGPT to its fullest power. I use it all day, every day. So my team and I put together a list of every use case we could think of, and this is going to power up your life. I'm going to be showing you all of these tips using ChatGPT, but you can use any model that you want, Claude, Gemini, open-source models like DeepSeek, and this video is brought to you by our fantastic partners at Vultr. More on them later in the video.\n\nAlright, so first, coding, what AI right now is most useful for. You can code anything from simple scripts to use on your computer to full applications. Let me show you one that I just made. \"Create a drawing app that uses hand-tracking using my camera as the UI.\" I'm using o3 Pro for this. Obviously, you need a paid ChatGPT account, but you could probably do this with any free AI out there. So it thought for 2 minutes and 44 seconds, gave me the code, here it is, and let's give it a try.\n\nOkay, so here it is. Here's the hand tracking. When I do a peace sign, I can go up to the top right and select a color. Let's select pink, and there you go. We can draw on it, any which way you like. And this is a very simple version, took me 30 seconds to create. But you can create so much cool code using AI. Toy apps like this, serious productivity apps. And Alex actually creates scripts to help with file organization. Alex, show 'em.\n\nYep. So as somebody who edits videos all day, I use scripts to help me delete some of the files to clear up some of my storage more efficiently. But to be honest, I don't know how to write those scripts myself. So I use AI to make those scripts for me. So I just basically showed ChatGPT my file structure for every video that we edit, and I said, \"Hey, I just want to delete all of the 'raw' footage folders across every project in my main folder.\" And it gave me a script to run to do just that.\n\nThen I wanted to make sure I didn't accidentally delete any of the raw footage from something I'm still working on and haven't ingested yet. So I said, \"Is there any way to delete the 'raw' folders of videos only more than 1 month old?\" And it gave me an entirely new script. It wants me to replace this line right here with the path to my main folder. So I just took a screenshot of what that path looks like and ChatGPT filled it in for me. And as you can see here, it worked. Alright, back to you, Matt.\n\nNext, contract and legal document review. I use this all the time. Anytime that I get an NDA to sign or any kind of contract, the first thing I'm doing is throwing it in ChatGPT and asking if there's anything crazy in it or anything non-standard. And if there is, how to negotiate it. So here's an example. We have a basic Non-Disclosure Agreement. Let me show you what that looks like.\n\nSo here's the basic NDA, definition of confidential information, exclusions from confidential information, obligations of receiving party, and so on. I don't want to read all of this for every single contract I get. The first thing I do is just to make sure that it's legit and there's nothing crazy in it. Once I get a little further into the process, that's when I read it. That's when I consult a human lawyer, saving myself time and saving money by not immediately going to lawyers for everything I receive.\n\nSo what I did is I uploaded the PDF and I said, \"Review this NDA. Tell me if there are any non-standard terms and if so, how I should negotiate the language.\" So it came back with, \"Here are the non-standard or missing items: indefinite confidentiality, marking requirement, non-compelled disclosure carve-out, unilateral, use restriction is vague, return of materials, no governing law or venue clause,\" and so on.\n\nThen at the bottom, it says \"How to negotiate: Red-line the agreement with the changes above, tie your edits to standard practice, keep business stakeholders copied so legal slows things down less.\" Now what I can do from here is simply say, \"Okay, give me item by item exactly how I should negotiate it.\" So I typed it out, I'm going to hit enter, and here we go. And it's typing out the language exactly how I should send it to the counterparty to negotiate the terms of this NDA.\n\nAnd it's super useful for this, and really for anything. If you get any type of job contract, or basically any contract ever, even if you're agreeing to Terms of Service, you just simply load it up into ChatGPT and say, \"Tell me anything that's crazy in it.\"\n\nAnd speaking of negotiation, ChatGPT will help with that. A lot of people struggle to negotiate. They don't want that conflict. They don't even know how to draft language to negotiate. And I get it, it's hard. But ChatGPT and other AI systems can help you, not only with knowing what is the appropriate amount of negotiation to actually do, but to help you with the language of the negotiation.\n\nSo check this out: \"I received a job offer but want to negotiate for more. Can you help me? Here is the offer.\" Now I can easily put in more information here, like, \"Here's my role, here's how much experience I have, here's how much I was making previously.\" Any of that. I kept it simple for here. So Company: SynthLogic AI, this is just made up. Role: Senior AI Product Manager. Base salary, annual bonus, equity, signing bonus.\n\nAnd, \"Yes, here's a negotiation response.\" So this is what I was offered, and I asked it to write up a negotiation for me. \"Thank you for the offer. I'm genuinely excited about the opportunity at SynthLogic AI and the impact I can have in this role. Before moving forward, I'd like to discuss a few elements of the offer. Base Salary: Based on my experience and market benchmarks for Senior AI Product Managers, I was expecting something closer to $185,000. Equity: I appreciate the 30,000, I want 40,000. Signing bonus...\"\n\nAnd yeah, it's pretty generic right now, but again, you can get as specific as you want, especially when you receive an actual offer and you know yourself, you know your history, you know your worth. It'll help you figure all of that out. I use this pretty often.\n\nAnd if you want to try any of these use cases using open-source models, Vultr is a great option. Let me tell you about them. Vultr is the world's largest independent cloud provider, and they've been a fantastic partner to us, so I'm really excited to tell you about them again today. So if you need to provision GPUs, whether you're just tinkering on your own AI project or you're scaling up to production, Vultr is the place to go. They offer the latest AMD and Nvidia GPUs, spanning 32 locations across six continents, so you're going to get the lowest latency.\n\nThey also offer industry-leading price-to-performance, with serious accessibility and reliability. So with Vultr's global, fully composable cloud infrastructure, you move your applications closer to your users and free you from vendor lock-in, which you know I've talked about quite a bit on this channel. They also have Vultr Kubernetes Engine, which allows you to scale beyond just a single container.\n\nSo if you're tired of waiting in line for other GPU providers, check out Vultr today. They're offering my viewers $300 in credits for your first 30 days when you visit getvultr.com/berman. And remember to use code BERMAN300. Thanks again to Vultr. Back to the video.\n\nAlright, here's one that I use all the time, and I suspect not many people use it. And this is for life advice. I know not a lot of people use it because Anthropic just reported that the total use cases for kind of life advice and life help and self-help, all of that stuff, accounts for only 2% of their total usage, which is nuts to me because I really find so much value in this type of use case.\n\nAnd thinking through life situations that I need to solve or come to a decision on that are very difficult. Here's one, and this is a real one by the way: \"I'm considering moving from LA to the Bay Area and trying to decide if it's the right move. I lived in the Bay for 10 years and work in tech, currently building a media company focused on AI. Being closer to the epicenter of AI could help with networking and growth. I recently bought a house in LA and have a great setup here, including space and proximity to family. We're also building an ADU for my parents. Cost of living would go up, and we'd likely have to move farther away from SF to get a comparable home. I'd also want my parents to relocate. Ask me anything you need to help assess this decision.\"\n\nSo, very open-ended, difficult decision that I am going to have to make eventually, and I want AI to help me think through all of the things that I should be thinking about when I'm coming to this decision. So, it asked me, \"How many in-person meetings per month do you actually need in the Bay for networking and deal flow? Could quarterly 2-3 day trips cover those meetings instead of a full move? Budget for the Bay Area home? Minimum lot size? Will you keep, rent, or sell your existing house? School priorities for your 8-year-old? Is your spouse's work flexible?\" and so on.\n\nSo I answered all of these questions. It gave me different options for housing, obviously super expensive in the Bay Area. Commuting to AI events in SF, school quality, and it gave me some other ideas to think about. So networking reality: Weekly AI meetups and hack nights are already scheduled across SF, Palo Alto, and Oakland. Four to six flagship conferences per year. And if you live in the East or North Bay, count on a 1-2 hour round trip to most evening events.\n\nCost and logistical impacts. Parents' daily help. Travel alternatives. Decision snapshot. And I can basically just ideate with AI on this problem like, \"Oh, I actually didn't put as much emphasis on the travel time, maybe I need to move a little bit closer to SF,\" or \"I didn't really value how much I love being in Los Angeles. Why don't you put some more weight into that?\" And again, it's zero risk to have this conversation with AI.\n\nSo any life situation that you need some advice on, AI is fantastic for it. Just remember, there are times where AI can be sycophantic. Meaning it will essentially agree with much of what you say, even if it's not necessarily in your best interest. So make sure you're prompting it correctly. Make sure you say stuff like, \"Give me honest advice. Don't just say yes, tell me what you really think.\" And you can actually have an entire spectrum of advice. You can say, \"Okay, you're a yes-man, give me your advice,\" or \"You are an eternal pessimist, give me your advice.\" So you can have the AI take on different roles and give you advice based on those roles. Super helpful. Highly recommend this use case.\n\nNext is image analysis. And this is another one that I use all the time. So here's an example: I have a picture of this apple, and I'm going to ask, \"What type of apple is it?\" Obviously a very simplistic use case, but you can imagine some more complex use cases for your day-to-day life. So, \"What type of apple is this?\" Gala apples. Characteristics: Yellow and light orange base color, and yes, that is correct, red or pink vertical striping.\n\nBut yeah, I use image analysis all the time. I take pictures of my plants and say, \"Why does it look like that? Am I doing anything wrong?\" And it gives me recommendations. I take pictures of things that are broken in my house and ask, \"How do I fix that?\" There are just so many.\n\nAnother thing it's really good for is geo-guessing. This is kind of image analysis as well. Check this out. So I uploaded a picture from Google Maps. This is Catalina Island, a random photo, and said, \"Where is this picture taken?\" It thought for 58 seconds. It zoomed in to different parts of the image, and the answer: \"Overlooking Little Harbor on Santa Catalina Island, California,\" and it gave me the exact coordinates. And it was right.\n\nAnd this is a fantastic use case if you want to try out geo-guessing, which is just fun, or if you actually need to know where someone is located, something is located based on a photo.\n\nAlright, next is image generation, and the amount of different use cases within this category alone is huge. So here are just some of the stupid and fun examples that I've done. So I wanted to create Pokemon-like cards for top AI researchers and I just wanted to see what that would look like, so here's one. Yeah, silly, but I had fun with it.\n\nI was showing my son image generation and he was blown away, so of course he wanted to see a rocket-powered building, and here's what it came up with. He loved it. Here I wanted some designs to use on different mugs and water bottles and so on, and by the way, check out our merch down below. It also can create memes, so I said, \"Create me a meme with NSYNC saying 'Buy Buy Buy' when the market is down.\" There we go.\n\nIt also helps generate thumbnails with my face on it. Even though I don't have three hands, it otherwise looks decently good. And of course, the \"Ghibli-fication\" of everything. And we can do it in different styles. Minecraft. Anime. Simpsons. South Park. So really cool stuff. Play around with image generation, there are a million different use cases for it.\n\nAlright, next is image editing. And this is one Alex does all the time for images in our videos, so I'm going to let him show you exactly what he does. Alex?\n\nYeah, I use ChatGPT to edit images all the time. Almost every single video we make has some sort of image in the intro, or some sort of thumbnail image. And ChatGPT makes a lot of the backgrounds, it makes some of the faces. And here's a really fun example of one of the ones that I made. I found this image on Twitter, which basically was just somebody showing off something they did with ChatGPT to make a cool picture. I basically just took a screenshot of it, told ChatGPT to grab me the prompt, and I tried it out with myself and it made this image.\n\nThis is cool, but it wouldn't look very good on a thumbnail. So I asked ChatGPT to change the prompt to make it less of an overhead image, and also to use Sam Altman's face here for the thumbnail. The first option it gave me was pretty good, actually. But uh, this was a little too red for what I was looking for, and I also didn't love that there was this background here.\n\nSo I said, \"Let's remove the red tones and make him look normal colors. And for the background, let's make it simple and contrasting.\" Yeah, you don't even have to use like proper English, just whatever you're thinking, ChatGPT will usually understand it. And yeah, this image right here that it created of an angry Sam Altman is the image we used for this thumbnail right here. Pretty cool, right?\n\nOne more example of image editing is anytime you see like a logo in the intro, that oftentimes is something that ChatGPT has made, because usually when OpenAI releases a product, they use this very like wide image here. And that honestly wouldn't look very good in an intro. So I say, \"Use this as a reference image. Make me an image using a similar background and font that says OpenAI and below it, Codex.\" And there we go. It really is as easy as that. Alright, back to you, Matt.\n\nAnd another thing AI is really good for is translation. It's actually one of the things it's best at. So here's an example, we're going to combine translation and image analysis. So in this picture, I have a sign written in Japanese. I don't know what it says. Probably \"stop,\" but we'll see. And I'm simply going to copy it, upload it to ChatGPT and say, \"What does this sign say?\" And just a few seconds later, it says, \"The sign says 'Tomare', which means 'Stop' in Japanese. It's a standard stop sign.\"\n\nSo very cool, you can do translation if you have a book in another language, a PDF in another language, simply upload it and say \"translate it.\" Obviously, it's not going to be 100% accurate, that's not how language works, but it'll be really close and directionally correct.\n\nAnd another use case that I use all the time is transcription. I like to write things, and I have this little writing device called the reMarkable. So I write out a bunch of notes on it, and then I want to transcribe those notes. So I paste it into ChatGPT and have it transcribe it for me. Here's an example.\n\nSo over the weekend, I spent some time thinking about new model tests, and different categories of model tests that I want to use, specifically for when the next frontier model comes out. And so I wrote down a bunch of examples, but now I wanted it transcribed. So I simply uploaded the PDF, I said, \"Transcribe this,\" I didn't even write it correctly, and there it is. It has it all done perfectly. I use this all the time.\n\nNext is Advanced Voice Mode. So what I have done is I've mapped Advanced Voice Mode to my phone, to the side button right here. I hold it down, and I can ask it any questions, including giving it access to my camera. I do this all the time when I'm out and about. Sometimes I'll come across a snake in my neighborhood. I'll open it up, take a picture, and say, \"What kind of snake is this?\"\n\nOther times, in this example, I'm growing tomatoes, and I say, \"How's this tomato plant doing?\" Now it was a video, and it doesn't actually show the video here, but I did do it, and it says, \"It looks pretty healthy. The leaves are green, and I can see some flowers forming. Just make sure it's getting enough water and sunlight.\" So I use Advanced Voice Mode all the time, including having it teach me things.\n\n\"Why did the Roman Empire fall? Tell me why in basic terms in 30 seconds.\"\n\n\"The Roman Empire fell for a combination of reasons: political instability, economic troubles, military defeats, and invasions by barbarian tribes. Over time, these issues just weakened the empire until it couldn't sustain itself anymore.\"\n\n\"What's one lesson from the fall of the Roman Empire that I can apply to my life today?\"\n\n\"One big lesson is the importance of adaptability and resilience. Just like the Roman Empire struggled when it couldn't adapt to new challenges, staying flexible and open to change can help you navigate whatever life throws your way.\"\n\nSo I'll get in the car, I'll sync my phone to my Bluetooth, and I will just have conversations with AI, having it teach me things. And it's not just a one-way lesson, it's not just listening. You can actually dive into different topics and ask follow-up questions and go more granular in some areas and skip over others. And it is such a fantastic way to learn.\n\nSo if you don't already have it, I highly recommend you map your quick action button to some kind of voice mode. It doesn't matter if it's Gemini, or ChatGPT, or Claude, Perplexity, anything. It is such a fantastic way to just have quick access to AI. Asking questions, having it teach you stuff, or any of the other use cases that we've been talking about today.\n\nNext is Deep Research. And in this example, I've actually combined a bunch of different use cases into one. So one, I took a bunch of notes as I thought about risk. Life risk, different types of risk, how much risk you should take, and I had a bunch of questions. I've just been thinking about this subject a lot lately.\n\nAnd so, I took the PDF and I said, \"Transcribe this document, then help me think through the answers to the questions. It's all about life risk.\" So it thought for 44 seconds. I was using o3, and it starts to give me some information. Here's the transcript: \"So what kind of risks are there?\" These are all notes that I took. \"What risks do people not take that they should? How does age affect the answers to these questions?\" and so on.\n\nIt gave me answers to all of them, with references to studies, to articles. Then in o3 Pro, I said, \"Go deep into these questions. Think about it holistically. Find and reference research studies where applicable. Come up with novel ideas about risk.\" It thought for 30 minutes, and it came up with some really good ideas here.\n\nNow, obviously, o3 Pro is paid, and you need the highest tier plan to get it, I believe. But again, a lot of this stuff you don't need the highest tier for. You could probably get away with any of the thinking models, many of which are available for free.\n\nThen I had to do Deep Research mode. So I said, \"Dive deeper into it. Here's everything you've told me.\" It asked me a bunch of follow-up questions. I said, \"Just go.\" And it did deep research, sourcing from 33 different sources, and it gave me a bunch of information, and I read it, and it was super interesting.\n\nSo deep research on any topic is very, very valuable. If you're not already using deep research, I highly recommend you do. I believe Perplexity has deep research for free, and deep research can be used for a ton of different use cases. Sometimes if you want to upload a bunch of your own personal information to it and say, \"Okay, I need to research on this topic based on my personal information or this set of documents that I'm showing you. Give me all the research you can find on this specific topic,\" and it does that.\n\nNext is basic search. And really there are so many free options for this use case. ChatGPT, Perplexity, Claude, Gemini. And here's an example: \"How to pick out a cantaloupe.\" This may have been something you typed into Google previously. Then you get a bunch of ads, and then you click through to different websites trying to find that information. And you get somebody's life story instead of the actual information you're asking about.\n\nBut now, you get the information right away. I have transitioned to using AI for search on almost every single query that I have. So let's look at the answer. \"Check the smell. Sniff the stem end. A ripe cantaloupe should smell sweet and floral. There's no smell, it's underripe. Inspect the color. Feel the weight. Touch the texture. Examine the netting.\"\n\nAnd you can ask it anything. Nine times out of ten, using AI for search is better than using traditional search. The only exception to that is if you know the destination of where you're trying to go but you just can't find it. An example is, \"Okay, I know this hotel I want to stay at has a website, but I just don't remember what the website is.\" And you can just type that information in, and you're going to get there more quickly using traditional search than AI. Anything else, go to AI.\n\nAnd one that Alex uses all the time is helping him with color correction settings.\n\nYep, pretty much everything we shoot, we color correct in some way. And if you've ever edited videos before, this can be one of the most annoying processes. So instead of doing it by hand, I just take a screenshot of Matt, or the person he's interviewing, or even myself for this video. And I just ask ChatGPT, \"If you were to use Lumetri Color to correct this shot, what exactly would you do?\"\n\nAnd yeah, then ChatGPT walks me through exactly what to do to make this shot look like this shot. Looks pretty dang good, right? And you can always go back in and manually adjust anything that you want to change on your own, because obviously, you might have different preferences than what ChatGPT has. But yeah, this is one's something that I use all the time.\n\nFor more than just color correction, if I ever don't know how to do something, if I Google it, there's usually things like ads, and even if I find the thing that I'm looking for, then you have to scroll through the website to find it. And this just makes it so much easier. Alright, back to you, Matt.\n\nNext is recipes. \"Give me a recipe for pork belly made in an Instant Pot with Japanese flavors.\" And of course, that's easy for it to do. And I say, \"Looks like I don't have all of these ingredients. I have tamari soy sauce, rice vinegar, toasted sesame oil, and so on.\" So it gives me a simplified version. I actually made this. It was delicious. Very easy to do.\n\nNow, another thing you can do is take a picture of your fridge, take a picture of your ingredients and say, \"Take a look at this image. Let me know some options for dishes I can make based on these ingredients.\" And that I've done as well. So here's an example: I have a picture of a fridge. This isn't mine, but a picture of all these ingredients. And I say, \"Based on what I have in my fridge, please come up with an easy recipe for dinner tonight.\" Strawberry Greek Yogurt Egg Bowl. And it gives me the exact recipe for that.\n\nIt also asks me if I want a savory version instead. I say yes, and it gives me that too. Very easy way to only get recipes based on what you have in your fridge. It's also super good if you want recipes that are tailored for specific diets. So I follow up and I say, \"Now give me a recipe for a keto diet.\" And again, I'm using 4o for this, so it would be free for you. So ingredients from your fridge, there we go, and it gives me a specific keto diet recipe.\n\nAnd next is writing. I have AI help me with all types of writing. Whether it's ideating through YouTube titles, writing descriptions for YouTube videos, some creative writing. I have it help me write some emails. And it's good at all of that. I think sometimes it struggles with truly creative writing, but if you're doing anything in the professional sense, it is really good at that.\n\nSo here's an example: \"Write an email to my boss telling them I have an idea for a new business line and I want to meet with them to propose it.\" I'm using GPT-4o for this. And let's see what it does. So subject, \"Hi, I've been developing an idea for a new business line that I believe could be a strong growth opportunity for us. I'd love to set up a time... Let me know when you have 20 to 30 minutes available this week or next. Best, Matt.\"\n\nAlright, next, I thought this was pretty unique. I actually use ChatGPT to keep a list of all the movies I've seen, plus my ratings for it. And then I ask it to give me movie recommendations whenever I want to watch something. Here's how I did that: \"I want you to keep track of all the movies I've watched and how I rate them and then suggest movies to me. Start listing popular movies to start. I'll give you a score 1 to 10 or if I haven't seen it.\"\n\nHere are some movies. I start giving it rankings, and I do that for a while. So this was kind of the initial setup, and when I gave it my initial rankings, so back and forth. And all the way at the bottom now, anytime I watch a movie, I tell ChatGPT about it. It keeps a ranking for me. And now it will recommend movies.\n\nAnd so I say, \"Recommend a sci-fi movie for me.\" I've already told it not to recommend movies I've already seen. And so let's see what it says. So Predestination, 2014, gives me a description of what the movie is like. And I already said I liked Looper and The Matrix, this lands in between. Let me know if you watch it. So another really cool use case you may not have thought of. Obviously, not only can you do movies, but you can also do books, magazines, articles, plays. Basically any type of content that you're going to consume, you can ask for recommendations, and for it to track how you like each thing, and to give you recommendations based on that.\n\nAlright, another one is using it for medical diagnosis. Now, I have to say right up front, this is good for getting initial information or some clarity on information, but you should always see a real doctor. So my mom fell a few months ago, and really hurt her shoulder. She got results back. Here are the results. And I wanted to actually just get a better understanding of what this meant. Now obviously I can read this, and I kind of understand most of it. But how should I be thinking about this? So let me show you what I did.\n\nI said, \"Tell me about this diagnosis in simple terms.\" And it broke it down for me. No fractures or serious bone damage, mild arthritis, torn tendons, tendinosis, muscle changes, and so on. \"How bad is this for a 70-year-old woman?\" And these findings indicate significant chronic shoulder damage. So it went on and I clarified, I said, \"The woman fell hard on her shoulder.\" Gave me more information. \"Is it possible to heal by itself versus surgery?\"\n\nAnd yeah, I just use this all the time. Any test results I get back from the doctor, I always ask it first. Any pain or anything going on with me, I go to ChatGPT first. Very similar to using this for legal advice first, but then I always go to the human expert after. The lawyer, the doctor, etc.\n\nAlright, another thing I use AI for is helping me with shopping comparisons. So oftentimes if I'm thinking about buying something, I do a ton of research up front. I find a few options that I really like, and I have AI help me break down the differences. So here's an example: \"Give me the specs and differences between the Galaxy S25 Ultra and the Pixel 9 Pro.\" So it broke it down, gave me a nice little table comparing the two, plus it gives me references for where it got the information from.\n\nGave me a breakdown of the key differences, and then I can continue and ask more questions. And the best part is you can get personalized recommendations. So you can say, \"Okay, based on the fact that I make videos often, and I'm going to need to record on my phone,\" or \"based on the fact that I prioritize taking photos,\" or \"I want the fastest screen,\" whatever that is, you tell it, and it will give you recommendations.\n\nSo here's another example: Kindle Scribe versus reMarkable Paper Pro. And it compared the two. Writing experience, reading and display, ecosystem, battery, performance. And it also gives you links to buy them. So really good for shopping comparisons, shopping recommendations.\n\nAlright, next is trip planning. Trip planning can be very complicated, especially if you have a lot of dependencies. Like, here's where I want to go, here are the general weeks I want to go, I have kids, I want it to be less than 5 hours, I want the hotels to be within an hour of the beach. You can have so many dependencies, and put 'em all together, and ChatGPT or whatever AI you're using will deliver great recommendations. Check this out.\n\nSo, \"I want to travel to Europe, but I'm not sure where to go, sometime in July.\" So we'll start very broad. Alright, that's exciting, here we go: Paris, France; Rome, Italy; Barcelona; Amsterdam; Santorini; Prague. And so I say, \"I want to go to Amsterdam.\" Great. \"Could you please provide me with the dates? Sometime in July, I don't care when.\"\n\nSo it clarifies I want Amsterdam, Netherlands. Here it's now bringing me up different hotel options with the star ratings, the pricing, different deals they have. So I say, \"Show me some luxury hotel options.\" It gives me some more, obviously much more expensive. I say, \"Let's go with number two.\" Excellent choice.\n\nAnd then it starts asking me about flights. \"Yes, I want first class non-stop. I'm flying out of San Francisco.\" This is all made up, by the way. Gives me the flight information, the cost per ticket, everything. And I can go back and forth and have it plan my entire trip for me. And not only that, if you use ChatGPT Operator or other browser-use agents, you could potentially have it book it for you as well.\n\nAlright, next is using AI to improve your prompts. Rather than having to write out huge, very specific and detailed prompts, you can do something general and work with AI to have it write the prompt for you. Here's an example: So, \"Write me a prompt to create a calendar app that shows: one week, hour by hour, ability to edit each hour, and add tasks/events.\" Now it's going to fill in all of the details. And if I don't like any of them, I can work with it and modify it as I go.\n\nSo here it is: \"Create a simple, interactive calendar web app that displays a one-week view, broken down hour by hour,\" and so on. Features required: editable time blocks, persistent storage, and so on. I use this all the time. Oftentimes for text to video, text to image, text to audio, even text to text prompts. I'm using AI to help me craft the prompts themselves.\n\nAnd last, reminders. Now I don't personally use reminders, but Alex told me he uses them all the time. So Alex, show them what you use it for.\n\nYeah, I use reminders all the time in ChatGPT. I don't know about you guys, but when I use any sort of reminder app on my phone, it straight up doesn't send me the notification that I asked it to. Sometimes it'll remind you like an hour later than you needed, which just makes no sense. But with ChatGPT, my wife and I actually just bought a car back in February, and I just ask ChatGPT to remind me the day before a payment was due.\n\nI said, \"Remind me at 3 PM the day before that I have an upcoming car payment. This is every 11th and 25th of each month starting March 11th.\" And yeah, as you can see here, it's reminded me the day before every single car payment that I've had to make. I find ChatGPT's reminder system to be significantly better than pretty much any app that I've tried on my phone. Back to Matt.\n\nSo those are a ton of examples. If I missed anything, let me know in the comments below. I'm collecting all the use cases we can possibly find on the internet. I think AI is being underutilized, to say the least.\n\nAnd once again, thank you to Vultr for sponsoring this video. You get $300 off your first month using code BERMAN300. I'll drop all the links in the description below. Thanks again to Vultr. If you enjoyed this video, please consider giving a like and subscribe, and I'll see you in the next one.";

var SHIP_PY = `Create a PyGame spaceship battle driven by powerful RL with a Liquid NN (use its strength: temporal-continuous learning). Two AI-controlled white triangular ships on a black background (dark mode) learn to fight each other: shoot, dodge and navigate.

Rules (space setting physics, inspired by the old 2D game 'Asteroids'):
- Constant forward movement with drag physics.
- Continuous left/right rotation control in [-1.0, 1.0] (-1.0 / 0 / 1.0), decided in real time from decision feedback.
- Rate-limited shooting to avoid abuse, with velocity-aligned bullet spawn.
- Wall border collisions, no wrapping.
- Sensor inputs: visible raycasts for collision detection, plus the enemy ship's relative position, rotation and velocity, and its shots.
- Shot cooldown status as a 0.0-1.0 normalized timer.
- Per-round episode rewards: +1 for a hit, -1 for being hit, -0.5 to both on a 15 s timeout.

Make dodging real: the boring failure is both ships turning to face each other and trading shots while nobody evades. Reward a genuine near-miss (an enemy bullet on course to hit that passes close without hitting), tune turn rate and bullet speed so dodging is possible, and keep that shaping small next to +1/-1 so it can't be farmed.

Target extended overnight training with visible learning progress. Make it as creative, novel, unique and entertaining as the YouTube channel 'AI Warehouse'. Think step-by-step before showing the full script. (My setup: Windows + CUDA 12.8 + Python 3.10.8.)`;

var SHIP_HTML = `Create a single self-contained HTML file: a reinforcement-learning spaceship battle, as creative, novel, unique and entertaining as the YouTube channel 'AI Warehouse'.

Learning:
- A powerful Liquid neural network policy (liquid time-constant / closed-form continuous-time cells) that uses its strength: temporal-continuous learning, carrying hidden state from frame to frame.
- RL training runs in the browser. Plain JavaScript or a CDN library with a pinned version; no backend, no Python.

Arena and physics (space setting, inspired by the old 2D game 'Asteroids'):
- Two AI-controlled white triangular ships on a black background (dark mode), learning to fight each other: shoot, dodge and navigate.
- Constant forward movement with drag physics.
- Continuous left/right rotation control in [-1.0, 1.0] (-1.0 / 0 / 1.0 = left / none / right), decided in real time from decision feedback every step.
- Rate-limited shooting to avoid abuse, with velocity-aligned bullet spawn (bullets leave along the heading and inherit the ship's velocity).
- Wall border collisions, no screen wrapping.

Observations:
- Visible raycasts for collision detection (walls, the enemy ship, incoming bullets).
- Relative enemy position, rotation and velocity, plus the relative position and velocity of the nearest enemy shots.
- Own shot cooldown status as a 0.0-1.0 normalized timer.

Rewards per episode round:
- +1 for landing a hit, -1 for being hit.
- -0.5 to both ships on a 15 s timeout.

Make dodging real. The boring failure case is both ships turning to face each other and trading shots, with nobody ever trying to escape a bullet. Design the environment and the reward so that evading pays off:
- Reward a real dodge: an enemy bullet that was on course to hit and then passes within a near-miss radius without hitting.
- Make dodging physically possible: tune turn rate, ship speed, bullet speed and cooldown so a ship that reacts in time can get out of the way, and show incoming shots in the observations early enough to react.
- Keep all shaping small next to the terminal +1/-1 so it can't be reward-hacked: no farming near-misses by loitering next to bullets, spinning in circles, hugging walls or stalling to the timeout.

Training and display:
- Targets extended overnight training in a browser tab: a fast mode that runs many steps per frame (or a Web Worker), and a watch mode at normal speed to see the current policy fight.
- Visible learning progress: episode count, rolling hit rate, dodge count, average round length and reward curves.
- Save/load the trained weights (localStorage plus download/upload as JSON).

Verify it yourself before you hand it over: actually run the simulation (headless browser or Node), train it for a meaningful number of episodes, and check from the logged stats that (1) reward improves, (2) the ships don't just spin in place, hug walls or stall to the timeout, and (3) dodges increase over training instead of both ships simply facing each other and firing. If any check fails, fix the environment or reward and run it again. Report what you measured.

Think step-by-step before showing the full HTML file.`;

var HUMANOID_PY = `Create a Python script: a 3D humanoid RL walking simulation. Steps:

var HUMAN_HTML = `Model a 3D digital human: create a **single self-contained HTML** experience that renders a **MetaHuman-level, ultra-realistic adult woman**, SFW, in minimal clothing (simple underwear), built procedurally and custom from scratch. **No downloaded or prebuilt 3D human models, textures or baked character assets of any kind.**

Target a **very high-end CPU/GPU**. Long loading times and low FPS are acceptable when the visual quality justifies them. Push browser rendering to its maximum realism, past the uncanny valley: a hero-quality digital human character showcase and lookdev that is **cinematic, ultra-realistic, impressive, aesthetic, pleasing, stunning, beautiful, appealing, captivating: an amazing photoreal 3D render, hyperrealistic, with exceptional wow visual fidelity**.

Don't merely make a nice 3D woman; make the viewer question whether she is CG.

#gorgeous #AAA-quality #subtle-facial-asymmetry #fine-expression-lines #intricate #sophisticated #peach-fuzz #flyaway-hairs #natural-lip-texture #slight-scleral-veins #roughness-variation #individual-hair-strands #RTX #global-illumination #HDR-lighting #portfolio-quality #unreal-high-end-CG #VFX-quality #anatomically-convincing #naturalistic #organic #studio-grade #atmospheric #indistinguishable-from-reality #3DArt #CharacterArt #DigitalHuman #MetaHuman #UnrealEngine #UE5 #RealTimeRendering #CinematicRendering #SkinShader #ShaderDevelopment #SubsurfaceScattering #GameArt #GameDev #Groom #Fur #VFX`;


/* ======================================================================
   CATALOG
   ====================================================================== */

var GROUPS = [
  { id: 'tools', title: 'Tools' },
  { id: 'bench', title: 'Benchmarks' },
];

var CARDS = [
  {
    id: 'self-improve', group: 'tools', icon: '🔄', color: '#007aff',
    title: 'Self-Improving Prompt Engineer',
    desc: 'Writes, tests and refines a prompt',
    variants: [{ key: 'tmpl', label: 'Template', text: SELF_IMPROVE, example: SELF_IMPROVE_EXAMPLE }],
    note: 'Replace the <code>[BRACKETED]</code> parts. "Example" copies it filled in with a real transcript-to-summary task.',
  },
  {
    id: 'racenn', group: 'bench', icon: '🏎️', color: '#ff9500', diff: 'easy',
    title: 'RaceNN',
    desc: 'Cars learn a track by evolution',
    variants: [
      { key: 'python', label: 'Python', text: RACE_PY },
      { key: 'html',   label: 'HTML',   text: RACE_HTML },
    ],
  },
  {
    id: 'spaceship', group: 'bench', icon: '🚀', color: '#5856d6', diff: 'medium',
    title: 'Spaceship Duel',
    desc: 'Liquid-NN ships learn to dodge',
    variants: [
      { key: 'python', label: 'Python', text: SHIP_PY },
      { key: 'html',   label: 'HTML',   text: SHIP_HTML },
    ],
  },
  {
    id: 'humanoid', group: 'bench', icon: '🦿', color: '#34c759', diff: 'hard',
    title: 'Humanoid Walk',
    desc: 'A robot learns to walk from scratch',
    variants: [
      { key: 'python', label: 'Python', text: HUMANOID_PY },
      { key: 'html',   label: 'HTML',   text: HUMANOID_HTML },
    ],
  },
  {
    id: 'digital-human', group: 'bench', icon: '🧑‍🎨', color: '#ff2d55', diff: 'extreme',
    title: 'Digital Human',
    desc: 'Photoreal human from scratch',
    variants: [{ key: 'html', label: 'HTML', text: HUMAN_HTML }],
  },
];

var DIFF_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard', extreme: 'Extreme' };

/* ======================================================================
   RENDERING
   ====================================================================== */

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function highlight(text) {
  var h = esc(text);
  h = h.replace(/\[([A-Z][A-Z\s\-—,]+?)\]/g, '<span class="ph">[$1]</span>');
  h = h.replace(/&lt;(\/?)([\w-]+)(&gt;)/g, '<span class="xml">&lt;$1$2&gt;</span>');
  h = h.replace(/^((?:Round \d+|Additional rules|Required|Learning|Observations|Training and display|Rewards per episode round|Constraints|Rules|Arena and physics)[^\n:]*:)/gm, '<span class="sec">$1</span>');
  h = h.replace(/^(\s*)(\d+[.)])(?= )/gm, '$1<span class="num">$2</span>');
  h = h.replace(/\*\*([^*\n]+?)\*\*/g, '<span class="md"><i>**</i>$1<i>**</i></span>');
  h = h.replace(/(^|\s)(#[\w-]+)/g, '$1<span class="hash">$2</span>');
  return h;
}

function words(s) { return (s.match(/\S+/g) || []).length; }

var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

// Remember the last version picked (Python or HTML) for every card that has it.
var PREF_KEY = 'prompt-library:variant';
function loadPref() { try { return localStorage.getItem(PREF_KEY); } catch (e) { return null; } }
function savePref(v) { try { localStorage.setItem(PREF_KEY, v); } catch (e) {} }

var state = {};   // id -> { card, el, variant, rendered }
var groupsEl = document.getElementById('groups');

GROUPS.forEach(function (g) {
  var sec = document.createElement('section');
  sec.className = 'group';
  sec.dataset.group = g.id;
  sec.innerHTML = '<h2>' + g.title + '</h2><div class="list"></div>';
  groupsEl.appendChild(sec);
  var list = sec.querySelector('.list');

  CARDS.filter(function (c) { return c.group === g.id; }).forEach(function (c) {
    var el = document.createElement('article');
    el.className = 'row';
    el.id = 'card-' + c.id;
    var pid = 'panel-' + c.id;
    var multi = c.variants.length > 1;
    var hasExample = c.variants.some(function (v) { return v.example; });

    el.innerHTML =
        '<button type="button" class="head" aria-expanded="false" aria-controls="' + pid + '">'
      +   '<span class="ico" style="--c:' + c.color + '" aria-hidden="true">' + c.icon + '</span>'
      +   '<span class="txt"><span class="t">' + esc(c.title) + '</span>'
      +   '<span class="s">' + (c.diff ? '<b class="' + c.diff + '">' + DIFF_LABEL[c.diff] + '</b> · ' : '') + esc(c.desc) + '</span>'
      +   '<span class="peek" aria-hidden="true"></span></span>'
      +   CHEV
      + '</button>'
      + '<div class="panel" id="' + pid + '" hidden>'
      +   '<div class="tools">'
      +     (multi ? '<div class="seg" role="group" aria-label="Version">' + c.variants.map(function (v) {
              return '<button type="button" data-v="' + v.key + '" aria-pressed="false">' + v.label + '</button>';
            }).join('') + '</div>' : '')
      +     '<span class="meta"></span>'
      +     (hasExample ? '<button type="button" class="btn" data-act="example">Example</button>' : '')
      +     '<button type="button" class="btn fill" data-act="copy">' + COPY_ICON + 'Copy</button>'
      +   '</div>'
      +   '<pre class="prompt"></pre>'
      +   (c.note ? '<p class="note">' + c.note + '</p>' : '')
      + '</div>';
    list.appendChild(el);

    var pref = loadPref();
    var st = state[c.id] = {
      card: c, el: el, rendered: false,
      variant: c.variants.some(function (v) { return v.key === pref; }) ? pref : c.variants[0].key,
    };
    showVariant(c.id, st.variant);

    // The row header is the only thing that opens and closes. A click that
    // ends a text selection (dragging over the title) is not a toggle.
    el.querySelector('.head').addEventListener('click', function () {
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed && this.contains(sel.anchorNode)) return;
      setOpen(c.id, !el.classList.contains('open'));
    });

    // Inside an open panel, clicks never collapse anything: the prompt text
    // stays freely selectable.
    el.querySelector('.panel').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.v) { showVariant(c.id, b.dataset.v); syncHash(c.id); }
      else if (b.dataset.act === 'copy') copy(current(c.id).text, b, 'Copied');
      else if (b.dataset.act === 'example') copy(current(c.id).example, b, 'Example copied');
    });
  });
});

function current(id) {
  var s = state[id];
  return s.card.variants.filter(function (v) { return v.key === s.variant; })[0];
}

// Prompts are only highlighted once their row is opened.
function showVariant(id, key) {
  var s = state[id];
  s.variant = key;
  s.el.querySelector('.peek').textContent = current(id).text.slice(0, 300).replace(/\*\*/g, '');
  if (!s.el.classList.contains('open')) { s.rendered = false; return; }
  var v = current(id);
  s.el.querySelector('.prompt').innerHTML = highlight(v.text);
  s.el.querySelector('.meta').textContent = words(v.text).toLocaleString() + ' words';
  s.el.querySelectorAll('.tools .seg button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.v === key));
  });
  s.rendered = true;
}

function setOpen(id, open) {
  var s = state[id];
  s.el.classList.toggle('open', open);
  s.el.querySelector('.head').setAttribute('aria-expanded', String(open));
  s.el.querySelector('.panel').hidden = !open;
  if (open) {
    if (!s.rendered) showVariant(id, s.variant);
    syncHash(id);
  } else if (location.hash.slice(1).split('/')[0] === id) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function syncHash(id) {
  var s = state[id];
  var h = '#' + id + (s.card.variants.length > 1 ? '/' + s.variant : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}

/* ------------------------------------------------------- global switch */

// The default for every card, and it always shows a choice. Flipping it
// moves every card that has that version; a per-card pick can still differ.
var globalSeg = document.getElementById('global');
globalSeg.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  var key = b.dataset.g;
  CARDS.forEach(function (c) {
    if (c.variants.some(function (v) { return v.key === key; })) showVariant(c.id, key);
  });
  savePref(key);
  syncGlobal(key);
  var openId = location.hash.slice(1).split('/')[0];
  if (state[openId] && state[openId].el.classList.contains('open')) syncHash(openId);
});

function syncGlobal(key) {
  globalSeg.querySelectorAll('button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.g === key));
  });
}
syncGlobal(loadPref() === 'html' ? 'html' : 'python');

/* ---------------------------------------------------------------- copy */

var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>';
var live = document.getElementById('live');
var toastEl = document.getElementById('toast'), toastT = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
}

function copy(text, btn, msg) {
  var done = function () {
    if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
    btn.innerHTML = CHECK_ICON + 'Copied';
    btn.classList.add('done');
    live.textContent = msg;
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.classList.remove('done'); btn.innerHTML = btn.dataset.label; }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { if (fallbackCopy(text)) done(); });
  } else if (fallbackCopy(text)) done();
}
// file:// and older browsers have no async clipboard
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok) toast('Copy failed, select the text instead');
  return ok;
}

/* -------------------------------------------------------------- search */

var q = document.getElementById('q');
CARDS.forEach(function (c) {
  c.hay = (c.title + ' ' + c.desc + ' ' + (c.diff || '') + ' ' +
           c.variants.map(function (v) { return v.label + ' ' + v.text; }).join(' ')).toLowerCase();
});
q.addEventListener('input', function () {
  var needle = q.value.trim().toLowerCase();
  var shown = 0;
  CARDS.forEach(function (c) {
    var hit = !needle || c.hay.indexOf(needle) !== -1;
    state[c.id].el.hidden = !hit;
    if (hit) shown++;
  });
  document.querySelectorAll('.group').forEach(function (g) {
    g.hidden = !g.querySelector('.row:not([hidden])');
  });
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
});
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});

/* ------------------------------------------------------------ deep link */

// #spaceship or #spaceship/html opens that card on that version
function openFromHash() {
  var parts = decodeURIComponent(location.hash.slice(1)).split('/');
  var s = state[parts[0]];
  if (!s) return;
  if (parts[1] && s.card.variants.some(function (v) { return v.key === parts[1]; })) s.variant = parts[1];
  setOpen(parts[0], true);
  showVariant(parts[0], s.variant);
  var r = s.el.getBoundingClientRect();
  if (r.top < 0 || r.top > innerHeight * .6) s.el.scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
