<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Racer</title>
${favicon_line}
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000011; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      padding: 8px 14px;
      background: rgba(0, 0, 17, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      font: 600 14px/1 monospace;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(0, 200, 255, 0.4);
      backdrop-filter: blur(4px);
    }
    #hud .peers { color: #88c8ff; font-size: 12px; margin-top: 4px; opacity: 0.85; }

    #help {
      position: fixed; bottom: 14px; right: 14px; z-index: 10;
      padding: 10px 13px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(0, 0, 17, 0.55);
      border-radius: 8px;
      font: 13px/1.45 sans-serif;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    #copy-prompt {
      position: fixed; top: 14px; right: 14px; z-index: 11;
      padding: 9px 14px;
      color: #fff; background: rgba(29, 155, 240, 0.85);
      border: 0; border-radius: 8px;
      font: 600 13px/1.2 sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: background 0.15s, transform 0.1s;
      backdrop-filter: blur(4px);
    }
    #copy-prompt:hover { background: rgba(29, 155, 240, 1); }
    #copy-prompt:active { transform: scale(0.96); }
    #copy-prompt.ok { background: rgba(0, 186, 124, 0.95); }

    #toast {
      position: fixed; top: 56px; right: 14px; z-index: 12;
      padding: 7px 13px;
      color: #fff; background: rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      font: 13px/1.2 sans-serif;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateY(-6px);
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    #banner {
      position: fixed; top: 50%; left: 50%; z-index: 5;
      transform: translate(-50%, -50%);
      padding: 18px 32px;
      background: rgba(0, 0, 17, 0.7);
      border: 1px solid rgba(255, 200, 80, 0.4);
      border-radius: 12px;
      font: 700 32px/1 sans-serif;
      color: #ffd060;
      text-shadow: 0 0 20px rgba(255, 208, 96, 0.6);
      letter-spacing: 1px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #banner.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="hud">Lap 1 / 3<div class="peers">racing alone</div></div>
  <div id="help">WASD / arrows: steer<br>Space: boost<br>Pass the white line each lap</div>
  <button id="copy-prompt" type="button">Copy prompt template</button>
  <div id="toast">Copied</div>
  <div id="banner"></div>

  <script type="module">
  "use strict";

  // ------------------------------------------------------------
  // Imports - Three.js core + Trystero P2P. Trystero uses public
  // BitTorrent trackers as signaling, so no API key, no signup.
  // ------------------------------------------------------------
  import * as THREE from "https://esm.sh/three@0.161.0";

  // ------------------------------------------------------------
  // Tunables
  // ------------------------------------------------------------
  const TOTAL_LAPS = 3;
  const TRACK_OUTER = 150;
  const TRACK_INNER = 120;
  const NUM_CHECKPOINTS = 8;
  const NUM_BOOST_PADS = 5;
  const NUM_OBSTACLES = 8;
  const SHIP_ACCEL = 60;
  const SHIP_MAX_SPEED = 70;
  const SHIP_TURN_SPEED = 2.2;
  const SHIP_BOOST_MULT = 1.7;
  const BOOST_MAX = 100;
  const BOOST_USE = 38;   // per second
  const BOOST_REGEN = 14; // per second
  const SHIP_DRAG = 0.94;

  // ------------------------------------------------------------
  // Identity (auto-assigned, no input gate)
  // ------------------------------------------------------------
  const ADJECTIVES = ["Brave", "Quiet", "Lucky", "Cosmic", "Velvet", "Stoic", "Crimson", "Indigo", "Solar", "Lunar", "Nimble", "Iron", "Glass", "Neon", "Hollow", "Bright"];
  const NOUNS = ["Comet", "Pulsar", "Nova", "Rocket", "Falcon", "Voyager", "Drifter", "Pilot", "Specter", "Reaver", "Arrow", "Phantom", "Saber", "Streak", "Echo", "Vector"];
  const SHIP_COLORS = [0xff3352, 0x33ff66, 0x3388ff, 0xffaa33, 0xff33cc, 0x33ffe6, 0xffd84d, 0xb44dff];
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  const myName = pick(ADJECTIVES) + " " + pick(NOUNS);
  const myColor = pick(SHIP_COLORS);

  // ------------------------------------------------------------
  // Scene
  // ------------------------------------------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000011);
  scene.fog = new THREE.FogExp2(0x000011, 0.0035);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 800);
  camera.position.set(0, 18, -28);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.AmbientLight(0x445566, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(60, 90, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -180;
  sun.shadow.camera.right = 180;
  sun.shadow.camera.top = 180;
  sun.shadow.camera.bottom = -180;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 250;
  scene.add(sun);

  // Starfield
  (function addStars() {
    const g = new THREE.BufferGeometry();
    const verts = [];
    for (let i = 0; i < 4000; i++) {
      const r = 400 + Math.random() * 300;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      verts.push(
        r * Math.sin(phi) * Math.cos(theta),
        Math.abs(r * Math.cos(phi)),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1, sizeAttenuation: false })));
  })();

  // ------------------------------------------------------------
  // Track: ring of slate, white start/finish line, glowing borders
  // ------------------------------------------------------------
  (function buildTrack() {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, TRACK_OUTER, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, TRACK_INNER, 0, Math.PI * 2, true);
    shape.holes.push(hole);
    const geo = new THREE.ShapeGeometry(shape, 96);
    const mat = new THREE.MeshStandardMaterial({ color: 0x2a2e3a, metalness: 0.4, roughness: 0.85, side: THREE.DoubleSide });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.y = -0.5;
    m.receiveShadow = true;
    scene.add(m);

    // border rings (subtle glow)
    [TRACK_INNER, TRACK_OUTER].forEach(r => {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(r - 0.4, r + 0.4, 96),
        new THREE.MeshBasicMaterial({ color: 0x4a90e2, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = -0.45;
      scene.add(ring);
    });

    // start / finish line
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(TRACK_OUTER - TRACK_INNER + 2, 2.4),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set((TRACK_OUTER + TRACK_INNER) / 2, -0.4, 0);
    scene.add(line);
  })();

  // Checkpoints (invisible) - array of world-space (x, z) gates
  const checkpoints = [];
  (function buildCheckpoints() {
    const mid = (TRACK_INNER + TRACK_OUTER) / 2;
    for (let i = 0; i < NUM_CHECKPOINTS; i++) {
      const a = (Math.PI * 2 * i) / NUM_CHECKPOINTS;
      checkpoints.push({ x: Math.cos(a) * mid, z: Math.sin(a) * mid });
    }
  })();

  // Boost pads - visible glowing strips
  const boostPads = [];
  (function buildBoostPads() {
    const mid = (TRACK_INNER + TRACK_OUTER) / 2;
    const trackWidth = TRACK_OUTER - TRACK_INNER;
    for (let i = 0; i < NUM_BOOST_PADS; i++) {
      const a = (Math.PI * 2 * (i + 0.5)) / NUM_BOOST_PADS;
      const off = (Math.random() - 0.5) * trackWidth * 0.4;
      const r = mid + off;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(5, 0.4, 10),
        new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.7, metalness: 0.6, roughness: 0.3 })
      );
      pad.position.set(x, -0.25, z);
      pad.rotation.y = a + Math.PI / 2;
      scene.add(pad);
      boostPads.push({ x, z, mesh: pad });
    }
  })();

  // Obstacles (glowing red rocks)
  const obstacles = [];
  (function buildObstacles() {
    const mid = (TRACK_INNER + TRACK_OUTER) / 2;
    const trackWidth = TRACK_OUTER - TRACK_INNER;
    const mat = new THREE.MeshStandardMaterial({ color: 0xff2a2a, emissive: 0x550000, metalness: 0.4, roughness: 0.6 });
    for (let i = 0; i < NUM_OBSTACLES; i++) {
      const a = Math.random() * Math.PI * 2;
      const off = (Math.random() - 0.5) * trackWidth * 0.55;
      const r = mid + off;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(2.4, 0), mat);
      m.position.set(x, 1.5, z);
      m.castShadow = true;
      scene.add(m);
      obstacles.push({ x, z, mesh: m, r: 3 });
    }
  })();

  // ------------------------------------------------------------
  // Ship model - proper sleek racing hull (no random cones)
  // Built from an extruded silhouette + cockpit dome + 2 engines.
  // ------------------------------------------------------------
  function makeShip(color) {
    const group = new THREE.Group();

    // Hull silhouette (top-down). Nose toward +Z (forward).
    const s = new THREE.Shape();
    s.moveTo(0, 4);
    s.bezierCurveTo(1.4, 3.4, 1.9, 1.6, 2.0, 0);
    s.lineTo(2.6, -2.4);
    s.lineTo(0.9, -2.6);
    s.lineTo(0.9, -3.2);
    s.lineTo(-0.9, -3.2);
    s.lineTo(-0.9, -2.6);
    s.lineTo(-2.6, -2.4);
    s.lineTo(-2.0, 0);
    s.bezierCurveTo(-1.9, 1.6, -1.4, 3.4, 0, 4);
    const hullGeo = new THREE.ExtrudeGeometry(s, { depth: 1.0, bevelEnabled: true, bevelSize: 0.18, bevelThickness: 0.18, bevelSegments: 2, curveSegments: 12 });
    hullGeo.center();
    hullGeo.rotateX(-Math.PI / 2); // lay flat, height along Y now
    const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({ color, metalness: 0.55, roughness: 0.4 }));
    hull.castShadow = true;
    hull.receiveShadow = true;
    group.add(hull);

    // Cockpit canopy
    const canopy = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x88ddff, metalness: 0.2, roughness: 0.05, transparent: true, opacity: 0.55 })
    );
    canopy.position.set(0, 0.55, 0.9);
    canopy.scale.set(1, 0.6, 1.4);
    canopy.castShadow = true;
    group.add(canopy);

    // 2 engines at the back
    const engineMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.85, roughness: 0.25 });
    [-0.7, 0.7].forEach(dx => {
      const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.45, 0.9, 10), engineMat);
      eng.rotation.x = Math.PI / 2;
      eng.position.set(dx, 0.05, -2.4);
      eng.castShadow = true;
      group.add(eng);
    });

    // Engine glow (visible while thrusting, brighter on boost)
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x22ddff, transparent: true, opacity: 0.7 });
    [-0.7, 0.7].forEach((dx, i) => {
      const glow = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.6, 10), glowMat.clone());
      glow.rotation.x = Math.PI / 2;
      glow.position.set(dx, 0.05, -3.5);
      glow.visible = false;
      glow.name = "glow" + i;
      group.add(glow);
    });

    return group;
  }

  // Floating name label above a ship
  function makeNameLabel(name) {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 64;
    const ctx = c.getContext("2d");
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 6;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(name, 128, 32);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sprite.scale.set(8, 2, 1);
    sprite.position.set(0, 4, 0);
    return sprite;
  }

  // ------------------------------------------------------------
  // Local player state
  // ------------------------------------------------------------
  const ship = makeShip(myColor);
  const nameLabel = makeNameLabel(myName);
  ship.add(nameLabel);
  ship.position.set((TRACK_INNER + TRACK_OUTER) / 2, 0, 4); // just past start line
  ship.rotation.y = 0; // face +Z (tangent to track, counterclockwise)
  scene.add(ship);

  const player = {
    pos: ship.position,
    rot: ship.rotation,
    vel: new THREE.Vector3(0, 0, 0),
    boost: BOOST_MAX,
    boosting: false,
    thrusting: false,
    nextCheckpoint: 1,
    lap: 1,
    finished: false
  };

  // ------------------------------------------------------------
  // Input
  // ------------------------------------------------------------
  const keys = { fwd: false, back: false, left: false, right: false, boost: false };
  function setKey(code, on) {
    if (code === "KeyW" || code === "ArrowUp") keys.fwd = on;
    else if (code === "KeyS" || code === "ArrowDown") keys.back = on;
    else if (code === "KeyA" || code === "ArrowLeft") keys.left = on;
    else if (code === "KeyD" || code === "ArrowRight") keys.right = on;
    else if (code === "Space") keys.boost = on;
  }
  addEventListener("keydown", e => { setKey(e.code, true); if (e.code === "Space") e.preventDefault(); });
  addEventListener("keyup", e => setKey(e.code, false));

  // ------------------------------------------------------------
  // Simulation
  // ------------------------------------------------------------
  function dist2D(a, b) {
    const dx = a.x - b.x, dz = a.z - b.z;
    return Math.sqrt(dx * dx + dz * dz);
  }

  function tickPlayer(dt) {
    if (player.finished) return;

    if (keys.left) player.rot.y += SHIP_TURN_SPEED * dt;
    if (keys.right) player.rot.y -= SHIP_TURN_SPEED * dt;

    const fwd = new THREE.Vector3(-Math.sin(player.rot.y), 0, -Math.cos(player.rot.y));
    let accel = 0;
    if (keys.fwd) accel = SHIP_ACCEL;
    else if (keys.back) accel = -SHIP_ACCEL * 0.5;

    player.thrusting = accel > 0;
    player.boosting = keys.boost && player.boost > 0 && accel > 0;

    if (player.boosting) {
      accel *= SHIP_BOOST_MULT;
      player.boost = Math.max(0, player.boost - BOOST_USE * dt);
    } else {
      player.boost = Math.min(BOOST_MAX, player.boost + BOOST_REGEN * dt);
    }

    player.vel.addScaledVector(fwd, accel * dt);
    player.vel.multiplyScalar(Math.pow(SHIP_DRAG, dt * 60));

    const maxV = SHIP_MAX_SPEED * (player.boosting ? SHIP_BOOST_MULT : 1);
    if (player.vel.lengthSq() > maxV * maxV) player.vel.setLength(maxV);

    player.pos.addScaledVector(player.vel, dt);
    player.pos.y = 0;

    // boost pads
    for (const pad of boostPads) {
      if (dist2D(player.pos, pad) < 4) {
        player.boost = BOOST_MAX;
      }
    }

    // wall snap (soft): clamp distance to track radial range
    const r = Math.sqrt(player.pos.x * player.pos.x + player.pos.z * player.pos.z);
    if (r > TRACK_OUTER - 1.5) {
      const f = (TRACK_OUTER - 1.5) / r;
      player.pos.x *= f; player.pos.z *= f;
      player.vel.multiplyScalar(0.4);
    } else if (r < TRACK_INNER + 1.5) {
      const f = (TRACK_INNER + 1.5) / r;
      player.pos.x *= f; player.pos.z *= f;
      player.vel.multiplyScalar(0.4);
    }

    // obstacle bounce
    for (const ob of obstacles) {
      if (dist2D(player.pos, ob) < ob.r + 1.6) {
        const dx = player.pos.x - ob.x, dz = player.pos.z - ob.z;
        const len = Math.sqrt(dx * dx + dz * dz) || 1;
        player.pos.x = ob.x + (dx / len) * (ob.r + 1.6);
        player.pos.z = ob.z + (dz / len) * (ob.r + 1.6);
        player.vel.multiplyScalar(0.35);
      }
    }

    // engine glow visibility
    const g0 = ship.getObjectByName("glow0"), g1 = ship.getObjectByName("glow1");
    if (g0 && g1) {
      const on = player.thrusting;
      g0.visible = g1.visible = on;
      const opacity = player.boosting ? 1 : 0.6;
      g0.material.opacity = opacity; g1.material.opacity = opacity;
      g0.material.color.setHex(player.boosting ? 0xff44ff : 0x22ddff);
      g1.material.color.setHex(player.boosting ? 0xff44ff : 0x22ddff);
    }

    // checkpoint progress
    const cpNext = checkpoints[player.nextCheckpoint];
    if (dist2D(player.pos, cpNext) < 14) {
      player.nextCheckpoint = (player.nextCheckpoint + 1) % NUM_CHECKPOINTS;
      if (player.nextCheckpoint === 1) {
        // crossed the start/finish gate (cp0) and we're now expecting cp1
        player.lap++;
        if (player.lap > TOTAL_LAPS) {
          player.finished = true;
          showBanner("RACE COMPLETE", 3000);
          // soft reset for replay after a beat
          setTimeout(resetRace, 3500);
        }
        updateHud();
      }
    }
  }

  function resetRace() {
    player.lap = 1;
    player.nextCheckpoint = 1;
    player.finished = false;
    player.vel.set(0, 0, 0);
    player.boost = BOOST_MAX;
    player.pos.set((TRACK_INNER + TRACK_OUTER) / 2, 0, 4);
    // rot.y=0 → forward is (sin(0), cos(0)) = (0, +Z) → tangent to
    // the circular track at the 3-o'clock spawn point. The old -PI/2
    // pointed toward -X (track center), spawning the car sideways.
    player.rot.y = 0;
    updateHud();
  }

  // Camera follows behind+above
  const camOffset = new THREE.Vector3();
  function tickCamera() {
    const back = -Math.sin(player.rot.y), backZ = -Math.cos(player.rot.y);
    camOffset.set(
      player.pos.x - back * 18,
      14,
      player.pos.z - backZ * 18
    );
    camera.position.lerp(camOffset, 0.12);
    camera.lookAt(player.pos.x, 1.5, player.pos.z);
  }

  // ------------------------------------------------------------
  // HUD
  // ------------------------------------------------------------
  const hudEl = document.getElementById("hud");
  const peersLineEl = hudEl.querySelector(".peers");
  function updateHud() {
    hudEl.firstChild.textContent = `Lap ${Math.min(player.lap, TOTAL_LAPS)} / ${TOTAL_LAPS}`;
  }
  function updatePeerCount(n) {
    peersLineEl.textContent = n === 0 ? "racing alone" : (n === 1 ? "1 racer" : `${n} racers`);
  }
  updateHud();

  const bannerEl = document.getElementById("banner");
  let bannerTimer = null;
  function showBanner(text, ms = 1500) {
    bannerEl.textContent = text;
    bannerEl.classList.add("show");
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => bannerEl.classList.remove("show"), ms);
  }

  // ------------------------------------------------------------
  // Multiplayer (Trystero P2P, BitTorrent tracker signaling)
  // Best-effort: solo if Trystero fails to import or join
  // ------------------------------------------------------------
  const peers = new Map();

  function makePeerShip(state) {
    const g = makeShip(state.color || 0xaaaaaa);
    g.add(makeNameLabel(state.name || "Stranger"));
    g.position.set(state.x || 0, 0, state.z || 0);
    g.rotation.y = state.rot || 0;
    return g;
  }

  function applyPeerState(peerId, data) {
    let p = peers.get(peerId);
    if (!p) {
      p = { mesh: makePeerShip(data) };
      scene.add(p.mesh);
      peers.set(peerId, p);
      updatePeerCount(peers.size);
    }
    // smooth-ish snap
    p.mesh.position.set(data.x, 0, data.z);
    p.mesh.rotation.y = data.rot;
    const g0 = p.mesh.getObjectByName("glow0"), g1 = p.mesh.getObjectByName("glow1");
    if (g0 && g1) {
      g0.visible = g1.visible = !!data.thrusting;
      const c = data.boosting ? 0xff44ff : 0x22ddff;
      g0.material.color.setHex(c); g1.material.color.setHex(c);
    }
  }

  let sendState = null;
  (async function startNetwork() {
    try {
      const { joinRoom } = await import("https://esm.sh/trystero@0.21.5/torrent");
      const room = joinRoom({ appId: "space-racer-jam-2026" }, "main-track");
      const [send, get] = room.makeAction("state");
      sendState = send;
      get((data, peerId) => applyPeerState(peerId, data));
      room.onPeerJoin(() => updatePeerCount(peers.size + 1));
      room.onPeerLeave(peerId => {
        const p = peers.get(peerId);
        if (p) { scene.remove(p.mesh); peers.delete(peerId); }
        updatePeerCount(peers.size);
      });
      // broadcast our state ~20Hz
      setInterval(() => {
        if (!sendState) return;
        try {
          sendState({
            name: myName,
            color: myColor,
            x: player.pos.x,
            z: player.pos.z,
            rot: player.rot.y,
            thrusting: player.thrusting,
            boosting: player.boosting
          });
        } catch (_) { /* peer churn */ }
      }, 50);
    } catch (e) {
      console.warn("Trystero unavailable, racing solo:", e);
    }
  })();

  // ------------------------------------------------------------
  // Copy prompt template button (preserves the levelsio post)
  // ------------------------------------------------------------
  const PROMPT_TEMPLATE = `You will participate in the below and create a project based on the following X to play in the Game Jam: \`\`\` I'm organizing the 🌟 2025 Vibe Coding Game Jam Deadline to enter: 25 March 2025, so you have 7 days - anyone can enter with their game - at least 80% code has to be written by AI - game has to be accessible on web without any login or signup and free-to-play (preferrably its own domain or subdomain) - game has to be multiplayer by default - can use any engine but usually ThreeJS is recommended - NO loading screens and heavy downloads (!!!) has to be almost instantly in the game (except maybe ask username if you want) The jury: me, and I will ask some real game dev people to jury too Gold, silver and bronze winners will be tweeted out and if companies want to sponsor prizes that works too General sponsors welcome to, just DM me! I hope this will help give the best vibe coded games more distribution! I'll add a form to enter your game below this tweet \`\`\` Source: https://x.com/levelsio/status/1901660771505021314`;

  const copyBtn = document.getElementById("copy-prompt");
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(PROMPT_TEMPLATE);
      copyBtn.classList.add("ok");
      copyBtn.textContent = "Copied";
      showToast("Prompt copied to clipboard");
      setTimeout(() => {
        copyBtn.classList.remove("ok");
        copyBtn.textContent = "Copy prompt template";
      }, 1600);
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = PROMPT_TEMPLATE;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("Prompt copied to clipboard"); }
      catch (_e) { showToast("Copy failed - select manually"); }
      document.body.removeChild(ta);
    }
  });

  // ------------------------------------------------------------
  // Resize / loop
  // ------------------------------------------------------------
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    tickPlayer(dt);
    tickCamera();
    // gently bob/spin obstacles for visual interest
    for (let i = 0; i < obstacles.length; i++) obstacles[i].mesh.rotation.y += dt * 0.6;
    renderer.render(scene, camera);
  }
  loop();
  </script>
</body>
</html>
