<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
            "react-dom/client": "https://esm.sh/react-dom@18/client"
        }
    }
    </script>
    <script type="module">
import React, { useState, useEffect, useRef, useCallback, Component } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'https://esm.sh/htm@3';

const html = htm.bind(React.createElement);

/* ===== WLLAMA IMPORTS ===== */
let WllamaClass = null;
let WasmPaths = null;
const WLLAMA_CDN = 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.1.1';
const { Wllama } = await import(WLLAMA_CDN + '/esm/index.js');
WllamaClass = Wllama;
WasmPaths = { 'default': WLLAMA_CDN + '/esm/wasm/wllama.wasm' };
console.log('[wllama] Loaded v3.1.1');

/* ===== CONSTANTS ===== */
const PHASES = {
    LOADING: 'loading', LOBBY: 'lobby', ROUND: 'round',
    ANALYZING: 'analyzing', VOTING: 'voting', RESULTS: 'results'
};
const ROUND_DURATION = 120;
const VOTING_DURATION = 15;
const MIN_MESSAGES = 3;
const HF_REPO = 'unsloth/gemma-4-E2B-it-GGUF';
const HF_FILE = 'gemma-4-E2B-it-UD-Q3_K_XL.gguf';
// NOTE: Switching to a pure transformer GGUF (no Mamba/SSM hybrid) would eliminate 'forcing full prompt re-processing'. Qwen3.5 hybrid forces full prefill every call. Consider Qwen2.5-1.5B-Instruct-Q4_K_M or similar pure-attention model.

const ANONYMOUS_NAMES = [
    'Marcus','Elena','Kai','Nadia','Remy',
    'Sasha','Tomek','Yuki','Dante','Mira',
    'Oscar','Lena','Hugo','Zara','Felix',
    'Ines','Ruben','Anja','Cole','Priya',
    'Axel','Dina','Juno','Leon','Noor',
    'Theo','Rosa','Ivan','Vera','Sam'
];

/* ===== AI PERSONA (same for all 3 AIs -- no personality differentiation) ===== */
const AI_PERSONA = {
    systemPrompt: 'Chat casually in under 15 words. No emojis. Be messy, use lowercase. Reply with ONLY your message.',
};

/* ===== UTILITIES ===== */
function shuffleArray(arr) {
    const r = [...arr];
    for (let i = r.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
}

function cleanAIOutput(text, persona) {
    let c = text.replace(/<think>[\s\S]*?<\/think>/g, '');
    c = c.replace(/\*[^*]*\*/g, '');
    c = c.replace(/^["'\s]+|["'\s]+$/g, '');
    c = c.replace(/[\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu, '');
    c = c.split('\n')[0].trim();
    const words = c.split(/\s+/).filter(w => w.length > 0);
    if (words.length > 15) c = words.slice(0, 15).join(' ');
    c = c.trim();
    console.log('[AI cleaned]', JSON.stringify(c), 'from', JSON.stringify(text.slice(0, 200)));
    return c || '[empty response]';
}

function parseVote(text, candidates) {
    const c = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    for (const name of candidates) {
        if (c.includes(name)) return name;
    }
    for (const name of candidates) {
        if (c.toLowerCase().includes(name.toLowerCase())) return name;
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
}

/* ===== LLM MESSAGE GENERATION (streaming with t/s tracking) ===== */
async function generateAIMessage(wllama, aiId, context, onStream) {
    const { persona, recentMessages, nameMap, messagesSent } = context;
    if (!wllama) return { text: '[LLM not loaded]', tps: '0', timeStr: '00m00s', tokenCount: 0 };

    const myName = nameMap[aiId] || 'Player';
    const history = recentMessages
        .filter(m => !m.isSystem).slice(-4)
        .map(m => (nameMap[m.senderId] || '?') + ': ' + m.text)
        .join('\n');
    const userContent = history
        ? history + '\n' + myName + ':'
        : myName + ' says something casual to start the chat:';

    if (onStream) onStream({ text: '(generating...)', tps: '0', timeStr: '00m00s', tokenCount: 0, thinkText: '', done: false });

    const t0 = performance.now();
    try {
        const result = await wllama.createChatCompletion({
            messages: [
                { role: 'system', content: persona.systemPrompt },
                { role: 'user', content: userContent },
            ],
            nPredict: 64,
            cache_prompt: true,
            seed: Math.floor(Math.random() * 999999),
            sampling: { temp: 1.0, top_p: 0.95, top_k: 64 },
        });

        const elapsed = (performance.now() - t0) / 1000;
        if (!result || !result.choices) {
            console.error('[AI] null response from wllama');
            const fallback = { text: '[no response]', tps: '0', timeStr: '00m00s', tokenCount: 0, thinkText: '' };
            if (onStream) onStream({ ...fallback, done: true });
            return fallback;
        }
        const raw = result.choices[0]?.message?.content || '';
        console.log('[AI raw]', JSON.stringify(raw.slice(0, 500)));
        if (!raw.trim()) console.warn('[AI] EMPTY raw output - model generated nothing');

        const thinkMatch = raw.match(/<think>([\s\S]*?)<\/think>/);
        const thinkText = thinkMatch ? thinkMatch[1].trim() : '';
        const cleaned = cleanAIOutput(raw, persona);

        const usage = result.usage || {};
        const tokenCount = (usage.completion_tokens || 0) || Math.max(1, Math.ceil(raw.length / 4));
        const tps = elapsed > 0 ? (tokenCount / elapsed).toFixed(1) : '0';
        const mins = Math.floor(elapsed / 60);
        const secs = Math.floor(elapsed % 60);
        const timeStr = `${String(mins).padStart(2,'0')}m${String(secs).padStart(2,'0')}s`;

        if (onStream) onStream({ text: cleaned, tps, timeStr, tokenCount, thinkText, done: true });
        return { text: cleaned, tps, timeStr, tokenCount, thinkText };
    } catch (e) {
        console.error('LLM inference error:', e);
        return { text: '[inference failed]', tps: '0', timeStr: '00m00s', tokenCount: 0 };
    }
}

/* ===== LLM VOTE GENERATION ===== */
function parseBatchVotes(text, voteSpecs) {
    const clean = text
        .replace(/<think>[\s\S]*?<\/think>/g, '')
        .replace(/```(?:json)?/gi, '')
        .replace(/```/g, '')
        .trim();
    const jsonText = (clean.match(/\[[\s\S]*\]/) || [clean])[0];
    let parsed = null;
    try { parsed = JSON.parse(jsonText); } catch (e) { parsed = null; }

    const votesByVoter = new Map();
    if (Array.isArray(parsed)) {
        parsed.forEach((item, idx) => {
            if (!item || typeof item !== 'object') return;
            const voterText = String(item.voter || item.voterAlias || item.voter_alias || '').trim();
            const spec = voteSpecs.find(v => voterText === v.voterAlias || voterText === v.voterId) || voteSpecs[idx];
            if (!spec || votesByVoter.has(spec.voterId)) return;
            const voteText = String(item.vote || item.votedFor || item.voted_for || item.votedForAlias || item.suspect || item.choice || '').trim();
            votesByVoter.set(spec.voterId, parseVote(voteText, spec.candidates));
        });
    } else {
        const lines = clean.split('\n');
        voteSpecs.forEach(spec => {
            const line = lines.find(l => l.includes(spec.voterAlias)) || clean;
            votesByVoter.set(spec.voterId, parseVote(line, spec.candidates));
        });
    }

    return voteSpecs.map(spec => ({
        voterId: spec.voterId,
        voterAlias: spec.voterAlias,
        votedForAlias: votesByVoter.get(spec.voterId)
            || spec.candidates[Math.floor(Math.random() * spec.candidates.length)],
    }));
}

async function generateAIVotes(wllama, aiPlayers, context) {
    const { recentMessages, nameMap, allPlayers } = context;
    const voteSpecs = aiPlayers.map(ai => ({
        voterId: ai.id,
        voterAlias: nameMap[ai.id],
        candidates: allPlayers.filter(p => p.id !== ai.id).map(p => nameMap[p.id]),
    }));

    if (wllama) {
        try {
            const history = recentMessages
                .filter(m => !m.isSystem)
                .map(m => (nameMap[m.senderId] || '?') + ': ' + m.text)
                .join('\n');
            const voterLines = voteSpecs
                .map(v => v.voterAlias + ' may vote for: ' + v.candidates.join(', '))
                .join('\n');

            const result = await wllama.createChatCompletion({
                messages: [
                    { role: 'system', content: 'Pick which player each AI voter thinks is most likely a robot. Respond with ONLY a JSON array.' },
                    { role: 'user', content: 'Chat:\n' + history + '\n\nFor each voter below, choose exactly one candidate from that voter list.\n' + voterLines + '\n\nReturn exactly this shape: [{"voter":"Name","vote":"Name"}]' },
                ],
                nPredict: 128,
                // wllama v3.1.1 completion cache field is ambiguous; try both llama.cpp and wrapper spellings.
                cache_prompt: true,
                useCache: true,
                sampling: { temp: 0.5, top_k: 20 },
            });
            const raw = result.choices[0]?.message?.content || '';
            return parseBatchVotes(raw, voteSpecs);
        } catch (e) {
            console.error('Batch vote inference failed, using fallback:', e);
        }
    }
    return voteSpecs.map(spec => ({
        voterId: spec.voterId,
        voterAlias: spec.voterAlias,
        votedForAlias: spec.candidates[Math.floor(Math.random() * spec.candidates.length)],
    }));
}

/* ===== MAIN GAME COMPONENT ===== */
function AIImposterGame() {
    const [phase, setPhase] = useState(WllamaClass ? PHASES.LOADING : PHASES.LOBBY);
    const [timer, setTimer] = useState(0);
    const [messages, setMessages] = useState([]);
    const [humanMsgCount, setHumanMsgCount] = useState(0);
    const [setup, setSetup] = useState(null);
    const [result, setResult] = useState(null);
    const [stats, setStats] = useState({ wins: 0, losses: 0 });
    const [openThinks, setOpenThinks] = useState(new Set());
    const toggleThink = useCallback((msgId) => {
        setOpenThinks(prev => {
            const next = new Set(prev);
            if (next.has(msgId)) next.delete(msgId); else next.add(msgId);
            return next;
        });
    }, []);
    const [loadPct, setLoadPct] = useState(0);
    const [loadError, setLoadError] = useState(null);
    const [loadElapsed, setLoadElapsed] = useState(0);

    const chatRef = useRef(null);
    const inputRef = useRef(null);
    const phaseRef = useRef(WllamaClass ? PHASES.LOADING : PHASES.LOBBY);
    const messagesRef = useRef([]);
    const setupRef = useRef(null);
    const roundEndRef = useRef(0);
    const aiStatesRef = useRef([]);
    const votesRef = useRef([]);
    const announcedVotesRef = useRef(0);
    const humanMsgCountRef = useRef(0);
    const votingStartRef = useRef(0);
    const roundDoneRef = useRef(false);
    const votingDoneRef = useRef(false);
    const wllamaRef = useRef(null);

    const updatePhase = useCallback((p) => { phaseRef.current = p; setPhase(p); }, []);
    const addMessage = useCallback((msg) => {
        setMessages(prev => [...prev, msg]);
    }, []);
    /* Keep messagesRef in sync when streaming updates setMessages directly */
    useEffect(() => { messagesRef.current = messages; }, [messages]);
    const fmtTime = useCallback((s) => Math.floor(s/60) + ':' + (s%60).toString().padStart(2,'0'), []);
    const avUrl = useCallback((a) => 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=' + encodeURIComponent(a||'x'), []);

    /* ---- Model Loading ---- */
    useEffect(() => {
        if (!WllamaClass || phaseRef.current !== PHASES.LOADING) return;
        let cancelled = false;
        const t0 = Date.now();
        const elapsedId = setInterval(() => {
            if (!cancelled) setLoadElapsed(Math.floor((Date.now() - t0) / 1000));
        }, 1000);

        (async () => {
            try {
                const w = new WllamaClass(WasmPaths);
                await w.loadModelFromHF(
                    { repo: HF_REPO, file: HF_FILE },
                    {
                        n_ctx: 2048,
                        flash_attn: true,
                        swa_full: true,
                        offload_kqv: true,
                        n_batch: 2048,
                        // TODO: n_ubatch not forwarded by wllama v3.1.1 JS wrapper yet; set to 512 when supported
                        progressCallback: ({ loaded, total }) => {
                            if (!cancelled && total > 0) setLoadPct(Math.round(loaded / total * 100));
                        },
                    },
                );
                if (!cancelled) {
                    wllamaRef.current = w;
                    /* Skip lobby, auto-start game on load */
                    setTimeout(() => { if (!cancelled) startGameRef.current(); }, 100);
                }
            } catch (e) {
                console.error('Model load failed:', e);
                if (!cancelled) setLoadError(String(e.message || e));
            }
        })();
        return () => { cancelled = true; clearInterval(elapsedId); };
    }, [updatePhase]);

    /* Auto-scroll */
    useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [messages]);
    /* Auto-focus */
    useEffect(() => { if (phase === PHASES.ROUND && inputRef.current) inputRef.current.focus(); }, [phase]);

    /* ---- Start Game ---- */
    const startGame = useCallback(() => {
        const humanId = 'human';
        const aiConfigs = [
            { id: 'ai-1', persona: AI_PERSONA },
            { id: 'ai-2', persona: AI_PERSONA },
            { id: 'ai-3', persona: AI_PERSONA },
        ];
        const allIds = shuffleArray([humanId, ...aiConfigs.map(a => a.id)]);
        const aliases = shuffleArray(ANONYMOUS_NAMES).slice(0, 4);
        const nameMap = {};
        allIds.forEach((id, i) => { nameMap[id] = aliases[i]; });
        const gs = {
            humanId, humanAlias: nameMap[humanId],
            ais: aiConfigs.map(a => ({ ...a, alias: nameMap[a.id] })),
            allPlayers: allIds.map(id => ({ id, alias: nameMap[id], isHuman: id === humanId })),
            nameMap,
        };
        setSetup(gs); setupRef.current = gs;
        messagesRef.current = [{
            id: 'sys-start', isSystem: true, timestamp: Date.now(),
            text: 'Round started! Chat naturally and try to blend in. Send at least ' + MIN_MESSAGES + ' messages.',
        }];
        setMessages([...messagesRef.current]);
        setHumanMsgCount(0); humanMsgCountRef.current = 0;
        votesRef.current = []; announcedVotesRef.current = 0;
        setResult(null); roundDoneRef.current = false; votingDoneRef.current = false;
        roundEndRef.current = Date.now() + ROUND_DURATION * 1000;
        setTimer(ROUND_DURATION);
        aiStatesRef.current = aiConfigs.map(a => ({
            id: a.id, persona: a.persona, messagesSent: 0,
            totalMessages: 3 + Math.floor(Math.random() * 2),
            nextMessageTime: Date.now() + 5000 + Math.random() * 10000,
            isSending: false,
        }));
        updatePhase(PHASES.ROUND);
    }, [updatePhase]);
    const startGameRef = useRef(startGame);
    useEffect(() => { startGameRef.current = startGame; }, [startGame]);

    /* LLM required -- no mock mode */

    /* ---- Send Human Message ---- */
    const sendMessage = useCallback((text) => {
        if (!text.trim() || phaseRef.current !== PHASES.ROUND) return;
        humanMsgCountRef.current++;
        setHumanMsgCount(humanMsgCountRef.current);
        addMessage({ id: 'human-' + Date.now(), senderId: 'human',
            text: text.trim(), timestamp: Date.now(), isSystem: false });
        if (inputRef.current) inputRef.current.value = '';
    }, [addMessage]);

    const handleKeyDown = useCallback((e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(e.target.value); }
    }, [sendMessage]);

    /* ---- Show Results ---- */
    const showResults = useCallback(() => {
        const s = setupRef.current; const v = votesRef.current;
        const hv = v.filter(x => x.votedForId === s.humanId).length;
        const caught = hv >= 2; const gr = caught ? 'lose' : 'win';
        setResult(gr);
        setStats(prev => ({ wins: prev.wins + (gr==='win'?1:0), losses: prev.losses + (gr==='lose'?1:0) }));
        let t = caught ? 'YOU WERE CAUGHT!\nThe AIs identified you as the human impostor.\n'
                       : 'YOU SURVIVED!\nThe AIs failed to identify you as the human.\n';
        t += '\nVote Breakdown:\n';
        const counts = {};
        v.forEach(x => { counts[x.votedForId] = (counts[x.votedForId]||0) + 1; });
        Object.entries(counts).forEach(([pid,c]) => {
            t += '  ' + s.nameMap[pid] + ': ' + c + ' vote' + (c!==1?'s':'') + '\n'; });
        t += '\nTrue Identities:\n';
        s.allPlayers.forEach(p => {
            if (p.isHuman) { t += '  ' + s.nameMap[p.id] + ': YOU (Human)\n'; }
            else { const ai = s.ais.find(a => a.id === p.id);
                t += '  ' + s.nameMap[p.id] + ': AI\n'; }
        });
        addMessage({ id: 'sys-results', isSystem: true, isResult: true,
            gameResult: gr, text: t, timestamp: Date.now() });
        updatePhase(PHASES.RESULTS);
    }, [addMessage, updatePhase]);

    /* ---- Timer display (independent, never blocks) ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND && phase !== PHASES.VOTING) return;
        const id = setInterval(() => {
            setTimer(Math.max(0, Math.ceil((roundEndRef.current - Date.now()) / 1000)));
        }, 250);
        return () => clearInterval(id);
    }, [phase]);

    /* ---- Round end detection ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND) return;
        const id = setInterval(() => {
            if (Date.now() >= roundEndRef.current && !roundDoneRef.current) {
                roundDoneRef.current = true;
                const met = humanMsgCountRef.current >= MIN_MESSAGES;
                addMessage({ id: 'sys-analyze', isSystem: true, timestamp: Date.now(),
                    text: met ? 'Time is up! The AIs are analyzing the conversation...'
                        : 'Time is up! You only sent ' + humanMsgCountRef.current + ' messages (minimum ' + MIN_MESSAGES + '). The AIs are very suspicious...' });
                updatePhase(PHASES.ANALYZING);
            }
        }, 500);
        return () => clearInterval(id);
    }, [phase, addMessage, updatePhase]);

    /* ---- AI message generation (async, non-blocking) ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND) return;
        const busy = { current: false };
        const id = setInterval(async () => {
            if (busy.current || phaseRef.current !== PHASES.ROUND || !wllamaRef.current) return;
            const now = Date.now();
            for (const ai of aiStatesRef.current) {
                if (now >= ai.nextMessageTime && ai.messagesSent < ai.totalMessages && !ai.isSending) {
                    busy.current = true; ai.isSending = true;
                    try {
                        const msgId = ai.id+'-'+ai.messagesSent+'-'+now;
                        const result = await generateAIMessage(wllamaRef.current, ai.id, {
                            persona: ai.persona, recentMessages: messagesRef.current,
                            nameMap: setupRef.current.nameMap, messagesSent: ai.messagesSent,
                        }, (streamData) => {
                            /* Update or create the streaming message in-place */
                            if (phaseRef.current === PHASES.ROUND) {
                                setMessages(prev => {
                                    const exists = prev.some(m => m.id === msgId);
                                    if (!exists) {
                                        return [...prev, { id: msgId, senderId: ai.id, text: streamData.text || '(thinking...)', timestamp: Date.now(), isSystem: false, streaming: !streamData.done, tps: streamData.tps, genTime: streamData.timeStr, thinkText: streamData.thinkText || '' }];
                                    }
                                    return prev.map(m => m.id === msgId
                                        ? { ...m, text: streamData.done ? streamData.text : (streamData.text || '(thinking...)'), tps: streamData.tps, genTime: streamData.timeStr, thinkText: streamData.thinkText || '', streaming: !streamData.done }
                                        : m);
                                });
                            }
                        });
                        if (phaseRef.current === PHASES.ROUND) {
                            const finalText = typeof result === 'object' ? result.text : result;
                            if (finalText === '[LLM not loaded]' || finalText === '[inference failed]') {
                                setMessages(prev => prev.filter(m => m.id !== msgId));
                                break;
                            }
                            ai.messagesSent++;
                            const tl = roundEndRef.current - Date.now();
                            const ml = ai.totalMessages - ai.messagesSent;
                            if (ml > 0 && tl > 5000) {
                                const base = tl / (ml + 1);
                                ai.nextMessageTime = Date.now() + Math.max(5000, base + (Math.random()-0.5)*base*0.4);
                            }
                        }
                    } catch (e) { console.error('AI msg err:', e); }
                    finally { ai.isSending = false; busy.current = false; }
                    break;
                }
            }
        }, 2000);
        return () => clearInterval(id);
    }, [phase, addMessage]);

    /* ---- Analyzing phase: generate all AI votes ---- */
    useEffect(() => {
        if (phase !== PHASES.ANALYZING) return;
        let cancelled = false;
        (async () => {
            const s = setupRef.current;
            const w = wllamaRef.current;
            const aiVotes = await generateAIVotes(w, s.ais, {
                recentMessages: messagesRef.current,
                nameMap: s.nameMap, allPlayers: s.allPlayers,
            });
            if (cancelled) return;
            const allVotes = aiVotes.map(vote => {
                const votedPlayer = s.allPlayers.find(p => s.nameMap[p.id] === vote.votedForAlias);
                const fallbackCandidates = s.allPlayers.filter(p => p.id !== vote.voterId);
                const votedForId = votedPlayer ? votedPlayer.id
                    : fallbackCandidates[Math.floor(Math.random() * fallbackCandidates.length)].id;
                return {
                    voterId: vote.voterId, voterAlias: vote.voterAlias,
                    votedForId, votedForAlias: s.nameMap[votedForId],
                };
            });
            votesRef.current = allVotes;
            announcedVotesRef.current = 0;
            votingStartRef.current = Date.now();
            roundEndRef.current = Date.now() + VOTING_DURATION * 1000;
            setTimer(VOTING_DURATION);
            updatePhase(PHASES.VOTING);
        })();
        return () => { cancelled = true; };
    }, [phase, updatePhase]);

    /* ---- Vote reveal during VOTING ---- */
    useEffect(() => {
        if (phase !== PHASES.VOTING) return;
        const id = setInterval(() => {
            const now = Date.now();
            const elapsed = (now - votingStartRef.current) / 1000;
            const revealAt = [3, 7, 11];
            let should = 0;
            for (const t of revealAt) { if (elapsed >= t) should++; }
            if (should > announcedVotesRef.current && announcedVotesRef.current < votesRef.current.length) {
                for (let i = announcedVotesRef.current; i < should && i < votesRef.current.length; i++) {
                    const v = votesRef.current[i];
                    addMessage({ id: 'vote-'+i, isSystem: true, isVoteReveal: true, timestamp: Date.now(),
                        text: v.voterAlias + ' suspects "' + v.votedForAlias + '" is the impostor' });
                }
                announcedVotesRef.current = should;
            }
            const remaining = Math.max(0, Math.ceil((roundEndRef.current - now) / 1000));
            if (remaining <= 0 && !votingDoneRef.current) {
                votingDoneRef.current = true;
                for (let i = announcedVotesRef.current; i < votesRef.current.length; i++) {
                    const v = votesRef.current[i];
                    addMessage({ id: 'vote-'+i, isSystem: true, isVoteReveal: true, timestamp: Date.now(),
                        text: v.voterAlias + ' suspects "' + v.votedForAlias + '" is the impostor' });
                }
                setTimeout(() => showResults(), 1500);
            }
        }, 500);
        return () => clearInterval(id);
    }, [phase, addMessage, showResults]);

    /* No skip -- LLM is required */

    /* ---- Render ---- */
    const counterText = humanMsgCount < MIN_MESSAGES
        ? 'Messages: ' + humanMsgCount + '/3+ (' + MIN_MESSAGES + ' minimum required)'
        : 'Messages: ' + humanMsgCount + '/3+ (minimum met)';

    /* LOADING SCREEN */
    if (phase === PHASES.LOADING) {
        const loadedMB = (loadPct / 100 * 1400).toFixed(0);
        return html`
            <div className="loading-screen">
                <div className="loading-title">AI Imposter</div>
                <div className="loading-subtitle">Single-player Turing test game</div>
                <div className="loading-status">Loading LLM [${HF_FILE}]... ${loadPct}%</div>
                <div className="progress-bar">
                    <div className="progress-fill" style=${{ width: loadPct + '%' }} />
                </div>
                <div className="loading-detail">${loadedMB} / ~1400 MB${loadElapsed > 0 ? ' -- ' + loadElapsed + 's elapsed' : ''}</div>
                <div className="loading-hint">First load downloads ~1.4 GB model. Cached for future games.</div>
                ${loadError && html`
                    <div className="loading-error">Load failed: ${loadError}</div>
                `}
            </div>
            <footer className="info-footer">Downloading ${HF_FILE} for in-browser AI inference</footer>
        `;
    }

    const footerText = phase === PHASES.LOBBY
        ? 'Chat with AI players and try to blend in. The AIs will vote on who they think is the impostor.'
        : phase === PHASES.ROUND ? 'Round in progress'
        : phase === PHASES.ANALYZING ? 'The AIs are analyzing the conversation...'
        : phase === PHASES.VOTING ? 'The AIs are deliberating on who is the impostor...'
        : result === 'win' ? 'You survived! The AIs could not identify you.'
        : 'You were caught! The AIs identified you as the human.';

    const headerTitle = phase === PHASES.ROUND ? 'Round in Progress'
        : phase === PHASES.ANALYZING ? 'AIs Analyzing...'
        : phase === PHASES.VOTING ? 'AI Deliberation'
        : 'Round Over';

    return html`
        <div className="game-container">
            <div className="left-panel">
                <div className="lobby-section">
                    <div className="lobby-header">
                        <h1 className="game-title">AI Imposter</h1>
                        ${(phase === PHASES.ROUND || phase === PHASES.VOTING) && html`<div className="timer big">${fmtTime(timer)}</div>`}
                        ${phase === PHASES.ANALYZING && html`<div className="timer big">...</div>`}
                    </div>
                    ${phase === PHASES.LOBBY && html`
                        <div className="lobby-info">
                            <p>You are the only human in a room of AIs.</p>
                            <p>Chat naturally for 90 seconds. 3 AI players will try to figure out who is human.</p>
                            <p>At the end, they vote. If 2+ AIs identify you, you lose.</p>
                        </div>
                        <button className="ready-button start-button" onClick=${startGame}>Start Game</button>
                    `}
                    ${phase !== PHASES.LOBBY && setup && html`
                        <div className="players-list">
                            <div className="players-title">Players (4)</div>
                            ${setup.allPlayers.map(p => html`
                                <div key=${p.id} className="player-item">
                                    <img src=${avUrl(p.alias)} alt="" className="player-avatar" />
                                    <span>
                                        ${p.alias}
                                        ${p.id === setup.humanId && html`<span className="you-tag"> (You)</span>`}
                                        ${phase === PHASES.RESULTS && !p.isHuman && html`<span className="ai-tag">AI</span>`}
                                    </span>
                                    <span className=${'player-status ' + (
                                        phase === PHASES.RESULTS ? (p.isHuman ? 'human-status' : 'ai-status') : 'ready'
                                    )}>
                                        ${phase === PHASES.ROUND ? 'Chatting'
                                            : phase === PHASES.ANALYZING ? (p.isHuman ? 'Waiting' : 'Thinking')
                                            : phase === PHASES.VOTING ? (p.isHuman ? 'Awaiting' : 'Deliberating')
                                            : (p.isHuman ? 'Human' : 'AI')}
                                    </span>
                                </div>
                            `)}
                            ${phase === PHASES.ROUND && html`
                                <div className="your-alias-reminder">You are: <strong>${setup.humanAlias}</strong></div>
                            `}
                        </div>
                    `}
                </div>
                <div className="leaderboard">
                    <div className="leaderboard-title">Session Stats</div>
                    <div className="stats-row">
                        <span className="stat-win">Wins: ${stats.wins}</span>
                        <span className="stat-lose">Losses: ${stats.losses}</span>
                    </div>
                </div>
            </div>
            <div className="right-panel">
                <div className="chat-container">
                    <div className="chat-header">
                        ${phase === PHASES.LOBBY && html`<h2 className="chat-title lobby">Game Lobby</h2>`}
                        ${phase !== PHASES.LOBBY && html`
                            <div className="chat-header-info">
                                <h2 className="chat-title">
                                    ${phase === PHASES.ANALYZING && html`<span className="analyzing-spinner" />`}
                                    ${headerTitle}
                                </h2>
                                ${(phase === PHASES.ROUND || phase === PHASES.VOTING) && html`
                                    <div className="timer">${fmtTime(timer)}</div>
                                `}
                            </div>
                        `}
                    </div>
                    <div className="chat-messages" ref=${chatRef}>
                        ${phase === PHASES.LOBBY && html`
                            <div className="chat-disabled">
                                Ready to test your disguise? Press "Start Game" to begin chatting with 3 AI players.
                            </div>
                        `}
                        ${messages.map(msg => html`
                            <div key=${msg.id} className="message">
                                ${msg.isSystem ? html`
                                    <div className=${[
                                        'system-message',
                                        msg.isVoteReveal ? 'vote-reveal' : '',
                                        msg.isResult ? (msg.gameResult==='win' ? 'result-win' : 'result-lose') : '',
                                    ].filter(Boolean).join(' ')}>${msg.text}</div>
                                ` : html`
                                    <div>
                                        <div className="message-header">
                                            <img src=${avUrl(setup && setup.nameMap[msg.senderId])}
                                                 alt="" className="message-avatar" />
                                            <span className="message-username">
                                                ${setup ? setup.nameMap[msg.senderId] : 'Unknown'}
                                                ${msg.tps && msg.senderId !== 'human' ? html`<span className="gen-stats"> - ${msg.tps}t/s +${msg.genTime}</span>` : null}
                                                ${msg.thinkText && msg.thinkText.trim().length > 3 && msg.senderId !== 'human' ? html`<button className=${`think-toggle ${openThinks.has(msg.id) ? 'open' : ''}`} onClick=${() => toggleThink(msg.id)}>${'<think>'}</button>` : null}
                                                ${msg.streaming ? html`<span className="streaming-dot"> ...</span>` : null}
                                            </span>
                                        </div>
                                        <div className="message-text">${msg.text}</div>
                                        ${openThinks.has(msg.id) && msg.thinkText ? html`<div className="think-content">${msg.thinkText}</div>` : null}
                                    </div>
                                `}
                            </div>
                        `)}
                    </div>
                    ${phase === PHASES.ROUND && html`
                        <div className="chat-input-container">
                            <textarea ref=${inputRef} className="chat-input"
                                placeholder=${counterText + ' | You are: ' + (setup ? setup.humanAlias : '?') + ' | Chat naturally and blend in'}
                                onKeyDown=${handleKeyDown} maxLength=${150} />
                        </div>
                    `}
                    ${phase === PHASES.RESULTS && html`
                        <div className="chat-input-container result-actions">
                            <button className="ready-button start-button" onClick=${startGame}>Play Again</button>
                        </div>
                    `}
                </div>
            </div>
        </div>
        <footer className="info-footer">${footerText}</footer>
    `;
}

/* ===== ERROR BOUNDARY ===== */
class ErrorBoundary extends Component {
    constructor(props) { super(props); this.state = { hasError: false }; }
    static getDerivedStateFromError() { return { hasError: true }; }
    componentDidCatch(err, info) { console.error('ErrorBoundary:', err, info); }
    render() {
        if (this.state.hasError) {
            return html`<div style=${{ padding: 24, textAlign: 'center' }}>
                <h2>Something went wrong</h2>
                <button className="ready-button" style=${{ marginTop: 16 }}
                    onClick=${() => this.setState({ hasError: false })}>Try Again</button>
            </div>`;
        }
        return this.props.children;
    }
}

createRoot(document.getElementById('root')).render(
    html`<${ErrorBoundary}><${AIImposterGame} /></${ErrorBoundary}>`
);

    <!-- P5.js Matrix Green Hover Grid Effect -->
    <script>
(function initMatrixGrid() {
    if (!window.p5) return;
    if (window.__hoverGridInstance) { try { window.__hoverGridInstance.remove(); } catch(e){} }
    var C = { LAYER_MODE:'over', CELL_SIZE:40, STARTING_ALPHA:160, TRAIL_MAX_ALPHA:160,
        CURRENT_CELL_ALPHA:180, PROB_OF_NEIGHBOR:0.35, AMT_FADE_PER_FRAME:7,
        STROKE_WEIGHT:1, CURRENT_STROKE_WEIGHT:2, GLOBAL_OPACITY:0.22,
        MAX_TRAIL_CELLS:600, IDLE_MS:1500, FRAME_RATE:45,
        FADE_RATE_REDUCED_MULTIPLIER:2, PROB_OF_NEIGHBOR_REDUCED_MULTIPLIER:0.25 };
    var isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var mx=-1, my=-1, lastMoveAt=0, lastCell={i:-9999,j:-9999}, trail=new Map();
    var sketch = function(p) {
        var paused=false;
        var key=function(i,j){return i+','+j;};
        var addCell=function(i,j,ba,d){ba=ba||C.STARTING_ALPHA;d=d||0;var k=key(i,j);
            trail.set(k,{i:i,j:j,alpha:Math.min(ba,C.TRAIL_MAX_ALPHA),baseAlpha:ba,activationAt:performance.now()+d});
            if(trail.size>C.MAX_TRAIL_CELLS)trail.delete(trail.keys().next().value);};
        var neighbors=function(i,j){var a=[];for(var di=-1;di<=1;di++)for(var dj=-1;dj<=1;dj++){
            if(di===0&&dj===0)continue;a.push({i:i+di,j:j+dj});}return a;};
        p.setup=function(){var cnv=p.createCanvas(p.windowWidth,p.windowHeight);
            cnv.position(0,0);cnv.style('position','fixed');cnv.style('inset','0');
            cnv.style('z-index',C.LAYER_MODE==='over'?'0':'-1');cnv.style('pointer-events','none');
            cnv.style('opacity',String(C.GLOBAL_OPACITY));
            if(C.LAYER_MODE==='over')cnv.style('mix-blend-mode','screen');
            p.noFill();p.rectMode(p.CORNER);p.pixelDensity(1);p.frameRate(C.FRAME_RATE);};
        p.windowResized=function(){p.resizeCanvas(p.windowWidth,p.windowHeight);};
        document.addEventListener('visibilitychange',function(){paused=document.hidden;});
        var onPointer=function(x,y){mx=x;my=y;lastMoveAt=performance.now();};
        window.addEventListener('pointermove',function(e){onPointer(e.clientX,e.clientY);},{passive:true});
        window.addEventListener('touchmove',function(e){var t=e.touches&&e.touches[0];if(!t)return;onPointer(t.clientX,t.clientY);},{passive:true});
        p.draw=function(){if(paused)return;var now=performance.now();var idle=now-lastMoveAt>C.IDLE_MS;
            p.clear();p.strokeWeight(C.STROKE_WEIGHT);p.drawingContext.shadowBlur=6;
            p.drawingContext.shadowColor='rgba(0,255,65,0.15)';
            trail.forEach(function(cell,k){var fade=C.AMT_FADE_PER_FRAME*(isReduced?C.FADE_RATE_REDUCED_MULTIPLIER:1);
                cell.alpha=Math.max(0,cell.alpha-fade);if(cell.alpha<=0){trail.delete(k);return;}
