<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="color-scheme" content="dark">
    <title>AI Imposter</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #0a0a0a; color: #efeff1; height: 100vh; overflow: hidden;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    -webkit-text-size-adjust: 100%; touch-action: manipulation; }
.game-container { height: calc(100vh - 40px); }
.game-container { display: flex; gap: 1px; background: rgba(31,31,53,0.85); }
.left-panel { flex: 1; min-width: 280px; max-width: 400px; background: rgba(24,24,27,0.85);
    display: flex; flex-direction: column; }
.right-panel { flex: 2; background: rgba(14,14,16,0.85); display: flex; flex-direction: column; }
.lobby-section { padding: 10px 12px; border-bottom: 1px solid #2f2f35; }
.lobby-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 12px; }
.game-title { font-size: 18px; font-weight: 700; color: #fff; flex-grow: 1; }
.timer { font-size: 14px; color: #efeff1; font-weight: 600; background: rgba(255,255,255,0.06);
    padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.12); }
.timer.big { font-size: 18px; font-weight: 800; color: #fff; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18); padding: 6px 10px; border-radius: 6px; }
.ready-button { background: #00f5c4; color: #0f0f23; border: none; padding: 8px 16px;
    border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
    transition: all 0.2s; min-height: 44px; }
.ready-button:hover { background: #00d4a3; transform: translateY(-1px); }
.ready-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.start-button { width: 100%; font-size: 16px; padding: 14px; margin-bottom: 16px; }
.lobby-info { color: #adadb8; font-size: 14px; line-height: 1.6; margin-bottom: 16px;
    padding: 12px; background: rgba(47,47,53,0.3); border-radius: 6px; }
.lobby-info p { margin-bottom: 8px; }
.lobby-info p:last-child { margin-bottom: 0; }
.players-list { margin-bottom: 12px; }
.players-title { font-size: 14px; font-weight: 600; color: #adadb8; margin-bottom: 8px; }
.player-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 15px; }
.player-avatar { width: 24px; height: 24px; border-radius: 50%; background: #9147ff;
    border: 1px solid rgba(255,255,255,0.1); }
.player-status { margin-left: auto; font-size: 12px; padding: 2px 6px;
    border-radius: 12px; font-weight: 500; }
.player-status.ready { background: rgba(0,245,196,0.2); color: #00f5c4; }
.player-status.human-status { background: rgba(0,245,196,0.2); color: #00f5c4; }
.player-status.ai-status { background: rgba(235,4,0,0.2); color: #eb0400; }
.you-tag { color: #00f5c4; font-size: 12px; font-weight: 500; }
.ai-tag { color: #eb0400; font-size: 11px; margin-left: 4px;
    background: rgba(235,4,0,0.15); padding: 1px 5px; border-radius: 3px; }
.your-alias-reminder { font-size: 13px; color: #adadb8; padding: 8px 0 0;
    border-top: 1px solid #2f2f35; margin-top: 8px; }
.your-alias-reminder strong { color: #00f5c4; }
.leaderboard { flex: 1; padding: 16px; }
.leaderboard-title { font-size: 14px; font-weight: 600; color: #adadb8; margin-bottom: 12px; }
.stats-row { display: flex; gap: 16px; font-size: 14px; }
.stat-win { color: #00f5c4; font-weight: 500; }
.stat-lose { color: #eb0400; font-weight: 500; }
.chat-container { display: flex; flex-direction: column; height: 100%; }
.chat-header { padding: 8px 12px; border-bottom: 1px solid #1f1f23; background: #18181b; }
.chat-header-info { display: flex; justify-content: space-between; align-items: center; }
.chat-title { font-size: 16px; font-weight: 600; color: #fff; margin-right: 16px; }
.chat-title.lobby { font-size: 14px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex;
    flex-direction: column; gap: 6px; }
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: #1f1f23; }
.chat-messages::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 3px; }
.message { display: flex; flex-direction: column; gap: 2px; }
.message-header { display: flex; align-items: center; gap: 6px; }
.message-avatar { width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1); }
.message-username { font-weight: 600; font-size: 15px; color: #9147ff; }
.gen-stats { font-weight: 400; font-size: 12px; color: #adadb8; margin-left: 4px; }
.streaming-dot { color: #00f5c4; animation: blink 0.8s infinite; font-weight: 400; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.think-toggle { font-size: 11px; color: #6b6b7b; cursor: pointer; margin-left: 4px;
    background: rgba(107,107,123,0.15); padding: 1px 5px; border-radius: 3px;
    user-select: none; transition: color 0.2s, background 0.2s; border: none; font-family: inherit; }
.think-toggle:hover { color: #adadb8; background: rgba(107,107,123,0.3); }
.think-toggle.open { color: #9147ff; background: rgba(145,71,255,0.15); }
.think-content { margin-left: 28px; margin-top: 4px; padding: 8px 10px; font-size: 12px;
    line-height: 1.5; color: #6b6b7b; background: rgba(47,47,53,0.4); border-radius: 4px;
    border-left: 2px solid #3a3a4a; white-space: pre-wrap; word-wrap: break-word;
    max-height: 200px; overflow-y: auto; animation: thinkReveal 0.2s ease-out; }
.think-content::-webkit-scrollbar { width: 4px; }
.think-content::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 2px; }
@keyframes thinkReveal { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 200px; } }
.message-text { font-size: 17px; line-height: 1.4; color: #efeff1;
    margin-left: 28px; word-wrap: break-word; }
.system-message { text-align: center; color: #adadb8; font-style: italic; font-size: 13px;
    background: rgba(47,47,53,0.5); padding: 8px 12px; border-radius: 6px;
    margin: 8px 0; white-space: pre-wrap; }
.system-message.vote-reveal { animation: voteSlideIn 0.5s ease-out;
    border-left: 3px solid #9147ff; text-align: left; font-style: normal; font-weight: 500; }
@keyframes voteSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); } }
.system-message.result-win { background: rgba(0,245,196,0.1);
    border: 1px solid rgba(0,245,196,0.3); color: #00f5c4;
    font-weight: 600; font-style: normal; text-align: left; padding: 16px; }
.system-message.result-lose { background: rgba(235,4,0,0.1);
    border: 1px solid rgba(235,4,0,0.3); color: #eb0400;
    font-weight: 600; font-style: normal; text-align: left; padding: 16px; }
.chat-disabled { text-align: center; color: #adadb8; font-size: 13px; padding: 20px;
    background: rgba(47,47,53,0.3); border-radius: 6px; margin: 20px; }
.chat-input-container { padding: 8px 12px; border-top: 1px solid #1f1f23; background: #18181b;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.chat-input { width: 100%; background: #0e0e10; border: 1px solid #2f2f35; border-radius: 6px;
    padding: 10px 12px; color: #efeff1; font-size: 14px; resize: none;
    min-height: 48px; max-height: 80px; }
.chat-input:focus { outline: none; border-color: #9147ff; }
.chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-input.urgent::placeholder { color: #eb0400; font-weight: 600; }
.result-actions { text-align: center; }
.info-footer { position: fixed; left: 0; right: 0; bottom: 0; background: #111116;
    border-top: 1px solid #2f2f35; color: #efeff1; z-index: 1001;
    padding: 10px 12px; text-align: center; font-size: 12px; line-height: 1.2;
    backdrop-filter: saturate(120%) blur(6px); -webkit-backdrop-filter: saturate(120%) blur(6px); }
/* Loading screen */
.loading-screen { display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; padding: 24px; text-align: center; }
.loading-title { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 8px; }
.loading-subtitle { font-size: 15px; color: #adadb8; margin-bottom: 32px; }
.loading-status { font-size: 16px; color: #efeff1; margin-bottom: 12px; font-weight: 600; }
.loading-detail { font-size: 13px; color: #666; margin-bottom: 16px; }
.progress-bar { width: 320px; max-width: 80%; height: 8px; background: #1f1f23;
    border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
.progress-fill { height: 100%; background: #00f5c4; border-radius: 4px;
    transition: width 0.3s ease; }
.loading-hint { font-size: 12px; color: #555; margin-top: 8px; }
.loading-error { color: #eb0400; font-size: 14px; margin-top: 16px; max-width: 400px; }
/* Analyzing spinner */
.analyzing-spinner { display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(145,71,255,0.3); border-top: 2px solid #9147ff;
    border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px;
    vertical-align: middle; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .game-container { flex-direction: column; gap: 0; }

    .lobby-section { padding: 12px; }
    .leaderboard { padding: 12px; }
    .chat-messages { padding: 6px 10px; gap: 8px; }
    .chat-input-container { padding: 12px; }
    .chat-input { min-height: 52px; font-size: 18px; }
    .info-footer { font-size: 14px; padding: 14px 16px; }
    .game-title { font-size: 20px; }
    .timer.big { font-size: 22px; padding: 8px 14px; }
    .message-text { font-size: 20px; line-height: 1.4; margin-left: 34px; }
    .message-username { font-size: 17px; }
    .message-avatar { width: 28px; height: 28px; }
    .message-header { gap: 10px; }
    .gen-stats { font-size: 12px; }
    .think-toggle { font-size: 12px; padding: 2px 6px; }
    .think-content { font-size: 14px; margin-left: 36px; }
    .system-message { font-size: 15px; padding: 12px 16px; }
    .player-item { font-size: 16px; padding: 8px 0; }
    .player-avatar { width: 28px; height: 28px; }
    .players-title { font-size: 16px; }
    .chat-title { font-size: 18px; }
    .timer { font-size: 16px; }
    .ready-button { font-size: 16px; padding: 14px 20px; min-height: 50px; }
    .start-button { font-size: 18px; padding: 16px; }
    .your-alias-reminder { font-size: 15px; }
    .stats-row { font-size: 16px; }
    .leaderboard-title { font-size: 16px; }
    .loading-title { font-size: 28px; }
    .loading-status { font-size: 18px; }
    .loading-subtitle { font-size: 16px; } }
@media (max-width: 480px) {
    .message-text { font-size: 16px; }
    .left-panel { max-height: 30vh; } }
@media (pointer: coarse) { .ready-button { padding: 14px 20px; }
    .chat-input { font-size: 18px; } }

/* ===== UTILITIES ===== */
function shuffleArray(arr) {
    const r = [...arr];
    for (let i = r.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
}

function cleanAIOutput(text, persona) {
    let c = text.replace(/<think>[\s\S]*?<\/think>/g, '');
    c = c.replace(/\*[^*]*\*/g, '');
    c = c.replace(/^["'\s]+|["'\s]+$/g, '');
    c = c.replace(/[\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu, '');
    c = c.split('\n')[0].trim();
    const words = c.split(/\s+/).filter(w => w.length > 0);
    if (words.length > 15) c = words.slice(0, 15).join(' ');
    c = c.trim();
    console.log('[AI cleaned]', JSON.stringify(c), 'from', JSON.stringify(text.slice(0, 200)));
    return c || '[empty response]';
}

function parseVote(text, candidates) {
    const c = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    for (const name of candidates) {
        if (c.includes(name)) return name;
    }
    for (const name of candidates) {
        if (c.toLowerCase().includes(name.toLowerCase())) return name;
    }
    return null;
}

const wllamaInferenceLocks = new WeakMap();

function waitForWllamaGpuSettle() {
    return new Promise(resolve => {
        const finish = () => setTimeout(resolve, 0);
        if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(() => requestAnimationFrame(finish));
        } else {
            finish();
        }
    });
}

async function runWllamaInference(wllama, task) {
    const previous = wllamaInferenceLocks.get(wllama) || Promise.resolve();
    let releaseLock;
    const lock = new Promise(resolve => { releaseLock = resolve; });
    const queued = previous.catch(() => {}).then(() => lock);
    wllamaInferenceLocks.set(wllama, queued);

    await previous.catch(() => {});
    try {
        return await task();
    } finally {
        await waitForWllamaGpuSettle();
        releaseLock();
        if (wllamaInferenceLocks.get(wllama) === queued) {
            wllamaInferenceLocks.delete(wllama);
        }
    }
}

/* ===== LLM MESSAGE GENERATION (streaming with t/s tracking) ===== */
async function generateAIMessage(wllama, aiId, context, onStream) {
    const { persona, recentMessages, nameMap, messagesSent } = context;
    if (!wllama) return { text: '[LLM not loaded]', tps: '0', timeStr: '00m00s', tokenCount: 0 };

    const myName = nameMap[aiId] || 'Player';
    const history = recentMessages
        .filter(m => !m.isSystem).slice(-CHAT_HISTORY_MESSAGES)
        .map(m => (nameMap[m.senderId] || '?') + ': ' + m.text)
        .join('\n');
    const userContent = history
        ? 'Group chat transcript:\n' + history + '\n\nReply as ' + myName + ' with one short casual message:'
        : 'Group chat transcript is empty.\n\nReply as ' + myName + ' with one short casual message:';

    if (onStream) onStream({ text: '(generating...)', tps: '0', timeStr: '00m00s', tokenCount: 0, thinkText: '', done: false });

    const t0 = performance.now();
    try {
        const result = await runWllamaInference(wllama, () => wllama.createChatCompletion({
            messages: [
                { role: 'system', content: persona.systemPrompt },
                { role: 'user', content: userContent },
            ],
            max_tokens: CHAT_N_PREDICT,                 // was `nPredict` (not a real field — silently ignored)
            // Gemma-4 hybrid cache misses can force very slow full prompt re-processing.
            cache_prompt: false,                        // now actually honored in 3.4.0 (was ignored in 3.1.1)
            seed: Math.floor(Math.random() * 999999),
            // wllama 3.x sampling params are FLAT — the old `sampling:{...}` wrapper was dropped entirely,
            // so temp/top_p/etc. never applied until now. logit_bias is harmless while SLOP_BIAS is empty.
            temp: 1.0, top_p: 0.95, top_k: 64, min_p: 0.05,
            // ANTI-ECHO hyperparams: stop bots copying each other's lines verbatim (the "repetition = bots" tell).
            // penalty_last_n must span the transcript so the OTHER bots' messages are in the penalty window;
            // penalty_freq is the main lever (scales with repeat count). Raise freq to de-clone harder; lower if speech gets stilted.
            penalty_last_n: 256, penalty_repeat: 1.3, penalty_freq: 0.6, penalty_present: 0.4,
            logit_bias: SLOP_BIAS,
        }));

        const elapsed = (performance.now() - t0) / 1000;
        if (!result || !result.choices) {
            console.error('[AI] null response from wllama');
            const fallback = { text: '[no response]', tps: '0', timeStr: '00m00s', tokenCount: 0, thinkText: '' };
            if (onStream) onStream({ ...fallback, done: true });
            return fallback;
        }
        const raw = result.choices[0]?.message?.content || '';
        console.log('[AI raw]', JSON.stringify(raw.slice(0, 500)));
        if (!raw.trim()) console.warn('[AI] EMPTY raw output - model generated nothing');

        const thinkMatch = raw.match(/<think>([\s\S]*?)<\/think>/);
        const thinkText = thinkMatch ? thinkMatch[1].trim() : '';
        const cleaned = cleanAIOutput(raw, persona);

        const usage = result.usage || {};
        const tokenCount = (usage.completion_tokens || 0) || Math.max(1, Math.ceil(raw.length / 4));
        const tps = elapsed > 0 ? (tokenCount / elapsed).toFixed(1) : '0';
        const mins = Math.floor(elapsed / 60);
        const secs = Math.floor(elapsed % 60);
        const timeStr = `${String(mins).padStart(2,'0')}m${String(secs).padStart(2,'0')}s`;

        if (onStream) onStream({ text: cleaned, tps, timeStr, tokenCount, thinkText, done: true });
        return { text: cleaned, tps, timeStr, tokenCount, thinkText };
    } catch (e) {
        console.error('LLM inference error:', e);
        return { text: '[inference failed]', tps: '0', timeStr: '00m00s', tokenCount: 0 };
    }
}

/* ===== PLAYER STATS (pre-computed heuristics for vote prompt) ===== */
function computePlayerStats(messages, nameMap, allPlayers) {
    const stats = {};
    for (const p of allPlayers) {
        const pName = nameMap[p.id];
        const pMsgs = messages.filter(m => !m.isSystem && m.senderId === p.id);
        const wordCounts = pMsgs.map(m => m.text.split(/\s+/).filter(w => w.length > 0).length);
        const avgLen = wordCounts.length > 0
            ? (wordCounts.reduce((s, w) => s + w, 0) / wordCounts.length).toFixed(1) : '0';
        const lenVariance = wordCounts.length > 1
            ? (wordCounts.reduce((s, w) => s + Math.pow(w - parseFloat(avgLen), 2), 0) / wordCounts.length).toFixed(1) : '0';
        const times = pMsgs.map(m => m.timestamp).sort((a, b) => a - b);
        const gaps = [];
        for (let i = 1; i < times.length; i++) gaps.push((times[i] - times[i - 1]) / 1000);
        const avgGap = gaps.length > 0 ? (gaps.reduce((a, b) => a + b, 0) / gaps.length).toFixed(1) : 'N/A';
        const gapVariance = gaps.length > 1
            ? gaps.reduce((s, g) => s + Math.pow(g - parseFloat(avgGap), 2), 0) / gaps.length : 0;
        const allText = pMsgs.map(m => m.text).join(' ');
        const hasQuestion = pMsgs.some(m => m.text.includes('?'));
        const usesSlang = /\b(lol|lmao|bruh|ngl|tbh|idk|imo|fr|smh|omg|btw|rn)\b/i.test(allText);
        const usesPunctuation = /[.!,;:]/.test(allText);
        const usesCapitals = /[A-Z]/.test(allText);
        stats[pName] = {
            msgCount: pMsgs.length, avgWordLen: avgLen, lenVariance,
            avgGapSec: avgGap, gapVariance,
            hasQuestion, usesSlang, usesPunctuation, usesCapitals,
        };
    }
    return stats;
}

/* ===== LLM VOTE GENERATION ===== */
function parseBatchVotes(text, voteSpecs) {
    const clean = text
        .replace(/<think>[\s\S]*?<\/think>/g, '')
        .replace(/```(?:json)?/gi, '')
        .replace(/```/g, '')
        .trim();
    const jsonText = (clean.match(/\[[\s\S]*\]/) || [clean])[0];
    let parsed = null;
    try { parsed = JSON.parse(jsonText); } catch (e) { parsed = null; }

    const votesByVoter = new Map();
    if (Array.isArray(parsed)) {
        parsed.forEach((item, idx) => {
            if (!item || typeof item !== 'object') return;
            const voterText = String(item.voter || item.voterAlias || item.voter_alias || '').trim();
            const spec = voteSpecs.find(v => voterText === v.voterAlias || voterText === v.voterId) || voteSpecs[idx];
            if (!spec || votesByVoter.has(spec.voterId)) return;
            const voteText = String(item.vote || item.votedFor || item.voted_for || item.votedForAlias || item.suspect || item.choice || '').trim();
            votesByVoter.set(spec.voterId, parseVote(voteText, spec.candidates));
        });
    } else {
        const lines = clean.split('\n');
        voteSpecs.forEach(spec => {
            const line = lines.find(l => l.includes(spec.voterAlias)) || clean;
            votesByVoter.set(spec.voterId, parseVote(line, spec.candidates));
        });
    }

    const votes = voteSpecs.map(spec => ({
        voterId: spec.voterId,
        voterAlias: spec.voterAlias,
        votedForAlias: votesByVoter.get(spec.voterId),
    }));
    const missing = votes.filter(v => !v.votedForAlias).map(v => v.voterAlias);
    if (missing.length > 0) {
        throw new Error('Vote inference did not identify a valid candidate for: ' + missing.join(', '));
    }
    return votes;
}

// Deterministic fallback when the LLM won't emit clean vote JSON (it's under-baked at the vote task).
// Scores each candidate by human-ish signals from the pre-computed stats; each voter picks the top one.
function heuristicVotes(voteSpecs, playerStats) {
    const score = (name) => {
        const s = playerStats[name];
        if (!s) return 0;
        let sc = 0;
        if (s.usesCapitals) sc += 2;
        if (s.hasQuestion) sc += 2;
        if (!s.usesSlang) sc += 1;
        if (s.usesPunctuation) sc += 1;
        const w = parseFloat(s.avgWordLen);
        if (!isNaN(w) && (w < 2.5 || w > 11)) sc += 1;   // very short / very long reads human
        return sc;
    };
    return voteSpecs.map(spec => {
        let best = spec.candidates[0], bestScore = -1;
        for (const c of spec.candidates) {
            const sc = score(c);
            if (sc > bestScore) { bestScore = sc; best = c; }
        }
        return { voterId: spec.voterId, voterAlias: spec.voterAlias, votedForAlias: best };
    });
}

async function generateAIVotes(wllama, aiPlayers, context) {
    const { recentMessages, nameMap, allPlayers } = context;
    const playerStats = computePlayerStats(recentMessages, nameMap, allPlayers);
    console.log('[vote] Player stats:', JSON.stringify(playerStats));

    const voteSpecs = aiPlayers.map(ai => ({
        voterId: ai.id,
        voterAlias: nameMap[ai.id],
        candidates: allPlayers.filter(p => p.id !== ai.id).map(p => nameMap[p.id]),
    }));

    if (!wllama) throw new Error('Cannot generate AI votes before WLLAMA is loaded');

    const history = recentMessages
        .filter(m => !m.isSystem)
        .map(m => (nameMap[m.senderId] || '?') + ': ' + m.text)
        .join('\n');
    const statsBlock = Object.entries(playerStats)
        .map(([name, s]) => `${name}: ${s.msgCount} msgs, avg ${s.avgWordLen} words, timing gap ${s.avgGapSec}s, questions=${s.hasQuestion}, slang=${s.usesSlang}, punctuation=${s.usesPunctuation}, capitals=${s.usesCapitals}`)
        .join('\n');
    const voterLines = voteSpecs
        .map(v => v.voterAlias + ' picks from: ' + v.candidates.join(', '))
        .join('\n');

    const sysPrompt = `You are judging a chat game. 4 players chatted: 3 are AI bots, 1 is a real human. Find the HUMAN.
Humans tend to: type at irregular speeds, use slang/abbreviations, ask questions, vary message length, use punctuation and capitals, respond specifically to what others said.
AI bots tend to: respond at regular intervals, have consistent message length, give generic short replies, avoid questions and punctuation.
Respond with ONLY a JSON array.`;

    const userPrompt = `Chat log:
${history}

Player stats:
${statsBlock}

For each voter below, pick the ONE player they think is the HUMAN impostor.
${voterLines}

Return JSON: [{"voter":"Name","vote":"Name"}]`;

    // The model is under-baked at voting (few vote examples) so it often rambles instead of emitting JSON.
    // Retry with escalating temperature, then fall back to the stats heuristic so the round always finishes.
    // NOTE: no logit_bias on the vote — the slop ban can blank the JSON / force empty output here.
    const strictUser = userPrompt + '\n\nReply with ONLY the JSON array (begin your reply with "["). No analysis, no extra text.';
    const temps = [0.4, 0.6, 0.85];
    for (let attempt = 0; attempt < temps.length; attempt++) {
        try {
            const result = await runWllamaInference(wllama, () => wllama.createChatCompletion({
                messages: [
                    { role: 'system', content: sysPrompt },
                    { role: 'user', content: strictUser },
                ],
                max_tokens: 192,
                cache_prompt: false,
                seed: Math.floor(Math.random() * 999999),
                temp: temps[attempt], top_k: 40, top_p: 0.95, min_p: 0.05,
            }));
            const raw = result.choices[0]?.message?.content || '';
            console.log('[vote] Raw LLM output' + (attempt ? ' (retry ' + attempt + ')' : '') + ':', JSON.stringify(raw.slice(0, 500)));
            return parseBatchVotes(raw, voteSpecs);
        } catch (e) {
            console.warn('[vote] attempt ' + attempt + ' failed:', e.message);
        }
    }
    console.warn('[vote] LLM did not return valid JSON; using stats heuristic fallback');
    return heuristicVotes(voteSpecs, playerStats);
}

        const humanId = 'human';
        const aiConfigs = [
            { id: 'ai-1', persona: AI_PERSONA },
            { id: 'ai-2', persona: AI_PERSONA },
            { id: 'ai-3', persona: AI_PERSONA },
        ];
        const allIds = shuffleArray([humanId, ...aiConfigs.map(a => a.id)]);
        const aliases = shuffleArray(ANONYMOUS_NAMES).slice(0, 4);
        const nameMap = {};
        allIds.forEach((id, i) => { nameMap[id] = aliases[i]; });
        const gs = {
            humanId, humanAlias: nameMap[humanId],
            ais: aiConfigs.map(a => ({ ...a, alias: nameMap[a.id] })),
            allPlayers: allIds.map(id => ({ id, alias: nameMap[id], isHuman: id === humanId })),
            nameMap,
        };
        setSetup(gs); setupRef.current = gs;
        messagesRef.current = [{
            id: 'sys-start', isSystem: true, timestamp: Date.now(),
            text: 'Round started! Chat naturally and try to blend in. Send at least ' + MIN_MESSAGES + ' messages.',
        }];
        setMessages([...messagesRef.current]);
        setHumanMsgCount(0); humanMsgCountRef.current = 0;
        votesRef.current = []; announcedVotesRef.current = 0;
        setResult(null); roundDoneRef.current = false; votingDoneRef.current = false;
        roundEndRef.current = Date.now() + ROUND_DURATION * 1000;
        setTimer(ROUND_DURATION);
        aiStatesRef.current = aiConfigs.map(a => ({
            id: a.id, persona: a.persona, messagesSent: 0,
            totalMessages: 3,
            nextMessageTime: Date.now() + 5000 + Math.random() * 10000,
            isSending: false,
        }));
        updatePhase(PHASES.ROUND);
    }, [updatePhase]);
    const startGameRef = useRef(startGame);
    useEffect(() => { startGameRef.current = startGame; }, [startGame]);

    /* LLM required -- no mock mode */

    /* ---- Send Human Message ---- */
    const sendMessage = useCallback((text) => {
        if (!text.trim() || phaseRef.current !== PHASES.ROUND) return;
        if (humanMsgCountRef.current >= MIN_MESSAGES) return;
        humanMsgCountRef.current++;
        setHumanMsgCount(humanMsgCountRef.current);
        addMessage({ id: 'human-' + Date.now(), senderId: 'human',
            text: text.trim(), timestamp: Date.now(), isSystem: false });
        if (inputRef.current) inputRef.current.value = '';

        const available = aiStatesRef.current.filter(a => a.messagesSent < a.totalMessages && !a.isSending);
        if (available.length > 0) {
            const responder = available[Math.floor(Math.random() * available.length)];
            responder.nextMessageTime = Math.min(responder.nextMessageTime, Date.now() + 3000 + Math.random() * 5000);
        }
    }, [addMessage]);

    const handleKeyDown = useCallback((e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(e.target.value); }
    }, [sendMessage]);

    /* ---- Show Results ---- */
    const showResults = useCallback(() => {
        const s = setupRef.current; const v = votesRef.current;
        const tooFew = humanMsgCountRef.current < MIN_MESSAGES;
        const hv = v.filter(x => x.votedForId === s.humanId).length;
        const caught = tooFew || hv >= 2;
        const gr = caught ? 'lose' : 'win';
        setResult(gr);
        setStats(prev => ({ wins: prev.wins + (gr==='win'?1:0), losses: prev.losses + (gr==='lose'?1:0) }));

        const counts = {};
        v.forEach(x => { counts[x.votedForId] = (counts[x.votedForId]||0) + 1; });

        let t = tooFew
            ? 'GAME OVER! - You only sent ' + humanMsgCountRef.current + '/' + MIN_MESSAGES + ' messages.'
            : caught
                ? 'YOU WERE CAUGHT! - The AIs identified you as the human.'
                : 'YOU SURVIVED! - The AIs failed to identify you.';
        t += '\n\n';
        s.allPlayers.forEach(p => {
            const name = s.nameMap[p.id];
            const vc = counts[p.id] || 0;
            const voteTag = vc > 0 ? ', ' + vc + ' vote' + (vc !== 1 ? 's' : '') : '';
            if (p.isHuman) { t += '  ' + name + ': YOU (Human' + voteTag + ')\n'; }
            else { t += '  ' + name + ': AI' + (voteTag ? ' (' + vc + ' vote' + (vc !== 1 ? 's' : '') + ')' : '') + '\n'; }
        });
        addMessage({ id: 'sys-results', isSystem: true, isResult: true,
            gameResult: gr, text: t, timestamp: Date.now() });
        updatePhase(PHASES.RESULTS);
    }, [addMessage, updatePhase]);

    /* ---- Timer display (independent, never blocks) ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND && phase !== PHASES.VOTING) return;
        const id = setInterval(() => {
            setTimer(Math.max(0, Math.ceil((roundEndRef.current - Date.now()) / 1000)));
        }, 250);
        return () => clearInterval(id);
    }, [phase]);

    /* ---- Round end detection (waits for in-flight generation to finish) ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND) return;
        const id = setInterval(() => {
            if (roundDoneRef.current || pausedRef.current) return;
            const timeUp = Date.now() >= roundEndRef.current;
            const allBotsDone = aiStatesRef.current.length > 0
                && aiStatesRef.current.every(a => a.messagesSent >= a.totalMessages);
            const humanDone = humanMsgCountRef.current >= MIN_MESSAGES;
            const everyoneDone = allBotsDone && humanDone;   // all 3 bots AND you each sent 3 -> skip the wait
            if (timeUp || everyoneDone) {
                const anyBusy = aiStatesRef.current.some(a => a.isSending);
                if (anyBusy) return;   // let an in-flight message finish first
                roundDoneRef.current = true;
                const met = humanMsgCountRef.current >= MIN_MESSAGES;
                addMessage({ id: 'sys-analyze', isSystem: true, timestamp: Date.now(),
                    text: !met ? 'Time is up! You only sent ' + humanMsgCountRef.current + ' messages (minimum ' + MIN_MESSAGES + '). The AIs are very suspicious...'
                        : (everyoneDone && !timeUp) ? 'Everyone has spoken. The AIs are analyzing the conversation...'
                        : 'Time is up! The AIs are analyzing the conversation...' });
                updatePhase(PHASES.ANALYZING);
            }
        }, 500);
        return () => clearInterval(id);
    }, [phase, addMessage, updatePhase]);

    /* ---- AI message generation (async, non-blocking) ---- */
    useEffect(() => {
        if (phase !== PHASES.ROUND) return;
        const busy = { current: false };
        const id = setInterval(async () => {
            if (busy.current || phaseRef.current !== PHASES.ROUND || !wllamaRef.current || pausedRef.current) return;
            const now = Date.now();
            const timeLeft = roundEndRef.current - now;
            if (timeLeft <= 20000) {
                for (const ai of aiStatesRef.current) {
                    if (ai.messagesSent < ai.totalMessages && !ai.isSending) ai.nextMessageTime = now;
                }
            }
            const shuffled = shuffleArray(aiStatesRef.current);
            for (const ai of shuffled) {
                if (now >= ai.nextMessageTime && ai.messagesSent < ai.totalMessages && !ai.isSending) {
                    busy.current = true; ai.isSending = true;
                    try {
                        const msgId = ai.id+'-'+ai.messagesSent+'-'+now;
                        const result = await generateAIMessage(wllamaRef.current, ai.id, {
                            persona: ai.persona, recentMessages: messagesRef.current,
                            nameMap: setupRef.current.nameMap, messagesSent: ai.messagesSent,
                        }, (streamData) => {
                            /* Update or create the streaming message in-place (also works during grace period after timer) */
                            if (phaseRef.current === PHASES.ROUND || !roundDoneRef.current) {
                                setMessages(prev => {
                                    const exists = prev.some(m => m.id === msgId);
                                    if (!exists) {
                                        return [...prev, { id: msgId, senderId: ai.id, text: streamData.text || '(thinking...)', timestamp: Date.now(), isSystem: false, streaming: !streamData.done, tps: streamData.tps, genTime: streamData.timeStr, thinkText: streamData.thinkText || '' }];
                                    }
                                    return prev.map(m => m.id === msgId
                                        ? { ...m, text: streamData.done ? streamData.text : (streamData.text || '(thinking...)'), tps: streamData.tps, genTime: streamData.timeStr, thinkText: streamData.thinkText || '', streaming: !streamData.done }
                                        : m);
                                });
                            }
                        });
                        if (phaseRef.current === PHASES.ROUND || !roundDoneRef.current) {
                            const finalText = typeof result === 'object' ? result.text : result;
                            if (finalText === '[LLM not loaded]' || finalText === '[inference failed]') {
                                setMessages(prev => prev.filter(m => m.id !== msgId));
                                break;
                            }
                            ai.messagesSent++;
                            const tl = roundEndRef.current - Date.now();
                            const ml = ai.totalMessages - ai.messagesSent;
                            if (ml > 0 && tl > 20000) {
                                const base = tl / (ml + 1);
                                ai.nextMessageTime = Date.now() + Math.max(5000, base + (Math.random()-0.5)*base*0.4);
                            } else if (ml > 0) {
                                ai.nextMessageTime = Date.now();
                            }
                        }
                    } catch (e) { console.error('AI msg err:', e); }
                    finally { ai.isSending = false; busy.current = false; }
                    break;
                }
            }
        }, 2000);
        return () => clearInterval(id);
    }, [phase, addMessage]);

    /* ---- Analyzing phase: generate all AI votes ---- */
    useEffect(() => {
        if (phase !== PHASES.ANALYZING) return;
        let cancelled = false;
        (async () => {
            try {
                const s = setupRef.current;
                const w = wllamaRef.current;
                const aiVotes = await generateAIVotes(w, s.ais, {
                    recentMessages: messagesRef.current,
                    nameMap: s.nameMap, allPlayers: s.allPlayers,
                });
                if (cancelled) return;
                const allVotes = aiVotes.map(vote => {
                    const votedPlayer = s.allPlayers.find(p => s.nameMap[p.id] === vote.votedForAlias);
                    if (!votedPlayer) {
                        throw new Error('Vote inference returned unknown player: ' + vote.votedForAlias);
                    }
                    return {
                        voterId: vote.voterId, voterAlias: vote.voterAlias,
                        votedForId: votedPlayer.id, votedForAlias: s.nameMap[votedPlayer.id],
                    };
                });
                votesRef.current = allVotes;
                announcedVotesRef.current = 0;
                votingStartRef.current = Date.now();
                roundEndRef.current = Date.now() + VOTING_DURATION * 1000;
                setTimer(VOTING_DURATION);
                updatePhase(PHASES.VOTING);
            } catch (e) {
                console.error('AI vote inference failed:', e);
                if (!cancelled) {
                    addMessage({ id: 'sys-vote-error', isSystem: true, timestamp: Date.now(),
                        text: 'AI vote inference failed. Check the console for details.' });
                }
            }
        })();
        return () => { cancelled = true; };
    }, [phase, addMessage, updatePhase]);

    /* ---- Vote reveal during VOTING ---- */
    useEffect(() => {
        if (phase !== PHASES.VOTING) return;
        const id = setInterval(() => {
            const now = Date.now();
            const elapsed = (now - votingStartRef.current) / 1000;
            const revealAt = [3, 7, 11];
            let should = 0;
            for (const t of revealAt) { if (elapsed >= t) should++; }
            if (should > announcedVotesRef.current && announcedVotesRef.current < votesRef.current.length) {
                for (let i = announcedVotesRef.current; i < should && i < votesRef.current.length; i++) {
                    const v = votesRef.current[i];
                    addMessage({ id: 'vote-'+i, isSystem: true, isVoteReveal: true, timestamp: Date.now(),
                        text: v.voterAlias + ' suspects "' + v.votedForAlias + '" is the impostor' });
                }
                announcedVotesRef.current = should;
            }
            const remaining = Math.max(0, Math.ceil((roundEndRef.current - now) / 1000));
            if (remaining <= 0 && !votingDoneRef.current) {
                votingDoneRef.current = true;
                for (let i = announcedVotesRef.current; i < votesRef.current.length; i++) {
                    const v = votesRef.current[i];
                    addMessage({ id: 'vote-'+i, isSystem: true, isVoteReveal: true, timestamp: Date.now(),
                        text: v.voterAlias + ' suspects "' + v.votedForAlias + '" is the impostor' });
                }
                setTimeout(() => showResults(), 1500);
            }
        }, 500);
        return () => clearInterval(id);
    }, [phase, addMessage, showResults]);

    /* No skip -- LLM is required */

    /* ---- Render ---- */
    const msgsLeft = MIN_MESSAGES - humanMsgCount;
    const counterText = msgsLeft + ' message' + (msgsLeft !== 1 ? 's' : '') + ' left to send before ' + fmtTime(timer);

    /* LOADING SCREEN */
    if (phase === PHASES.LOADING) {
        const loadedMB = (loadPct / 100 * 1400).toFixed(0);
        return html`
            <div className="loading-screen">
                <div className="loading-title">AI Imposter</div>
                <div className="loading-subtitle">Single-player Turing test game</div>
                <div className="loading-status">Loading LLM [${MODEL_CHAIN[0].file}]... ${loadPct}%</div>
                <div className="progress-bar">
                    <div className="progress-fill" style=${{ width: loadPct + '%' }} />
                </div>
                <div className="loading-detail">${loadedMB} / ~1400 MB${loadElapsed > 0 ? ' -- ' + loadElapsed + 's elapsed' : ''}</div>
                <div className="loading-hint">First load downloads ~1.4 GB model. Cached for future games.</div>
                ${loadError && html`
                    <div className="loading-error">Load failed: ${loadError}</div>
                `}
            </div>
            <footer className="info-footer">Downloading ${MODEL_CHAIN[0].file} for in-browser AI inference</footer>
        `;
    }

    const footerText = phase === PHASES.LOBBY
        ? 'Chat with AI players and try to blend in. The AIs will vote on who they think is the impostor.'
        : phase === PHASES.ROUND ? 'Round in progress'
        : phase === PHASES.ANALYZING ? 'The AIs are analyzing the conversation...'
        : phase === PHASES.VOTING ? 'The AIs are deliberating on who is the impostor...'
        : result === 'win' ? 'You survived! The AIs could not identify you.'
        : 'You were caught! The AIs identified you as the human.';

    const headerTitle = phase === PHASES.ROUND ? 'Round in Progress'
        : phase === PHASES.ANALYZING ? 'AIs Analyzing...'
        : phase === PHASES.VOTING ? 'AI Deliberation'
        : 'Round Over';

    return html`
        <div className="game-container">
            <div className="left-panel">
                <div className="lobby-section">
                    <div className="lobby-header">
                        <h1 className="game-title">AI Imposter</h1>
                        ${(phase === PHASES.ROUND || phase === PHASES.VOTING) && html`<div className="timer big">${fmtTime(timer)}</div>`}
                        ${phase === PHASES.ANALYZING && html`<div className="timer big">...</div>`}
                    </div>
                    ${phase === PHASES.LOBBY && html`
                        <div className="lobby-info">
                            <p>You are the only human in a room of AIs.</p>
                            <p>Chat naturally for 90 seconds. 3 AI players will try to figure out who is human.</p>
                            <p>At the end, they vote. If 2+ AIs identify you, you lose.</p>
                        </div>
                        <button className="ready-button start-button" onClick=${startGame}>Start Game</button>
                    `}
                    ${phase !== PHASES.LOBBY && setup && html`
                        <div className="players-list">
                            <div className="players-title">Players (4)</div>
                            ${setup.allPlayers.map(p => html`
                                <div key=${p.id} className="player-item">
                                    <img src=${avUrl(p.alias)} alt="" className="player-avatar" />
                                    <span>
                                        ${p.alias}
                                        ${p.id === setup.humanId && html`<span className="you-tag"> (You)</span>`}
                                        ${phase === PHASES.RESULTS && !p.isHuman && html`<span className="ai-tag">AI</span>`}
                                    </span>
                                    <span className=${'player-status ' + (
                                        phase === PHASES.RESULTS ? (p.isHuman ? 'human-status' : 'ai-status') : 'ready'
                                    )}>
                                        ${phase === PHASES.ROUND ? 'Chatting'
                                            : phase === PHASES.ANALYZING ? (p.isHuman ? 'Waiting' : 'Thinking')
                                            : phase === PHASES.VOTING ? (p.isHuman ? 'Awaiting' : 'Deliberating')
                                            : (p.isHuman ? 'Human' : 'AI')}
                                    </span>
                                </div>
                            `)}
                            ${phase === PHASES.ROUND && html`
                                <div className="your-alias-reminder">You are: <strong>${setup.humanAlias}</strong></div>
                            `}
                        </div>
                    `}
                </div>
                <div className="leaderboard">
                    <div className="leaderboard-title">Session Stats</div>
                    <div className="stats-row">
                        <span className="stat-win">Wins: ${stats.wins}</span>
                        <span className="stat-lose">Losses: ${stats.losses}</span>
                    </div>
                </div>
            </div>
            <div className="right-panel">
                <div className="chat-container">
                    <div className="chat-header">
                        ${phase === PHASES.LOBBY && html`<h2 className="chat-title lobby">Game Lobby</h2>`}
                        ${phase !== PHASES.LOBBY && html`
                            <div className="chat-header-info">
                                <h2 className="chat-title">
                                    ${phase === PHASES.ANALYZING && html`<span className="analyzing-spinner" />`}
                                    ${headerTitle}
                                </h2>
                                ${(phase === PHASES.ROUND || phase === PHASES.VOTING) && html`
                                    <div className="timer">${fmtTime(timer)}</div>
                                `}
                            </div>
                        `}
                    </div>
                    <div className="chat-messages" ref=${chatRef}>
                        ${phase === PHASES.LOBBY && html`
                            <div className="chat-disabled">
                                Ready to test your disguise? Press "Start Game" to begin chatting with 3 AI players.
                            </div>
                        `}
                        ${messages.map(msg => html`
                            <div key=${msg.id} className="message">
                                ${msg.isSystem ? html`
                                    <div className=${[
                                        'system-message',
                                        msg.isVoteReveal ? 'vote-reveal' : '',
                                        msg.isResult ? (msg.gameResult==='win' ? 'result-win' : 'result-lose') : '',
                                    ].filter(Boolean).join(' ')}>${msg.text}</div>
                                ` : html`
                                    <div>
                                        <div className="message-header">
                                            <img src=${avUrl(setup && setup.nameMap[msg.senderId])}
                                                 alt="" className="message-avatar" />
                                            <span className="message-username">
                                                ${setup ? setup.nameMap[msg.senderId] : 'Unknown'}
                                                ${msg.tps && msg.senderId !== 'human' ? html`<span className="gen-stats"> - ${msg.tps}t/s +${msg.genTime}</span>` : null}
                                                ${msg.thinkText && msg.thinkText.trim().length > 3 && msg.senderId !== 'human' ? html`<button className=${`think-toggle ${openThinks.has(msg.id) ? 'open' : ''}`} onClick=${() => toggleThink(msg.id)}>${'<think>'}</button>` : null}
                                                ${msg.streaming ? html`<span className="streaming-dot"> ...</span>` : null}
                                            </span>
                                        </div>
                                        <div className="message-text">${msg.text}</div>
                                        ${openThinks.has(msg.id) && msg.thinkText ? html`<div className="think-content">${msg.thinkText}</div>` : null}
                                    </div>
                                `}
                            </div>
                        `)}
                    </div>
                    ${phase === PHASES.ROUND && html`
                        <div className="chat-input-container">
                            <textarea ref=${inputRef} className=${'chat-input' + (msgsLeft > 0 && timer <= 10 ? ' urgent' : '')}
                                disabled=${humanMsgCount >= MIN_MESSAGES}
                                placeholder=${humanMsgCount >= MIN_MESSAGES
                                    ? 'All ' + MIN_MESSAGES + ' messages sent. Wait for the AIs to analyze...'
                                    : counterText + ' | You are: ' + (setup ? setup.humanAlias : '?') + ' | Chat naturally and blend in'}
                                onKeyDown=${handleKeyDown} maxLength=${150} />
                        </div>
                    `}
                    ${phase === PHASES.RESULTS && html`
                        <div className="chat-input-container result-actions">
                            <button className="ready-button start-button" onClick=${() => location.reload()}>Play Again</button>
                        </div>
                    `}
                </div>
            </div>
        </div>
        <footer className="info-footer">${footerText}</footer>
    `;
}

/* ===== ERROR BOUNDARY ===== */
class ErrorBoundary extends Component {
    constructor(props) { super(props); this.state = { hasError: false }; }
    static getDerivedStateFromError() { return { hasError: true }; }
    componentDidCatch(err, info) { console.error('ErrorBoundary:', err, info); }
    render() {
        if (this.state.hasError) {
            return html`<div style=${{ padding: 24, textAlign: 'center' }}>
                <h2>Something went wrong</h2>
                <button className="ready-button" style=${{ marginTop: 16 }}
                    onClick=${() => this.setState({ hasError: false })}>Try Again</button>
            </div>`;
        }
        return this.props.children;
    }
}

createRoot(document.getElementById('root')).render(
    html`<${ErrorBoundary}><${AIImposterGame} /></${ErrorBoundary}>`
);

    <script>
(function initMatrixGrid() {

    var mx=-1, my=-1, lastMoveAt=0, lastCell={i:-9999,j:-9999}, trail=new Map();
    var sketch = function(p) {

            trail.set(k,{i:i,j:j,alpha:Math.min(ba,C.TRAIL_MAX_ALPHA),baseAlpha:ba,activationAt:performance.now()+d});

            if(di===0&&dj===0)continue;a.push({i:i+di,j:j+dj});}return a;};
        p.setup=function(){var cnv=p.createCanvas(p.windowWidth,p.windowHeight);
            cnv.position(0,0);cnv.style('position','fixed');cnv.style('inset','0');
            cnv.style('z-index',C.LAYER_MODE==='over'?'0':'-1');cnv.style('pointer-events','none');
            cnv.style('opacity',String(C.GLOBAL_OPACITY));
            if(C.LAYER_MODE==='over')cnv.style('mix-blend-mode','screen');
            p.noFill();p.rectMode(p.CORNER);p.pixelDensity(1);p.frameRate(C.FRAME_RATE);};
        p.windowResized=function(){p.resizeCanvas(p.windowWidth,p.windowHeight);};

                cell.alpha=Math.max(0,cell.alpha-fade);if(cell.alpha<=0){trail.delete(k);return;}
                var cx=cell.i*C.CELL_SIZE+C.CELL_SIZE/2,cy=cell.j*C.CELL_SIZE+C.CELL_SIZE/2;
                var dx=mx-cx,dy=my-cy;var df=Math.max(0.25,1-(Math.hypot(dx,dy)/500));
                var pf=0.9+0.1*Math.sin(now/800+(cell.i+cell.j));var a=cell.alpha*df*pf;
