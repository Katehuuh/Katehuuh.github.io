<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================
// CONFIG
// ============================================
const PLANET_RADIUS = 50;
const PLANET_MASS = 1000000;
const G = 6.674e-11 * 5e9;
const ATMO_HEIGHT = 12;
const CLOUD_BASE = 8;
const CLOUD_THICK = 4;
// Sea level as a terrain-elevation threshold. Terrain floor is clamped to elev>=0,
// so the water surface must sit ABOVE 0 to be visible in basins (was buried before).
const SEA_LEVEL = 0.35;
const seaRadius = PLANET_RADIUS + SEA_LEVEL;

// ============================================
// NOISE
// ============================================
class Noise {
    constructor(seed = 12345) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        let s = seed;
        for (let i = 255; i > 0; i--) {
            s = (s * 16807) % 2147483647;
            const j = s % (i + 1);
            [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
    }

    noise3D(x, y, z) {
        const F3 = 1/3, G3 = 1/6;
        let s = (x + y + z) * F3;
        let i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        let t = (i + j + k) * G3;
        let x0 = x - (i - t), y0 = y - (j - t), z0 = z - (k - t);
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
            if (y0 >= z0) { i1=1;j1=0;k1=0;i2=1;j2=1;k2=0; }
            else if (x0 >= z0) { i1=1;j1=0;k1=0;i2=1;j2=0;k2=1; }
            else { i1=0;j1=0;k1=1;i2=1;j2=0;k2=1; }
        } else {
            if (y0 < z0) { i1=0;j1=0;k1=1;i2=0;j2=1;k2=1; }
            else if (x0 < z0) { i1=0;j1=1;k1=0;i2=0;j2=1;k2=1; }
            else { i1=0;j1=1;k1=0;i2=1;j2=1;k2=0; }
        }
        let x1=x0-i1+G3,y1=y0-j1+G3,z1=z0-k1+G3;
        let x2=x0-i2+2*G3,y2=y0-j2+2*G3,z2=z0-k2+2*G3;
        let x3=x0-1+3*G3,y3=y0-1+3*G3,z3=z0-1+3*G3;
        let ii=i&255,jj=j&255,kk=k&255;
        const grad=(h,x,y,z)=>{h&=15;let u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);};
        let n0=0,n1=0,n2=0,n3=0;
        let t0=0.6-x0*x0-y0*y0-z0*z0;if(t0>0){t0*=t0;n0=t0*t0*grad(this.perm[ii+this.perm[jj+this.perm[kk]]],x0,y0,z0);}
        let t1=0.6-x1*x1-y1*y1-z1*z1;if(t1>0){t1*=t1;n1=t1*t1*grad(this.perm[ii+i1+this.perm[jj+j1+this.perm[kk+k1]]],x1,y1,z1);}
        let t2=0.6-x2*x2-y2*y2-z2*z2;if(t2>0){t2*=t2;n2=t2*t2*grad(this.perm[ii+i2+this.perm[jj+j2+this.perm[kk+k2]]],x2,y2,z2);}
        let t3=0.6-x3*x3-y3*y3-z3*z3;if(t3>0){t3*=t3;n3=t3*t3*grad(this.perm[ii+1+this.perm[jj+1+this.perm[kk+1]]],x3,y3,z3);}
        return 32*(n0+n1+n2+n3);
    }

    fbm(x, y, z, oct = 5) {
        let v = 0, a = 0.5, f = 1;
        for (let i = 0; i < oct; i++) { v += a * this.noise3D(x*f, y*f, z*f); a *= 0.5; f *= 2; }
        return v;
    }
}

const noise = new Noise(42);

const GLSL_NOISE = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0);
    const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)),x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz),l=1.0-g,i1=min(g,l.zxy),i2=max(g,l.zxy);
    vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
    i=mod(i,289.0);
    vec4 p=permute(permute(permute(i.z+vec4(0,i1.z,i2.z,1))+i.y+vec4(0,i1.y,i2.y,1))+i.x+vec4(0,i1.x,i2.x,1));
    float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z),y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy,y=y_*ns.x+ns.yyyy,h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0,s1=floor(b1)*2.0+1.0,sh=-step(h,vec4(0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
    m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p,int o){float v=0.0,a=0.5;for(int i=0;i<6;i++){if(i>=o)break;v+=a*snoise(p);p*=2.0;a*=0.5;}return v;}
`;

// ============================================
// TERRAIN
// ============================================
function terrainElev(dir) {
    const p = dir.clone().multiplyScalar(3);
    let e = noise.fbm(p.x * 0.8, p.y * 0.8, p.z * 0.8, 5) * 0.5;
    const m = noise.fbm(p.x * 1.5 + 10, p.y * 1.5 + 10, p.z * 1.5 + 10, 6);
    e += Math.pow(Math.max(0, m), 2.5) * 1.2;
    e += noise.fbm(p.x * 3, p.y * 3, p.z * 3, 4) * 0.15;
    return Math.max(0, e) * 4;
}

function terrainHeight(pos) {
    return PLANET_RADIUS + terrainElev(pos.clone().normalize());
}

function terrainNormal(pos) {
    const eps = 0.05;
    const dir = pos.clone().normalize();
    let t1 = new THREE.Vector3(0, 1, 0).cross(dir);
    if (t1.lengthSq() < 0.001) t1 = new THREE.Vector3(1, 0, 0).cross(dir);
    t1.normalize();
    const t2 = dir.clone().cross(t1).normalize();
    const h0 = terrainHeight(pos);
    const h1 = terrainHeight(pos.clone().add(t1.clone().multiplyScalar(eps)));
    const h2 = terrainHeight(pos.clone().add(t2.clone().multiplyScalar(eps)));
    const v1 = t1.clone().multiplyScalar(eps).add(dir.clone().multiplyScalar(h1 - h0));
    const v2 = t2.clone().multiplyScalar(eps).add(dir.clone().multiplyScalar(h2 - h0));
    return v2.cross(v1).normalize();
}

function getBiome(pos) {
    const dir = pos.clone().normalize();
    const lat = Math.abs(dir.y);
    const elev = terrainElev(dir);
    const moist = noise.fbm(dir.x * 3 + 50, dir.y * 3 + 50, dir.z * 3 + 50, 4) * 0.5 + 0.5;
    if (lat > 0.75) return 'Ice';
    if (elev < SEA_LEVEL) return 'Ocean';
    if (elev < SEA_LEVEL + 0.14) return 'Beach';
    if (elev > 3) return 'Mountain';
    if (moist < 0.3) return 'Desert';
    if (moist < 0.6) return 'Grassland';
    return 'Forest';
}

// ============================================
// SCENE
// ============================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============================================
// LIGHTING
// ============================================
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const sunDir = new THREE.Vector3(0.6, 0.3, 0.75).normalize();
const sunLight = new THREE.DirectionalLight(0xffffee, 1.2);
sunLight.position.copy(sunDir.clone().multiplyScalar(100));
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 120;
sunLight.shadow.camera.left = -40;
sunLight.shadow.camera.right = 40;
sunLight.shadow.camera.top = 40;
sunLight.shadow.camera.bottom = -40;
scene.add(sunLight);
scene.add(sunLight.target); // Required for shadow camera to follow target

function scatterCoeffs(strength) {
    return new THREE.Vector3(
        Math.pow(400 / 700, 4) * strength,
        Math.pow(400 / 530, 4) * strength,
        Math.pow(400 / 440, 4) * strength
    );
}
const scatter = scatterCoeffs(18);

// ============================================
// TERRAIN PLANET
// ============================================
const terrainGeo = new THREE.IcosahedronGeometry(PLANET_RADIUS, 80);
const positions = terrainGeo.attributes.position;
const colors = new Float32Array(positions.count * 3);

for (let i = 0; i < positions.count; i++) {
    const v = new THREE.Vector3(positions.getX(i), positions.getY(i), positions.getZ(i));
    const dir = v.clone().normalize();
    const elev = terrainElev(dir);

    v.normalize().multiplyScalar(PLANET_RADIUS + elev);
    positions.setXYZ(i, v.x, v.y, v.z);

    const biome = getBiome(v);
    let col = new THREE.Color();
    if (biome === 'Ice') col.setStyle('#e8f4f8');
    else if (biome === 'Ocean') col.setStyle('#0a3a4a');
    else if (biome === 'Beach') col.setStyle('#d8c69a');
    else if (biome === 'Mountain') col.setStyle('#808080');
    else if (biome === 'Desert') col.setStyle('#d4a050');
    else if (biome === 'Grassland') col.setStyle('#4a8020');
    else col.setStyle('#2a6020');

    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.9,
    metalness: 0.1
});

const planet = new THREE.Mesh(terrainGeo, terrainMat);
planet.receiveShadow = true;
scene.add(planet);

// ============================================
// OCEAN  (GPU heightfield water physics + shoreline foam)
// ============================================
// Bake terrain elevation into an equirectangular texture so both the water sim and
// the ocean shader know exactly where the coastline is (GLSL snoise != JS simplex,
// so we cannot re-derive the terrain in-shader). R channel = elev/3.
function bakeHeightTexture(W, H) {
    const data = new Uint8Array(W * H * 4);
    const tmp = new THREE.Vector3();
    for (let y = 0; y < H; y++) {
        const lat = (y / (H - 1) - 0.5) * Math.PI;
        const cy = Math.cos(lat), sy = Math.sin(lat);
        for (let x = 0; x < W; x++) {
            const lon = (x / W - 0.5) * Math.PI * 2;
            tmp.set(cy * Math.cos(lon), sy, cy * Math.sin(lon));
            const e = Math.max(0, Math.min(1, terrainElev(tmp) / 3));
            const i = (y * W + x) * 4;
            data[i] = data[i + 1] = data[i + 2] = Math.round(e * 255);
            data[i + 3] = 255;
        }
    }
    const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    return tex;
}
const heightTex = bakeHeightTexture(512, 256);

// --- Interactive water physics: GPU heightfield wave-equation solver ----------
// A ping-ponged equirectangular field (R = surface height, G = velocity) integrates
// the 2D wave equation every frame. Land cells (read from the baked terrain height)
// behave as reflective walls, so waves genuinely bounce off coastlines; the car
// stamps a moving impulse that radiates a real wake. Same lon/lat mapping as heightTex.
const SIM_W = 512, SIM_H = 256;
const _glctx = renderer.getContext();
let waterSimOK = renderer.capabilities.isWebGL2
    ? !!_glctx.getExtension('EXT_color_buffer_float')
    : (!!_glctx.getExtension('OES_texture_half_float') && !!_glctx.getExtension('WEBGL_color_buffer_float'));
const simRTopts = {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.RepeatWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false, stencilBuffer: false
};
let simRTA = new THREE.WebGLRenderTarget(SIM_W, SIM_H, simRTopts);
let simRTB = new THREE.WebGLRenderTarget(SIM_W, SIM_H, simRTopts);
// flat fallback field when float render targets are unavailable
const flatSim = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
flatSim.needsUpdate = true;

const simMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
        uniform sampler2D uPrev, uHeight;
        uniform vec2 uTexel, uCarUV;
        uniform float uSeaElev, uDamping, uSpeed2, uPoleFix, uCarStamp;
        varying vec2 vUv;
        float landAt(vec2 uv){ return step(uSeaElev, texture2D(uHeight, uv).r * 3.0); }
        float nb(vec2 uv, float c){ return mix(texture2D(uPrev, uv).r, c, landAt(uv)); }
        void main(){
            vec2 uv = vUv;
            if(landAt(uv) > 0.5){ gl_FragColor = vec4(0.0); return; }   // land = reflective wall
            vec4 s = texture2D(uPrev, uv);
            float h = s.r, v = s.g;
            float hL = nb(uv - vec2(uTexel.x, 0.0), h), hR = nb(uv + vec2(uTexel.x, 0.0), h);
            float hU = nb(uv - vec2(0.0, uTexel.y), h), hD = nb(uv + vec2(0.0, uTexel.y), h);
            // metric-aware laplacian, coupling capped near the poles for stability
            float lat = (uv.y - 0.5) * 3.14159265;
            float cl = max(uPoleFix, cos(lat));
            float lap = (hL + hR - 2.0 * h) * cl * cl + (hU + hD - 2.0 * h);
            v += lap * uSpeed2;
            v *= uDamping;
            h += v;
            // moving car impulse (wrap longitude distance) -> radiating wake
            float du = abs(uv.x - uCarUV.x); du = min(du, 1.0 - du);
            float dv = uv.y - uCarUV.y;
            h -= uCarStamp * exp(-(du * du + dv * dv) * 9000.0);
            h = clamp(h, -3.0, 3.0);
            gl_FragColor = vec4(h, v, 0.0, 1.0);
        }
    `,
    uniforms: {
        uPrev: { value: null }, uHeight: { value: heightTex },
        uTexel: { value: new THREE.Vector2(1 / SIM_W, 1 / SIM_H) },
        uCarUV: { value: new THREE.Vector2(0.5, 0.5) },
        uSeaElev: { value: SEA_LEVEL }, uDamping: { value: 0.996 },
        uSpeed2: { value: 0.22 }, uPoleFix: { value: 0.25 }, uCarStamp: { value: 0.0 }
    }
});
const simScene = new THREE.Scene();
simScene.add(Object.assign(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), simMat), { frustumCulled: false }));
const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
if (waterSimOK) {
    [simRTA, simRTB].forEach(rt => { renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); });
    renderer.setRenderTarget(null);
}
const carUV = new THREE.Vector2(0.5, 0.5);
function dirToUV(d, out) {
    out.set(Math.atan2(d.z, d.x) / (2 * Math.PI) + 0.5, Math.asin(Math.max(-1, Math.min(1, d.y))) / Math.PI + 0.5);
    return out;
}
function stepWater(carStamp) {
    if (!waterSimOK) return;
    simMat.uniforms.uPrev.value = simRTA.texture;
    simMat.uniforms.uCarUV.value.copy(carUV);
    simMat.uniforms.uCarStamp.value = carStamp;
    renderer.setRenderTarget(simRTB);
    renderer.render(simScene, simCamera);
    renderer.setRenderTarget(null);
    const t = simRTA; simRTA = simRTB; simRTB = t;
    oceanMat.uniforms.uSim.value = simRTA.texture;
}

// Wave field shared by vertex (displacement) and fragment (analytic normal + foam).
const OCEAN_FUNCS = `
    uniform sampler2D uHeight, uSim;
    uniform float uSeaElev, uSimScale;

    vec2 dirToUV(vec3 d) {
        return vec2(atan(d.z, d.x) * 0.15915494 + 0.5, asin(clamp(d.y, -1.0, 1.0)) * 0.31830989 + 0.5);
    }
    float terrH(vec3 d) { return texture2D(uHeight, dirToUV(d)).r * 3.0; }
    // physical surface height + velocity from the water simulation
    float simH(vec3 d) { return texture2D(uSim, dirToUV(d)).r * uSimScale; }
    float simV(vec3 d) { return texture2D(uSim, dirToUV(d)).g; }
    // light ambient wind chop so calm open water still has life
    float ambientH(vec3 d, float t) {
        float h = 0.0;
        h += sin(dot(d, vec3( 1.0,  0.2,  0.3)) * 22.0 + t * 1.10) * 0.018;
        h += sin(dot(d, vec3(-0.3,  0.1,  1.0)) * 17.0 + t * 0.90) * 0.014;
        h += fbm(d * 40.0 + vec3(t * 0.15, 0.0, t * 0.10), 3) * 0.012;
        return h;
    }
    float waveField(vec3 d, float t) { return ambientH(d, t) + simH(d); }
`;

const oceanGeo = new THREE.IcosahedronGeometry(seaRadius, 64);
const oceanMat = new THREE.ShaderMaterial({
    vertexShader: `
        ${GLSL_NOISE}
        ${OCEAN_FUNCS}
        uniform float uTime, uSeaR;
        varying vec3 vDir, vWorld;
        varying float vWaveH, vDepth;
        void main() {
            vec3 d = normalize(position);
            float terr = terrH(d);
            float depth = uSeaElev - terr;
            float shore = smoothstep(0.0, 0.18, depth);
            // ambient chop fades toward shore; the physical sim already zeroes on land
            float wave = ambientH(d, uTime) * (0.25 + 0.75 * shore) + simH(d);
            vDir = d; vWaveH = wave; vDepth = depth;
            vec3 pos = d * (uSeaR + wave);
            vWorld = (modelMatrix * vec4(pos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    `,
    fragmentShader: `
        ${GLSL_NOISE}
        ${OCEAN_FUNCS}
        uniform vec3 uSun;
        uniform float uTime, uSeaR;
        varying vec3 vDir, vWorld;
        varying float vWaveH, vDepth;

        void main() {
            vec3 d = vDir;
            vec3 up = d;
            vec3 t1 = normalize(cross(abs(d.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0), up));
            vec3 t2 = cross(up, t1);

            // analytic normal from the wave gradient (crisp detail beyond geometry)
            float e = 0.0025;
            float h0 = waveField(d, uTime);
            float hx = waveField(normalize(d + t1 * e), uTime);
            float hy = waveField(normalize(d + t2 * e), uTime);
            vec3 N = normalize(up - t1 * ((hx - h0) / e) * 0.16 - t2 * ((hy - h0) / e) * 0.16);

            vec3 V = normalize(cameraPosition - vWorld);
            vec3 L = normalize(uSun);
            float fres = 0.02 + 0.98 * pow(1.0 - max(0.0, dot(N, V)), 5.0);

            // depth-graded body colour
            float openness = smoothstep(0.02, 0.25, vDepth);
            vec3 water = mix(vec3(0.10, 0.42, 0.48), vec3(0.015, 0.09, 0.19), openness);

            // reflected sky gradient + sun disc + micro glint
            vec3 R = reflect(-V, N);
            vec3 skyC = mix(vec3(0.70, 0.80, 0.95), vec3(0.15, 0.35, 0.70), clamp(R.y * 0.5 + 0.5, 0.0, 1.0));
            float sunSpec = pow(max(0.0, dot(R, L)), 400.0);
            float glint = pow(max(0.0, dot(N, normalize(L + V))), 200.0);

            float diff = max(0.0, dot(N, L));
            vec3 col = water * (0.15 + 0.85 * diff);
            col = mix(col, skyC, fres * 0.75);
            col += vec3(1.0, 0.95, 0.80) * (sunSpec * 2.0 + glint * 0.6);

            // subsurface crest glow when looking toward the sun through a swell
            float sss = smoothstep(0.02, 0.08, vWaveH) * pow(max(0.0, dot(V, -L)), 2.0);
            col += vec3(0.10, 0.40, 0.35) * sss * 0.6;

            // foam: dynamic whitecaps where the simulated water moves fast (car wake,
            // waves breaking against coastlines) plus a shoreline wash band
            float fn = fbm(d * 100.0 + uTime * 0.25, 3);
            float moving = smoothstep(0.012, 0.05, abs(simV(d)));
            float wash = 0.5 + 0.5 * sin(vDepth * 60.0 - uTime * 2.0);
            float shoreFoam = smoothstep(0.14, 0.0, vDepth) * (0.5 + 0.5 * wash);
            float foam = clamp(max(shoreFoam * 0.9, moving), 0.0, 1.0);
            foam *= smoothstep(0.25, 0.85, fn * 0.5 + 0.75);
            col = mix(col, vec3(0.90, 0.95, 1.0), foam);

            float alpha = max(mix(0.82, 0.98, openness), foam);
            gl_FragColor = vec4(col, alpha);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uTime: { value: 0 },
        uSeaR: { value: seaRadius },
        uSeaElev: { value: SEA_LEVEL },
        uHeight: { value: heightTex },
        uSim: { value: waterSimOK ? simRTA.texture : flatSim },
        uSimScale: { value: 1.1 }
    },
    transparent: true,
    depthWrite: true
});
const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
oceanMesh.frustumCulled = false;
scene.add(oceanMesh);

// ============================================
// CLOUD LAYER RADII (defined early for atmosphere god rays)
// ============================================
const cloudInnerR = PLANET_RADIUS + CLOUD_BASE;
const cloudOuterR = PLANET_RADIUS + CLOUD_BASE + CLOUD_THICK;

// ============================================
// ATMOSPHERE
// ============================================
const atmoGeo = new THREE.IcosahedronGeometry(PLANET_RADIUS + ATMO_HEIGHT, 48);
const atmoMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec3 vWorld;
        void main() {
            vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform vec3 uSun, uCam, uScatter;
        uniform float uPlanetR, uAtmoR, uFalloff;
        varying vec3 vWorld;

        #define STEPS 8

        vec2 raySphere(float r, vec3 ro, vec3 rd) {
            float b = dot(ro, rd);
            float c = dot(ro, ro) - r * r;
            float d = b * b - c;
            if(d < 0.0) return vec2(1e10, 0.0);
            float s = sqrt(d);
            return vec2(max(0.0, -b - s), max(0.0, -b + s) - max(0.0, -b - s));
        }

        float density(vec3 p) {
            float h = (length(p) - uPlanetR) / (uAtmoR - uPlanetR);
            return exp(-h * uFalloff) * (1.0 - h);
        }

        float optDepth(vec3 ro, vec3 rd, float len) {
            float step = len / float(STEPS);
            float d = 0.0;
            for(int i = 0; i < STEPS; i++) {
                d += density(ro + rd * (float(i) + 0.5) * step) * step;
            }
            return d;
        }

        void main() {
            vec3 ro = uCam;
            vec3 rd = normalize(vWorld - uCam);

            vec2 atmoHit = raySphere(uAtmoR, ro, rd);
            if(atmoHit.y <= 0.0) discard;

            float dstTo = atmoHit.x;
            float dstThru = atmoHit.y;

            vec2 planetHit = raySphere(uPlanetR, ro, rd);
            if(planetHit.x > 0.0 && planetHit.x < dstTo + dstThru) {
                dstThru = planetHit.x - dstTo;
            }

            if(dstThru <= 0.0) discard;

            vec3 start = ro + rd * (dstTo + 0.01);
            float step = dstThru / float(STEPS);
            vec3 light = vec3(0.0);

            for(int i = 0; i < STEPS; i++) {
                vec3 p = start + rd * (float(i) + 0.5) * step;

                float sunLen = raySphere(uAtmoR, p, uSun).y;
                float sunDepth = optDepth(p, uSun, sunLen);

                vec2 shadowHit = raySphere(uPlanetR, p, uSun);
                if(shadowHit.x > 0.0 && shadowHit.x < sunLen) continue;

                float viewDepth = optDepth(start, rd, float(i) * step);
                vec3 trans = exp(-(sunDepth + viewDepth) * uScatter);
                float dens = density(p);
                light += dens * trans * uScatter * step;
            }

            float alpha = 1.0 - exp(-dstThru * 0.05);
            gl_FragColor = vec4(light, alpha);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uCam: { value: camera.position },
        uScatter: { value: scatter },
        uPlanetR: { value: PLANET_RADIUS },
        uAtmoR: { value: PLANET_RADIUS + ATMO_HEIGHT },
        uFalloff: { value: 6 }
    },
    transparent: true,
    side: THREE.BackSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});
scene.add(new THREE.Mesh(atmoGeo, atmoMat));

// CLOUDS
// ============================================
const cloudGeo = new THREE.SphereGeometry(cloudOuterR + 1, 64, 64);
const cloudMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec3 vWorld, vRayO, vRayD;
        void main() {
            vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
            vRayO = cameraPosition;
            vRayD = vWorld - cameraPosition;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        ${GLSL_NOISE}
        uniform vec3 uSun;
        uniform float uTime, uPlanetR, uInnerR, uOuterR, uDensity;
        varying vec3 vWorld, vRayO, vRayD;

        #define STEPS 24
        #define LSTEPS 5

        vec2 raySphere(float r, vec3 ro, vec3 rd) {
            float b = dot(ro, rd);
            float c = dot(ro, ro) - r * r;
            float d = b * b - c;
            if(d < 0.0) return vec2(-1.0, -1.0);
            float s = sqrt(d);
            return vec2(-b - s, -b + s);
        }

        float sampleCloud(vec3 p) {
            vec3 sp = normalize(p);
            float alt = length(p) - uPlanetR;
            float cloudBase = uInnerR - uPlanetR;
            float cloudTop = uOuterR - uPlanetR;
            float hFrac = clamp((alt - cloudBase) / (cloudTop - cloudBase), 0.0, 1.0);

            // Height falloff - dense in middle, fade at edges
            float hFall = smoothstep(0.0, 0.25, hFrac) * smoothstep(1.0, 0.75, hFrac);

            // Less clouds at poles
            float latMask = smoothstep(0.8, 0.4, abs(sp.y));

            // Simple FBM noise for cloud shape
            vec3 pos = sp * 4.0 + vec3(uTime * 0.012, 0.0, uTime * 0.008);
            float n = fbm(pos, 5);
            n = smoothstep(0.0, 0.6, n); // Coverage control

            return n * hFall * latMask * uDensity;
        }

        float lightMarch(vec3 position) {
            // Sebastian Lague's light march with darkness threshold
            float totalDensity = 0.0;
            float stepSize = 2.0; // Fixed step towards sun
            float lightAbsorptionTowardSun = 1.5;
            float darknessThreshold = 0.2;

            for(int i = 0; i < LSTEPS; i++) {
                position += uSun * stepSize;
                float alt = length(position) - uPlanetR;
                float cloudBase = uInnerR - uPlanetR;
                float cloudTop = uOuterR - uPlanetR;
                if(alt < cloudBase || alt > cloudTop) break;
                totalDensity += max(0.0, sampleCloud(position) * stepSize);
            }

            float transmittance = exp(-totalDensity * lightAbsorptionTowardSun);
            // Never fully dark (Sebastian's trick)
            return darknessThreshold + transmittance * (1.0 - darknessThreshold);
        }

        void main() {
            vec3 rd = normalize(vRayD);
            vec3 ro = vRayO;

            vec2 outer = raySphere(uOuterR, ro, rd);

            if(outer.y < 0.0) discard;

            // One continuous march segment: enter the outer cloud shell (0 if the
            // camera is already inside it) and exit it, then clamp to the planet.
            // The cloud altitude band is handled by the density falloff, so there is
            // no camera-radius branch to jump when the car changes elevation. That
            // branch switching was what made the clouds pop in and out while driving.
            float start = max(0.0, outer.x);
            float end = outer.y;

            vec2 planet = raySphere(uPlanetR, ro, rd);
            if(planet.x > 0.0 && planet.x < end) {
                end = planet.x;
            }

            if(start >= end) discard;

            // Sebastian Lague's approach
            float stepSize = (end - start) / float(STEPS);
            float transmittance = 1.0;
            float lightEnergy = 0.0;

            // Constants
            float lightAbsorptionThroughCloud = 0.8;
            float lightAbsorptionTowardSun = 1.2;
            float darknessThreshold = 0.15;

            // Sun color
            vec3 sunCol = mix(vec3(1.0,0.6,0.4), vec3(1.0,0.98,0.95), smoothstep(-0.1, 0.3, uSun.y));

            // Phase function (forward scattering)
            float cosAngle = dot(rd, uSun);
            float phaseVal = 0.5 + 0.5 * cosAngle * cosAngle;

            float dstTravelled = 0.0;
            for(int i = 0; i < STEPS; i++) {
                if(transmittance < 0.01) break;

                vec3 rayPos = ro + rd * (start + dstTravelled);
                float density = sampleCloud(rayPos);

                if(density > 0.0) {
                    // Light march towards sun
                    float lightTransmittance = lightMarch(rayPos);

                    // Accumulate light energy (Sebastian's formula)
                    lightEnergy += density * stepSize * transmittance * lightTransmittance * phaseVal;

                    // Beer's law for view ray
                    transmittance *= exp(-density * stepSize * lightAbsorptionThroughCloud);
                }

                dstTravelled += stepSize;
            }

            if(transmittance > 0.99) discard;

            // Final cloud color (Sebastian's blend)
            vec3 cloudCol = lightEnergy * sunCol;

            // Output clouds blend over background via transmittance
            gl_FragColor = vec4(cloudCol, 1.0 - transmittance);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uInnerR: { value: cloudInnerR },
        uOuterR: { value: cloudOuterR },
        uDensity: { value: 0.8 }
    },
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    // Clouds are raymarched on a proxy sphere the camera sits INSIDE, so the proxy's
    // far-hemisphere fragments land behind the planet and a depth test kills them
    // wherever the planet is visible -> clouds pop out as the car moves. The shader
    // already clamps the march to the planet surface (end = planet.x), so disabling
    // the geometry depth test is both the fix and correct.
    depthTest: false
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);

// Cloud occlusion material - renders black where clouds exist, transparent where holes
const cloudOcclusionMat = new THREE.ShaderMaterial({
    vertexShader: cloudMat.vertexShader,
    fragmentShader: `
        ${GLSL_NOISE}
        uniform float uTime, uPlanetR, uInnerR, uOuterR, uDensity;
        varying vec3 vWorld, vRayO, vRayD;

        // Simplified cloud sampling for occlusion (fast)
        vec2 raySphere(float r, vec3 ro, vec3 rd) {
            float b = dot(ro, rd);
            float c = dot(ro, ro) - r * r;
            float d = b * b - c;
            if(d < 0.0) return vec2(-1.0, -1.0);
            float s = sqrt(d);
            return vec2(-b - s, -b + s);
        }

        void main() {
            vec3 rd = normalize(vRayD);
            vec3 ro = vRayO;

            vec2 outer = raySphere(uOuterR, ro, rd);

            if(outer.y < 0.0) discard;

            float start = max(0.0, outer.x);
            float end = outer.y;
            if(start >= end) discard;

            // Quick density estimation (fewer samples for occlusion)
            float totalDensity = 0.0;
            float stepSize = (end - start) / 8.0;
            vec3 windOffset = vec3(uTime * 0.12, uTime * 0.04, uTime * 0.08);

            for(int i = 0; i < 8; i++) {
                float t = start + (float(i) + 0.5) * stepSize;
                vec3 p = ro + rd * t;
                float r = length(p);
                float alt = r - uPlanetR;
                float cloudBase = uInnerR - uPlanetR;
                float cloudTop = uOuterR - uPlanetR;
                float hFrac = clamp((alt - cloudBase) / (cloudTop - cloudBase), 0.0, 1.0);
                float hFall = smoothstep(0.0, 0.3, hFrac) * smoothstep(1.0, 0.65, hFrac);

                vec3 basePos = p * 0.04 + windOffset;
                float coverage = fbm(basePos, 2) * 0.5 + 0.5;
                coverage = smoothstep(0.4, 0.6, coverage);

                totalDensity += coverage * hFall * stepSize * uDensity;
            }

            float alpha = 1.0 - exp(-totalDensity * 2.0);
            if(alpha < 0.05) discard;

            // Black where clouds, transparent where holes
            gl_FragColor = vec4(0.0, 0.0, 0.0, alpha);
        }
    `,
    uniforms: {
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uInnerR: { value: cloudInnerR },
        uOuterR: { value: cloudOuterR },
        uDensity: { value: 3.0 }
    },
    transparent: true,
    side: THREE.BackSide,
    depthWrite: false
});

// God rays shader - radial blur from sun position
const godRaysShader = {
    uniforms: {
        tDiffuse: { value: null },
        tOcclusion: { value: null },
        uSunScreenPos: { value: new THREE.Vector2(0.5, 0.5) },
        uExposure: { value: 0.35 },
        uDecay: { value: 0.96 },
        uDensity: { value: 0.85 },
        uWeight: { value: 0.45 },
        uSunVisible: { value: 1.0 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform sampler2D tOcclusion;
        uniform vec2 uSunScreenPos;
        uniform float uExposure, uDecay, uDensity, uWeight, uSunVisible;
        varying vec2 vUv;

        #define NUM_SAMPLES 50

        void main() {
            // Base scene color
            vec4 sceneColor = texture2D(tDiffuse, vUv);

            // God rays from occlusion map
            vec2 uv = vUv;
            vec2 delta = (uv - uSunScreenPos) * uDensity / float(NUM_SAMPLES);

            float illumination = 1.0;
            vec3 godRays = vec3(0.0);

            for(int i = 0; i < NUM_SAMPLES; i++) {
                uv -= delta;
                if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) break;
                vec3 samp = texture2D(tOcclusion, uv).rgb;
                samp *= illumination * uWeight;
                godRays += samp;
                illumination *= uDecay;
            }

            // Sun color (warm)
            vec3 sunColor = vec3(1.0, 0.9, 0.7);
            godRays *= sunColor * uExposure * uSunVisible;

            gl_FragColor = vec4(sceneColor.rgb + godRays, 1.0);
        }
    `
};

// Helper to compute sun screen position
function getSunScreenPos() {
    const sunWorldPos = sunMesh.position.clone();
    sunWorldPos.project(camera);

    // Check if sun is in front of camera
    const sunDir3D = sunMesh.position.clone().sub(camera.position).normalize();
    const camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const dotProduct = sunDir3D.dot(camForward);

    return {
        x: (sunWorldPos.x + 1) / 2,
        y: (sunWorldPos.y + 1) / 2,
        visible: dotProduct > 0 && sunWorldPos.x > -1 && sunWorldPos.x < 1 && sunWorldPos.y > -1 && sunWorldPos.y < 1
    };
}

        Math.sin(phi) * Math.cos(theta),

        });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        crystal.position.copy(dir.multiplyScalar(h + 1));
        crystal.userData = { baseH: h + 1, got: false };
        crystal.castShadow = true;
        crystals.push(crystal);
        scene.add(crystal);
    } else {
        i--;
    }
}
document.getElementById('total').textContent = crystals.length;

function updateCrystals(dt) {
    const t = performance.now() * 0.001;
    crystals.forEach((c, i) => {
        if (c.userData.got) return;
        c.rotation.y += dt * 2;
        const d = c.position.clone().normalize();
        c.position.copy(d.multiplyScalar(c.userData.baseH + Math.sin(t * 2 + i) * 0.2));
        if (rover.mesh.position.distanceTo(c.position) < 1.2) {
            c.userData.got = true;
            c.visible = false;
            collected++;
            document.getElementById('collected').textContent = collected;
        }
    });
}

        this.rollingResistance = 0.01; // FIXED: Less rolling resistance

        this.wheels = [
            { pos: new THREE.Vector3(-this.trackWidth/2, 0.1, this.wheelbase/2), compression: 0, prevCompression: 0, grounded: false, steer: true },
            { pos: new THREE.Vector3(this.trackWidth/2, 0.1, this.wheelbase/2), compression: 0, prevCompression: 0, grounded: false, steer: true },
            { pos: new THREE.Vector3(-this.trackWidth/2, 0.1, -this.wheelbase/2), compression: 0, prevCompression: 0, grounded: false, steer: false },
            { pos: new THREE.Vector3(this.trackWidth/2, 0.1, -this.wheelbase/2), compression: 0, prevCompression: 0, grounded: false, steer: false }
        ];

        this.createMesh();
        this.spawn();
        scene.add(this.mesh);
    }

    createMesh() {
        this.mesh = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 1.6);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.5, metalness: 0.4 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        body.castShadow = true;
        body.receiveShadow = true;
        this.mesh.add(body);

        const cabinGeo = new THREE.BoxGeometry(1.0, 0.5, 0.85);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.6 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.05, -0.1);
        cabin.castShadow = true;
        cabin.receiveShadow = true;
        this.mesh.add(cabin);

        this.wheelMeshes = [];
        const wheelGeo = new THREE.CylinderGeometry(this.wheelRadius, this.wheelRadius, this.wheelWidth, 32);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });

        this.wheels.forEach(() => {
            const wheelGroup = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, wheelMat);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            wheelGroup.add(tire);
            this.wheelMeshes.push(wheelGroup);
            this.mesh.add(wheelGroup);
        });

        const lightGeo = new THREE.CircleGeometry(0.09, 16);
        const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffee, emissiveIntensity: 2.5 });
        [-0.42, 0.42].forEach(x => {
            const light = new THREE.Mesh(lightGeo, lightMat);
            light.position.set(x, 0.4, 0.85);
            this.mesh.add(light);
        });
    }

    spawn() {
        console.log('Spawning rover...');

        // FIXED: Find a spot on LAND, not ocean!
        let spawnDir, h, attempts = 0;

        do {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            spawnDir = new THREE.Vector3(
                Math.sin(phi) * Math.cos(theta),
                Math.cos(phi),
                Math.sin(phi) * Math.sin(theta)
            );

            const testPos = spawnDir.clone().multiplyScalar(PLANET_RADIUS);
            h = terrainHeight(testPos);

            // Safety check
            if (isNaN(h)) {
                console.warn('terrainHeight returned NaN, trying different position');
                attempts++;
                continue;
            }

            const biome = getBiome(testPos);

            // Keep trying until we find land (not ocean)
            if (biome !== 'Ocean' && h > PLANET_RADIUS + 0.5) {
                break;
            }
            attempts++;
        } while (attempts < 50);

        // If no good spot found, use a safe default
        if (attempts >= 50 || isNaN(h)) {
            console.warn('Could not find good spawn, using default');
            spawnDir = new THREE.Vector3(1, 0, 0).normalize();
            h = PLANET_RADIUS + 3;
        }

        // Place rover just above ground (not too high!)
        this.position.copy(spawnDir.multiplyScalar(h + 0.8));

        // Verify position is valid
        if (isNaN(this.position.x)) {
            console.error('Spawn position is NaN! Using emergency position');
            this.position.set(PLANET_RADIUS + 5, 0, 0);
        }

        this.velocity.set(0, 0, 0);
        this.angularVelocity.set(0, 0, 0);

        const up = this.position.clone().normalize();
        const forward = new THREE.Vector3(1, 0, 0).cross(up).normalize();

        // If forward is zero vector, use a different seed
        if (forward.lengthSq() < 0.01) {
            forward.set(0, 1, 0).cross(up).normalize();
        }

        const right = up.clone().cross(forward).normalize();

        const rotMat = new THREE.Matrix4();
        rotMat.makeBasis(right, up, forward);
        this.quaternion.setFromRotationMatrix(rotMat);

        // Verify quaternion
        if (isNaN(this.quaternion.x)) {
            console.error('Quaternion is NaN! Using identity');
            this.quaternion.identity();
        }

        this.rpm = 0;
        this.boost = 1.0;

        console.log('Spawned at altitude:', (this.position.length() - h).toFixed(2), 'm');
    }

    update(dt, input) {
        dt = Math.min(dt, 1/30); // Cap dt for stability

        // === GRAVITY-BASED RIGIDBODY PHYSICS ===
        // Car can jump off mountains and feel weight!

        const GRAVITY = 10; // m/s² - Earth-like gravity
        const GROUND_OFFSET = 0.5; // Car center height above ground when grounded

        // Direction toward planet center (gravity direction)
        const planetUp = this.position.clone().normalize();
        const gravityDir = planetUp.clone().negate(); // Points DOWN toward planet

        // Current car axes
        const carForward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.quaternion);
        const carRight = new THREE.Vector3(1, 0, 0).applyQuaternion(this.quaternion);
        const carUp = new THREE.Vector3(0, 1, 0).applyQuaternion(this.quaternion);

        // Check ground contact
        const terrainH = terrainHeight(this.position);
        const altitude = this.position.length() - terrainH;
        const grounded = altitude < GROUND_OFFSET + 0.1; // Small tolerance

        // Count grounded wheels for HUD
        let groundedWheels = grounded ? 4 : 0;

        // === APPLY GRAVITY (always) ===
        this.velocity.addScaledVector(gravityDir, GRAVITY * dt);

        // === GROUND COLLISION ===
        if (altitude < GROUND_OFFSET) {
            // Push car up to ground level
            this.position.normalize().multiplyScalar(terrainH + GROUND_OFFSET);

            // Cancel velocity into ground
            const velIntoGround = -this.velocity.dot(planetUp);
            if (velIntoGround > 0) {
                this.velocity.addScaledVector(planetUp, velIntoGround);
            }
        }

        // === INPUT ===
        this.throttle = input.up ? 1.0 : 0;
        this.brake = input.down ? 1.0 : (input.space ? 2.0 : 0);
        const targetSteer = input.left ? this.maxSteerAngle : (input.right ? -this.maxSteerAngle : 0);
        this.steerAngle += (targetSteer - this.steerAngle) * dt * 8;

        // === GROUNDED PHYSICS ===
        if (grounded) {
            // Get terrain normal for alignment
            const terrainNorm = terrainNormal(this.position);

            // Build target orientation from terrain + current heading
            let surfaceForward = carForward.clone().sub(
                terrainNorm.clone().multiplyScalar(carForward.dot(terrainNorm))
            );
            if (surfaceForward.lengthSq() < 0.01) {
                surfaceForward.set(1, 0, 0).cross(terrainNorm);
            }
            surfaceForward.normalize();

            // Car's local Y should point UP (away from planet)
            // Mesh has wheels at Y=0.1, body at Y=0.6, cabin at Y=1.05
            // So +Y = up means wheels are lowest, cabin is highest = correct!
            // NOTE: terrainNormal() returns INWARD normal, so we negate to get OUTWARD
            const carUp = terrainNorm.clone().negate(); // Flip to point away from planet

            // Right-hand rule: up × forward = right (not forward × up which gives left!)
            const surfaceRight = carUp.clone().cross(surfaceForward).normalize();

            // Build quaternion: X=right, Y=up (away from planet), Z=forward
            const targetMatrix = new THREE.Matrix4().makeBasis(surfaceRight, carUp, surfaceForward);
            const targetQuat = new THREE.Quaternion().setFromRotationMatrix(targetMatrix);

            // Smooth alignment to terrain
            this.quaternion.slerp(targetQuat, Math.min(1, dt * 8));
            this.quaternion.normalize();

            // === REALISTIC TIRE PHYSICS ===

            // Update car axes
            const newForward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.quaternion);
            const newRight = new THREE.Vector3(1, 0, 0).applyQuaternion(this.quaternion);

            // Decompose velocity into forward/lateral components
            const forwardSpeed = this.velocity.dot(newForward);
            const lateralSpeed = this.velocity.dot(newRight);

            // === SLIP ANGLE TIRE MODEL ===
            // Slip angle = angle between tire direction and velocity direction
            // Tires generate lateral force based on slip angle
            let slipAngle = 0;
            if (this.speed > 0.5) {
                slipAngle = Math.atan2(lateralSpeed, Math.abs(forwardSpeed));
            }

            // Tire grip curve peaks around 8-12 degrees, then falls off (sliding)
            // Simplified Pacejka-like curve
            const maxGrip = 60; // Maximum lateral acceleration - HIGH for sticky tires
            const peakSlip = 0.12; // ~7 degrees - quicker grip response
            const slipRatio = Math.abs(slipAngle) / peakSlip;

            // Grip multiplier: 1.0 at peak, falls off beyond
            let gripMult;
            if (slipRatio < 1.0) {
                gripMult = slipRatio; // Linear rise to peak
            } else {
                gripMult = 1.0 / slipRatio; // Falls off when sliding
            }

            // Apply lateral tire force (corrects slip)
            const lateralForce = -Math.sign(lateralSpeed) * maxGrip * gripMult * dt;
            this.velocity.addScaledVector(newRight, lateralForce);

            // === SPEED-DEPENDENT STEERING ===
            // Less steering authority at high speed (realistic)
            // Minimal speed penalty for steering
            const steerAuthority = 1.0 / (1.0 + this.speed * 0.015);

            if (Math.abs(this.steerAngle) > 0.01 && this.speed > 0.3) {
                // Much stronger turning
                const yawAmount = this.steerAngle * this.speed * 0.25 * steerAuthority * dt;
                const yawQuat = new THREE.Quaternion().setFromAxisAngle(carUp, yawAmount);
                this.quaternion.premultiply(yawQuat);
                this.quaternion.normalize();
            }

            // === ENGINE / THROTTLE ===
            let boostMult = 1.0;
            if (input.shift && this.boost > 0) {
                boostMult = 1.6;
                this.boost = Math.max(0, this.boost - dt * 0.35);
            } else {
                this.boost = Math.min(1, this.boost + dt * 0.15);
            }

            if (this.throttle > 0) {
                // Acceleration decreases at high speed (air resistance + power limit)
                const powerFactor = Math.max(0.2, 1.0 - this.speed / 50);
                this.velocity.addScaledVector(newForward, 18 * boostMult * powerFactor * dt);
            }

            // === BRAKING ===
            if (this.brake > 0) {
                const brakePower = this.brake * 35 * dt; // Strong brakes
                const brakeForce = Math.min(brakePower, this.speed);
                if (this.speed > 0.1) {
                    this.velocity.addScaledVector(this.velocity.clone().normalize(), -brakeForce);
                }
            }

            // === ROLLING RESISTANCE + ENGINE BRAKING ===
            // Much stronger when not accelerating!
            if (this.throttle === 0 && this.brake === 0) {
                // Engine braking + rolling resistance = significant slowdown
                const drag = Math.min(8 * dt, this.speed); // Stronger deceleration
                if (this.speed > 0.1) {
                    this.velocity.addScaledVector(this.velocity.clone().normalize(), -drag);
                } else {
                    this.velocity.set(0, 0, 0); // Stop completely at low speed
                }
            } else {
                // Light rolling resistance when driving
                this.velocity.multiplyScalar(1 - 0.5 * dt);
            }
        } else {
            // AIRBORNE: slower rotation, no friction
            this.boost = Math.min(1, this.boost + dt * 0.1);
            groundedWheels = 0;

            // Air resistance only
            this.velocity.multiplyScalar(1 - 0.1 * dt);
        }

        // Update wheel grounded status for HUD
        this.wheels.forEach(w => w.grounded = grounded);

        // === INTEGRATE POSITION ===
        this.position.addScaledVector(this.velocity, dt);

        // Speed for HUD
        this.speed = this.velocity.length();

        // Speed limit
        if (this.speed > 40) {
            this.velocity.normalize().multiplyScalar(40);
            this.speed = 40;
        }

        // Safety respawn if fell through planet or NaN
        if (this.position.length() < terrainH - 5 || isNaN(this.position.x)) {
            this.spawn();
            return;
        }

        // STEP 7: Update visuals
        this.mesh.position.copy(this.position);
        this.mesh.quaternion.copy(this.quaternion);

        // Animate wheels
        this.wheels.forEach((wheel, i) => {
            const wheelMesh = this.wheelMeshes[i];
            wheelMesh.position.copy(wheel.pos);
            if (this.speed > 0.1) {
                wheelMesh.children.forEach(child => {
                    child.rotation.x += this.speed * dt * 3;
                });
            }
            if (wheel.steer) {
                wheelMesh.rotation.y = this.steerAngle;
            }
        });

        // Update HUD
        const biome = getBiome(this.position);
        const currentTerrainH = terrainHeight(this.position);
        const displayAltitude = this.position.length() - currentTerrainH;
        const currentUp = new THREE.Vector3(0, 1, 0).applyQuaternion(this.quaternion);
        const currentPlanetUp = this.position.clone().normalize();
        const rollAngle = Math.acos(Math.max(-1, Math.min(1, currentUp.dot(currentPlanetUp)))) * 180 / Math.PI;
        const groundedCount = this.wheels.filter(w => w.grounded).length;

        document.getElementById('speed').textContent = this.speed.toFixed(1);
        document.getElementById('altitude').textContent = displayAltitude.toFixed(2);
        document.getElementById('biome').textContent = biome;
        document.getElementById('wheels').textContent = `${groundedCount}/4`;
        document.getElementById('roll').textContent = rollAngle.toFixed(1);
        document.getElementById('boost-fill').style.width = (this.boost * 100) + '%';
    }

    reset() { this.spawn(); }
}

// ============================================
// CAMERA (FIXED: Uses planetUp for stable horizon)
// ============================================
class CameraController {
    constructor(target) {
        this.target = target;
        this.smoothLookDir = null;
    }

    update(dt) {
        // Safety check
        if (isNaN(this.target.position.x) || isNaN(this.target.quaternion.x)) {
            console.error('Camera target has NaN!');
            return;
        }

        // KEY FIX: Use planet up, not car up
        const planetUp = this.target.position.clone().normalize();
        const carForward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.target.quaternion);

        // Project car forward onto planet surface plane (remove any pitch/roll)
        let surfaceForward = carForward.clone()
            .sub(planetUp.clone().multiplyScalar(carForward.dot(planetUp)));
        if (surfaceForward.lengthSq() > 0.01) {
            surfaceForward.normalize();
        } else {
            // Fallback if car pointing straight up/down
            surfaceForward = new THREE.Vector3(1, 0, 0).cross(planetUp).normalize();
        }

        // For Mario Kart feel: blend toward velocity direction when moving
        let lookDir = surfaceForward;
        if (this.target.speed > 2) {
            const velDir = this.target.velocity.clone();
            // Project velocity onto surface plane
            const surfaceVel = velDir.clone()
                .sub(planetUp.clone().multiplyScalar(velDir.dot(planetUp)));
            if (surfaceVel.lengthSq() > 0.5) {
                lookDir = surfaceVel.normalize();
            }
        }

        // Smooth look direction (slower for smooth turning)
        if (!this.smoothLookDir) this.smoothLookDir = lookDir.clone();
        this.smoothLookDir.lerp(lookDir, dt * 3);
        if (this.smoothLookDir.lengthSq() > 0.01) {
            this.smoothLookDir.normalize();
        }

        // Camera position behind and above (relative to planet surface)
        let idealPos = this.target.position.clone()
            .add(this.smoothLookDir.clone().multiplyScalar(-16))  // Behind
            .add(planetUp.clone().multiplyScalar(6));             // Above (still below clouds at alt 60)

        // Ensure camera doesn't go below terrain
        const camTerrainH = terrainHeight(idealPos);
        if (idealPos.length() < camTerrainH + 2.0) {
            idealPos.normalize().multiplyScalar(camTerrainH + 2.0);
        }

        // If camera too far from ideal, snap immediately (fixes startup)
        const distToIdeal = camera.position.distanceTo(idealPos);
        if (distToIdeal > 50) {
            camera.position.copy(idealPos);
        } else {
            camera.position.lerp(idealPos, dt * 4);
        }

        // Look at car
        camera.lookAt(this.target.position);

        // KEY FIX: Camera up = planet up (fast lerp for stable horizon)
        camera.up.lerp(planetUp, dt * 8);
        camera.up.normalize();
    }
}

// ============================================
// INPUT
// ============================================
const input = { up: false, down: false, left: false, right: false, space: false, shift: false };

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp') input.up = true;
    if (e.code === 'ArrowDown') input.down = true;
    if (e.code === 'ArrowLeft') input.left = true;
    if (e.code === 'ArrowRight') input.right = true;
    if (e.code === 'Space') { input.space = true; e.preventDefault(); }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.shift = true;
    if (e.code === 'KeyR') rover.reset();
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp') input.up = false;
    if (e.code === 'ArrowDown') input.down = false;
    if (e.code === 'ArrowLeft') input.left = false;
    if (e.code === 'ArrowRight') input.right = false;
    if (e.code === 'Space') input.space = false;
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.shift = false;
});

// ============================================
// INIT & LOOP
// ============================================
const rover = new Rover();
const cameraController = new CameraController(rover);

// FIXED: Position camera immediately on startup!
function initCamera() {
    const carUp = new THREE.Vector3(0, 1, 0).applyQuaternion(rover.quaternion);
    const carBack = new THREE.Vector3(0, 0, -1).applyQuaternion(rover.quaternion);

    const camPos = rover.position.clone()
        .add(carBack.clone().multiplyScalar(18))
        .add(carUp.clone().multiplyScalar(10));

    camera.position.copy(camPos);
    camera.lookAt(rover.position);
    camera.up.copy(carUp);

    console.log('Camera initial position:', camera.position.length().toFixed(2), 'm from center');
    console.log('Rover position:', rover.position.length().toFixed(2), 'm from center');
}

initCamera();

// Render immediately to avoid blue screen
renderer.render(scene, camera);

let timeOfDay = 0.6;
let cloudDensity = 0.8; // Lighter, more transparent clouds
let autoTimeEnabled = true; // Animated day/night cycle
const DAY_CYCLE_SPEED = 0.015; // Full day in ~67 seconds

function updateSun(t) {
    timeOfDay = t;
    const a = t * Math.PI * 2;
    // Proper circular orbit with 23° axial tilt
    const tilt = 0.4; // ~23 degrees
    sunDir.set(
        Math.cos(a),
        Math.sin(a) * Math.sin(tilt),
        Math.sin(a) * Math.cos(tilt)
    ).normalize();
    sunMesh.position.copy(sunDir.clone().multiplyScalar(250));
}

// Shadow camera follows car for proper shadows on spherical planet
function updateShadows() {
    // Position light relative to car, pointing toward it from sun direction
    sunLight.target.position.copy(rover.position);
    sunLight.position.copy(rover.position).add(sunDir.clone().multiplyScalar(60));
    sunLight.shadow.camera.updateProjectionMatrix();
}

document.getElementById('sT').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('vT').textContent = v.toFixed(2);
    timeOfDay = v;
    updateSun(v);
    autoTimeEnabled = false; // Pause auto cycle when manually adjusting
});

// Double-click slider to resume auto cycle
document.getElementById('sT').addEventListener('dblclick', () => {
    autoTimeEnabled = true;
});

document.getElementById('sC').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('vC').textContent = v.toFixed(1);
    cloudDensity = v;
    cloudMesh.material.uniforms.uDensity.value = v;
});

let lastTime = performance.now();
let frameCount = 0;
let fpsTime = 0;
let currentFps = 0;

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // FPS counter
    frameCount++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
        currentFps = Math.round(frameCount / fpsTime);
        document.getElementById('fps').textContent = currentFps;
        frameCount = 0;
        fpsTime = 0;
    }

    // Animated day/night cycle (planet orbits sun)
    if (autoTimeEnabled) {
        timeOfDay = (timeOfDay + dt * DAY_CYCLE_SPEED) % 1.0;
        updateSun(timeOfDay);
        document.getElementById('sT').value = timeOfDay;
        document.getElementById('vT').textContent = timeOfDay.toFixed(2);
    }

    rover.update(dt, input);
    updateCrystals(dt);
    cameraController.update(dt);
    updateShadows(); // Shadow camera follows car

    // Ocean: step the water physics. A moving car in water stamps a wake impulse.
    const tsec = now * 0.001;
    const carDir = rover.position.clone().normalize();
    const inWater = rover.position.length() < seaRadius + 0.4;
    dirToUV(carDir, carUV);
    const carStamp = (inWater && rover.speed > 1.0) ? Math.min(0.03, rover.speed * 0.003) : 0.0;
    stepWater(carStamp);
    oceanMat.uniforms.uTime.value = tsec;
    oceanMat.uniforms.uSun.value = sunDir;
    atmoMat.uniforms.uCam.value.copy(camera.position);
    atmoMat.uniforms.uSun.value = sunDir;
    cloudMesh.material.uniforms.uTime.value = now * 0.001;
    cloudMesh.material.uniforms.uSun.value = sunDir;

    if (godRaysEnabled) {
        // Get sun screen position
        const sunScreen = getSunScreenPos();
        godRaysMaterial.uniforms.uSunScreenPos.value.set(sunScreen.x, sunScreen.y);
        godRaysMaterial.uniforms.uSunVisible.value = sunScreen.visible ? 1.0 : 0.0;

        // Pass 1: Render scene normally
        renderer.setRenderTarget(sceneRT);
        renderer.render(scene, camera);

        // Pass 2: Render occlusion (sun bright, clouds with holes, rest black)
        // Temporarily swap materials
        const originalMaterials = new Map();
        scene.traverse(obj => {
            if (obj.isMesh && obj !== sunMesh) {
                originalMaterials.set(obj, obj.material);
                // Cloud mesh uses special occlusion material with transparency
                if (obj === cloudMesh) {
                    cloudOcclusionMat.uniforms.uTime.value = cloudMesh.material.uniforms.uTime.value;
                    cloudOcclusionMat.uniforms.uDensity.value = cloudMesh.material.uniforms.uDensity.value;
                    obj.material = cloudOcclusionMat;
                } else {
                    obj.material = occlusionMat;
                }
            }
        });

        renderer.setRenderTarget(occlusionRT);
        renderer.render(scene, camera);

        // Restore materials
        originalMaterials.forEach((mat, obj) => {
            obj.material = mat;
        });

        // Pass 3: Apply god rays and composite
        godRaysMaterial.uniforms.tDiffuse.value = sceneRT.texture;
        godRaysMaterial.uniforms.tOcclusion.value = occlusionRT.texture;

        renderer.setRenderTarget(null);
        renderer.render(godRaysScene, godRaysCamera);
    } else {
        renderer.render(scene, camera);
    }
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Resize god rays render targets
    sceneRT.setSize(window.innerWidth, window.innerHeight);
    occlusionRT.setSize(window.innerWidth / 2, window.innerHeight / 2);
});

animate();
