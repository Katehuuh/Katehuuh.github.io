<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================
// CONFIG
// ============================================
const PLANET_RADIUS = 50;
const PLANET_MASS = 1000000;
const G = 6.674e-11 * 5e9;
const ATMO_HEIGHT = 12;
// Cloud layer sits well above the max camera radius (~62) and tallest peaks (~56)
// so the camera is never inside it -> clouds always read as distant sky, never in
// front of nearby terrain/car.
const CLOUD_BASE = 16;
const CLOUD_THICK = 4;
// Sea level as a terrain-elevation threshold. Terrain floor is clamped to elev>=0,
// so the water surface must sit ABOVE 0 to be visible in basins (was buried before).
const SEA_LEVEL = 0.35;
const seaRadius = PLANET_RADIUS + SEA_LEVEL;

// ============================================
// NOISE
// ============================================
class Noise {
    constructor(seed = 12345) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        let s = seed;
        for (let i = 255; i > 0; i--) {
            s = (s * 16807) % 2147483647;
            const j = s % (i + 1);
            [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
    }

    noise3D(x, y, z) {
        const F3 = 1/3, G3 = 1/6;
        let s = (x + y + z) * F3;
        let i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        let t = (i + j + k) * G3;
        let x0 = x - (i - t), y0 = y - (j - t), z0 = z - (k - t);
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
            if (y0 >= z0) { i1=1;j1=0;k1=0;i2=1;j2=1;k2=0; }
            else if (x0 >= z0) { i1=1;j1=0;k1=0;i2=1;j2=0;k2=1; }
            else { i1=0;j1=0;k1=1;i2=1;j2=0;k2=1; }
        } else {
            if (y0 < z0) { i1=0;j1=0;k1=1;i2=0;j2=1;k2=1; }
            else if (x0 < z0) { i1=0;j1=1;k1=0;i2=0;j2=1;k2=1; }
            else { i1=0;j1=1;k1=0;i2=1;j2=1;k2=0; }
        }
        let x1=x0-i1+G3,y1=y0-j1+G3,z1=z0-k1+G3;
        let x2=x0-i2+2*G3,y2=y0-j2+2*G3,z2=z0-k2+2*G3;
        let x3=x0-1+3*G3,y3=y0-1+3*G3,z3=z0-1+3*G3;
        let ii=i&255,jj=j&255,kk=k&255;
        const grad=(h,x,y,z)=>{h&=15;let u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);};
        let n0=0,n1=0,n2=0,n3=0;
        let t0=0.6-x0*x0-y0*y0-z0*z0;if(t0>0){t0*=t0;n0=t0*t0*grad(this.perm[ii+this.perm[jj+this.perm[kk]]],x0,y0,z0);}
        let t1=0.6-x1*x1-y1*y1-z1*z1;if(t1>0){t1*=t1;n1=t1*t1*grad(this.perm[ii+i1+this.perm[jj+j1+this.perm[kk+k1]]],x1,y1,z1);}
        let t2=0.6-x2*x2-y2*y2-z2*z2;if(t2>0){t2*=t2;n2=t2*t2*grad(this.perm[ii+i2+this.perm[jj+j2+this.perm[kk+k2]]],x2,y2,z2);}
        let t3=0.6-x3*x3-y3*y3-z3*z3;if(t3>0){t3*=t3;n3=t3*t3*grad(this.perm[ii+1+this.perm[jj+1+this.perm[kk+1]]],x3,y3,z3);}
        return 32*(n0+n1+n2+n3);
    }

    fbm(x, y, z, oct = 5) {
        let v = 0, a = 0.5, f = 1;
        for (let i = 0; i < oct; i++) { v += a * this.noise3D(x*f, y*f, z*f); a *= 0.5; f *= 2; }
        return v;
    }
}

const noise = new Noise(42);

const GLSL_NOISE = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0);
    const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)),x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz),l=1.0-g,i1=min(g,l.zxy),i2=max(g,l.zxy);
    vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
    i=mod(i,289.0);
    vec4 p=permute(permute(permute(i.z+vec4(0,i1.z,i2.z,1))+i.y+vec4(0,i1.y,i2.y,1))+i.x+vec4(0,i1.x,i2.x,1));
    float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z),y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy,y=y_*ns.x+ns.yyyy,h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0,s1=floor(b1)*2.0+1.0,sh=-step(h,vec4(0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
    m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p,int o){float v=0.0,a=0.5;for(int i=0;i<6;i++){if(i>=o)break;v+=a*snoise(p);p*=2.0;a*=0.5;}return v;}
`;

// ============================================
// TERRAIN
// ============================================
function terrainElev(dir) {
    const p = dir.clone().multiplyScalar(3);
    let e = noise.fbm(p.x * 0.8, p.y * 0.8, p.z * 0.8, 5) * 0.5;
    const m = noise.fbm(p.x * 1.5 + 10, p.y * 1.5 + 10, p.z * 1.5 + 10, 6);
    e += Math.pow(Math.max(0, m), 2.5) * 1.2;
    e += noise.fbm(p.x * 3, p.y * 3, p.z * 3, 4) * 0.15;
    return Math.max(0, e) * 4;
}

function terrainHeight(pos) {
    return PLANET_RADIUS + terrainElev(pos.clone().normalize());
}

function terrainNormal(pos) {
    const eps = 0.05;
    const dir = pos.clone().normalize();
    let t1 = new THREE.Vector3(0, 1, 0).cross(dir);
    if (t1.lengthSq() < 0.001) t1 = new THREE.Vector3(1, 0, 0).cross(dir);
    t1.normalize();
    const t2 = dir.clone().cross(t1).normalize();
    const h0 = terrainHeight(pos);
    const h1 = terrainHeight(pos.clone().add(t1.clone().multiplyScalar(eps)));
    const h2 = terrainHeight(pos.clone().add(t2.clone().multiplyScalar(eps)));
    const v1 = t1.clone().multiplyScalar(eps).add(dir.clone().multiplyScalar(h1 - h0));
    const v2 = t2.clone().multiplyScalar(eps).add(dir.clone().multiplyScalar(h2 - h0));
    return v2.cross(v1).normalize();
}

function getBiome(pos) {
    const dir = pos.clone().normalize();
    const lat = Math.abs(dir.y);
    const elev = terrainElev(dir);
    const moist = noise.fbm(dir.x * 3 + 50, dir.y * 3 + 50, dir.z * 3 + 50, 4) * 0.5 + 0.5;
    if (lat > 0.75) return 'Ice';
    if (elev < SEA_LEVEL) return 'Ocean';
    if (elev < SEA_LEVEL + 0.14) return 'Beach';
    if (elev > 3) return 'Mountain';
    if (moist < 0.3) return 'Desert';
    if (moist < 0.6) return 'Grassland';
    return 'Forest';
}

// ============================================
// SCENE
// ============================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
// Cap device pixel ratio: this scene is fragment-bound (ocean/cloud/atmosphere are
// per-pixel raymarchers), so on a 4K panel the difference between 1.75 and 2.0 is
// ~23% fewer pixels for no visible loss on high-DPI displays.
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============================================
// LIGHTING
// ============================================
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const sunDir = new THREE.Vector3(0.6, 0.3, 0.75).normalize();
const sunLight = new THREE.DirectionalLight(0xffffee, 1.2);
sunLight.position.copy(sunDir.clone().multiplyScalar(100));
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 120;
sunLight.shadow.camera.left = -40;
sunLight.shadow.camera.right = 40;
sunLight.shadow.camera.top = 40;
sunLight.shadow.camera.bottom = -40;
scene.add(sunLight);
scene.add(sunLight.target); // Required for shadow camera to follow target

function scatterCoeffs(strength) {
    return new THREE.Vector3(
        Math.pow(400 / 700, 4) * strength,
        Math.pow(400 / 530, 4) * strength,
        Math.pow(400 / 440, 4) * strength
    );
}
const scatter = scatterCoeffs(18);

// ============================================
// TERRAIN PLANET
// ============================================
const terrainGeo = new THREE.IcosahedronGeometry(PLANET_RADIUS, 80);
const positions = terrainGeo.attributes.position;
const colors = new Float32Array(positions.count * 3);

for (let i = 0; i < positions.count; i++) {
    const v = new THREE.Vector3(positions.getX(i), positions.getY(i), positions.getZ(i));
    const dir = v.clone().normalize();
    const elev = terrainElev(dir);

    v.normalize().multiplyScalar(PLANET_RADIUS + elev);
    positions.setXYZ(i, v.x, v.y, v.z);

    const biome = getBiome(v);
    let col = new THREE.Color();
    if (biome === 'Ice') col.setStyle('#e8f4f8');
    else if (biome === 'Ocean') {
        // sandy seabed in the shallows fading to deep blue-grey: through the
        // transparent turquoise water this reads as maldives lagoon
        const depth = Math.max(0, SEA_LEVEL - elev);
        col.setStyle('#cbbd8f').lerp(new THREE.Color('#0a3a4a'), Math.min(1, Math.pow(depth / 0.5, 0.7)));
    }
    else if (biome === 'Beach') col.setStyle('#d8c69a');
    else if (biome === 'Mountain') col.setStyle('#808080');
    else if (biome === 'Desert') col.setStyle('#d4a050');
    else if (biome === 'Grassland') col.setStyle('#4a8020');
    else col.setStyle('#2a6020');

    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.9,
    metalness: 0.1
});

const planet = new THREE.Mesh(terrainGeo, terrainMat);
planet.receiveShadow = true;
scene.add(planet);

// ============================================
// OCEAN  (GPU heightfield water physics + shoreline foam)
// ============================================
// Bake terrain elevation into an equirectangular texture so both the water sim and
// the ocean shader know exactly where the coastline is (GLSL snoise != JS simplex,
// so we cannot re-derive the terrain in-shader). R channel = elev/3.
function bakeHeightTexture(W, H) {
    const data = new Uint8Array(W * H * 4);
    const tmp = new THREE.Vector3();
    for (let y = 0; y < H; y++) {
        const lat = (y / (H - 1) - 0.5) * Math.PI;
        const cy = Math.cos(lat), sy = Math.sin(lat);
        for (let x = 0; x < W; x++) {
            const lon = (x / W - 0.5) * Math.PI * 2;
            tmp.set(cy * Math.cos(lon), sy, cy * Math.sin(lon));
            const e = Math.max(0, Math.min(1, terrainElev(tmp) / 3));
            const i = (y * W + x) * 4;
            data[i] = data[i + 1] = data[i + 2] = Math.round(e * 255);
            data[i + 3] = 255;
        }
    }
    const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    return tex;
}
const heightTex = bakeHeightTexture(512, 256);

// --- Interactive fluid simulation: local high-resolution "fluid patch" --------
// A 512x512 shallow-water solver with a real 2D velocity field, covering a PATCH_SIZE
// square of ocean that follows the car (0.08 world units per texel = wheel-scale
// detail, impossible at planet-wide resolution). State per texel:
//   R = surface height   G,B = tangent velocity   A = foam
// Velocity is advected semi-Lagrangian (stable-fluids), which is what makes stirred
// foam curl into swirls; height couples to velocity divergence, which is what makes
// waves radiate from the wheels and reflect off the shore. Splash droplets are
// emitted by high-energy CELLS of this field (read back via a tiny energy map),
// not by the car.
const PATCH_RES = 512, PATCH_SIZE = 40.0;
const _glctx = renderer.getContext();
let waterSimOK = renderer.capabilities.isWebGL2
    ? !!_glctx.getExtension('EXT_color_buffer_float')
    : (!!_glctx.getExtension('OES_texture_half_float') && !!_glctx.getExtension('WEBGL_color_buffer_float'));
const simRTopts = {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false, stencilBuffer: false
};
let simRTA = new THREE.WebGLRenderTarget(PATCH_RES, PATCH_RES, simRTopts);
let simRTB = new THREE.WebGLRenderTarget(PATCH_RES, PATCH_RES, simRTopts);
// flat fallback field when float render targets are unavailable
const flatSim = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
flatSim.needsUpdate = true;

// tangent frame the patch lives in: anchor point on the sphere + east/north axes.
// Patch coords: xy = (dot(p,E), dot(p,N)) in world units, uv = xy/PATCH_SIZE + 0.5.
const patchAnchor = new THREE.Vector3(1, 0, 0);
const patchE = new THREE.Vector3(0, 0, 1), patchN = new THREE.Vector3(0, 1, 0);
function buildPatchFrame(dir) {
    patchAnchor.copy(dir);
    patchE.set(0, 1, 0).cross(dir);
    if (patchE.lengthSq() < 1e-4) patchE.set(1, 0, 0);
    patchE.normalize();
    patchN.copy(dir).cross(patchE).normalize();
}

const SIM_COMMON = `
    uniform sampler2D uHeight;
    uniform vec3 uAnchor, uE, uN;
    uniform float uSeaElev;
    const float TEXEL = ${(1 / PATCH_RES).toFixed(8)};
    const float PSIZE = ${PATCH_SIZE.toFixed(1)};
    // patch uv -> unit sphere direction -> baked terrain elevation (land mask)
    vec3 uvToDir(vec2 uv){
        vec2 xy = (uv - 0.5) * PSIZE;
        return normalize(uAnchor * ${seaRadius.toFixed(2)} + uE * xy.x + uN * xy.y);
    }
    float terrAt(vec2 uv){
        vec3 d = uvToDir(uv);
        return texture2D(uHeight, vec2(atan(d.z, d.x) * 0.15915494 + 0.5,
                                       asin(clamp(d.y, -1.0, 1.0)) * 0.31830989 + 0.5)).r * 3.0;
    }
    float landAt(vec2 uv){ return step(uSeaElev, terrAt(uv)); }
`;

// Pass A: semi-Lagrangian advection of velocity + foam (this creates the swirls).
// Height is NOT advected (pipe-model SWE); it evolves through divergence in pass B.
const advectMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
        uniform sampler2D uPrev;
        uniform float uDt;
        varying vec2 vUv;
        const float PSIZE = ${PATCH_SIZE.toFixed(1)};
        void main(){
            vec4 s = texture2D(uPrev, vUv);
            vec2 back = vUv - s.gb * uDt / PSIZE;      // trace upstream
            vec4 a = texture2D(uPrev, back);
            gl_FragColor = vec4(s.r, a.gb * 0.999, a.a);
        }
    `,
    uniforms: { uPrev: { value: null }, uDt: { value: 1 / 60 } }
});

// Pass B: shallow-water forces + wheel stirring + foam generation + shore walls.
const forceMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
        ${SIM_COMMON}
        uniform sampler2D uPrev;
        uniform float uDt;
        uniform vec4 uWheel[4];   // xy = patch coords, zw = wheel velocity (patch axes)
        uniform vec4 uWheelP[4];  // x = radius, y = displaced volume, z = churn(foam), w = active
        uniform vec4 uWheelOld[4];// xy = last frame's patch coords
        varying vec2 vUv;
        void main(){
            if(landAt(vUv) > 0.5){ gl_FragColor = vec4(0.0); return; }
            vec4 s  = texture2D(uPrev, vUv);
            vec4 sL = texture2D(uPrev, vUv - vec2(TEXEL, 0.0));
            vec4 sR = texture2D(uPrev, vUv + vec2(TEXEL, 0.0));
            vec4 sD = texture2D(uPrev, vUv - vec2(0.0, TEXEL));
            vec4 sU = texture2D(uPrev, vUv + vec2(0.0, TEXEL));
            // shore cells reflect: use centre height so the gradient pushes back
            float lL = landAt(vUv - vec2(TEXEL, 0.0)), lR = landAt(vUv + vec2(TEXEL, 0.0));
            float lD = landAt(vUv - vec2(0.0, TEXEL)), lU = landAt(vUv + vec2(0.0, TEXEL));
            float hL = mix(sL.r, s.r, lL), hR = mix(sR.r, s.r, lR);
            float hD = mix(sD.r, s.r, lD), hU = mix(sU.r, s.r, lU);

            float h = s.r; vec2 vel = s.gb; float foam = s.a;
            float dx = PSIZE * TEXEL;

            // SWE: velocity follows the height gradient, height follows divergence
            vec2 grad = vec2(hR - hL, hU - hD) / (2.0 * dx);
            vel += -9.0 * grad * uDt;
            float div = (mix(sR.g, -s.g, lR) - mix(sL.g, -s.g, lL)
                       + mix(sU.b, -s.b, lU) - mix(sD.b, -s.b, lD)) / (2.0 * dx);
            h += -0.45 * div * uDt;
            // slight diffusion kills the central-difference checkerboard mode (and
            // reads as water viscosity); land neighbours are zero = shore friction
            vec2 velAvg = (sL.gb + sR.gb + sD.gb + sU.gb) * 0.25;
            vel = mix(vel, velAvg, 0.12);
            h = mix(h, (hL + hR + hD + hU) * 0.25, 0.05);

            // wheels stir the water: velocity splat + moving volume displacement
            // (add the volume back where the wheel WAS, remove it where it IS - this
            // conserves water and creates the bow wave + trailing wake for free)
            vec2 xy = (vUv - 0.5) * PSIZE;
            for(int i = 0; i < 4; i++){
                if(uWheelP[i].w < 0.5) continue;
                vec2 d = xy - uWheel[i].xy;
                float g = exp(-dot(d, d) / (uWheelP[i].x * uWheelP[i].x));
                vec2 dOld = xy - uWheelOld[i].xy;
                float gOld = exp(-dot(dOld, dOld) / (uWheelP[i].x * uWheelP[i].x));
                vel += uWheel[i].zw * g * 4.0 * uDt;
                h   += uWheelP[i].y * (gOld - g);
                foam += uWheelP[i].z * g * uDt;
            }

            // whitecap foam only where flow converges HARD (colliding fronts, churn);
            // gentle sloshing must not paint the whole lagoon white
            foam += max(0.0, -div - 0.9) * 0.5 * uDt;
            foam *= pow(0.5, uDt / 1.4);              // ~1.4 s half-life
            // damping + sponge border so waves fade instead of reflecting off the window.
            // Base damping is strong enough that an enclosed lagoon settles in a few
            // seconds instead of sloshing forever.
            float edge = smoothstep(0.0, 0.12, min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y)));
            vel *= mix(0.90, 0.992, edge);
            h   *= mix(0.90, 0.997, edge);
            h = clamp(h, -1.2, 1.2);
            vel = clamp(vel, vec2(-8.0), vec2(8.0));
            foam = clamp(foam, 0.0, 1.2);
            gl_FragColor = vec4(h, vel, foam);
        }
    `,
    uniforms: {
        uPrev: { value: null }, uHeight: { value: heightTex },
        uAnchor: { value: patchAnchor }, uE: { value: patchE }, uN: { value: patchN },
        uSeaElev: { value: SEA_LEVEL }, uDt: { value: 1 / 60 },
        uWheel: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
        uWheelP: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
        uWheelOld: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] }
    }
});

// Re-anchor pass: when the car strays, rebuild the tangent frame at its position and
// resample the old field into the new frame so the water state moves with the window.
const reprojMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
        uniform sampler2D uPrev;
        uniform vec3 uNewAnchor, uNewE, uNewN, uOldAnchor, uOldE, uOldN;
        varying vec2 vUv;
        const float PSIZE = ${PATCH_SIZE.toFixed(1)};
        void main(){
            vec2 xy = (vUv - 0.5) * PSIZE;
            vec3 p = normalize(uNewAnchor * ${seaRadius.toFixed(2)} + uNewE * xy.x + uNewN * xy.y) * ${seaRadius.toFixed(2)};
            vec2 old = vec2(dot(p, uOldE), dot(p, uOldN)) / PSIZE + 0.5;
            gl_FragColor = (old.x < 0.0 || old.x > 1.0 || old.y < 0.0 || old.y > 1.0)
                ? vec4(0.0) : texture2D(uPrev, old);
        }
    `,
    uniforms: {
        uPrev: { value: null },
        uNewAnchor: { value: new THREE.Vector3() }, uNewE: { value: new THREE.Vector3() }, uNewN: { value: new THREE.Vector3() },
        uOldAnchor: { value: new THREE.Vector3() }, uOldE: { value: new THREE.Vector3() }, uOldN: { value: new THREE.Vector3() }
    }
});

// Splash energy map: a tiny buffer read back to the CPU each frame; energetic cells
// (converging fast flow / fresh foam) spawn droplet particles - the WATER splashes.
const EMIT_RES = 32;
const emitRT = new THREE.WebGLRenderTarget(EMIT_RES, EMIT_RES, { depthBuffer: false, stencilBuffer: false });
const emitMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
        ${SIM_COMMON}
        uniform sampler2D uSimTex;
        varying vec2 vUv;
        void main(){
            vec4 s = texture2D(uSimTex, vUv);
            // LOCAL convergence (2 sim texels); only violent cells qualify
            vec4 sR = texture2D(uSimTex, vUv + vec2(2.0/512.0, 0.0));
            vec4 sU = texture2D(uSimTex, vUv + vec2(0.0, 2.0/512.0));
            float div = (sR.g - s.g) + (sU.b - s.b);
            float sp = length(s.gb);
            float e = clamp(max(0.0, -div) * 0.35 * sp + s.a * sp * 0.09, 0.0, 1.0);
            e *= smoothstep(1.2, 2.6, sp);   // only genuinely fast water sprays
            // shoreline cells always look convergent (land neighbours are zero) - mask them
            float land = landAt(vUv)
                       + landAt(vUv + vec2(4.0 * TEXEL, 0.0)) + landAt(vUv - vec2(4.0 * TEXEL, 0.0))
                       + landAt(vUv + vec2(0.0, 4.0 * TEXEL)) + landAt(vUv - vec2(0.0, 4.0 * TEXEL));
            if(land > 0.5) e = 0.0;
            gl_FragColor = vec4(e, s.gb * 0.0625 + 0.5, s.r * 0.4 + 0.5);
        }
    `,
    uniforms: {
        uSimTex: { value: null }, uHeight: { value: heightTex },
        uAnchor: { value: patchAnchor }, uE: { value: patchE }, uN: { value: patchN },
        uSeaElev: { value: SEA_LEVEL }
    }
});
const emitPixels = new Uint8Array(EMIT_RES * EMIT_RES * 4);

const simScene = new THREE.Scene();
const simQuad = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), forceMat);
simQuad.frustumCulled = false;
simScene.add(simQuad);
const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
if (waterSimOK) {
    [simRTA, simRTB].forEach(rt => { renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); });
    renderer.setRenderTarget(null);
}

function simPass(mat) {
    mat.uniforms.uPrev.value = simRTA.texture;
    simQuad.material = mat;
    renderer.setRenderTarget(simRTB);
    renderer.render(simScene, simCamera);
    const t = simRTA; simRTA = simRTB; simRTB = t;
}

const _oldAnchor = new THREE.Vector3(), _oldE = new THREE.Vector3(), _oldN = new THREE.Vector3();
const _wxy = new THREE.Vector3();
function stepWater(dt, carDir) {
    if (!waterSimOK) return;
    // re-anchor with small hops so the frame rotation between hops stays negligible
    const drift = Math.hypot(carDir.dot(patchE) * seaRadius, carDir.dot(patchN) * seaRadius);
    if (drift > 3.0 || patchAnchor.dot(carDir) < 0.995) {
        _oldAnchor.copy(patchAnchor); _oldE.copy(patchE); _oldN.copy(patchN);
        buildPatchFrame(carDir.clone());
        reprojMat.uniforms.uNewAnchor.value.copy(patchAnchor);
        reprojMat.uniforms.uNewE.value.copy(patchE);
        reprojMat.uniforms.uNewN.value.copy(patchN);
        reprojMat.uniforms.uOldAnchor.value.copy(_oldAnchor);
        reprojMat.uniforms.uOldE.value.copy(_oldE);
        reprojMat.uniforms.uOldN.value.copy(_oldN);
        simPass(reprojMat);
    }
    // CFL safety: wave speed * dt must stay under the texel size (research refs run
    // Courant <= 0.7; ours is ~0.43 at 1/60)
    const cdt = Math.min(dt, 1 / 60);
    advectMat.uniforms.uDt.value = cdt;
    forceMat.uniforms.uDt.value = cdt;
    simPass(advectMat);
    simPass(forceMat);
    renderer.setRenderTarget(null);
    oceanMat.uniforms.uSim.value = simRTA.texture;
    oceanMat.uniforms.uPAnchor.value.copy(patchAnchor);
    oceanMat.uniforms.uPE.value.copy(patchE);
    oceanMat.uniforms.uPN.value.copy(patchN);
}

// wheel -> sim splat uniforms. Each submerged wheel stirs with its world velocity.
// Previous positions are stored in WORLD space and reprojected each frame, so they
// stay correct when the patch re-anchors.
const _wheelPrevW = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
const _wheelPrevOK = [false, false, false, false];
function updateWheelSplats() {
    const wArr = forceMat.uniforms.uWheel.value, pArr = forceMat.uniforms.uWheelP.value;
    const oArr = forceMat.uniforms.uWheelOld.value;
    for (let i = 0; i < 4; i++) {
        const w = rover.wheels[i];
        _wxy.copy(w.pos).applyQuaternion(rover.quaternion).add(rover.position);
        const r = _wxy.length();
        const submerged = r < seaRadius + rover.wheelRadius;
        if (!submerged) { pArr[i].set(0, 0, 0, 0); _wheelPrevOK[i] = false; continue; }
        if (!_wheelPrevOK[i]) { _wheelPrevW[i].copy(_wxy); _wheelPrevOK[i] = true; }
        const px = _wxy.dot(patchE), py = _wxy.dot(patchN);
        const vx = rover.velocity.dot(patchE), vy = rover.velocity.dot(patchN);
        const speed = Math.hypot(vx, vy);
        // throttle churn: spinning wheels froth the water even at low speed
        const churn = (rover.throttle > 0 ? 2.2 : 0.0) + speed * 0.45;
        pArr[i].set(0.42, 0.30, Math.min(6, churn), 1);
        wArr[i].set(px, py, vx, vy);
        oArr[i].set(_wheelPrevW[i].dot(patchE), _wheelPrevW[i].dot(patchN), 0, 0);
        _wheelPrevW[i].copy(_wxy);
    }
}

// read back the energy map and let energetic water cells throw droplets
function emitFromCells() {
    if (!waterSimOK) return;
    emitMat.uniforms.uSimTex.value = simRTA.texture;
    simQuad.material = emitMat;
    renderer.setRenderTarget(emitRT);
    renderer.render(simScene, simCamera);
    renderer.readRenderTargetPixels(emitRT, 0, 0, EMIT_RES, EMIT_RES, emitPixels);
    renderer.setRenderTarget(null);
    // full scan (1024 cells, trivial in JS): every qualifying cell gets a chance
    let budget = 12;
    for (let ci = 0; ci < EMIT_RES * EMIT_RES && budget > 0; ci++) {
        const o = ci * 4;
        const e = emitPixels[o] / 255;
        if (e < 0.30 || Math.random() > e * 0.55) continue;
        const cx = ci % EMIT_RES, cy = (ci / EMIT_RES) | 0;
        const x = ((cx + 0.5) / EMIT_RES - 0.5) * PATCH_SIZE + (Math.random() - 0.5) * 1.2;
        const y = ((cy + 0.5) / EMIT_RES - 0.5) * PATCH_SIZE + (Math.random() - 0.5) * 1.2;
        const vx = (emitPixels[o + 1] / 255 - 0.5) * 16, vy = (emitPixels[o + 2] / 255 - 0.5) * 16;
        const pos = patchAnchor.clone().multiplyScalar(seaRadius).addScaledVector(patchE, x).addScaledVector(patchN, y);
        pos.normalize().multiplyScalar(seaRadius + 0.15);
        const up = pos.clone().normalize();
        emitSplash(pos, up, patchE, patchN, vx, vy, e, 1);
        budget--;
    }
}

// Wave field shared by vertex (displacement) and fragment (analytic normal + foam).
const OCEAN_FUNCS = `
    uniform sampler2D uHeight, uSim;
    uniform float uSeaElev, uSimScale, uPSize;
    uniform vec3 uPAnchor, uPE, uPN;

    vec2 dirToUV(vec3 d) {
        return vec2(atan(d.z, d.x) * 0.15915494 + 0.5, asin(clamp(d.y, -1.0, 1.0)) * 0.31830989 + 0.5);
    }
    float terrH(vec3 d) { return texture2D(uHeight, dirToUV(d)).r * 3.0; }
    // local fluid patch: sphere direction -> patch uv, z = blend mask (0 outside)
    vec3 patchAt(vec3 d) {
        vec3 p = d * ${seaRadius.toFixed(2)};
        vec2 uv = vec2(dot(p, uPE), dot(p, uPN)) / uPSize + 0.5;
        float m = smoothstep(0.02, 0.15, min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y)));
        m *= step(0.0, dot(d, uPAnchor));
        return vec3(uv, m);
    }
    float simH(vec3 d)    { vec3 pu = patchAt(d); return texture2D(uSim, pu.xy).r * uSimScale * pu.z; }
    vec2  simVel(vec3 d)  { vec3 pu = patchAt(d); return texture2D(uSim, pu.xy).gb * pu.z; }
    float simFoam(vec3 d) { vec3 pu = patchAt(d); return texture2D(uSim, pu.xy).a * pu.z; }
    // light ambient wind chop so calm open water still has life
    float ambientH(vec3 d, float t) {
        float h = 0.0;
        h += sin(dot(d, vec3( 1.0,  0.2,  0.3)) * 22.0 + t * 1.10) * 0.018;
        h += sin(dot(d, vec3(-0.3,  0.1,  1.0)) * 17.0 + t * 0.90) * 0.014;
        h += fbm(d * 40.0 + vec3(t * 0.15, 0.0, t * 0.10), 3) * 0.012;
        return h;
    }
    float waveField(vec3 d, float t) { return ambientH(d, t) + simH(d); }
    // classic interference caustic (Shadertoy lineage) - the underwater light webs
    float caustic(vec2 p, float t) {
        vec2 i = p;
        float c = 1.0;
        for (int n = 0; n < 3; n++) {
            float tt = t * (1.0 - (3.5 / float(n + 1)));
            i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
            c += 1.0 / length(vec2(p.x / (sin(i.x + tt) * 200.0), p.y / (cos(i.y + tt) * 200.0)));
        }
        c /= 3.0;
        c = 1.17 - pow(c, 1.4);
        return clamp(pow(abs(c), 8.0), 0.0, 1.2);
    }
`;

const oceanGeo = new THREE.IcosahedronGeometry(seaRadius, 64);
const oceanMat = new THREE.ShaderMaterial({
    vertexShader: `
        ${GLSL_NOISE}
        ${OCEAN_FUNCS}
        uniform float uTime, uSeaR;
        varying vec3 vDir, vWorld;
        varying float vWaveH, vDepth;
        void main() {
            vec3 d = normalize(position);
            float terr = terrH(d);
            float depth = uSeaElev - terr;
            float shore = smoothstep(0.0, 0.18, depth);
            // ambient chop fades toward shore; the physical sim already zeroes on land
            float wave = ambientH(d, uTime) * (0.25 + 0.75 * shore) + simH(d);
            vDir = d; vWaveH = wave; vDepth = depth;
            vec3 pos = d * (uSeaR + wave);
            vWorld = (modelMatrix * vec4(pos, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    `,
    fragmentShader: `
        ${GLSL_NOISE}
        ${OCEAN_FUNCS}
        uniform vec3 uSun, uSunRightC, uSunUpC;
        uniform float uTime, uSeaR, uExtentC;
        uniform sampler2D uCloudShadowW;
        varying vec3 vDir, vWorld;
        varying float vWaveH, vDepth;

        void main() {
            vec3 d = vDir;
            vec3 up = d;
            vec3 t1 = normalize(cross(abs(d.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0), up));
            vec3 t2 = cross(up, t1);

            // analytic normal from the wave gradient (crisp detail beyond geometry)
            float e = 0.0025;
            float h0 = waveField(d, uTime);
            float hx = waveField(normalize(d + t1 * e), uTime);
            float hy = waveField(normalize(d + t2 * e), uTime);
            vec3 N = normalize(up - t1 * ((hx - h0) / e) * 0.16 - t2 * ((hy - h0) / e) * 0.16);

            vec3 V = normalize(cameraPosition - vWorld);
            vec3 L = normalize(uSun);
            float fres = 0.02 + 0.98 * pow(1.0 - max(0.0, dot(N, V)), 5.0);

            // depth-graded body colour - bright maldives turquoise in the shallows
            float openness = smoothstep(0.02, 0.25, vDepth);
            vec3 water = mix(vec3(0.13, 0.62, 0.60), vec3(0.015, 0.09, 0.19), openness);

            // how lit this patch of sea is (1 day, 0 night) so nothing glows after dark
            float dayFac = smoothstep(-0.15, 0.15, dot(d, L));

            // reflected sky gradient (dark at night) + sun disc + micro glint
            vec3 R = reflect(-V, N);
            vec3 skyC = mix(vec3(0.70, 0.80, 0.95), vec3(0.15, 0.35, 0.70), clamp(R.y * 0.5 + 0.5, 0.0, 1.0));
            skyC = mix(vec3(0.01, 0.02, 0.05), skyC, dayFac);
            float sunSpec = pow(max(0.0, dot(R, L)), 400.0);
            float glint = pow(max(0.0, dot(N, normalize(L + V))), 200.0);

            float diff = max(0.0, dot(N, L));
            vec3 col = water * (0.04 + 0.30 * dayFac + 0.66 * diff);
            col = mix(col, skyC, fres * 0.75);
            col += vec3(1.0, 0.95, 0.80) * (sunSpec * 2.0 + glint * 0.6) * dayFac;

            // subsurface crest glow when looking toward the sun through a swell
            float sss = smoothstep(0.02, 0.08, vWaveH) * pow(max(0.0, dot(V, -L)), 2.0);
            col += vec3(0.10, 0.40, 0.35) * sss * 0.6 * dayFac;

            // caustic light webs dancing in the shallows
            float cdepth = smoothstep(0.34, 0.03, vDepth) * smoothstep(0.005, 0.03, vDepth);
            col += vec3(0.22, 0.42, 0.42) * caustic(dirToUV(d) * 220.0, uTime * 0.6) * cdepth * dayFac;

            // foam: the simulated foam field (advected by the flow -> swirls and wakes)
            // + whitecaps where the water moves fast + a shoreline wash band
            float fn = fbm(d * 100.0 + uTime * 0.25, 3);
            float pf = simFoam(d);
            float swirlFoam = smoothstep(0.10, 0.55, pf);
            float moving = smoothstep(1.0, 3.5, length(simVel(d))) * 0.6;
            float wash = 0.5 + 0.5 * sin(vDepth * 60.0 - uTime * 2.0);
            float shoreFoam = smoothstep(0.14, 0.0, vDepth) * (0.5 + 0.5 * wash);
            float foam = clamp(max(max(shoreFoam * 0.9, swirlFoam), moving), 0.0, 1.0);
            foam *= smoothstep(0.15, 0.75, fn * 0.5 + 0.75);
            col = mix(col, vec3(0.94, 0.98, 1.0) * (0.25 + 0.75 * dayFac), foam);

            // cloud shadow swept across the water (sun-view shadow map) - visible from any angle
            vec2 csuv = vec2(dot(vWorld, uSunRightC), dot(vWorld, uSunUpC)) / (2.0 * uExtentC) + 0.5;
            float cshadow = texture2D(uCloudShadowW, csuv).r;
            col *= mix(0.42, 1.0, smoothstep(0.12, 0.6, cshadow));

            // more transparent in the shallows so the sandy seabed glows through
            float alpha = max(mix(0.62, 0.97, openness), foam);
            gl_FragColor = vec4(col, alpha);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uTime: { value: 0 },
        uSeaR: { value: seaRadius },
        uSeaElev: { value: SEA_LEVEL },
        uHeight: { value: heightTex },
        uSim: { value: waterSimOK ? simRTA.texture : flatSim },
        uSimScale: { value: 1.0 },
        uPSize: { value: PATCH_SIZE },
        uPAnchor: { value: patchAnchor }, uPE: { value: patchE }, uPN: { value: patchN },
        uCloudShadowW: { value: null },   // set once the shadow map exists
        uSunRightC: { value: new THREE.Vector3(1, 0, 0) },
        uSunUpC: { value: new THREE.Vector3(0, 1, 0) },
        uExtentC: { value: PLANET_RADIUS + CLOUD_BASE + CLOUD_THICK + 8.0 } // = CLOUD_EXTENT
    },
    transparent: true,
    depthWrite: true
});
const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
oceanMesh.frustumCulled = false;
scene.add(oceanMesh);

// --- Splash particles: water droplets kicked up when the car churns through water
const SPLASH_N = 400;
const splashPos = new Float32Array(SPLASH_N * 3);
const splashVel = new Float32Array(SPLASH_N * 3);
const splashLife = new Float32Array(SPLASH_N);      // seconds remaining, <=0 = dead
const splashGeo = new THREE.BufferGeometry();
splashGeo.setAttribute('position', new THREE.BufferAttribute(splashPos, 3));
// soft round droplet sprite so particles read as spray, not blocky squares
const splashTex = (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 32;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0.0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.4, 'rgba(220,240,255,0.65)');
    grd.addColorStop(1.0, 'rgba(200,230,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(16, 16, 16, 0, 6.2832); g.fill();
    return new THREE.CanvasTexture(cv);
})();
const splash = new THREE.Points(splashGeo, new THREE.PointsMaterial({
    map: splashTex, color: 0xeaf4ff, size: 0.34, sizeAttenuation: true,
    transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
}));
splash.frustumCulled = false;
scene.add(splash);
let splashCursor = 0;
// droplets thrown by a water cell: up + the cell's own flow velocity (E,N = patch axes)
function emitSplash(pos, up, E, N, vx, vy, energy, n) {
    for (let k = 0; k < n; k++) {
        const i = splashCursor; splashCursor = (splashCursor + 1) % SPLASH_N;
        splashPos[i*3]   = pos.x + (Math.random() - 0.5) * 0.6;
        splashPos[i*3+1] = pos.y + (Math.random() - 0.5) * 0.6;
        splashPos[i*3+2] = pos.z + (Math.random() - 0.5) * 0.6;
        const uk = 2.0 + energy * 4.5 * Math.random();
        splashVel[i*3]   = up.x * uk + (E.x * vx + N.x * vy) * 0.55 + (Math.random() - 0.5) * 1.5;
        splashVel[i*3+1] = up.y * uk + (E.y * vx + N.y * vy) * 0.55 + (Math.random() - 0.5) * 1.5;
        splashVel[i*3+2] = up.z * uk + (E.z * vx + N.z * vy) * 0.55 + (Math.random() - 0.5) * 1.5;
        splashLife[i] = 0.4 + Math.random() * 0.5;
    }
}
function updateSplash(dt) {
    const g = 12;
    for (let i = 0; i < SPLASH_N; i++) {
        if (splashLife[i] <= 0) continue;
        splashLife[i] -= dt;
        const px = splashPos[i*3], py = splashPos[i*3+1], pz = splashPos[i*3+2];
        const inv = -g / (Math.hypot(px, py, pz) || 1);     // gravity toward planet centre
        splashVel[i*3]   += px * inv * dt;
        splashVel[i*3+1] += py * inv * dt;
        splashVel[i*3+2] += pz * inv * dt;
        if (splashLife[i] <= 0) { splashPos[i*3] = splashPos[i*3+1] = splashPos[i*3+2] = 0; }
        else {
            splashPos[i*3]   += splashVel[i*3]   * dt;
            splashPos[i*3+1] += splashVel[i*3+1] * dt;
            splashPos[i*3+2] += splashVel[i*3+2] * dt;
        }
    }
    splashGeo.attributes.position.needsUpdate = true;
}

// ============================================
// CLOUD LAYER RADII (defined early for atmosphere god rays)
// ============================================
const cloudInnerR = PLANET_RADIUS + CLOUD_BASE;
const cloudOuterR = PLANET_RADIUS + CLOUD_BASE + CLOUD_THICK;

// ============================================
// ATMOSPHERE
// ============================================
const atmoGeo = new THREE.IcosahedronGeometry(PLANET_RADIUS + ATMO_HEIGHT, 48);
const atmoMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec3 vWorld;
        void main() {
            vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform vec3 uSun, uCam, uScatter;
        uniform float uPlanetR, uAtmoR, uFalloff;
        varying vec3 vWorld;

        #define STEPS 8

        vec2 raySphere(float r, vec3 ro, vec3 rd) {
            float b = dot(ro, rd);
            float c = dot(ro, ro) - r * r;
            float d = b * b - c;
            if(d < 0.0) return vec2(1e10, 0.0);
            float s = sqrt(d);
            return vec2(max(0.0, -b - s), max(0.0, -b + s) - max(0.0, -b - s));
        }

        float density(vec3 p) {
            float h = (length(p) - uPlanetR) / (uAtmoR - uPlanetR);
            return exp(-h * uFalloff) * (1.0 - h);
        }

        float optDepth(vec3 ro, vec3 rd, float len) {
            float step = len / float(STEPS);
            float d = 0.0;
            for(int i = 0; i < STEPS; i++) {
                d += density(ro + rd * (float(i) + 0.5) * step) * step;
            }
            return d;
        }

        void main() {
            vec3 ro = uCam;
            vec3 rd = normalize(vWorld - uCam);

            vec2 atmoHit = raySphere(uAtmoR, ro, rd);
            if(atmoHit.y <= 0.0) discard;

            float dstTo = atmoHit.x;
            float dstThru = atmoHit.y;

            vec2 planetHit = raySphere(uPlanetR, ro, rd);
            if(planetHit.x > 0.0 && planetHit.x < dstTo + dstThru) {
                dstThru = planetHit.x - dstTo;
            }

            if(dstThru <= 0.0) discard;

            vec3 start = ro + rd * (dstTo + 0.01);
            float step = dstThru / float(STEPS);
            vec3 light = vec3(0.0);

            for(int i = 0; i < STEPS; i++) {
                vec3 p = start + rd * (float(i) + 0.5) * step;

                float sunLen = raySphere(uAtmoR, p, uSun).y;
                float sunDepth = optDepth(p, uSun, sunLen);

                vec2 shadowHit = raySphere(uPlanetR, p, uSun);
                if(shadowHit.x > 0.0 && shadowHit.x < sunLen) continue;

                float viewDepth = optDepth(start, rd, float(i) * step);
                vec3 trans = exp(-(sunDepth + viewDepth) * uScatter);
                float dens = density(p);
                light += dens * trans * uScatter * step;
            }

            float alpha = 1.0 - exp(-dstThru * 0.05);
            gl_FragColor = vec4(light, alpha);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uCam: { value: camera.position },
        uScatter: { value: scatter },
        uPlanetR: { value: PLANET_RADIUS },
        uAtmoR: { value: PLANET_RADIUS + ATMO_HEIGHT },
        uFalloff: { value: 6 }
    },
    transparent: true,
    side: THREE.BackSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});
scene.add(new THREE.Mesh(atmoGeo, atmoMat));

// ============================================
// CLOUDS
// ============================================
const cloudGeo = new THREE.SphereGeometry(cloudOuterR + 1, 64, 64);
const cloudMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec3 vWorld, vRayO, vRayD;
        void main() {
            vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
            vRayO = cameraPosition;
            vRayD = vWorld - cameraPosition;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        ${GLSL_NOISE}
        uniform vec3 uSun;
        uniform float uTime, uPlanetR, uInnerR, uOuterR, uDensity;
        varying vec3 vWorld, vRayO, vRayD;

        #define STEPS 18
        #define LSTEPS 4

        vec2 raySphere(float r, vec3 ro, vec3 rd) {
            float b = dot(ro, rd);
            float c = dot(ro, ro) - r * r;
            float d = b * b - c;
            if(d < 0.0) return vec2(-1.0, -1.0);
            float s = sqrt(d);
            return vec2(-b - s, -b + s);
        }

        float sampleCloud(vec3 p) {
            vec3 sp = normalize(p);
            float alt = length(p) - uPlanetR;
            float cloudBase = uInnerR - uPlanetR;
            float cloudTop = uOuterR - uPlanetR;
            float hFrac = clamp((alt - cloudBase) / (cloudTop - cloudBase), 0.0, 1.0);

            // Height falloff - dense in middle, fade at edges
            float hFall = smoothstep(0.0, 0.25, hFrac) * smoothstep(1.0, 0.75, hFrac);

            // Less clouds at poles
            float latMask = smoothstep(0.8, 0.4, abs(sp.y));

            // Simple FBM noise for cloud shape
            vec3 pos = sp * 4.0 + vec3(uTime * 0.012, 0.0, uTime * 0.008);
            float n = fbm(pos, 5);
            n = smoothstep(0.0, 0.6, n); // Coverage control

            return n * hFall * latMask * uDensity;
        }

        float lightMarch(vec3 position) {
            // Sebastian Lague's light march with darkness threshold
            float totalDensity = 0.0;
            float stepSize = 2.0; // Fixed step towards sun
            float lightAbsorptionTowardSun = 1.5;
            float darknessThreshold = 0.2;

            for(int i = 0; i < LSTEPS; i++) {
                position += uSun * stepSize;
                float alt = length(position) - uPlanetR;
                float cloudBase = uInnerR - uPlanetR;
                float cloudTop = uOuterR - uPlanetR;
                if(alt < cloudBase || alt > cloudTop) break;
                totalDensity += max(0.0, sampleCloud(position) * stepSize);
            }

            float transmittance = exp(-totalDensity * lightAbsorptionTowardSun);
            // Never fully dark (Sebastian's trick)
            return darknessThreshold + transmittance * (1.0 - darknessThreshold);
        }

        void main() {
            vec3 rd = normalize(vRayD);
            vec3 ro = vRayO;

            vec2 outer = raySphere(uOuterR, ro, rd);

            if(outer.y < 0.0) discard;

            // One continuous march segment: enter the outer cloud shell (0 if the
            // camera is already inside it) and exit it, then clamp to the planet.
            // The cloud altitude band is handled by the density falloff, so there is
            // no camera-radius branch to jump when the car changes elevation. That
            // branch switching was what made the clouds pop in and out while driving.
            float start = max(0.0, outer.x);
            float end = outer.y;

            vec2 planet = raySphere(uPlanetR, ro, rd);
            if(planet.x > 0.0 && planet.x < end) {
                end = planet.x;
            }

            if(start >= end) discard;

            // Sebastian Lague's approach
            float stepSize = (end - start) / float(STEPS);
            float transmittance = 1.0;
            float lightEnergy = 0.0;

            // Constants
            float lightAbsorptionThroughCloud = 0.8;
            float lightAbsorptionTowardSun = 1.2;
            float darknessThreshold = 0.15;

            // Sun color
            vec3 sunCol = mix(vec3(1.0,0.6,0.4), vec3(1.0,0.98,0.95), smoothstep(-0.1, 0.3, uSun.y));

            // Phase function (forward scattering)
            float cosAngle = dot(rd, uSun);
            float phaseVal = 0.5 + 0.5 * cosAngle * cosAngle;

            float dstTravelled = 0.0;
            for(int i = 0; i < STEPS; i++) {
                if(transmittance < 0.01) break;

                vec3 rayPos = ro + rd * (start + dstTravelled);
                float density = sampleCloud(rayPos);

                if(density > 0.0) {
                    // Light march towards sun
                    float lightTransmittance = lightMarch(rayPos);

                    // Accumulate light energy (Sebastian's formula)
                    lightEnergy += density * stepSize * transmittance * lightTransmittance * phaseVal;

                    // Beer's law for view ray
                    transmittance *= exp(-density * stepSize * lightAbsorptionThroughCloud);
                }

                dstTravelled += stepSize;
            }

            if(transmittance > 0.99) discard;

            // Final cloud color (Sebastian's blend)
            vec3 cloudCol = lightEnergy * sunCol;

            // Output clouds blend over background via transmittance
            gl_FragColor = vec4(cloudCol, 1.0 - transmittance);
        }
    `,
    uniforms: {
        uSun: { value: sunDir },
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uInnerR: { value: cloudInnerR },
        uOuterR: { value: cloudOuterR },
        uDensity: { value: 0.8 }
    },
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    // With the layer raised above the camera, opaque terrain/car depth-occludes the
    // clouds correctly, so they stay behind the world instead of painting over it.
    depthTest: true
});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
cloudMesh.renderOrder = 100;
cloudMesh.frustumCulled = false; // camera can sit near/inside the shell; never cull it
scene.add(cloudMesh);

// ============================================
// VOLUMETRIC LIGHTING (real crepuscular shafts cast BY the clouds)
// ============================================
// Not a screen-space smear. We raymarch the hazy air from the camera, and at each
// step march toward the sun sampling CLOUD density: where a cloud blocks the sun the
// haze stays dark, where the sun streams through a gap the haze lights up into a
// shaft. Terrain occludes shafts via the scene depth buffer, and the ray-sphere
// entry makes it work whether the camera is inside or outside the atmosphere.
let godRaysEnabled = true;
const sceneRT = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
sceneRT.depthTexture = new THREE.DepthTexture(window.innerWidth, window.innerHeight);
sceneRT.depthTexture.type = THREE.UnsignedIntType;

const VOL_SCALE = 2; // raymarch shafts at 1/2 res, then upscale (they are soft)
const volRT = new THREE.WebGLRenderTarget(
    Math.floor(window.innerWidth / VOL_SCALE), Math.floor(window.innerHeight / VOL_SCALE));
volRT.texture.minFilter = THREE.LinearFilter;
volRT.texture.magFilter = THREE.LinearFilter;

const VOL_R = cloudOuterR + 2.0; // outer radius of the lit air volume (just above clouds)
const CLOUD_EXTENT = cloudOuterR + 8.0; // half-size of the square sun-view shadow map
const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

// cloud density field (where clouds block the sun), shared with the shadow-map pass
const CLOUD_DENSITY_GLSL = `
    float cloudDensityAt(vec3 p){
        float alt = length(p) - uPlanetR;
        float base = uCloudInner - uPlanetR, top = uCloudOuter - uPlanetR;
        float hFrac = (alt - base) / (top - base);
        if(hFrac <= 0.0 || hFrac >= 1.0) return 0.0;
        float hFall = smoothstep(0.0, 0.25, hFrac) * smoothstep(1.0, 0.75, hFrac);
        vec3 sp = normalize(p);
        float latMask = smoothstep(0.85, 0.4, abs(sp.y));
        vec3 pos = sp * 4.0 + vec3(uTime * 0.012, 0.0, uTime * 0.008);
        // match the VISIBLE cloud coverage so ground shadows line up with the clouds you see
        float n = smoothstep(0.0, 0.6, fbm(pos, 5));
        return n * hFall * latMask * uCloudDensity;
    }`;

// --- Cloud shadow map: cloud optical depth along the parallel sun rays, rendered
// from the sun's point of view. Sampling this hard, high-res map (instead of an
// undersampled march through a soft field) is what makes the shafts crisp. This is
// the "shadow map as gobo" technique the references describe.
const CLOUD_SHADOW_RES = 1024;
const cloudShadowRT = new THREE.WebGLRenderTarget(CLOUD_SHADOW_RES, CLOUD_SHADOW_RES, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false, stencilBuffer: false
});
const cloudShadowMat = new THREE.ShaderMaterial({
    uniforms: {
        uSunDir: { value: sunDir },
        uSunRight: { value: new THREE.Vector3(1, 0, 0) },
        uSunUp: { value: new THREE.Vector3(0, 1, 0) },
        uExtent: { value: CLOUD_EXTENT },
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uCloudInner: { value: cloudInnerR },
        uCloudOuter: { value: cloudOuterR },
        uCloudDensity: { value: 0.8 },
        uCloudAbsorb: { value: 5.0 }
    },
    vertexShader: FS_VERT,
    fragmentShader: `
        ${GLSL_NOISE}
        uniform vec3 uSunDir, uSunRight, uSunUp;
        uniform float uExtent, uTime, uPlanetR, uCloudInner, uCloudOuter, uCloudDensity, uCloudAbsorb;
        varying vec2 vUv;
        vec2 raySphere(float r, vec3 ro, vec3 rd){
            float b = dot(ro, rd), c = dot(ro, ro) - r * r, d = b * b - c;
            if(d < 0.0) return vec2(-1.0);
            float s = sqrt(d); return vec2(-b - s, -b + s);
        }
        ${CLOUD_DENSITY_GLSL}
        void main(){
            float u = (vUv.x - 0.5) * 2.0 * uExtent;
            float v = (vUv.y - 0.5) * 2.0 * uExtent;
            vec3 ro = uSunDir * 200.0 + uSunRight * u + uSunUp * v; // out at the sun
            vec3 rd = -uSunDir;                                     // toward the planet
            vec2 hit = raySphere(uCloudOuter, ro, rd);
            if(hit.y < 0.0){ gl_FragColor = vec4(1.0); return; }    // no cloud shell -> fully lit
            float t0 = max(0.0, hit.x), seg = (hit.y - t0) / 20.0, od = 0.0;
            for(int i = 0; i < 20; i++) od += cloudDensityAt(ro + rd * (t0 + (float(i) + 0.5) * seg));
            // store TRANSMITTANCE in [0,1] (1 = sun reaches, 0 = fully blocked); RGBA8-safe
            gl_FragColor = vec4(exp(-od * seg * uCloudAbsorb), 0.0, 0.0, 1.0);
        }
    `
});

const volMat = new THREE.ShaderMaterial({
    uniforms: {
        uDepth: { value: sceneRT.depthTexture },
        uCloudShadow: { value: cloudShadowRT.texture },
        uInvVP: { value: new THREE.Matrix4() },
        uCam: { value: new THREE.Vector3() },
        uSun: { value: sunDir },
        uSunRight: { value: new THREE.Vector3(1, 0, 0) },
        uSunUp: { value: new THREE.Vector3(0, 1, 0) },
        uExtent: { value: CLOUD_EXTENT },
        uSunColor: { value: new THREE.Color(1.0, 0.92, 0.78) },
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uVolR: { value: VOL_R },
        uHazeH: { value: 8.0 },        // haze scale height (smaller = shafts hug the ground)
        // Low extinction: shafts must stay visible tens of units away (high sigma fogged
        // them out past ~10 units, which is why they vanished at distance).
        uSigma: { value: 0.05 },
        uCloudAbsorb: { value: 5.0 },  // (unused in march now; shadow map bakes it) kept for reference
        uPhaseG: { value: 0.5 },       // forward lobe of the dual-lobe phase
        // 0.5 keeps beam structure visible in BOTH directions: side-on shafts read
        // clearly, and the sun-facing view keeps its dark shadow bands instead of
        // saturating into a white veil.
        uIntensity: { value: 0.5 }
    },
    vertexShader: FS_VERT,
    fragmentShader: `
        uniform sampler2D uDepth, uCloudShadow;
        uniform mat4 uInvVP;
        uniform vec3 uCam, uSun, uSunRight, uSunUp, uSunColor;
        uniform float uExtent, uTime, uPlanetR, uVolR, uHazeH, uSigma, uCloudAbsorb, uPhaseG, uIntensity;
        varying vec2 vUv;

        vec2 raySphere(float r, vec3 ro, vec3 rd){
            float b = dot(ro, rd), c = dot(ro, ro) - r * r, d = b * b - c;
            if(d < 0.0) return vec2(-1.0);
            float s = sqrt(d); return vec2(-b - s, -b + s);
        }
        float hash12(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
        float hg(float c, float g){ float g2 = g * g; return (1.0 - g2) / (12.566 * pow(max(1e-3, 1.0 + g2 - 2.0 * g * c), 1.5)); }

        // crisp cloud shadow: read the precomputed sun-view transmittance and push it
        // toward binary (lit / occluded). A near-binary test is what makes the shaft
        // edges hard instead of a soft ramp (per the reference implementations).
        float cloudShadow(vec3 p){
            vec2 suv = vec2(dot(p, uSunRight), dot(p, uSunUp)) / (2.0 * uExtent) + 0.5;
            float vis = texture2D(uCloudShadow, suv).r;   // 1 = sun reaches, 0 = blocked
            return smoothstep(0.12, 0.5, vis);
        }

        void main(){
            vec2 uv = vUv;
            vec4 w = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0); w /= w.w;
            vec3 rd = normalize(w.xyz - uCam), ro = uCam;

            // distance to solid geometry (so mountains occlude the shafts)
            float depth = texture2D(uDepth, uv).x;
            float sceneDist = 1e9;
            if(depth < 0.9999){ vec4 wp = uInvVP * vec4(uv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0); wp /= wp.w; sceneDist = length(wp.xyz - uCam); }

            vec2 vol = raySphere(uVolR, ro, rd);
            if(vol.y < 0.0){ gl_FragColor = vec4(0.0); return; }
            float tstart = max(0.0, vol.x), tend = vol.y;
            vec2 pl = raySphere(uPlanetR, ro, rd);
            if(pl.x > 0.0) tend = min(tend, pl.x);
            tend = min(tend, sceneDist);
            if(tend <= tstart){ gl_FragColor = vec4(0.0); return; }

            const int STEPS = 40;
            float seg = (tend - tstart) / float(STEPS);
            float jit = hash12(uv + fract(uTime * 0.37)) * seg;   // dither hides banding
            vec3 L = normalize(uSun);
            // Dual-lobe phase: isotropic base + forward HG lobe. A single forward lobe
            // made the shafts ~8x dimmer side-on than sun-on, which is why they only
            // showed while looking near the sun. Real haze side-scatters plenty.
            float phase = mix(0.0796, hg(dot(rd, L), uPhaseG), 0.55);

            // Beer-Lambert integration: in-scatter attenuated by the haze already
            // traversed. 'lit' is the crisp cloud shadow map -> distinct radiating shafts.
            float T = 1.0, inscatter = 0.0;
            for(int i = 0; i < STEPS; i++){
                float t = tstart + jit + float(i) * seg;
                if(t >= tend) break;
                vec3 p = ro + rd * t;
                float density = exp(-max(0.0, length(p) - uPlanetR) / uHazeH);
                if(density < 0.002) continue;
                float lit = (raySphere(uPlanetR, p, L).x > 0.0) ? 0.0 : cloudShadow(p);
                inscatter += T * lit * density * seg;
                T *= exp(-density * uSigma * seg);
                if(T < 0.02) break;
            }
            // alpha carries the path transmittance so the composite can dim the scene
            // behind the haze (aerial perspective) - shadowed columns then read as dark
            // bands even against a bright sky, from any view angle.
            gl_FragColor = vec4(uSunColor * inscatter * phase * uIntensity, T);
        }
    `
});

// --- Radial god-ray occlusion buffer (camera view). Bright toward the sun where the
// sky shows between clouds, black on clouds/terrain. Radial-blurring this from the
// sun's screen position produces the crisp beams fanning out through the cloud gaps
// (the classic sun-through-clouds photo). Computed from depth + a cloud raymarch, so
// there is no extra geometry pass.
const OCC_SCALE = 2;
const occlusionRT = new THREE.WebGLRenderTarget(
    Math.floor(window.innerWidth / OCC_SCALE), Math.floor(window.innerHeight / OCC_SCALE));
occlusionRT.texture.minFilter = THREE.LinearFilter;
occlusionRT.texture.magFilter = THREE.LinearFilter;
const occlusionMat = new THREE.ShaderMaterial({
    uniforms: {
        uDepth: { value: sceneRT.depthTexture },
        uInvVP: { value: new THREE.Matrix4() },
        uCam: { value: new THREE.Vector3() },
        uSun: { value: sunDir },
        uTime: { value: 0 },
        uPlanetR: { value: PLANET_RADIUS },
        uCloudInner: { value: cloudInnerR },
        uCloudOuter: { value: cloudOuterR },
        uCloudDensity: { value: 0.8 }
    },
    vertexShader: FS_VERT,
    fragmentShader: `
        ${GLSL_NOISE}
        uniform sampler2D uDepth;
        uniform mat4 uInvVP;
        uniform vec3 uCam, uSun;
        uniform float uTime, uPlanetR, uCloudInner, uCloudOuter, uCloudDensity;
        varying vec2 vUv;
        vec2 raySphere(float r, vec3 ro, vec3 rd){
            float b = dot(ro, rd), c = dot(ro, ro) - r * r, d = b * b - c;
            if(d < 0.0) return vec2(-1.0);
            float s = sqrt(d); return vec2(-b - s, -b + s);
        }
        ${CLOUD_DENSITY_GLSL}
        void main(){
            vec4 w = uInvVP * vec4(vUv * 2.0 - 1.0, 1.0, 1.0); w /= w.w;
            vec3 rd = normalize(w.xyz - uCam), ro = uCam;
            float sky = step(0.9999, texture2D(uDepth, vUv).x);        // 1 = no opaque geometry
            float md = max(0.0, dot(rd, normalize(uSun)));
            float source = pow(md, 250.0) * 4.0 + pow(md, 12.0) * 0.6; // sun disc + tight glow
            float coverage = 0.0;                                      // clouds occlude the source
            vec2 hit = raySphere(uCloudOuter, ro, rd);
            if(hit.y > 0.0){
                float t0 = max(0.0, hit.x), seg = (hit.y - t0) / 12.0, od = 0.0;
                for(int i = 0; i < 12; i++) od += cloudDensityAt(ro + rd * (t0 + (float(i) + 0.5) * seg));
                coverage = 1.0 - exp(-od * seg * 4.0);
            }
            gl_FragColor = vec4(vec3(sky * (1.0 - coverage) * source), 1.0);
        }
    `
});

// composite: scene + world-space shafts + radial god-ray streaks.
// uDebug: 0 = normal, 1 = shafts only, 2 = cloud shadow map, 3 = occlusion buffer.
const compMat = new THREE.ShaderMaterial({
    uniforms: {
        tScene: { value: sceneRT.texture }, tVol: { value: volRT.texture },
        tCloudShadow: { value: cloudShadowRT.texture }, tOcclusion: { value: occlusionRT.texture },
        uSunScreen: { value: new THREE.Vector2(0.5, 0.5) }, uRadialWeight: { value: 0.0 },
        uFogW: { value: 0.0 }, uDebug: { value: 0 }
    },
    vertexShader: FS_VERT,
    fragmentShader: `
        uniform sampler2D tScene, tVol, tCloudShadow, tOcclusion;
        uniform vec2 uSunScreen;
        uniform float uRadialWeight, uFogW, uDebug;
        varying vec2 vUv;
        void main(){
            vec4 vol4 = texture2D(tVol, vUv);
            vec3 v = vol4.rgb;
            if(uDebug > 2.5){ gl_FragColor = texture2D(tOcclusion, vUv); return; }
            if(uDebug > 1.5){ float t = texture2D(tCloudShadow, vUv).r; gl_FragColor = vec4(t, t, t, 1.0); return; }
            if(uDebug > 0.5){ gl_FragColor = vec4(v * 4.0, 1.0); return; }
            // radial god rays: march toward the sun screen pos accumulating the occlusion
            // buffer -> crisp beams fanning through the cloud gaps
            vec3 rays = vec3(0.0);
            if(uRadialWeight > 0.0){
                vec2 uv = vUv;
                vec2 delta = (vUv - uSunScreen) * (0.92 / 64.0);
                float illum = 1.0;
                for(int i = 0; i < 64; i++){
                    uv -= delta;
                    rays += texture2D(tOcclusion, uv).rgb * illum;
                    illum *= 0.955;
                }
                rays *= uRadialWeight;
            }
            vec3 shaft = vec3(1.0) - exp(-v * 1.4);
            // aerial perspective: the haze dims what is behind it, so shadowed columns
            // become dark bands even against bright sky - beams read from any angle
            float Tf = mix(1.0, vol4.a, uFogW);
            gl_FragColor = vec4(texture2D(tScene, vUv).rgb * Tf + shaft + rays * vec3(1.0, 0.92, 0.78), 1.0);
        }
    `
});
// B key cycles debug: composite -> shafts -> cloud shadow map -> occlusion buffer
window.addEventListener('keydown', (e) => {
    if(e.code === 'KeyB'){ compMat.uniforms.uDebug.value = (compMat.uniforms.uDebug.value + 1) % 4; }
});

// Cast the cloud shadow map onto the terrain (view-independent: cloud shadows sweep
// across the land, visible from any angle or distance, unlike the in-air shafts).
terrainMat.onBeforeCompile = (shader) => {
    shader.uniforms.uCloudShadowG = { value: cloudShadowRT.texture };
    shader.uniforms.uSunRightG = { value: _sunRight };
    shader.uniforms.uSunUpG = { value: _sunUp };
    shader.uniforms.uExtentG = { value: CLOUD_EXTENT };
    shader.uniforms.uTimeG = { value: 0 };
    shader.uniforms.uSunG = { value: sunDir };
    shader.vertexShader = 'varying vec3 vWorldG;\n' + shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n    vWorldG = (modelMatrix * vec4(transformed, 1.0)).xyz;'
    );
    shader.fragmentShader = `uniform sampler2D uCloudShadowG;
uniform vec3 uSunRightG, uSunUpG, uSunG;
uniform float uExtentG, uTimeG;
varying vec3 vWorldG;
float causticG(vec2 p, float t){
    vec2 i = p; float c = 1.0;
    for (int n = 0; n < 3; n++) {
        float tt = t * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
        c += 1.0 / length(vec2(p.x / (sin(i.x + tt) * 200.0), p.y / (cos(i.y + tt) * 200.0)));
    }
    c /= 3.0; c = 1.17 - pow(c, 1.4);
    return clamp(pow(abs(c), 8.0), 0.0, 1.2);
}
` + shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `#include <dithering_fragment>
    vec2 csuvG = vec2(dot(vWorldG, uSunRightG), dot(vWorldG, uSunUpG)) / (2.0 * uExtentG) + 0.5;
    float cshadowG = texture2D(uCloudShadowG, csuvG).r;
    gl_FragColor.rgb *= mix(0.42, 1.0, smoothstep(0.12, 0.6, cshadowG));
    // caustic light webs on the submerged seabed (maldives lagoon look)
    float rG = length(vWorldG);
    float depthG = ${seaRadius.toFixed(2)} - rG;
    if(depthG > 0.0){
        vec3 dG = vWorldG / rG;
        float fadeG = smoothstep(0.5, 0.06, depthG) * smoothstep(0.0, 0.02, depthG);
        float dayG = smoothstep(-0.05, 0.25, dot(dG, uSunG));
        vec2 cuvG = vec2(atan(dG.z, dG.x), asin(clamp(dG.y, -1.0, 1.0))) * 220.0;
        gl_FragColor.rgb += vec3(0.40, 0.60, 0.55) * causticG(cuvG, uTimeG * 0.6) * fadeG * dayG;
    }`
    );
    terrainMat.userData.shader = shader;
};
terrainMat.needsUpdate = true;
