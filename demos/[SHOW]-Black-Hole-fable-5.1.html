<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gargantua</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas:active{cursor:grabbing}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const FOV = 42;
const COMMON = /* glsl */`
const float R_IN=1.9, R_OUT=9.5, PI=3.14159265;
float diskH(float r){return 0.035+0.022*r;}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash31(vec3 p3){p3=fract(p3*0.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yxx)*p3.zyx);}
float pnoise(vec2 p,float N){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float y0=mod(i.y,N),y1=mod(i.y+1.,N);
 float a=hash21(vec2(i.x,y0)),b=hash21(vec2(i.x+1.,y0)),c=hash21(vec2(i.x,y1)),d=hash21(vec2(i.x+1.,y1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
 mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return v;}
`;

const bhFrag = /* glsl */`
precision highp float;
varying vec2 vUv;
uniform float uTime; uniform vec2 uRes; uniform vec3 uCamPos; uniform mat3 uCam; uniform float uTanFov;
${COMMON}
vec3 diskEmit(vec3 p,float r,vec3 rayDir,float t,out float dens){
  float phi=atan(p.z,p.x);
  float w=0.7/pow(r,1.5);
  float ph=phi-t*w+r*0.9;
  float N=14.0; float s=ph*N/(2.*PI);
  float n1=pnoise(vec2(r*7.0,s),N);
  float n2=pnoise(vec2(r*20.0+3.7,s*2.0+n1*1.5),N*2.0);
  float n3=pnoise(vec2(r*55.0+9.1,s*3.0+n2*1.0),N*3.0);
  float streak=n1*0.45+n2*0.33+n3*0.22;
  streak=pow(streak,4.0)*5.0;
  float h=diskH(r)*(0.35+1.3*n1*n1);
  float vert=exp(-p.y*p.y/(h*h));
  float rad=smoothstep(R_IN,R_IN+0.25,r)*(1.-smoothstep(R_OUT*0.5,R_OUT,r));
  dens=streak*vert*rad*(0.7+0.6*n2);
  float tt=clamp((r-R_IN)/(R_OUT-R_IN),0.,1.);
  vec3 col=mix(vec3(1.0,0.98,0.94),vec3(1.0,0.80,0.55),smoothstep(0.,0.35,tt));
  col=mix(col,vec3(1.0,0.58,0.28),smoothstep(0.35,1.,tt));
  float lum=0.55+2.8*pow(1.-tt,2.0);
  vec3 vdir=normalize(vec3(-p.z,0.,p.x));
  float beta=min(sqrt(0.5/r),0.6);
  float gam=1./sqrt(1.-beta*beta);
  float dop=1./(gam*(1.-beta*dot(vdir,-rayDir)));
  float grav=sqrt(max(0.,1.-1./r));
  float g=mix(1.0,dop*grav,0.75);
  col*=mix(vec3(1.1,0.7,0.5),vec3(0.9,0.97,1.15),smoothstep(0.6,1.5,g));
  return col*lum*clamp(pow(g,3.0),0.03,2.6);
}
vec3 sky(vec3 d){
  float n=fbm3(d*2.0+vec3(5.2,1.3,7.7));
  float n2=fbm3(d*4.5+n*2.0+vec3(1.,8.,3.));
  float band=exp(-pow((d.y*0.8+d.x*0.45)*2.2,2.));
  vec3 neb=vec3(0.05,0.09,0.20)*pow(n,3.5)*1.2*(0.3+band)+vec3(0.22,0.07,0.12)*pow(n2,4.0)*0.9*band+vec3(0.10,0.06,0.03)*pow(n,5.)*band*1.2;
  vec3 stars=vec3(0.);
  for(int i=0;i<2;i++){
    float s=i==0?32.:78.;
    vec3 p=d*s; vec3 id=floor(p); vec3 h=hash33(id);
    vec3 sp=id+0.5+(h-0.5)*0.8;
    float dist=length(cross(d,sp));
    float size=(0.006+0.014*h.x*h.x*h.x)*(i==0?1.:0.7);
    float br=pow(h.y,10.0)*5.0+0.2;
    float tw=0.8+0.2*sin(uTime*(1.+h.z*3.)+h.z*20.);
    vec3 sc=mix(vec3(0.75,0.85,1.0),vec3(1.0,0.85,0.7),h.z);
    stars+=sc*br*tw*exp(-dist*dist/(size*size))*(0.8+0.9*band);
  }
  return neb*1.0+stars*1.1;
}
void main(){
  vec2 uv=vUv*2.-1.; uv.x*=uRes.x/uRes.y;
  vec3 rd=normalize(uCam*vec3(uv*uTanFov,1.0));
  vec3 pos=uCamPos, vel=rd;
  vec3 hv=cross(pos,vel); float h2=dot(hv,hv);
  vec3 col=vec3(0.); float T=1.;
  float jit=0.5+0.5*hash21(gl_FragCoord.xy);
  bool captured=false, escaped=false;
  for(int i=0;i<320;i++){
    float r2=dot(pos,pos); float r=sqrt(r2);
    if(r<1.0){captured=true;break;}
    if(r>60.0){escaped=true;break;}
    float dt=clamp(r*0.05,0.03,1.2);
    if(r<R_OUT+0.6&&abs(pos.y)<diskH(r)*3.5+0.1) dt=min(dt,0.11);
    if(i==0) dt*=jit;
    vec3 acc=-1.5*h2*pos/(r2*r2*r);
    vel+=acc*dt; pos+=vel*dt;
    r2=dot(pos,pos); r=sqrt(r2);
    if(r>R_IN-0.1&&r<R_OUT&&abs(pos.y)<diskH(r)*3.0){
      float dens; vec3 e=diskEmit(pos,r,normalize(vel),uTime,dens);
      float a=clamp(dens*dt*3.0,0.,1.);
      col+=T*e*a; T*=1.-a;
      if(T<0.01) break;
    }
    col+=T*vec3(1.,0.9,0.75)*exp(-pow((r-1.5)*4.,2.))*dt*0.03;
  }
  if(!captured&&T>0.01) col+=T*sky(normalize(vel));
  gl_FragColor=vec4(col,1.);
}`;

const quadVert = `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,1.,1.);}`;

const ptVert = /* glsl */`
attribute vec3 aSeed; uniform float uTime; uniform float uPixScale; varying vec3 vCol; varying float vA;
${COMMON}
void main(){
  float life=fract(aSeed.x+uTime*0.010*(0.5+aSeed.y));
  float r=mix(9.5,1.02,pow(life,2.6));
  float ang=aSeed.z*6.2831853+uTime*0.7/pow(r,1.5)-r*0.9;
  float yj=(fract(aSeed.x*7.31+aSeed.z*3.7)-0.5)*2.0*diskH(r)*1.5;
  vec3 p=vec3(r*cos(ang),yj,r*sin(ang));
  vec4 mv=modelViewMatrix*vec4(p,1.);
  vec3 hv=(modelViewMatrix*vec4(0.,0.,0.,1.)).xyz;
  float dH=length(hv),dP=length(mv.xyz);
  float angDiff=acos(clamp(dot(mv.xyz/dP,hv/dH),-1.,1.));
  float shadow=asin(min(2.6/dH,1.));
  float fade=dP>dH?smoothstep(shadow,shadow*1.6,angDiff):1.;
  float tt=clamp((r-R_IN)/(R_OUT-R_IN),0.,1.);
  vCol=mix(vec3(1.0,0.95,0.9),vec3(1.0,0.6,0.3),tt);
  float absorb=1.-smoothstep(0.93,1.0,life);
  vA=fade*absorb*(0.25+1.2*pow(1.-tt,2.))*aSeed.y;
  gl_Position=projectionMatrix*mv;
  gl_PointSize=(0.02+0.04*pow(1.-tt,2.))*uPixScale/max(0.1,-mv.z);
}`;
const ptFrag = `varying vec3 vCol;varying float vA;void main(){vec2 q=gl_PointCoord-0.5;float d=length(q)*2.;float a=pow(max(0.,1.-d),2.5);gl_FragColor=vec4(vCol*vA*a*1.6,a);}`;

const finalFrag = /* glsl */`
uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; uniform float uExposure; varying vec2 vUv;
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}
void main(){
  vec2 uv=vUv; vec2 c=uv-0.5; float rr=dot(c,c);
  float ca=0.012*rr;
  vec3 col;
  col.r=texture2D(tDiffuse,uv+c*ca).r; col.g=texture2D(tDiffuse,uv).g; col.b=texture2D(tDiffuse,uv-c*ca).b;
  col*=uExposure;
  col=aces(col);
  col=mix(col,col*vec3(1.04,0.99,0.94),0.6);
  float vig=1.0-smoothstep(0.3,1.1,length(c)*1.45)*0.6;
  col*=vig;
  col+=(hash21(uv*uRes+fract(uTime)*100.)-0.5)*0.012;
  col=pow(max(col,0.),vec3(1./2.2));
  gl_FragColor=vec4(col,1.);
}`;

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.toneMapping=THREE.NoToneMapping; renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,1,0.1,200);
camera.matrixAutoUpdate=false;

const bhU={uTime:{value:0},uRes:{value:new THREE.Vector2(1,1)},uCamPos:{value:new THREE.Vector3()},uCam:{value:new THREE.Matrix3()},uTanFov:{value:Math.tan(FOV*Math.PI/360)}};
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({vertexShader:quadVert,fragmentShader:bhFrag,uniforms:bhU,depthTest:false,depthWrite:false}));
quad.frustumCulled=false; quad.renderOrder=0; scene.add(quad);

const N=7000, seeds=new Float32Array(N*3), pos=new Float32Array(N*3);
for(let i=0;i<N*3;i++) seeds[i]=Math.random();
const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
pg.setAttribute('aSeed',new THREE.BufferAttribute(seeds,3));
const ptU={uTime:{value:0},uPixScale:{value:1000}};
const pts=new THREE.Points(pg,new THREE.ShaderMaterial({vertexShader:ptVert,fragmentShader:ptFrag,uniforms:ptU,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending}));
pts.frustumCulled=false; pts.renderOrder=1; scene.add(pts);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),0.5,0.5,1.0);
composer.addPass(bloom);
const finalPass=new ShaderPass(new THREE.ShaderMaterial({uniforms:{tDiffuse:{value:null},uTime:{value:0},uRes:{value:new THREE.Vector2(1,1)},uExposure:{value:0.5}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,1.,1.);}`,fragmentShader:finalFrag}));
composer.addPass(finalPass);

let scale=0.8,lastW=0,lastH=0;
function setSize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio,1.5);
  if(w<2||h<2){lastW=lastH=0;return;}
  lastW=w;lastH=h;
  const W=Math.max(2,Math.round(w*dpr*scale)),H=Math.max(2,Math.round(h*dpr*scale));
  renderer.setSize(W,H,false); composer.setSize(W,H);
  bhU.uRes.value.set(W,H); finalPass.uniforms.uRes.value.set(W,H);
  ptU.uPixScale.value=H/(2*Math.tan(FOV*Math.PI/360));
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',setSize); setSize();

// orbit camera
const tgt={theta:0.9,phi:0.13,dist:15.0}, cur={...tgt};
let dragging=false,lx=0,ly=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!dragging)return;tgt.theta-=(e.clientX-lx)*0.005;tgt.phi=Math.min(1.25,Math.max(-1.25,tgt.phi+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
el.addEventListener('pointerup',()=>dragging=false);
el.addEventListener('wheel',e=>{tgt.dist=Math.min(30,Math.max(7.5,tgt.dist*(1+e.deltaY*0.001)));},{passive:true});

const clock=new THREE.Clock(); let frames=0,accum=0;
const right=new THREE.Vector3(),up=new THREE.Vector3(),fwd=new THREE.Vector3(),p=new THREE.Vector3(),m4=new THREE.Matrix4();
function frame(){
  requestAnimationFrame(frame);
  if(innerWidth!==lastW||innerHeight!==lastH) setSize();
  const dt=Math.min(clock.getDelta(),0.1), t=clock.elapsedTime;
  if(!dragging) tgt.theta+=0.02*dt;
  cur.theta+=(tgt.theta-cur.theta)*0.06; cur.phi+=(tgt.phi-cur.phi)*0.06; cur.dist+=(tgt.dist-cur.dist)*0.06;
  const phi=cur.phi+0.025*Math.sin(t*0.11), roll=-0.22+0.03*Math.sin(t*0.07);
  p.set(Math.cos(phi)*Math.sin(cur.theta),Math.sin(phi),Math.cos(phi)*Math.cos(cur.theta)).multiplyScalar(cur.dist);
  fwd.copy(p).negate().normalize();
  right.crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
  up.crossVectors(right,fwd).normalize();
  const cr=Math.cos(roll),sr=Math.sin(roll);
  const r2=right.clone().multiplyScalar(cr).addScaledVector(up,sr), u2=up.clone().multiplyScalar(cr).addScaledVector(right,-sr);
  bhU.uCamPos.value.copy(p);
  bhU.uCam.value.set(r2.x,u2.x,fwd.x, r2.y,u2.y,fwd.y, r2.z,u2.z,fwd.z);
  m4.makeBasis(r2,u2,fwd.clone().negate()); m4.setPosition(p);
  camera.matrix.copy(m4); camera.matrixWorld.copy(m4); camera.matrixWorldInverse.copy(m4).invert();
  bhU.uTime.value=t; ptU.uTime.value=t; finalPass.uniforms.uTime.value=t;
  composer.render();
  // adaptive resolution
  if(document.hidden){accum=0;frames=0;return;}
  accum+=dt; frames++;
  if(frames>=30){const ms=accum/frames*1000; accum=0; frames=0;
    if(ms>26&&scale>0.45){scale=Math.max(0.45,scale-0.08);setSize();}
    else if(ms<13&&scale<1){scale=Math.min(1,scale+0.05);setSize();}}
}
frame();
</script>
</body></html>
