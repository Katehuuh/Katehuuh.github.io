<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Definitions: Gradients & Filters -->
  <defs>
    <!-- Main Fur Gradient (Warm Grey/Tabby) -->
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0D8D0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8B8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A89888;stop-opacity:1" />
    </linearGradient>
    
    <!-- Belly/Inner Ear Gradient (Lighter) -->
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E8E0;stop-opacity:1" />
    </linearGradient>

    <!-- Nose Gradient -->
    <radialGradient id="noseGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D87093;stop-opacity:1" />
    </radialGradient>

    <!-- Eye Gradient (Big Shiny Eyes) -->
    <radialGradient id="eyeGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#7FFFD4;stop-opacity:1" /> <!-- Aquamarine highlight -->
      <stop offset="40%" style="stop-color:#008B8B;stop-opacity:1" /> <!-- Dark Teal -->
      <stop offset="100%" style="stop-color:#004D4D;stop-opacity:1" />
    </radialGradient>
    
    <!-- Pupil Gradient -->
    <radialGradient id="pupilGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="2" dy="4" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>

    <!-- Inner Glow for Eyes -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
       <feGaussianBlur stdDeviation="1.5" result="blur"/>
       <feMerge>
         <feMergeNode in="blur"/>
         <feMergeNode in="SourceGraphic"/>
       </feMerge>
    </filter>
    
    <!-- Tabby Stripes Pattern -->
    <pattern id="tabbyStripes" x="0" y="0" width="10" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,0 L10,0 L10,40 L0,40 Z" fill="#908070" opacity="0.4"/>
      <path d="M0,0 L10,0 L10,15 L0,15 Z" fill="#908070" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Main Group with Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- TAIL (Behind Body) -->
    <path d="M310,220 Q340,200 360,150 Q370,120 365,90 Q360,70 340,60 Q320,55 290,80 Q280,100 290,140 Q300,180 310,220 Z" 
          fill="url(#furGradient)" stroke="#908070" stroke-width="1.5" opacity="0.9"/>
    <!-- Tail Tip -->
    <ellipse cx="355" cy="85" rx="18" ry="12" fill="url(#furGradient)" stroke="#908070" stroke-width="1"/>
    <!-- Tail Stripes -->
    <path d="M305,210 Q330,180 350,140" stroke="url(#tabbyStripes)" stroke-width="6" fill="none" opacity="0.5"/>
    <path d="M315,190 Q335,160 345,120" stroke="url(#tabbyStripes)" stroke-width="4" fill="none" opacity="0.5"/>

    <!-- BACK LEGS (Hind Legs) -->
    <!-- Left Hind Leg -->
    <path d="M240,320 Q230,350 240,375 Q250,385 265,375 Q275,360 270,320 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1"/>
    <ellipse cx="252" cy="378" rx="18" ry="10" fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5"/> <!-- Paw -->
    <!-- Toes -->
    <g fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5">
      <ellipse cx="242" cy="380" rx="6" ry="5"/>
      <ellipse cx="252" cy="383" rx="6" ry="5"/>
      <ellipse cx="262" cy="380" rx="6" ry="5"/>
    </g>

    <!-- Right Hind Leg (Peeking) -->
    <path d="M280,320 Q275,350 285,375 Q295,385 305,375 Q312,360 308,320 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1" opacity="0.8"/>
    <ellipse cx="295" cy="378" rx="15" ry="9" fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5" opacity="0.8"/>

    <!-- BODY -->
    <ellipse cx="200" cy="260" rx="110" ry="90" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    <!-- Belly Patch -->
    <ellipse cx="200" cy="300" rx="60" ry="50" fill="url(#bellyGradient)" stroke="none"/>
    <!-- Chest Fluff -->
    <path d="M140,220 Q150,210 160,220 Q155,230 140,220" fill="#FFF8F0" opacity="0.8" stroke="none" filter="url(#dropShadow)"/>
    <path d="M160,215 Q170,205 180,215 Q175,225 160,215" fill="#FFF8F0" opacity="0.8" stroke="none" filter="url(#dropShadow)"/>
    <path d="M240,220 Q250,210 260,220 Q255,230 240,220" fill="#FFF8F0" opacity="0.8" stroke="none" filter="url(#dropShadow)"/>

    <!-- FRONT LEGS / PAWS -->
    <!-- Left Front Paw -->
    <path d="M110,310 Q100,340 110,365 Q125,375 140,365 Q150,350 145,310 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    <ellipse cx="125" cy="368" rx="20" ry="11" fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5"/>
    <!-- Toes Left -->
    <g fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5">
      <ellipse cx="112" cy="370" rx="6" ry="5"/>
      <ellipse cx="124" cy="373" rx="6" ry="5"/>
      <ellipse cx="136" cy="370" rx="6" ry="5"/>
    </g>

    <!-- Right Front Paw -->
    <path d="M260,310 Q255,340 265,365 Q280,375 295,365 Q305,350 300,310 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    <ellipse cx="280" cy="368" rx="20" ry="11" fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5"/>
    <!-- Toes Right -->
    <g fill="url(#bellyGradient)" stroke="#908070" stroke-width="0.5">
      <ellipse cx="267" cy="370" rx="6" ry="5"/>
      <ellipse cx="279" cy="373" rx="6" ry="5"/>
      <ellipse cx="291" cy="370" rx="6" ry="5"/>
    </g>

    <!-- HEAD -->
    <ellipse cx="200" cy="155" rx="95" ry="85" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    
    <!-- Cheeks / Muzzle Area -->
    <ellipse cx="200" cy="185" rx="55" ry="35" fill="url(#bellyGradient)" stroke="none"/>
    
    <!-- EARS -->
    <!-- Left Ear -->
    <path d="M120,90 Q105,40 130,30 Q155,45 155,95 Q145,105 120,90 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    <!-- Inner Ear Left -->
    <path d="M128,85 Q120,55 138,48 Q150,58 148,85 Q142,90 128,85 Z" fill="url(#noseGradient)" opacity="0.6" stroke="none"/>
    <!-- Ear Fluff Left -->
    <g stroke="#E0D8D0" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="118" y1="75" x2="108" y2="55"/>
      <line x1="125" y1="65" x2="118" y2="45"/>
      <line x1="132" y1="60" x2="128" y2="40"/>
    </g>

    <!-- Right Ear -->
    <path d="M280,90 Q295,40 270,30 Q245,45 245,95 Q255,105 280,90 Z" fill="url(#furGradient)" stroke="#908070" stroke-width="1.5"/>
    <!-- Inner Ear Right -->
    <path d="M272,85 Q280,55 262,48 Q250,58 252,85 Q258,90 272,85 Z" fill="url(#noseGradient)" opacity="0.6" stroke="none"/>
    <!-- Ear Fluff Right -->
    <g stroke="#E0D8D0" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="282" y1="75" x2="292" y2="55"/>
      <line x1="275" y1="65" x2="282" y2="45"/>
      <line x1="268" y1="60" x2="272" y2="40"/>
    </g>

    <!-- FACE DETAILS -->
    
    <!-- EYES (Large and Shiny) -->
    <!-- Left Eye -->
    <g filter="url(#eyeGlow)">
      <ellipse cx="160" cy="145" rx="28" ry="30" fill="url(#eyeGradient)" stroke="#004D4D" stroke-width="2"/>
      <!-- Pupil -->
      <ellipse cx="162" cy="148" rx="12" ry="14" fill="url(#pupilGradient)"/>
      <!-- Highlights (Catchlights) -->
      <ellipse cx="150" cy="132" rx="5" ry="5" fill="white" opacity="0.9"/>
      <ellipse cx="153" cy="135" rx="2.5" ry="2.5" fill="white" opacity="0.7"/>
      <ellipse cx="170" cy="158" rx="3" ry="2" fill="white" opacity="0.4"/> <!-- Secondary reflection -->
    </g>

    <!-- Right Eye -->
    <g filter="url(#eyeGlow)">
      <ellipse cx="240" cy="145" rx="28" ry="30" fill="url(#eyeGradient)" stroke="#004D4D" stroke-width="2"/>
      <!-- Pupil -->
      <ellipse cx="238" cy="148" rx="12" ry="14" fill="url(#pupilGradient)"/>
      <!-- Highlights -->
      <ellipse cx="230" cy="132" rx="5" ry="5" fill="white" opacity="0.9"/>
      <ellipse cx="233" cy="135" rx="2.5" ry="2.5" fill="white" opacity="0.7"/>
      <ellipse cx="250" cy="158" rx="3" ry="2" fill="white" opacity="0.4"/>
    </g>

    <!-- EYEBROWS / Forehead Marks (Tabby 'M' shape implied) -->
    <path d="M150,100 Q160,95 170,100" stroke="#908070" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M230,100 Q240,95 250,100" stroke="#908070" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M185,95 Q200,85 215,95" stroke="#908070" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- NOSE -->
    <ellipse cx="200" cy="182" rx="7" ry="5" fill="url(#noseGradient)" stroke="#C06080" stroke-width="0.5"/>
    <ellipse cx="197" cy="180" rx="2" ry="1.5" fill="#FFD0DB" opacity="0.6"/> <!-- Nose highlight -->

    <!-- MOUTH / WHISKER PADS -->
    <path d="M200,187 Q195,195 190,200" stroke="#504038" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M200,187 Q205,195 210,200" stroke="#504038" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Philtrum line -->
    <line x1="200" y1="187" x2="200" y2="195" stroke="#504038" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- WHISKERS -->
    <g stroke="#605048" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8">
      <!-- Left Whiskers -->
      <path d="M175,195 Q140,185 110,180"/>
      <path d="M175,200 Q140,200 110,202"/>
      <path d="M175,205 Q140,215 110,220"/>
      <!-- Right Whiskers -->
      <path d="M225,195 Q260,185 290,180"/>
      <path d="M225,200 Q260,200 290,202"/>
      <path d="M225,205 Q260,215 290,220"/>
    </g>

    <!-- FOREHEAD STRIPES (Tabby Pattern) -->
    <g fill="none" stroke="#908070" stroke-width="2" opacity="0.4" stroke-linecap="round">
      <path d="M170,80 Q180,70 190,80"/>
      <path d="M210,80 Q220,70 230,80"/>
      <path d="M185,70 Q200,55 215,70"/>
    </g>

    <!-- CHEEK STRIPES -->
    <g fill="none" stroke="#908070" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
      <path d="M130,160 Q120,170 125,185"/>
      <path d="M135,175 Q122,190 130,205"/>
      <path d="M270,160 Q280,170 275,185"/>
      <path d="M265,175 Q278,190 270,205"/>
    </g>

  </g> <!-- End Main Group -->
</svg>
