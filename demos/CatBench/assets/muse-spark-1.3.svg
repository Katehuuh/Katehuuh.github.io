<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Cute orange kitten">
<defs>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFDCA8"/>
<stop offset="55%" stop-color="#FFB877"/>
<stop offset="100%" stop-color="#FF9E4D"/>
</linearGradient>
<linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFFEFB"/>
<stop offset="100%" stop-color="#FFE6C2"/>
</linearGradient>
<linearGradient id="innerEarGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFD1DA"/>
<stop offset="100%" stop-color="#FF8FA3"/>
</linearGradient>
<radialGradient id="eyeShine" cx="0.35" cy="0.3" r="0.8">
<stop offset="0%" stop-color="#7FE3C0"/>
<stop offset="45%" stop-color="#4ABF96"/>
