<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="500" height="600">
  <!-- Soft background -->
  <defs>
    <radialGradient id="furGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </radialGradient>
    <radialGradient id="eyeShine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Subtle ground shadow -->
  <ellipse cx="100" cy="220" rx="55" ry="12" fill="#00000015"/>
  
  <!-- Tail (behind) -->
  <path d="M145 165 Q185 140 175 95 Q170 75 155 85" 
        fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
  <path d="M145 165 Q185 140 175 95 Q170 75 155 85" 
        fill="none" stroke="#e76f51" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="160" rx="48" ry="42" fill="url(#furGrad)"/>
  <!-- Body stripes -->
  <path d="M65 145 Q100 155 135 145" fill="none" stroke="#e76f51" stroke-width="3" opacity="0.6"/>
  <path d="M68 160 Q100 170 132 160" fill="none" stroke="#e76f51" stroke-width="2.5" opacity="0.5"/>
  <path d="M72 175 Q100 183 128 175" fill="none" stroke="#e76f51" stroke-width="2" opacity="0.4"/>
  
  <!-- Back paws -->
  <ellipse cx="70" cy="195" rx="16" ry="11" fill="#f4a261"/>
  <ellipse cx="130" cy="195" rx="16" ry="11" fill="#f4a261"/>
  <!-- Toe beans hint -->
  <circle cx="65" cy="198" r="2.5" fill="#e76f51" opacity="0.6"/>
  <circle cx="72" cy="200" r="2.5" fill="#e76f51" opacity="0.6"/>
  <circle cx="79" cy="198" r="2.5" fill="#e76f51" opacity="0.6"/>
  <circle cx="121" cy="198" r="2.5" fill="#e76f51" opacity="0.6"/>
  <circle cx="128" cy="200" r="2.5" fill="#e76f51" opacity="0.6"/>
  <circle cx="135" cy="198" r="2.5" fill="#e76f51" opacity="0.6"/>
  
  <!-- Front paws -->
  <ellipse cx="75" cy="185" rx="14" ry="18" fill="#ffcc80"/>
  <ellipse cx="125" cy="185" rx="14" ry="18" fill="#ffcc80"/>
  
  <!-- Head -->
  <circle cx="100" cy="95" r="52" fill="url(#furGrad)"/>
  
  <!-- Head stripes (tabby markings) -->
  <path d="M85 55 Q100 70 115 55" fill="none" stroke="#e76f51" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 68 Q100 82 122 68" fill="none" stroke="#e76f51" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 48 L100 72" fill="none" stroke="#e76f51" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Left ear -->
  <path d="M60 70 L48 25 L85 55 Z" fill="#f4a261"/>
  <path d="M62 65 L55 35 L80 55 Z" fill="url(#earInner)"/>
  <!-- Right ear -->
  <path d="M140 70 L152 25 L115 55 Z" fill="#f4a261"/>
  <path d="M138 65 L145 35 L120 55 Z" fill="url(#earInner)"/>
  
  <!-- Cheek fluff -->
  <ellipse cx="55" cy="105" rx="18" ry="14" fill="#ffcc80"/>
  <ellipse cx="145" cy="105" rx="18" ry="14" fill="#ffcc80"/>
  
  <!-- Eyes (big & cute) -->
  <!-- Left eye -->
  <ellipse cx="78" cy="90" rx="16" ry="18" fill="#fff"/>
  <ellipse cx="80" cy="93" rx="11" ry="13" fill="#2a9d8f"/>
  <ellipse cx="82" cy="95" rx="6" ry="8" fill="#1a535c"/>
  <circle cx="84" cy="90" r="4" fill="#fff"/>
  <circle cx="78" cy="98" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Right eye -->
  <ellipse cx="122" cy="90" rx="16" ry="18" fill="#fff"/>
  <ellipse cx="120" cy="93" rx="11" ry="13" fill="#2a9d8f"/>
  <ellipse cx="118" cy="95" rx="6" ry="8" fill="#1a535c"/>
  <circle cx="122" cy="90" r="4" fill="#fff"/>
  <circle cx="126" cy="98" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Eyebrows (tiny for cuteness) -->
  <path d="M65 72 Q78 68 88 74" fill="none" stroke="#e76f51" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 74 Q122 68 135 72" fill="none" stroke="#e76f51" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M100 105 Q94 112 100 114 Q106 112 100 105" fill="#e76f51"/>
  <ellipse cx="100" cy="108" rx="5" ry="3.5" fill="#ff8a80"/>
  
  <!-- Mouth -->
  <path d="M100 114 Q88 125 78 118" fill="none" stroke="#5c4033" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M100 114 Q112 125 122 118" fill="none" stroke="#5c4033" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Tiny tongue -->
  <ellipse cx="100" cy="122" rx="5" ry="3.5" fill="#ff8a80"/>
  
  <!-- Whiskers -->
  <g stroke="#5c4033" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <!-- Left -->
    <line x1="25" y1="100" x2="60" y2="105"/>
    <line x1="22" y1="112" x2="60" y2="112"/>
    <line x1="28" y1="124" x2="62" y2="118"/>
    <!-- Right -->
    <line x1="175" y1="100" x2="140" y2="105"/>
    <line x1="178" y1="112" x2="140" y2="112"/>
    <line x1="172" y1="124" x2="138" y2="118"/>
  </g>
  
  <!-- Blush -->
  <ellipse cx="58" cy="110" rx="10" ry="6" fill="#ff8a80" opacity="0.45"/>
  <ellipse cx="142" cy="110" rx="10" ry="6" fill="#ff8a80" opacity="0.45"/>
  
  <!-- Tiny sparkles for extra cuteness -->
  <g fill="#fff8e7" opacity="0.9">
    <circle cx="45" cy="50" r="2"/>
    <circle cx="160" cy="45" r="1.5"/>
    <circle cx="30" cy="80" r="1.2"/>
    <circle cx="170" cy="75" r="1.8"/>
  </g>
</svg>
