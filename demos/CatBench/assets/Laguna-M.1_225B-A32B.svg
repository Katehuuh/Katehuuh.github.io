<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f8ff"/>
  
  <!-- Kitten body -->
  <ellipse cx="200" cy="240" rx="80" ry="100" fill="#fdbcb4" stroke="#e8a895" stroke-width="2"/>
  
  <!-- Belly -->
  <ellipse cx="200" cy="260" rx="65" ry="75" fill="#ffffff"/>
  
  <!-- Front legs -->
  <ellipse cx="160" cy="330" rx="25" ry="15" fill="#fdbcb4" stroke="#e8a895" stroke-width="1"/>
  <ellipse cx="240" cy="330" rx="25" ry="15" fill="#fdbcb4" stroke="#e8a895" stroke-width="1"/>
  
  <!-- Paws -->
  <ellipse cx="160" cy="340" rx="18" ry="8" fill="#ffffff"/>
  <ellipse cx="240" cy="340" rx="18" ry="8" fill="#ffffff"/>
  
  <!-- Head -->
  <circle cx="200" cy="160" r="70" fill="#fdbcb4" stroke="#e8a895" stroke-width="2"/>
  
  <!-- Ears -->
  <path d="M 150 100 L 140 50 L 170 100 Z" fill="#fdbcb4" stroke="#e8a895" stroke-width="1"/>
  <path d="M 250 100 L 260 50 L 230 100 Z" fill="#fdbcb4" stroke="#e8a895" stroke-width="1"/>
  
  <!-- Inner ears -->
  <path d="M 150 100 L 145 60 L 170 100 Z" fill="#ffc0cb"/>
  <path d="M 250 100 L 255 60 L 230 100 Z" fill="#ffc0cb"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="150" rx="20" ry="25" fill="#ffffff" stroke="#e8a895" stroke-width="1"/>
  <ellipse cx="220" cy="150" rx="20" ry="25" fill="#ffffff" stroke="#e8a895" stroke-width="1"/>
  
  <!-- Pupils -->
  <circle cx="175" cy="150" r="12" fill="#66b2ff"/>
  <circle cx="225" cy="150" r="12" fill="#66b2ff"/>
  
  <!-- Pupil details -->
  <circle cx="175" cy="145" r="5" fill="#ffffff"/>
  <circle cx="225" cy="145" r="5" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M 200 185 Q 190 195 195 200 Q 200 195 205 200 Q 210 195 200 185" fill="#ffc0cb"/>
  
  <!-- Mouth -->
  <path d="M 195 205 Q 200 215 205 205" stroke="#ff9999" stroke-width="2" fill="none"/>
  
  <!-- Whiskers left -->
  <line x1="150" y1="185" x2="90" y2="175" stroke="#8b4513" stroke-width="1"/>
  <line x1="150" y1="195" x2="95" y2="195" stroke="#8b4513" stroke-width="1"/>
  <line x1="150" y1="205" x2="90" y2="215" stroke="#8b4513" stroke-width="1"/>
  
  <!-- Whiskers right -->
  <line x1="250" y1="185" x2="310" y2="175" stroke="#8b4513" stroke-width="1"/>
  <line x1="250" y1="195" x2="305" y2="195" stroke="#8b4513" stroke-width="1"/>
  <line x1="250" y1="205" x2="310" y2="215" stroke="#8b4513" stroke-width="1"/>
  
  <!-- Cheeks -->
  <circle cx="170" cy="190" r="10" fill="#ffb6c1" fill-opacity="0.5"/>
  <circle cx="230" cy="190" r="10" fill="#ffb6c1" fill-opacity="0.5"/>
  
  <!-- Blush marks -->
  <circle cx="160" cy="200" r="6" fill="#ff9999" fill-opacity="0.3"/>
  <circle cx="240" cy="200" r="6" fill="#ff9999" fill-opacity="0.3"/>
  
  <!-- Tail -->
  <path d="M 280 240 C 290 260 285 280 280 300 C 275 320 290 340 300 310 C 310 280 320 250 310 230 C 300 210 290 220 280 240" 
        fill="#fdbcb4" stroke="#e8a895" stroke-width="2"/>
  
  <!-- Bow tie -->
  <path d="M 200 290 L 185 310 L 200 300 L 215 310 Z" fill="#ff69b4"/>
  <path d="M 185 310 L 200 320 L 215 310" stroke="#ff1493" stroke-width="2" fill="none"/>
  
  <!-- Sparkles for cuteness -->
  <circle cx="175" cy="130" r="3" fill="#ffff00" fill-opacity="0.7"/>
  <circle cx="225" y="130" r="3" fill="#ffff00" fill-opacity="0.7"/>
  <path d="M 130 120 L 135 125 L 140 120 L 135 115 Z" fill="#ffd700" fill-opacity="0.6"/>
  <path d="M 260 120 L 265 125 L 270 120 L 265 115 Z" fill="#ffd700" fill-opacity="0.6"/>
</svg>
