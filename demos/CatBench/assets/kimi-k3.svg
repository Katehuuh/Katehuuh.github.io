  <rect x="328" y="470" width="42" height="86" rx="21" fill="url(#fur)" stroke="#d97f2e" stroke-width="3.5"/>
  <ellipse cx="291" cy="556" rx="29" ry="17" fill="url(#cream)" stroke="#d97f2e" stroke-width="3.5"/>
  <ellipse cx="349" cy="556" rx="29" ry="17" fill="url(#cream)" stroke="#d97f2e" stroke-width="3.5"/>
  <path d="M283 549 v 11 M299 549 v 11" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M341 549 v 11 M357 549 v 11" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>

