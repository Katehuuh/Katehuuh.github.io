  <path d="M224 212 Q 258 196 292 214" fill="none" stroke="#7c4a21" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 210 L 216 202" stroke="#7c4a21" stroke-width="5" stroke-linecap="round"/>
  <path d="M348 214 Q 382 196 416 212" fill="none" stroke="#7c4a21" stroke-width="5" stroke-linecap="round"/>
  <path d="M414 210 L 424 202" stroke="#7c4a21" stroke-width="5" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="218" cy="292" rx="21" ry="12" fill="#ff97a8" opacity="0.5" transform="rotate(-8 218 292)"/>
  <ellipse cx="422" cy="292" rx="21" ry="12" fill="#ff97a8" opacity="0.5" transform="rotate(8 422 292)"/>

