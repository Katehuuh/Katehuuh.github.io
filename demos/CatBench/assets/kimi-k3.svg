<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#ffe1ea"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbb63"/>
      <stop offset="100%" stop-color="#f6993f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="100%" stop-color="#ffe6c2"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a4e89b"/>
      <stop offset="45%" stop-color="#4cbb63"/>
      <stop offset="100%" stop-color="#1f7a3e"/>
    </radialGradient>
    <radialGradient id="nose" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffabbc"/>
      <stop offset="100%" stop-color="#f76d8a"/>
    </radialGradient>
    <radialGradient id="bell" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe79a"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </radialGradient>
  </defs>

  <!-- ===== background ===== -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="340" r="252" fill="#ffffff" opacity="0.5"/>

  <!-- paw prints -->
  <g fill="#f4bfc9" opacity="0.85">
