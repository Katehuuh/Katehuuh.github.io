    <ellipse cx="9" cy="-4" rx="9" ry="12" fill="#a5d8ff" transform="rotate(24)"/>
    <ellipse cx="-8" cy="8" rx="6" ry="8" fill="#c9e8ff" transform="rotate(-18)"/>
    <ellipse cx="8" cy="8" rx="6" ry="8" fill="#c9e8ff" transform="rotate(18)"/>
    <ellipse cx="0" cy="2" rx="3" ry="11" fill="#6b4f35"/>
    <path d="M-2 -9 Q-6 -16 -9 -17 M2 -9 Q6 -16 9 -17" stroke="#6b4f35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
