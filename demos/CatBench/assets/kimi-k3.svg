    <path d="M270 308 Q 218 308 176 302"/>
    <path d="M272 320 Q 226 330 190 344"/>
    <path d="M368 296 Q 416 288 456 272"/>
    <path d="M370 308 Q 422 308 464 302"/>
    <path d="M368 320 Q 414 330 450 344"/>
