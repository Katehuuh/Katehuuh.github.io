  <path d="M320 305 L 320 314" stroke="#8a4b2d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M320 314 Q 309 328 294 321" fill="none" stroke="#8a4b2d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M320 314 Q 331 328 346 321" fill="none" stroke="#8a4b2d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M311 325 Q 320 326 329 325 Q 328 341 320 341 Q 312 341 311 325 Z" fill="#ff9db1" stroke="#d95770" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M320 329 L 320 337" stroke="#d95770" stroke-width="2" stroke-linecap="round"/>

  <!-- whisker dots and whiskers -->
  <g fill="#e0a35c">
    <circle cx="272" cy="294" r="2.2"/>
    <circle cx="268" cy="306" r="2.2"/>
    <circle cx="274" cy="318" r="2.2"/>
    <circle cx="368" cy="294" r="2.2"/>
    <circle cx="372" cy="306" r="2.2"/>
    <circle cx="366" cy="318" r="2.2"/>
  </g>
  <g stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95">
