  <path d="M216 162 C 206 118 196 82 184 50 C 226 72 262 96 294 128 C 266 134 238 146 216 162 Z" fill="url(#fur)" stroke="#d97f2e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M424 162 C 434 118 444 82 456 50 C 414 72 378 96 346 128 C 374 134 402 146 424 162 Z" fill="url(#fur)" stroke="#d97f2e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M226 144 C 220 116 213 93 205 73 C 231 89 253 105 272 123 C 254 129 238 135 226 144 Z" fill="#ffb3c1"/>
  <path d="M414 144 C 420 116 427 93 435 73 C 409 89 387 105 368 123 C 386 129 402 135 414 144 Z" fill="#ffb3c1"/>

