  <path d="M305 286 Q 320 276 335 286 Q 331 302 320 305 Q 309 302 305 286 Z" fill="url(#nose)" stroke="#d95770" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="315" cy="287" rx="4.5" ry="3" fill="#ffffff" opacity="0.7"/>

