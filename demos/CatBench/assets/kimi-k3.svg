  <path d="M196 290 Q 168 296 162 308 Q 184 314 200 306 Z" fill="url(#fur)" stroke="#d97f2e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M448 258 Q 484 264 492 278 Q 468 288 446 284 Z" fill="url(#fur)" stroke="#d97f2e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M444 290 Q 472 296 478 308 Q 456 314 440 306 Z" fill="url(#fur)" stroke="#d97f2e" stroke-width="3.5" stroke-linejoin="round"/>

