    <path d="M320 136 Q 314 162 320 186"/>
    <path d="M282 142 Q 272 166 278 188"/>
    <path d="M358 142 Q 368 166 362 188"/>
  </g>
  <g stroke="#d9762b" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M186 244 Q 208 250 222 262"/>
    <path d="M190 284 Q 210 292 222 304"/>
    <path d="M454 244 Q 432 250 418 262"/>
    <path d="M450 284 Q 430 292 418 304"/>
  </g>

