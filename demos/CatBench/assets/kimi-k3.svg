  <circle cx="320" cy="400" r="14" fill="url(#bell)" stroke="#c8922a" stroke-width="3"/>
  <path d="M306 400 H 334" stroke="#c8922a" stroke-width="2.5"/>
  <circle cx="320" cy="408" r="3" fill="#c8922a"/>
  <circle cx="315" cy="394" r="3.5" fill="#fff3c4" opacity="0.9"/>

  <!-- yarn ball and string -->
  <path d="M162 528 Q 210 512 236 540 Q 252 556 268 552" fill="none" stroke="#d94f78" stroke-width="4" stroke-linecap="round"/>
  <circle cx="118" cy="548" r="40" fill="#ff8fab" stroke="#d94f78" stroke-width="3.5"/>
  <g stroke="#e2638a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M84 536 Q 118 520 152 536"/>
    <path d="M82 556 Q 118 572 154 556"/>
    <path d="M96 514 Q 104 548 92 578"/>
    <path d="M140 516 Q 132 548 144 578"/>
