    <ellipse cx="382" cy="240" rx="10" ry="24" fill="#20242b"/>
    <circle cx="370" cy="224" r="10" fill="#ffffff" opacity="0.95"/>
    <circle cx="392" cy="252" r="5" fill="#ffffff" opacity="0.85"/>
  </g>

