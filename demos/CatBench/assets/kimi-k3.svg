      <circle cx="-13" cy="-4" r="5.5"/>
      <circle cx="0" cy="-9" r="5.5"/>
      <circle cx="13" cy="-4" r="5.5"/>
    </g>
    <g transform="translate(548,116) rotate(14)">
      <ellipse cx="0" cy="10" rx="13" ry="10"/>
      <circle cx="-13" cy="-4" r="5.5"/>
      <circle cx="0" cy="-9" r="5.5"/>
      <circle cx="13" cy="-4" r="5.5"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffd166">
    <path d="M528 232 Q531 243 542 246 Q531 249 528 260 Q525 249 514 246 Q525 243 528 232 Z"/>
    <path d="M104 300 Q106.5 308 114.5 310.5 Q106.5 313 104 321 Q101.5 313 93.5 310.5 Q101.5 308 104 300 Z"/>
    <path d="M472 84 Q474 91 481 93 Q474 95 472 102 Q470 95 463 93 Q470 91 472 84 Z" fill="#ffb3c6"/>
  </g>

  <!-- little heart -->
  <path d="M150 96 C150 88 140 84 136 90 C132 96 136 104 150 112 C164 104 168 96 164 90 C160 84 150 88 150 96 Z" fill="#ff8fab"/>

  <!-- butterfly -->
