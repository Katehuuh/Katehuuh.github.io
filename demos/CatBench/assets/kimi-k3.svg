  <path d="M448 505 C 545 500 570 415 528 356" fill="none" stroke="url(#fur)" stroke-width="46" stroke-linecap="round"/>
  <path d="M448 505 C 545 500 570 415 528 356" fill="none" stroke="#d9762b" stroke-width="46" stroke-linecap="butt" stroke-dasharray="15 32" stroke-dashoffset="52"/>
  <circle cx="528" cy="356" r="23" fill="#d9762b"/>

  <!-- hind feet -->
  <ellipse cx="210" cy="548" rx="36" ry="20" fill="url(#cream)" stroke="#d97f2e" stroke-width="3.5"/>
  <ellipse cx="430" cy="548" rx="36" ry="20" fill="url(#cream)" stroke="#d97f2e" stroke-width="3.5"/>
  <path d="M198 540 v 12 M212 538 v 13" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>
  <path d="M442 540 v 12 M428 538 v 13" stroke="#e0a458" stroke-width="3" stroke-linecap="round"/>

