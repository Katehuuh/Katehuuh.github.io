<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Cute kitten with yarn</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E7"/>
      <stop offset="1" stop-color="#FFE1ED"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.5" cy="0.38" r="0.78">
      <stop offset="0" stop-color="#FFC392"/>
      <stop offset="1" stop-color="#F79E5B"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#FFE9CB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Decorations: sparkles, hearts, dots, paw prints -->
  <path d="M60 61 Q62 68 69 70 Q62 72 60 79 Q58 72 51 70 Q58 68 60 61 Z" fill="#FFD27A" opacity="0.9"/>
  <path d="M336 53 Q338.5 61.5 347 64 Q338.5 66.5 336 75 Q333.5 66.5 325 64 Q333.5 61.5 336 53 Z" fill="#FFB7CF" opacity="0.9"/>
  <path d="M40 144 Q41.5 149 46 150 Q41.5 151 40 156 Q38.5 151 34 150 Q38.5 149 40 144 Z" fill="#BFE3D0" opacity="0.9"/>
  <path d="M352 154 Q353.5 159 358 160 Q353.5 161 352 166 Q350.5 161 346 160 Q350.5 159 352 154 Z" fill="#FFE3A1" opacity="0.9"/>
  <path d="M75 104 C72 99 64 100 64 106 C64 111 70 114 75 119 C80 114 86 111 86 106 C86 100 78 99 75 104 Z" fill="#FF9FB8" opacity="0.8"/>
  <path d="M332 100 C329.6 96 323 96.8 323 101.6 C323 105.6 327.8 108 332 112 C336.2 108 341 105.6 341 101.6 C341 96.8 334.4 96 332 100 Z" fill="#C9A0E8" opacity="0.75"/>
  <circle cx="112" cy="48" r="3" fill="#FFC9DA"/>
  <circle cx="300" cy="52" r="3.5" fill="#FFE3A1"/>
  <circle cx="28" cy="250" r="4" fill="#FFC9DA"/>
  <circle cx="374" cy="258" r="4" fill="#FFE3A1"/>
  <g fill="#E993AB" opacity="0.45">
    <circle cx="355" cy="320" r="4"/><circle cx="364" cy="315" r="4.5"/><circle cx="373" cy="320" r="4"/>
    <ellipse cx="364" cy="332" rx="9" ry="7"/>
  </g>
  <g fill="#E993AB" opacity="0.4">
    <circle cx="24" cy="292" r="3.5"/><circle cx="32" cy="288" r="4"/><circle cx="40" cy="292" r="3.5"/>
    <ellipse cx="32" cy="302" rx="8" ry="6.5"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="372" rx="128" ry="12" fill="#E09A6A" opacity="0.25"/>

  <!-- Tail with tabby rings -->
  <path d="M252 320 C326 316 360 262 338 200" fill="none" stroke="#F79E5B" stroke-width="30" stroke-linecap="round"/>
  <path d="M252 320 C326 316 360 262 338 200" fill="none" stroke="#E07B39" stroke-width="30" stroke-dasharray="16 26" stroke-dashoffset="-30"/>
  <circle cx="338" cy="200" r="15" fill="#E07B39"/>

  <!-- Body -->
  <ellipse cx="200" cy="302" rx="86" ry="60" fill="url(#fur)"/>
  <path d="M122 282 Q134 296 126 312" stroke="#E07B39" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M278 282 Q266 296 274 312" stroke="#E07B39" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="200" cy="318" rx="46" ry="34" fill="url(#belly)"/>
  <!-- Chest fluff -->
  <path d="M172 294 L182 276 L192 294 Z" fill="#FFFBF2"/>
  <path d="M186 292 L196 272 L206 292 Z" fill="#FFFBF2"/>
  <path d="M208 294 L218 276 L228 294 Z" fill="#FFFBF2"/>

  <!-- Yarn ball + string -->
  <circle cx="78" cy="348" r="26" fill="#FF9EB8"/>
  <g stroke="#E5638C" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M55 340 Q78 330 101 342"/>
    <path d="M53 352 Q78 344 103 354"/>
    <path d="M60 366 Q80 358 98 366"/>
    <path d="M68 326 Q58 348 70 369"/>
    <path d="M90 327 Q98 348 86 369"/>
    <path d="M100 354 Q126 368 152 358"/>
  </g>
  <ellipse cx="68" cy="334" rx="8" ry="5" fill="#FFFFFF" opacity="0.35"/>

  <!-- Front paws (white mittens) -->
  <ellipse cx="170" cy="350" rx="27" ry="17" fill="#FFF3E0"/>
  <ellipse cx="230" cy="350" rx="27" ry="17" fill="#FFF3E0"/>
  <g stroke="#E8B88A" stroke-width="3" stroke-linecap="round">
    <path d="M162 342 L162 356"/><path d="M178 342 L178 356"/>
    <path d="M222 342 L222 356"/><path d="M238 342 L238 356"/>
  </g>

  <!-- Ears -->
  <path d="M124 130 L138 38 L192 96 Z" fill="#F79E5B" stroke="#F79E5B" stroke-width="16" stroke-linejoin="round"/>
  <path d="M276 130 L262 38 L208 96 Z" fill="#F79E5B" stroke="#F79E5B" stroke-width="16" stroke-linejoin="round"/>
  <path d="M135 112 L141 60 L174 96 Z" fill="#FFB7C9" stroke="#FFB7C9" stroke-width="8" stroke-linejoin="round"/>
  <path d="M265 112 L259 60 L226 96 Z" fill="#FFB7C9" stroke="#FFB7C9" stroke-width="8" stroke-linejoin="round"/>

  <!-- Head -->
  <ellipse cx="200" cy="178" rx="96" ry="86" fill="url(#fur)"/>
  <!-- Cheek fluff -->
  <path d="M116 192 L90 203 L116 214 Z" fill="#F79E5B"/>
  <path d="M126 214 L100 226 L128 234 Z" fill="#F79E5B"/>
  <path d="M284 192 L310 203 L284 214 Z" fill="#F79E5B"/>
  <path d="M274 214 L300 226 L272 234 Z" fill="#F79E5B"/>
  <!-- Forehead tabby stripes -->
  <g stroke="#E07B39" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M200 100 L200 130"/>
    <path d="M178 104 Q176 118 180 130"/>
    <path d="M222 104 Q224 118 220 130"/>
  </g>

  <!-- Muzzle -->
  <ellipse cx="200" cy="220" rx="36" ry="26" fill="url(#belly)"/>

  <!-- Blush -->
  <ellipse cx="134" cy="223" rx="15" ry="8" fill="#FFA0B6" opacity="0.65"/>
  <ellipse cx="266" cy="223" rx="15" ry="8" fill="#FFA0B6" opacity="0.65"/>

  <!-- Eyes -->
  <ellipse cx="162" cy="180" rx="23" ry="26" fill="#3F2D26"/>
  <ellipse cx="162" cy="190" rx="13" ry="9" fill="#8A5A33" opacity="0.9"/>
  <circle cx="154" cy="170" r="8" fill="#FFFFFF"/>
  <circle cx="171" cy="192" r="4" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="238" cy="180" rx="23" ry="26" fill="#3F2D26"/>
  <ellipse cx="238" cy="190" rx="13" ry="9" fill="#8A5A33" opacity="0.9"/>
  <circle cx="230" cy="170" r="8" fill="#FFFFFF"/>
  <circle cx="247" cy="192" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- Nose and mouth -->
  <path d="M190 203 Q200 196 210 203 Q210 213 200 220 Q190 213 190 203 Z" fill="#FF7FA0"/>
  <circle cx="196" cy="204" r="2.2" fill="#FFFFFF" opacity="0.7"/>
  <path d="M200 220 L200 227" stroke="#B5764F" stroke-width="3" stroke-linecap="round"/>
  <path d="M194 228 Q200 241 206 228 Z" fill="#FF8FA8"/>
  <path d="M186 227 Q193 235 200 227 Q207 235 214 227" stroke="#B5764F" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#C77E4F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M140 198 Q106 192 78 186"/>
    <path d="M142 210 Q104 209 74 210"/>
    <path d="M140 222 Q106 226 80 234"/>
    <path d="M260 198 Q290 192 308 187"/>
    <path d="M258 210 Q292 209 312 211"/>
    <path d="M260 222 Q290 226 306 233"/>
  </g>
</svg>
