<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#fff5f7;">
  <defs>
    <!-- Soft radial gradients for fur -->
    <radialGradient id="furBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff0e6" />
      <stop offset="70%" stop-color="#ffe4c4" />
      <stop offset="100%" stop-color="#ffd8b1" />
    </radialGradient>
    <radialGradient id="furHead" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#ffeedd" />
      <stop offset="100%" stop-color="#ffcc99" />
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#aaddff" />
      <stop offset="50%" stop-color="#77bbff" />
      <stop offset="100%" stop-color="#5599ee" />
    </radialGradient>
    <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff99aa" />
      <stop offset="100%" stop-color="#ff6677" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#fff0f5" stroke="#ffd6e0" stroke-width="4"/>

  <!-- Fluffy tail -->
  <ellipse cx="120" cy="260" rx="45" ry="30" fill="url(#furBody)" transform="rotate(-30 120 260)" />
  <ellipse cx="105" cy="250" rx="30" ry="22" fill="#ffe4c4" transform="rotate(-20 105 250)" />
  <ellipse cx="135" cy="270" rx="28" ry="18" fill="#ffd8b1" transform="rotate(10 135 270)" />

  <!-- Body -->
  <ellipse cx="200" cy="280" rx="75" ry="60" fill="url(#furBody)" />
  <ellipse cx="200" cy="270" rx="55" ry="45" fill="#fff0e6" />
  
  <!-- Front paws -->
  <ellipse cx="165" cy="315" rx="22" ry="14" fill="#fff0e6" />
  <ellipse cx="235" cy="315" rx="22" ry="14" fill="#fff0e6" />
  
  <!-- Paw pads -->
  <ellipse cx="160" cy="320" rx="5" ry="3" fill="#ffb3ba" transform="rotate(-10 160 320)" />
  <ellipse cx="170" cy="318" rx="4" ry="3" fill="#ffb3ba" />
  <ellipse cx="240" cy="320" rx="5" ry="3" fill="#ffb3ba" transform="rotate(10 240 320)" />
  <ellipse cx="230" cy="318" rx="4" ry="3" fill="#ffb3ba" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="85" ry="78" fill="url(#furHead)" />
  
  <!-- Inner head fluff -->
  <ellipse cx="200" cy="175" rx="65" ry="55" fill="#fff8f0" opacity="0.7" />

  <!-- Ears -->
  <!-- Left ear -->
  <polygon points="125,140 95,45 155,110" fill="#ffe4c4" stroke="#ffcc99" stroke-width="2"/>
  <polygon points="125,135 110,65 145,115" fill="#ffb3ba" />
  <!-- Right ear -->
  <polygon points="275,140 305,45 245,110" fill="#ffe4c4" stroke="#ffcc99" stroke-width="2"/>
  <polygon points="270,135 290,65 250,115" fill="#ffb3ba" />

  <!-- Cheek fluff -->
  <circle cx="125" cy="185" r="18" fill="#fff0e6" />
  <circle cx="275" cy="185" r="18" fill="#fff0e6" />

  <!-- Eyes -->
  <ellipse cx="165" cy="170" rx="22" ry="26" fill="url(#eyeGrad)" stroke="#5599ee" stroke-width="2"/>
  <ellipse cx="235" cy="170" rx="22" ry="26" fill="url(#eyeGrad)" stroke="#5599ee" stroke-width="2"/>
  
  <!-- Eye highlights -->
  <circle cx="170" cy="160" r="7" fill="#ffffff" />
  <circle cx="175" cy="165" r="3" fill="#ffffff" />
  <circle cx="230" cy="160" r="7" fill="#ffffff" />
  <circle cx="225" cy="165" r="3" fill="#ffffff" />

  <!-- Nose -->
  <polygon points="195,195 205,195 200,202" fill="#ff99aa" />
  
  <!-- Mouth -->
  <path d="M 190 208 Q 200 215 210 208" fill="none" stroke="#ff99aa" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <!-- Left whiskers -->
    <line x1="170" y1="198" x2="90" y2="185" />
    <line x1="168" y1="202" x2="85" y2="200" />
    <line x1="170" y1="205" x2="95" y2="215" />
    <!-- Right whiskers -->
    <line x1="230" y1="198" x2="310" y2="185" />
    <line x1="232" y1="202" x2="315" y2="200" />
    <line x1="230" y1="205" x2="305" y2="215" />
  </g>

  <!-- Bow -->
  <g>
    <!-- Left bow loop -->
    <path d="M 200 225 C 160 200 140 230 170 245 C 180 250 195 240 200 235 Z" fill="url(#bowGrad)" stroke="#ff6677" stroke-width="1"/>
    <!-- Right bow loop -->
    <path d="M 200 225 C 240 200 260 230 230 245 C 220 250 205 240 200 235 Z" fill="url(#bowGrad)" stroke="#ff6677" stroke-width="1"/>
    <!-- Bow center knot -->
    <circle cx="200" cy="232" r="8" fill="#ff8899" stroke="#ff6677" stroke-width="1"/>
  </g>

  <!-- Collar -->
  <path d="M 150 260 Q 200 285 250 260" fill="none" stroke="#ff99aa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="268" r="5" fill="#ff6677" />
</svg>