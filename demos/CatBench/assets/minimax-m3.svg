<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.34 -15.66 398.32 398.32" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradient for the body fur -->
    <radialGradient id="bodyGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB874"/>
      <stop offset="100%" stop-color="#E8893C"/>
    </radialGradient>
    
    <!-- Gradient for the head -->
    <radialGradient id="headGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFC890"/>
      <stop offset="100%" stop-color="#E8893C"/>
    </radialGradient>
    
    <!-- Gradient for the eyes -->
    <radialGradient id="eyeGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7FD647"/>
      <stop offset="50%" stop-color="#4A8B2A"/>
      <stop offset="100%" stop-color="#1F4D10"/>
    </radialGradient>
    
    <!-- Inner ear gradient -->
    <radialGradient id="earGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </radialGradient>
    
    <!-- White belly gradient -->
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E6"/>
    </linearGradient>
    
    <!-- Cheek blush -->
    <radialGradient id="blushGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9CAD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF9CAD" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Floor shadow -->
    <radialGradient id="shadowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Floor shadow -->
  <ellipse cx="200" cy="360" rx="110" ry="15" fill="url(#shadowGradient)"/>
  
  <!-- Tail (curled around to the right) -->
  <path d="M 290 300 Q 340 290 350 250 Q 355 220 335 210 Q 320 205 315 220 Q 315 240 305 245 Q 290 250 285 280 Z" fill="url(#bodyGradient)" stroke="#C97529" stroke-width="1.5"/>
  
  <!-- Tail stripes -->
  <path d="M 340 235 Q 348 240 348 250" stroke="#C97529" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 330 220 Q 325 225 325 232" stroke="#C97529" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Body -->
  <ellipse cx="200" cy="290" rx="85" ry="75" fill="url(#bodyGradient)" stroke="#C97529" stroke-width="2"/>
  
  <!-- White belly -->
  <ellipse cx="200" cy="310" rx="55" ry="50" fill="url(#bellyGradient)"/>
  
  <!-- Front left paw -->
  <ellipse cx="165" cy="345" rx="22" ry="15" fill="url(#bodyGradient)" stroke="#C97529" stroke-width="1.5"/>
  <ellipse cx="165" cy="350" rx="20" ry="8" fill="#FFF5E6"/>
  <!-- Toe details on left paw -->
  <line x1="155" y1="352" x2="155" y2="355" stroke="#C97529" stroke-width="1"/>
  <line x1="165" y1="353" x2="165" y2="357" stroke="#C97529" stroke-width="1"/>
  <line x1="175" y1="352" x2="175" y2="355" stroke="#C97529" stroke-width="1"/>
  
  <!-- Front right paw -->
  <ellipse cx="235" cy="345" rx="22" ry="15" fill="url(#bodyGradient)" stroke="#C97529" stroke-width="1.5"/>
  <ellipse cx="235" cy="350" rx="20" ry="8" fill="#FFF5E6"/>
  <!-- Toe details on right paw -->
  <line x1="225" y1="352" x2="225" y2="355" stroke="#C97529" stroke-width="1"/>
  <line x1="235" y1="353" x2="235" y2="357" stroke="#C97529" stroke-width="1"/>
  <line x1="245" y1="352" x2="245" y2="355" stroke="#C97529" stroke-width="1"/>
  
  <!-- Body stripes -->
  <path d="M 145 270 Q 150 275 145 280" stroke="#C97529" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 250 270 Q 255 275 250 280" stroke="#C97529" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Left ear (back) -->
  <path d="M 130 130 L 115 60 L 170 110 Z" fill="url(#headGradient)" stroke="#C97529" stroke-width="2"/>
  <!-- Left inner ear -->
  <path d="M 138 120 L 128 80 L 158 110 Z" fill="url(#earGradient)"/>
  
  <!-- Right ear -->
  <path d="M 270 130 L 285 60 L 230 110 Z" fill="url(#headGradient)" stroke="#C97529" stroke-width="2"/>
  <!-- Right inner ear -->
  <path d="M 262 120 L 272 80 L 242 110 Z" fill="url(#earGradient)"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="100" ry="90" fill="url(#headGradient)" stroke="#C97529" stroke-width="2"/>
  
  <!-- Head stripes (tabby pattern) -->
  <path d="M 145 130 Q 148 145 145 160" stroke="#C97529" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 255 130 Q 252 145 255 160" stroke="#C97529" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 130 100 Q 138 105 145 110" stroke="#C97529" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 270 100 Q 262 105 255 110" stroke="#C97529" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- White muzzle area -->
  <ellipse cx="200" cy="215" rx="50" ry="35" fill="#FFF5E6"/>
  
  <!-- Cheek blush -->
  <ellipse cx="140" cy="200" rx="20" ry="12" fill="url(#blushGradient)"/>
  <ellipse cx="260" cy="200" rx="20" ry="12" fill="url(#blushGradient)"/>
  
  <!-- Left eye -->
  <ellipse cx="165" cy="175" rx="22" ry="26" fill="#FFFFFF" stroke="#3D2817" stroke-width="1"/>
  <ellipse cx="165" cy="178" rx="18" ry="22" fill="url(#eyeGradient)"/>
  <!-- Eye pupil (vertical slit like a cat) -->
  <ellipse cx="165" cy="178" rx="4" ry="18" fill="#0A0A0A"/>
  <!-- Eye highlight (large) -->
  <ellipse cx="160" cy="170" rx="6" ry="8" fill="#FFFFFF"/>
  <!-- Eye highlight (small) -->
  <circle cx="170" cy="185" r="2" fill="#FFFFFF"/>
  
  <!-- Right eye -->
  <ellipse cx="235" cy="175" rx="22" ry="26" fill="#FFFFFF" stroke="#3D2817" stroke-width="1"/>
  <ellipse cx="235" cy="178" rx="18" ry="22" fill="url(#eyeGradient)"/>
  <!-- Eye pupil (vertical slit like a cat) -->
  <ellipse cx="235" cy="178" rx="4" ry="18" fill="#0A0A0A"/>
  <!-- Eye highlight (large) -->
  <ellipse cx="230" cy="170" rx="6" ry="8" fill="#FFFFFF"/>
  <!-- Eye highlight (small) -->
  <circle cx="240" cy="185" r="2" fill="#FFFFFF"/>
  
  <!-- Eyelashes (top) -->
  <path d="M 145 158 Q 155 152 165 152" stroke="#3D2817" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 175 152 Q 185 152 195 158" stroke="#3D2817" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 205 158 Q 215 152 225 152" stroke="#3D2817" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 235 152 Q 245 152 255 158" stroke="#3D2817" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Eyebrow tufts -->
  <path d="M 140 145 Q 150 138 165 140" stroke="#C97529" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 235 140 Q 250 138 260 145" stroke="#C97529" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 192 200 Q 200 195 208 200 Q 205 212 200 213 Q 195 212 192 200 Z" fill="#FF6B8A" stroke="#C7506A" stroke-width="1"/>
  <!-- Nose highlight -->
  <ellipse cx="197" cy="202" rx="2" ry="1.5" fill="#FFB6C1" opacity="0.7"/>
  
  <!-- Mouth -->
  <path d="M 200 213 L 200 225" stroke="#3D2817" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Mouth left curve -->
  <path d="M 200 225 Q 188 232 182 225" stroke="#3D2817" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Mouth right curve -->
  <path d="M 200 225 Q 212 232 218 225" stroke="#3D2817" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tongue (cute small pink tongue) -->
  <path d="M 197 230 Q 200 235 203 230 Q 200 233 197 230 Z" fill="#FF6B8A"/>
  
  <!-- Whiskers - left side -->
  <line x1="155" y1="205" x2="100" y2="195" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="155" y1="215" x2="95" y2="215" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="158" y1="225" x2="105" y2="235" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Whiskers - right side -->
  <line x1="245" y1="205" x2="300" y2="195" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="245" y1="215" x2="305" y2="215" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="242" y1="225" x2="295" y2="235" stroke="#3D2817" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Whisker dots -->
  <circle cx="155" cy="205" r="1.2" fill="#3D2817"/>
  <circle cx="155" cy="215" r="1.2" fill="#3D2817"/>
  <circle cx="158" cy="225" r="1.2" fill="#3D2817"/>
  <circle cx="245" cy="205" r="1.2" fill="#3D2817"/>
  <circle cx="245" cy="215" r="1.2" fill="#3D2817"/>
  <circle cx="242" cy="225" r="1.2" fill="#3D2817"/>
  
  <!-- Small heart decoration above head (cuteness) -->
  <g transform="translate(200, 50)">
    <path d="M 0 5 C -5 -5, -15 -5, -10 5 L 0 15 L 10 5 C 15 -5, 5 -5, 0 5 Z" fill="#FF6B8A" opacity="0.7"/>
  </g>
  
  <!-- Sparkle decorations -->
  <g opacity="0.7">
    <!-- Sparkle 1 -->
    <g transform="translate(80, 80)">
      <path d="M 0 -8 L 1.5 -1.5 L 8 0 L 1.5 1.5 L 0 8 L -1.5 1.5 L -8 0 L -1.5 -1.5 Z" fill="#FFD700"/>
    </g>
    <!-- Sparkle 2 -->
    <g transform="translate(320, 100)">
      <path d="M 0 -6 L 1 -1 L 6 0 L 1 1 L 0 6 L -1 1 L -6 0 L -1 -1 Z" fill="#FFD700"/>
    </g>
    <!-- Sparkle 3 -->
    <g transform="translate(60, 280)">
      <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z" fill="#FFD700"/>
    </g>
  </g>
</svg>