  <g fill="none" stroke="#ffd9bf" stroke-width="2.5">
    <path d="M177 135q9 11 13 23m211-22q-9 10-14 22"/>
  </g>
  <path d="m174 178 10 10-2-16q10 7 13 15l2-12 11 4q-15 10-25 24Z" fill="#ffe0b9"/>
  <path d="m405 179-7 8-1-17-8 13-7-11 1 12-12-5q16 11 27 25Z" fill="#dfcbd0"/>
  <use href="#head" fill="none" stroke="#4d4049" stroke-width="4.2"/>
  <g fill="none" stroke-width="2.3">
    <path d="M162 146q-1-16 1-28m9-7q10 5 19 13" stroke="#ffe4bb"/>
    <path d="M409 112q5-4 8-2" stroke="#cfbdc5"/>
    <path d="M205 215q10-8 23-7" stroke="#ae765a"/>
    <path d="M341 208q13-4 24 5" stroke="#c7b7c2"/>
    <path d="m273 175 4 6 3-3m16-11 3 5" stroke="#dbc2a7"/>
  </g>

  <!-- Glassy sea-green eyes with a pale ring at the bottom of each iris. -->
  <use href="#eye" transform="translate(229 253) rotate(-5)"/>
  <use href="#eye" transform="translate(349 253) rotate(5)"/>
  <ellipse cx="195" cy="295" rx="30" ry="15" fill="url(#blush)"/>
  <ellipse cx="385" cy="295" rx="30" ry="15" fill="url(#blush)"/>
  <path d="M232 303c0-16 19-26 37-23q13 1 20 9 12-11 29-9
    c20 1 32 13 27 27-6 17-37 22-56 10-19 13-53 6-57-14Z" fill="#fff5e4"/>
  <g fill="#b48c80">
    <circle cx="248" cy="298" r="1.8"/><circle cx="257" cy="304" r="1.6"/>
    <circle cx="260" cy="294" r="1.4"/><circle cx="330" cy="298" r="1.8"/>
    <circle cx="321" cy="304" r="1.6"/><circle cx="318" cy="294" r="1.4"/>
  </g>

  <!-- Button nose, smiling muzzle, and just a peek of tongue. -->
  <path d="M277 308q8 2 12-6 5 8 13 6-3 16-12 16-10-1-13-16Z" fill="#67434c"/>
  <path d="M282 317q7-5 16-1-3 6-8 6-5 0-8-5Z" fill="#ed9c9b"/>
  <path d="M289 296v7m0-1c-4 9-16 11-23 4m23-4c4 9 16 11 23 3"
        fill="none" stroke="#69484e" stroke-width="2.7"/>
  <path d="M276 286q13-5 26 0 2 3-2 6l-8 6q-3 3-6 0l-9-7q-3-3-1-5Z"
        fill="#db9291" stroke="#835960" stroke-width="2.2"/>
  <path d="M281 287q4-2 9-1" fill="none" stroke="#ffcebf" stroke-width="2.3"/>
  <path d="M280 337q10 4 20-1" fill="none" stroke="#d9b9a2" stroke-width="2"/>
  <g fill="none" stroke-width="1.9">
    <path d="M239 297q-76-25-134-19m128 26q-74-13-140 2m144 6q-70 1-125 24"
