  </g>

  <!-- A loose strand leads back to the wound ball of yarn. -->
  <ellipse cx="105" cy="543" rx="35" ry="7" fill="url(#shadow)"/>
  <use href="#strand" fill="none" stroke="#a46c73" stroke-width="4.4"/>
  <use href="#strand" fill="none" stroke="#eba3a0" stroke-width="2.4"/>
  <g transform="translate(104 519)">
    <circle r="25" fill="#cc7c84"/>
    <g clip-path="url(#yarnClip)">
      <path d="M-29-4q19-21 40-23M-29 2q20-23 46-27M-27 8q22-24 49-29"
            fill="none" stroke="#f8c3b6" stroke-width="2.1"/>
      <path d="M-29 6Q-8-1 12-28h20V8Q8 19-23 24Z" fill="#df9194"/>
      <path d="M-28 10Q-3 1 17-26M-26 15Q1 5 22-23M-23 20Q6 10 27-18
        M-18 24Q10 15 29-11" fill="none" stroke="#f9c6b9" stroke-width="2"/>
      <path d="M-29 1q16 17 49 23l-9 9h-41Z" fill="#c57580"/>
      <path d="M-29 6q18 17 48 22M-28 13q15 13 35 17"
