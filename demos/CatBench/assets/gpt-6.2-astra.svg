<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720"
     viewBox="0 0 600 600" role="img" aria-labelledby="title desc"
     stroke-linecap="round" stroke-linejoin="round">
  <title id="title">Miso at Moonrise</title>
  <desc id="desc">A fluffy calico kitten with sea-green eyes, a tiny pink tongue,
    and a golden bell sits on an embroidered cushion by a moonlit window.
    A ball of rose-colored yarn has unwound across the wooden sill.</desc>

  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#fff1d9"/>
      <stop offset="1" stop-color="#ebc3ad"/>
    </linearGradient>
    <pattern id="wallpaper" width="24" height="28" patternUnits="userSpaceOnUse">
      <path d="M12 10q0 4-3 5 3 1 3 5 0-4 3-5-3-1-3-5Z" fill="#c69780"/>
      <circle cx="1" cy="1" r="1" fill="#c69780"/>
    </pattern>
    <linearGradient id="sky" x1=".2" y1="0" x2=".7" y2="1">
      <stop stop-color="#26354f"/>
      <stop offset=".52" stop-color="#44647c"/>
      <stop offset="1" stop-color="#94bcb5"/>
    </linearGradient>
    <radialGradient id="moonlight">
      <stop stop-color="#ffedb3" stop-opacity=".36"/>
      <stop offset="1" stop-color="#ffedb3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#f8dbb5"/>
      <stop offset=".8" stop-color="#edc19f"/>
      <stop offset="1" stop-color="#dca88e"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#493e50" stop-opacity=".48"/>
      <stop offset="1" stop-color="#493e50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvet" x1=".25" y1="0" x2=".65" y2="1">
      <stop stop-color="#a4d3bc"/>
      <stop offset=".48" stop-color="#74afa3"/>
      <stop offset="1" stop-color="#438188"/>
    </linearGradient>
    <linearGradient id="fur" x1=".25" y1="0" x2=".65" y2="1">
      <stop stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#fff1da"/>
      <stop offset="1" stop-color="#efd2b3"/>
    </linearGradient>
    <linearGradient id="ginger" x1=".2" y1="0" x2=".75" y2="1">
      <stop stop-color="#ffd095"/>
      <stop offset=".55" stop-color="#efab70"/>
      <stop offset="1" stop-color="#d98b5d"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#938596"/>
      <stop offset="1" stop-color="#5c586d"/>
    </linearGradient>
    <linearGradient id="ear" x1=".3" y1="0" x2=".6" y2="1">
      <stop stop-color="#d88a88"/>
      <stop offset=".65" stop-color="#efada4"/>
      <stop offset="1" stop-color="#ffd5b8"/>
    </linearGradient>
    <linearGradient id="iris" x1=".35" y1="0" x2=".55" y2="1">
      <stop stop-color="#28535e"/>
      <stop offset=".42" stop-color="#497f83"/>
      <stop offset=".8" stop-color="#8dc7af"/>
      <stop offset="1" stop-color="#d4dfac"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop stop-color="#ef9e98" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ef9e98" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff3ba"/>
      <stop offset=".5" stop-color="#f5ce76"/>
      <stop offset="1" stop-color="#d79a4f"/>
    </linearGradient>
    <linearGradient id="whiskerL" gradientUnits="userSpaceOnUse"
                    x1="106" y1="300" x2="239" y2="300">
      <stop stop-color="#ffeacb"/>
      <stop offset=".42" stop-color="#dbc2ab"/>
      <stop offset="1" stop-color="#917470"/>
    </linearGradient>
    <linearGradient id="whiskerR" href="#whiskerL" x1="476" x2="338"/>

    <path id="arch" d="M58 438V272a242 242 0 0 1 484 0v166Z"/>
    <clipPath id="windowClip"><use href="#arch"/></clipPath>
    <path id="spark" d="M0-6Q.8-.8 5 0Q.8.8 0 6Q-.8.8-5 0Q-.8-.8 0-6Z"/>

    <path id="cushion" d="M76 474Q62 457 80 453Q96 449 117 454
      C206 431 399 431 477 452Q499 447 513 455Q525 463 514 475
      Q527 496 510 514Q516 530 502 532Q488 533 476 527
      C392 547 202 548 117 528Q96 537 82 530Q73 525 80 513
      Q63 496 76 474Z"/>
    <clipPath id="cushionClip"><use href="#cushion"/></clipPath>

    <path id="tail" d="M348 455C385 472 428 465 443 438
      C456 416 444 392 438 373C430 348 437 326 455 316
      C470 307 486 313 490 327C494 340 487 351 477 356
      C467 362 473 377 480 395C496 437 478 473 448 488
      C420 502 376 498 347 480Z"/>
    <clipPath id="tailClip"><use href="#tail"/></clipPath>

    <path id="body" d="M235 312C212 332 194 368 184 402
      C174 434 168 462 182 477C194 491 216 492 237 485
      C261 494 321 494 345 486C367 494 390 487 398 469
      C407 446 396 415 383 385C371 355 355 328 342 314Z"/>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>

    <path id="head" d="M164 215C157 190 152 146 155 114Q156 98 168 102
      C191 109 221 133 240 153Q259 147 280 149L276 141Q287 142 298 149
      Q303 143 311 141L309 150Q330 150 348 158
      C369 135 394 112 409 105Q422 98 424 114C429 150 422 190 414 216
      Q432 238 434 264L443 258Q443 273 433 283L445 281Q441 298 425 306
      L433 307C415 339 359 366 292 367C230 368 177 348 152 321
      L143 323Q144 317 149 311Q137 308 130 295L141 296Q129 284 125 271
      L137 275Q138 241 164 215Z"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>

    <g id="eye">
      <path d="M-29 2C-31-17-20-31-4-33C13-35 27-22 29-4
        C32 14 22 29 6 32C-12 36-27 23-29 2Z"
        fill="url(#iris)" stroke="#393543" stroke-width="3.8"/>
      <g fill="none" stroke="#477976" stroke-width="1.5" opacity=".7">
        <path d="M-23 12l5-2m1 12 4-5m9 10 1-6m13 3-2-5m13-2-5-2"/>
      </g>
      <ellipse cx="-1.5" cy="-4" rx="18" ry="24" fill="#202633"/>
      <path d="M-24 13q3 10 11 14M11 25q8-3 11-11" fill="none"
            stroke="#e3efd0" stroke-width="2.3"/>
      <circle cx="-9" cy="-15" r="7.7" fill="#fffdf3"/>
      <circle cx="7" cy="-6" r="3.1" fill="#fffdf3"/>
      <circle cx="15" cy="13" r="1.7" fill="#e4fff1"/>
    </g>
    <clipPath id="yarnClip"><circle r="25"/></clipPath>
    <path id="strand" d="M100 540C84 554 103 566 137 557
      S193 537 212 547C233 559 215 568 207 560
      C199 551 225 543 243 550Q264 559 281 547"/>
  </defs>

  <!-- The arched window and the little night sky beyond it. -->
  <rect width="600" height="600" fill="url(#wall)"/>
  <rect width="600" height="438" fill="url(#wallpaper)" opacity=".24"/>
  <use href="#arch" fill="url(#sky)" stroke="#c69780" stroke-width="20"/>
  <use href="#arch" fill="url(#sky)" stroke="#fff0d0" stroke-width="11"/>
  <g clip-path="url(#windowClip)">
    <circle cx="461" cy="131" r="52" fill="url(#moonlight)"/>
    <path d="M462 101c-15 3-26 17-24 32 2 18 19 30 36 26
      6-1 11-4 15-8-18 2-33-11-34-28-1-8 2-16 7-22Z" fill="#fff1bd"/>
    <g fill="#fff0ca">
      <use href="#spark" transform="translate(109 193) scale(.85)"/>
      <use href="#spark" transform="translate(205 88) scale(.68)"/>
      <use href="#spark" transform="translate(343 94) scale(.85)"/>
      <use href="#spark" transform="translate(491 212) scale(.95)"/>
      <use href="#spark" transform="translate(455 246) scale(.55)"/>
      <use href="#spark" transform="translate(88 306) scale(.55)"/>
      <circle cx="139" cy="154" r="1.6"/><circle cx="235" cy="111" r="1.4"/>
      <circle cx="362" cy="69" r="1.3"/><circle cx="389" cy="93" r="1.8"/>
      <circle cx="122" cy="228" r="1.4"/><circle cx="81" cy="262" r="1.7"/>
      <circle cx="461" cy="189" r="1.4"/><circle cx="516" cy="280" r="1.6"/>
    </g>
    <path d="m258 78 25-16 23 11 19-8" fill="none" stroke="#cadddd" opacity=".28"/>
    <g fill="#e5ece0">
      <circle cx="258" cy="78" r="2"/><circle cx="283" cy="62" r="2.2"/>
      <circle cx="306" cy="73" r="1.7"/><circle cx="325" cy="65" r="1.5"/>
    </g>
    <path d="M30 369Q81 333 136 356T245 346T364 350T478 344T572 345V450H30Z"
          fill="#819da8"/>
    <path d="M30 394Q104 350 171 381T321 377T468 366Q518 354 572 377V450H30Z"
          fill="#66898e"/>
    <path d="M30 409Q109 381 186 405T337 398T475 390Q531 383 570 397V450H30Z"
          fill="#517779"/>
  </g>
  <use href="#arch" fill="none" stroke="#887575" stroke-width="2.5"/>

  <!-- A warm wooden sill and a piped velvet cushion. -->
  <rect y="434" width="600" height="166" fill="url(#wood)"/>
  <path d="M0 435H600" stroke="#fff0ce" stroke-width="5"/>
  <g fill="none" stroke="#bd8b78" stroke-width="1.5" opacity=".43">
    <path d="M0 460q26 2 54-1m491 6q31-4 55-1M0 517q22-3 47 0"/>
    <path d="M16 548q24-4 51-1m395 6q47-7 111-2m-41 4q18-2 37 0"/>
    <path d="M9 568q54-4 91 0m240-10q31-3 55 0M0 578H600"/>
  </g>
  <ellipse cx="298" cy="528" rx="242" ry="23" fill="url(#shadow)"/>
  <use href="#cushion" fill="url(#velvet)"/>
  <g clip-path="url(#cushionClip)">
    <path d="M61 475C177 516 418 517 531 474V554H61Z" fill="#397780"/>
    <path d="M61 475C177 516 418 517 531 474" fill="none" stroke="#326670" stroke-width="5"/>
    <path d="M61 474C177 515 418 516 531 473" fill="none" stroke="#c2dcb7" stroke-width="2.6"/>
    <path d="M66 487C182 527 420 526 525 486" fill="none" stroke="#a9cbb1"
          stroke-width="1.7" stroke-dasharray="3 6"/>
    <g fill="none" stroke="#e0dfb1" stroke-width="1.6">
      <path d="M95 478q29-15 58-12m-43 5q0-7 9-10-1 7-9 10Zm12-3q5 7 13 5-4-6-13-5Z"/>
      <path d="M482 463q14 3 24 12m-15-10q3-6 9-4-2 5-9 4Z"/>
    </g>
  </g>
  <use href="#cushion" fill="none" stroke="#485b60" stroke-width="3.5"/>
  <ellipse cx="298" cy="483" rx="129" ry="18" fill="url(#shadow)"/>

  <!-- The curled, ringed tail sits behind the haunches. -->
  <use href="#tail" fill="url(#ginger)"/>
  <g clip-path="url(#tailClip)">
    <path d="M427 304h77v36q-34 12-73-7Z" fill="url(#fur)"/>
    <path d="M428 341q24 18 57 10l-3 15q-29 8-51-11Z" fill="#847486"/>
    <g fill="#bf7956">
      <path d="M432 374q24 16 49 3l6 14q-27 12-48-2Z"/>
      <path d="M440 409q26 10 49-10l2 16q-24 20-49 11Z"/>
      <path d="M436 443q17 16 40 7l-12 16q-19 4-39-11Z"/>
      <path d="M398 461q7 18 1 36l15-2q7-17-1-34Z"/>
    </g>
    <path d="M446 337q3-12 14-17" fill="none" stroke="#fff9ea" stroke-width="3"/>
  </g>
  <use href="#tail" fill="none" stroke="#51434a" stroke-width="4"/>

  <!-- Calico coat, tucked back feet, and two oversized front paws. -->
  <use href="#body" fill="url(#fur)"/>
  <g clip-path="url(#bodyClip)">
    <path d="M159 342q49-9 63 23c11 25-12 44-9 64s-4 39-31 48l-28-28Z"
          fill="url(#ginger)"/>
    <path d="M355 334q-17 25-6 50c7 19 27 20 30 39q3 15 25 18l5-91Z"
          fill="url(#smoke)"/>
    <path d="M165 403q22-10 42-2-19 0-35 14Zm4 25q17-10 32-7-16 5-28 16Z"
          fill="#c6815d"/>
    <path d="M369 365q9 10 26 10l4 10q-21-2-30-20Z" fill="#a092a0"/>
  </g>
  <use href="#body" fill="none" stroke="#51434a" stroke-width="4"/>
  <g fill="none" stroke="#ab8878" stroke-width="2.4">
    <path d="M211 425q-18 4-24 22m181-22q16 5 22 20"/>
    <path d="M187 466q-2 7 1 12m8-10q-2 7 1 13m177-12q3 6 1 12m9-15q3 6 1 11"/>
  </g>
  <g fill="url(#fur)" stroke="#82695f" stroke-width="2.8">
    <path d="M235 399c5 19 8 40 1 57-8 5-12 13-10 21 2 11 14 16 29 15
      17 0 27-7 28-19l4-56"/>
    <path d="m299 417 1 55c0 13 10 20 26 20 16 0 28-6 29-17
      1-8-4-15-12-20-4-17-1-37 3-55"/>
  </g>
  <g fill="none" stroke="#bc9987" stroke-width="2.2">
    <path d="M239 476q-2 7 1 13m11-11q-2 7 1 13m65-13q-2 6 0 12m12-13q-1 7 1 13"/>
  </g>
  <path d="M211 345q76 27 153-1-2 27-24 50l1-10q-11 20-28 27l2-8
    q-13 16-29 23l2-9-12 5q-8-11-20-16l3 9q-21-9-30-28l-1 9q-14-17-17-51Z"
    fill="#fff3dd"/>
  <path d="m255 388 7 8 1-5m46 5 6-6" fill="none" stroke="#dfc5aa" stroke-width="2"/>

  <!-- Rose collar and a tiny brass bell. -->
  <path d="M208 338q79 35 163 0l-3 20q-81 42-157 0Z"
        fill="#cb7980" stroke="#634954" stroke-width="3"/>
  <path d="M215 354q73 36 148 0" fill="none" stroke="#ffe2bc"
        stroke-width="1.6" stroke-dasharray="2 6"/>
  <ellipse cx="289" cy="377" rx="4" ry="7" fill="none" stroke="#856247" stroke-width="3"/>
  <circle cx="289" cy="394" r="12.5" fill="url(#gold)" stroke="#795943" stroke-width="2.5"/>
  <path d="M278 395q11 4 23-1m-12 5 1 7" fill="none" stroke="#9b7046" stroke-width="2"/>
  <circle cx="289" cy="399" r="2.2" fill="#795943"/>
  <path d="M282 390q2-4 6-4" fill="none" stroke="#fff6cb" stroke-width="2.5"/>

  <!-- An asymmetric ginger-and-smoke mask leaves a cream blaze down the nose. -->
  <use href="#head" fill="url(#fur)"/>
  <g clip-path="url(#headClip)">
    <path d="M112 84h167c7 39 0 76-15 99-9 14-15 24-12 35l-6-4
      c-1 23-19 42-38 50-18 7-31 18-41 34q-35-6-55-31Z" fill="url(#ginger)"/>
    <path d="M316 86h142v188q-24 19-52 23-12-15-31-18
      c-24-4-46-21-51-43l7 5c-13-18-5-35-14-53q-13-27-6-50Z" fill="url(#smoke)"/>
    <g fill="#c57e55">
      <path d="M219 146q-3 21 14 38-6-21 0-32Z"/>
      <path d="M244 143q-7 20 3 42 1-19 14-34Z"/>
      <path d="M136 221q29-5 48 12-25-6-45 6Z"/>
      <path d="M128 244q30-9 50 3-24 0-44 13Z"/>
    </g>
    <g fill="#a698a5" opacity=".78">
      <path d="M335 146q-2 20 9 35-3-21 4-29Z"/>
      <path d="M430 214q-29-2-45 15 25-8 45-4Z"/>
      <path d="M440 239q-28-6-47 8 25-4 44 6Z"/>
    </g>
    <path d="M119 270c23 53 97 84 173 84 68 0 121-25 153-67v94H119Z"
          fill="#bd8e7e" opacity=".17"/>
  </g>

  <!-- Soft inner ears and little tufts along their lower edges. -->
  <path d="M169 119q30 16 54 40-24 13-42 35-11-33-12-75Z"
        fill="url(#ear)" stroke="#a87367" stroke-width="2.5"/>
  <path d="M411 119q-30 17-50 41 26 14 43 35 10-39 7-76Z"
