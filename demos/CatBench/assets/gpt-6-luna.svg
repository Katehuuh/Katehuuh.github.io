    <path d="M222 169 Q225 164 230 172 L249 196" fill="none" stroke="#FFE8E4" stroke-width="3" opacity=".75"/>
    <path d="M418 169 Q415 164 410 172 L391 196" fill="none" stroke="#FFE8E4" stroke-width="3" opacity=".75"/>

    <!-- Tabby stripes on the forehead -->
    <path d="M303 210 C309 220 310 229 308 239
             M320 204 C322 217 322 229 320 241
             M337 210 C331 220 330 229 332 239"
          fill="none" stroke="#91899B" stroke-width="5" opacity=".78"/>
    <path d="M207 275 Q217 279 227 286 M205 294 Q216 298 227 304
             M433 275 Q423 279 413 286 M435 294 Q424 298 413 304"
          fill="none" stroke="#91899B" stroke-width="4" opacity=".68"/>

    <!-- Soft cream muzzle and chin marking -->
    <path d="M267 332
             C271 316 288 309 304 315
             C312 318 317 323 320 327
             C323 323 328 318 336 315
             C352 309 369 316 373 332
             C370 356 355 375 337 382
             C331 384 325 386 320 386
             C315 386 309 384 303 382
             C285 375 270 356 267 332Z"
          fill="url(#cream)"/>

    <!-- Eyebrows -->
    <path d="M252 246 Q271 237 291 246 M349 246 Q369 237 388 246"
          fill="none" stroke="#8D8495" stroke-width="3" opacity=".58"/>

    <!-- Big glossy eyes -->
    <path d="M247 284 C247 267 258 255 273 255 C289 255 298 268 297 285
             C296 302 286 314 272 314 C258 314 248 302 247 284Z"
          fill="#FFFCF6" stroke="#62596B" stroke-width="3"/>
    <path d="M393 284 C393 267 382 255 367 255 C351 255 342 268 343 285
             C344 302 354 314 368 314 C382 314 392 302 393 284Z"
          fill="#FFFCF6" stroke="#62596B" stroke-width="3"/>

    <ellipse cx="273" cy="284" rx="13.5" ry="18" fill="url(#iris)" stroke="#387A73" stroke-width="1.5"/>
    <ellipse cx="367" cy="284" rx="13.5" ry="18" fill="url(#iris)" stroke="#387A73" stroke-width="1.5"/>
    <ellipse cx="275" cy="286" rx="7" ry="13" fill="#263640"/>
    <ellipse cx="365" cy="286" rx="7" ry="13" fill="#263640"/>
    <circle cx="268" cy="276" r="5" fill="#FFFFFF"/>
    <circle cx="360" cy="276" r="5" fill="#FFFFFF"/>
    <circle cx="279" cy="294" r="2.4" fill="#DDF8E9"/>
    <circle cx="371" cy="294" r="2.4" fill="#DDF8E9"/>
    <path d="M250 265 Q245 261 242 256 M390 265 Q395 261 398 256"
          fill="none" stroke="#62596B" stroke-width="3"/>

    <!-- Blushing cheeks -->
    <ellipse cx="250" cy="339" rx="15" ry="9" fill="#E99EAA" opacity=".34"/>
    <ellipse cx="390" cy="339" rx="15" ry="9" fill="#E99EAA" opacity=".34"/>

    <!-- Whiskers -->
    <path d="M295 333 C273 327 252 326 229 330
             M294 342 C271 343 250 349 231 358
             M296 350 C277 360 263 370 249 382
             M345 333 C367 327 388 326 411 330
             M346 342 C369 343 390 349 409 358
             M344 350 C363 360 377 370 391 382"
          fill="none" stroke="#81798A" stroke-width="2.2" opacity=".82"/>

    <!-- Muzzle puffs -->
    <ellipse cx="303" cy="340" rx="20" ry="14" fill="#FFFCF7"/>
    <ellipse cx="337" cy="340" rx="20" ry="14" fill="#FFFCF7"/>

    <!-- Tiny whisker freckles -->
    <g fill="#B58C98" opacity=".76">
      <circle cx="291" cy="337" r="1.7"/>
      <circle cx="296" cy="343" r="1.7"/>
      <circle cx="291" cy="348" r="1.7"/>
      <circle cx="349" cy="337" r="1.7"/>
      <circle cx="344" cy="343" r="1.7"/>
      <circle cx="349" cy="348" r="1.7"/>
    </g>

    <!-- Pink nose and sweet little mouth -->
    <path d="M310 324 Q320 316 330 324 Q330 333 320 337 Q310 333 310 324Z"
          fill="#E88F9C" stroke="#B96F80" stroke-width="1.5"/>
    <path d="M315 323 Q320 320 324 323" fill="none" stroke="#FFD6D7" stroke-width="2.5" opacity=".9"/>
    <path d="M320 336 C320 341 320 343 320 345
             M320 345 C316 351 309 354 303 350
             M320 345 C324 351 331 354 337 350"
          fill="none" stroke="#62596B" stroke-width="2.8"/>

    <!-- A few soft fur strokes on the chest -->
    <path d="M307 548 Q313 553 320 554 Q327 553 333 548"
          fill="none" stroke="#D8D1D8" stroke-width="2.5" opacity=".72"/>
  </g>
</svg>
