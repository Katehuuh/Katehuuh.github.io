<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">A cute little kitten</title>
  <desc id="desc">A fluffy gray kitten with bright green eyes, pink ears, a curled striped tail, and a warm pastel backdrop.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F1"/>
      <stop offset="1" stop-color="#F8E8E3"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="0.78" stop-color="#FFF8F1"/>
      <stop offset="1" stop-color="#F7DFDC" stop-opacity=".55"/>
    </radialGradient>

    <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#E3DFE7"/>
      <stop offset=".48" stop-color="#C8C3D0"/>
      <stop offset="1" stop-color="#AAA5B5"/>
    </linearGradient>

    <linearGradient id="headFur" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#E7E3EA"/>
      <stop offset=".52" stop-color="#CDC8D4"/>
      <stop offset="1" stop-color="#B6B1C0"/>
    </linearGradient>

    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFA"/>
      <stop offset="1" stop-color="#F1EAE3"/>
    </linearGradient>

    <linearGradient id="earPink" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#F7C7CD"/>
      <stop offset="1" stop-color="#D98F9F"/>
    </linearGradient>

    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BCE7C9"/>
      <stop offset=".45" stop-color="#66B99B"/>
      <stop offset="1" stop-color="#347E78"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Soft pastel setting -->
  <rect width="640" height="720" fill="url(#background)"/>
  <rect x="14" y="14" width="612" height="692" rx="30" fill="none" stroke="#EBD8D3" stroke-width="2.5" opacity=".8"/>
  <circle cx="320" cy="336" r="246" fill="url(#halo)"/>

  <!-- Little floating decorations -->
  <g opacity=".76">
    <path d="M150 294 C144 288 136 289 136 296 C136 303 150 311 150 311 C150 311 164 303 164 296 C164 289 156 288 150 294Z" fill="#E9A9B1"/>
    <path d="M491 247 C486 241 478 242 478 249 C478 256 491 264 491 264 C491 264 504 256 504 249 C504 242 496 241 491 247Z" fill="#E9A9B1"/>
    <path d="M128 186 L132 198 L144 202 L132 206 L128 218 L124 206 L112 202 L124 198Z" fill="#E9C77D"/>
    <path d="M509 378 L513 389 L524 393 L513 397 L509 408 L505 397 L494 393 L505 389Z" fill="#E9C77D"/>
    <path d="M508 172 L511 180 L519 183 L511 186 L508 194 L505 186 L497 183 L505 180Z" fill="#D9B8C6"/>
    <path d="M132 424 L135 432 L143 435 L135 438 L132 446 L129 438 L121 435 L129 432Z" fill="#D9B8C6"/>
    <circle cx="176" cy="224" r="3.5" fill="#E7B4B0"/>
    <circle cx="467" cy="430" r="3" fill="#E7B4B0"/>
    <circle cx="488" cy="308" r="2.5" fill="#E9C77D"/>
    <circle cx="159" cy="477" r="2.5" fill="#E9C77D"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="320" cy="633" rx="150" ry="20" fill="#766577" opacity=".19" filter="url(#softShadow)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Curled striped tail, behind the kitten -->
    <path d="M394 524 C450 513 489 535 491 568 C493 592 478 609 459 609 C441 609 431 594 438 582 C444 572 459 574 465 585"
          fill="none" stroke="#62596B" stroke-width="37"/>
    <path d="M394 524 C450 513 489 535 491 568 C493 592 478 609 459 609 C441 609 431 594 438 582 C444 572 459 574 465 585"
          fill="none" stroke="url(#fur)" stroke-width="29"/>
    <path d="M454 521 C465 525 473 533 477 543" fill="none" stroke="#918A9B" stroke-width="19" opacity=".9"/>
    <path d="M484 551 C490 560 491 571 488 580" fill="none" stroke="#918A9B" stroke-width="19" opacity=".9"/>

    <!-- Seated body -->
    <path d="M246 394
             C225 420 216 465 219 514
             C221 558 239 586 267 600
             C282 608 301 611 320 611
             C339 611 358 608 373 600
             C401 586 419 558 421 514
             C424 465 415 420 394 394
             C375 414 350 425 320 425
             C290 425 265 414 246 394Z"
          fill="url(#fur)" stroke="#62596B" stroke-width="5"/>

    <!-- Subtle tabby markings on the shoulders -->
    <path d="M233 452 Q245 460 256 462 M228 473 Q240 480 252 481"
          fill="none" stroke="#8E8799" stroke-width="4" opacity=".62"/>
    <path d="M407 452 Q395 460 384 462 M412 473 Q400 480 388 481"
          fill="none" stroke="#8E8799" stroke-width="4" opacity=".62"/>

