             C345 580 359 558 364 526
             C370 484 371 432 362 404
             C349 414 335 420 320 420
             C305 420 291 414 278 404Z"
          fill="url(#cream)"/>

    <!-- Front paws -->
    <path d="M252 556
             C263 566 279 571 296 570
             C307 570 315 565 320 559
             L320 589
             C320 603 310 611 296 612
             C280 613 263 609 255 600
             C248 592 248 572 252 556Z"
          fill="url(#fur)" stroke="#62596B" stroke-width="4"/>
    <path d="M388 556
             C377 566 361 571 344 570
             C333 570 325 565 320 559
             L320 589
             C320 603 330 611 344 612
             C360 613 377 609 385 600
             C392 592 392 572 388 556Z"
          fill="url(#fur)" stroke="#62596B" stroke-width="4"/>

    <!-- Toe details -->
    <path d="M276 591 C276 596 274 599 271 601 M296 592 C296 597 294 600 291 602
             M344 592 C344 597 346 600 349 602 M364 591 C364 596 366 599 369 601"
          fill="none" stroke="#81798A" stroke-width="2.5" opacity=".78"/>

    <!-- Oversized kitten head and ears -->
    <path d="M201 269
             C195 231 199 185 210 145
             C215 126 229 126 243 144
             L274 185
             C303 174 337 174 366 185
             L397 144
             C411 126 425 126 430 145
             C441 185 445 231 439 269
             C448 287 448 309 440 330
             C422 373 382 397 320 399
             C258 397 218 373 200 330
             C192 309 192 287 201 269Z"
          fill="url(#headFur)" stroke="#62596B" stroke-width="5"/>

    <!-- Inner ears -->
    <path d="M215 164 C219 152 225 153 234 166 L258 199
