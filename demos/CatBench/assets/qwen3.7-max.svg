<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="25.60 25.60 748.80 748.80" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </radialGradient>

    <!-- Fur Gradients -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB067"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
    
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>

    <!-- Eye Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#0000CD"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  
  <circle cx="400" cy="400" r="360" fill="url(#bgGrad)"/>

  <!-- Background Sparkles -->
  <g fill="#FFFFFF" opacity="0.6">
    <path d="M 150 200 Q 160 200 160 190 Q 160 200 170 200 Q 160 200 160 210 Q 160 200 150 200 Z"/>
    <path d="M 650 150 Q 665 150 665 135 Q 665 150 680 150 Q 665 150 665 165 Q 665 150 650 150 Z"/>
    <path d="M 700 500 Q 710 500 710 490 Q 710 500 720 500 Q 710 500 710 510 Q 710 500 700 500 Z"/>
    <path d="M 100 550 Q 115 550 115 535 Q 115 550 130 550 Q 115 550 115 565 Q 115 550 100 550 Z"/>
    <circle cx="200" cy="120" r="4"/>
    <circle cx="600" cy="250" r="3"/>
    <circle cx="120" cy="400" r="5"/>
    <circle cx="680" cy="650" r="4"/>
  </g>

  <!-- Kitten Group -->
  <g filter="url(#shadow)">
    
    <!-- Tail -->
    <path d="M 480 620 C 650 680, 750 500, 650 380 C 610 330, 550 380, 590 440 C 620 480, 620 550, 520 580 Z" fill="url(#furGrad)"/>
    <!-- Tail Stripes -->
    <g fill="none" stroke="#D35400" stroke-width="10" stroke-linecap="round">
      <path d="M 645 410 Q 610 420 615 450"/>
      <path d="M 665 460 Q 620 480 625 510"/>
      <path d="M 645 530 Q 600 540 580 560"/>
    </g>

    <!-- Back Paws -->
    <ellipse cx="270" cy="660" rx="45" ry="30" fill="url(#furGrad)"/>
    <ellipse cx="530" cy="660" rx="45" ry="30" fill="url(#furGrad)"/>
    <!-- Back Paw Toes -->
    <g fill="none" stroke="#D35400" stroke-width="4" stroke-linecap="round">
      <path d="M 245 675 L 250 655 M 270 680 L 270 660 M 295 675 L 290 655"/>
      <path d="M 505 675 L 510 655 M 530 680 L 530 660 M 555 675 L 550 655"/>
    </g>

    <!-- Body -->
    <path d="M 280 450 C 180 550, 220 700, 400 700 C 580 700, 620 550, 520 450 Z" fill="url(#furGrad)"/>
    
    <!-- Belly -->
    <path d="M 320 500 C 260 580, 300 680, 400 680 C 500 680, 540 580, 480 500 Z" fill="url(#bellyGrad)"/>

    <!-- Ears (Placed behind head) -->
    <!-- Left Ear -->
    <path d="M 280 240 L 180 70 L 360 190 Z" fill="url(#furGrad)"/>
    <path d="M 285 220 L 210 100 L 340 190 Z" fill="#FF8A80"/>
    <!-- Left Ear Fluff -->
    <path d="M 260 190 Q 240 140 280 170 Q 270 130 300 170" fill="none" stroke="#FFF3E0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right Ear -->
    <path d="M 520 240 L 620 70 L 440 190 Z" fill="url(#furGrad)"/>
    <path d="M 515 220 L 590 100 L 460 190 Z" fill="#FF8A80"/>
    <!-- Right Ear Fluff -->
    <path d="M 540 190 Q 560 140 520 170 Q 530 130 500 170" fill="none" stroke="#FFF3E0" stroke-width="6" stroke-linecap="round"/>

    <!-- Head Base (Fluffy Cheeks) -->
    <path d="M 400 170               C 490 170, 550 210, 570 280               Q 600 290, 580 320               Q 610 340, 580 370               Q 600 400, 560 420               C 530 490, 470 510, 400 510               C 330 510, 270 490, 240 420               Q 200 400, 220 370               Q 190 340, 220 320               Q 200 290, 230 280               C 250 210, 310 170, 400 170 Z" fill="url(#furGrad)"/>

    <!-- Tabby Stripes (Head) -->
    <g fill="none" stroke="#D35400" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Forehead "M" -->
      <path d="M 350 230 L 375 270 L 400 240 L 425 270 L 450 230"/>
      <path d="M 380 210 L 400 230 L 420 210"/>
      <!-- Left Cheek Stripes -->
      <path d="M 230 330 L 270 340"/>
      <path d="M 220 360 L 260 365"/>
      <path d="M 235 390 L 270 385"/>
      <!-- Right Cheek Stripes -->
      <path d="M 570 330 L 530 340"/>
      <path d="M 580 360 L 540 365"/>
      <path d="M 565 390 L 530 385"/>
    </g>

    <!-- Muzzle -->
    <ellipse cx="400" cy="430" rx="65" ry="45" fill="#FFF3E0"/>
    <ellipse cx="365" cy="435" rx="35" ry="25" fill="#FFFFFF"/>
    <ellipse cx="435" cy="435" rx="35" ry="25" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 382 410 Q 400 400 418 410 L 400 430 Z" fill="#FF5252"/>
    <ellipse cx="400" cy="412" rx="8" ry="3" fill="#FF8A80"/>

    <!-- Mouth & Tongue -->
    <path d="M 400 430 L 400 445" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
    <path d="M 365 445 Q 382 465 400 445 Q 418 465 435 445" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
    <path d="M 388 452 Q 400 475 412 452 Z" fill="#FF5252"/>

    <!-- Blush -->
    <ellipse cx="280" cy="400" rx="30" ry="18" fill="#FF8A80" opacity="0.4"/>
    <ellipse cx="520" cy="400" rx="30" ry="18" fill="#FF8A80" opacity="0.4"/>

    <!-- Eyes -->
    <!-- Left Eye -->
    <ellipse cx="310" cy="340" rx="48" ry="58" fill="#FFFFFF"/>
    <ellipse cx="315" cy="340" rx="38" ry="48" fill="url(#irisGrad)"/>
    <ellipse cx="315" cy="340" rx="22" ry="38" fill="#1A1A1A"/>
    <!-- Left Eye Highlights -->
    <circle cx="295" cy="310" r="14" fill="#FFFFFF"/>
    <circle cx="335" cy="365" r="6" fill="#FFFFFF"/>
    <circle cx="325" cy="315" r="3" fill="#FFFFFF"/>
    <!-- Left Eyeliner -->
    <path d="M 255 330 Q 310 260 365 330" fill="none" stroke="#3E2723" stroke-width="10" stroke-linecap="round"/>
    <path d="M 255 330 Q 240 320 235 300" fill="none" stroke="#3E2723" stroke-width="6" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="490" cy="340" rx="48" ry="58" fill="#FFFFFF"/>
    <ellipse cx="485" cy="340" rx="38" ry="48" fill="url(#irisGrad)"/>
    <ellipse cx="485" cy="340" rx="22" ry="38" fill="#1A1A1A"/>
    <!-- Right Eye Highlights -->
    <circle cx="465" cy="310" r="14" fill="#FFFFFF"/>
    <circle cx="505" cy="365" r="6" fill="#FFFFFF"/>
    <circle cx="495" cy="315" r="3" fill="#FFFFFF"/>
    <!-- Right Eyeliner -->
    <path d="M 435 330 Q 490 260 545 330" fill="none" stroke="#3E2723" stroke-width="10" stroke-linecap="round"/>
    <path d="M 545 330 Q 560 320 565 300" fill="none" stroke="#3E2723" stroke-width="6" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <!-- Left Whiskers -->
      <path d="M 320 420 Q 180 390 100 400"/>
      <path d="M 320 435 Q 180 435 90 445"/>
      <path d="M 320 450 Q 180 480 110 500"/>
      <!-- Right Whiskers -->
      <path d="M 480 420 Q 620 390 700 400"/>
      <path d="M 480 435 Q 620 435 710 445"/>
      <path d="M 480 450 Q 620 480 690 500"/>
    </g>

    <!-- Collar -->
    <path d="M 270 470 Q 400 540 530 470" fill="none" stroke="#E74C3C" stroke-width="18" stroke-linecap="round"/>
    <!-- Collar Bell -->
    <circle cx="400" cy="520" r="22" fill="#F1C40F"/>
    <circle cx="400" cy="520" r="22" fill="none" stroke="#D4AC0D" stroke-width="3"/>
    <line x1="400" y1="505" x2="400" y2="540" stroke="#D4AC0D" stroke-width="3"/>
    <circle cx="400" cy="532" r="5" fill="#D4AC0D"/>
    <path d="M 382 520 Q 400 525 418 520" fill="none" stroke="#D4AC0D" stroke-width="3"/>

    <!-- Front Paws -->
    <!-- Left Front Paw -->
    <path d="M 310 570 C 290 650, 310 695, 355 695 C 390 695, 400 650, 380 570 Z" fill="url(#bellyGrad)"/>
    <g fill="none" stroke="#D35400" stroke-width="4" stroke-linecap="round">
      <path d="M 330 695 L 335 665"/>
      <path d="M 355 695 L 355 665"/>
      <path d="M 380 690 L 375 665"/>
    </g>
    
    <!-- Right Front Paw -->
    <path d="M 490 570 C 510 650, 490 695, 445 695 C 410 695, 400 650, 420 570 Z" fill="url(#bellyGrad)"/>
    <g fill="none" stroke="#D35400" stroke-width="4" stroke-linecap="round">
      <path d="M 470 695 L 465 665"/>
      <path d="M 445 695 L 445 665"/>
      <path d="M 420 690 L 425 665"/>
    </g>

    <!-- Chest Fluff Details -->
    <path d="M 360 490 Q 380 530 370 550 Q 390 520 400 540 Q 410 520 430 550 Q 420 530 440 490" fill="none" stroke="#FFF3E0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Yarn Ball (Foreground Element) -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="680" r="45" fill="#9B59B6"/>
    <!-- Yarn Texture Lines -->
    <g fill="none" stroke="#8E44AD" stroke-width="4" stroke-linecap="round">
      <path d="M 165 655 Q 200 630 235 665"/>
      <path d="M 155 680 Q 200 660 245 680"/>
      <path d="M 165 705 Q 200 690 235 705"/>
      <path d="M 180 640 Q 160 680 180 720"/>
      <path d="M 200 635 Q 180 680 200 725"/>
      <path d="M 220 640 Q 200 680 220 720"/>
    </g>
    <!-- Loose String -->
    <path d="M 235 705 Q 270 730 310 710 T 360 720" fill="none" stroke="#9B59B6" stroke-width="5" stroke-linecap="round"/>
  </g>

</svg>