<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff6ee"/>
      <stop offset="55%" stop-color="#f4c9a8"/>
      <stop offset="100%" stop-color="#e8a882"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffaf6"/>
      <stop offset="100%" stop-color="#f7e3d4"/>
    </radialGradient>
    <radialGradient id="earIn" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#ffb7c5"/>
      <stop offset="100%" stop-color="#e8899a"/>
    </radialGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="390" rx="110" ry="16" fill="#000" opacity="0.12"/>

  <!-- tail -->
  <path d="M278 300
           C340 290 360 230 330 190
           C310 165 280 175 275 200
           C272 218 286 230 300 225"
        fill="none" stroke="#e8a882" stroke-width="22" stroke-linecap="round"/>
  <path d="M278 300
           C340 290 360 230 330 190
           C310 165 280 175 275 200
           C272 218 286 230 300 225"
        fill="none" stroke="#f7d7c0" stroke-width="10" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="200" cy="300" rx="95" ry="78" fill="url(#fur)"/>
  <ellipse cx="200" cy="318" rx="62" ry="48" fill="url(#belly)"/>

  <!-- back paw -->
  <ellipse cx="145" cy="365" rx="28" ry="16" fill="#f0c4a4"/>
  <ellipse cx="255" cy="365" rx="28" ry="16" fill="#f0c4a4"/>

  <!-- head -->
  <ellipse cx="200" cy="175" rx="92" ry="82" fill="url(#fur)"/>

  <!-- ears -->
  <path d="M128 130 L108 52 L168 108 Z" fill="#f0c4a4"/>
  <path d="M132 122 L118 68 L160 108 Z" fill="url(#earIn)"/>
  <path d="M272 130 L292 52 L232 108 Z" fill="#f0c4a4"/>
  <path d="M268 122 L282 68 L240 108 Z" fill="url(#earIn)"/>

  <!-- cheek fluff -->
  <ellipse cx="118" cy="195" rx="22" ry="16" fill="#f8dcc8" opacity="0.9"/>
  <ellipse cx="282" cy="195" rx="22" ry="16" fill="#f8dcc8" opacity="0.9"/>

  <!-- muzzle -->
  <ellipse cx="200" cy="205" rx="38" ry="28" fill="#fff8f3"/>

  <!-- eyes -->
  <ellipse cx="168" cy="168" rx="16" ry="20" fill="#2b211c"/>
  <ellipse cx="232" cy="168" rx="16" ry="20" fill="#2b211c"/>
  <ellipse cx="163" cy="162" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="227" cy="162" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="172" cy="174" rx="2.5" ry="3" fill="#fff" opacity="0.7"/>
  <ellipse cx="236" cy="174" rx="2.5" ry="3" fill="#fff" opacity="0.7"/>

  <!-- nose -->
  <path d="M200 188
           C194 188 188 194 188 198
           C188 204 194 208 200 208
           C206 208 212 204 212 198
           C212 194 206 188 200 188 Z" fill="#e07a8a"/>
  <ellipse cx="196" cy="196" rx="2" ry="1.2" fill="#fff" opacity="0.6"/>

  <!-- mouth -->
  <path d="M200 208 Q200 218 188 220" fill="none" stroke="#c47a6a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M200 208 Q200 218 212 220" fill="none" stroke="#c47a6a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M188 220 Q180 224 174 220" fill="none" stroke="#d9a090" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M212 220 Q220 224 226 220" fill="none" stroke="#d9a090" stroke-width="1.2" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#c9a090" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M162 200 Q120 192 96 186"/>
    <path d="M160 208 Q118 210 92 214"/>
    <path d="M164 214 Q124 224 104 232"/>
    <path d="M238 200 Q280 192 304 186"/>
    <path d="M240 208 Q282 210 308 214"/>
    <path d="M236 214 Q276 224 296 232"/>
  </g>

  <!-- front paws -->
  <ellipse cx="160" cy="352" rx="26" ry="18" fill="#f6d2b8"/>
  <ellipse cx="240" cy="352" rx="26" ry="18" fill="#f6d2b8"/>
  <!-- toe beans -->
  <g fill="#e8899a">
    <ellipse cx="150" cy="350" rx="4" ry="3"/>
    <ellipse cx="160" cy="346" rx="4" ry="3"/>
    <ellipse cx="170" cy="350" rx="4" ry="3"/>
    <ellipse cx="230" cy="350" rx="4" ry="3"/>
    <ellipse cx="240" cy="346" rx="4" ry="3"/>
    <ellipse cx="250" cy="350" rx="4" ry="3"/>
  </g>

  <!-- little bow -->
  <g transform="translate(248,118)">
    <path d="M0 8 C-8 0 -22 -2 -26 6 C-22 14 -8 12 0 8 Z" fill="#f48fb1"/>
    <path d="M0 8 C8 0 22 -2 26 6 C22 14 8 12 0 8 Z" fill="#f48fb1"/>
    <circle cx="0" cy="8" r="5" fill="#ec407a"/>
  </g>
</svg>
