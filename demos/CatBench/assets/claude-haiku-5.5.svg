  <ellipse cx="352" cy="534" rx="37" ry="25" fill="url(#cream)" stroke="#b65f2c" stroke-width="3.5"/>
  <g fill="none" stroke="#c9895a" stroke-width="2.6" stroke-linecap="round">
    <path d="M236 524 L234 542 M249 522 L249 546 M262 524 L264 542"/>
    <path d="M340 524 L338 542 M351 522 L351 546 M364 524 L366 542"/>
  </g>

  <!-- Collar and bell -->
  <path d="M201 356 Q300 424 399 356" fill="none" stroke="#d93f57" stroke-width="16" stroke-linecap="round"/>
  <circle cx="300" cy="408" r="13" fill="url(#gold)" stroke="#b97d1e" stroke-width="2.5"/>
  <path d="M290 414 Q300 420 310 414" fill="none" stroke="#b97d1e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="295" cy="401" r="3" fill="#ffffff" opacity="0.85"/>

