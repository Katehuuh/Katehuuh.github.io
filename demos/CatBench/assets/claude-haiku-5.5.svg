  <ellipse cx="236" cy="430" rx="18" ry="32" fill="#ffe9d2" opacity="0.4" transform="rotate(12 236 430)"/>
  <path d="M190 398 Q200 410 192 426 M410 398 Q400 410 408 426" fill="none" stroke="#d2682c" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="300" cy="458" rx="70" ry="84" fill="url(#cream)"/>

