<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>A cute orange tabby kitten</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#ffd9e3"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbb7a"/>
      <stop offset="100%" stop-color="#ef8a4c"/>
    </linearGradient>
    <radialGradient id="cream" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#fbe2c6"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d9f283"/>
      <stop offset="55%" stop-color="#7fb845"/>
      <stop offset="100%" stop-color="#3f6e1f"/>
    </radialGradient>
    <radialGradient id="gold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff4a8"/>
      <stop offset="100%" stop-color="#e3a52c"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#sky)"/>
  <circle cx="300" cy="320" r="240" fill="#ffffff" opacity="0.35"/>

  <!-- Sparkles and hearts -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(520 110) scale(1.3)" fill="#ffd45e"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(80 236)" fill="#ffd45e"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(552 300) scale(0.7)" fill="#ffd45e"/>
  <path d="M0 -4 C0 -8 -4 -10 -7 -10 C-11 -10 -13 -6 -13 -3 C-13 2 -6 7 0 12 C6 7 13 2 13 -3 C13 -6 11 -10 7 -10 C4 -10 0 -8 0 -4 Z" transform="translate(112 118) rotate(-14) scale(1.5)" fill="#ff9db5"/>
  <path d="M0 -4 C0 -8 -4 -10 -7 -10 C-11 -10 -13 -6 -13 -3 C-13 2 -6 7 0 12 C6 7 13 2 13 -3 C13 -6 11 -10 7 -10 C4 -10 0 -8 0 -4 Z" transform="translate(486 196) rotate(12)" fill="#ffc2d1"/>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="556" rx="182" ry="22" fill="#9a6440" opacity="0.22" filter="url(#soft)"/>

  <!-- Yarn ball and thread -->
  <path d="M152 548 Q184 574 218 540" fill="none" stroke="#3fa597" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="112" cy="530" r="44" fill="#7fd6c8" stroke="#3fa597" stroke-width="3.5"/>
  <g fill="none" stroke="#3fa597" stroke-width="3" stroke-linecap="round">
    <path d="M72 512 Q112 490 150 520"/>
    <path d="M70 542 Q112 566 152 538"/>
    <path d="M96 490 Q106 530 98 570"/>
    <path d="M128 490 Q118 530 126 570"/>
  </g>
  <ellipse cx="98" cy="512" rx="14" ry="7" fill="#ffffff" opacity="0.4" transform="rotate(-20 98 512)"/>

  <!-- Tail -->
  <path d="M395 505 C470 525 520 480 500 415 C490 385 462 380 458 402" fill="none" stroke="#b65f2c" stroke-width="40" stroke-linecap="round"/>
  <path d="M395 505 C470 525 520 480 500 415 C490 385 462 380 458 402" fill="none" stroke="url(#fur)" stroke-width="33" stroke-linecap="round"/>
  <path d="M474 482 L492 502 M480 375 L473 403" fill="none" stroke="#d2682c" stroke-width="7" stroke-linecap="round"/>

