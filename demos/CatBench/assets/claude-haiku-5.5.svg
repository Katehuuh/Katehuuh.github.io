  <ellipse cx="222" cy="498" rx="54" ry="42" fill="url(#fur)" stroke="#b65f2c" stroke-width="3.5"/>
  <ellipse cx="378" cy="498" rx="54" ry="42" fill="url(#fur)" stroke="#b65f2c" stroke-width="3.5"/>
  <path d="M190 480 Q198 492 192 504 M410 480 Q402 492 408 504" fill="none" stroke="#d2682c" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

