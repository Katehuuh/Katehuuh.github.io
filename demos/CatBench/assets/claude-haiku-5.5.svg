  <path d="M206 196 C184 160 182 104 206 78 Q214 68 222 78 C240 98 262 124 282 150 Z" fill="url(#fur)" stroke="#b65f2c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M394 196 C416 160 418 104 394 78 Q386 68 378 78 C360 98 338 124 318 150 Z" fill="url(#fur)" stroke="#b65f2c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M212 170 C204 140 206 112 218 98 C232 112 246 130 258 150 Z" fill="#ffb3c1"/>
  <path d="M388 170 C396 140 394 112 382 98 C368 112 354 130 342 150 Z" fill="#ffb3c1"/>

  <!-- Head -->
  <ellipse cx="300" cy="262" rx="128" ry="116" fill="url(#fur)" stroke="#b65f2c" stroke-width="3.5"/>
  <ellipse cx="300" cy="186" rx="58" ry="18" fill="#ffe6c8" opacity="0.45"/>
  <g fill="none" stroke="#d2682c" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M300 152 Q297 172 300 192"/>
    <path d="M268 156 Q274 172 284 184"/>
    <path d="M332 156 Q326 172 316 184"/>
    <path d="M182 240 L203 248"/>
    <path d="M180 262 L201 262"/>
    <path d="M418 240 L397 248"/>
    <path d="M420 262 L399 262"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="248" cy="270" rx="26" ry="30" fill="url(#iris)" stroke="#4a2c1a" stroke-width="3"/>
  <ellipse cx="352" cy="270" rx="26" ry="30" fill="url(#iris)" stroke="#4a2c1a" stroke-width="3"/>
  <ellipse cx="248" cy="272" rx="12" ry="18" fill="#1d130c"/>
  <ellipse cx="352" cy="272" rx="12" ry="18" fill="#1d130c"/>
  <circle cx="256" cy="258" r="7.5" fill="#ffffff"/>
  <circle cx="360" cy="258" r="7.5" fill="#ffffff"/>
  <circle cx="240" cy="284" r="3.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="344" cy="284" r="3.8" fill="#ffffff" opacity="0.9"/>

  <!-- Blush -->
  <ellipse cx="206" cy="302" rx="19" ry="12" fill="#ff8aa6" opacity="0.5"/>
  <ellipse cx="394" cy="302" rx="19" ry="12" fill="#ff8aa6" opacity="0.5"/>

  <!-- Muzzle -->
  <ellipse cx="283" cy="308" rx="25" ry="20" fill="#fff4e6"/>
  <ellipse cx="317" cy="308" rx="25" ry="20" fill="#fff4e6"/>

  <!-- Nose and mouth -->
  <path d="M289 287 Q300 281 311 287 Q305 297 300 298 Q295 297 289 287 Z" fill="#f0768f" stroke="#b9485f" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M296 309 Q300 318 304 309 Z" fill="#ff8ea3"/>
  <path d="M300 298 L300 305 M300 305 Q292 315 282 307 M300 305 Q308 315 318 307" fill="none" stroke="#6b3d24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Whiskers -->
  <g fill="none" stroke="#7a4726" stroke-width="2.2" stroke-linecap="round">
    <path d="M232 302 Q200 296 166 290"/>
    <path d="M232 314 Q198 314 164 320"/>
    <path d="M234 324 Q206 332 176 344"/>
    <path d="M368 302 Q400 296 434 290"/>
    <path d="M368 314 Q402 314 436 320"/>
    <path d="M366 324 Q394 332 424 344"/>
  </g>
</svg>
