<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFF8E7" rx="20"/>
  
  <!-- Soft shadow under kitten -->
  <ellipse cx="200" cy="350" rx="100" ry="15" fill="#E8D5B7" opacity="0.5"/>
  
  <!-- Body -->
  <ellipse cx="200" cy="280" rx="85" ry="75" fill="#FFB347"/>
  
  <!-- Belly -->
  <ellipse cx="200" cy="295" rx="55" ry="50" fill="#FFE4B5"/>
  
  <!-- Left ear -->
  <polygon points="130,120 155,60 175,115" fill="#FFB347"/>
  <polygon points="138,115 155,75 168,110" fill="#FF9999"/>
  
  <!-- Right ear -->
  <polygon points="270,120 245,60 225,115" fill="#FFB347"/>
  <polygon points="262,115 245,75 232,110" fill="#FF9999"/>
  
  <!-- Head -->
  <circle cx="200" cy="160" r="75" fill="#FFB347"/>
  
  <!-- Left cheek blush -->
  <ellipse cx="155" cy="185" rx="18" ry="12" fill="#FF9999" opacity="0.4"/>
  
  <!-- Right cheek blush -->
  <ellipse cx="245" cy="185" rx="18" ry="12" fill="#FF9999" opacity="0.4"/>
  
  <!-- Left eye white -->
  <ellipse cx="170" cy="155" rx="18" ry="20" fill="white"/>
  
  <!-- Right eye white -->
  <ellipse cx="230" cy="155" rx="18" ry="20" fill="white"/>
  
  <!-- Left pupil -->
  <ellipse cx="172" cy="157" rx="10" ry="12" fill="#2C1810"/>
  
  <!-- Right pupil -->
  <ellipse cx="228" cy="157" rx="10" ry="12" fill="#2C1810"/>
  
  <!-- Left eye highlight -->
  <circle cx="176" cy="150" r="4" fill="white"/>
  
  <!-- Right eye highlight -->
  <circle cx="232" cy="150" r="4" fill="white"/>
  
  <!-- Nose -->
  <polygon points="200,175 193,185 207,185" fill="#FF6B6B"/>
  
  <!-- Mouth -->
  <path d="M 200 185 Q 190 195 185 190" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 200 185 Q 210 195 215 190" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers left -->
  <line x1="140" y1="175" x2="90" y2="165" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="182" x2="85" y2="182" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="189" x2="90" y2="199" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Whiskers right -->
  <line x1="260" y1="175" x2="310" y2="165" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="260" y1="182" x2="315" y2="182" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="260" y1="189" x2="310" y2="199" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Left front paw -->
  <ellipse cx="165" cy="340" rx="22" ry="18" fill="#FFB347"/>
  <ellipse cx="165" cy="345" rx="18" ry="12" fill="#FFE4B5"/>
  <!-- Paw pads -->
  <circle cx="158" cy="343" r="3" fill="#FF9999"/>
  <circle cx="165" cy="345" r="3" fill="#FF9999"/>
  <circle cx="172" cy="343" r="3" fill="#FF9999"/>
  
  <!-- Right front paw -->
  <ellipse cx="235" cy="340" rx="22" ry="18" fill="#FFB347"/>
  <ellipse cx="235" cy="345" rx="18" ry="12" fill="#FFE4B5"/>
  <!-- Paw pads -->
  <circle cx="228" cy="343" r="3" fill="#FF9999"/>
  <circle cx="235" cy="345" r="3" fill="#FF9999"/>
  <circle cx="242" cy="343" r="3" fill="#FF9999"/>
  
  <!-- Tail -->
  <path d="M 280 300 Q 320 280 330 250 Q 335 230 320 220" stroke="#FFB347" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M 280 300 Q 320 280 330 250 Q 335 230 320 220" stroke="#FFE4B5" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Stripes on head -->
  <path d="M 185 95 Q 190 105 185 115" stroke="#E8943A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 200 90 Q 205 100 200 110" stroke="#E8943A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 215 95 Q 210 105 215 115" stroke="#E8943A" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Stripes on body -->
  <path d="M 140 250 Q 150 260 145 275" stroke="#E8943A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 260 250 Q 250 260 255 275" stroke="#E8943A" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Small heart above head -->
  <path d="M 200 40 C 200 35, 195 30, 190 30 C 185 30, 180 35, 180 40 C 180 48, 190 55, 200 60 C 210 55, 220 48, 220 40 C 220 35, 215 30, 210 30 C 205 30, 200 35, 200 40 Z" fill="#FF6B6B" opacity="0.7"/>
</svg>