<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-built transformer</title>
<meta name="description" content="Type a word and watch a transformer nobody trained guess the next letter. Every weight placed by hand. The arcs are its real attention, click a letter to follow them.">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#050507; --bg-1:#0c0c10; --bg-2:#14141a;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#f4f4f6; --text-2:rgba(244,244,246,.62); --text-3:rgba(244,244,246,.36);
  --accent:#ff6b35; --accent-soft:rgba(255,107,53,.14); --accent-line:rgba(255,107,53,.5);
  --cool:#4fc3f7;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace;
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;min-height:100%}
main{max-width:860px;width:100%;margin:0 auto;padding:.9rem 1rem 0;
  display:flex;flex-direction:column;gap:.55rem}
a{color:var(--accent);text-decoration:none}

.top{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.7rem}
.back{font-family:var(--mono);font-size:.8rem;color:var(--text-2)}
.back::before{content:"\2190 "}
.back:hover{color:var(--accent)}
h1{font-size:clamp(1.05rem,3.4vw,1.5rem);margin:0;letter-spacing:-.02em;flex:1 1 auto}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--text-3);flex:1 0 100%;margin:.1rem 0 0}

input{background:var(--bg-2);border:1px solid var(--line-2);border-radius:999px;color:var(--text);
  font-family:var(--mono);font-size:clamp(.95rem,3.6vw,1.15rem);padding:.45rem 1rem;
  letter-spacing:.3em;width:100%;outline:none;text-transform:uppercase}
input:focus{border-color:var(--accent-line)}
input::placeholder{color:var(--text-3);letter-spacing:.2em}

/* the board: chips with the live attention drawn over them */
/* Padded top and bottom by the tallest arc the drawing can make, so the box
   hugs the letters instead of stretching to fill the screen. */
.board{position:relative;background:var(--bg-1);border:1px solid var(--line);
  border-radius:16px;padding:4.6rem .8rem}
#arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.chip{width:2.15rem;height:2.15rem;display:grid;place-items:center;border-radius:9px;
  background:var(--bg-2);border:1px solid var(--line);font-family:var(--mono);
  font-size:1rem;cursor:pointer;transition:transform .12s,border-color .12s,color .12s}
.chip:hover{transform:translateY(-2px);border-color:var(--line-2)}
.chip.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.src{border-color:var(--cool);color:var(--cool)}
.chip.match{box-shadow:0 0 0 1px var(--cool) inset;color:var(--cool)}
.chip.out{border-style:dashed;border-color:var(--accent-line);color:var(--accent);
  font-weight:600;margin-left:.6rem}
.chip.dim{opacity:.35}

.say{font-family:var(--mono);font-size:clamp(.74rem,2.9vw,.86rem);color:var(--text-2);
  text-align:center;min-height:2.4em;margin:0;line-height:1.45}
.say b{color:var(--accent);font-weight:600}
.say i{color:var(--cool);font-style:normal}

.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;justify-content:center}
button{background:transparent;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2);
  font-family:var(--mono);font-size:.72rem;padding:.24rem .7rem;cursor:pointer;
  transition:color .15s,border-color .15s,background-color .15s}
button:hover{color:var(--text);background:rgba(255,255,255,.05)}
button.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
button.off{color:var(--text-3);text-decoration:line-through}
footer{font-family:var(--mono);font-size:.66rem;color:var(--text-3);text-align:center;
  padding:.4rem 1rem .6rem}
/* Rows wrap on a phone, so the arcs are short and need less room above. */
@media (max-width:600px){ .board{padding:3.2rem .6rem} }
@media (max-height:560px){ .board{padding:2.6rem .8rem} .sub{display:none} }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="../">back</a>
    <h1>A transformer nobody trained</h1>
    <p class="sub">85 numbers, 2 attention heads, 0 training steps. Type, and it guesses the next letter.</p>
  </div>

  <input id="seq" type="text" value="ABRACADABRA" spellcheck="false" maxlength="26"
         placeholder="type letters" aria-label="letters">

  <div class="board" id="board">
    <svg id="arcs" aria-hidden="true"></svg>
    <div class="chips" id="chips"></div>
  </div>

  <p class="say" id="say"></p>

  <div class="row">
    <button data-preset="ABRACADABRA">ABRACADABRA</button>
    <button data-preset="HELLO HE">HELLO HE</button>
    <button data-preset="IRAQ">IRAQ</button>
    <button id="ab0" class="on">prev-token head</button>
    <button id="ab1" class="on">induction head</button>
  </div>
</main>
<footer id="foot"></footer>

<script>
/* ─── the model, every weight placed by hand ───────────────────────────
   Vocab: a start marker, a space, and A to Z. The residual stream is cut
   into four blocks that never share a dimension, so each weight below is
   just "read this block, write that one".

     T  token here        P  token before        C  the guess        R  RoPE
──────────────────────────────────────────────────────────────────────── */
const V = ["^", " ", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"], NV = V.length;
const T0 = 0, P0 = NV, C0 = 2*NV, R0 = 3*NV, D = 3*NV + 4;
const TH = [1.0, 2.3];            // two RoPE turns; one alone ties gap 0 with gap 2
const SCALE = 12;                 // sharpens both softmaxes
const RULES = [["Q","U"]];        // one memory neuron, the only bigram English never breaks
const MLP_BIAS = -0.5, MLP_OUT = 1.2, BOS_BIAS = -10;
const zeros = n => new Array(n).fill(0);
const softmax = z => { const m = Math.max(...z), e = z.map(x => Math.exp(x-m)),
  s = e.reduce((a,b)=>a+b,0); return e.map(x => x/s); };
const rope = (v, pos) => { const o = v.slice();
  for (let p = 0; p < TH.length; p++){
    const a = v[2*p], b = v[2*p+1], c = Math.cos(TH[p]*pos), s = Math.sin(TH[p]*pos);
    o[2*p] = a*c - b*s; o[2*p+1] = a*s + b*c;
  } return o; };
// query turned back by -theta, so the peak sits on a gap of exactly one
const Q0 = [Math.cos(TH[0]), -Math.sin(TH[0]), Math.cos(TH[1]), -Math.sin(TH[1])];

function run(text, on = {h0:true, h1:true}){
  const toks = ["^", ...text].map(c => Math.max(0, V.indexOf(c)));
  const n = toks.length;
  let xs = toks.map(t => { const x = zeros(D); x[T0+t] = 1; x[R0] = 1; x[R0+2] = 1; return x; });

  const a0 = [];                                     // head 0: look one step back
  for (let i = 0; i < n; i++){
    const q = rope(Q0, i), sc = [];
    for (let j = 0; j < n; j++){
      const k = rope(xs[j].slice(R0, R0+4), j);
      sc.push(j <= i ? SCALE*(q[0]*k[0]+q[1]*k[1]+q[2]*k[2]+q[3]*k[3]) : -1e9);
    }
    a0.push(softmax(sc));
  }
  if (on.h0) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    for (let t = 0; t < NV; t++) xs[i][P0+t] += a0[i][j]*xs[j][T0+t];

  const a1 = [];                                     // head 1: seen this letter before?
  for (let i = 0; i < n; i++){
    const sc = [];
    for (let j = 0; j < n; j++){
      let d = 0; for (let t = 0; t < NV; t++) d += xs[i][T0+t]*xs[j][P0+t];
      sc.push(j <= i ? SCALE*d : -1e9);
    }
    a1.push(softmax(sc));
  }
  if (on.h1) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    for (let t = 0; t < NV; t++) xs[i][C0+t] += a1[i][j]*xs[j][T0+t];

  const fired = [];                                  // one neuron per remembered fact
  xs.forEach((x, i) => { fired[i] = null;
    for (const [src,dst] of RULES){
      const act = Math.max(0, x[T0+V.indexOf(src)] + MLP_BIAS);
      if (act > 0){ x[C0+V.indexOf(dst)] += MLP_OUT*act; fired[i] = [src,dst]; }
    } });

  const logits = xs.map(x => { const L = x.slice(C0, C0+NV); L[0] += BOS_BIAS; return L; });
  return {toks, a0, a1, logits, fired, n};
}

/* a check that runs on load, so the page cannot claim more than it does */
function selfTest(){
  // ABRACADABRA is a vote, not a lookup: B followed A twice, C and D once each
  const cases = [["ABCDABC","D"], ["HELLO HE","L"], ["IRAQ","U"], ["ABRACADABRA","B"]];
  let pass = 0;
  for (const [s, want] of cases){
    const r = run(s), L = r.logits[r.n-1];
    if (V[L.indexOf(Math.max(...L))] === want) pass++;
  }
  const r = run("ABCDABC");
  const prevOk = r.a0.every((row,i) => i === 0 || row.indexOf(Math.max(...row)) === i-1);
  const cut = run("ABCDABC", {h0:false, h1:true});
  const cutL = cut.logits[cut.n-1];
  return {pass, total: cases.length, prevOk, died: V[cutL.indexOf(Math.max(...cutL))] !== "D"};
}

/* ─── the board ────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const st = {text: "ABRACADABRA", sel: null, on: {h0:true, h1:true}};
const show = c => c === " " ? "␣" : c;
const NS = "http://www.w3.org/2000/svg";

function arc(x1, y1, x2, y2, up, w, colour, dash){
  const p = document.createElementNS(NS, "path");
  const lift = Math.min(70, 18 + Math.abs(x2-x1)*0.32) * (up ? -1 : 1);
  const my = (y1 + y2)/2 + lift;
  p.setAttribute("d", `M${x1} ${y1} Q ${(x1+x2)/2} ${my} ${x2} ${y2}`);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", colour);
  p.setAttribute("stroke-width", w.toFixed(2));
  p.setAttribute("stroke-linecap", "round");
  if (dash) p.setAttribute("stroke-dasharray", "3 4");
  return p;
}

function draw(){
  const r = run(st.text, st.on);
  const n = r.n;
  const sel = st.sel == null || st.sel >= n ? n-1 : st.sel;
  const L = r.logits[sel];
  const best = L.indexOf(Math.max(...L));
  const sorted = [...L].sort((a,b) => b-a);
  const sure = sorted[0] - sorted[1];

  // chips
  const box = $("#chips");
  box.innerHTML = "";
  const nodes = [];
  for (let i = 0; i < n; i++){
    const d = document.createElement("div");
    d.className = "chip" + (i === sel ? " sel" : "");
    d.textContent = show(V[r.toks[i]]);
    d.onclick = () => { st.sel = i; draw(); };
    box.appendChild(d); nodes.push(d);
  }
  const outChip = document.createElement("div");
  outChip.className = "chip out";
  outChip.textContent = sure > 1e-6 ? show(V[best]) : "?";
  outChip.title = "what it thinks comes next";
  box.appendChild(outChip);

  // the arcs are the actual attention rows for the chosen letter
  const svg = $("#arcs");
  svg.innerHTML = "";
  const bb = $("#board").getBoundingClientRect();
  const at = el => { const b = el.getBoundingClientRect();
    return {x: b.left - bb.left + b.width/2, top: b.top - bb.top, bot: b.bottom - bb.top}; };
  const P = nodes.map(at), O = at(outChip), S = P[sel];

  let srcIdx = -1, srcW = 0;
  if (st.on.h1) r.a1[sel].forEach((w, j) => {
    if (w < 0.02 || j === sel) return;
    if (w > srcW){ srcW = w; srcIdx = j; }
    svg.appendChild(arc(S.x, S.top, P[j].x, P[j].top, true, 1 + 3.5*w,
      `rgba(255,107,53,${(.25 + .6*w).toFixed(2)})`));
  });
  if (st.on.h0 && sel > 0) r.a0[sel].forEach((w, j) => {
    if (w < 0.02 || j === sel) return;
    svg.appendChild(arc(S.x, S.bot, P[j].x, P[j].bot, false, 1 + 2*w,
      `rgba(79,195,247,${(.2 + .5*w).toFixed(2)})`, true));
  });
  if (sure > 1e-6){
    const from = srcIdx >= 0 ? P[srcIdx] : S;
    svg.appendChild(arc(from.x, from.bot, O.x, O.bot, false, 2.4, "rgba(255,107,53,.85)"));
  }
  nodes.forEach((d, i) => {
    if (i === srcIdx) d.classList.add("src");          // the letter being copied out
    if (i === srcIdx - 1) d.classList.add("match");    // where it saw this letter before
  });

  // one sentence, written from what actually happened
  const cur = show(V[r.toks[sel]]);
  const say = $("#say");
  if (r.fired[sel] && srcIdx < 0){
    say.innerHTML = `nothing before matches <b>${cur}</b>, but one neuron remembers
      <b>${r.fired[sel][0]}</b> is followed by <b>${r.fired[sel][1]}</b>`;
  } else if (srcIdx >= 0){
    const spread = r.a1[sel].filter(w => w > 0.02).length;
    const follower = show(V[r.toks[srcIdx]]);
    say.innerHTML = spread > 1
      ? `it has seen <b>${cur}</b> ${spread} times, and picks whichever letter followed it most`
      : `it saw <b>${cur}</b> before, over there, and <i>${follower}</i> came next that time`;
  } else {
    say.innerHTML = `<b>${cur}</b> has not come up before, so it shrugs and spreads its
      attention over everything it has seen`;
  }

  $("#ab0").className = st.on.h0 ? "on" : "off";
  $("#ab1").className = st.on.h1 ? "on" : "off";
}

const clean = s => s.toUpperCase().replace(/[^A-Z ]/g, "").slice(0, 26);
$("#seq").addEventListener("input", e => {
  const c = clean(e.target.value);
  if (c !== e.target.value) e.target.value = c;
  st.text = c; st.sel = null; draw();
});
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
  st.text = b.dataset.preset; $("#seq").value = st.text; st.sel = null; draw();
});
$("#ab0").onclick = () => { st.on.h0 = !st.on.h0; draw(); };
$("#ab1").onclick = () => { st.on.h1 = !st.on.h1; draw(); };
addEventListener("resize", draw);
const t = selfTest();
$("#foot").innerHTML = `every weight set by hand &middot; self-test ${t.pass}/${t.total},
  prev-token head on target ${t.prevOk}, prediction dies when cut ${t.died}`;
draw();
</script>
</body>
</html>
