<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-built transformer</title>
<meta name="description" content="A transformer nobody trained, wired by hand. Press play and watch the signal cross the web letter by letter as it writes.">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#050507; --bg-1:#0c0c10; --bg-2:#15151c;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --text:#f4f4f6; --text-2:rgba(244,244,246,.62); --text-3:rgba(244,244,246,.34);
  --accent:#ff6b35; --accent-soft:rgba(255,107,53,.14); --accent-line:rgba(255,107,53,.55);
  --cool:#4fc3f7;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace;
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
main{max-width:900px;margin:0 auto;padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem}
a{color:var(--accent);text-decoration:none}

.top{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.7rem}
.back{font-family:var(--mono);font-size:.78rem;color:var(--text-2)}
.back::before{content:"\2190 "}
.back:hover{color:var(--accent)}
h1{font-size:clamp(1rem,3.2vw,1.4rem);margin:0;letter-spacing:-.02em}

.controls{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
input{background:var(--bg-2);border:1px solid var(--line-2);border-radius:999px;color:var(--text);
  font-family:var(--mono);font-size:.95rem;padding:.4rem .9rem;letter-spacing:.25em;
  flex:1 1 8rem;min-width:0;outline:none;text-transform:uppercase}
input:focus{border-color:var(--accent-line)}
button{background:transparent;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2);
  font-family:var(--mono);font-size:.74rem;padding:.3rem .8rem;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s,background-color .15s}
button:hover{color:var(--text);background:rgba(255,255,255,.06)}
button.go{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
button.off{color:var(--text-3);text-decoration:line-through}

/* the web */
.web{position:relative;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;
  overflow:hidden}
#wires{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:1.55rem;height:1.55rem;
  display:grid;place-items:center;border-radius:7px;background:var(--bg-2);
  border:1px solid var(--line);font-family:var(--mono);font-size:.8rem;color:var(--text-3);
  transition:color .2s,border-color .2s,background-color .2s}
.node.lit{color:var(--text);border-color:var(--line-2)}
.node.hot{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.node.cool{color:var(--cool);border-color:var(--cool)}
.node.big{width:2.3rem;height:2.3rem;font-size:1.15rem;font-weight:600}
.colname{position:absolute;transform:translateX(-50%);top:.45rem;font-family:var(--mono);
  font-size:.58rem;color:var(--text-3);letter-spacing:.08em;white-space:nowrap}
@keyframes flow{to{stroke-dashoffset:-40}}
.pulse{animation:flow .9s linear infinite}

.out{font-family:var(--mono);font-size:clamp(.9rem,3.6vw,1.15rem);letter-spacing:.18em;
  text-align:center;min-height:1.6em;word-break:break-all}
.out .new{color:var(--accent)}
.say{font-family:var(--mono);font-size:.74rem;color:var(--text-3);text-align:center;
  min-height:2.2em;margin:0;line-height:1.4}
.say b{color:var(--accent);font-weight:400}
.say i{color:var(--cool);font-style:normal}
footer{font-family:var(--mono);font-size:.62rem;color:var(--text-3);text-align:center;padding:.2rem 1rem .6rem}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="../">back</a>
    <h1>A transformer nobody trained</h1>
  </div>

  <div class="controls">
    <input id="seed" type="text" value="ABRACADABRA" spellcheck="false" maxlength="14"
           placeholder="seed" aria-label="seed letters">
    <button id="play" class="go">&#9654; write</button>
    <button id="step">step</button>
    <button id="ab0" class="go">head 0</button>
    <button id="ab1" class="go">head 1</button>
  </div>

  <div class="web" id="web">
    <svg id="wires" aria-hidden="true"></svg>
  </div>

  <div class="out" id="out"></div>
  <p class="say" id="say"></p>
</main>
<footer id="foot"></footer>

<script>
/* ─── the model: every weight placed by hand, nothing trained ──────────
   Four blocks of the residual stream, none of them sharing a dimension:
   T what letter is here, P what letter was before, C the guess, R the two
   unit vectors RoPE turns. Each weight is "read this block, write that".
──────────────────────────────────────────────────────────────────────── */
const V = ["^", " ", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"], NV = V.length;
const T0 = 0, P0 = NV, C0 = 2*NV, R0 = 3*NV, D = 3*NV + 4;
const TH = [1.0, 2.3], SCALE = 12;
const RULES = [["Q","U"]];
const MLP_BIAS = -0.5, MLP_OUT = 1.2, BOS_BIAS = -10;
const zeros = n => new Array(n).fill(0);
const softmax = z => { const m = Math.max(...z), e = z.map(x => Math.exp(x-m)),
  s = e.reduce((a,b)=>a+b,0); return e.map(x => x/s); };
const rope = (v,pos) => { const o = v.slice();
  for (let p = 0; p < TH.length; p++){ const a = v[2*p], b = v[2*p+1],
    c = Math.cos(TH[p]*pos), s = Math.sin(TH[p]*pos);
    o[2*p] = a*c - b*s; o[2*p+1] = a*s + b*c; } return o; };
const Q0 = [Math.cos(TH[0]), -Math.sin(TH[0]), Math.cos(TH[1]), -Math.sin(TH[1])];

function run(text, on = {h0:true, h1:true}){
  const toks = ["^", ...text].map(c => Math.max(0, V.indexOf(c))), n = toks.length;
  const xs = toks.map(t => { const x = zeros(D); x[T0+t] = 1; x[R0] = 1; x[R0+2] = 1; return x; });
  const a0 = [];
  for (let i = 0; i < n; i++){
    const q = rope(Q0, i), sc = [];
    for (let j = 0; j < n; j++){ const k = rope(xs[j].slice(R0, R0+4), j);
      sc.push(j <= i ? SCALE*(q[0]*k[0]+q[1]*k[1]+q[2]*k[2]+q[3]*k[3]) : -1e9); }
    a0.push(softmax(sc));
  }
  if (on.h0) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    for (let t = 0; t < NV; t++) xs[i][P0+t] += a0[i][j]*xs[j][T0+t];
  const a1 = [];
  for (let i = 0; i < n; i++){ const sc = [];
    for (let j = 0; j < n; j++){ let d = 0;
      for (let t = 0; t < NV; t++) d += xs[i][T0+t]*xs[j][P0+t];
      sc.push(j <= i ? SCALE*d : -1e9); }
    a1.push(softmax(sc)); }
  if (on.h1) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    for (let t = 0; t < NV; t++) xs[i][C0+t] += a1[i][j]*xs[j][T0+t];
  const fired = xs.map(x => { let hit = null;
    for (const [src,dst] of RULES){
      const act = Math.max(0, x[T0+V.indexOf(src)] + MLP_BIAS);
      if (act > 0){ x[C0+V.indexOf(dst)] += MLP_OUT*act; hit = [src,dst]; } }
    return hit; });
  const logits = xs.map(x => { const L = x.slice(C0, C0+NV); L[0] += BOS_BIAS; return L; });
  return {toks, xs, a0, a1, logits, fired, n};
}
const predict = (text, on) => { const r = run(text, on), L = r.logits[r.n-1];
  const best = L.indexOf(Math.max(...L)), s = [...L].sort((a,b)=>b-a);
  return {letter: V[best], sure: s[0]-s[1], r}; };

function selfTest(){
  const cases = [["ABCDABC","D"], ["HELLO HE","L"], ["IRAQ","U"], ["ABRACADABRA","B"]];
  let pass = 0;
  for (const [s,w] of cases) if (predict(s).letter === w) pass++;
  const r = run("ABCDABC");
  const prevOk = r.a0.every((row,i) => i === 0 || row.indexOf(Math.max(...row)) === i-1);
  const died = predict("ABCDABC", {h0:false, h1:true}).letter !== "D";
  return {pass, total: cases.length, prevOk, died};
}

/* ─── the web ──────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const show = c => c === " " ? "␣" : c;
const WINDOW = 12;                       // rows the web shows at once
const st = {seed: "ABRACADABRA", text: "ABRACADABRA", on: {h0:true, h1:true}, timer: null, fresh: 0};

function node(cls, ch, x, y, title){
  const d = document.createElement("div");
  d.className = "node " + cls; d.textContent = ch;
  d.style.left = x + "px"; d.style.top = y + "px";
  if (title) d.title = title;
  return d;
}
function wire(svg, x1, y1, x2, y2, w, colour, pulse){
  const p = document.createElementNS(NS, "path");
  const mx = (x1 + x2)/2;
  p.setAttribute("d", `M${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", colour);
  p.setAttribute("stroke-width", w.toFixed(2));
  p.setAttribute("stroke-linecap", "round");
  if (pulse){ p.setAttribute("stroke-dasharray", "5 12"); p.classList.add("pulse"); }
  svg.appendChild(p);
  return p;
}

function draw(){
  const web = $("#web");
  const r = run(st.text, st.on);
  const cur = r.n - 1;
  const lo = Math.max(0, r.n - WINDOW);              // sliding window over the sequence
  const rows = [];
  for (let i = lo; i < r.n; i++) rows.push(i);

  const W = web.clientWidth || 600;
  const rowH = W < 420 ? 24 : 28;
  const top = 26, H = top + rows.length*rowH + 14;
  web.style.height = H + "px";
  [...web.querySelectorAll(".node,.colname")].forEach(e => e.remove());
  const svg = $("#wires"); svg.innerHTML = "";

  const xIn = Math.max(30, W*0.09), xPrev = W*0.32, xHub = W*0.63, xOut = W*0.88;
  const yOf = k => top + rowH/2 + k*rowH;
  const hubY = yOf(rows.indexOf(cur));

  const lab = (t, x) => { const d = document.createElement("div");
    d.className = "colname"; d.textContent = t; d.style.left = x + "px"; web.appendChild(d); };
  lab("letter", xIn); lab("one before", xPrev); lab("match", xHub); lab("next", xOut);

  // column 2 reads the P block, so ablating head 0 really does empty it
  const prevOf = i => { const P = r.xs[i].slice(P0, P0+NV), m = Math.max(...P);
    return m > 0.5 ? V[P.indexOf(m)] : null; };

  const inN = [], prN = [];
  rows.forEach((i, k) => {
    const y = yOf(k);
    const a = node(i === cur ? "hot" : "lit", show(V[r.toks[i]]), xIn, y, `letter ${i}`);
    web.appendChild(a); inN.push(a);
    const pv = prevOf(i);
    const b = node(pv ? "" : "", pv ? show(pv) : "·", xPrev, y,
      pv ? `head 0 says the letter before is ${pv}` : "head 0 is off");
    web.appendChild(b); prN.push(b);
    // head 0 is the ladder: every row is handed the row above it
    if (st.on.h0 && i > lo) wire(svg, xIn, yOf(k-1), xPrev, y, 1, "rgba(79,195,247,.30)");
  });

  const hub = node("big hot", show(V[r.toks[cur]]), xHub, hubY, "the letter we are continuing");
  web.appendChild(hub);

  // head 1 fans out from the hub to every row it is paying attention to
  let bestJ = -1, bestW = 0;
  if (st.on.h1) rows.forEach((j, k) => {
    const w = r.a1[cur][j];
    if (w < 0.02) return;
    if (w > bestW){ bestW = w; bestJ = j; }
    wire(svg, xPrev, yOf(k), xHub, hubY, 1 + 4*w, `rgba(255,107,53,${(.25+.6*w).toFixed(2)})`, w > .3);
  });
  if (bestJ >= 0){
    prN[rows.indexOf(bestJ)].classList.add("cool");
    inN[rows.indexOf(bestJ)].classList.add("cool");
  }

  const L = r.logits[cur], best = L.indexOf(Math.max(...L));
  const s = [...L].sort((a,b)=>b-a), sure = s[0]-s[1];
  const outNode = node("big " + (sure > 1e-6 ? "hot" : ""), sure > 1e-6 ? show(V[best]) : "?",
    xOut, hubY, "what it writes next");
  web.appendChild(outNode);
  if (sure > 1e-6) wire(svg, xHub, hubY, xOut, hubY, 2.6, "rgba(255,107,53,.9)", true);

  // the text it has produced
  const seedLen = st.seed.length;
  $("#out").innerHTML = [...st.text].map((c,i) =>
    i >= seedLen ? `<span class="new">${show(c)}</span>` : show(c)).join("");

  const say = $("#say");
  if (!st.on.h0) say.innerHTML = `head 0 is off, so the <i>one before</i> column is empty and
    head 1 has nothing to match against`;
  else if (!st.on.h1) say.innerHTML = `head 1 is off, so nothing reaches the guess`;
  else if (bestJ >= 0) say.innerHTML = `it saw <b>${show(V[r.toks[cur]])}</b> before the blue row,
    and <b>${show(V[r.toks[bestJ]])}</b> came next that time`;
  else if (r.fired[cur]) say.innerHTML = `no earlier <b>${show(V[r.toks[cur]])}</b>, but one neuron
    remembers <b>${r.fired[cur][0]}</b> is followed by <b>${r.fired[cur][1]}</b>`;
  else say.innerHTML = `first time it has seen <b>${show(V[r.toks[cur]])}</b>, so it shrugs`;

  $("#ab0").className = st.on.h0 ? "go" : "off";
  $("#ab1").className = st.on.h1 ? "go" : "off";
}

function step(){
  const p = predict(st.text, st.on);
  if (p.sure < 1e-6){ stop(); draw(); return false; }
  st.text += p.letter;
  if (st.text.length > 40) st.text = st.text.slice(-40);
  draw();
  return true;
}
function stop(){ clearInterval(st.timer); st.timer = null; $("#play").innerHTML = "▶ write"; }
function play(){
  if (st.timer) return stop();
  $("#play").innerHTML = "■ stop";
  st.timer = setInterval(() => { if (!step()) stop(); }, 620);
}

const clean = s => s.toUpperCase().replace(/[^A-Z ]/g, "").slice(0, 14);
$("#seed").addEventListener("input", e => {
  const c = clean(e.target.value);
  if (c !== e.target.value) e.target.value = c;
  stop(); st.seed = c || "A"; st.text = st.seed; draw();
});
$("#play").onclick = play;
$("#step").onclick = () => { stop(); step(); };
$("#ab0").onclick = () => { st.on.h0 = !st.on.h0; draw(); };
$("#ab1").onclick = () => { st.on.h1 = !st.on.h1; draw(); };
addEventListener("resize", draw);
const t = selfTest();
$("#foot").innerHTML = `85 numbers, 2 heads, 0 training steps &middot; self-test ${t.pass}/${t.total},
  prev-token head on target ${t.prevOk}, prediction dies when cut ${t.died}`;
draw();
</script>
</body>
</html>
