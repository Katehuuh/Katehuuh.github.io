            )

          const SparklesIcon = () => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: "w-5 h-5" },
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.898 20.562L16.25 22.5l-.648-1.938a3.375 3.375 0 00-2.456-2.456L11.25 18l1.938-.648a3.375 3.375 0 002.456-2.456L16.25 13.5l.648 1.938a3.375 3.375 0 002.456 2.456L21 18l-1.938.648a3.375 3.375 0 00-2.456 2.456z" })
            )

          const ClipboardIcon = () => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: "w-5 h-5" },
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v3.045M15.666 3.888a2.25 2.25 0 012.25 2.25v13.5A2.25 2.25 0 0115.75 21h-6a2.25 2.25 0 01-2.25-2.25V6.138a2.25 2.25 0 012.25-2.25h1.5M13.5 4.5v3.045m0 0A2.25 2.25 0 0015.75 9h1.5m-1.5-1.5h-3a2.25 2.25 0 00-2.25 2.25v3.75m13.5 0v3.75a2.25 2.25 0 01-2.25 2.25h-1.5a2.25 2.25 0 01-2.25-2.25V15m-3 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 15v3.75a2.25 2.25 0 002.25 2.25h1.5a2.25 2.25 0 002.25-2.25V15" })
            )
          );

          const CodeBracketIcon = () => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: "w-5 h-5" },
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" })
            )
          );

          const FilmIcon = () => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: "w-5 h-5" },
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" }),
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M3.75 6h.008v.008H3.75V6zM3.75 9h.008v.008H3.75V9zM3.75 12h.008v.008H3.75v-.008zM3.75 15h.008v.008H3.75V15zm0 3h.008v.008H3.75v-.008zM20.25 6h-.008v.008h.008V6zM20.25 9h-.008v.008h.008V9zm0 3h-.008v.008h.008v-.008zm0 3h-.008v.008h.008V15zm0 3h-.008v.008h.008v-.008z" })
            )
          );

          const WandIcon = () => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", fill: "none", viewBox: "0 0 24 24", strokeWidth: 1.5, stroke: "currentColor", className: "w-5 h-5" },
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z" }),
              React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M12 18l-3-3m0 0l-3 3m3-3V21" })
            )
          );

          // ---------- ControlSlider ----------
          const ControlSlider = ({ label, value, onChange, min = 0, max = 1024, step = 1 }) => {
            const handleSliderChange = (e) => {
              onChange(Number(e.target.value));
            };

            const handleNumberChange = (e) => {
              const numValue = e.target.value === '' ? min : Number(e.target.value);
              onChange(numValue);
            };

            const handleBlur = (e) => {
              let numValue = Number(e.target.value);
              if (isNaN(numValue)) numValue = min;
              onChange(Math.max(min, Math.min(max, numValue)));
            };

            return React.createElement('div', { className: "space-y-2" },
              React.createElement('div', { className: "flex justify-between items-center" },
                React.createElement('label', { htmlFor: label, className: "text-sm font-medium text-gray-300" }, label),
                React.createElement('input', {
                  type: "number",
                  id: `${label}-number`,
                  value: value,
                  onChange: handleNumberChange,
                  onBlur: handleBlur,
                  min: min,
                  max: max,
                  step: step,
                  className: "w-20 bg-gray-700 border border-gray-600 text-white text-sm rounded-md p-1 text-center focus:ring-cyan-500 focus:border-cyan-500"
                })
              ),
              React.createElement('input', {
                id: label,
                type: "range",
                min: min,
                max: max,
                step: step,
                value: value,
                onChange: handleSliderChange,
                className: "w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer range-thumb",
                style: { '--thumb-color': '#22d3ee' }
              })
            );
          };

          // ---------- Timing presets ----------
          // Non-uniform per-frame durations by animation archetype. Each
          // row in a standard sprite sheet maps to a preset by index:
          // row 0=idle, 1=walk, 2=run, 3=jump, 4+=attack. Durations
          // cycle if the row has more frames than entries.
          const TIMING_PRESETS = {
            idle:   [280, 140, 140, 180, 180, 320],
            walk:   [130, 130, 130, 130, 130, 130, 130, 180],
            run:    [90,  90,  90,  90,  90,  90,  90,  120],
            jump:   [160, 120, 100, 100, 120, 160, 200, 200],
            attack: [80,  60,  60,  200, 120, 100, 100, 80],
          };
          const PRESET_ROW_ORDER = ['idle', 'walk', 'run', 'jump', 'attack'];
          function getFrameDuration(rowIndex, frameIndex, fps, timingMode) {
            if (timingMode === 'uniform') return 1000 / fps;
            const presetName = PRESET_ROW_ORDER[Math.min(rowIndex, PRESET_ROW_ORDER.length - 1)];
            const durations = TIMING_PRESETS[presetName];
            if (!durations) return 1000 / fps;
            return durations[frameIndex % durations.length];
          }

          // ---------- AnimationPreviewer ----------
          const AnimationPreviewer = ({ image, rows, spriteWidth, rowHeight, fps, timingMode }) => {
            const canvasRefs = useRef(new Map());
            const animationFrameId = useRef(null);
            const prevTimestamp = useRef(0);
            const currentFrames = useRef(new Array(rows.length).fill(0));
            const accumulators = useRef(new Array(rows.length).fill(0));

            useEffect(() => {
              if (!image) return;
              // Always reset on effect re-run (image swap, fps change,
              // timing mode toggle). Without this, stale accumulated
              // time from the previous animation carries over and frames
              // blast through too fast on the first few seconds.
              currentFrames.current = new Array(rows.length).fill(0);
              accumulators.current = new Array(rows.length).fill(0);
              prevTimestamp.current = 0;

              const drawFrame = (rowIndex, frameIdx) => {
                const sprites = rows[rowIndex];
                if (!sprites || !sprites.length) return;
                const sprite = sprites[frameIdx];
                const canvas = canvasRefs.current.get(rowIndex);
                if (canvas && sprite && image) {
                  const ctx = canvas.getContext('2d');
                  if (ctx) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (sprite.trim) {
                      const t = sprite.trim;
                      const sx = sprite.x + t.x, sy = sprite.y + t.y;
                      const scale = Math.min(canvas.width / t.w, canvas.height / t.h, 1);
                      const dw = t.w * scale, dh = t.h * scale;
                      const dx = (canvas.width - dw) / 2, dy = (canvas.height - dh) / 2;
                      ctx.drawImage(image, sx, sy, t.w, t.h, dx, dy, dw, dh);
                    } else {
                      ctx.drawImage(image, sprite.x, sprite.y, sprite.w, sprite.h, 0, 0, canvas.width, canvas.height);
                    }
                  }
                }
              };

              const animate = (timestamp) => {
                // Cap dt to 50ms so a tab-backgrounded pause (rAF stops
                // ticking) doesn't dump seconds of accumulated time into
                // the accumulators and blast through every frame at once.
                const raw = prevTimestamp.current ? timestamp - prevTimestamp.current : 0;
                const dt = Math.min(raw, 50);
                prevTimestamp.current = timestamp;

                rows.forEach((sprites, rowIndex) => {
                  if (sprites.length === 0) return;
                  accumulators.current[rowIndex] += dt;
                  const dur = getFrameDuration(rowIndex, currentFrames.current[rowIndex], fps, timingMode);
                  if (accumulators.current[rowIndex] >= dur) {
                    accumulators.current[rowIndex] -= dur;
                    const next = (currentFrames.current[rowIndex] + 1) % sprites.length;
                    currentFrames.current[rowIndex] = next;
                    drawFrame(rowIndex, next);
                  }
                });

                animationFrameId.current = requestAnimationFrame(animate);
              };

              rows.forEach((sprites, index) => {
                if (sprites.length > 0) {
                  const canvas = canvasRefs.current.get(index);
                  if (canvas) {
                    const ctx = canvas.getContext('2d');
                    if (ctx) ctx.imageSmoothingEnabled = false;
                  }
                  drawFrame(index, 0);
                }
              });

              animationFrameId.current = requestAnimationFrame(animate);

              return () => {
                if (animationFrameId.current) {
                  cancelAnimationFrame(animationFrameId.current);
                }
              };
            }, [image, rows, fps, timingMode]);

            if (!rows || rows.length === 0 || spriteWidth <= 0 || rowHeight <= 0) {
              return null;
            }

            // Inline mode: lives inside the same panel as the grid view, so
            // no outer card chrome - just a tight header + a wrap-flow row of
            // previews. flex-wrap instead of overflow-x-auto so previews stack
            // onto a second row instead of forcing horizontal scroll.
            return React.createElement('div', { className: "flex flex-col gap-1" },
              React.createElement('div', { className: "flex flex-wrap gap-2" },
                rows.map((sprites, index) => {
                  if (sprites.length === 0) return null;
                  const originalRowIndex = sprites[0].row;
                  return React.createElement('div', { key: index, className: "flex flex-col items-center bg-gray-900/50 p-1 rounded border border-gray-700" },
                    React.createElement('span', { className: "text-[10px] text-gray-400 mb-0.5" },
                      ['IDLE','RUN R','RUN U','RUN D','JUMP','ATK','BLOCK','DEATH'][index] || ('r' + originalRowIndex)),
                    React.createElement('canvas', {
                      ref: (el) => {
                        if (el) canvasRefs.current.set(index, el);
                        else canvasRefs.current.delete(index);
                      },
                      width: spriteWidth,
                      height: rowHeight,
                      className: "bg-checkered rounded-sm",
                      style: {
                        imageRendering: 'pixelated',
                        height: '220px',
                        width: 'auto',
                        '--check-color-1': '#4a5568',
                        '--check-color-2': '#2d3748',
                      },
                      'aria-label': `Animation preview for original row ${originalRowIndex}`,
                    })
                  );
                })
              )
            );
          };

          // ---------- SpriteAnalyzer ----------
          // Original prompt (text-to-image edit style, kept for reference):
          //   'Using the same placement and type of animation, adapt to replace the current 2D
          //    game sprite character animation with the "girl with long hair". Carefully
          //    analyze the image and its movement, and replace accordingly. Each character in
          //    the grid MUST be changed to the corresponding action pose. This means idle,
          //    walk, run, jump, and attack 1 will need to be adapted to an "girl with long
          //    hair" style sprite in 2D animation.'
          //
          // Replaced by buildRemixPrompt(state) below: text-to-image generation (NOT edit),
          // precise pixel layout from the current sliders, bg-color reservation clause so
          // strip-bg has a uniform target post-generation.
          const buildRemixPrompt = (s) => {
            const bg = s.bgColor.toUpperCase();
            return 'Create a 2D pixel-art sprite sheet: "girl with long hair".\n'
              + '\n'
              + 'Character: same face, hair, and outfit in all frames; full body visible; no cropping; consistent scale.\n'
              + 'Cells: clear frame separation; no text, labels, or frame numbers inside sprite cells.\n'
              + 'Each first and last frame should be able to loop.\n'
              + '\n'
              + 'Canvas: 1024 x 1024 px.\n'
              + 'Grid: 8 rows x 8 columns; each cell 128 x 128 px.\n'
              + 'First column of each row is a text label with the row name. Remaining 7 columns are sprite frames.\n'
              + 'Background: solid uniform ' + bg + '; no gradient or noise. Do not use exact same color for the character.\n'
              + '\n'
              + 'Row 1: IDLE\n'
              + 'Row 2: RUN RIGHT\n'
              + 'Row 3: RUN UP\n'
              + 'Row 4: RUN DOWN\n'
              + 'Row 5: JUMP\n'
              + 'Row 6: ATTACK\n'
              + 'Row 7: BLOCK\n'
              + 'Row 8: DEATH';
          };

          // Build a synthetic sprite sheet so the demo works offline / without external images.
          // Layout matches INITIAL_STATE: labelWidth=303, spriteWidth=192, rowHeight=215,
          // offsetX=-71, offsetY=228 on a 1024x576 sheet.
          const buildDefaultSpriteSheet = () => {
            const W = 1024, H = 576;
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');
            if (!ctx) return canvas;

            // grey background that matches the "make grey transparent" target color
            ctx.fillStyle = '#a2a2a2';
            ctx.fillRect(0, 0, W, H);

            const labels = ['IDLE', 'WALK', 'RUN', 'JUMP', 'ATK 1'];
            const skinColor = '#f4c290';       // warm skin (saturated -> survives grey-transparency)
            const hairColor = '#5d3a1a';       // brown hair
            const shirtPalette = ['#e74c3c', '#f39c12', '#27ae60', '#2980b9', '#8e44ad'];
            const pantsColor = '#2c3e50';
            const rowHeight = 215;
            const labelWidth = 303;
            const spriteWidth = 192;
            const offsetX = -71;
            const offsetY = 228;

            for (let r = 0; r < 3; r++) {
              const y = offsetY + r * rowHeight;
              if (y >= H) continue;
              const rowColor = shirtPalette[r % shirtPalette.length];

              // label area (saturated dark blue so it survives transparency)
              const labelStart = Math.max(0, offsetX);
              ctx.fillStyle = '#0c2340';
              ctx.fillRect(labelStart, y, labelWidth + Math.min(0, offsetX), Math.min(rowHeight, H - y));
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 30px sans-serif';
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillText(labels[r % labels.length] || '',
                           labelStart + 16,
                           y + rowHeight / 2);

              // 4 sprite cells per row
              for (let c = 0; c < 4; c++) {
                const x = offsetX + labelWidth + c * spriteWidth;
                if (x + spriteWidth > W || x < 0) continue;

                // cell bg in saturated teal tint so it stays visible
                ctx.fillStyle = c % 2 === 0 ? '#11324a' : '#0e3d54';
                ctx.fillRect(x + 4, y + 4, spriteWidth - 8, Math.min(rowHeight, H - y) - 8);

                // character: head + torso + limbs, scaled to fill most of the cell
                const cx = x + spriteWidth / 2;
                const cyBase = y + rowHeight - 30;

                // legs
                ctx.fillStyle = pantsColor;
                const legSpread = 6 + c * 4;
                ctx.fillRect(cx - 22 - (c % 2 === 0 ? 0 : legSpread), cyBase - 60, 18, 60);
                ctx.fillRect(cx + 4 + (c % 2 === 0 ? 0 : legSpread), cyBase - 60, 18, 60);

                // torso
                ctx.fillStyle = rowColor;
                ctx.fillRect(cx - 32, cyBase - 120, 64, 65);

                // arms
                ctx.fillStyle = skinColor;
                ctx.fillRect(cx - 50, cyBase - 110, 18, 55);
                ctx.fillRect(cx + 32, cyBase - 110, 18, 55);

                // head
                ctx.fillStyle = skinColor;
                ctx.beginPath();
                ctx.arc(cx, cyBase - 145, 26, 0, Math.PI * 2);
                ctx.fill();

                // hair
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(cx, cyBase - 152, 26, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(cx - 26, cyBase - 158, 52, 12);

                // frame number badge in saturated yellow
                ctx.fillStyle = '#facc15';
                ctx.fillRect(x + spriteWidth - 36, y + 8, 28, 22);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`f${c + 1}`, x + spriteWidth - 22, y + 19);
              }
            }

            return canvas;
          };

          const INITIAL_STATE = {
            labelWidth: 303,
            spriteWidth: 192,
            rowHeight: 215,
            offsetX: -71,
            offsetY: 228,
            lineWidth: 1,
            fps: 10,
          };

          const isDrawable = (src) => {
            if (!src) return false;
            if (typeof HTMLImageElement !== 'undefined' && src instanceof HTMLImageElement) return true;
            if (typeof HTMLCanvasElement !== 'undefined' && src instanceof HTMLCanvasElement) return true;
            if (typeof ImageBitmap !== 'undefined' && src instanceof ImageBitmap) return true;
            return false;
          };

          const SpriteAnalyzer = () => {
            const [image, setImage] = useState(null);
            const [processedImage, setProcessedImage] = useState(null);
            const [sourceCanvas, setSourceCanvas] = useState(null);
            const [imageDimensions, setImageDimensions] = useState({ width: 1024, height: 576 });
            const [isLoading, setIsLoading] = useState(true);
            const [isAdjusting, setIsAdjusting] = useState(false);
            const [isDragOver, setIsDragOver] = useState(false);
            const [toast, setToast] = useState('');
            const canvasRef = useRef(null);
            const canvasContainerRef = useRef(null);
            const fileInputRef = useRef(null);

            const [gridVisible, setGridVisible] = useState(true);
            const [useWhiteBackground, setUseWhiteBackground] = useState(false);
            // Was two separate toggles ("Make Grey Transparent" hardcoded
            // to #a2a2a2, plus the white-replace cleanup). Merged into one
            // adaptive "Strip BG" that samples corners to detect any solid
            // background color (grey, navy, black, white, ...).
            const [stripBg, setStripBg] = useState(true);
            // bgColor is the reference background color used by the strip
            // step. Seeded by corner auto-detect on each new image, but the
            // user can override via the color picker when corners aren't
            // representative (sprite extends to corner, gradient bg, etc.).
            const [bgColor, setBgColor] = useState('#151a22');
            const [debugInfo, setDebugInfo] = useState(null);
            const [labelWidth, setLabelWidth] = useState(INITIAL_STATE.labelWidth);
            const [spriteWidth, setSpriteWidth] = useState(INITIAL_STATE.spriteWidth);
            const [rowHeight, setRowHeight] = useState(INITIAL_STATE.rowHeight);
            const [offsetX, setOffsetX] = useState(INITIAL_STATE.offsetX);
            const [offsetY, setOffsetY] = useState(INITIAL_STATE.offsetY);
            const [lineWidth, setLineWidth] = useState(INITIAL_STATE.lineWidth);
            const [fps, setFps] = useState(INITIAL_STATE.fps);
            const [timingMode, setTimingMode] = useState('uniform');
            const [copySuccess, setCopySuccess] = useState('');
            const [activeTab, setActiveTab] = useState('json');
            const [gamePreviewActive, setGamePreviewActive] = useState(false);
            const gameContainerRef = useRef(null);
            const gameCleanupRef = useRef(null);

            const imageToDraw = useMemo(() => {
              if (isDrawable(processedImage)) return processedImage;
              if (isDrawable(image)) return image;
              return null;
            }, [processedImage, image]);

            useEffect(() => {
              // Try the original Ryu reference; fall back to a synthetic sheet if the network blocks it.
              const DEFAULT_SPRITE_SHEET_URL = 'https://i.imgur.com/WSgTT4i.png';
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => {
                setImage(img);
                setImageDimensions({ width: img.width, height: img.height });
                setIsLoading(false);
                // Auto-adjust grid on default image load so the user
                // doesn't have to click the sparkle button manually.
                setTimeout(() => handleAutoAdjust(img), 100);
              };
              img.onerror = () => {
                const synth = buildDefaultSpriteSheet();
                setImage(synth);
                setImageDimensions({ width: synth.width, height: synth.height });
                setIsLoading(false);
              };
              img.src = DEFAULT_SPRITE_SHEET_URL;
            }, []);

            useEffect(() => {
              if (!image) return;
              const canvas = document.createElement('canvas');
              canvas.width = image.width;
              canvas.height = image.height;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              if (ctx) {
                try {
                  ctx.drawImage(image, 0, 0);
                  // probe to confirm we can read pixels (CORS check)
                  ctx.getImageData(0, 0, 1, 1);
                  setSourceCanvas(canvas);
                } catch (e) {
                  setSourceCanvas(null);
                }
              } else {
                setSourceCanvas(null);
              }
            }, [image]);

            useEffect(() => {
              if (!image) {
                setProcessedImage(null);
                return;
              }

              if (!stripBg) {
                setProcessedImage(null);
                return;
              }

              const canvas = document.createElement('canvas');
              canvas.width = image.width;
              canvas.height = image.height;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                setProcessedImage(null);
                return;
              }

              ctx.drawImage(image, 0, 0);

              try {
                const imageData = ctx.getImageData(0, 0, image.width, image.height);
                const data = imageData.data;
                const W = image.width, H = image.height;
                // Resolve reference bg color from the user's picker. '#rrggbb'.
                const hex = (bgColor || '#000000').replace('#', '');
                const bgR = parseInt(hex.substr(0, 2), 16) || 0;
                const bgG = parseInt(hex.substr(2, 2), 16) || 0;
                const bgB = parseInt(hex.substr(4, 2), 16) || 0;
                // Step 1: near-exact bg mask. AI generators never produce
                // a perfectly uniform background at the pixel level
                // (JPEG artifacts, dithering, color-space rounding), so
                // ±3 per channel catches the real bg while being too
                // tight to match character colors that merely look similar.
                const isBg = new Uint8Array(W * H);
                for (let y = 0; y < H; y++) {
                  for (let x = 0; x < W; x++) {
                    const i = (y * W + x) * 4;
                    if (data[i + 3] < 64) { isBg[y * W + x] = 1; continue; }
                    if (Math.abs(data[i] - bgR) <= 8 && Math.abs(data[i + 1] - bgG) <= 8 && Math.abs(data[i + 2] - bgB) <= 8) isBg[y * W + x] = 1;
                  }
                }

                // Step 2: erode to find "cores" - pixels inside ≥(2R+1)x(2R+1)
                // solid-bg blocks. Computed via summed area table so this stays
                // O(W*H) regardless of erosion radius.
                const ERODE_R = 5;
                const sat = new Uint32Array(W * H);
                for (let y = 0; y < H; y++) {
                  let rowSum = 0;
                  for (let x = 0; x < W; x++) {
                    rowSum += isBg[y * W + x];
                    sat[y * W + x] = (y > 0 ? sat[(y - 1) * W + x] : 0) + rowSum;
                  }
                }
                const N = 2 * ERODE_R + 1;
                const TARGET = N * N;
                const finalMask = new Uint8Array(W * H);
                const stack = [];
                for (let y = ERODE_R; y < H - ERODE_R; y++) {
                  for (let x = ERODE_R; x < W - ERODE_R; x++) {
                    const x0 = x - ERODE_R, x1 = x + ERODE_R;
                    const y0 = y - ERODE_R, y1 = y + ERODE_R;
                    let sum = sat[y1 * W + x1];
                    if (x0 > 0) sum -= sat[y1 * W + (x0 - 1)];
                    if (y0 > 0) sum -= sat[(y0 - 1) * W + x1];
                    if (x0 > 0 && y0 > 0) sum += sat[(y0 - 1) * W + (x0 - 1)];
                    if (sum === TARGET) {
                      const idx = y * W + x;
                      finalMask[idx] = 1;
                      stack.push(idx);
                    }
                  }
                }

                // Step 3: reconstruction by dilation. Flood-fill from cores
                // outward through all bg-matching pixels. This is what the
                // user asked for: "what is attached to a block of 10x10+ can
                // be extrapolated, but not start from a small center". Tiny
                // bg-colored pockets inside characters (shadow nooks that
                // happen to match the bg color) have no core to seed from
                // and remain opaque.
                while (stack.length) {
                  const idx = stack.pop();
                  const x = idx % W;
                  const y = (idx - x) / W;
                  // 4-connectivity: cardinal neighbors only
                  if (x + 1 < W) {
                    const n = idx + 1;
                    if (!finalMask[n] && isBg[n]) { finalMask[n] = 1; stack.push(n); }
                  }
                  if (x > 0) {
                    const n = idx - 1;
                    if (!finalMask[n] && isBg[n]) { finalMask[n] = 1; stack.push(n); }
                  }
                  if (y + 1 < H) {
                    const n = idx + W;
                    if (!finalMask[n] && isBg[n]) { finalMask[n] = 1; stack.push(n); }
                  }
                  if (y > 0) {
                    const n = idx - W;
                    if (!finalMask[n] && isBg[n]) { finalMask[n] = 1; stack.push(n); }
                  }
                }

                // Apply: alpha=0 only on the reconstructed final mask.
                for (let i = 0; i < W * H; i++) {
                  if (finalMask[i]) data[i * 4 + 3] = 0;
                }
                ctx.putImageData(imageData, 0, 0);
                setProcessedImage(canvas);
              } catch (e) {
                // CORS rejection: fall back to original image rather than null
                setProcessedImage(null);
              }
            }, [image, stripBg, bgColor]);

            // Auto-detect bgColor from the full-image mode on every new image. User can
            // override afterward via the color picker; that override sticks
            // until the next image is loaded.
            useEffect(() => {
              if (!image) return;
              const canvas = document.createElement('canvas');
              canvas.width = image.width;
              canvas.height = image.height;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;
              try {
                ctx.drawImage(image, 0, 0);
                const data = ctx.getImageData(0, 0, image.width, image.height).data;
                const W = image.width, H = image.height;
                const step = W * H > 2000000 ? 2 : 1;
                const counts = new Map();
                for (let y = 0; y < H; y += step) {
                  const row = y * W * 4;
                  for (let x = 0; x < W; x += step) {
                    const i = row + x * 4;
                    const key = (data[i] << 16) | (data[i + 1] << 8) | data[i + 2];
                    counts.set(key, (counts.get(key) || 0) + 1);
                  }
                }
                let bestKey = 0, bestCount = -1;
                counts.forEach((count, key) => {
                  if (count > bestCount) { bestCount = count; bestKey = key; }
                });
                const r = (bestKey >> 16) & 255, g = (bestKey >> 8) & 255, b = bestKey & 255;
                const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
                setBgColor(hex);
              } catch (_) { /* CORS, leave bgColor as-is */ }
            }, [image]);

            const loadImageFromFile = useCallback((file) => {
              if (!file) return;
              setIsLoading(true);
              const reader = new FileReader();
              reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                  setImage(img);
                  setImageDimensions({ width: img.width, height: img.height });
                  handleReset();
                  setIsLoading(false);
                  setTimeout(() => handleAutoAdjust(img), 100);
                };
                img.onerror = () => {
                  setIsLoading(false);
                };
                img.src = e.target?.result;
              };
              reader.readAsDataURL(file);
            }, []);

            const handleImageUpload = (event) => {
              const file = event.target.files?.[0];
              if (file) loadImageFromFile(file);
            };

            const handleDragOver = (e) => {
              e.preventDefault();
              e.stopPropagation();
              if (!isDragOver) setIsDragOver(true);
            };

            const handleDragLeave = (e) => {
              e.preventDefault();
              e.stopPropagation();
              setIsDragOver(false);
            };

            const handleDrop = (e) => {
              e.preventDefault();
              e.stopPropagation();
              setIsDragOver(false);
              const file = e.dataTransfer?.files?.[0];
              if (file && file.type.startsWith('image/')) {
                loadImageFromFile(file);
              }
            };

            const drawGridOnContext = (ctx, canvasWidth, canvasHeight, imageTopLeftX, imageTopLeftY, scale = 1) => {
              ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
              ctx.lineWidth = lineWidth;

              const sOffsetX = offsetX * scale;
              const sOffsetY = offsetY * scale;
              const sRowHeight = rowHeight * scale;
              const sLabelWidth = labelWidth * scale;
              const sSpriteWidth = spriteWidth * scale;

              const gridOriginX = imageTopLeftX + sOffsetX;
              const gridOriginY = imageTopLeftY + sOffsetY;

              if (sRowHeight > 0) {
                const yStartOffset = gridOriginY % sRowHeight;
                const yStart = yStartOffset > 0 ? yStartOffset - sRowHeight : yStartOffset;
                for (let y = yStart; y < canvasHeight; y += sRowHeight) {
                  ctx.beginPath();
                  ctx.moveTo(0, y + 0.5);
                  ctx.lineTo(canvasWidth, y + 0.5);
                  ctx.stroke();
                }
              }

              const labelLineX = gridOriginX + sLabelWidth;
              if (sLabelWidth > 0) {
                ctx.beginPath();
                ctx.moveTo(labelLineX + 0.5, 0);
                ctx.lineTo(labelLineX + 0.5, canvasHeight);
                ctx.stroke();
              }

              if (sSpriteWidth > 0) {
                const xStartOffset = (gridOriginX + sLabelWidth) % sSpriteWidth;
                let xStart = (gridOriginX + sLabelWidth) - xStartOffset;
                if (xStartOffset === 0) xStart = gridOriginX + sLabelWidth;

                while (xStart > 0) {
                  xStart -= sSpriteWidth;
                }

                for (let x = xStart; x < canvasWidth; x += sSpriteWidth) {
                  if (Math.abs(x - (gridOriginX)) > 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(x + 0.5, 0);
                    ctx.lineTo(x + 0.5, canvasHeight);
                    ctx.stroke();
                  }
                }
              }
            };

            const handleDownload = () => {
              const drawSource = isDrawable(processedImage) ? processedImage : (isDrawable(image) ? image : null);
              if (!drawSource) return;

              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = imageDimensions.width;
              tempCanvas.height = imageDimensions.height;
              const ctx = tempCanvas.getContext('2d');
              if (!ctx) return;

              ctx.drawImage(drawSource, 0, 0);
              if (gridVisible) {
                drawGridOnContext(ctx, imageDimensions.width, imageDimensions.height, 0, 0, 1);
              }

              const link = document.createElement('a');
              link.download = 'sprite-analysis.png';
              link.href = tempCanvas.toDataURL('image/png');
              link.click();
            };

            const draw = useCallback(() => {
              const canvas = canvasRef.current;
              if (!canvas) return;

              const drawSource = isDrawable(processedImage) ? processedImage : (isDrawable(image) ? image : null);
              if (!drawSource) return;

              const ctx = canvas.getContext('2d');
              if (!ctx) return;

              const scale = Math.min(canvas.width / imageDimensions.width, canvas.height / imageDimensions.height);
              const scaledWidth = imageDimensions.width * scale;
              const scaledHeight = imageDimensions.height * scale;
              const imageTopLeftX = (canvas.width - scaledWidth) / 2;
              const imageTopLeftY = (canvas.height - scaledHeight) / 2;

              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = '#111827';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              ctx.imageSmoothingEnabled = false;
              ctx.drawImage(drawSource, imageTopLeftX, imageTopLeftY, scaledWidth, scaledHeight);

              if (useWhiteBackground) {
                try {
                  // Replaces whatever Strip BG turned transparent (alpha<64)
                  // with opaque white. Was hardcoded to swap rgb(128,128,128)
                  // only - useless once auto-detect can land on any bg color.
                  const imageData = ctx.getImageData(imageTopLeftX, imageTopLeftY, scaledWidth, scaledHeight);
                  const data = imageData.data;
                  for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] < 64) {
                      data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; data[i + 3] = 255;
                    }
                  }
                  ctx.putImageData(imageData, imageTopLeftX, imageTopLeftY);
                } catch (error) {
                  // CORS - silently skip background swap
                }
              }

              if (gridVisible) {
                drawGridOnContext(ctx, canvas.width, canvas.height, imageTopLeftX, imageTopLeftY, scale);
              }
            }, [processedImage, image, gridVisible, labelWidth, spriteWidth, rowHeight, offsetX, offsetY, useWhiteBackground, lineWidth, imageDimensions]);

            useEffect(() => {
              const canvas = canvasRef.current;
              const container = canvasContainerRef.current;
              if (!container || !canvas) return;

              const resizeObserver = new ResizeObserver(() => {
                const { width, height } = container.getBoundingClientRect();
                canvas.width = width;
                canvas.height = height;
                draw();
              });

              resizeObserver.observe(container);
              // Force initial size + draw after re-mount (e.g. returning from game preview)
              const { width, height } = container.getBoundingClientRect();
              if (width && height) {
                canvas.width = width;
                canvas.height = height;
                draw();
              }
              return () => resizeObserver.disconnect();
            }, [draw, gamePreviewActive]);

            useEffect(() => {
              draw();
            }, [draw]);

            const handleReset = () => {
              setLabelWidth(INITIAL_STATE.labelWidth);
              setSpriteWidth(INITIAL_STATE.spriteWidth);
              setRowHeight(INITIAL_STATE.rowHeight);
              setOffsetX(INITIAL_STATE.offsetX);
              setOffsetY(INITIAL_STATE.offsetY);
              setLineWidth(INITIAL_STATE.lineWidth);
              setFps(INITIAL_STATE.fps);
            };

            const getMode = (arr) => {
              if (arr.length === 0) return null;
              const counts = arr.reduce((acc, val) => {
                acc[val] = (acc[val] || 0) + 1;
                return acc;
              }, {});
              return Number(Object.keys(counts).reduce((a, b) => counts[Number(a)] > counts[Number(b)] ? a : b));
            };

            const handleCopyRemixPrompt = async () => {
              const prompt = buildRemixPrompt({
                imageW: imageDimensions.width,
                imageH: imageDimensions.height,
                spriteWidth, rowHeight, labelWidth,
                offsetX, offsetY, bgColor,
              });
              try {
                await navigator.clipboard.writeText(prompt);
                setToast('Prompt copied');
              } catch (e) {
                // fallback for browsers without clipboard permission
                const ta = document.createElement('textarea');
                ta.value = prompt;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); setToast('Prompt copied'); }
                catch { setToast('Copy failed'); }
                document.body.removeChild(ta);
              }
              setTimeout(() => setToast(''), 2000);
            };

            // Histogram-based global grid fit. Algorithm:
            //  1. Build a binary subject mask (drop alpha=0 and the grey background).
            //  2. Project to rowSum[y] and colSum[x] over the full image.
            //  3. Smooth with a box filter (~7px) to kill single-pixel text noise.
            //  4. Autocorrelate to find the dominant period (rowHeight, spriteWidth).
            //     Period detection wins over edge detection because every cell-row
            //     of every column contributes the same beat, while per-character
            //     pose differences (arm forward, backflip, head tilt) blur edges.
            //  5. Phase via boundary-darkness: choose the offset where the gaps
            //     between cells line up with low-density columns.
            //  6. labelWidth: density jump from the sparse-text label region to
            //     the dense first sprite column (1.5x global column-mean).
            const handleAutoAdjust = (imgOrEvent) => {
              const targetImage = isDrawable(imgOrEvent) ? imgOrEvent : image;
              if (!isDrawable(targetImage) || !targetImage.width || !targetImage.height) return;
              setIsAdjusting(true);

              // Algorithm adapted from Astropulse/spritesplitter (MIT).
              const median = (values) => {
                if (!values.length) return 0;
                const sorted = values.slice().sort((a, b) => a - b);
                const mid = sorted.length >> 1;
                return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
              };

              const rgbToHex = (rgb) => '#' + rgb
                .map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0'))
                .join('');

              const foregroundMask = (canvas) => {
                const W = canvas.width;
                const H = canvas.height;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) throw new Error('canvas context unavailable');
                const data = ctx.getImageData(0, 0, W, H).data;
                const total = W * H;
                let hasAlpha = false;
                for (let i = 3; i < data.length; i += 4) {
                  if (data[i] < 255) { hasAlpha = true; break; }
                }

                const step = total > 2000000 ? 2 : 1;
                const counts = new Map();
                for (let y = 0; y < H; y += step) {
                  const row = y * W * 4;
                  for (let x = 0; x < W; x += step) {
                    const i = row + x * 4;
                    const key = (data[i] << 16) | (data[i + 1] << 8) | data[i + 2];
                    counts.set(key, (counts.get(key) || 0) + 1);
                  }
                }

                let bgKey = 0, bestCount = -1;
                counts.forEach((count, key) => {
                  if (count > bestCount) { bestCount = count; bgKey = key; }
                });
                const bgRGB = [(bgKey >> 16) & 255, (bgKey >> 8) & 255, bgKey & 255];

                // Tolerance-based fg test, not exact match. AI-generated
                // sprites have anti-aliased edges that drift a few RGB units
                // from the solid bg color; an exact-match test marks every AA
                // pixel as foreground and bridges all sprites into one giant
                // blob (was failing with blobCount=1 on the user's sheet).
                const TOL2 = 30 * 30;
                const bgR = (bgKey >> 16) & 255, bgG = (bgKey >> 8) & 255, bgB = bgKey & 255;
                const mask = new Uint8Array(total);
                if (hasAlpha) {
                  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    if (data[i + 3] > 0) mask[p] = 1;
                  }
                } else {
                  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    const dr = data[i] - bgR, dg = data[i + 1] - bgG, db = data[i + 2] - bgB;
                    if ((dr * dr + dg * dg + db * db) / 3 > TOL2) mask[p] = 1;
                  }
                }

                return { mask, bgRGB };
              };

              const downscaleMask = (mask, W, H, tile = 2) => {
                const sw = Math.ceil(W / tile);
                const sh = Math.ceil(H / tile);
                const small = new Uint8Array(sw * sh);
                for (let y = 0; y < H; y++) {
                  const row = y * W;
                  const sy = (y / tile) | 0;
                  const srow = sy * sw;
                  for (let x = 0; x < W; x++) {
                    if (mask[row + x]) small[srow + ((x / tile) | 0)] = 1;
                  }
                }
                return { small, sw, sh };
              };

              const flood8 = (small, sw, sh) => {
                const MIN_CELLS = 4;
                const visited = new Uint8Array(small.length);
                const queue = new Int32Array(small.length);
                const components = [];

                for (let start = 0; start < small.length; start++) {
                  if (!small[start] || visited[start]) continue;
                  let head = 0, tail = 0;
                  let sx0 = sw, sy0 = sh, sx1 = 0, sy1 = 0;
                  visited[start] = 1;
                  queue[tail++] = start;

                  while (head < tail) {
                    const idx = queue[head++];
                    const sx = idx % sw;
                    const sy = (idx / sw) | 0;
                    if (sx < sx0) sx0 = sx;
                    if (sx > sx1) sx1 = sx;
                    if (sy < sy0) sy0 = sy;
                    if (sy > sy1) sy1 = sy;

                    for (let dy = -1; dy <= 1; dy++) {
                      const ny = sy + dy;
                      if (ny < 0 || ny >= sh) continue;
                      const nrow = ny * sw;
                      for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = sx + dx;
                        if (nx < 0 || nx >= sw) continue;
                        const n = nrow + nx;
                        if (!small[n] || visited[n]) continue;
                        visited[n] = 1;
                        queue[tail++] = n;
                      }
                    }
                  }

                  if (tail >= MIN_CELLS) {
                    components.push({ cells: queue.slice(0, tail), sx0, sy0, sx1, sy1 });
                  }
                }

                return components;
              };

              const deriveGridParams = (components, tile, W, H) => {
                if (!components.length) {
                  return { spriteWidth: 0, rowHeight: 0, labelWidth: 0, offsetX: 0, offsetY: 0, rowCount: 0 };
                }

                const bboxes = components.map((component, id) => {
                  const x = component.sx0 * tile;
                  const y = component.sy0 * tile;
                  const w = (component.sx1 - component.sx0 + 1) * tile;
                  const h = (component.sy1 - component.sy0 + 1) * tile;
                  return { id, x, y, w, h, cx: x + w / 2, cy: y + h / 2, bottom: y + h };
                });

                const heightMedian = median(bboxes.map(b => b.h));
                const byCy = bboxes.slice().sort((a, b) => a.cy - b.cy);
                const rows = [];
                let currentRow = [];
                let prevCy = -Infinity;
                const rowGapThreshold = heightMedian * 0.5; // Half-height tolerance groups pose jitter within a row.
                for (const bbox of byCy) {
                  if (currentRow.length && bbox.cy > prevCy + rowGapThreshold) {
                    rows.push(currentRow);
                    currentRow = [];
                  }
                  currentRow.push(bbox);
                  prevCy = bbox.cy;
                }
                if (currentRow.length) rows.push(currentRow);
                rows.forEach(row => row.sort((a, b) => a.x - b.x));

                let spriteWidth = Math.max(16, Math.round(median(bboxes.map(b => b.w))));
                const findLabelCandidates = (basisWidth) => {
                  const labels = [];
                  for (const row of rows) {
                    if (row.length < 2) continue;
                    const first = row[0];
                    const next = row[1];
                    const hasGap = next.x > first.x + first.w; // Row labels sit apart from the first sprite column.
                    if (first.w < 0.6 * basisWidth && hasGap) {
                      labels.push({ first, next, width: next.x - first.x });
                    }
                  }
                  return labels;
                };

                let labels = findLabelCandidates(spriteWidth);
                let labelIds = new Set(labels.map(label => label.first.id));
                let spriteBoxes = bboxes.filter(bbox => !labelIds.has(bbox.id));
                if (spriteBoxes.length) {
                  spriteWidth = Math.max(16, Math.round(median(spriteBoxes.map(b => b.w))));
                  labels = findLabelCandidates(spriteWidth);
                  labelIds = new Set(labels.map(label => label.first.id));
                  spriteBoxes = bboxes.filter(bbox => !labelIds.has(bbox.id));
                }

                // Cell pitch from inter-blob centroid spacing within rows,
                // not from per-blob bbox width. Bbox is the TIGHT box around
                // sprite content; the actual cell pitch is bbox + bg padding
                // between cells. Median centroid-to-centroid distance across
                // all consecutive sprite-blob pairs in each row gives the
                // true pitch. Falls back to median bbox width if too few
                // multi-blob rows.
                const interSpacings = [];
                for (const row of rows) {
                  const sprites = row.filter(b => !labelIds.has(b.id));
                  for (let i = 1; i < sprites.length; i++) {
                    interSpacings.push(sprites[i].cx - sprites[i - 1].cx);
                  }
                }
                if (interSpacings.length >= 3) {
                  spriteWidth = Math.max(16, Math.round(median(interSpacings)));
                }

                // Same idea for row pitch: median row-centroid spacing.
                const rowCys = rows.map(row => {
                  let top = Infinity, bottom = -Infinity;
                  for (const bbox of row) {
                    if (bbox.y < top) top = bbox.y;
                    if (bbox.bottom > bottom) bottom = bbox.bottom;
                  }
                  return (top + bottom) / 2;
                });
                const rowSpacings = [];
                for (let i = 1; i < rowCys.length; i++) {
                  rowSpacings.push(rowCys[i] - rowCys[i - 1]);
                }
                let rowHeight;
                if (rowSpacings.length >= 1) {
                  rowHeight = Math.round(median(rowSpacings));
                } else {
                  // Single row: fall back to row content height.
                  let top = Infinity, bottom = -Infinity;
                  for (const bbox of rows[0] || []) {
                    if (bbox.y < top) top = bbox.y;
                    if (bbox.bottom > bottom) bottom = bbox.bottom;
                  }
                  rowHeight = Math.max(16, Math.round(bottom - top));
                }

                let firstRowTop = Infinity;
                for (const bbox of rows[0] || []) {
                  if (bbox.y < firstRowTop) firstRowTop = bbox.y;
                }
                const offsetY = Number.isFinite(firstRowTop) ? Math.max(0, Math.round(firstRowTop - 4)) : 0;

                // Always skip column 0 (the text label column). Set
                // labelWidth = spriteWidth so the grid starts at column 1.
                // If the image has no labels, user sets labelWidth to 0.
                let labelWidth = spriteWidth;
                let offsetX = 0;

                  let minX = Infinity;
                  for (const bbox of bboxes) {
                    if (bbox.x < minX) minX = bbox.x;
                  }

                return { spriteWidth, rowHeight, labelWidth, offsetX, offsetY, rowCount: rows.length };

            const gridData = useMemo(() => {

                if (w < 1 || h < 1) return true;

              const endRow = Math.floor((image.height - offsetY) / rowHeight);

              for (let r = startRow; r < endRow; r++) {
                const y = offsetY + r * rowHeight;
                if (y + rowHeight > image.height || y < 0) continue;

                const startX = offsetX + labelWidth;
                const numCols = Math.floor((image.width - startX) / spriteWidth);

                for (let c = 0; c < numCols; c++) {
                  const x = startX + c * spriteWidth;

                  const finalX = Math.round(x);
                  const finalY = Math.round(y);
                  const finalW = Math.round(spriteWidth);

                    data.push({
                      row: r,
                      col: c,
                      x: finalX,
                      y: finalY,

            }, [offsetX, offsetY, labelWidth, spriteWidth, rowHeight, image, sourceCanvas]);

            const animationRows = useMemo(() => {
              if (!gridData.length) return [];
              // Compute tight bounding box of non-transparent pixels per
              // frame so the preview can center each sprite instead of
              // showing it wherever the grid happened to crop. Uses the
              // bg-stripped canvas (sourceCanvas after strip-BG) when
              // available, falls back to raw.
              const src = sourceCanvas;
              const ctx = src && src.getContext('2d');
              const enriched = gridData.map(sprite => {
                if (!ctx) return sprite;
                try {
                  const id = ctx.getImageData(sprite.x, sprite.y, sprite.w, sprite.h);
                  const d = id.data;
                  const w = sprite.w, h = sprite.h;
                  let x0 = w, y0 = h, x1 = 0, y1 = 0;
                  for (let py = 0; py < h; py++) {
                    for (let px = 0; px < w; px++) {
                      if (d[(py * w + px) * 4 + 3] > 20) {
                        if (px < x0) x0 = px;
                        if (px > x1) x1 = px;
                        if (py < y0) y0 = py;
                        if (py > y1) y1 = py;
                      }
                    }
                  }
                  if (x1 >= x0 && y1 >= y0) {
                    // Find largest connected component of opaque pixels (the real sprite).
                    // Edge debris (grid lines) forms separate small components - exclude them.
                    const isOp = (px, py) => px >= 0 && px < w && py >= 0 && py < h && d[(py * w + px) * 4 + 3] > 20;
                    const labels = new Int32Array(w * h);
                    let nextLabel = 1;
                    const sizes = [0]; // sizes[label] = pixel count

                      for (let px = 0; px < w; px++) {

                        labels[py * w + px] = label;

                        while (queue.length) {
                          const idx = queue.pop();
                          count++;
                          const cx = idx % w, cy = (idx - cx) / w;
                          for (let dy = -1; dy <= 1; dy++)
                            for (let dx = -1; dx <= 1; dx++) {
                              if (!dx && !dy) continue;
                              const nx = cx + dx, ny = cy + dy;
                              if (nx >= 0 && nx < w && ny >= 0 && ny < h && !labels[ny * w + nx] && isOp(nx, ny)) {
                                labels[ny * w + nx] = label;
                                queue.push(ny * w + nx);
                              }
                            }
                        }
                        sizes[label] = count;
                      }
                    }
                    // Find biggest component
                    let bigLabel = 1;
                    for (let i = 2; i < sizes.length; i++) {
                      if (sizes[i] > sizes[bigLabel]) bigLabel = i;
                    }
                    // Recompute bbox from only the biggest component
                    let bx0 = w, by0 = h, bx1 = 0, by1 = 0;
                    for (let py = 0; py < h; py++) {
                      for (let px = 0; px < w; px++) {
                        if (labels[py * w + px] === bigLabel) {
                          if (px < bx0) bx0 = px;
                          if (px > bx1) bx1 = px;
                          if (py < by0) by0 = py;
                          if (py > by1) by1 = py;
                        }
                      }
                    }
                    if (bx1 >= bx0 && by1 >= by0) {
                      return { ...sprite, trim: { x: bx0, y: by0, w: bx1 - bx0 + 1, h: by1 - by0 + 1 } };
                    }
                    return { ...sprite, trim: { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 } };
                  }
                } catch {}
                return sprite;
              });
              const groupedByRow = enriched.reduce((acc, sprite) => {
                if (!acc[sprite.row]) acc[sprite.row] = [];
                acc[sprite.row].push(sprite);
                return acc;
              }, {});
              return Object.values(groupedByRow);
            }, [gridData, sourceCanvas]);

            const generatedHtml = useMemo(() => {
              if (!animationRows.length || spriteWidth <= 0 || rowHeight <= 0) return '';

              const labels = ['idle', 'walk', 'run', 'jump', 'attack1', 'attack2', 'hurt', 'death', 'cast', 'crouch', 'climb', 'fall', 'block'];
              const rowDefs = animationRows.map((sprites, i) => {
                if (!sprites.length) return null;
                return {
                  name: labels[i] || ('row' + i),
                  frames: sprites.map(s => ({ x: s.x, y: s.y })),
                  count: sprites.length,
                  y: sprites[0].y,
                  x0: sprites[0].x,
                };
              }).filter(Boolean);

              const ROWS_JSON = JSON.stringify(rowDefs);

              return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Character Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<!-- Expects spritesheet.png in the same directory -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;font-family:sans-serif;}
canvas{display:block;image-rendering:pixelated;width:100%;height:100%;}
#hud{position:fixed;top:12px;left:12px;color:#aaa;font:13px/1.4 monospace;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px;pointer-events:none;}
#hud b{color:#6ee7b7;}
</style>
</head>
<body>
<div id="hud">
  <b>Arrow keys</b> move | <b>Space</b> jump | <b>Z</b> attack<br>
  State: <span id="state-label">idle</span>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
const ROWS = ${ROWS_JSON};
const FW = ${spriteWidth}, FH = ${rowHeight};
const GROUND_Y = 0.72; // fraction of canvas height
const MOVE_SPEED = 3.5;
const JUMP_VEL = -9;
const GRAVITY = 0.45;
const FPS = ${fps};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stateEl = document.getElementById('state-label');
const img = new Image();
img.src = 'spritesheet.png';

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const rowMap = {};
ROWS.forEach(r => { rowMap[r.name] = r; });
function getRow(name) { return rowMap[name] || ROWS[0]; }

const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  grounded: true,
  facing: 1,
  state: 'idle',
  frame: 0,
  frameTimer: 0,
};

function tick(dt) {
  const sec = dt / 1000;
  let moving = false;
  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -MOVE_SPEED; player.facing = -1; moving = true; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = MOVE_SPEED; player.facing = 1; moving = true; }
  else { player.vx *= 0.75; if (Math.abs(player.vx) < 0.1) player.vx = 0; }

  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
    player.vy = JUMP_VEL;
    player.grounded = false;
  }
  if (keys['KeyZ'] || keys['KeyX']) {
    player.state = rowMap['attack1'] ? 'attack1' : 'idle';
  } else if (!player.grounded) {
    player.state = rowMap['jump'] ? 'jump' : 'idle';
  } else if (Math.abs(player.vx) > 1.5 && rowMap['run']) {
    player.state = 'run';
  } else if (Math.abs(player.vx) > 0.3 && rowMap['walk']) {
    player.state = 'walk';
  } else {
    player.state = 'idle';
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  const groundY = canvas.height * GROUND_Y;
  if (player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.grounded = true;
  }

  // Wrap horizontally
  if (player.x < -FW) player.x = canvas.width;
  if (player.x > canvas.width + FW) player.x = -FW;

  // Advance frame
  player.frameTimer += dt;
  const frameDur = 1000 / FPS;
  if (player.frameTimer >= frameDur) {
    player.frameTimer -= frameDur;
    const row = getRow(player.state);
    player.frame = (player.frame + 1) % row.count;
  }

  stateEl.textContent = player.state;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground line
  const gy = canvas.height * GROUND_Y + FH / 2;
  ctx.fillStyle = '#2a2a4a';
  ctx.fillRect(0, gy, canvas.width, canvas.height - gy);
  ctx.strokeStyle = '#4a4a6a';
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(canvas.width, gy);
  ctx.stroke();

  if (!img.complete) return;
  const row = getRow(player.state);
  const frameIdx = player.frame % row.count;
  const srcX = row.frames[frameIdx].x;
  const srcY = row.frames[frameIdx].y;

  const scale = 3;
  const dw = FW * scale;
  const dh = FH * scale;

  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.facing < 0) {
    ctx.scale(-1, 1);
  }
  ctx.drawImage(img, srcX, srcY, FW, FH, -dw / 2, -dh, dw, dh);
  ctx.restore();
}

let lastT = 0;
function loop(t) {
  const dt = Math.min(t - (lastT || t), 50);
  lastT = t;
  tick(dt);
  draw();
  requestAnimationFrame(loop);
}
img.onload = () => requestAnimationFrame(loop);
<\/script>
</body>
</html>`;
            }, [animationRows, fps, spriteWidth, rowHeight]);

            const handleCopy = () => {
              const textToCopy = activeTab === 'json' ? JSON.stringify(gridData, null, 2) : generatedHtml;
              navigator.clipboard.writeText(textToCopy).then(() => {

            // ---------- Game Preview Logic ----------

              if (!gamePreviewActive) return;
              let cancelled = false;
              let animId = null;

              const loadThreeJS = () => new Promise((resolve) => {
                if (window.THREE) { resolve(window.THREE); return; }
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = () => resolve(window.THREE);
                document.head.appendChild(script);
              });

              const initScene = async () => {
                const THREE = await loadThreeJS();
                if (cancelled) return;
                const container = gameContainerRef.current;
                if (!container) return;

                // Renderer - full container size, pixelated via low-res render target

                renderer.shadowMap.enabled = true;

                  const rw = Math.max(1, Math.floor(w * PIXEL_SCALE));

                const groundCanvas = document.createElement('canvas');
                groundCanvas.width = 64; groundCanvas.height = 64;

                // Add texture variation
                for (let i = 0; i < 200; i++) {
                  const gx = Math.random() * 64;
                  const gy = Math.random() * 64;
                  gCtx.fillStyle = Math.random() > 0.5 ? '#1e5520' : '#163d16';

                const groundTex = new THREE.CanvasTexture(groundCanvas);
                groundTex.wrapS = THREE.RepeatWrapping;
