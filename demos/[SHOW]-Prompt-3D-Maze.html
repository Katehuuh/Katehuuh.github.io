<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Maze - Soldier</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #debug, #help {
      position: fixed; z-index: 10;
      padding: 10px 12px;
      color: #fff; background: rgba(0,0,0,0.65);
      border-radius: 8px;
      font: 13px/1.45 monospace;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #debug { top: 12px; left: 12px; min-width: 220px; }
    #help { right: 12px; bottom: 12px; }
    #loading {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #fff; text-align: center;
      background: radial-gradient(circle at center, rgba(45,45,45,0.96), rgba(0,0,0,0.96));
      font: 17px/1.45 sans-serif; letter-spacing: 0.3px;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="debug">Loading...</div>
  <div id="help">WASD: move<br />Mouse: orbit camera<br />Scroll: zoom</div>
  <div id="loading">Loading Soldier.glb...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  "use strict";

  // --- Constants -------------------------------------------------
  const MAZE_SIZE = 32;
  const CELL_SIZE = 4;
  const HALF = (MAZE_SIZE * CELL_SIZE) / 2;
  const WALL_HEIGHT = 4;
  const WALL_CHANCE = 0.15;
  const SOLDIER_RADIUS = 0.5;
  const SOLDIER_SPEED = 6.0; // units/sec, delta-time scaled

  // Same model, multiple mirrors. The first hit wins; fallbacks only fire
  // when the host is blocked / 5xx / CORS rejected.
  const MODEL_URLS = [
    "https://threejs.org/examples/models/gltf/Soldier.glb",
    "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb",
    "https://rawcdn.githack.com/mrdoob/three.js/r128/examples/models/gltf/Soldier.glb"
  ];

  const debugEl = document.getElementById("debug");
  const loadingEl = document.getElementById("loading");

  // --- Scene -----------------------------------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb4c8);
  scene.fog = new THREE.Fog(0x9fb4c8, 60, 180);

  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 8, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.target.set(0, 1.5, 0);

  // --- Lighting --------------------------------------------------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3d2b1f, 0.9));

  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(-30, 50, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -HALF;
  sun.shadow.camera.right = HALF;
  sun.shadow.camera.top = HALF;
  sun.shadow.camera.bottom = -HALF;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 150;
  scene.add(sun);

  // --- Procedural textures ---------------------------------------
  function makeFloorTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#6d4b2e";
    ctx.fillRect(0, 0, 512, 512);
    // grain
    for (let i = 0; i < 1500; i++) {
      const v = 70 + Math.random() * 45 | 0;
      ctx.fillStyle = `rgba(${v + 30}, ${v + 8}, ${Math.max(0, v - 12)}, 0.10)`;
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    // grid
    ctx.strokeStyle = "rgba(38,24,13,0.6)";
    ctx.lineWidth = 2;
    for (let i = 0; i <= 512; i += 64) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(MAZE_SIZE / 2, MAZE_SIZE / 2);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  function makeWallTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#777";
    ctx.fillRect(0, 0, 512, 512);
    // brick pattern
    ctx.fillStyle = "#666";
    const bw = 60, bh = 30;
    for (let y = 0; y < 512; y += bh) {
      const offset = (Math.floor(y / bh) % 2) * (bw / 2);
      for (let x = -bw / 2; x < 512; x += bw) {
        ctx.fillRect(x + offset, y, bw - 2, bh - 2);
      }
    }
    // noise
    for (let i = 0; i < 6000; i++) {
      const v = 80 + Math.random() * 40 | 0;
      ctx.fillStyle = `rgba(${v},${v},${v},0.10)`;
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 1);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  const floorMat = new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: 0.9, metalness: 0 });
  const wallMat = new THREE.MeshStandardMaterial({ map: makeWallTexture(), roughness: 0.8, metalness: 0 });

  // --- Maze ------------------------------------------------------
  const maze = [];
  const wallBoxes = [];
  const wallGroup = new THREE.Group();
  scene.add(wallGroup);

  function isBoundary(x, z) { return x === 0 || z === 0 || x === MAZE_SIZE - 1 || z === MAZE_SIZE - 1; }
  // Central open spawn area scales with maze size.
  const openMin = (MAZE_SIZE / 2) - 2, openMax = (MAZE_SIZE / 2) + 1;
  function isOpenCenter(x, z) { return x >= openMin && x <= openMax && z >= openMin && z <= openMax; }
  function cellToWorld(x, z) {
    return { x: x * CELL_SIZE - HALF + CELL_SIZE / 2, z: z * CELL_SIZE - HALF + CELL_SIZE / 2 };
  }

  for (let z = 0; z < MAZE_SIZE; z++) {
    maze[z] = [];
    for (let x = 0; x < MAZE_SIZE; x++) {
      maze[z][x] = isBoundary(x, z) ? 1 : isOpenCenter(x, z) ? 0 : (Math.random() < WALL_CHANCE ? 1 : 0);
    }
  }

  const wallGeo = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
  for (let z = 0; z < MAZE_SIZE; z++) {
    for (let x = 0; x < MAZE_SIZE; x++) {
      if (maze[z][x] !== 1) continue;
      const w = cellToWorld(x, z);
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(w.x, WALL_HEIGHT / 2, w.z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      wallGroup.add(wall);
      wall.updateMatrixWorld(true);
      wallBoxes.push(new THREE.Box3().setFromObject(wall));
    }
  }

  // --- Floor -----------------------------------------------------
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(MAZE_SIZE * CELL_SIZE, MAZE_SIZE * CELL_SIZE), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // --- Soldier model + animations -------------------------------
  let soldier = null, mixer = null;
  let idleAction = null, runAction = null, activeAction = null;
  let currentAnim = "loading";

  function spawnPos() { return new THREE.Vector3(0, 0, 0); }

  function setAction(next, name) {
    if (!next || activeAction === next) return;
    if (activeAction) activeAction.fadeOut(0.18);
    next.reset().fadeIn(0.18).play();
    activeAction = next;
    currentAnim = name;
  }

  function loadSoldier(idx) {
    if (idx >= MODEL_URLS.length) {
      loadingEl.textContent = "Soldier.glb failed to load from all mirrors. Check network/CORS.";
      currentAnim = "load failed";
      return;
    }
    const url = MODEL_URLS[idx];
    loadingEl.textContent = `Loading Soldier.glb (source ${idx + 1}/${MODEL_URLS.length})...`;
    new THREE.GLTFLoader().load(url, (gltf) => {
      soldier = gltf.scene;
      soldier.scale.setScalar(1.5);
      soldier.position.copy(spawnPos());
      soldier.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      scene.add(soldier);

      mixer = new THREE.AnimationMixer(soldier);
      const clips = gltf.animations || [];
      const idle = THREE.AnimationClip.findByName(clips, "Idle") || clips[0];
      const run = THREE.AnimationClip.findByName(clips, "Run") || clips[1] || clips[0];
      if (idle) idleAction = mixer.clipAction(idle);
      if (run) runAction = mixer.clipAction(run);
      if (idleAction) { activeAction = idleAction; currentAnim = "Idle"; idleAction.play(); }

      controls.target.copy(soldier.position).y += 1.5;
      loadingEl.classList.add("hidden");
    },
    (xhr) => {
      if (xhr && xhr.total) {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        loadingEl.textContent = `Loading Soldier.glb (source ${idx + 1}/${MODEL_URLS.length})... ${pct}%`;
      }
    },
    (err) => {
      console.warn("Soldier.glb load failed at", url, err);
      loadSoldier(idx + 1);
    });
  }
  loadSoldier(0);

  // --- Keyboard (event.code so AZERTY/Dvorak/etc work) ----------
  const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
  addEventListener("keydown", (e) => { if (e.code in keys) keys[e.code] = true; });
  addEventListener("keyup", (e) => { if (e.code in keys) keys[e.code] = false; });

  function moveDirCameraRelative() {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    fwd.y = 0;
    if (fwd.lengthSq() === 0) fwd.set(0, 0, -1); else fwd.normalize();
    const left = new THREE.Vector3(-fwd.z, 0, fwd.x).normalize();
    const dir = new THREE.Vector3();
    if (keys.KeyW) dir.add(fwd);
    if (keys.KeyS) dir.sub(fwd);
    if (keys.KeyA) dir.add(left);
    if (keys.KeyD) dir.sub(left);
    if (dir.lengthSq() > 0) dir.normalize();
    return dir;
  }

  // --- Collision (box vs box, with axis-separated sliding) ------
  function collides(p) {
    const box = new THREE.Box3(
      new THREE.Vector3(p.x - SOLDIER_RADIUS, 0.05, p.z - SOLDIER_RADIUS),
      new THREE.Vector3(p.x + SOLDIER_RADIUS, 2.5, p.z + SOLDIER_RADIUS)
    );
    for (let i = 0; i < wallBoxes.length; i++) {
      if (box.intersectsBox(wallBoxes[i])) return true;
    }
    return false;
  }

  function tickSoldier(delta) {
    if (!soldier) return;
    const dir = moveDirCameraRelative();
    const moving = dir.lengthSq() > 0;

    if (moving) {
      if (runAction) setAction(runAction, "Run");
      const distance = SOLDIER_SPEED * delta;
      soldier.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;

      const desired = soldier.position.clone().addScaledVector(dir, distance);
      if (!collides(desired)) {
        soldier.position.copy(desired);
      } else {
        // slide along axes separately so we don't dead-stop on grazes
        const xOnly = soldier.position.clone(); xOnly.x += dir.x * distance;
        const zOnly = soldier.position.clone(); zOnly.z += dir.z * distance;
        if (!collides(xOnly)) soldier.position.copy(xOnly);
        if (!collides(zOnly)) soldier.position.copy(zOnly);
      }
    } else if (idleAction) {
      setAction(idleAction, "Idle");
    }
  }

  function followCamera() {
    if (!soldier) { controls.update(); return; }
    const t = soldier.position.clone(); t.y += 1.5;
    controls.target.lerp(t, 0.15);
    controls.update();
  }

  // --- Debug overlay (FPS + minimal telemetry) ------------------
  let frameCount = 0, fpsLastTime = performance.now(), fps = 0;
  function updateDebug() {
    const now = performance.now();
    frameCount++;
    if (now - fpsLastTime >= 1000) {
      fps = Math.round((frameCount * 1000) / (now - fpsLastTime));
      frameCount = 0;
      fpsLastTime = now;
    }
    const p = soldier ? soldier.position : { x: 0, y: 0, z: 0 };
    const r = soldier ? soldier.rotation.y : 0;
    debugEl.textContent =
      `pos: ${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}\n` +
      `rot: ${r.toFixed(2)}\n` +
      `anim: ${currentAnim}\n` +
      `walls: ${wallBoxes.length}\n` +
      `fps: ${fps}`;
  }

  // --- Resize ---------------------------------------------------
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  });

  // --- Loop -----------------------------------------------------
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    if (mixer) mixer.update(delta);
    tickSoldier(delta);
    followCamera();
    updateDebug();
    renderer.render(scene, camera);
  }
  animate();
  </script>
</body>
</html>
