<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AI Map Walker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: dark;
  --bg: #0b0b0c;
  --panel: #111214;
  --muted: #6b7280;
  --text: #e5e7eb;
  --accent: #cbd5e1;
  --line: #1f2937;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 10px;
  flex-shrink: 0;
}

.brand-group {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.brand {
  font-weight: 600;
  font-size: 16px;
}

.tutorial {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
}

.bottombar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  flex-shrink: 0;
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.slider-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.slider-control label {
  font-size: 12px;
}

.slider-control input[type="range"] {
  width: 100px;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.slider-control input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

.slider-control input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

#sensitivityValue {
  font-size: 12px;
  color: var(--accent);
  min-width: 35px;
  text-align: right;
}

#log-container {
  flex-shrink: 0;
  max-height: 80px;
  overflow: hidden;
  padding: 0 12px;
}

.toggle {
  display: flex;
  gap: 6px;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}

.toggle input {
  width: 16px;
  height: 16px;
}

.btn {
  background: #181a1f;
  color: var(--text);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}

.btn:hover {
  background: #1f2937;
}

.stage-wrap {
  flex: 1;
  position: relative;
  display: grid;
  place-items: center;
  padding: 10px;
  min-height: 0;
  overflow: auto;
}

#gameCanvas {
  width: min(90vw, 90vh, 100%);
  height: min(90vw, 90vh, 100%);
  max-width: 1024px;
  max-height: 1024px;
  background: #000;
  border: 2px solid var(--line);
  border-radius: 12px;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
}

.loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  z-index: 10;
}

.hidden {
  display: none !important;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid #2a2f37;
  border-top-color: #e5e7eb;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#statusTitle {
  font-weight: 600;
  font-size: 14px;
}

#statusSub {
  font-size: 12px;
  color: var(--muted);
}

.mask {
  position: absolute;
  pointer-events: none;
  border-radius: 12px;
  z-index: 5;
}

.joystick {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 80px;
  height: 80px;
  display: none;
  z-index: 15;
}

.theme {
  color: var(--accent);
  font-weight: 600;
}

.req {
  font-size: 12px;
  color: var(--muted);
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.3);
}

.log {
  max-width: 100%;
  max-height: 80px;
  overflow-y: auto;
  font: 11px/1.4 ui-monospace, monospace;
  color: var(--muted);
  background: rgba(14, 15, 18, 0.9);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
  margin-top: 4px;
  white-space: pre-wrap;
  word-break: break-word;
}

@media (max-width: 768px) {
  .topbar {
    padding: 6px 8px;
    font-size: 12px;
  }
  .brand { font-size: 14px; }
  .tutorial { font-size: 11px; }
  .controls { gap: 8px; }
  .slider-control input[type="range"] { width: 80px; }
  .btn { padding: 4px 8px; font-size: 12px; }
  #gameCanvas {
    width: min(95vw, 95vh);
    height: min(95vw, 95vh);
  }
  .log { max-height: 60px; font-size: 10px; }
}

@media (min-resolution: 150dpi) {
  #app {
    max-height: 100vh;
  }
  .stage-wrap {
    overflow: auto;
  }
}

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "nipplejs": "https://esm.sh/nipplejs@0.10.1"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand">AI Map Walker</div>
        <div class="tutorial">drag red dot or use arrow keys to walk</div>
      </div>
      <div class="controls">
        <div class="slider-control">
          <label for="sensitivitySlider">Path Detection:</label>
          <input type="range" id="sensitivitySlider" min="0" max="100" value="70" />
          <span id="sensitivityValue">70%</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="debugMask">
          <span>Debug Mask</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="autoCorrect">
          <span>Auto-correction mask</span>
        </label>
        <button id="regenBtn" class="btn" title="Skip to next map">Next Map</button>
        <div id="reqCount" class="req">0 req</div>
      </div>
    </header>
    <div id="log-container">
      <div id="log" class="log" aria-live="polite"></div>
    </div>

    <main class="stage-wrap">
      <canvas id="gameCanvas" width="1024" height="1024" aria-label="Game canvas"></canvas>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <div class="status">
          <div id="statusTitle">Preparing scene…</div>
          <div id="statusSub">Calling AI model (≈10s)</div>
        </div>
      </div>
      <canvas id="maskCanvasOverlay" class="mask hidden" aria-hidden="true"></canvas>
      <div id="joystick" class="joystick"></div>
    </main>

    <footer class="bottombar">
      <div id="hint">Arrows or WASD • Drag on canvas to move on touch</div>
      <div id="themeLabel" class="theme">Theme: medieval village</div>
    </footer>
  </div>

const SAM3_BASE = 'https://huggingface.co/Luminia/sam3-v2-onnx/resolve/main';
const SAM3_MEAN = [123.675, 116.28, 103.53];
const SAM3_STD = [58.395, 57.12, 57.375];
const SAM3_SIZE = 1008;
const ROAD_IDS = [49406, 1759, 49407];
const TOKEN_PAD = 32;
const EXIT_BORDER_PX = 15;

let sam3Sessions = null;
async function loadSAM3() {
  if (sam3Sessions) return sam3Sessions;
  const opts = { executionProviders: ['wasm'] };
  const [vis, txt, dec] = await Promise.all([
    ort.InferenceSession.create(`${SAM3_BASE}/vision-encoder.onnx`, opts),
    ort.InferenceSession.create(`${SAM3_BASE}/text-encoder.onnx`, opts),
    ort.InferenceSession.create(`${SAM3_BASE}/decoder.onnx`, opts),
  ]);
  sam3Sessions = { vis, txt, dec };
  return sam3Sessions;
}

async function generateMaskFromImage(imgElement) {
  const { vis, txt, dec } = await loadSAM3();
  const W = imgElement.naturalWidth || imgElement.width;
  const H = imgElement.naturalHeight || imgElement.height;

  // Vision encoder: resize to 1008x1008, ImageNet normalize (0-255 range)
  const vc = document.createElement('canvas');
  vc.width = SAM3_SIZE; vc.height = SAM3_SIZE;
  const vctx = vc.getContext('2d');
  vctx.drawImage(imgElement, 0, 0, SAM3_SIZE, SAM3_SIZE);
  const vd = vctx.getImageData(0, 0, SAM3_SIZE, SAM3_SIZE).data;
  const px = new Float32Array(3 * SAM3_SIZE * SAM3_SIZE);
  for (let y = 0; y < SAM3_SIZE; y++) {
    for (let x = 0; x < SAM3_SIZE; x++) {
      const i = (y * SAM3_SIZE + x) * 4;
      for (let c = 0; c < 3; c++) {
        px[c * SAM3_SIZE * SAM3_SIZE + y * SAM3_SIZE + x] = (vd[i + c] - SAM3_MEAN[c]) / SAM3_STD[c];
      }
    }
  }
  const visOut = await vis.run({ 'images': new ort.Tensor('float32', px, [1, 3, SAM3_SIZE, SAM3_SIZE]) });

  // Text encoder: padded token IDs + attention mask
  const ids = new Array(TOKEN_PAD).fill(0);
  const amask = new Array(TOKEN_PAD).fill(0);
  ROAD_IDS.forEach((t, i) => { ids[i] = t; amask[i] = 1; });
  let idT, amT;
  if (typeof BigInt64Array !== 'undefined') {
    idT = new ort.Tensor('int64', new BigInt64Array(ids.map(BigInt)), [1, TOKEN_PAD]);
    amT = new ort.Tensor('int64', new BigInt64Array(amask.map(BigInt)), [1, TOKEN_PAD]);
  } else {
    idT = new ort.Tensor('int32', new Int32Array(ids), [1, TOKEN_PAD]);
    amT = new ort.Tensor('int32', new Int32Array(amask), [1, TOKEN_PAD]);
  }
  const txtOut = await txt.run({ 'input_ids': idT, 'attention_mask': amT });

  // Decoder: vision features + text features + full-image box
  const boxT = new ort.Tensor('float32', new Float32Array([0, 0, 1, 1]), [1, 1, 4]);
  let lblT;
  if (typeof BigInt64Array !== 'undefined') {
    lblT = new ort.Tensor('int64', new BigInt64Array([1n]), [1, 1]);
  } else {
    lblT = new ort.Tensor('int32', new Int32Array([1]), [1, 1]);
  }
  const decOut = await dec.run({
    'fpn_feat_0': visOut['fpn_feat_0'],
    'fpn_feat_1': visOut['fpn_feat_1'],
    'fpn_feat_2': visOut['fpn_feat_2'],
    'fpn_pos_2': visOut['fpn_pos_2'],
    'text_features': txtOut['text_features'],
    'text_mask': txtOut['text_mask'],
    'input_boxes': boxT,
    'input_boxes_labels': lblT,
  });

  // Pick best mask by logit score
  const masks = decOut['pred_masks'];
  const logits = decOut['pred_logits'];
  const numMasks = masks.dims[1];
  let bestIdx = 0;
  if (logits) {
    let bestScore = -Infinity;
    for (let i = 0; i < numMasks; i++) {
      if (logits.data[i] > bestScore) { bestScore = logits.data[i]; bestIdx = i; }
    }
  }
  const mH = masks.dims[2], mW = masks.dims[3];
  const offset = bestIdx * mH * mW;

  // Render binary mask to canvas, resize to original
  const mc = document.createElement('canvas');
  mc.width = mW; mc.height = mH;
  const mctx = mc.getContext('2d');
  const mid = mctx.createImageData(mW, mH);
  for (let i = 0; i < mH * mW; i++) {
    const v = masks.data[offset + i] > 0 ? 255 : 0;
    mid.data[i * 4] = v; mid.data[i * 4 + 1] = v; mid.data[i * 4 + 2] = v; mid.data[i * 4 + 3] = 255;
  }
  mctx.putImageData(mid, 0, 0);

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(mc, 0, 0, W, H);

  // Purple walkable + cyan exits at map edges
  const fd = octx.getImageData(0, 0, W, H);
  const d = fd.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;
      if (d[idx] > 128) {
        const atEdge = x < EXIT_BORDER_PX || x >= W - EXIT_BORDER_PX ||
                       y < EXIT_BORDER_PX || y >= H - EXIT_BORDER_PX;
        if (atEdge) {
          d[idx] = 43; d[idx+1] = 250; d[idx+2] = 250; d[idx+3] = 255;
        } else {
          d[idx] = 128; d[idx+1] = 0; d[idx+2] = 128; d[idx+3] = 255;
        }
      } else {
        d[idx] = 0; d[idx+1] = 0; d[idx+2] = 0; d[idx+3] = 0;
      }
    }
  }
  octx.putImageData(fd, 0, 0);
  return out.toDataURL('image/png');
}

const mapCache = new Map();
let currentThemeIndex = 0;
let requestCount = 0;
let dailyLimitHit = false;
let themeAttempts = new Map();

function getRequestCount() { return requestCount; }
function isDailyLimitHit() { return dailyLimitHit; }

async function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function urlToDataUrl(url) {
  try {
    const response = await fetch(url, { mode: "cors" });
    if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);
    const blob = await response.blob();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    throw new Error(`Error loading image: ${e.message}`);
  }
}

function getNextTheme(currentTheme, goingBack = false) {
  let idx = THEME_VARIATIONS.indexOf(currentTheme);
  if (idx === -1) idx = 0;

  if (goingBack) {
    currentThemeIndex = Math.max(0, idx - 1);
  } else {
    currentThemeIndex = (idx + 1) % THEME_VARIATIONS.length;
  }

  return THEME_VARIATIONS[currentThemeIndex];
}

async function generateMapAndMask(theme, { initialUseStarter = false, useCache = true, autoCorrect = false } = {}) {
  if (dailyLimitHit) {
    throw new Error("Daily rate limit exceeded. Please try again tomorrow.");
  }

  const cacheKey = `${theme}_map`;
  if (useCache && mapCache.has(cacheKey)) {
    console.log(`Using cached map for theme: ${theme}`);
    return mapCache.get(cacheKey);
  }

  if (autoCorrect) {
    const attempts = themeAttempts.get(theme) || 0;
    if (attempts >= 2) {
      console.log(`Auto-correction limit reached for ${theme}, allowing free movement`);
      return { mapUrl: null, maskUrl: null, freeMovement: true };
    }
    themeAttempts.set(theme, attempts + 1);
  }

  let mapUrl;

  if (initialUseStarter) {
    mapUrl = STARTER_MAP_B64;
  } else {
    try {
      requestCount++;
      await sleep(500);
      const prompt = encodeURIComponent(BASE_PROMPT.replace("[THEME]", theme));
      mapUrl = `https://image.pollinations.ai/prompt/${prompt}?width=1024&height=1024&nologo=true&seed=${Date.now() % 100000}`;
      // Pre-fetch to trigger generation and cache
      await fetch(mapUrl, { mode: 'cors' });
    } catch (e) {
      throw e;
    }
  }

  // Generate mask using CLIPSeg ONNX (runs in-browser, no external API)
  const mapImg = new Image();
  mapImg.crossOrigin = 'anonymous';
  await new Promise((resolve, reject) => {
    mapImg.onload = resolve;
    mapImg.onerror = reject;
    mapImg.src = mapUrl;
  });
  const maskDataUrl = await generateMaskFromImage(mapImg);
  const result = { mapUrl, maskUrl: maskDataUrl };
  if (!initialUseStarter) mapCache.set(cacheKey, result);
  return result;
}

function clearCache() {
  mapCache.clear();
  themeAttempts.clear();
}

function initControls({ onDir }) {
  const keys = new Set();
  const joystickEl = document.getElementById("joystick");
  let manager = null;

  function emitFromKeys() {
    let x = 0, y = 0;
    if (keys.has("ArrowLeft") || keys.has("a")) x -= 1;
    if (keys.has("ArrowRight") || keys.has("d")) x += 1;
    if (keys.has("ArrowUp") || keys.has("w")) y -= 1;
    if (keys.has("ArrowDown") || keys.has("s")) y += 1;
    const len = Math.hypot(x, y) || 1;
    onDir({ x: x / len, y: y / len });
  }

  function down(e) { keys.add(e.key); if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault(); emitFromKeys(); }
  function up(e) { keys.delete(e.key); emitFromKeys(); }

  window.addEventListener("keydown", down, { passive: false });
  window.addEventListener("keyup", up);

  if ("ontouchstart" in window && joystickEl) {
    joystickEl.style.display = "block";
    manager = nipplejs.create({
      zone: joystickEl,
      mode: "static",
      size: 80,
      color: "white",
      position: { left: "50%", top: "50%" },
      restOpacity: 0.2,
    });
    manager.on("move", (_evt, data) => {
      const a = data.angle?.radian ?? 0;
      const f = Math.min(1, data.force ?? 0);
      onDir({ x: Math.cos(a) * f, y: Math.sin(a) * f });
    });
    manager.on("end", () => onDir({ x: 0, y: 0 }));
  }

  return {
    dispose() {
      window.removeEventListener("keydown", down);
      window.removeEventListener("keyup", up);
      if (manager) manager.destroy();
    },
  };
}

// Sensitivity value from 0 to 1 (0 = very strict, 1 = very relaxed)
let pathSensitivity = 0.7;  // Default 70%

// Update sensitivity when slider changes
sensitivitySlider.addEventListener('input', (e) => {
  pathSensitivity = e.target.value / 100;
  sensitivityValue.textContent = `${e.target.value}%`;
  log(`Path detection sensitivity set to ${e.target.value}%`);

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

function setLoading(on, title = "Loading…", sub = "") {
  loading.classList.toggle("hidden", !on);
  statusTitle.textContent = title;
  statusSub.textContent = sub;
  reqCountEl.textContent = `${getRequestCount()} req`;
  if (on) log(`UI: ${title} — ${sub}`);
}

async function loadImage(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = "anonymous";
    i.onload = () => res(i);
    i.onerror = () => rej(new Error(`Failed to load image: ${url}`));
    i.src = url;
  });
}

// Sensitivity-adjusted color detection for purple
function isPurplePixel(rgba) {
  const alphaThreshold = 20 + (1 - pathSensitivity) * 80; // 20-100 based on sensitivity
  if (rgba[3] < alphaThreshold) return false;

  const r = rgba[0], g = rgba[1], b = rgba[2];

  // Adjust tolerance based on sensitivity
  const tolerance = 40 + pathSensitivity * 60; // 40-100 tolerance

  // Method 1: Direct purple RGB (128, 0, 128) with adjusted tolerance
  const purpleRGB = (r > 128 - tolerance && r < 128 + tolerance) &&
                    (g < 0 + tolerance) &&
                    (b > 128 - tolerance && b < 128 + tolerance);

  // Method 2: Purple balance - more relaxed with higher sensitivity
  const balanceTolerance = 50 + pathSensitivity * 50;
  const purpleBalance = Math.abs(r - b) < balanceTolerance && g < Math.min(r, b) - (20 - pathSensitivity * 15);

  // Method 3: HSL detection
  const hsl = rgb2hsl(r, g, b);
  const hueMin = 240 - pathSensitivity * 20;  // 220-240
  const hueMax = 340 + pathSensitivity * 20;  // 340-360
  const satMin = 0.05 - pathSensitivity * 0.04; // 0.01-0.05
  const purpleHSL = hsl.h >= hueMin && hsl.h <= hueMax && hsl.s > satMin;

  // More methods enabled with higher sensitivity
  if (pathSensitivity < 0.3) {
    return purpleRGB;
  } else if (pathSensitivity < 0.6) {
    return purpleRGB || purpleBalance;
  } else {
    return purpleRGB || purpleBalance || purpleHSL || (r > 80 && b > 80 && g < 80);
  }
}

// Sensitivity-adjusted color detection for cyan
function isCyanPixel(rgba) {
  const alphaThreshold = 20 + (1 - pathSensitivity) * 80;
  if (rgba[3] < alphaThreshold) return false;

  const r = rgba[0], g = rgba[1], b = rgba[2];

  const tolerance = 50 + pathSensitivity * 50;

  // Method 1: Direct cyan RGB (43, 250, 250)
  const cyanRGB = (r < 43 + tolerance) &&
                  (g > 250 - tolerance) &&
                  (b > 250 - tolerance);

  // Method 2: Cyan balance
  const balanceTolerance = 50 + pathSensitivity * 50;
  const cyanBalance = Math.abs(g - b) < balanceTolerance && r < Math.min(g, b) - (30 - pathSensitivity * 20);

  // Method 3: HSL detection
  const hsl = rgb2hsl(r, g, b);
  const hueMin = 160 - pathSensitivity * 10;
  const hueMax = 210 + pathSensitivity * 10;
  const satMin = 0.2 - pathSensitivity * 0.15;
  const cyanHSL = hsl.h >= hueMin && hsl.h <= hueMax && hsl.s > satMin;

  if (pathSensitivity < 0.3) {
    return cyanRGB;
  } else if (pathSensitivity < 0.6) {
    return cyanRGB || cyanBalance;
  } else {
    return cyanRGB || cyanBalance || cyanHSL || (r < 100 && g > 130 && b > 130);
  }
}

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;

  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }

  return { h: h * 360, s, l };
}

function isNearMapEdge(x, y, threshold = 60) {
  return x < threshold || x > maskCanvas.width - threshold ||
         y < threshold || y > maskCanvas.height - threshold;
}

function buildColorClassifier() {
  const w = maskCanvas.width, h = maskCanvas.height;
  const img = maskCtx.getImageData(0, 0, w, h);
  const d = img.data;

  let purpleCount = 0, cyanCount = 0;
  let purpleColors = [];
  let cyanColors = [];

  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 20) continue;

    if (isPurplePixel(d.slice(i, i + 4))) {
      purpleCount++;
      if (purpleColors.length < 5) {
        purpleColors.push(`rgb(${d[i]},${d[i+1]},${d[i+2]})`);
      }
    } else if (isCyanPixel(d.slice(i, i + 4))) {
      cyanCount++;
      if (cyanColors.length < 5) {
        cyanColors.push(`rgb(${d[i]},${d[i+1]},${d[i+2]})`);
      }
    }
  }

  log(`Color analysis: ${purpleCount} purple, ${cyanCount} cyan pixels (sensitivity: ${Math.round(pathSensitivity * 100)}%)`);
  if (purpleColors.length > 0) log(`Purple samples: ${purpleColors.join(', ')}`);
  if (cyanColors.length > 0) log(`Cyan samples: ${cyanColors.join(', ')}`);

  if (purpleCount === 0 && cyanCount === 0) {
    log("WARNING: No valid paths detected!");
    return false;
  }
  return true;
}

function sampleMask(x, y) {
  if (freeMovementMode) return "walk";

  x = Math.floor(x);
  y = Math.floor(y);
  if (x < 0 || x >= maskCanvas.width || y < 0 || y >= maskCanvas.height) return "collide";

  // Adjust sampling radius based on sensitivity
  const r = Math.floor(3 + pathSensitivity * 4); // 3-7 pixel radius
  let purple = 0, cyan = 0, total = 0;

  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const sx = x + dx, sy = y + dy;
      if (sx < 0 || sx >= maskCanvas.width || sy < 0 || sy >= maskCanvas.height) continue;

      const p = maskCtx.getImageData(sx, sy, 1, 1).data;
      total++;

      if (isPurplePixel(p)) purple++;
      else if (isCyanPixel(p)) cyan++;
    }
  }

  if (total === 0) return "collide";

  // Adjust thresholds based on sensitivity
  const walkThreshold = 0.5 - pathSensitivity * 0.4; // 0.1 to 0.5
  const teleportThreshold = 0.5 - pathSensitivity * 0.4;

  if (purple > total * walkThreshold) return "walk";
  if (cyan > total * teleportThreshold && isNearMapEdge(x, y)) return "teleport";
  return "collide";
}

function normalizeMask() {
  const w = maskCanvas.width, h = maskCanvas.height;
  const img = maskCtx.getImageData(0, 0, w, h);
  const d = img.data;
  const original = new Uint8ClampedArray(d);

  // Adjust dilation based on sensitivity
  const dilationRadius = Math.floor(3 + pathSensitivity * 3); // 3-6 pixels

  // First pass: dilate paths
  for (let y = dilationRadius; y < h - dilationRadius; y++) {
    for (let x = dilationRadius; x < w - dilationRadius; x++) {
      const i = (y * w + x) * 4;
      if (original[i + 3] > 100) continue;

      let foundPurple = false, foundCyan = false;

      for (let dy = -dilationRadius; dy <= dilationRadius; dy++) {
        for (let dx = -dilationRadius; dx <= dilationRadius; dx++) {
          const dist = Math.abs(dx) + Math.abs(dy);
          if (dist > dilationRadius) continue;

          const ni = ((y + dy) * w + (x + dx)) * 4;
          const pixel = original.slice(ni, ni + 4);

          if (isPurplePixel(pixel)) {
            foundPurple = true;
          } else if (isCyanPixel(pixel) && isNearMapEdge(x, y)) {
            foundCyan = true;
          }
        }
      }

      if (foundPurple && !foundCyan) {
        d[i] = 128; d[i + 1] = 0; d[i + 2] = 128; d[i + 3] = 255;
      } else if (foundCyan && isNearMapEdge(x, y)) {
        d[i] = 43; d[i + 1] = 250; d[i + 2] = 250; d[i + 3] = 255;
      }
    }
  }

  // Second pass: Bridge gaps if sensitivity is high
  if (pathSensitivity > 0.5) {
    const bridgeDistance = Math.floor(10 + pathSensitivity * 10); // 10-20 pixels

    for (let y = 10; y < h - 10; y++) {
      for (let x = 10; x < w - 10; x++) {
        const i = (y * w + x) * 4;
        if (d[i + 3] > 100) continue;

        // Check for aligned paths to bridge
        let leftPurple = false, rightPurple = false;
        let topPurple = false, bottomPurple = false;

        for (let dist = 1; dist <= bridgeDistance; dist++) {
          if (x - dist >= 0 && isPurplePixel(d.slice(((y) * w + (x - dist)) * 4, ((y) * w + (x - dist)) * 4 + 4))) {
            leftPurple = true;
          }
          if (x + dist < w && isPurplePixel(d.slice(((y) * w + (x + dist)) * 4, ((y) * w + (x + dist)) * 4 + 4))) {
            rightPurple = true;
          }
          if (y - dist >= 0 && isPurplePixel(d.slice(((y - dist) * w + x) * 4, ((y - dist) * w + x) * 4 + 4))) {
            topPurple = true;
          }
          if (y + dist < h && isPurplePixel(d.slice(((y + dist) * w + x) * 4, ((y + dist) * w + x) * 4 + 4))) {
            bottomPurple = true;
          }
        }

        if ((leftPurple && rightPurple) || (topPurple && bottomPurple)) {
          d[i] = 128; d[i + 1] = 0; d[i + 2] = 128; d[i + 3] = 255;
        }
      }
    }
  }

  maskCtx.putImageData(img, 0, 0);
}

function findSpawnPoint(preferCyan = false) {
  const w = maskCanvas.width, h = maskCanvas.height;
  const candidates = [];

  for (let y = 20; y < h - 20; y += 8) {
    for (let x = 20; x < w - 20; x += 8) {
      const zone = sampleMask(x, y);

      if (preferCyan && zone === "teleport" && isNearMapEdge(x, y)) {
        candidates.push({ x, y, priority: 100 });
      } else if (!preferCyan && zone === "walk") {
        const distFromCenter = Math.hypot(x - w/2, y - h/2);
        candidates.push({ x, y, priority: 1000 - distFromCenter });
      } else if (zone === "walk") {
        candidates.push({ x, y, priority: 1 });
      }
    }
  }

  candidates.sort((a, b) => b.priority - a.priority);
  if (candidates.length > 0) {
    return candidates[Math.floor(Math.random() * Math.min(5, candidates.length))];
  }

  return { x: maskCanvas.width / 2, y: maskCanvas.height / 2 };
}

function drawFrame() {
  if (!mapImg) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);

  if (!debugMaskCheckbox.checked) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff0066";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function updateMaskOverlay() {
  if (!maskCanvas.width || !maskImg) return;

  const rect = canvas.getBoundingClientRect();
  const srect = stageWrap.getBoundingClientRect();

  overlayCanvas.style.left = `${rect.left - srect.left}px`;
  overlayCanvas.style.top = `${rect.top - srect.top}px`;
  overlayCanvas.style.width = `${rect.width}px`;
  overlayCanvas.style.height = `${rect.height}px`;

  if (debugMaskCheckbox.checked) {
    overlayCanvas.width = canvas.width;
    overlayCanvas.height = canvas.height;
    overlayCanvas.classList.remove("hidden");

    overlayCtx.clearRect(0, 0, canvas.width, canvas.height);

    overlayCtx.globalAlpha = 0.6;
    overlayCtx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);

    overlayCtx.globalAlpha = 0.4;
    overlayCtx.drawImage(maskCanvas, 0, 0, canvas.width, canvas.height);
    overlayCtx.globalAlpha = 1.0;

    for (let y = 0; y < canvas.height; y += 4) {
      for (let x = 0; x < canvas.width; x += 4) {
        const pixel = maskCtx.getImageData(x, y, 1, 1).data;
        if (isPurplePixel(pixel)) {
          overlayCtx.fillStyle = "rgba(0, 255, 0, 0.8)";
          overlayCtx.fillRect(x - 1, y - 1, 3, 3);
        } else if (isCyanPixel(pixel) && isNearMapEdge(x, y)) {
          overlayCtx.fillStyle = "rgba(0, 255, 255, 1.0)";
          overlayCtx.fillRect(x - 1, y - 1, 3, 3);
        }
      }
    }

    overlayCtx.save();
    overlayCtx.strokeStyle = "#ffff00";
    overlayCtx.lineWidth = 3;
    overlayCtx.beginPath();
    overlayCtx.arc(player.x, player.y, player.r + 5, 0, Math.PI * 2);
    overlayCtx.stroke();

    overlayCtx.fillStyle = "#ffff00";
    overlayCtx.beginPath();
    overlayCtx.arc(player.x, player.y, 5, 0, Math.PI * 2);
    overlayCtx.fill();
    overlayCtx.restore();

    const currentPixel = maskCtx.getImageData(Math.floor(player.x), Math.floor(player.y), 1, 1).data;
    overlayCtx.fillStyle = "#ffffff";
    overlayCtx.font = "12px monospace";
    overlayCtx.fillText(`Pixel: rgb(${currentPixel[0]},${currentPixel[1]},${currentPixel[2]}) a:${currentPixel[3]}`, 10, 20);
    overlayCtx.fillText(`Zone: ${sampleMask(player.x, player.y)} | Sensitivity: ${Math.round(pathSensitivity * 100)}%`, 10, 35);
  } else {
    overlayCanvas.classList.add("hidden");
  }
}

function step(dt) {
  if (dragging && target) {
    const dx = target.x - player.x;
    const dy = target.y - player.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 2) {
      const targetDir = { x: dx / dist, y: dy / dist };
      const smoothing = 0.3;
      dir.x = dir.x * (1 - smoothing) + targetDir.x * smoothing;
      dir.y = dir.y * (1 - smoothing) + targetDir.y * smoothing;

      const dirMag = Math.hypot(dir.x, dir.y) || 1;
      dir.x /= dirMag;
      dir.y /= dirMag;
    } else {
      dir = { x: 0, y: 0 };
    }
  }

  const speed = player.speed * (dt / 1000);
  const moveX = dir.x * speed;
  const moveY = dir.y * speed;

  const nx = player.x + moveX;
  const ny = player.y + moveY;

  const boundedX = Math.max(player.r, Math.min(canvas.width - player.r, nx));
  const boundedY = Math.max(player.r, Math.min(canvas.height - player.r, ny));

  const zone = sampleMask(boundedX, boundedY);

  if (zone === "walk" || zone === "teleport") {
    player.x = boundedX;
    player.y = boundedY;
  } else if (!freeMovementMode) {
    const zoneX = sampleMask(boundedX, player.y);
    const zoneY = sampleMask(player.x, boundedY);

    if (zoneX === "walk" || zoneX === "teleport") {
      player.x = boundedX;
    }
    if (zoneY === "walk" || zoneY === "teleport") {
      player.y = boundedY;
    }
  }

  if (zone === "teleport" && isNearMapEdge(player.x, player.y)) {
    if (!teleportLocked && !isTransitioning) {
      cyanDwellTime += dt;
      if (cyanDwellTime >= 500) {
        goToNextMap();
      }
    }
  } else if (zone === "walk") {
    cyanDwellTime = 0;
    teleportLocked = false;
  }
}

async function goToNextMap() {
  if (isTransitioning || teleportLocked || isDailyLimitHit()) {
    if (isDailyLimitHit()) {
      log("Cannot change map - daily API limit reached");
      setLoading(true, "Rate Limit", "Daily limit reached (20 requests)");
      setTimeout(() => setLoading(false), 3000);
    }
    return;
  }

  isTransitioning = true;
  teleportLocked = true;
  cyanDwellTime = 0;
  running = false;
  regenerationAttempts = 0; // Reset attempts for new transition

  setLoading(true, "Loading next scene…", "Generating new map");

  try {
    previousTheme = currentTheme;
    const theme = getNextTheme(currentTheme, false);
    currentTheme = theme;
    themeLabel.textContent = `Theme: ${currentTheme}`;

    const result = await generateMapAndMask(currentTheme, {
      autoCorrect: autoCorrectCheckbox.checked && regenerationAttempts === 0,
      useCache: false
    });

    if (result.freeMovement) {
      log("Auto-correction limit reached, enabling free movement");
      freeMovementMode = true;
      setLoading(false);
      setTimeout(() => {
        teleportLocked = false;
        isTransitioning = false;
      }, 1000);
      return;
    }

    freeMovementMode = false;
    mapImg = await loadImage(result.mapUrl);
    maskImg = await loadImage(result.maskUrl);

    maskCanvas.width = mapImg.width;
    maskCanvas.height = mapImg.height;
    canvas.width = mapImg.width;
    canvas.height = mapImg.height;

    maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    maskCtx.drawImage(maskImg, 0, 0);

    const hasValidPaths = buildColorClassifier();

    // Only try regeneration once, not in a loop
    if (!hasValidPaths && autoCorrectCheckbox.checked && regenerationAttempts === 0) {
      regenerationAttempts++;
      log("No valid paths detected, trying once more with relaxed detection...");

      // Temporarily increase sensitivity
      const oldSensitivity = pathSensitivity;
      pathSensitivity = Math.min(1.0, pathSensitivity + 0.2);

      // Try to detect paths again with relaxed sensitivity
      const retryValidPaths = buildColorClassifier();

      if (!retryValidPaths) {
        log("Still no paths found. Moving to next theme.");
        pathSensitivity = oldSensitivity;
        // Don't recursively call, just move on
        currentTheme = getNextTheme(currentTheme, false);
        themeLabel.textContent = `Theme: ${currentTheme}`;
      }
    }

    normalizeMask();
    updateMaskOverlay();

    const spawn = findSpawnPoint(true);
    player.x = spawn.x;
    player.y = spawn.y;

    log(`Entered ${currentTheme} at (${Math.round(player.x)}, ${Math.round(player.y)})`);
    setLoading(false);

    setTimeout(() => {
      teleportLocked = false;
      isTransitioning = false;
    }, 2000);
  } catch (error) {
    log(`Map transition failed: ${error.message}`);
    setLoading(false);
    teleportLocked = false;
    isTransitioning = false;
    currentTheme = previousTheme;
  } finally {
    running = true;
  }
}

let last = 0;
function loop(ts) {
  if (!running) return requestAnimationFrame(loop);
  const dt = Math.min(50, ts - last);
  last = ts;
  step(dt);
  drawFrame();
  updateMaskOverlay();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", (e) => {
  const r = canvas.getBoundingClientRect();
  dragging = true;
  target = {
    x: ((e.clientX - r.left) / r.width) * canvas.width,
    y: ((e.clientY - r.top) / r.height) * canvas.height
  };
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (dragging) {
    const r = canvas.getBoundingClientRect();
    target = {
      x: ((e.clientX - r.left) / r.width) * canvas.width,
      y: ((e.clientY - r.top) / r.height) * canvas.height
    };
    e.preventDefault();
  }
});

canvas.addEventListener("pointerup", (e) => {
  dragging = false;
  target = null;
  dir = { x: 0, y: 0 };
  e.preventDefault();
});

window.addEventListener("resize", updateMaskOverlay);
debugMaskCheckbox.addEventListener("change", updateMaskOverlay);
document.getElementById("regenBtn").addEventListener("click", goToNextMap);

initControls({
  onDir: (v) => {
    if (!dragging) {
      dir = v;
    }
  }
});

async function init() {
  setLoading(true, "Preparing first scene…", "Loading initial map");

  try {
    const { mapUrl, maskUrl } = await generateMapAndMask(currentTheme, { initialUseStarter: true });
    mapImg = await loadImage(mapUrl);
    maskImg = await loadImage(maskUrl);

    maskCanvas.width = mapImg.width;
    maskCanvas.height = mapImg.height;
    canvas.width = mapImg.width;
    canvas.height = mapImg.height;

    maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    maskCtx.drawImage(maskImg, 0, 0);
    buildColorClassifier();
    normalizeMask();
    updateMaskOverlay();

    const spawn = findSpawnPoint(false);
    player.x = spawn.x;
    player.y = spawn.y;

    log(`Started at (${Math.round(player.x)}, ${Math.round(player.y)})`);
    themeLabel.textContent = `Theme: ${currentTheme}`;
    setLoading(false);

    setTimeout(() => { teleportLocked = false; }, 1000);
    requestAnimationFrame(loop);
  } catch (error) {
    log(`Init failed: ${error.message}`);
    setLoading(true, "Error", error.message);
  }
}

window.addEventListener('beforeunload', () => {
  clearCache();
});

init();
  </script>
</body>
</html>
